<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/frame-guard.js"></script>
    <meta name="description" content="Subscribe to Junior after your complimentary trial">
    <title>Continue to checkout - Junior</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body data-page="start-checkout">
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="./images/junior-logo.png" alt="Junior Logo" class="logo-img">
                </a>
            </div>
            <ul class="nav-links">
                <div class="nav-actions">
                    <li><a href="portal.html" class="cta-button">My Account</a></li>
                </div>
            </ul>
        </div>
    </nav>

    <section class="portal-container">
        <div class="container">
            <div class="login-section" style="display: flex;">
                <div class="login-card">
                    <h2>Keep Junior after your trial</h2>
                    <p class="login-subtitle">Click below to open secure Stripe checkout. You will not be charged until you complete payment.</p>
                    <div id="checkout-error" class="error-message" style="display: none;"></div>
                    <button type="button" class="primary-button" id="checkout-button">Continue to checkout</button>
                    <div class="login-footer">
                        <p><a href="portal.html">Back to the portal</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Junior. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/start-checkout.js"></script>
</body>
</html>
