    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 112, "slug": "find-hiring-managers-linkedin-without-cold-messaging", "title": "Best Find Hiring Managers On Linkedin Without Cold Messaging Tools Beyond Phantombust", "excerpt": "Learn how to find hiring managers on LinkedIn without cold DMs. Discover warm engagement strategies and safe automation tools beyond Phantombuster.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57emphx2p26k1j3hgj6vzrwa58d7nxj/best-find-hiring-managers-on-linkedin-without-cold-1790266707742-4lx5gp.png", "published_at": "2026-09-24T16:06:00+00:00", "content": "# Best Find Hiring Managers On Linkedin Without Cold Messaging Tools Beyond Phantombust\n\nIf you have ever sent a cold LinkedIn message to a hiring manager, you already know the sinking feeling of the \"Seen\" receipt followed by absolute silence. The typical advice for job seekers, agency founders, and consultants is to bypass the application portal or generic inbox and go straight to the decision-maker. The problem? Every other candidate and sales rep is running the exact same playbook.\n\nHiring managers are buried under an avalanche of automated connection requests, generic \"I noticed your profile\" pitches, and aggressive demands for 15 minutes of their time. Blind outreach is no longer a competitive advantage; it is an annoyance that actively damages your professional brand.\n\nTo find hiring managers on LinkedIn without sending cold messages, you must focus on building visibility and leveraging natural touchpoints. By warming up your presence in their public feed first, you can naturally introduce yourself without relying on intrusive, low-converting direct messages. \n\nThis guide breaks down exactly how to locate the right decision-makers, why legacy automation tools are failing, and how to use context-aware engagement to turn public visibility into direct interviews and pipeline.\n\n![Diagram comparing cold direct messaging against warm public visibility on LinkedIn.](https://assets.bevisible.app/inline-images/j57emphx2p26k1j3hgj6vzrwa58d7nxj/inline-1-1790266660867-gk1y2f.png)\n## The End of the Scraping Era: Why Legacy Tools Are Failing\n\nFor years, the standard operating procedure for scaling LinkedIn outreach relied on cloud-based scraping and messaging platforms. Tools like Phantombuster became wildly popular for their ability to scrape hundreds of profiles from a search result, export them to a spreadsheet, and fire off automated connection requests with templated messages.\n\nWhile this brute-force method worked when LinkedIn inboxes were relatively quiet, the platform has fundamentally changed.\n\nFirst, LinkedIn implemented strict limits on connection requests, capping them at roughly 100 per week. If you rely on a 2% acceptance rate from cold outreach, a maximum of 100 requests severely throttles your pipeline. Second, LinkedIn's security algorithms have become highly adept at detecting cloud-based automation. Because these tools log into your account from distant server IPs and execute actions at superhuman speeds, they frequently trigger account restrictions, shadowbans, or permanent suspensions.\n\nBeyond the technical risks, there is a severe psychological penalty to cold messaging. When a hiring manager receives a cold pitch, their immediate defense mechanisms activate. They do not know you, they did not ask for your message, and you are creating work for them by demanding a response. \n\nThe alternative is transitioning from an outbound interruption model to an inbound visibility model. Instead of forcing your way into a crowded, private inbox, you establish your expertise in the public square where the hiring manager is already spending their time. If you are evaluating how to update your strategy, reviewing [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is a critical first step.\n\n## The \"Warm Intro\" Engagement Strategy\n\nInstead of messaging a hiring manager out of the blue, the most effective approach is to interact with their public activity. The goal is simple: ensure they recognize your name and face before you ever send a formal connection request or mention an open role. \n\nThis strategy leverages a basic psychological principle known as the mere-exposure effect. People tend to develop a preference for things\u2014and people\u2014merely because they are familiar with them. \n\n### Phase 1: Follow, Do Not Connect\n\nWhen you identify a target hiring manager, your first impulse will be to click the \"Connect\" button. Resist this urge. \n\nClicking \"Connect\" forces a binary decision on the recipient: accept or ignore. If they do not know who you are, the default action is to ignore. Instead, navigate to their profile and click \"Follow.\" Following them is a low-friction action. It does not require their approval, but it immediately populates their public posts and activities into your home feed. \n\nIt also sends them a subtle notification: \"[Your Name] is now following you.\" This is your first, entirely passive touchpoint.\n\n### Phase 2: Strategic Observation and Reaction\n\nOnce you are following your targets, monitor their activity. When they share an article, announce a company milestone, or post a thought leadership piece, read it thoroughly. \n\nIn the beginning, stick to lightweight interactions. \"Like\" or \"Celebrate\" their posts. These actions generate notifications on their end, putting your name and headshot in front of them again. You are slowly building a pattern of supportive presence without asking for anything in return.\n\n### Phase 3: The Value-Add Comment\n\nAfter a few lightweight interactions, it is time to escalate to a comment. This is the most critical phase of the warm intro strategy. \n\nA comment is public. It proves you read the post, understood the context, and possess the industry knowledge to add something meaningful to the conversation. However, a generic \"Great post!\" or \"Thanks for sharing!\" does nothing to build your credibility. \n\nYour comment must add value. It should extend their thought, offer a relevant counter-point, or provide an example from your own experience that validates their premise. When a hiring manager sees a thoughtful comment from someone outside their immediate network, they almost always click on that person's profile to see who they are.\n\n![Three-phase warm intro engagement strategy framework for LinkedIn.](https://assets.bevisible.app/inline-images/j57emphx2p26k1j3hgj6vzrwa58d7nxj/inline-2-1790266654883-9p62o8.png)\n## Finding Hiring Managers Who Are Actually Active\n\nThe warm intro strategy relies on one crucial dependency: the hiring manager must be active on LinkedIn. You cannot comment on posts that do not exist. Therefore, your sourcing strategy must shift from simply finding people with the right job title to finding people with the right job title *who also post or engage with content*.\n\n### The \"Hiring Hack\" Content Search\n\nSkip the standard \"People\" search entirely. If you want to bypass cold messaging, use LinkedIn's \"Posts\" search to find decision-makers who are actively discussing open roles or team expansion.\n\n1. Type your target keyword into the main search bar (e.g., \"hiring product marketer\" or \"looking for a backend developer\").\n2. Hit Enter, and then click the **Posts** filter at the top of the screen.\n3. Use the **Sort by** filter and change it from \"Top match\" to \"Latest\" to ensure you are seeing active, current discussions.\n4. Use the **Author company** filter to narrow the results down to your target list of employers.\n\nThis surfaces posts from directors, VPs, and founders who are publicly announcing that they are hiring, effectively bypassing the HR screening layer. As one [secret way to find hiring managers and recruiters](https://www.linkedin.com/posts/nicolefernandez-valle_theres-a-secret-way-to-find-hiring-managers-activity-7374443097557983232-Op3o) reveals, engaging with these specific posts puts you directly in the line of sight of the person making the hiring decision.\n\n### Leveraging Boolean Search for Precision\n\nIf you are targeting a specific department within a known company, Boolean search remains your best tool for pinpointing the right individual. However, instead of searching for them to send a DM, you are searching for them to audit their recent activity.\n\nIf you are looking for a potential referral or decision-maker, try utilizing specific [strategies for reaching out to hiring managers](https://www.linkedin.com/top-content/technology/navigating-tech-layoffs/strategies-for-reaching-out-to-hiring-managers/) by structuring your searches like this:\n*   \u201cDirector of Engineering\u201d AND \u201cStripe\u201d\n*   \u201cVP of Sales\u201d AND \u201cHubSpot\u201d AND \u201cNew York\u201d\n*   (\"Head of Marketing\" OR \"CMO\") AND \"Series B\"\n\nOnce you locate the individual, navigate to their profile, scroll down to their **Activity** section, and click **Show all activity**. If they have not posted in the last 90 days, check their **Comments** tab. Many leaders rarely publish original posts but are highly active in the comment sections of industry peers. You can execute the exact same warm engagement strategy by replying thoughtfully to their comments on other people's posts.\n\n### Utilizing Company Pages and Tagged Recruiters\n\nSometimes, the hiring manager is obscured. A company page might post a job opening, but it does not specify who the role reports to. [Using Company pages to find the hiring manager on LinkedIn](https://www.linkedin.com/pulse/better-way-message-hiring-managers-linkedin-6-hernandez-cpbs-cdcs) is a reliable method for tracking down the right connections.\n\nGo to the company's LinkedIn page, click on the **People** tab, and search for keywords related to the department. If the company posts a role for a Senior UX Designer, search the People tab for \"Design Director\" or \"Head of Product.\"\n\nAdditionally, pay close attention to the comments under official company job postings. Often, team members will tag the hiring manager or the recruiter in charge. [Reach out to the recruiters or managers they tag](https://www.linkedin.com/posts/vnegandhi_are-you-only-using-the-linkedin-job-board-activity-7429902725062074368-deFI) by following them and engaging with their recent activity, rather than immediately dropping a resume in their inbox.\n\n## Moving Beyond Phantombuster: Tools Designed for Authentic Engagement\n\nAs the risks of cloud-based scraping escalate, professionals are turning to automation tools built specifically for the era of social selling and public engagement. This is where tools designed for contextual commenting outshine legacy messaging platforms.\n\nJunior is an AI-powered LinkedIn automation tool engineered to start authentic conversations through strategic post commenting rather than generic spam. Serving job seekers, sales teams, agencies, and founders, it replaces the need for cold DMs entirely. \n\n### Local Execution vs. Cloud Scraping\n\nThe most significant differentiator between modern engagement tools and legacy scrapers is how they access your account. Cloud tools run on remote servers. When a server in AWS logs into your LinkedIn account and views 500 profiles in ten minutes, LinkedIn's security infrastructure flags it immediately. \n\nJunior runs locally on the user's machine. It interacts with the platform using natural interaction patterns, mirroring how a human would scroll, pause, and type. This local execution model protects account safety while still providing the scale needed to build a pipeline. For a deeper understanding of how to protect your profile while automating, review the guidelines for [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### Drafting Context-Aware Replies\n\nFinding the hiring manager's posts is only half the battle; the other half is knowing what to say. Staring at a blank comment box while trying to sound insightful can lead to paralysis, especially when you are trying to impress a senior leader.\n\nJunior finds relevant discussions and drafts context-aware, human-sounding replies based on the user's unique bio and goals. Instead of dropping a templated response, the AI analyzes the nuances of the hiring manager's post and crafts a comment that aligns with your specific expertise. \n\nFor example, if a VP of Product posts about the challenges of transitioning to a four-day workweek, an AI commenting tool configured with your background as an Agile Scrum Master might suggest a comment discussing how modified sprint cadences can maintain velocity during shorter weeks. You maintain final editorial control, ensuring the tone sounds exactly like you before posting.\n\nWhen evaluating your tech stack for this strategy, using an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) ensures you choose a platform that prioritizes nuance over sheer volume.\n\n![Architecture diagram contrasting cloud-based scrapers with safe local AI engagement tools.](https://assets.bevisible.app/inline-images/j57emphx2p26k1j3hgj6vzrwa58d7nxj/inline-3-1790266659643-3b92vg.png)\n## Crafting Comments That Command Attention\n\nThe architecture of a high-converting comment is distinct from a casual social media reply. When your goal is to capture the attention of a hiring manager, your comments must be engineered to demonstrate competence without crossing the line into arrogance or desperate self-promotion.\n\nHere is the framework for a comment that turns public visibility into private conversations.\n\n### 1. The Validation Hook\nStart by acknowledging the core premise of their post. This shows you actually read their content and are not just dropping a disjointed thought to get noticed. \n*   *Weak:* \"Great post about marketing.\"\n*   *Strong:* \"You highlighted the exact reason most B2B attribution models fail in the first 90 days.\"\n\n### 2. The Nuanced Addition\nIntroduce a new variable, a specific framework, or an edge case that they did not cover. This is where you demonstrate your expertise.\n*   *Example:* \"While first-touch attribution gives sales the initial signal, I've found that layering in intent data for the mid-funnel content provides a much clearer picture of what actually closed the deal.\"\n\n### 3. The Evidence (Optional but Powerful)\nIf you have a quick metric or real-world example, include it to ground your claim in reality.\n*   *Example:* \"We implemented a similar feedback loop last quarter and saw sales cycle length drop by 15%.\"\n\n### 4. The Open Question\nEnd the comment by inviting a response. Do not ask for a job. Ask a question about their perspective. This encourages the hiring manager to reply to your comment, further cementing the relationship.\n*   *Example:* \"Curious if your team is seeing similar velocity improvements since restructuring?\"\n\nThis framework prevents you from sounding like a sycophant and positions you as a peer. If you are struggling to consistently generate these types of responses, exploring the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) can help streamline the ideation process.\n\n## A Real-World Scenario: Landing the Interview Without a Resume\n\nTo understand how this functions in practice, consider the case of a fractional marketing consultant looking to secure retainer contracts with Series A SaaS companies. \n\nInstead of sending 500 cold DMs using a cloud scraper, the consultant used local automation to identify CEOs and VPs of Marketing who were actively posting about customer acquisition costs (CAC). \n\nThe consultant set up their tool to find these specific discussions. Over the course of a week, the tool surfaced a post from a target CEO complaining about rising ad costs on major platforms. The consultant, using their AI-assisted drafting tool, left a thoughtful, 3-sentence comment detailing a counter-intuitive approach to leveraging organic community growth to offset paid CAC.\n\nThe result? The CEO replied to the comment within two hours. The next morning, the CEO sent an inbound connection request. Because the context was already established, the consultant accepted the request and sent a simple follow-up message: *\"Thanks for connecting. Loved the back-and-forth on community growth yesterday. If you're ever looking to brainstorm how to structure that for your current acquisition model, happy to chat.\"*\n\nNo resume attached. No aggressive pitch. No scraping. Just a natural transition from public visibility to a booked discovery call.\n\n## The Perfect Connection Request (When the Time is Right)\n\nThe warm engagement strategy does eventually culminate in a connection request. However, because you have laid the groundwork, this request is no longer cold.\n\nAfter a week or two of consistent, high-value engagement on a hiring manager's posts, you have earned the right to enter their inbox. [If a hiring manager is sharing a role, send them a thoughtful connection request with a message](https://www.linkedin.com/top-content/recruitment-hr/maximizing-your-linkedin-presence/how-to-connect-with-hiring-managers-on-linkedin/). \n\nYour connection note should explicitly reference the engagement that just took place. It bridges the gap between the public square and the private channel.\n\n**The \"Contextual Fan\" Template:**\n> \"Hi [Name], I've really enjoyed engaging with your recent posts, especially your perspective on [Specific Topic]. I love the direction your team is taking. I'm following your work closely and would love to formally connect.\"\n\n**The \"Open Role\" Transition Template:**\n> \"Hi [Name], great back-and-forth on your post about [Topic] this morning. I also saw you're expanding the design team. Given my background in [Specific Skill], I'd love to follow along as you scale. Happy to connect.\"\n\nNotice that neither of these templates asks for an interview right away. They ask for the connection based on shared professional interests. Once they accept, they are in your network. Now, when *you* post content demonstrating your expertise, it shows up in *their* feed. You have effectively reversed the dynamic.\n\n![Breakdown of a high-converting warm LinkedIn connection request note.](https://assets.bevisible.app/inline-images/j57emphx2p26k1j3hgj6vzrwa58d7nxj/inline-4-1790266657826-megi1n.png)\n## Myth-Busting: \"Hiring Managers Are Too Busy to Read Comments\"\n\nA common objection to the engagement strategy is the assumption that senior decision-makers are too busy to monitor their LinkedIn notifications or read the comment section. This assumption fundamentally misunderstands human psychology and creator behavior on social platforms.\n\nWhen a professional\u2014whether a startup founder or an enterprise VP\u2014takes the time to draft a post, format it, and publish it to their network, they care deeply about how it performs. The notification bell is a powerful dopamine trigger. They may ignore 50 generic connection requests because processing those requires mental labor. But they will almost certainly read a thoughtful, multi-sentence comment on a post they wrote, because it provides validation.\n\nFurthermore, LinkedIn's algorithm heavily prioritizes content that generates conversation in the comments. A hiring manager who actively posts on LinkedIn *wants* comments because it expands their own reach. By providing high-quality replies, you are actually doing them a favor by boosting their content's visibility. You are providing value before extracting it.\n\n## Scaling the Strategy: Workflows for Different Goals\n\nFinding hiring managers without cold messaging is a universal strategy, but the daily workflow looks different depending on whether you are looking for a single full-time role or trying to fill an agency pipeline.\n\n### The Job Seeker Workflow\nJob seekers should focus on deep, targeted engagement. Your total addressable market is relatively small\u2014perhaps 20 to 30 target companies at any given time.\n*   **Daily Target:** Find and engage with 3-5 hiring managers at your top target companies.\n*   **Tooling:** Use boolean searches to find department heads. Manually follow them. Use a localized tool to help draft highly specific comments when they post.\n*   **Patience Level:** High. You may need to engage for 2-3 weeks before sending a connection request to ensure they recognize your name when an opening actually becomes available.\n\n### The Agency / Consultant Workflow\nSales teams, lead gen agencies, and consultants need more volume. While you cannot sacrifice the quality of the comment, you must increase the surface area of your engagement.\n*   **Daily Target:** Engage with 15-25 decision-makers within your ideal customer profile (ICP).\n*   **Tooling:** An AI-powered commenting tool is mandatory here. Manually finding 25 relevant posts and writing 25 nuanced comments daily will lead to burnout. Configure your local automation to surface posts containing specific pain-point keywords, review the AI-drafted replies, approve them, and move on.\n*   **Patience Level:** Medium. The goal is to drive profile views. When 25 decision-makers see your brilliant comment, 5 of them will view your profile. If your profile is optimized as a landing page for your services, 1 or 2 will send an inbound connection request.\n\n### Defining Success Metrics\nWhen you abandon cold messaging, you must also abandon the metrics associated with it. Stop tracking \"messages sent\" and \"open rates.\" \n\nInstead, track these three indicators of public visibility working:\n1.  **Profile Views:** Are the hiring managers you are commenting on clicking through to see who you are?\n2.  **Inbound Connection Requests:** Are decision-makers asking to connect with *you* after seeing your insights?\n3.  **Comment Engagement:** Are the authors replying back to your comments and validating your points?\n\nWhen these metrics start trending upward, interviews and client conversations naturally follow.\n\n## Frequently Asked Questions\n\n### How long does the warm engagement strategy take before I can ask for an interview?\nThere is no fixed timeline, but a good rule of thumb is a minimum of three meaningful public interactions before moving to a private message. This usually spans 7 to 14 days. If the hiring manager posts a direct link to a job opening, you can accelerate this timeline by commenting on that specific post, stating your interest, and immediately following up with a contextual connection request.\n\n### Is it safe to use AI tools for LinkedIn commenting?\nThe safety of the tool depends entirely on its architecture. Cloud-based tools that rely on scraped data and server-side logins are highly risky and frequently trigger LinkedIn's security bans. Tools that run locally on your machine, respect platform limits, and keep a human in the loop for final editorial approval (like Junior) are vastly safer. They mimic natural human behavior rather than bot activity.\n\n### What if the hiring manager doesn't post on LinkedIn at all?\nMany senior leaders are \"lurkers\"\u2014they log in, read content, but rarely publish original posts. In these cases, check their \"Comments\" activity tab to see whose posts they are interacting with. If they are silent entirely, shift your focus to other visible members of the team. Engaging with a Senior Contributor or a peer on the target team can lead to an internal referral, which is often more powerful than reaching the hiring manager directly. \n\n### Why is this better than an InMail?\nLinkedIn InMails cost money, are clearly marked as sponsored or premium outreach, and land in a separate, often-ignored tab in a busy manager's inbox. They scream \"I am pitching you.\" A comment on a post is native, organic, and demonstrates immediate intellectual value without feeling like a sales transaction.\n\n## The Future of LinkedIn Networking\n\nThe era of blasting thousands of generic messages into the void is over. As platforms become stricter and professionals become more protective of their digital boundaries, the advantage goes to those who can demonstrate value in the public square.\n\nFinding hiring managers on LinkedIn without cold messaging requires a shift in mindset. You must stop viewing LinkedIn as a rolodex to be extracted from, and start viewing it as a conference where you need to participate in the conversation. By leveraging local, context-aware automation to scale your visibility, you can bypass the crowded inbox entirely, turning thoughtful comments into warm introductions, and transforming public presence into a reliable pipeline of career opportunities.", "created_at": "2026-09-24T16:19:27.178613+00:00", "updated_at": "2026-09-24T16:19:27.178621+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
