    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 103, "slug": "aware-alternatives-reply-to-linkedin-posts-in-my-voice", "title": "Aware Alternatives for Automated Ways to Reply to Linkedin Posts in My Voice", "excerpt": "Explore top Aware alternatives to automate LinkedIn replies in your authentic voice safely without generic AI comments or account ban risks.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5769fqmr39ssqfzp0f7312gw98d667g/aware-alternatives-for-automated-ways-to-reply-to-1789402728767-luqilf.png", "published_at": "2026-09-14T15:59:00+00:00", "content": "# Aware Alternatives for Automated Ways to Reply to Linkedin Posts in My Voice\n\nScroll through your LinkedIn feed for five minutes, and you will almost certainly spot them: the robotic, perfectly punctuated, utterly soulless AI comments. They usually start with words like \"Insightful!\" or \"I completely agree with this perspective,\" followed by a regurgitated summary of the original post and a trailing string of generic emojis. \n\nFor professionals trying to build an audience or generate leads, these comments are worse than useless. They are active brand liabilities. When a prospect reads a clearly automated comment under their post, they do not think you are efficient; they think you are lazy. \n\nYet, the core problem remains: engaging manually with dozens of targeted accounts every day takes hours you likely do not have. You know that strategic commenting is one of the highest-leverage activities on the platform. It bypasses crowded, spam-filled direct message inboxes and places your insights in front of a public audience. But doing it at scale requires leverage. \n\nThe market has responded with a flood of engagement tools like Aware, designed to streamline your LinkedIn commenting and feed interaction. However, as users become more sophisticated, they are hitting the hard limits of first-generation cloud tools. They want automated ways to reply to LinkedIn posts in their voice\u2014not a generic AI's voice\u2014and they want to do it without risking a permanent account ban.\n\nIf you are looking for a safer, more authentic way to turn public visibility into direct interviews, pipeline, and client conversations, you need to rethink your automation stack. This guide explores the mechanics of AI voice matching, the hidden dangers of cloud-based engagement, and the best alternatives to Aware for context-aware, human-sounding replies.\n\n## The Problem with Generic LinkedIn Automation\n\nBefore looking at the alternatives, it is critical to understand why so many professionals are migrating away from early-generation automation platforms. The issues generally fall into two categories: algorithmic safety and contextual failure.\n\n### The Cloud-Based IP Risk\n\nMany legacy engagement tools and Chrome extensions operate through cloud-based servers. When you connect your LinkedIn account to a cloud tool, that software logs into your account from a data center IP address (often AWS, Google Cloud, or DigitalOcean). \n\nLinkedIn's security algorithms are hyper-tuned to detect this behavior. If you are browsing LinkedIn from your residential Wi-Fi in Chicago, and simultaneously a server in Virginia is firing off comments on your behalf, the platform instantly flags the geographic and IP discrepancy. This is a massive risk. LinkedIn actively combats automated cloud activity, frequently issuing warnings, forcing logouts, or permanently restricting accounts. For a founder or a sales team relying on LinkedIn for revenue, an account ban is a catastrophic failure.\n\n![Diagram comparing cloud server IP risks against safe local browser execution for LinkedIn automation.](https://assets.bevisible.app/inline-images/j5769fqmr39ssqfzp0f7312gw98d667g/inline-1-1789402671626-fab5ak.png)\n### The Context and \"Voice\" Deficit\n\nThe second major issue is the quality of the output. Most basic automation tools use generic prompts sent to an LLM (Large Language Model) like OpenAI's GPT-3.5 or GPT-4. The prompt typically looks something like: *\"Read this post and write a positive, professional comment.\"*\n\nThe result is exactly what you would expect: safe, boring, and fundamentally un-human. [AI-powered comment tools can do more than mimic engagement\u2014they can read the context of a post, extract relevant themes, and generate tailored responses](https://www.joinvalley.co/blog/automate-linkedin-comments-strategies), but only if they are engineered correctly. \n\nA generic tool does not know your background. It does not know that you are a sarcastic SaaS founder who hates corporate jargon, or a deeply analytical job seeker who loves referencing specific data points. It lacks your unique bio, your overarching goals, and your specific opinions on industry trends. Without this contextual grounding, the AI defaults to the mean. It sounds like everyone else, which defeats the entire purpose of commenting to stand out.\n\n## How AI Actually Learns Your \"Voice\" for LinkedIn\n\nIf you want automated ways to reply to LinkedIn posts in your voice, you cannot rely on an off-the-shelf prompt. True voice matching requires a tool that allows for deep personalization and contextual grounding.\n\n### Deconstructing Your Professional Tone\n\nVoice is not just about vocabulary; it is about syntax, pacing, and stance. When evaluating [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), you need a system that allows you to define these parameters clearly.\n\nA well-trained AI engagement agent should know:\n*   **Your Stance:** Do you generally agree with industry consensus, or do you play the contrarian?\n*   **Your Formatting:** Do you use bullet points? Do you hate emojis? Do you prefer lowercase letters for a casual feel, or strict AP style?\n*   **Your Expertise:** If someone posts about marketing, does the AI know to filter that through your specific lens as a B2B product marketer in the healthcare space?\n*   **Your Vocabulary Limits:** Words you would never use (e.g., \"synergy,\" \"unlock,\" \"delve\").\n\n### The Workflow: Writing, Training, and Polishing\n\nThe best approach to developing your automated voice involves an iterative process. According to experts, a highly effective method is to [write your idea first in your own words, then use AI to organize and polish the message](https://www.linkedin.com/pulse/using-ai-support-your-linkedin-posts-without-losing-snipes-ph-d--cm3ce). \n\nWhen configuring a smart alternative to Aware, you will often feed the tool a dozen examples of comments you have written manually. The LLM analyzes these examples to map your sentence structure and tone. Instead of telling the AI \"be professional,\" you instruct it to \"use short, declarative sentences, ask one probing question at the end, and reference my background in technical recruiting.\"\n\n## Top Aware Alternatives for Voice-Matched Automation\n\nIf you are graduating from generic engagement tools, the market currently offers several distinct categories of automation. Choosing the right one depends heavily on your risk tolerance, your need for personalization, and your daily volume.\n\n### 1. Junior: The Local, Context-Aware AI Agent\n\nFor professionals who prioritize account safety and authentic conversation over sheer volume, Junior represents a fundamental shift in how LinkedIn automation operates. It is built specifically to solve the \"in my voice\" problem while completely sidestepping the dangers of cloud-based execution.\n\n**How it works:**\nUnlike cloud platforms, Junior runs locally on your own machine. It uses your actual browser profile and your residential or office IP address. To LinkedIn's security algorithms, Junior's actions look exactly like human interaction patterns because they originate from the exact same environment you use for manual browsing. This local-first architecture makes it a cornerstone of [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n**The Voice Engine:**\nJunior is designed to replace cold DMs by finding relevant discussions and drafting context-aware replies based entirely on your unique bio and goals. You do not just feed it a generic prompt. You give Junior your professional context\u2014who you are, what you sell, who you want to hire, or what kind of job you are looking for. \n\nWhen it finds a relevant post, it drafts a reply that integrates the post's context with your specific expertise. It does not blindly auto-post; it drafts high-quality, human-sounding replies for your review, ensuring that every comment genuinely reflects your perspective before it goes live. This makes it an exceptionally powerful tool for job seekers looking to catch a hiring manager's eye, or founders wanting to build authority without spending four hours a day typing.\n\n### 2. Taplio and Supergrow: The Content-First Suites\n\nTools like Taplio and Supergrow are comprehensive LinkedIn growth suites. While their primary strength lies in content scheduling and analytics, they also include engagement features designed as Aware alternatives.\n\n**The Approach:**\nThese platforms allow you to curate lists of creators or import LinkedIn URLs, bringing a feed of targeted posts into a single dashboard. From there, you can use built-in AI generators to draft replies.\n\n**The Trade-offs:**\nWhile highly convenient for content creators who want an all-in-one dashboard, their engagement features are often secondary to their scheduling capabilities. Because they are cloud-based, there is an inherent ceiling on how aggressively you can automate without triggering LinkedIn's security flags. For a deeper look at how a focused engagement tool compares to a broad suite, review this breakdown of [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth). \n\nIf you decide to go the suite route, it is worth exploring the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) to ensure you are getting the most advanced voice-matching capabilities available in a cloud environment.\n\n### 3. PhantomBuster and Dux-Soup: The Heavy Automators\n\nAt the other end of the spectrum are tools designed for high-volume data scraping and aggressive connection automation. \n\n**The Approach:**\nPhantomBuster and Dux-Soup are incredibly powerful technical tools. They can scrape entire LinkedIn event attendee lists, auto-visit thousands of profiles, and inject automated comments based on complex workflows you build yourself. \n\n**The Trade-offs:**\nThese are not inherently \"voice-matching\" tools. To get them to reply in your voice, you have to build custom integrations connecting their APIs to an external LLM like ChatGPT, write complex system prompts, and handle the webhooks yourself. Furthermore, because these tools operate at a massive scale and often utilize cloud execution or heavy DOM manipulation, they carry the highest risk of account restriction. \n\nIf you are currently running complex, risky scripts and want to pivot to a safer, engagement-focused strategy, exploring [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is a critical next step.\n\n## Engineering the Perfect Automation Workflow\n\nKnowing the tools is only half the battle. Executing an automated engagement strategy that actually drives revenue or career growth requires a precise workflow. \n\n### Step 1: Sourcing the Right Conversations\n\nThe best AI-generated comment in the world is useless if it is posted on an irrelevant thread. Your first task is feeding your automation tool the right data. \n\nDo not just target massive influencers with millions of followers. If you comment on a post with 4,000 other comments, your voice is drowned out regardless of how authentic it sounds. Instead, target:\n*   **Prospects:** The actual decision-makers you want to sell to.\n*   **Industry Peers:** People with 5,000 to 20,000 followers who get strong engagement but whose comment sections are still readable.\n*   **Trigger Events:** Posts discussing specific pain points your software or service solves.\n\nTo optimize this targeting, you can leverage the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### Step 2: Defining the Persona Prompt\n\nWhen setting up your AI agent, be exhaustively detailed in your persona prompt. A weak prompt looks like this:\n*\"You are a B2B sales expert. Write a professional comment.\"*\n\nA strong, voice-matched prompt looks like this:\n*\"You are an enterprise SaaS account executive with 10 years of experience. You believe that outbound sales is becoming too automated and prefer relationship-led growth. Read the provided LinkedIn post. Draft a 2-3 sentence comment that adds one piece of original insight related to relationship building. Do not summarize the post. Do not use emojis. Use a conversational but direct tone, similar to how you would speak to a respected colleague on a Zoom call. Never use the words 'delve', 'unlock', or 'crucial'.\"*\n\n### Step 3: The Human-in-the-Loop Review\n\nThis is perhaps the most important concept in modern social automation. You should almost never allow an AI to publish a comment without your eyes on it first. \n\nAdvanced workflows incorporate what is known as a human review step. For example, some creators set up systems to [receive a message, isolate the intent, and hold the AI-drafted reply for human approval before sending](https://www.youtube.com/watch?v=g_F73DT2S18&t=560). \n\nTools like Junior are built around this exact philosophy. The software runs locally, finds the posts, and drafts the replies in your voice. But instead of blindly firing them off, it presents them to you in a streamlined interface. You spend five minutes reviewing, lightly editing if necessary, and approving the comments. This gives you the scale of automation with the absolute safety and quality control of manual engagement.\n\n![Four-step workflow diagram illustrating the human-in-the-loop review process for automated LinkedIn replies.](https://assets.bevisible.app/inline-images/j5769fqmr39ssqfzp0f7312gw98d667g/inline-2-1789402678484-1g78gz.png)\n## A Mini-Scenario: Finding Clients Without Spam\n\nConsider the case of Marcus, an independent management consultant. For months, he used a traditional, cloud-based LinkedIn automation tool to send 50 automated connection requests and generic cold DMs every day. His acceptance rate plummeted to 12%, and his reply rate was virtually zero. His prospects' inboxes were simply too crowded.\n\nMarcus decided to pivot. He uninstalled the mass-DM tool and deployed a local, voice-trained AI agent. Instead of blasting cold messages, he loaded a list of 100 target CEOs and founders into the tool. \n\nEvery morning, the AI scanned his target list to see who had posted recently. It drafted highly contextual, thoughtful comments based on Marcus's specific consulting methodology. Marcus would sit down with his coffee, review the 10-15 drafted comments, tweak a few words, and hit approve. \n\nWithin two weeks, the dynamic changed completely. Because his comments added genuine value and sounded entirely human, the targeted CEOs started replying to his comments publicly. More importantly, they started visiting his profile and sending *him* inbound connection requests. By shifting from a push strategy (cold DMs) to a pull strategy (highly targeted, automated public commenting), Marcus booked three discovery calls in a month without sending a single cold message. \n\nThis transition from outbound spam to inbound engagement is detailed further in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## The Myth of \"Set It and Forget It\" Commenting\n\nAs you explore automated ways to reply to LinkedIn posts in your voice, you must confront an uncomfortable truth: pure \"set it and forget it\" commenting is a myth sold by marketers, not a reality for practitioners. \n\nThere are edge cases that AI simply cannot navigate safely without boundaries. Consider the following scenarios:\n*   A prospect posts a deeply personal story about a family illness. A purely automated AI, scanning for keywords, might mistakenly identify it as a post about \"resilience in leadership\" and drop a tone-deaf comment about business growth.\n*   A competitor posts a new product launch. You do not want your AI automatically congratulating them and boosting their visibility to your audience.\n*   A user posts a sarcastic or ironic complaint about an industry trend. AI notoriously struggles with irony and might respond completely straight-faced, making you look foolish.\n\nThis is why the local, review-driven model is vastly superior to cloud-based auto-posting. By acting as the final editor, you catch these edge cases instantly. You get 95% of the heavy lifting done by the AI\u2014the context gathering, the blank-page drafting, the voice matching\u2014but you retain 100% of the executive control over your brand.\n\n## Key Considerations When Evaluating Tools\n\nWhen looking for the best alternatives to Aware or similar platforms, you should judge them against a strict set of criteria. To dive deeper into these metrics, use the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist). \n\n| Feature | Cloud-Based Suites (e.g., Aware) | Scrapers (e.g., PhantomBuster) | Local AI Agents (e.g., Junior) |\n| :--- | :--- | :--- | :--- |\n| **Execution Environment** | Cloud Data Centers | Cloud or Desktop App | Local Browser Profile |\n| **IP Ban Risk** | High (Data center IPs flagged) | Very High (Bot behavior) | Low (Uses your local IP) |\n| **Voice Training** | Basic (General Prompts) | Complex (Requires API skills) | Deep (Bio/Goal integrated) |\n| **Workflow Focus** | Content Scheduling & Analytics | Data Extraction & Mass Volume | Authentic Conversations |\n| **Human-in-the-loop** | Sometimes (Often auto-posts) | Rarely (Built for full automation) | Yes (Core to the workflow) |\n\n## Moving Beyond \"Best Practices\"\n\nMost LinkedIn advice focuses on generic best practices: post three times a week, use hooks, engage for 15 minutes before you post. But as the platform becomes increasingly saturated with AI-generated fluff, standard best practices are no longer enough to differentiate yourself.\n\nYou need a strategy that leverages automation for efficiency without sacrificing the nuance that actually builds trust. \n\n### Stop Relying on ChatGPT Default Interfaces\n\nMany users try to build their own commenting system by copying a LinkedIn post, opening a new tab, pasting it into the standard ChatGPT interface, copying the output, and pasting it back into LinkedIn. \n\nNot only is this incredibly slow and tedious, but it also strips the AI of the necessary ongoing context. Every time you open a new chat, the AI forgets who you are. Purpose-built engagement tools hold your persona in their system architecture, applying it consistently across hundreds of interactions without you having to re-explain your professional background every time.\n\n### Measure Engagement Quality over Quantity\n\nWhen you transition to a voice-matched automation tool, you must change how you measure success. The goal is no longer to leave 100 comments a day. The goal is to leave 20 comments a day that are so insightful and contextually accurate that they trigger profile views and direct messages.\n\nIf you are a job seeker, a thoughtful comment on a hiring manager's post about industry trends is worth infinitely more than an \"Easy Apply\" click. If you are an agency owner, a nuanced reply to a CMO's post about marketing budget constraints will open more doors than a cold email pitch.\n\n## Frequently Asked Questions\n\n### Can LinkedIn detect if an AI wrote my comment?\nLinkedIn cannot easily detect the *text* of an AI-generated comment if it is written in a highly customized, human-sounding voice. However, LinkedIn *can* easily detect the *method* of posting. If the comment is pushed via a data center IP address or via unauthorized DOM manipulation in the background, their security systems will flag it. This is why local execution tools are significantly safer than cloud-based alternatives.\n\n### How do I prevent my automated comments from sounding repetitive?\nThe key is dynamic prompting and deep contextual grounding. Do not instruct the AI to \"be supportive.\" Instruct it to extract one specific argument from the original post, validate it, and add an adjacent thought based on your specific professional bio. By forcing the AI to anchor its reply to the unique content of every individual post, you eliminate repetitive \"Great post!\" style responses.\n\n### Is it really possible to automate replies without losing my unique tone?\nYes, but it requires upfront work. You cannot plug in a tool, click \"go,\" and expect magic. You must spend time configuring your persona, providing examples of your past writing, and explicitly telling the system what words and structures to avoid. When paired with a human-in-the-loop review process, the final output will be indistinguishable from your manual writing.\n\n![Notebook checklist showing custom voice parameters and banned vocabulary for AI LinkedIn commenting.](https://assets.bevisible.app/inline-images/j5769fqmr39ssqfzp0f7312gw98d667g/inline-3-1789402677547-orhkw1.png)\n## The Future of LinkedIn Engagement\n\nAs we look toward the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) and beyond, the divide between obvious automation and authentic leverage will only grow wider.\n\nThe era of spamming crowded inboxes and dropping robotic comments on hundreds of posts is ending. Professionals are tired of reading them, and the platform's algorithms are increasingly punishing the accounts that post them. \n\nThe future belongs to those who use AI not to replace their voice, but to scale it safely. By stepping away from legacy, cloud-based tools like Aware and moving toward local, context-aware platforms, you can bypass the noise. You can spend your time reviewing high-quality drafts rather than typing them from scratch, allowing you to turn public visibility into real, revenue-generating conversations without ever sacrificing your authenticity.", "created_at": "2026-09-14T16:19:26.156143+00:00", "updated_at": "2026-09-14T16:19:26.156152+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
