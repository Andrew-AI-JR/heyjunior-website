    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 94, "slug": "dripify-alternatives-career-coach-networking-tools", "title": "Dripify Alternatives for Tools for Career Coaches to Help Candidates Network", "excerpt": "Discover safe, high-impact Dripify alternatives for career coaches. Help candidates build authentic networks, gain visibility, and protect LinkedIn accounts.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57cchjrnhrbznapp4dh7dc9e58d7yjx/dripify-alternatives-for-tools-for-career-coaches-1788623319684-jxm3vt.png", "published_at": "2026-09-05T15:45:00+00:00", "content": "# Dripify Alternatives for Tools for Career Coaches to Help Candidates Network\n\nHelping candidates build relationships is arguably the highest-leverage activity a career coach can facilitate. Yet, it is consistently the area where job seekers experience the most intense friction, anxiety, and inertia. \n\nTell a candidate to \"go network,\" and you will likely be met with a blank stare or deep apprehension. Tell them to send fifty cold LinkedIn connection requests, and they feel like a nuisance. To solve this volume problem, many coaches and bootcamps previously pointed candidates toward automated outreach platforms like Dripify. \n\nThe logic seemed sound: if networking is a numbers game, automate the numbers. But treating candidate networking like B2B outbound sales is a fundamental error. Dripify and similar tools are built for sales development representatives pushing software, not job seekers trying to build authentic professional relationships. When candidates use aggressive, cloud-based messaging automation, they end up blasting generic pitches into crowded inboxes, burning potential bridges, and risking permanent LinkedIn account restrictions right when they need their profiles the most.\n\nTo help candidates build a systematic, less intimidating networking engine, modern career coaches are abandoning brute-force messaging. Instead, they are assembling a stack of tools focused on targeting, deep personalization, and strategic public visibility.\n\n![Diagram comparing traditional cold DM outreach with a modern three-phase candidate networking strategy.](https://assets.bevisible.app/inline-images/j57cchjrnhrbznapp4dh7dc9e58d7yjx/inline-1-1788623258628-f5hy01.png)\nHere is a comprehensive guide to building a modern candidate networking stack, exploring why traditional automation fails job seekers, and examining the best Dripify alternatives for tools for career coaches to help candidates network.\n\n## The Flawed Premise of B2B Automation in Career Coaching\n\nBefore replacing a tool, it helps to understand exactly why it is failing your clients. Traditional LinkedIn automation tools operate on a specific set of assumptions that do not apply to the job search.\n\n### The \"Numbers Game\" Fallacy\nSales tools assume a conversion rate. If you send 1,000 automated direct messages (DMs) and get a 1% meeting rate, you have 10 new prospects. For a software company, that is a win. For a job seeker, blasting 1,000 hiring managers with a generic \"I noticed your profile and would love to connect\" script looks desperate. It trains candidates to value volume over relevance, leading to high rejection rates that quickly destroy their confidence and momentum.\n\n### The Crowded Inbox Problem\nHiring managers, internal recruiters, and department leads receive dozens of cold LinkedIn DMs daily. The standard \"I recently applied for the Project Manager role and would love to chat\" message blends into a wall of identical requests. Even if a Dripify sequence successfully delivers the message, the recipient has zero incentive to reply to a stranger asking for their time without offering any prior value or context.\n\n### The Account Safety Threat\nPlatforms that run in the cloud and execute actions simultaneously across multiple tabs trigger LinkedIn\u2019s automated defense mechanisms. For a B2B sales agency, losing a burner LinkedIn account is a cost of doing business. For your candidate, having their primary professional identity restricted during an active job hunt is catastrophic. Transitioning to safer engagement methods is non-negotiable, a topic we cover in our [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) guide.\n\n## The Modern Candidate Networking Methodology\n\nIf automated cold DMs are out, what replaces them? \n\nEffective career coaching now relies on a phased approach that lowers the barrier to entry for the candidate while maximizing the authenticity of the interaction. The phases are:\n\n1.  **Targeting & Discovery:** Finding the exact individuals who are most likely to be receptive to a conversation.\n2.  **Intelligence & Personalization:** Gathering context to ensure the candidate has something highly specific to say.\n3.  **Visibility & Engagement:** Interacting with the target in a low-pressure, high-value way before ever asking for a favor.\n\nLet us break down the specific tools that facilitate each phase, serving as a complete alternative ecosystem to outdated messaging automation.\n\n## Phase 1: Targeting & Discovery Tools\n\nBefore a candidate can interact, they need a highly refined list of people to talk to. Blindly searching job titles on LinkedIn yields overly broad results.\n\n### The LinkedIn Alumni Tool\nThis remains the single most underutilized free feature on the platform, and it should be the foundational tool in your coaching practice. \n\nTeach your candidates to navigate to their university or college\u2019s LinkedIn page, click on the \"Alumni\" tab, and utilize the filters. They can filter by geographic location, the company they currently work for, and what they do. \n\nThe shared alma mater provides a built-in, low-friction connection point. A candidate reaching out to a fellow alum isn't a \"stranger asking for a job\"; they are a \"fellow graduate looking for industry insights.\" This subtle psychological shift drastically reduces candidate anxiety and significantly increases response rates. \n\n### Apollo.io and RocketReach\nWhile LinkedIn is the primary hub for professional networking, relying solely on the platform's messaging system is a mistake, especially for reaching senior leadership who may rarely check LinkedIn messages. \n\nWhen a candidate identifies a high-value contact\u2014perhaps a VP of Product at a target company\u2014moving the conversation to email often yields better results. Tools like Apollo.io and RocketReach allow candidates to find verified professional email addresses. You can coach candidates to use these platforms on a freemium basis to build highly targeted lists of 10 to 20 key decision-makers, keeping the focus on quality rather than the spray-and-pray volume typical of sales campaigns.\n\n## Phase 2: Intelligence and AI-Assisted Personalization\n\nMost candidates fail at networking because they do not know what to say. Their outreach feels generic because they lack the research skills or the time to deeply analyze a target's background. AI tools excel at closing this gap.\n\n### ChatGPT and Claude for Outreach Roleplay\nGenerative AI models are excellent coaching assistants for interactive roleplay and message drafting. Instead of giving a candidate a static, fill-in-the-blank networking template (which will inevitably sound robotic), teach them to use AI as a synthesis engine.\n\nHave your candidate copy the text from their target's LinkedIn profile and paste it into Claude or ChatGPT with a specific prompt: \n\n*\"I am a junior UX designer transitioning from a career in teaching. I want to ask this person for a 15-minute informational interview. Based on their background, generate three distinct, hyper-personalized 100-word outreach angles I could use. Do not ask for a job. Focus on a specific aspect of their career trajectory that I can learn from.\"*\n\nThis exercise forces the candidate to think critically about the person they are contacting, generating angles they likely would not have considered, and ensuring the final message is highly tailored.\n\n### Whali and Perplexity for Deep Research\nFor high-stakes networking\u2014like preparing to engage with a startup founder or a department head\u2014candidates need context beyond a LinkedIn bio. \n\nPerplexity acts as an AI-powered research engine, summarizing recent company news, product launches, or industry challenges specific to the target organization. Whali is a platform built specifically for professional career outreach, using AI to scan professional profiles and write highly personalized networking emails referencing shared backgrounds. \n\nWhen a candidate can say, \"I saw your company recently shifted its supply chain model, and I'm fascinated by how your team handled the logistics,\" they instantly separate themselves from the hundreds of generic \"let's connect\" messages in the target's inbox.\n\n## Phase 3: Visibility and Engagement (The True Dripify Alternative)\n\nThis is where the most significant shift in candidate networking occurs. \n\nIf Dripify represents the old model of \"pushing\" yourself into someone's direct messages, modern engagement tools represent the new model of \"pulling\" attention toward the candidate's profile. \n\nThe most effective way to build a relationship with a hiring manager or an industry leader is not to demand their time in a private message, but to add value to their public conversations. \n\n### The Power of Strategic Commenting\nWhen a hiring manager posts an insight on LinkedIn, they want validation. They want engagement. When a candidate leaves a thoughtful, context-aware comment on that post, they are providing immediate value to the author. \n\nCommenting publicly does three things for a job seeker:\n1.  It bypasses the crowded, guarded inbox entirely.\n2.  It puts the candidate's name and headline directly in front of the target in a positive context.\n3.  It displays the candidate's industry knowledge to everyone else reading the thread, creating compound visibility.\n\nThe problem for candidates is the \"blank page syndrome.\" They see a post from an industry leader, feel intimidated, and end up typing something useless like \"Great post!\" or \"Thanks for sharing.\" This adds no value and goes ignored.\n\n### Junior: Local AI Commenting for Job Seekers\nThis is where Junior serves as a powerful replacement for traditional connection automation. Junior is an AI-powered LinkedIn automation tool designed specifically to start authentic conversations through strategic post commenting. \n\nInstead of automating blind connection requests, Junior helps candidates engage with the content their target companies and decision-makers are already posting. \n\n![Workflow illustration showing how strategic public commenting leads to profile views and warm connection requests.](https://assets.bevisible.app/inline-images/j57cchjrnhrbznapp4dh7dc9e58d7yjx/inline-2-1788623271307-3fl0b3.png)\nHere is how Junior functions as a safer, more effective alternative for candidate networking:\n\n**1. Context-Aware Drafting Based on Candidate Bio**\nWhen a candidate uses Junior, the tool understands their specific background, goals, and tone. If the candidate is an aspiring data analyst, Junior will read a target's post about market trends and draft a reply that sounds like a thoughtful data analyst weighing in on the conversation. It removes the friction of \"what do I say?\" while maintaining human-sounding authenticity. The candidate always reviews and edits the comment before posting, ensuring they retain total control over their professional voice.\n\n**2. Bypassing Inbox Defenses**\nBy shifting the focus from automated direct messaging to public commenting, candidates turn public visibility into direct profile views. When a candidate consistently leaves insightful comments on a target company's posts, the internal recruiters and hiring managers naturally click on the candidate's profile to see who they are. This creates a warm inbound interaction, rather than a cold outbound pitch. We explore this dynamic deeply in our piece on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n**3. Local Execution for Total Account Safety**\nUnlike cloud-based tools that run on external servers and trigger LinkedIn's security algorithms, Junior runs locally on the user's machine. It uses natural interaction patterns, mimicking human behavior. For a job seeker whose livelihood depends on keeping their LinkedIn account active and unflagged, this local execution is a critical distinction. For more on evaluating these risks, you can reference the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### Exploring Other Engagement-Focused Tools\nWhile Junior is designed specifically for authentic, localized engagement based on user bios, coaches may encounter other tools in the commenting space. \n\nTools like Supergrow and Taplio offer robust LinkedIn growth features, often geared toward content creators and agency owners who want to schedule posts and manage multiple accounts. However, for a job seeker whose primary goal is targeted relationship building rather than broad audience monetization, these platforms can sometimes feel overwhelming or misaligned with their specific needs. If your candidates are evaluating these broader platforms, our guides on [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) and [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) break down the specific feature differences and ideal use cases.\n\n## Coaching Scenarios: Applying the Stack in Practice\n\nTo understand how this toolset replaces Dripify, let us look at how a career coach might deploy these strategies in real-world scenarios.\n\n### Scenario 1: The Career Pivot\n**The Problem:** Your client is a former teacher trying to break into corporate instructional design. They have zero industry connections. If they use a tool like Dripify to blast corporate recruiters, they will be ignored because their profile lacks traditional corporate credibility.\n\n**The Solution:** \n1.  You have the candidate use the LinkedIn Alumni Tool to find former teachers who successfully transitioned into corporate instructional design roles.\n2.  You use Claude to help the candidate craft a highly specific outreach message acknowledging the shared background: *\"As a fellow former educator, I am fascinated by your transition to [Company].\"*\n3.  Instead of cold messaging hiring managers directly, the candidate uses Junior to monitor the feeds of senior instructional designers at their target companies. They leave thoughtful comments on discussions about adult learning theory, demonstrating their knowledge publicly. \n4.  The hiring managers see the comments, view the candidate's profile, and the candidate can now send a connection request that says, *\"Really enjoyed our exchange on your post about e-learning trends.\"* \n\nThe cold outreach has been transformed into a warm introduction.\n\n### Scenario 2: The Shy Introvert\n**The Problem:** Your candidate is a brilliant software engineer but suffers from intense imposter syndrome. The thought of sending a direct message to a CTO makes them physically anxious. They refuse to \"network.\"\n\n**The Solution:**\nYou reframe networking entirely. You remove the expectation of the direct ask. \n1.  You help them identify 15 target engineering leaders. \n2.  You set up Junior on their local machine. \n3.  When those leaders post about technical challenges or new frameworks, Junior drafts a contextually relevant, technically sound response based on the candidate's engineering background. \n4.  The candidate simply reviews, tweaks, and hits post. \n\nThe introvert is now networking and building visibility without ever having to initiate a high-pressure, one-on-one conversation. They are contributing to a community rather than asking for a handout. For coaches looking for alternatives to aggressive cloud bots for these candidates, we detail this in [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n## Evaluating Dripify Alternatives: A Checklist for Career Coaches\n\nWhen you are recommending software to job seekers, you take on a level of responsibility for their digital safety and their professional reputation. Before advising a candidate to use any networking automation tool, evaluate it against these criteria:\n\n| Evaluation Criteria | Traditional Messaging (e.g., Dripify) | Modern Engagement (e.g., Junior) | Impact on Candidate |\n| :--- | :--- | :--- | :--- |\n| **Primary Interaction** | Private Cold Direct Messages | Public Contextual Comments | Public comments build authority and avoid crowded inboxes. |\n| **Execution Method** | Cloud-based (Server IP) | Local Machine | Local execution protects the candidate's account from restrictions. |\n| **Personalization Engine** | Variables (First Name, Company) | AI-driven context reading bio/post | AI context prevents the candidate from sounding like a generic bot. |\n| **Metric of Success** | Volume of messages sent | Quality of profile views/inbound | Focuses the candidate on relationships rather than spamming. |\n\nFor a deeper dive into assessing tool capabilities, consult our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## Overcoming Candidate Resistance to AI Tools\n\nEven when shifting from aggressive messaging to thoughtful engagement, some candidates will resist using AI. They often express two concerns:\n\n1.  **\"It feels like cheating.\"**\n2.  **\"I don't want to sound like a robot.\"**\n\nAs a coach, your role is to reframe the technology. Explain that AI is not a replacement for their intellect; it is a remedy for their inertia. \n\nCompare it to a blank canvas versus a coloring book. Confronting a blank message box induces paralysis. An AI tool provides the initial outline\u2014the context, the grammar, the thematic connection. The candidate's job is to color it in, ensuring it matches their voice and their specific point of view. \n\nIf an AI tool drafts a comment that says, *\"This is a fascinating perspective on agile methodologies,\"* coach the candidate to append their real-world experience: *\"This is a fascinating perspective on agile methodologies. In my last sprint, we faced a similar bottleneck, and we solved it by doing [X].\"* \n\nThe AI got them started; the human finished the thought. This collaborative approach to AI is what separates successful candidates from those who blindly automate their personal brands.\n\n![Visual breakdown of collaborative AI networking showing an AI draft enhanced with personal candidate experience.](https://assets.bevisible.app/inline-images/j57cchjrnhrbznapp4dh7dc9e58d7yjx/inline-3-1788623266428-506gaf.png)\n## Measuring Networking Success Beyond Vanity Metrics\n\nWhen you transition candidates away from high-volume tools like Dripify, you also have to transition how they measure success. \n\nIf a candidate is used to seeing a dashboard that says \"100 Connection Requests Sent Today,\" moving to an engagement strategy can feel slow. You must teach them to track the metrics that actually lead to interviews.\n\n**Stop tracking:**\n*   Total connection requests sent.\n*   Number of generic messages dispatched.\n\n**Start tracking:**\n*   **Profile Views:** A spike in profile views after a week of strategic commenting is the strongest indicator that the strategy is working. It means their comments are compelling enough to make people click.\n*   **Inbound Connection Requests:** When industry leaders or recruiters send *them* a request after seeing a comment, the power dynamic of the job hunt has shifted in the candidate's favor.\n*   **Informational Interviews Booked:** The ultimate leading indicator of job search success. One warm, 15-minute chat with a hiring manager is worth a thousand cold DMs.\n\n## FAQs for Career Coaches Using Networking Tools\n\n**How much automation is too much for a job seeker?**\nAutomation should be used for discovery, research, and drafting\u2014never for the final execution of sending a message or posting a comment without human review. If a tool acts on behalf of a candidate while they are sleeping, it is too much automation. The candidate must always remain the final editor of their professional reputation.\n\n**Can engagement tools guarantee interviews?**\nNo tool can guarantee an interview. Tools can guarantee visibility and drastically reduce the friction of starting conversations. It is up to the candidate's resume, portfolio, and interview skills to convert that visibility into a job offer. \n\n**Are these tools compliant with LinkedIn's terms of service?**\nCloud-based automation that bypasses front-end limits is strictly against LinkedIn's terms and frequently leads to bans. Tools that operate locally, rely on human review, and utilize natural click patterns are vastly safer. Coaches must prioritize account safety above all else when making recommendations. For further insights on this ecosystem, review [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n## Building a Sustainable Strategy\n\nJob seeking is inherently vulnerable. When career coaches hand candidates tools designed for aggressive outbound sales, they inadvertently compound that vulnerability with the stress of rejection, the risk of account bans, and the discomfort of behaving like a spammer.\n\nBy replacing legacy automation with a thoughtful stack focused on discovery, AI-assisted personalization, and local, context-aware engagement, you empower your candidates. You give them a systematic way to build their network, demonstrate their expertise publicly, and start authentic conversations that actually lead to career opportunities.", "created_at": "2026-09-05T15:49:24.960501+00:00", "updated_at": "2026-09-05T15:49:24.960507+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
