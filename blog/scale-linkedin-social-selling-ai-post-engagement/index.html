    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 126, "slug": "scale-linkedin-social-selling-ai-post-engagement", "title": "How to scale LinkedIn social selling with AI-powered post engagement", "excerpt": "Discover best practices for AI social selling on LinkedIn. Learn how to turn public post comments into pipeline, inbound leads, and client meetings safely.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57f5zqeb3t0rtkq53v376jf8d8f7dqb/how-to-scale-linkedin-social-selling-with-ai-power-1791305311895-v2vt62.png", "published_at": "2026-10-09T16:18:00+00:00", "content": "# How to scale LinkedIn social selling with AI-powered post engagement\n\nThe era of the automated cold pitch is over. If you spend any time managing a LinkedIn inbox, you already know this. Prospects are overwhelmed by generic connection requests and multi-step sequence messages that offer no upfront value. As buyers build thicker filters against traditional outbound methods, the inbox has transitioned from a place of discovery to a place of defense. \n\nThe public timeline is the new inbox. \n\nInstead of fighting for attention in a crowded direct message folder, top-performing founders, sales teams, and lead generation agencies are shifting their focus to public visibility. They are building pipeline by entering conversations that are already happening. The strategy is simple in theory: leave highly insightful, context-aware comments on posts written by prospects, industry leaders, and potential partners. When you leave a thoughtful comment, you do not just reach the author; you reach their entire audience. \n\nThe problem is execution. Reading through hundreds of posts, processing the context, and writing a unique, human-sounding reply for each one takes hours. This is where AI-powered social selling comes in. By leveraging AI to draft context-aware replies based on your unique bio and goals, you can scale your visibility without sounding like a bot. \n\nThis guide breaks down the best practices for AI social selling on LinkedIn, showing you how to replace the ineffective cold DM treadmill with a targeted commenting strategy that turns public visibility into direct interviews, pipeline, and client conversations.\n\n## The fundamental shift from cold outreach to public engagement\n\nFor years, the standard playbook for LinkedIn growth relied heavily on connection automation. You would scrape a list of target accounts, load them into a cloud-based automation platform, and fire off hundreds of requests a week. \n\nToday, this approach carries severe diminishing returns. Prospects can spot an automated pitch a mile away. Many have even noted that having tested several AI-based outreach tools, [none have been able to replicate a genuine human interaction](https://nethunt.com/blog/linkedin-outreach/) when forced into the rigid structure of a cold DM. When a stranger lands in an inbox with a generic pitch, the default response is to ignore or block. \n\n![Comparison diagram showing cold LinkedIn direct messaging versus public comment engagement funnels.](https://assets.bevisible.app/inline-images/j57f5zqeb3t0rtkq53v376jf8d8f7dqb/inline-1-1791305266102-titl7u.png)\nCommenting flips this dynamic entirely. \n\nWhen you comment on a prospect's post, you are validating their ideas. You are engaging with them on their turf, contributing to their visibility. This triggers the principle of reciprocity. A well-crafted comment earns a profile view. Multiple well-crafted comments over a few weeks earn trust. When you eventually send a connection request, you are no longer a cold prospector; you are a familiar face from the comment section. \n\nIf you are looking for [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), the distinction is clear. Dripify and similar tools focus on inbox volume. Modern social selling focuses on feed visibility and relationship building before the pitch. \n\n## Defining AI social selling on LinkedIn\n\nAI social selling is not about deploying a script that drops \"Great post! Thanks for sharing\" on five hundred updates a day. That is spam, and the LinkedIn algorithm aggressively penalizes it. \n\nEffective AI social selling blends hyper-personalization, automation, and genuine engagement to build trust. It is about using [proactive networking by identifying key people](https://www.inventive.ai/blog-posts/4-part-blueprint-to-social-selling-on-linkedin) in your target market and using artificial intelligence to accelerate the research and drafting phase of your engagement. \n\nA proper AI commenting tool acts as an extension of your brain. It reads the post, cross-references it with your personal background, business goals, and tone of voice, and drafts a response that you would naturally say if you had the time to sit and think about it. You review the draft, make minor tweaks if necessary, and post. This turns a 10-minute task per post into a 30-second task, allowing you to engage with 20 or 30 high-value prospects a day without abandoning your core work.\n\n## Best practices for executing AI-powered engagement\n\nTo make this strategy work, you have to align your profile, your targeting, your tools, and your account safety protocols. Skipping any of these steps results in wasted effort or, worse, account restrictions.\n\n### 1. Optimize your profile for inbound traffic\n\nIf your commenting strategy works, your profile views will skyrocket. Every comment you leave acts as a digital billboard pointing back to your profile. If your profile reads like a dry resume rather than a landing page, that traffic will bounce.\n\nBefore scaling your engagement, ensure your profile clearly articulates your value proposition. \n\n*   **The Headline:** This is the most visible piece of text on LinkedIn. It follows your name on every comment you make. If your headline says \"CEO at Acme Corp,\" it gives prospects no reason to click. If it says \"Helping B2B SaaS founders scale outbound pipeline without paid ads,\" the prospect immediately understands your utility.\n*   **The Featured Section:** Pin your best case studies, lead magnets, or booking links here. When someone clicks your profile after reading a smart comment, you want to capture that intent immediately.\n*   **The About Section:** Write this for your buyer, not for a recruiter. State the problems you solve, the methodology you use, and the results you achieve. \n\nBuilding real credibility through your profile is a prerequisite. As experts note regarding [building trust and credibility online](https://www.youtube.com/watch?v=MEZGJx1QjpE&t=403), authenticity must come first. The AI is simply the vehicle to drive traffic to your authentic brand.\n\n### 2. Prioritize account safety with local automation\n\nThe quickest way to ruin a social selling campaign is to get your LinkedIn account restricted. The platform is increasingly aggressive toward automated behavior. \n\nMost legacy automation tools operate in the cloud. They log into your account from an IP address in a different state or country, behaving in ways that no human possibly could. LinkedIn detects this IP hopping and unnatural API usage, leading to shadowbans or permanent suspensions.\n\nTo protect your account, you must evaluate how your tools interact with the platform. You should always use tools that run locally on your machine. Local automation operates within your existing browser session. From LinkedIn's perspective, the actions are coming from your regular IP address, following natural interaction patterns and realistic delays. \n\nWhen reviewing your tech stack, consult resources like the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) to ensure you are not trading short-term speed for long-term account risk. If you are comparing platforms, understanding [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) is the difference between a thriving pipeline and a banned account.\n\n![Diagram comparing risky cloud-based automation against safe local browser AI commenting.](https://assets.bevisible.app/inline-images/j57f5zqeb3t0rtkq53v376jf8d8f7dqb/inline-2-1791305264456-k9hl5v.png)\n### 3. Hyper-target your engagement lists\n\nYou cannot just comment randomly on the main feed and expect business results. The LinkedIn algorithm serves you a mix of viral content, random connections, and ads. If you rely on the default feed, you will waste your AI engagement on posts that do not drive revenue.\n\nYou need to build specific lists of targets. \n\n*   **The Prospect List:** These are the decision-makers you actively want to close. They might not post often, but when they do, you need to be the first person in the comments adding value.\n*   **The Industry Voice List:** These are the influencers and thought leaders your prospects follow. By consistently leaving high-value, top-voted comments on these posts, you put yourself in front of their massive audiences. \n*   **The Referral Partner List:** These are non-competing professionals who serve the exact same audience you do. Engaging with them builds a reciprocal relationship that often leads to warm introductions.\n\nFinding these posts manually is tedious, which is why utilizing the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) can help you curate a highly specific feed of opportunities. \n\n### 4. Provide specific context to your AI assistant\n\nOut-of-the-box AI tools sound like AI. They use overly formal language, excessive emojis, and predictable structures. If you use a generic prompt to generate a comment, your prospect will know. \n\nTo make AI social selling effective, you must use a platform designed to start authentic conversations based on your unique persona. Tools like Junior replace generic outputs by allowing you to inject your specific bio, your company's value proposition, and your preferred tone. \n\nIf you are a lead gen agency founder, the AI should know to frame its replies from the perspective of someone who understands outbound metrics and conversion rates. If you are a job seeker, the AI should highlight your specific industry expertise in its responses. The goal is context-aware, human-sounding replies.\n\nWhen evaluating your options, look for systems that allow deep contextual training. Reviewing the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) will show you which platforms prioritize nuanced, persona-driven responses over mass generation. \n\n## The commenting workflow that replaces cold outreach\n\nOnce your profile is optimized, your lists are built, and your local AI tool is configured with your context, you need a daily workflow. Social selling requires consistency. Engaging for three hours on a Sunday and then disappearing for a week will not yield results. You need a daily habit.\n\nHere is the exact blueprint to turn public visibility into direct conversations.\n\n### Step 1: The daily 15-minute sweep\n\nDedicate 15 to 20 minutes a day to your engagement sweep. Open your curated lists of prospects and industry voices. Look for posts published within the last 24 hours. The algorithm heavily favors early engagement, so commenting on a post within the first two hours of publication drastically increases the visibility of your comment.\n\n### Step 2: Generate, review, and refine\n\nSelect a relevant post and trigger your AI commenting tool. Because the tool already understands your background and goals, it will read the post and draft a contextual reply. \n\nNever post blindly. The AI is a drafter, not a final editor. Read the drafted comment. Does it sound like you? Does it add to the conversation? \n\nA strong comment does one of three things:\n1.  **Adds a missing perspective:** \"You mentioned X, which is completely accurate, but I've also seen Y happen when teams scale past $1M ARR.\"\n2.  **Provides a specific, confirming example:** \"Exactly this. We implemented this framework last quarter and saw a 20% drop in churn.\"\n3.  **Asks a high-level question:** \"Great breakdown of the problem. How are you handling the compliance side of this workflow?\"\n\nIf the AI draft hits one of these marks, approve it and move on. If it needs a tweak, edit the text directly before posting.\n\n### Step 3: Monitor for replies and engage deeply\n\nWhen the author of the post replies to your comment, the dynamic changes. You have now initiated a two-way conversation in public. \n\nReply to their response naturally. Do not try to pitch in the public comments. The goal here is purely to demonstrate expertise and be helpful. If the conversation warrants it, this is the exact moment to move from the public feed to the private inbox.\n\n### Step 4: The transition to the inbox\n\nAfter a few positive interactions in the comments over a week or two, send a connection request. \n\nBecause you are no longer a stranger, your connection message does not need to be a desperate pitch. It can simply be: \n\n\"Hey [Name], really enjoyed our back-and-forth on your post about [Topic] yesterday. Wanted to connect so I don't miss your future updates.\"\n\nOnce they accept, you have a warm lead in your inbox. You can continue the conversation organically, eventually steering it toward a discovery call if there is mutual fit. This completely bypasses the crowded, spam-filled primary inbox that most cold outreach tools fight over.\n\n![Four-step process workflow showing progression from public post commenting to booked discovery call.](https://assets.bevisible.app/inline-images/j57f5zqeb3t0rtkq53v376jf8d8f7dqb/inline-3-1791305265516-26oidq.png)\n## The \"Spam\" Trap: What to avoid at all costs\n\nEven with the best tools, human error can sabotage an AI social selling campaign. As more people adopt AI on LinkedIn, users are becoming highly sensitive to synthetic behavior. Avoid these critical failure modes:\n\n### The \"agree and summarize\" pattern\n\nThe most common mistake people make with AI text generation is allowing the model to simply summarize the original post and aggressively agree with it. \n\nIf a prospect posts: \"Cold calling is getting harder because connection rates have dropped to 2%.\"\nA bad AI comment reads: \"I completely agree! Cold calling is definitely getting harder as connection rates drop. Thanks for sharing this great insight!\"\n\nThis adds zero value. It occupies space without demonstrating expertise. Your AI configuration must be prompted to challenge, expand upon, or provide an anecdote related to the topic, rather than acting as an echo chamber.\n\n### Ignoring the emotional context of a post\n\nNot every post requires a strategic business comment. People post about layoffs, personal struggles, and career changes. Using an automated tool to drop a structured, business-centric comment on a post about a family tragedy or a company downsizing is catastrophic for your brand. \n\nAlways look at the post before you click generate. If the topic is highly sensitive, skip it or write a brief, purely human message of support. AI has no empathy; you have to provide it.\n\n### Over-saturating the feed\n\nVolume is not the goal. If you use tools to drop 200 comments a day, the LinkedIn algorithm will flag your account for unnatural behavior, and your network will grow tired of seeing your name on every single post. \n\nFocus on 15 to 30 high-impact comments daily. Ten thoughtful comments on the right posts will generate more pipeline than a hundred generic comments scattered across random feeds. If you are researching tools and comparing [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), pay attention to how the platforms handle volume pacing and natural interaction limits.\n\n## The economics of attention: A practical scenario\n\nTo understand the tangible ROI of this strategy, look at the success cases of agencies leveraging organic visibility. For example, a documented [strategy that made $100K](https://www.youtube.com/watch?v=ZeBbeonLqnU&vl=en) using LinkedIn for an AI automation agency relied entirely on capturing attention through authority rather than fighting in the inbox. \n\nImagine you run a lead generation agency targeting B2B SaaS founders. \n\n**Scenario A: The Cold DM Approach**\nYou use a cloud-based automation tool to send 100 connection requests a day. \n- 20 people accept. \n- You send an automated pitch to those 20 people. \n- 18 ignore it. \n- 1 tells you to stop messaging them. \n- 1 asks for more info, but ghosts you. \nYou spent the day risking your account for zero booked calls.\n\n**Scenario B: The AI Commenting Approach**\nYou use a local AI tool to draft 15 thoughtful comments on posts written by SaaS founders and industry voices.\n- 5 founders reply to your comment, validating your expertise.\n- 500 people read your comment on an industry influencer's post. \n- 20 people click your profile because your comment was genuinely insightful. \n- 3 people send *you* an inbound connection request because your profile clearly states you help SaaS companies scale. \n- You start warm conversations with those 3 inbound leads.\n\nScenario B takes less time, carries zero account risk, and positions you as a peer rather than a desperate vendor.\n\n## Measuring the success of AI-driven social selling\n\nYou cannot improve what you do not measure. However, tracking the wrong metrics will lead you to optimize for vanity rather than revenue. As sales leaders look to establish benchmarks, they [compare actual team performance to pre-set targets](https://business.linkedin.com/sell/resources/sales-terms/ai-in-sales) that align with revenue, not just activity.\n\nDo not measure success by the number of comments you leave or the number of likes those comments get. Those are vanity metrics. Instead, track these three indicators of a healthy social selling pipeline:\n\n### 1. 90-Day Profile Views\n\nThis is the most direct indicator that your commenting strategy is working. When you leave better comments, more people click your name. If your profile views are flat or declining, your comments are either too generic or you are commenting on posts with no reach. A sharp increase in profile views means your AI tool is helping you write compelling hooks.\n\n### 2. Inbound Connection Requests from Target Personas\n\nIf you are a job seeker looking for an engineering role, are CTOs and engineering managers sending you requests? If you are a consultant, are founders reaching out? \n\nA successful commenting strategy generates inbound interest. People want to connect with professionals who consistently share smart perspectives in public. \n\n### 3. Comment-to-Meeting Conversion Rate\n\nUltimately, the goal is pipeline. Track how many public conversations successfully transition to a direct message, and how many of those direct messages turn into a booked discovery call or interview. \n\nIf you are getting great engagement in the comments but zero meetings, you likely have an issue with your profile conversion or your transition strategy. You might be waiting too long to move the conversation to the inbox, or your profile might not clearly state how you can help them.\n\n## The role of AI in the future of LinkedIn\n\nAs we move deeper into 2026, the platforms will continue to refine their algorithms to surface high-quality, human-centric content while burying mass-produced spam. \n\nThe professionals who win will be those who use AI as a localized drafting assistant to scale their unique point of view, rather than those who try to outsource their entire personality to a prompt. \n\nIf you are currently evaluating your tech stack and want to ensure you are prioritizing safety and effectiveness, reviewing the [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is a critical step in moving away from high-risk connection automation. \n\nAI social selling is simply the modernization of networking. It allows you to walk into a digital room, listen to a conversation, and confidently add a valuable insight without having to spend hours preparing your thoughts. When done right, it builds credibility, bypasses the noise of the direct message inbox, and creates a sustainable pipeline of warm opportunities.\n\n## Frequently Asked Questions\n\n**Is it safe to use AI for LinkedIn commenting?**\nIt is safe if you use the right architecture. Cloud-based tools that log into your account from remote servers violate LinkedIn's terms and risk permanent suspension. Local automation tools that run in your own browser session and mimic human pacing are significantly safer because they do not trigger IP or behavioral alarms.\n\n**How many posts should I engage with daily?**\nQuality beats volume. Engaging thoughtfully with 15 to 25 highly relevant posts per day is enough to significantly boost your profile views and generate warm leads. Exceeding 50 or 100 comments a day looks unnatural to both the algorithm and your network.\n\n**Will prospects know I am using AI to comment?**\nThey will know if you use generic prompts that result in repetitive, robotic language. They will not know if you use an advanced tool that incorporates your unique bio, tone guidelines, and specific industry context. The AI should draft the framework; your personal context provides the soul. Always review and lightly edit before posting.", "created_at": "2026-10-09T16:19:27.203271+00:00", "updated_at": "2026-10-09T16:19:27.203278+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
