    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 117, "slug": "best-linkedin-automation-tool-for-engagement", "title": "Best Linkedin Automation Tool for Engagement Tools Beyond Aware", "excerpt": "Explore the best LinkedIn automation tools for engagement beyond Aware. Compare contextual AI commenting, local safety execution, and DM outreach tools.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57ehm608dcdentdkdq7n0ggd58f6bnx/best-linkedin-automation-tool-for-engagement-tools-1790527699960-5mxgem.png", "published_at": "2026-09-30T16:09:00+00:00", "content": "# Best Linkedin Automation Tool for Engagement Tools Beyond Aware\n\nIf you are spending 10 hours a week manually dropping comments on LinkedIn posts, you already know the platform has shifted. The era of the automated connection request and a generic pitch in the direct messages is largely over. Buyers, recruiters, and founders simply ignore the noise. Instead, the most valuable real estate on LinkedIn has moved to the feed. \n\nPublic visibility through strategic, high-quality post commenting is how you bypass crowded inboxes and turn profile views into actual conversations. When users search for engagement automation, tools like Aware frequently come up. Aware is a powerhouse for enterprise collaboration analytics, data governance, and listening. But if your goal is to proactively *drive* conversations, generate pipeline, or land interviews by commenting on target accounts' posts, a passive listening tool won\u2019t do the heavy lifting for you.\n\nYou need an engagement tool that actively participates in the conversation without making you look like a bot. This guide breaks down the best LinkedIn automation tools for engagement, why the technology is moving away from cloud-based spam, and how to choose the right software to build authentic relationships at scale.\n\n## The Shift from Cold Outreach to Contextual Engagement\n\nFor years, LinkedIn automation meant one thing: scraping a list of targets from Sales Navigator and blasting them with connection requests. According to [research on B2B lead generation](https://blog.linkmate.io/best-linkedin-automation-tools-2025-boost-your-lead-generation-engagement/), while LinkedIn remains the undisputed network for connecting professionals, effectively leveraging it creates a massive operational challenge. Maintaining an active presence often requires more time than busy professionals have.\n\nBecause everyone bought the same mass-outreach tools, the effectiveness of cold direct messaging plummeted. LinkedIn responded by enforcing strict weekly connection limits (often around 100 per week) and aggressively flagging repetitive messaging behavior.\n\nEngagement automation solves this by targeting the feed instead of the inbox. \n\nWhen you leave a highly relevant, insightful comment on a prospect's post, you trigger the psychological principle of reciprocity. The author sees your comment, appreciates the engagement, and almost always clicks your profile. If your profile is optimized, they send the connection request. You turn an outbound effort into an inbound interaction. \n\nThe problem? Doing this manually across 50 target accounts every day is exhausting. \n\n![Diagram comparing the low-conversion cold DM outreach funnel with the high-conversion public feed engagement loop on LinkedIn](https://assets.bevisible.app/inline-images/j57ehm608dcdentdkdq7n0ggd58f6bnx/inline-1-1790527651648-l66nqc.png)\n## The Problem with Traditional Automation and Engagement Pods\n\nWhen trying to automate engagement, many professionals accidentally fall into one of two traps: generic bots or engagement pods.\n\n**1. The \"Great Post!\" Bot**\nEarly commenting automation relied on static rules. If an account posted, the tool would randomly select a comment from a pre-written list: *\"Great post!\"*, *\"Thanks for sharing!\"*, or *\"Agreed!\"*. This damages your reputation instantly. Authors and their networks can spot these generic replies a mile away, and it signals that you do not care enough to actually read their content.\n\n**2. Engagement Pods**\nSome tools organize users into \"pods\" where members automatically like and comment on each other's posts to trick the algorithm. As noted in guides covering [safe and free options for automation](https://blog.linkboost.co/best-linkedin-automation-tools-2026/), while some users experiment with these networks, LinkedIn\u2019s algorithm is highly adept at identifying repetitive engagement clusters. If the same 20 people immediately like your post every time you publish, LinkedIn devalues the engagement and can restrict your account.\n\nTrue engagement automation requires context. The tool must be able to read the specific post, understand the nuance, and generate a reply that actually adds to the discussion.\n\n## Core Criteria for Evaluating LinkedIn Engagement Tools\n\nBefore committing to a platform, you need to evaluate how it interacts with LinkedIn's infrastructure and how it represents your personal brand.\n\n### 1. Safety and Account Protection (Local vs. Cloud)\nCloud-based automation tools log into your LinkedIn account from a server, often located in a different city or country than you. If you check your feed from your phone in Santa Clara, and three seconds later your automation tool sends a message from an IP address in AWS Virginia, LinkedIn flags the impossible travel. \n\nThe safest tools run locally on your own machine. By executing actions from your actual browser and IP address, local tools mirror natural human interaction patterns, drastically reducing the risk of account restrictions. This is a critical factor when looking for [Phantombuster alternatives for safely automating comments](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n### 2. Context-Aware AI Generation\nA modern tool must integrate Large Language Models (LLMs) to read the target post before acting. It should analyze the author's tone, the core argument of the post, and specific details to draft a response that sounds human. \n\n### 3. Personalization via Bios and Goals\nEven if an AI writes a great comment, it needs to sound like *you*. The best tools allow you to input your unique background, current goals, and tone of voice. A job-seeking software engineer should leave a very different style of comment than a founder selling enterprise logistics software.\n\n### 4. Relevant Post Discovery\nCommenting is only half the battle. Finding the *right* posts to comment on is equally difficult. An effective tool needs workflows to discover relevant discussions, track specific creators, or monitor keywords in your niche.\n\n![Technical diagram contrasting cloud-based proxy bot detection with safe local browser execution for LinkedIn automation.](https://assets.bevisible.app/inline-images/j57ehm608dcdentdkdq7n0ggd58f6bnx/inline-2-1790527654626-ccdrck.png)\n## Best LinkedIn Automation Tools for Engagement\n\nThere is no single tool that does everything perfectly. Your choice depends on whether you are looking for enterprise governance, mass outreach, content scheduling, or contextual commenting. Here is a breakdown of the leading platforms, moving beyond Aware.\n\n### 1. Junior: The Best for Authentic, Contextual Commenting\nJunior is an AI-powered LinkedIn automation tool built specifically to start authentic conversations through strategic post commenting. Unlike traditional tools that focus on messaging volume, Junior focuses on engagement quality. \n\nIt is designed for job seekers, sales teams, lead gen agencies, and founders who want to replace ineffective cold DMs. \n\n**Key Strengths:**\n*   **Local Execution for Safety:** Junior runs locally on your machine rather than the cloud. It uses your IP address and natural interaction patterns, keeping your account safe from the bans associated with cloud-based bots. This is a major advantage when considering [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n*   **Context-Aware AI:** It doesn't just drop generic replies. Junior finds relevant discussions in your niche, reads the actual content of the post, and drafts context-aware replies.\n*   **Persona Customization:** The AI bases its drafts on your unique bio and specific goals. It sounds human because it operates using your specific constraints and objectives.\n*   **Bypassing the Inbox:** By automating the most tedious part of networking\u2014finding the post and thinking of a clever reply\u2014Junior helps you turn public visibility into direct interviews and client conversations. \n\nIf you are evaluating tools based on safety and relevance, you can use an [automate LinkedIn comments safely evaluation checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) to see how Junior scores against older models.\n\n### 2. Aware: The Best for Enterprise Risk and Analytics\nAware is a fantastic platform, but it serves a very different master than pipeline generation. Aware is an enterprise collaboration intelligence platform. It connects to tools like Slack, Teams, and enterprise social networks to monitor employee sentiment, ensure data governance, and manage risk.\n\n**Key Strengths:**\n*   **Deep Analytics:** It provides incredible dashboards for HR and internal communications teams to understand organizational health.\n*   **Compliance:** Built for Fortune 500 companies that need strict data loss prevention (DLP) across internal channels.\n\n**Where it falls short for individuals:**\nAware is not built for a sales rep trying to book meetings or a founder building an audience on LinkedIn. It is a listening and compliance tool, not an action-oriented outbound engagement tool. If you search for an Aware alternative for *engagement*, you are likely looking for a tool that executes actions (like Junior) rather than just monitoring them.\n\n### 3. Taplio: The Best for Content Scheduling and Creator Growth\nTaplio has made a significant name for itself among LinkedIn creators. Its primary focus is helping you write and schedule your own posts. \n\n**Key Strengths:**\n*   **Content Inspiration:** It offers AI-assisted post drafting and viral post templates to help you build your own audience.\n*   **Basic Engagement Features:** It includes features to like and comment on posts within your feed directly from their dashboard.\n\n**Where it falls short for pure engagement:**\nTaplio relies on cloud infrastructure, and its engagement features, while useful, are often secondary to its content scheduling. The AI commenting can sometimes feel slightly rigid compared to tools dedicated purely to contextual response generation. For a deeper breakdown of these differences, consider evaluating [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n### 4. Dripify: The Best for Complex Messaging Sequences\nIf you are still committed to direct messaging and need a highly structured CRM environment, Dripify remains a popular choice. It allows you to build complex conditional logic sequences (e.g., View Profile -> Wait 1 Day -> Send Connection -> If Accepted, Send Message).\n\n**Key Strengths:**\n*   **Visual Campaign Builder:** Extremely intuitive interface for mapping out outreach flows.\n*   **Team Management:** Good for agencies managing multiple accounts and viewing aggregate statistics.\n\n**Where it falls short for pure engagement:**\nDripify is inherently an outreach tool, not an engagement tool. It relies heavily on connection requests and DMs, which are facing diminishing returns. For a detailed look at how messaging compares to commenting, review [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). \n\n### 5. Sprout Social & Brandwatch: The Best for Brand Social Listening\nFor large marketing departments managing brand pages (rather than personal profiles), enterprise tools are necessary. Both [Sprout Social](https://sproutsocial.com/insights/linkedin-automation-tools/) and [Brandwatch](https://www.brandwatch.com/blog/linkedin-automation-tools/) offer robust suites for managing corporate LinkedIn presences alongside Twitter, Instagram, and Facebook.\n\n**Key Strengths:**\n*   **Omnichannel Management:** Handle all corporate social accounts in one unified inbox.\n*   **Approval Workflows:** Essential for PR teams that require legal or managerial sign-off before a post goes live.\n\n**Where they fall short for pure engagement:**\nThese tools are built for company pages, which inherently have lower organic reach on LinkedIn compared to personal profiles. They do not specialize in the rapid, context-aware AI commenting from a personal profile that drives modern B2B pipeline.\n\n![Quadrant matrix categorizing LinkedIn automation tools by engagement action type and execution safety.](https://assets.bevisible.app/inline-images/j57ehm608dcdentdkdq7n0ggd58f6bnx/inline-3-1790527654107-vwled4.png)\n## Feature Comparison Matrix\n\nTo clarify the landscape, here is a breakdown of how these distinct approaches compare on the features that matter most for driving actual conversations.\n\n| Feature / Tool Focus | Junior (Strategic Commenting) | Aware (Enterprise Listening) | Taplio (Creator Content) | Dripify (DM Sequences) |\n| :--- | :--- | :--- | :--- | :--- |\n| **Primary Action** | Contextual AI Commenting | Sentiment & Compliance | Post Scheduling | Automated DMs & Connection Requests |\n| **Safety Architecture** | Local Machine Execution | API Integration (Listening) | Cloud-Based | Cloud-Based (Dedicated IP) |\n| **AI Personalization** | High (Based on unique bio/goals) | N/A (Analytical) | Medium (Content templates) | Low (Template variables like {{firstName}}) |\n| **Best Target User** | Founders, Sales, Job Seekers | HR, Enterprise IT | Content Creators | High-volume SDRs |\n| **Solves \"Crowded Inbox\"** | Yes (Engages publicly in feed) | N/A | Partially | No (Adds to the inbox noise) |\n\n## Designing a Winning Engagement Strategy\n\nEven with the best LinkedIn automation tools for engagement, the software is only a multiplier of your strategy. If your strategy is flawed, AI will just execute that flawed strategy faster. Here is how to build an engagement workflow that actually yields interviews, meetings, and deals.\n\n### 1. Curate Your Input Sources\nYou cannot leave great comments if you are commenting on irrelevant posts. Stop relying on the default LinkedIn algorithmic feed, which is often cluttered with viral polls or unrelated humble-brags. \n\nInstead, build targeted lists:\n*   **The Prospect List:** Save a search of your ideal buyers in Sales Navigator and bookmark the URL that shows only their recent posts.\n*   **The Industry Voice List:** Identify 10-15 influencers in your niche who consistently post high-engagement content. Commenting early on their posts guarantees hundreds of profile views from their audience.\n*   **The Trigger Event List:** Track users who recently changed jobs, announced funding, or asked for recommendations. \n\nFinding these posts manually takes hours. Using the right tool helps streamline this. For a look at how to optimize this process, see this guide on the [best tools to find relevant LinkedIn posts to comment on](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### 2. Train the AI on Your Perspective\nIf you use an AI tool like Junior, spend time refining your bio and goals. Do not just write \"I am a software engineer.\" \n\nWrite: *\"I am a senior backend engineer specializing in Rust and distributed systems. I hold strong opinions about reducing cloud costs and prefer simple architecture over microservice bloat. My goal is to network with CTOs and technical founders at Series A startups.\"*\n\nThe more specific your constraints, the more human and opinionated the AI's drafted comments will be. A comment that gently challenges a premise or adds a specific technical anecdote is worth 100 generic \"great insights\" comments.\n\n### 3. The 80/20 Rule of Automation\nNever fully automate the final click. The most effective professionals use automation for the heavy lifting: discovering the post, analyzing the context, and generating a highly personalized draft. But they retain human oversight for the final review.\n\nRead the drafted comment. Tweak one word if necessary. Hit send. This hybrid approach ensures you maintain absolute control over your personal brand while saving 90% of the time.\n\n![Infographic illustrating the 80/20 hybrid workflow combining automated AI post drafting with human review.](https://assets.bevisible.app/inline-images/j57ehm608dcdentdkdq7n0ggd58f6bnx/inline-4-1790527652906-d23dsw.png)\n## A Real-World Scenario: The Consultant's Pivot\n\nConsider the case of a mid-level management consultant trying to break into a new vertical\u2014supply chain logistics. \n\n**The Old Way:** \nThey purchase a cloud-based mass messaging tool and scrape 1,000 VPs of Supply Chain. They send a sequence: *\"Hi [FirstName], noticed you work in logistics. We help companies streamline operations. Time for a chat?\"*\nResult: A 0.5% acceptance rate. Zero meetings booked. Three angry replies.\n\n**The Engagement Way:**\nThey pivot to an engagement-first strategy using local automation. They track 50 key voices in supply chain and logistics. Every morning, the tool surfaces 5-10 relevant posts from this cohort. It drafts thoughtful replies based on the consultant's specific background in process optimization. \n*   *Prospect posts about warehouse labor shortages.*\n*   *Tool drafts:* \"This perfectly highlights the bottleneck in Q3 planning. We've seen teams offset this by cross-training QA staff, but the retention piece you mentioned is the real challenge. How are you approaching the incentive structures?\"\n*   *Consultant reviews, approves, and posts.*\n\nResult: The prospect replies to the comment publicly. The prospect views the consultant's profile. The prospect sends an inbound connection request. A week later, a natural DM conversation begins, leading to a discovery call. No spam required.\n\n## Why Local Execution Matters for Your Reputation\n\nAs you explore [the best LinkedIn engagement tools of 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026), you will repeatedly encounter the debate between cloud and local execution. \n\nLinkedIn is engaged in a continuous arms race with automation developers. When [evaluating options](https://www.cleverly.co/blog/best-linkedin-automation-tools) to streamline efficiency, many users overlook the technical mechanism of the tool. Cloud tools rely on dedicated proxy IPs. While this is safer than shared IPs, LinkedIn can still detect the mismatch in browser fingerprints, hardware signatures, and unnatural interaction speeds (e.g., clicking three different links in exactly 0.2 seconds).\n\nLocal tools operate fundamentally differently. By running as an application or extension on your own device, they inherit your actual browser fingerprint, your hardware profile, and your real IP address. They simulate human clicking and scrolling delays. To LinkedIn's security algorithms, a well-designed local tool simply looks like you sitting at your desk, reading your feed, and typing a comment.\n\nFor professionals whose livelihoods depend on their LinkedIn network, risking a permanent ban for the sake of cloud convenience is a poor tradeoff.\n\n## Frequently Asked Questions (FAQ)\n\n**What is the best overall option for LinkedIn engagement?**\nThe best option for engagement focuses on smart, contextual workflows rather than mass outreach. Tools that provide AI-assisted commenting, targeted post discovery, and local execution\u2014like Junior\u2014yield the highest sustained engagement by balancing reach with relevance.\n\n**Is LinkedIn automation illegal?**\nIt is not illegal (in the sense of breaking the law), but it does violate LinkedIn's Terms of Service if the tool acts purely as a bot or spams users. Using tools that assist your workflow, draft context-aware text, and run locally to mimic human behavior dramatically reduces the risk of platform restrictions. Always review a tool's safety controls, rate limits, and risk-aware architecture before connecting it.\n\n**How many comments can I automate per day?**\nWhile limits vary based on your account's historical activity, it is generally safe to leave 30-50 high-quality, relevant comments per day if done naturally over several hours. Spiking from 0 to 150 comments in one hour will flag your account, regardless of the tool you use. Consistency is more important than sheer volume.\n\n**Why shouldn't I just use ChatGPT in a separate window?**\nYou can, but the friction is immense. You have to copy the post text, paste it into ChatGPT, prompt it with your persona, copy the result, bring it back to LinkedIn, and paste it. Doing that 30 times a day takes hours. Purpose-built engagement tools handle the context transfer and generation directly within your feed, removing the friction entirely.\n\n## Making Your Decision\n\nThe days of brute-forcing your way into a prospect's inbox are behind us. Modern professionals build their pipelines and careers in the public feed, leveraging the compounding visibility that comes from leaving smart, relevant comments on the right posts. \n\nIf you are a large enterprise looking to monitor internal employee sentiment and compliance across networks, Aware is undoubtedly the industry standard. But if you are an individual\u2014a founder, a sales leader, a job seeker, or an agency owner\u2014looking for the best LinkedIn automation tool for engagement, you need a proactive solution. \n\nBy choosing a tool that prioritizes local safety, understands the nuance of the conversation, and speaks in your unique voice, you can bypass the noise of the inbox and start building authentic relationships at scale. Stop sending generic connection requests. Start joining the conversation.", "created_at": "2026-09-30T16:19:27.471354+00:00", "updated_at": "2026-09-30T16:19:27.471360+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {

                {

                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'

                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const tryItHref = assetRoot + 'try-it.html?goal=sales&src=' + encodeURIComponent(ctaSrc);
                const trialHref = assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>See what Junior would say on a post from your market</h2>
                        <p>Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
