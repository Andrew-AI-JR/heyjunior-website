    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 150, "slug": "ai-sales-stack-architecture", "title": "Defining the modern AI sales stack for B2B teams", "excerpt": "Explore the 4-layer modern AI sales stack architecture. Move past linear spam sequences to signal-driven enrichment, autonomous AI SDRs, and social selling.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575hk1eqz5enydczfdm8f99x58h2507/defining-the-modern-ai-sales-stack-for-b2b-teams-1793380710860-omrfdx.png", "published_at": "2026-11-02T16:47:00+00:00", "content": "# Defining the modern AI sales stack for B2B teams\n\nB2B sales architectures built before 2024 are generating more activity and less revenue. The traditional predictable revenue playbook\u2014buy a list, load it into a sequence, send a thousand emails, and wait for a 2% conversion rate\u2014has collapsed under its own weight. Buyers are actively deploying filters against automated outreach, email providers have drastically tightened deliverability standards, and crowded social inboxes mean cold pitches are routinely ignored. \n\nThe response from revenue operations teams has historically been to bolt more tools onto an aging foundation. The result is a fragmented technology stack where sales representatives spend nearly 70% of their day managing data, writing contextless emails, and updating CRM records rather than actually selling. \n\nAs we assess the landscape in late 2026, a fundamental architectural shift has occurred. The market has definitively split into two distinct categories: **AI-assisted sales engagement** and the newer **autonomous AI SDR/agent** category. Traditional platforms are racing to integrate artificial intelligence to help humans work faster, while a new breed of AI agents is increasingly researching, personalizing, engaging, handling replies, and booking meetings completely autonomously.\n\nDesigning a modern AI sales stack requires moving away from linear, volume-based tools toward a centralized, signal-driven architecture. This guide details the core components of that modern stack, the distinct layers required for success, and how to orchestrate these technologies without burning your domain reputation or your social capital.\n\n![Architectural comparison diagram contrasting a linear legacy sales stack with a 4-layer modern AI sales stack loop.](https://assets.bevisible.app/inline-images/j575hk1eqz5enydczfdm8f99x58h2507/inline-1-1793380664216-bm8c5w.png)\n## The architectural shift: From static sequences to dynamic reasoning\n\nThe legacy sales tech stack was strictly linear. A lead was sourced from a database, pushed into a Customer Relationship Management (CRM) platform, routed to a Sales Engagement Platform (SEP), and subjected to a rigid, multi-step cadence. The only dynamic variable was whether the prospect replied. \n\nThe modern AI sales stack architecture operates on a continuous feedback loop. Instead of static lists, it relies on real-time buying signals. Instead of rigid templates, it utilizes large language models (LLMs) to reason about those signals and craft highly specific messaging. \n\nThis new architecture breaks down into four operational layers:\n1. **The Signal and Enrichment Layer:** Ingesting unstructured data and structuring it into actionable insights.\n2. **The Orchestration and Execution Layer:** Routing signals to the right channel and executing the outreach strategy.\n3. **The Autonomous Agent Layer:** Deploying digital workers to manage the end-to-end prospecting lifecycle autonomously.\n4. **The Authentic Interaction Layer:** Bridging the gap between automated volume and human trust, primarily through strategic social engagement.\n\nUnderstanding the distinction between these layers\u2014and the specific tools that dominate them\u2014is the first step in auditing your current technology footprint. \n\n## Layer 1: The Signal and Enrichment Layer (The Foundation)\n\nIf your data is bad, your AI will simply personalize a bad message faster. The foundational layer of the modern sales stack replaces static contact databases with dynamic orchestration engines that scrape, synthesize, and enrich data across dozens of distinct sources. \n\n### Waterfall enrichment and deep research\n\nHistorically, revenue teams purchased access to a single data vendor. If that vendor lacked a prospect's email or phone number, the lead was discarded. Today, the standard practice is \"waterfall enrichment.\" This methodology cascades a single query through multiple data providers in sequence until a verified result is found, maximizing coverage while controlling API costs.\n\n[Clay](https://www.clay.com/?utm_source=chatgpt.com) has emerged as the architectural standard for sophisticated outbound and revenue operations teams. Rather than acting purely as a database, Clay functions as a data orchestration platform. It allows operations teams to build highly customized workflows that combine real-time scraping, multiple enrichment providers, and localized AI prompts.\n\nFor example, an enterprise selling cloud security software no longer pulls a list of \"VPs of Engineering in California.\" Instead, they build a workflow in Clay that:\n1. Monitors job boards for companies actively hiring AWS security engineers.\n2. Cross-references those companies against their CRM to filter out existing customers.\n3. Enriches the surviving company list to find the specific hiring managers.\n4. Cascades through three different contact data providers to find verified mobile numbers.\n5. Feeds the company's recent 10-K filings into an LLM prompt to identify specific security vulnerabilities mentioned in the risk factors section.\n6. Drafts a hyper-personalized email premise based on that exact risk factor and the open job requisition.\n\nThis level of deep research, intent signal processing, and workflow automation transforms outbound from a volume game into a precision operation. It requires a fundamental shift in how RevOps teams think about data\u2014moving from static fields (Title, Industry, Revenue) to dynamic context (Recent hires, Technology stack changes, Executive turnover).\n\n![Step-by-step waterfall enrichment workflow diagram turning hiring intent signals into personalized sales context.](https://assets.bevisible.app/inline-images/j575hk1eqz5enydczfdm8f99x58h2507/inline-2-1793380668036-2aet7b.png)\n## Layer 2: The Orchestration and Engagement Layer (The Engine)\n\nOnce data is structured and enriched, it must be deployed. The orchestration layer encompasses the traditional sales engagement platforms, but these tools have evolved significantly to incorporate AI at every stage of the execution lifecycle.\n\nThis layer is dominated by three main approaches, each serving a different organizational maturity level.\n\n### The all-in-one starting point\n\nFor SMBs and mid-market organizations looking to consolidate their technology spend, [Apollo](https://www.apollo.io/) provides the most cohesive single-platform architecture. By combining a vast B2B contact database with a robust sequencing engine, Apollo eliminates the need to integrate separate enrichment and execution tools.\n\nIn an AI context, Apollo utilizes machine learning to prioritize tasks, suggest sequence optimizations, and generate personalized messaging based on the data it inherently holds. For a scaling team that lacks a dedicated RevOps engineer to manage complex API connections, this all-in-one architecture minimizes points of failure. The trade-off is flexibility; you are largely confined to the enrichment data and AI models native to the platform.\n\n### The mature enterprise engagement platforms\n\nEnterprise SDR organizations with hundreds of reps require stringent governance, advanced analytics, and deep CRM bidirectional syncing. In these environments, [Outreach](https://www.outreach.io/) and [Salesloft](https://www.salesloft.com/) remain the structural pillars. \n\nBoth platforms have aggressively integrated AI, transitioning from simple cadence execution to broader revenue orchestration. \n* **Outreach** focuses heavily on sequence optimization, using historical data across millions of emails to guide SDRs on timing, channel selection, and messaging effectiveness. Their AI assists in the engagement process, providing reps with suggested actions based on buyer sentiment analysis.\n* **Salesloft** approaches the challenge through buyer signals and conversation intelligence. By analyzing call transcripts and email replies, the platform uses AI to surface coaching opportunities, forecast deal health, and orchestrate follow-up cadences automatically based on the specific objections raised during a meeting.\n\nIn 2026, deploying these enterprise platforms requires treating them as execution engines rather than data sources. The most sophisticated architectures pass highly enriched, pre-reasoned data from a tool like Clay directly into a Salesloft or Outreach sequence, utilizing the SEP strictly for its deliverability management, multi-channel orchestration, and compliance guardrails.\n\n## Layer 3: The Autonomous Agent Layer (The Digital Worker)\n\nThe most disruptive architectural shift in the modern stack is the introduction of the autonomous AI SDR. Unlike engagement platforms that require a human rep to review tasks, hit \"send,\" and manage the inbox, autonomous agents handle the entire top-of-funnel lifecycle independently. \n\nThis is not a feature added to a legacy platform; it is an entirely distinct category of software architecture. \n\nWhen you look at tools like [11x](https://docs.11x.ai/help-center/get-started/what-is-11x?utm_source=chatgpt.com), the fundamental unit of scaling is no longer the human seat license, but the \"digital worker.\" Their primary AI agent, Alice, is designed to operate identically to a human SDR, but at algorithmic scale. \n\nThe architecture of an autonomous AI agent typically involves a multi-agent system working behind the scenes:\n1. **The Researcher Agent:** Continuously scans designated accounts, identifies target personas, and synthesizes intent data.\n2. **The Copywriter Agent:** Drafts messaging tailored to the specific prospect, constrained by brand voice guidelines and historical performance data.\n3. **The Inbox Manager Agent:** Monitors replies in real-time, categorizes the sentiment (e.g., Out of Office, Hard No, Objection, Meeting Request), and drafts appropriate multi-turn responses.\n4. **The Scheduler Agent:** Negotiates calendar availability and seamlessly books the meeting into the closing rep's calendar.\n\nDeploying an autonomous agent fundamentally changes sales math. If an enterprise can deploy a digital worker that costs a fraction of a human SDR's fully loaded salary and operates 24/7 without taking vacations, the cost of customer acquisition plummets. However, the failure mode here is profound. If the reasoning engine hallucinates, or if the targeting parameters are slightly misconfigured, an autonomous agent can alienate hundreds of tier-one accounts in a single afternoon.\n\nImplementing this layer requires strict oversight during the initial deployment phase. You must train the digital worker just as you would a human hire\u2014reviewing its initial drafts, correcting its handling of specific objections, and tightly restricting its total daily output until its accuracy rate exceeds your internal benchmarks.\n\n![Modular diagram showing the multi-agent architecture of an autonomous AI SDR across research, copywriting, inbox, and schedul](https://assets.bevisible.app/inline-images/j575hk1eqz5enydczfdm8f99x58h2507/inline-3-1793380665036-xwmf5i.png)\n## Layer 4: The Authentic Interaction Layer (The Human Bridge)\n\nAs companies scale their AI-assisted outbound and deploy autonomous agents, buyers have simultaneously adapted. The predictable consequence of cheaper, better-written cold emails is that buyers simply stop answering cold emails altogether. \n\nWhen every email in a decision-maker's inbox is perfectly researched, grammatically flawless, and highly personalized, personalization loses its novelty. It becomes table stakes. To bypass this crowded inbox environment, modern sales architectures are integrating social selling as a core, programmatic pillar rather than an ad-hoc SDR activity.\n\nHowever, traditional social automation has a massive flaw: it attempts to replicate the cold email playbook on platforms like LinkedIn. Cloud-based connection tools spam generic connection requests and immediate pitches into the direct messaging inbox. This approach not only violates platform terms of service\u2014risking permanent account bans\u2014but it also actively damages the brand's social capital. \n\nThe authentic interaction layer requires a completely different architectural approach. Instead of pushing outbound messages into a private inbox, it focuses on public visibility and strategic conversational entry points. This is where specialized tools designed for natural interaction patterns become necessary.\n\nFor teams looking to scale social selling without acting like a spam bot, commenting is the highest-leverage activity. Strategic comments on relevant industry posts put your profile directly in front of the author and their entire audience. It signals expertise, starts a genuine conversation, and naturally draws high-intent profile views that convert into connections and meetings.\n\nYou can explore the specific metrics and ROI of this methodology in our deep dive on [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth).\n\n### Architecting for local execution and account safety\n\nIntegrating social automation into your stack requires treating account safety as the primary technical constraint. \n\nMost legacy LinkedIn automation tools operate via cloud servers or generic APIs. When a tool logs into a user's account from an IP address in Virginia, while the user is simultaneously logged in on their phone in London, the platform's security algorithms immediately flag the anomalous behavior. Furthermore, cloud-based bots execute actions with inhuman speed and perfect intervals, triggering automated restriction protocols.\n\nTo protect revenue operations, the modern social layer must operate locally. Tools built on local execution architecture run directly on the user's machine, within their existing browser session. They share the same IP address, the same device fingerprint, and the same session cookies as the user's manual activity. By mirroring human interaction patterns\u2014introducing random delays, reading posts before engaging, and operating only during configured working hours\u2014local execution ensures the account remains secure.\n\nFor a detailed technical breakdown of how this localized approach circumvents standard bot-detection algorithms, review our guide: [Is Junior AI Safe to Use On Linkedin Source Page for Job Seekers, Sales Teams, Lead G](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin).\n\nWhen you pair an AI engine that drafts context-aware, human-sounding replies based on the user's unique bio with a secure, localized execution environment, you bridge the gap between automated scale and authentic human connection. \n\n## Building your stack: A mid-market SaaS scenario\n\nTo understand how these layers integrate, let's look at a concrete implementation scenario. \n\nConsider a scaling mid-market B2B SaaS company selling supply chain optimization software. They have a team of five Account Executives (AEs) and three SDRs. They are tasked with doubling pipeline in the next twelve months, but the CFO has frozen SDR headcount. \n\nTheir legacy stack consisted of a basic data provider and a legacy SEP. SDRs were spending hours manually researching supply chain directors and writing emails that yielded a 1.5% reply rate. \n\n**Phase 1: Upgrading the data foundation**\nThe RevOps team replaces the static data provider with Clay. They build a workflow that monitors logistics industry news for companies opening new distribution centers\u2014a massive intent signal for their software. Clay automatically enriches these companies, identifies the regional VP of Supply Chain, and verifies their contact information.\n\n**Phase 2: Deploying the orchestration engine**\nBecause they already have a highly structured data feed from Clay, they integrate Apollo strictly for execution. The enriched data\u2014including the specific news article about the new distribution center\u2014is passed into Apollo. Apollo's AI drafts a highly contextual email sequence focusing entirely on the logistical complexities of opening that specific facility. \n\n**Phase 3: Integrating the authentic interaction layer**\nWhile Apollo handles the email execution, the AEs and SDRs need to build trust and visibility in the logistics space. They deploy locally-executed comment automation to monitor LinkedIn for discussions about warehouse management, freight costs, and supply chain disruptions. \n\nThe AI drafts insightful, non-salesy comments based on each AE's specific industry background. By engaging in these public discussions natively, the AEs start seeing a 300% increase in inbound profile views from targeted supply chain directors. When the Apollo email sequence eventually hits those directors' inboxes, the AE's name is already familiar and trusted.\n\n**The Result:**\nWithout adding a single headcount, the team increased their outbound volume by 40% while simultaneously increasing their positive reply rate to 6%. By structuring their architecture around signals (Clay), reliable execution (Apollo), and authentic public visibility, they broke the linear constraints of the old predictable revenue model.\n\nFor founders and sales leaders wondering how these metrics compare to industry averages, our report on the [State of social selling benchmarks for startup founders](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders) provides a comprehensive baseline.\n\n![Workflow schematic showing coordinated social comment engagement alongside email outbound converging on target B2B accounts.](https://assets.bevisible.app/inline-images/j575hk1eqz5enydczfdm8f99x58h2507/inline-4-1793380668997-lxam13.png)\n## Myth-busting: AI won't replace your best reps, it replaces their worst habits\n\nA pervasive myth surrounding the modern AI sales stack is the concept of \"set it and forget it\" architecture. There is a persistent belief among some founders that they can buy an autonomous agent, plug it into an intent data feed, and simply watch the calendar fill with qualified meetings while the human sales team plays golf.\n\nThis is a fundamental misunderstanding of how enterprise B2B buying works.\n\nAI does not replace the requirement for trust, negotiation, and relationship building. What the AI sales stack actually does is strip away the repetitive, low-value administrative tasks that previously bloated the SDR role. It replaces the habit of sending generic check-in emails. It replaces the habit of manually copying and pasting data between a LinkedIn profile and a CRM field. \n\nThe goal of this architecture is to push human involvement lower down the funnel. If an AI agent can handle the research, the initial outreach, and the preliminary objection handling, the human AE can dedicate 100% of their cognitive load to actual selling\u2014running deep discovery calls, building business cases, navigating complex procurement departments, and closing revenue. \n\nIn high-ticket B2B sales, the human in the loop is not a bug; it is the ultimate closing feature.\n\n## The transition path: Bridging human SDRs and AI SDRs\n\nRipping out a legacy sales stack and replacing it entirely with autonomous agents and signal-driven workflows overnight is a recipe for operational disaster. The transition requires a phased approach to avoid AI tool fatigue and protect active pipeline.\n\n**Step 1: Audit and consolidate data**\nBefore introducing advanced AI execution, consolidate your enrichment strategy. Ensure that your CRM is clean and that you have a unified system of record. If you deploy an AI agent on top of bad CRM data, it will aggressively email your current customers pitching them your product.\n\n**Step 2: Pilot signal-based outbound**\nChoose one specific buying signal (e.g., recent funding, executive job changes, or specific hiring metrics). Build a workflow around that single signal and route it to your best-performing SDR. Let them use AI-assisted tools to draft the messaging, but keep a human reviewing every single email before it sends. \n\n**Step 3: Establish the social perimeter**\nSimultaneously, begin building social capital. Deploy comment automation for your founders and lead AEs to start establishing a footprint in your target market's daily feed. Ensure you are using tools that prioritize account safety over raw volume. For a deeper understanding of the technical safety mechanisms required during this phase, review [How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account).\n\n**Step 4: Introduce autonomous capabilities**\nOnce the signal-based workflow is proven and your social presence is established, you can begin testing autonomous capabilities. Start by allowing an AI agent to handle off-hours inbound lead response, or task it with re-engaging a cold list of closed-lost opportunities from the previous year. Monitor its interactions closely, refine its prompts, and slowly expand its operational mandate.\n\nYou are ultimately deciding whether to consolidate into a single platform or run a best-of-breed integrated stack. For an analysis of how different architectural approaches impact social selling specifically, you can read [Junior vs Aware: Choosing the right approach for social selling](https://www.heyjunior.ai/blog/junior-vs-aware-social-selling).\n\n## FAQs on AI sales stack architecture\n\n### What are the best AI engagement tools for B2B sales teams?\n\nThe \"best\" tool depends entirely on your organizational maturity and specific go-to-market motion.\n\n| Tool | Best for | Core architecture |\n|---|---|---|\n| **Apollo** | SMB / mid-market teams | All-in-one prospecting, data, and sequencing with built-in AI writing. |\n| **Clay** | RevOps / sophisticated outbound | Signal-based data orchestration and deep waterfall enrichment workflows. |\n| **Outreach / Salesloft** | Enterprise sales organizations | Complex multi-channel governance, sequence optimization, and conversation intelligence. |\n| **11x** | Teams scaling without headcount | Fully autonomous AI digital workers that research, draft, and handle multi-turn replies. |\n\n### How do you measure ROI on an AI sales tech stack?\n\nLegacy metrics like \"emails sent\" or \"calls made\" are irrelevant when evaluating AI architecture, as AI can generate infinite volume at zero marginal cost. Instead, ROI must be measured on efficiency and conversion velocity:\n* **Cost per Qualified Meeting (CPQM):** Has the cost of generating a tier-one meeting decreased?\n* **Rep Active Selling Time:** What percentage of your AEs' week is spent in client-facing meetings versus CRM administration?\n* **Signal-to-Meeting Conversion Rate:** Of the high-intent signals processed by your enrichment layer, how many translated into actual pipeline?\n\n### Is it better to use an all-in-one platform or integrate specialized AI tools?\n\nIf your sales team is under ten people and lacks a dedicated Revenue Operations manager, an all-in-one platform provides the fastest time-to-value with the lowest technical risk. You sacrifice the deepest levels of customization for operational stability.\n\nIf you have a dedicated RevOps function and are selling high-ticket enterprise deals, a best-of-breed integrated stack is mandatory. The ability to pipe highly specialized intent data into a dedicated execution engine, while running a localized social selling layer alongside it, provides a compounding competitive advantage that all-in-one tools cannot replicate.\n\nThe modern AI sales stack is not about buying software; it is about engineering a predictable system of revenue generation. By carefully selecting tools that align with your data architecture, execution requirements, and commitment to authentic interaction, you can build an outbound engine that scales infinitely without sacrificing the human element that ultimately closes the deal.", "created_at": "2026-11-02T16:49:22.777726+00:00", "updated_at": "2026-11-02T16:49:22.777732+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
