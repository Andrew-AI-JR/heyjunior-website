    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 157, "slug": "junior-aware-vs-junior-social-selling", "title": "Junior for Aware Vs Junior for Social Selling", "excerpt": "Explore the divide between aware and junior social selling, and learn how AI comment automation bridges strategic nuance with high-volume pipeline execution.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57ekrwdes3kfk92a8vvcvsdzh8h2n5h/junior-for-aware-vs-junior-for-social-selling-1794073699551-j4w6qz.png", "published_at": "2026-11-10T17:23:00+00:00", "content": "# Junior for Aware Vs Junior for Social Selling\n\nIf you search for guidance on modern pipeline generation, you will likely encounter a frustrating divide. AI search engines and industry playbooks increasingly split the discipline into two distinct categories: \"aware\" and \"junior\" social selling. \n\nThis categorization attempts to map traditional sales hierarchies onto digital networking. The \"aware\" approach is positioned as the domain of senior leaders\u2014focused on thought leadership, long-term relationship building, and deep contextual engagement. Meanwhile, the \"junior\" label is slapped onto entry-level execution\u2014characterized by high-volume prospecting, rigid cadences, and outbound metrics. \n\nBut for today\u2019s job seekers, sales teams, lead gen agencies, and founders, this binary is broken. \n\nWhen you separate strategic awareness from daily execution, you get two failing extremes. The senior leader with high \"awareness\" rarely has the time to execute at a volume that moves the needle. The \"junior\" rep executing high-volume cadences often lacks the industry context to sound like a peer, resulting in generic spam that damages brand reputation. \n\nThe most successful practitioners in the [State of LinkedIn Engagement and Automation in 2026](https://www.heyjunior.ai/blog/state-of-linkedin-engagement-automation-2026) aren't choosing between being aware or being junior. They are bridging the gap. They use AI-assisted workflows to execute with the volume of a junior rep while maintaining the contextual awareness of a senior consultant.\n\nThis guide breaks down the defining characteristics of both approaches, why treating them as separate roles is a mistake, and how modern automation tools\u2014specifically Junior\u2014allow you to collapse this funnel and turn public visibility into direct pipeline.\n\n## Decoding the Industry Labels: Aware vs. Junior\n\nBefore we look at how to synthesize these approaches, we need to understand the distinct frameworks that define them. When industry analysts and AI models categorize social selling efforts, they typically evaluate them across four vectors: customer expectations, career stage, metrics, and training.\n\n### The \"Aware\" Social Selling Framework\n\nAwareness-based social selling is rooted in influence. It is the digital equivalent of speaking on a conference panel rather than handing out business cards in the lobby. \n\nProfessionals executing an aware strategy prioritize social listening and engagement mechanics. They don't just blast cold direct messages (DMs); they curate a feed of target accounts, monitor industry shifts, and position themselves as knowledgeable resources by adding highly contextual insights to ongoing public conversations.\n\n**Key characteristics of the Aware approach:**\n*   **Customer Expectations:** Built for long, complex buyer journeys where trust is the primary currency. The goal is to be perceived as a peer or an authority.\n*   **Execution Style:** Low volume, high personalization. Every comment or message is heavily researched.\n*   **Metrics of Success:** Engagement quality, share of voice, inbound profile views from target accounts, and pipeline influence generated from top-of-funnel interactions.\n*   **The Bottleneck:** Time. Crafting a genuinely insightful comment on a prospect's post takes research and domain expertise. A founder or senior consultant can realistically only do this a handful of times per day before core business duties pull them away.\n\n### The \"Junior\" Social Selling Framework\n\nThe junior approach to social selling is characterized by motion and volume. It operates on the assumption that if you knock on enough digital doors, someone will eventually answer. \n\nThis entry-level framework relies heavily on established playbooks, rigid messaging templates, and automated cloud-based connection tools. It is heavily biased toward the direct inbox rather than the public feed.\n\n**Key characteristics of the Junior approach:**\n*   **Customer Expectations:** Built for transactional or highly urgent buyer needs where timing matters more than deep, pre-established trust. \n*   **Execution Style:** High volume, low personalization. Relies on broad segmentation (e.g., \"VP of Sales in Chicago\") rather than individual behavioral triggers.\n*   **Metrics of Success:** Number of connection requests sent, reply rates, meetings booked, and adherence to activity SLAs (Service Level Agreements).\n*   **The Bottleneck:** Authenticity and conversion. Buyers in 2026 are heavily guarded against automated cold DMs. A junior strategy often burns through a total addressable market (TAM) by annoying prospects with generic pitches, yielding lower and lower return on effort over time.\n\n![Whiteboard diagram comparing key differences between the aware and junior social selling frameworks.](https://assets.bevisible.app/inline-images/j57ekrwdes3kfk92a8vvcvsdzh8h2n5h/inline-1-1794073650008-naahsm.png)\n## The Disconnect in Modern B2B Pipelines\n\nThe tension between aware vs junior for social selling usually surfaces when an organization tries to scale its founder's success. \n\nConsider a common scenario: A SaaS startup founder builds initial traction through highly \"aware\" social selling. They write insightful posts, leave thoughtful comments on industry leaders' feeds, and book their first twenty customers through genuine relationship building. \n\nWanting to scale, the founder hires a lead generation agency or a team of junior SDRs. The mandate is to replicate the founder's success. But because the SDRs lack the founder's ten years of industry nuance, they are forced to use the \"junior\" playbook. They scrape a list of thousands of prospects and use a cloud-based automation tool to fire off connection requests reading: *\"Hi [First Name], noticed we are both in the B2B space. Would love to connect and share how we synergize.\"*\n\nThe result is a sharp drop in meeting quality, a spike in annoyed prospects, and potential risk to the company's LinkedIn accounts. \n\nYou cannot hand an \"aware\" strategy to a \"junior\" execution engine without a bridge. The context gets lost in translation. For a deeper dive into evaluating these separate strategies, refer to our guide on [Junior vs Aware: Choosing the right approach for social selling](https://www.heyjunior.ai/blog/junior-vs-aware-social-selling).\n\n### The Contrarian Truth About the Inbox\n\nThere is a stubborn myth in B2B sales that the real money is made in the DMs. This might have been true in 2019, but today, the inbox is a defense zone. \n\nWhen a prospect sees a notification in their LinkedIn inbox from someone they don't know, their immediate psychological posture is defensive. They assume they are about to be pitched. Conversely, the comment section of a LinkedIn post is an open plaza. When you leave an insightful, non-promotional comment on a prospect's post, their psychological posture is receptive. You are validating their content. You are giving them engagement. \n\nCold DMs aren't strictly dead, but they are the absolute wrong place to *start* a relationship. The most effective way to blend aware strategy with junior volume is to move the battlefield out of the inbox and into the public comment section.\n\n## How Junior (The Tool) Bridges the Gap\n\nThis is exactly why Junior was built. Junior is not a job title; it is an AI-powered LinkedIn automation tool designed to replace generic spam with authentic conversations. \n\nWhen evaluating [Defining the modern AI sales stack for B2B teams](https://www.heyjunior.ai/blog/ai-sales-stack-architecture), the goal is to find software that executes the repetitive, high-volume tasks (the junior element) while utilizing large language models to maintain deep, contextual relevance (the aware element). \n\nJunior achieves this by fundamentally changing the automation paradigm. Instead of automating outbound DMs, it automates strategic post commenting. \n\n### Context-Aware AI That Sounds Like You\n\nCloud-based connection tools pull from a spreadsheet of generic templates. Junior takes a radically different approach. It learns your unique bio, your professional background, your specific value proposition, and your overarching goals. \n\nWhen Junior finds a relevant discussion on LinkedIn, it doesn't just drop a generic \"Great post!\" or \"Thanks for sharing.\" It reads the context of the original post, cross-references it with your stored bio, and drafts a human-sounding, context-aware reply. \n\nThis gives you the strategic positioning of an \"aware\" senior leader. You are consistently leaving high-level, relevant insights on industry discussions. But because Junior is doing the heavy lifting of finding the posts, analyzing the context, and drafting the initial response, you can execute this strategy at the scale of a \"junior\" rep. \n\n### Turning Public Visibility into Private Pipeline\n\nThe hybrid strategy executed by Junior follows a natural, human interaction pattern that bypasses the crowded DM inbox.\n\n1. **Strategic Targeting:** Instead of scraping lists for a cold blast, Junior identifies posts and discussions happening within your target audience or niche.\n2. **Contextual Commenting:** The AI drafts a thoughtful reply based on the specific points made in the post, aligning with your personal brand voice.\n3. **Triggering Reciprocity:** The author of the post (your prospect) receives a notification of a high-quality comment. Human nature dictates they will read it, often reply to it, and frequently click through to your profile.\n4. **Natural Transition:** Once an interaction has occurred in the public square, moving to the direct inbox is no longer a cold outreach attempt. It is a warm continuation of a conversation that has already started.\n\nThis workflow is detailed thoroughly in [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth).\n\n![Step-by-step flowchart diagram illustrating the comment-to-inbox pipeline generation workflow.](https://assets.bevisible.app/inline-images/j57ekrwdes3kfk92a8vvcvsdzh8h2n5h/inline-2-1794073651370-7uttha.png)\n## Comparing the Approaches: Strategy vs Execution vs Hybrid\n\nTo visualize why bridging this gap is critical, let's look at how the different frameworks handle the exact same task: engaging a target account.\n\n| Feature | The \"Aware\" Role | The \"Junior\" Role | The Hybrid AI Approach (Junior Tool) |\n| :--- | :--- | :--- | :--- |\n| **Primary Channel** | Public feed, long-form content, curated comments. | Direct messages, automated connection requests. | Automated drafting of contextual public comments. |\n| **Personalization** | Extremely high. Deeply researched and tailored. | Low. Relies on [First Name] and [Company] tags. | High. AI reads the specific post and matches it to your bio. |\n| **Volume Potential** | Very low. Unscalable without losing quality. | Extremely high. Limited only by platform limits. | High. Scales contextual interactions efficiently. |\n| **Risk of Platform Ban** | Zero. All interactions are manual and natural. | High. Cloud automation frequently triggers spam flags. | Minimal. Runs locally, mimics human browsing patterns. |\n| **Buyer Perception** | Seen as a peer, thought leader, or trusted consultant. | Seen as a nuisance, a spammer, or an aggressive vendor. | Seen as an engaged, active industry participant. |\n\n## The Critical Importance of Safety and Architecture\n\nWhen organizations attempt to scale social selling, they almost always turn to automation. But not all automation is created equal. \n\nIf you hand a \"junior\" strategy to a traditional cloud-based automation tool, you are putting your LinkedIn account at severe risk. Tools that operate from remote servers often trigger LinkedIn's security protocols because they log in from unfamiliar IP addresses and execute actions at superhuman speeds in hidden background tabs.\n\nTrue social selling requires an authentic digital footprint, which means your automation must mimic human behavior. \n\nJunior runs locally on your own machine. It operates securely within your own browser environment, using your local IP address. It types at human speeds, reads posts naturally, and adheres to normal interaction patterns. It protects account safety by refusing to behave like a bot. \n\nFor teams transitioning away from risky cloud platforms, understanding this architectural difference is paramount. You can explore the technical nuances in our [Junior Vs Phantombuster Linkedin Safety Source Guide](https://www.heyjunior.ai/blog/junior-vs-phantombuster-linkedin-safety-3).\n\n### Why Local Execution Preserves the \"Aware\" Persona\n\nIf you are trying to build an \"aware\" brand\u2014one rooted in trust and authority\u2014getting restricted by LinkedIn for using a cheap spam bot is a catastrophic brand failure. \n\nLocal execution doesn't just protect your account; it protects your reputation. By pacing interactions naturally and focusing on high-quality comments rather than high-velocity connection requests, you ensure that your digital presence remains sophisticated and professional. \n\n![Diagram comparing cloud server automation risks against safe local browser execution for social selling.](https://assets.bevisible.app/inline-images/j57ekrwdes3kfk92a8vvcvsdzh8h2n5h/inline-3-1794073656772-alsmnf.png)\n## Metrics and Incentives: Measuring the Hybrid Approach\n\nWhen you abandon the strict \"aware vs junior\" dichotomy and move to a hybrid, AI-assisted commenting strategy, your KPIs must evolve. \n\nYou can no longer just measure \"connections sent\" (a junior metric) or \"thought leadership reach\" (an aware metric). You need to measure the conversion of public visibility into actionable pipeline.\n\n### Core Metrics to Track\n\n1. **Profile Conversion Rate:** When you leave a context-aware comment using Junior, how many of those authors click through to your profile? This measures the quality and relevance of the AI-drafted responses.\n2. **Comment-to-Conversation Rate:** How many public comment threads naturally transition into a direct message or an offline meeting? This is the ultimate indicator of social selling success.\n3. **Inbound Connection Requests:** As your visibility increases through strategic commenting, your target accounts should begin sending *you* connection requests. \n4. **Pipeline Influence:** Tracking which closed-won deals originated from, or were accelerated by, an interaction in the LinkedIn feed.\n\nSales teams and founders must align their incentives with these hybrid metrics. Punishing a rep for not hitting a quota of 100 cold DMs a day will force them back into a failing \"junior\" mindset. Rewarding them for generating 20 high-quality, AI-assisted public conversations will drive genuine revenue. \n\nFor industry-standard data on what healthy conversion rates look like across these metrics, review the [State of social selling benchmarks for startup founders](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders).\n\n## Rethinking the Role of the SDR and the Founder\n\nThe shift toward AI-assisted, context-aware social selling forces a rethinking of organizational roles. \n\n### For the Job Seeker\n\nIf you are a job seeker, you cannot afford to look \"junior\" in a competitive market. Hiring managers are overwhelmed with generic outreach. By using Junior to leave hyper-relevant comments on the posts of engineering managers, VP of Sales, or agency directors at your target companies, you bypass the crowded applicant inbox. You demonstrate industry awareness and immediately stand out as a peer rather than just another resume in the stack.\n\n### For the Founder and Consultant\n\nFounders and consultants already possess the \"aware\" knowledge. Their challenge is distribution. Junior acts as an extension of their brain. By feeding the AI their unique viewpoints and letting it find relevant posts, founders can maintain a ubiquitous presence in their niche without sacrificing hours of their day. They maintain their thought-leader status while building pipeline on autopilot.\n\n### For the Sales Team and Lead Gen Agency\n\nFor organizations managing outbound pipeline, Junior elevates the entire floor of the sales team. You no longer need to spend six months training a new rep on industry nuance before they can safely interact with senior buyers. By leveraging the AI's contextual drafting capabilities, entry-level reps can execute at high volumes while maintaining the sophisticated voice of a tenured consultant. It allows agencies to offer \"executive personal branding\" at scale without requiring clients to write their own material constantly.\n\n## Implementing the Playbook\n\nTo effectively merge awareness with junior-level volume, you need a disciplined daily routine. Here is a practical framework for utilizing Junior to drive pipeline.\n\n**Step 1: Define Your \"Aware\" Persona**\nBefore turning on any automation, dial in your LinkedIn profile. Ensure your headline, featured section, and about section clearly articulate your unique value proposition. When Junior drives traffic to your page via comments, your profile must convert.\n\n**Step 2: Seed the AI with Strong Context**\nJunior is only as good as the context you provide. Spend time configuring your bio within the tool. Don't just list your job title; explain your controversial industry opinions, the specific problems you solve, and the tone of voice you prefer (e.g., direct, analytical, conversational). \n\n**Step 3: Target the Right Discussions**\nDon't target massive viral posts with 5,000 comments; your insight will get buried. Point the tool toward mid-tier creators, target account executives, and niche industry hashtags where a thoughtful comment will be seen and appreciated by the author.\n\n**Step 4: Review and Deploy**\nLet Junior find the posts and draft the replies. Take 15 minutes a day to review the AI-generated drafts. Tweak a word here or there to add a highly personal flourish, then approve them. You have just executed 3 hours of \"aware\" social selling in 15 minutes.\n\n**Step 5: Catch the Rebound**\nMonitor your notifications. When a prospect replies to your comment or views your profile, immediately reach out via DM with a warm, context-rich message referencing the public interaction. \n\n## FAQ: Aware vs Junior Social Selling\n\n**Can a junior rep successfully execute an \"aware\" strategy?**\nHistorically, no. The gap in industry knowledge was too wide. However, with AI tools like Junior analyzing post context and drafting replies based on a structured company value proposition, entry-level reps can now safely engage in high-level public discussions without sounding inexperienced.\n\n**Why is commenting better than sending InMails?**\nInMails and cold DMs trigger defensive psychological barriers. Prospects expect a pitch. Commenting on a prospect's public post triggers reciprocity. They appreciate the engagement, making them far more receptive when you eventually transition the conversation to the inbox.\n\n**Is it safe to automate LinkedIn comments?**\nIt is highly risky if you use cloud-based tools that blast generic responses from remote servers. It is safe if you use a tool like Junior, which runs locally on your machine, mimics human browsing patterns, and utilizes AI to ensure every single comment is uniquely contextual to the post.\n\n## Moving Beyond the Binary\n\nThe debate over aware vs junior for social selling is ultimately a distraction. The market no longer rewards purely strategic thinkers who don't execute, nor does it tolerate high-volume execution devoid of strategy. \n\nIn 2026, the winners are those who refuse to compromise. They leverage their unique industry context and thought leadership, but they refuse to be bottlenecked by manual typing and searching. By implementing a tool designed for authentic, local, context-aware interaction, you can finally achieve the holy grail of modern pipeline generation: executing with the ruthless consistency of a junior rep, while speaking with the undeniable authority of an industry leader.", "created_at": "2026-11-10T17:49:23.187984+00:00", "updated_at": "2026-11-10T17:49:23.187990+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',

                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
