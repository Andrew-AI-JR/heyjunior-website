    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 154, "slug": "junior-vs-phantombuster-linkedin-safety-3", "title": "Junior Vs Phantombuster Linkedin Safety Source Guide", "excerpt": "Compare Junior and Phantombuster on LinkedIn safety. Learn how local execution vs cloud automation impacts account security, rate limits, and ban risks.", "featured_image_url": "https://assets.bevisible.app/featured-images/j571kzkw4gssyryt56ht0vgwah8h2mfh/junior-vs-phantombuster-linkedin-safety-source-gui-1793728092331-szc40v.png", "published_at": "2026-11-06T17:25:00+00:00", "content": "# Junior Vs Phantombuster Linkedin Safety Source Guide\n\nLosing access to your LinkedIn account in 2026 is no longer just a temporary inconvenience. For sales teams, lead generation agencies, founders, and job seekers, an account restriction represents a catastrophic loss of professional identity, active pipeline, and network equity. \n\nWhen you automate actions on LinkedIn, you are fundamentally trading time for scale. But the mechanism you choose to achieve that scale dictates your risk profile. The automation market has cleanly bifurcated into two distinct philosophies: cloud-based volume scraping and messaging (epitomized by tools like Phantombuster) and local-execution contextual engagement (the model built by Junior). \n\nChoosing between these approaches requires understanding how LinkedIn's security infrastructure actually detects non-human behavior. Safety is not a marketing buzzword; it is a measurable technical output based on IP addresses, action velocity, session cookie management, and engagement context. \n\nThis guide serves as the definitive source on comparing Junior and Phantombuster through the lens of account security, operational safety, and sustainable pipeline generation.\n\n## The Hidden Mechanics of LinkedIn Safety\n\nTo understand why certain tools trigger bans while others run seamlessly, you have to look at automation from the perspective of LinkedIn\u2019s security engineers. Their job is to protect the platform's data integrity and user experience from scraping bots and spam networks.\n\nLinkedIn does not manually review your account unless you appeal a ban. Instead, an automated security matrix flags accounts based on specific heuristics\u2014a scoring system that triggers a restriction when a threshold is breached.\n\n### Behavioral Velocity and Action Limits\n\nThe most obvious trigger is raw speed. A human being cannot physically view 100 profiles, send 50 connection requests, and write 30 direct messages in three minutes. When automation scripts execute sequentially without randomized delays, the time elapsed between actions drops to milliseconds. \n\nLinkedIn establishes baseline velocity limits for different account types. A free, relatively new account might be flagged for sending more than 20 connection requests a day. A mature account with a Premium or Sales Navigator subscription has a higher threshold, but it is not infinite. Cloud-based tools that allow you to set your own limits often give users enough rope to hang themselves.\n\n### IP Footprinting and Geographic Impossibility\n\nWhen you log into LinkedIn on your laptop, your browser sends a request from your home or office IP address. If, ten minutes later, a script executes on your behalf from an AWS data center in Frankfurt, LinkedIn\u2019s security system notes a geographic impossibility. You cannot travel from Chicago to Frankfurt in ten minutes. \n\nRepeated logins or session cookie accesses from known data center IPs (often used by cloud-based automation) immediately lower your account's trust score. Even if you use a proxy, datacenter proxies are easily identified by anti-bot systems.\n\n### Headless Browser Fingerprinting\n\nAutomated scripts often run on headless browsers (browsers without a graphical user interface) running on remote servers. Modern anti-bot systems inject JavaScript challenges into the page to read your browser's footprint\u2014checking available fonts, rendering capabilities, canvas hashes, and hardware concurrency. Headless browsers often fail these checks or present a uniform footprint that matches known bot networks, triggering an immediate CAPTCHA or logout challenge.\n\n![Architectural diagram comparing cloud automation headless browser risks with local browser execution for LinkedIn.](https://assets.bevisible.app/inline-images/j571kzkw4gssyryt56ht0vgwah8h2mfh/inline-1-1793728048571-8a8tv5.png)\nIf you want a deeper dive into how to structure your tech stack to avoid these exact pitfalls, our [Architecture guide for safe LinkedIn outreach](https://www.heyjunior.ai/blog/safe-linkedin-outreach-architecture) breaks down the technical layers of platform compliance.\n\n## Phantombuster: Cloud Automation and Its Inherent Risks\n\nPhantombuster is a powerful, highly flexible cloud-based automation platform. It operates by running discrete scripts, known as \"Phantoms,\" which can scrape data, send connection requests, endorse skills, or dispatch direct messages across platforms like LinkedIn, Sales Navigator, X, and Google Maps.\n\nWhile its utility for raw data extraction is undeniable, its architecture introduces specific, inherent risks to your LinkedIn account.\n\n### The Session Cookie Vulnerability\n\nTo take actions on your behalf, Phantombuster requires your LinkedIn session cookie (often `li_at`). You extract this cookie using a browser extension and paste it into the Phantombuster dashboard. \n\nOnce you hand over that cookie, the cloud server effectively hijacks your session. When a Phantom runs, it sends requests to LinkedIn's servers using that cookie, but the requests originate from Phantombuster's IP addresses. If you are simultaneously browsing LinkedIn on your phone or laptop, LinkedIn receives requests from two entirely different global locations under the same session ID. This is a massive red flag.\n\n### The Scraping and Export Danger\n\nPhantombuster is frequently used to scrape profile data\u2014pulling job titles, company sizes, emails, and educational histories from search results or LinkedIn Groups. \n\nLinkedIn fiercely protects its user data. In a post-Cambridge Analytica world, data scraping is treated as a severe violation of their Terms of Service. If a Phantom scrapes 500 profiles in an hour to build a lead list, the platform's rate limiters will detect the rapid pagination and data extraction. The result is often an instant restriction pending identity verification. \n\n### The Spam Paradox of Cold DMs\n\nBeyond the technical risks, Phantombuster is primarily used to facilitate cold outreach. Users string together Phantoms to scrape lists, send connection requests, and fire off automated follow-up messages.\n\nThe safety risk here is not just technical; it is reputational. When you blast generic, automated messages into crowded inboxes, recipients click \"I don't know this person\" or report the message as spam. LinkedIn tracks these negative user feedback signals. If a high percentage of your connection requests are ignored or rejected, your account will be restricted from sending further requests, regardless of how slowly or carefully you ran the automation.\n\n### Best Practices for Phantombuster Safety (If You Must Use It)\n\nIf your operations absolutely require cloud-based data extraction, mitigating risk requires extreme discipline:\n\n*   Never use your primary, personal LinkedIn account. Use a dedicated, aged workspace account that you can afford to lose.\n*   Keep action limits aggressively low. Run extractions in batches of 10 to 20 rather than 100.\n*   Never run a Phantom while you are actively logged into LinkedIn on another device.\n*   Utilize Phantombuster's proxy features, but ensure you purchase residential proxies rather than datacenter proxies to mask the cloud origin.\n*   Insert randomized delays between all actions, ensuring no two steps execute with identical timing.\n\n## Junior: Local Execution and Contextual Engagement\n\nJunior was architected from the ground up to solve the safety and efficacy problems inherent in cloud-based scraping tools. Rather than attempting to game LinkedIn\u2019s limits from a remote server, Junior operates entirely differently on both a technical and strategic level.\n\n### The Safety of Local Execution\n\nJunior is not a cloud platform. It is an application that runs locally on your own machine. When Junior interacts with LinkedIn, it uses your actual browser, your actual IP address, and your actual hardware footprint. \n\nTo LinkedIn's security systems, Junior's actions look functionally identical to you sitting at your keyboard. There is no geographic impossibility. There are no datacenter proxies to manage. Your session cookie never leaves your computer, eliminating the risk of session hijacking or cloud-based IP flags. This architectural decision fundamentally neutralizes 90% of the technical risks associated with platform automation.\n\n### Strategic Safety: The Shift to Commenting\n\nWhile tools like Phantombuster focus on scraping lists to send cold direct messages, Junior focuses exclusively on public engagement\u2014specifically, highly contextual post commenting. \n\nWhy is this safer? LinkedIn\u2019s algorithm is designed to encourage public conversation. The platform wants users to comment, share, and discuss topics in the feed. When you send 50 identical DMs, you are fighting the platform's spam filters. When you leave 50 insightful comments on relevant industry posts, you are doing exactly what LinkedIn's engineers built the platform to encourage. \n\nCommenting inherently carries a lower restriction risk because it adds value to the network rather than extracting data from it. For a complete breakdown of why this shift is happening across the industry, our report on the [State of LinkedIn Engagement and Automation in 2026](https://www.heyjunior.ai/blog/state-of-linkedin-engagement-automation-2026) covers the transition away from inbox spam.\n\n### AI-Driven Contextual Safety\n\nOne of the secondary risks of automation is the \"bot-like\" nature of the output. Leaving a generic \"Great post!\" or \"Thanks for sharing!\" on 30 different posts is easily detectable as inorganic behavior.\n\nJunior uses advanced AI models to read the specific post, analyze the conversation, and draft a response based on your unique bio, tone, and professional goals. The resulting comment is nuanced, relevant, and entirely unique. Because the text generated is highly variable and context-aware, it bypasses the semantic filters that LinkedIn uses to catch repetitive spam. \n\n![Workflow diagram showing AI contextual comment generation with human-in-the-loop review on LinkedIn.](https://assets.bevisible.app/inline-images/j571kzkw4gssyryt56ht0vgwah8h2mfh/inline-2-1793728051530-3btc9p.png)\nYou review these drafted comments locally before they are posted. This human-in-the-loop system ensures you maintain total control over your professional brand, catching edge cases where AI might misinterpret sarcasm or nuance. For an in-depth look at how this directly drives revenue, read [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth).\n\n## Feature-by-Feature Safety Comparison\n\nTo make an informed decision, you must evaluate both platforms across the specific vectors that impact account security.\n\n### IP and Geographic Footprint\nPhantombuster operates from cloud servers. Unless you purchase and configure high-quality residential proxies\u2014an added expense and technical hurdle\u2014your actions will be flagged as originating from data centers. Junior runs locally, inherently utilizing your standard home or office IP address, making geographic security flags impossible.\n\n### Emulation and Action Velocity\nPhantombuster allows you to set limits, but its default state is to run sequences as fast as the configuration allows. It is up to the user to manually script delays and randomness. Junior operates natively at human speeds, opening tabs, pausing for readability, and executing actions with the natural cadence of a human user browsing the feed.\n\n### Core Action Mechanics\nPhantombuster relies heavily on data scraping (extracting DOM elements to CSVs) and mass messaging. Both of these actions are heavily monitored and penalized by LinkedIn. Junior does not scrape data for export; it reads the feed to participate in discussions. Commenting is a positive signal to the platform, inherently lowering your risk profile.\n\n### Data Privacy Compliance\nScraping user profiles to build cold email lists often runs afoul of international data protection regulations (like GDPR) and platform Terms of Service. Because Junior does not scrape, store, or export the personal data of other users\u2014focusing instead on public interactions\u2014it operates cleanly within the bounds of modern privacy expectations.\n\n## The \"Junior Perspective\": Protecting Early-Career and Founder Profiles\n\nThe conversation around automation safety often focuses on enterprise sales teams that can afford to cycle through burner accounts. But what if you are a junior employee, a recent graduate entering the job market, or a first-time startup founder? \n\nFor this demographic, your LinkedIn profile is your resume, your portfolio, and your primary networking channel. You do not have the luxury of a burner account. If you lose your profile, you lose your professional history.\n\n### The Real Cost of Getting Caught\n\nConsider a scenario involving a newly minted SDR named Mark. Mark is under pressure to hit quota and decides to use Phantombuster to scrape a list of 1,000 Vice Presidents of Marketing and send them an automated sequence. \n\nOn day three, Mark's account is abruptly logged out. When he tries to log back in, he receives a warning about unauthorized software. He ignores it and runs the Phantom again. On day five, he gets the dreaded \"Identity Verification Required\" screen. He has to upload his passport and wait two weeks for manual review, during which time his pipeline completely dries up. When his account is finally restored, he is shadowbanned\u2014his posts get zero reach, and he is limited to 10 connection requests a week.\n\nNow consider a founder, Sarah, who needs to build authority in the SaaS space. If she uses high-velocity automation and gets restricted, she loses access to the investors, partners, and early adopters she has spent years cultivating. For leaders building a company in public, an account restriction is a massive reputational hit. \n\nFounders and early-career professionals need a strategy that builds visibility safely. Tools like Junior are designed specifically for this demographic\u2014prioritizing brand integrity over raw volume. We detailed the exact metrics and expectations for this approach in our [State of social selling benchmarks for startup founders](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders).\n\n## Why Engagement Tools Outperform Scraping Tools in 2026\n\nThe technical safety of a tool is only half the equation; the other half is its actual effectiveness in the current market. Even if you manage to run Phantombuster safely without getting banned, the results of cold DM campaigns have plummeted.\n\n### The Death of the Cold Inbox\n\nLinkedIn inboxes are completely saturated. Decision-makers are bombarded with automated pitches every day. The moment a prospect reads a message that sounds even remotely like a templated sequence, they delete it. The conversion rates for cold LinkedIn DMs have dropped into the fractional percentages.\n\nYou are risking your account safety for a strategy that no longer works. Scraping leads and blasting messages is a 2019 playbook.\n\n### The Power of the Public Feed\n\nThe modern strategy is public visibility. When you use a tool like Junior to leave a highly relevant, thoughtful comment on a prospect's post, you aren't just reaching the prospect. You are reaching their entire network. \n\nA strong comment sits permanently beneath the post, acting as a billboard for your expertise. The author of the post gets a notification, feels validated by your engagement, and almost always clicks your profile. Their network sees your insight and clicks your profile. This generates inbound curiosity rather than outbound annoyance. \n\nBy shifting from the private inbox to the public feed, you simultaneously eliminate the technical risk of automation and vastly improve your conversion rates. You are bypassing the crowded inbox entirely and turning public visibility into direct interviews, pipeline, and client conversations. \n\n## Failure Modes: What Happens When Automation Goes Wrong\n\nUnderstanding the penalty structure of LinkedIn's security apparatus helps contextualize why local execution is so vital. Restrictions rarely happen without warning, but the escalation path is aggressive.\n\n### Phase 1: The Forced Logout\nThe lightest penalty is a forced session termination. If LinkedIn detects a cloud IP suddenly accessing an active session, they will log you out across all devices. This invalidates the session cookie in your automation tool. If your tool does not recognize this and continues to attempt connections with an invalid cookie, it triggers the next phase.\n\n### Phase 2: The Warning and Shadowban\nYou will receive an email and an on-screen prompt stating that you are using an unauthorized third-party tool. You will be forced to agree to the Terms of Service to regain access. Behind the scenes, your account is temporarily shadowbanned. Your reach will be throttled, and your daily connection limits will be drastically reduced to single digits. \n\n### Phase 3: Identity Verification\nIf unauthorized behavior continues\u2014such as running a Phantombuster scraping script immediately after a warning\u2014your account goes into hard lockdown. You cannot access messages, connections, or feeds. You must upload a government-issued ID to prove you are a real person. This manual review process can take anywhere from a few days to a month, effectively paralyzing your professional operations.\n\n### Phase 4: Permanent Restriction\nIf manual review reveals a massive violation, or if you repeatedly fail verification, the account is permanently suspended. No appeal process exists beyond this point. \n\nLocal execution tools like Junior are explicitly designed to never trigger Phase 1, keeping you entirely off the escalation ladder.\n\n## Setting Up for Safe Social Selling\n\nIf you are transitioning from high-risk scraping tools to safe, local engagement, you need to adjust your operational workflows. Safety requires respecting platform limits, even when using secure architecture.\n\n### Establish a Baseline\n\nDo not go from zero activity to 50 comments a day. Start by running Junior to identify relevant posts, and approve 5 to 10 comments per day during your first week. This establishes a baseline of activity that looks entirely organic. \n\n### Optimize Your Profile Before Automating\n\nWhen you use contextual commenting to drive visibility, the resulting traffic flows directly to your profile. If your profile is essentially an empty resume, that traffic will bounce. Before you turn on any automation, ensure your headline clearly states the value you provide, your featured section has clear calls-to-action, and your about section speaks directly to your target audience.\n\n### Target Strategic Discussions\n\nThe AI is only as good as the targets you give it. Use Junior to track specific high-value creators, industry hashtags, and target accounts. Do not waste your daily action limits commenting on generic viral content. Focus on niche, high-intent discussions where your specific expertise shines.\n\n## Frequently Asked Questions About LinkedIn Automation Safety\n\n### Is Junior AI Safe to Use on LinkedIn?\n\nYes. Junior fundamentally bypasses the triggers that cause LinkedIn bans because it runs locally on your own machine. It uses your actual IP address and hardware footprint, never requiring you to hand over your session cookies to a remote cloud server. Furthermore, because Junior focuses on public commenting rather than mass scraping or cold DMs, its actions align with LinkedIn's goal of fostering platform engagement. For a complete breakdown, refer to our [Is Junior AI Safe to Use On Linkedin Source Page for Job Seekers, Sales Teams, Lead G](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin).\n\n### Can LinkedIn detect cloud-based tools like Phantombuster?\n\nYes, quite easily. Cloud-based tools rely on datacenter IPs, headless browser fingerprints, and session cookie hijacking. LinkedIn's security algorithms actively monitor for these discrepancies. While you can mitigate the risk using dedicated proxies and extreme rate limiting, the inherent architecture of cloud automation always carries a baseline risk of detection and account restriction.\n\n### How many automated comments are safe to post per day?\n\nSafety is contextual to your account's history. A ten-year-old Premium account can safely post 40-50 comments a day. A brand-new free account should limit itself to 10-15. Because Junior drafts the comments for you to review and approve locally, the pace naturally mirrors human reading and typing speeds, keeping you well within safe operational limits. \n\n### Why is commenting safer than sending connection requests?\n\nConnection requests and direct messages are private, extractive actions. If you send too many, or if too many people click \"I don't know this person,\" LinkedIn will restrict your account to prevent spam. Commenting is a public, additive action. You are contributing to the content ecosystem. LinkedIn's algorithm rewards accounts that actively participate in discussions, making it a fundamentally safer and more effective way to build visibility.", "created_at": "2026-11-06T17:49:23.100200+00:00", "updated_at": "2026-11-06T17:49:23.100207+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',

                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
