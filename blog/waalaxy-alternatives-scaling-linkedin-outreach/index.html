    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 107, "slug": "waalaxy-alternatives-scaling-linkedin-outreach", "title": "Waalaxy Alternatives for Software for Scaling Linkedin Outreach Without Spamming", "excerpt": "Discover the best Waalaxy alternatives to safely scale LinkedIn outreach. Learn how AI commenting, local execution, and smart multichannel tools beat spam.", "featured_image_url": "https://assets.bevisible.app/featured-images/j574h6ffkpce6s6qqmd16gcwcx8d6mx7/waalaxy-alternatives-for-software-for-scaling-link-1789836494179-v650fi.png", "published_at": "2026-09-19T16:39:00+00:00", "content": "# Waalaxy Alternatives for Software for Scaling Linkedin Outreach Without Spamming\n\nThe era of the \"pitch slap\" is officially over. If your current LinkedIn strategy relies on loading thousands of prospects into a sequence, hitting start, and hoping a generic \"I saw we work in the same industry\" message yields a meeting, you are likely burning through your total addressable market while actively damaging your brand reputation. \n\nFor years, tools like Waalaxy popularized this volume-based approach. They made it incredibly easy to scrape a Sales Navigator list, build a visual campaign, and fire off connection requests at scale. But LinkedIn\u2019s algorithmic landscape and user psychology have shifted dramatically. Technical limits\u2014most notably the rolling cap on connection requests\u2014mean you can no longer brute-force your way into a prospect's inbox. More importantly, the psychological spam filter of the average B2B buyer is higher than ever. If a message looks automated, it gets ignored. \n\nTo scale LinkedIn outreach safely today without triggering spam filters or annoying prospects, you need software that mimics human behavior, uses dynamic AI context, or completely flips the script by focusing on public engagement rather than private messaging. \n\nWhether you are a founder looking to build pipeline, a sales team navigating stricter LinkedIn limits, or an agency managing multiple accounts, this guide explores the top Waalaxy alternatives and the software required to scale genuine relationships without resorting to spam.\n\n## The Problem with Traditional LinkedIn Automation\n\nBefore looking at alternatives, it is crucial to understand why standard automation strategies fail in the current environment. Relying on simple, linear connection-and-message sequences introduces three distinct failure modes.\n\n![Hand-drawn style diagram showing the technical, algorithmic, and psychological spam filters of LinkedIn outreach.](https://assets.bevisible.app/inline-images/j574h6ffkpce6s6qqmd16gcwcx8d6mx7/inline-1-1789836448960-a17u9v.png)\n### 1. The Technical Spam Filter (Account Restrictions)\nLinkedIn actively monitors accounts for non-human behavior. When tools inject code directly into your browser or fire API requests at impossible speeds, LinkedIn\u2019s security systems flag the account. The initial consequence is a temporary restriction, but repeat offenses lead to permanent bans. Even if a tool bypasses detection, hitting LinkedIn\u2019s velocity limits (such as sending dozens of connection requests within an hour) signals automated abuse.\n\n### 2. The Algorithmic Spam Filter (The \"Other\" Inbox)\nLinkedIn filters messages from users outside an individual's immediate network, especially if the sender has a low connection acceptance rate. If you send 100 automated connection requests and only 10 are accepted, LinkedIn interprets your outreach as low-quality. Consequently, your messages are more likely to be routed away from the primary inbox or flagged as irrelevant, drastically reducing your visibility.\n\n### 3. The Psychological Spam Filter (Buyer Fatigue)\nThis is the most critical hurdle. B2B buyers can spot an automated sequence from a mile away. Static variables like `{{first_name}}` and `{{company_name}}` are no longer enough to simulate personalization. When a prospect receives a message that reads, \"Hi John, I see you work at Acme Corp. We help companies like Acme Corp scale,\" their brain immediately categorizes it as spam. You haven't earned the right to pitch because you haven't demonstrated any actual understanding of their specific problems.\n\n## Why Teams Are Moving Away from Waalaxy\n\nWaalaxy remains a popular, budget-friendly option for entry-level LinkedIn outreach. It features an intuitive visual campaign builder and allows for basic multichannel sequencing. However, as teams mature in their go-to-market strategies, they often outgrow its capabilities for several reasons:\n\n*   **Over-reliance on the Inbox:** Waalaxy is fundamentally designed to automate direct messages. As response rates to cold DMs plummet industry-wide, teams need tools that facilitate different types of interaction, such as commenting and profile warming.\n*   **Variable-Based Personalization Limitations:** While you can insert custom fields, generating truly dynamic, context-aware messaging at scale requires deep AI integration that goes beyond basic text substitution.\n*   **Safety Concerns with Volume:** Pushing the absolute limits of LinkedIn's connection allowances using cloud extensions often results in account warnings. Practitioners are shifting toward tools that either use highly secure dedicated IPs or run locally to mimic genuine user behavior.\n\nIf you are evaluating [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), you must transition from a mindset of *volume* to a mindset of *relevance*. \n\n## Evaluating Outreach Architecture: Cloud vs. Local vs. Commenting\n\nWhen selecting software to scale outreach, the underlying architecture determines both the safety of your account and the type of strategy you can execute. \n\n### Cloud-Based Dedicated IP Tools\nThese platforms operate on external servers. To keep your account safe, the best cloud tools assign a dedicated, country-specific IP address to your profile. This ensures LinkedIn doesn't see your account logging in from New York and Tokyo within the same hour. Cloud tools are ideal for running multichannel campaigns (LinkedIn plus email) around the clock without requiring your computer to be on. \n\n### Local Execution Tools\nInstead of running on a server, local execution tools run directly on your machine, leveraging your actual IP address and browser session. This is arguably the safest method for interacting with LinkedIn because the traffic originates exactly where your normal daily browsing originates. It perfectly mimics human behavior because, from LinkedIn's perspective, it *is* human behavior.\n\n### Comment-First Engagement Tools\nA newer category of software entirely bypasses the cold DM problem. Instead of sending connection requests, these tools find highly relevant posts within your niche and help you drop insightful, context-aware comments. This strategy turns public visibility into inbound connection requests and direct messages.\n\n## Top Software for Scaling LinkedIn Outreach Without Spamming\n\nThe tools below represent the best alternatives for moving beyond basic automation and scaling your outreach effectively and safely.\n\n### 1. Junior: Best for Engagement-Led, Comment-First Growth\n\nMost automation platforms try to make cold pitching more efficient. Junior takes a fundamentally different approach: it abandons the cold DM entirely in favor of strategic public engagement. \n\nIf your goal is to start authentic conversations, generic direct messages rarely work. Junior operates on the premise that leaving a thoughtful, highly relevant comment on a prospect's post\u2014or a post they are actively engaging with\u2014is infinitely more valuable than sending them an uninvited pitch. \n\n**How it prevents spamming:**\nJunior is an AI-powered LinkedIn automation tool designed to turn public visibility into direct interviews, pipeline, and client conversations. Serving job seekers, sales teams, agencies, and founders, it replaces cold DMs by finding relevant discussions across LinkedIn. It then drafts context-aware, human-sounding replies based on your unique bio, tone, and goals. \n\nUnlike cloud-based connection tools that run on external servers, Junior runs locally on your machine. This protects your account safety by utilizing your own IP address and natural interaction patterns. You are never spamming inboxes; you are adding value to public discussions, which naturally leads prospects to view your profile and initiate contact.\n\n**Ideal Use Case:**\nFounders, consultants, and agencies who want to build authority and attract inbound leads without risking their reputation through automated pitching. If you are currently evaluating [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), Junior is the choice for engagement-led growth.\n\n### 2. Expandi: Best for Cloud-Based Volume and Safety\n\nExpandi is widely considered the gold standard for cloud-based, LinkedIn-only volume. If your strategy still requires direct messaging and connection requests, Expandi provides the infrastructure to do it as safely as possible. According to [salescaptain.io](https://www.salescaptain.io/blog/linkedin-outreach-automation-tools), Expandi is a robust platform designed for multichannel outreach that supports highly personalized campaigns.\n\n**How it prevents spamming:**\nExpandi focuses heavily on account safety. It uses dedicated, country-specific IP addresses so your login locations remain consistent. Furthermore, it employs \"Mobile Connector\" technology, which routes some actions through simulated mobile environments to bypass certain desktop restrictions safely. Expandi also forces randomized delays between actions, ensuring your outreach doesn't look like a machine firing off 50 messages in three seconds.\n\n**Ideal Use Case:**\nSales teams that have highly targeted lists and need reliable, background execution of complex messaging sequences.\n\n![Comparison breakdown diagram of cloud dedicated IP, local execution, and comment-first LinkedIn outreach architectures.](https://assets.bevisible.app/inline-images/j574h6ffkpce6s6qqmd16gcwcx8d6mx7/inline-2-1789836445262-61crel.png)\n### 3. Overloop: Best for Multichannel Sequences\n\nRelying solely on LinkedIn for outreach limits your touchpoints. Overloop is an AI-driven multichannel tool that combines LinkedIn sequences with cold email and phone outreach. \n\n**How it prevents spamming:**\nOverloop reduces the reliance on LinkedIn spam by spreading your touchpoints across different mediums. Instead of sending three aggressive LinkedIn messages in a row, Overloop allows you to view a prospect's profile on LinkedIn, send a highly personalized email two days later, and follow up with a LinkedIn connection request referencing the email. This holistic approach warms up audiences before connecting, reducing the friction and perceived \"spamminess\" of the interaction.\n\n**Ideal Use Case:**\nB2B sales teams running account-based marketing (ABM) campaigns where multiple touchpoints across different channels are necessary to break into an account.\n\n### 4. HeyReach: Best for Agency Multi-Account Scaling\n\nWhen a lead generation agency needs to scale outreach, they often run into the problem of account limits. You cannot send 1,000 connection requests a week from one profile. HeyReach solves this by allowing teams to connect dozens of LinkedIn accounts to a single campaign.\n\n**How it prevents spamming:**\nInstead of overloading a single inbox and risking restriction, HeyReach distributes the outreach volume across a pool of connected accounts. A campaign that needs to reach 500 prospects will pull from five different sender profiles, keeping each individual account well within LinkedIn's safety limits. It centralizes all replies into a unified inbox, making it easy for SDRs to jump in and have real, manual conversations once a prospect replies.\n\n**Ideal Use Case:**\nLead generation agencies or high-velocity sales teams that need to maximize outreach scale without compromising individual account safety.\n\n### 5. PhantomBuster: Best for Data Extraction and Custom Workflows\n\nPhantomBuster is not a traditional sequence builder; it is a heavy-duty data extraction and task-automation tool. For highly technical users, it acts as the connective tissue between LinkedIn and other platforms like CRMs or AI generation tools. As noted by [botdog.co](https://www.botdog.co/blog-posts/linkedin-outreach-automation-tools), PhantomBuster is ideal for sales teams and businesses that want to automate lead generation at a granular level. Furthermore, Reddit's B2B marketing community highlights that if you are technical and want maximum flexibility, PhantomBuster is the tool of choice.\n\n**How it prevents spamming:**\nPhantomBuster doesn't force you into generic messaging sequences. Instead, you can use it to build intricate \"warm-up\" workflows. For example, you can scrape a list of users who attended a specific LinkedIn Event, automatically view their profiles, and extract their data to run through a custom OpenAI prompt for personalization. \n\n*Note: Because PhantomBuster is a blank canvas, it is easy to accidentally build a spammy workflow if you aren't careful. If you are looking for safer, more guided engagement, reviewing an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) or exploring [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is highly recommended.*\n\n### 6. Dripify: Best for Advanced Logic Flows\n\nDripify is often compared to Waalaxy due to its strong visual sequence builder, but it offers far superior conditional logic. \n\n**How it prevents spamming:**\nDripify prevents you from sending inappropriate follow-ups through advanced \"if/then\" branching. If a prospect views your profile but doesn't accept your connection request, Dripify can route them to a specific nurturing sequence rather than blindly sending another pitch. It also features an algorithm that slowly ramps up your daily activity limits to naturally warm up your account.\n\n## The \"No-Spam\" Playbook: How to Actually Scale Conversations\n\nChoosing the right software is only half the battle. If you load terrible messaging into a great tool, you are still spamming. To scale LinkedIn outreach effectively in 2026, you must adopt a framework based on relevance and timing.\n\n### Phase 1: Profile Optimization (The Foundation)\nBefore you automate anything, your profile must convert. When you engage with someone, the very first thing they do is click your name. If your headline reads like a sales pitch (\"I help X achieve Y by doing Z\"), their guard immediately goes up. \n\nYour profile should look like an authoritative resource, not a landing page. Highlight your specific expertise, share actionable content, and make your bio about the problems you solve for the industry, not just the features of your product.\n\n### Phase 2: Engagement-Led Warm-up\nDo not start by asking for time. Start by offering attention. According to recent trends in the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), utilizing software to find and engage with relevant posts is the highest-converting first touchpoint.\n\nInstead of a cold DM, use a tool like Junior to surface posts from your target accounts. Leave a thoughtful, context-aware comment that adds to their discussion. This does two things:\n1. It validates the prospect (everyone loves engagement on their posts).\n2. It puts your name and headline directly in their notifications in a positive, non-threatening way.\n\n![Step-by-step flowchart of the 4-phase no-spam LinkedIn outreach strategy from public comment to inbox.](https://assets.bevisible.app/inline-images/j574h6ffkpce6s6qqmd16gcwcx8d6mx7/inline-3-1789836446715-7n4vsx.png)\n### Phase 3: The Contextual Connection Request\nIf you have properly engaged with a prospect publicly, the connection request becomes incredibly easy. You no longer need to invent a reason to connect. \n\n*Bad Request:* \"Hi Sarah, I see you are in marketing. I'd love to connect and share some synergies.\"\n*Good Request:* \"Hi Sarah, really enjoyed your recent post on attribution models. Your point about dark social was spot on. Would love to stay connected.\"\n\nNotice that the good request doesn't ask for a meeting. It merely establishes a digital relationship based on demonstrated mutual interest. \n\n### Phase 4: Transitioning to the Inbox\nOnce connected, do not immediately pitch. Wait. Observe what they post, or use multichannel tools to send a soft email referencing the connection. If you must send a direct message, it needs to be highly relevant to a trigger event. \n\nTrigger events include:\n*   They recently changed jobs.\n*   Their company just announced funding or a major hire.\n*   They engaged with a piece of content relevant to your solution.\n*   They commented on a competitor's post.\n\nUse your software to monitor for these triggers, and only reach out when you have a specific, justifiable reason to be in their inbox.\n\n## Key Features to Look for in a Modern LinkedIn Tool\n\nWhen evaluating Waalaxy alternatives, use this feature checklist to ensure you are buying software designed for the current era of LinkedIn, not the tactics of five years ago.\n\n| Feature Category | What to Look For | Why It Matters for Preventing Spam |\n| :--- | :--- | :--- |\n| **Dynamic Personalization** | AI integration that reads a prospect's bio/recent posts to draft messages or comments. | Static variables (`{{company}}`) are obvious automation. AI creates natural, context-aware sentences. |\n| **Safety Architecture** | Local execution (running on your actual machine) or dedicated country-specific IPs. | Prevents LinkedIn from flagging impossible geographic logins or API abuse. |\n| **Activity Limits** | Granular control over how many actions (likes, comments, views, requests) happen per day. | Mimics human behavior. Humans don't send 100 requests in exactly 60 minutes. |\n| **Engagement Focus** | Features for finding relevant posts and automating/assisting with comments. | Shifts the strategy away from crowded, spam-filled inboxes into public, high-visibility networking. |\n| **Conditional Logic** | \"If/Then\" pathways based on how a prospect interacts with previous steps. | Stops the sequence if a prospect replies, views a profile, or engages elsewhere, preventing embarrassing double-touches. |\n\nFor a deeper dive into evaluating engagement features, refer to this [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## Advanced Multichannel Integration: Beyond the LinkedIn Bubble\n\nRelying entirely on one platform is a single point of failure. The most successful outreach campaigns treat LinkedIn as just one layer of a broader strategy. According to [LinkedIn\u2019s own top content on sales automation](https://www.linkedin.com/top-content/sales/sales-automation-tools-to-consider/best-tools-for-scaling-email-and-linkedin-sequences/), combining robust email platforms like Smartlead (which bakes in domain warmup and deliverability) with LinkedIn sequences provides the scale and safety required today.\n\nWhen building a stack, consider how data flows between your tools. If you use PhantomBuster to scrape event attendees, you might push that data into an email warmup tool to verify addresses, use Expandi to view their LinkedIn profiles, and finally use an AI writer to draft a highly specific email. \n\nHowever, if that level of complexity sounds overwhelming, returning to an engagement-first strategy is the best course. Finding tools that help you easily locate target conversations\u2014such as the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio)\u2014often yields higher ROI with a fraction of the technical setup.\n\n## Frequently Asked Questions (FAQs)\n\n### Is LinkedIn automation illegal?\nNo, it is not illegal, but violating LinkedIn's Terms of Service can result in your account being permanently banned. LinkedIn strictly prohibits tools that scrape data aggressively or bypass their user interface limits. This is why choosing tools with strong safety architectures\u2014like local execution or dedicated IPs\u2014is non-negotiable. \n\n### How many connection requests can I safely send a day?\nHistorically, you could send upwards of 100 a day. Today, LinkedIn restricts most accounts to around 100-200 connection requests *per week*. Pushing beyond 20-25 requests a day is highly risky unless you are using advanced tools that specifically simulate mobile app environments or spread limits across multiple accounts. \n\n### Does commenting actually replace cold outreach?\nYes, and for many industries, it outperforms it. When you send a cold DM, an audience of one sees it. When you leave an insightful comment on a popular industry post, hundreds or thousands of potential prospects see your name, headline, and expertise. It builds authority in a way that private messaging cannot, turning cold outbound efforts into warm inbound inquiries.\n\n## Moving Forward Without Spam\n\nThe definition of \"scaling outreach\" has fundamentally changed. It no longer means finding software that can send the highest volume of messages in the shortest amount of time. Today, scaling means using AI and automation to increase the *relevance* and *authenticity* of your interactions without spending 10 hours a day glued to your keyboard.\n\nIf you are currently frustrated with Waalaxy or similar tools because your messages are being ignored, the solution is not to send more messages. The solution is to change the venue of the conversation. \n\nBy shifting from aggressive direct messaging to strategic public engagement, you bypass the psychological spam filter completely. Utilizing local, AI-driven tools like Junior allows you to curate discussions, draft intelligent replies, and build genuine relationships at a pace that manual browsing simply cannot match. Stop trying to force your way into the inbox, and start becoming a visible, valuable voice in the feed.", "created_at": "2026-09-19T16:49:26.966103+00:00", "updated_at": "2026-09-19T16:49:26.966106+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
