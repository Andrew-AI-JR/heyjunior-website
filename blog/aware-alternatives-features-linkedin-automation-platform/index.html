    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 109, "slug": "aware-alternatives-features-linkedin-automation-platform", "title": "Aware Alternatives for Features to Look for in A Linkedin Automation Platform", "excerpt": "Discover the essential features to look for in LinkedIn automation platforms, from local execution and safety to context-aware AI commenting and lead targeting.", "featured_image_url": "https://assets.bevisible.app/featured-images/j577g1s0gqwpm6xbmqh1h4t9sh8d75pn/aware-alternatives-for-features-to-look-for-in-a-l-1790007507264-2al4h0.png", "published_at": "2026-09-21T16:13:00+00:00", "content": "# Aware Alternatives for Features to Look for in A Linkedin Automation Platform\n\nThe era of blasting hundreds of automated connection requests and generic cold messages on LinkedIn is effectively over. Inboxes are crowded, users are highly defensive against pitch-slapping, and LinkedIn\u2019s security algorithms are more aggressive than ever at flagging unnatural behavior. If you are evaluating tools today\u2014whether you are looking for Aware alternatives or migrating away from a legacy cloud-based platform\u2014the features you need to prioritize have fundamentally shifted. \n\nInstead of looking for tools that maximize outbound volume, modern professionals\u2014from job seekers and sales teams to lead generation agencies and consultants\u2014need platforms designed to generate authentic conversations and pipeline. The new standard for LinkedIn automation bypasses the crowded DM inbox entirely, leveraging public visibility, strategic post commenting, and context-aware AI to turn organic interactions into inbound opportunities. \n\nUnderstanding [what LinkedIn automation tools are](https://we-connect.io/blog/what-are-linkedin-automation-tools) in today's context means looking beyond basic sequence builders. You need a platform that protects your account through secure architecture, drafts intelligent responses based on your unique bio, and operates seamlessly within the natural flow of the platform.\n\nHere is a comprehensive breakdown of the essential features to look for when evaluating a modern LinkedIn automation platform.\n\n## Architecture and Account Safety Features\n\nThe most critical factor in choosing an automation tool is not how many features it has, but how it interacts with LinkedIn\u2019s servers. Traditional platforms rely on cloud-based infrastructure or unofficial APIs, both of which introduce severe risks to your account. \n\n### Local Execution vs. Cloud-Based Architecture\n\nCloud-based automation tools run your LinkedIn account from a remote server. While this sounds convenient because the software runs while your computer is off, it is a massive red flag for LinkedIn\u2019s security systems. Cloud servers operate on IP addresses owned by data centers (like AWS or DigitalOcean). Human beings do not browse social media from data center IPs. When LinkedIn detects activity originating from a known server IP, or when your IP address suddenly jumps from a home network in Chicago to a data center in Frankfurt, it triggers immediate account restrictions.\n\nThe feature you should demand is **local execution**. Platforms like Junior operate locally on your own machine. When the tool interacts with LinkedIn, it uses your actual computer, your local IP address, and your standard browser session. To LinkedIn\u2019s security algorithms, local execution looks exactly like you sitting at your desk manually typing comments and browsing feeds. This architectural difference is the dividing line between accounts that get permanently banned and accounts that scale safely. \n\n![Architectural diagram comparing risky cloud-based data center automation against safe local execution on LinkedIn.](https://assets.bevisible.app/inline-images/j577g1s0gqwpm6xbmqh1h4t9sh8d75pn/inline-1-1790007454929-1neoy5.png)\n### Randomized Human-Like Delays and Action Limits\n\nAutomation platforms that execute tasks at robotic speeds will inevitably trigger anti-bot measures. A high-quality tool must include built-in behavioral mimicry. Look for features that automatically randomize the delay between actions. If the software likes a post, it should wait a random interval (e.g., 42 to 87 seconds) before drafting a comment, and another random interval before moving to the next post. \n\nFurthermore, the platform must enforce configurable, safe daily limits. [LinkedIn automation tool features that matter](https://linkedinsider.blog/linkedin-automation-tool-features) always prioritize algorithmic safety over raw volume. A system that allows you to post 500 comments a day is a liability, not an asset. Look for platforms that cap daily interactions at humanly possible levels\u2014typically 20 to 50 highly targeted engagements\u2014ensuring your account remains in good standing while still driving significant visibility.\n\n### Session Management and IP Consistency\n\nFor lead generation agencies or sales teams managing multiple accounts, architecture becomes even more complex. Traditional cloud tools require you to purchase and configure dedicated proxy servers for every client to maintain IP consistency. This adds hidden costs, technical overhead, and points of failure. \n\nA locally executed tool handles session management naturally. Because it runs directly from the user's local environment, there is no need for complex proxy configurations or geographic spoofing. The platform uses the natural IP environment where the user normally operates, providing maximum safety for multi-account agency workflows. If you are comparing platforms, checking an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) will highlight why local session management is non-negotiable.\n\n## Engagement Automation: The New Standard\n\nHistorically, LinkedIn automation meant connection requests and automated direct messages. Today, those features yield diminishing returns. Decision-makers ignore cold DMs, and job seekers rarely get responses from automated outreach to hiring managers. The highest-converting feature in modern LinkedIn automation is **comment generation**.\n\n### Bypassing the Inbox Through Strategic Commenting\n\nWhen you send a cold DM, you are competing with dozens of other automated pitches in a private, low-trust environment. When you leave a highly insightful, relevant comment on a prospect's public post, you are engaging in a high-trust environment. You are adding value to their content, which triggers the psychological principle of reciprocity, and you are placing your name and headline in front of their entire network.\n\nLook for a platform that focuses heavily on commenting rather than messaging. The goal is to start authentic conversations in the feed. When done correctly, this strategy turns public visibility into inbound connection requests and warm DM conversations. For consultants and agency founders, this is the exact methodology outlined in comparisons like [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). \n\n### Context-Aware, Bio-Trained AI\n\nNot all AI commenting tools are created equal. Many platforms simply plug into a basic ChatGPT API and generate generic responses like \"Great post, thanks for sharing!\" or overly enthusiastic, robotic essays filled with emojis. These low-effort comments actively damage your brand.\n\nThe feature you need is **bio-trained, context-aware AI**. The automation platform should allow you to input your specific professional background, your goals, your tone of voice, and your target audience. When the AI drafts a comment, it should read the prospect's entire post, understand the underlying context, and formulate a response that sounds like *you* wrote it. \n\nIf you are a fractional CFO targeting SaaS founders, the AI should draft comments that subtly highlight financial strategy insights when replying to a founder's post about scaling challenges. This level of personalized, human-sounding interaction is what separates modern tools from legacy spambots. If you are exploring options in this space, reviewing the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) will reveal the stark difference between generic AI and context-aware generation.\n\n### Human-in-the-Loop Workflows\n\nTrue automation does not mean blind execution. A premium platform will offer a \"human-in-the-loop\" feature for engagement. Instead of the tool automatically publishing AI-generated comments while you sleep (which can lead to tone-deaf responses on sensitive posts), the platform should act as a sophisticated drafting assistant. \n\nIt should pull the most relevant posts into a centralized dashboard, draft highly contextual responses based on your bio, and allow you to review, edit, or approve those comments with a single click. This ensures 100% brand safety while drastically reducing the time it takes to maintain an active, authoritative presence on the platform.\n\n![Step-by-step diagram showing a human-in-the-loop AI commenting workflow from post discovery to review and one-click approval.](https://assets.bevisible.app/inline-images/j577g1s0gqwpm6xbmqh1h4t9sh8d75pn/inline-2-1790007458422-drzmuj.png)\n## Advanced Targeting and Post Discovery\n\nAn engagement-first strategy is only effective if you are engaging with the right people. Traditional platforms focus on building lists of profiles to spam. Modern platforms focus on finding the right conversations to join. [What are the best tools to automate LinkedIn tasks for growth?](https://phantombuster.com/blog/tools/best-tools-to-automate-linkedin-tasks/) The answer always points back to robust targeting capabilities. \n\n### Dynamic Lead intent and Signal Filtering\n\nLook for tools that allow you to filter not just by job title and industry, but by active intent signals. The platform should be able to scan LinkedIn for users who are actively posting about specific topics relevant to your niche. \n\nFeatures to evaluate include:\n*   **Keyword Monitoring:** The ability to track specific keywords or phrases in posts across your network and beyond.\n*   **Creator Tracking:** The ability to build lists of high-value prospects or industry thought leaders and automatically queue their new posts for engagement the moment they are published. \n*   **Boolean Search Integration:** Seamless integration with LinkedIn\u2019s native search or Sales Navigator to pull in hyper-targeted feeds based on complex boolean strings.\n\nBy targeting active conversations rather than static profile lists, you ensure that your engagement efforts are directed at users who are currently active on the platform and highly likely to notice your interaction. If you are comparing discovery tools, articles detailing the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) heavily emphasize the importance of real-time post monitoring.\n\n### Unified Engagement Inbox\n\nIf you are replacing a tool like Aware or evaluating [the best LinkedIn automation tools](https://hyperise.com/blog/linkedin-automation-tools), you need a streamlined way to manage the resulting conversations. \n\nWhen your strategic commenting strategy works, prospects will reply to your comments, visit your profile, send connection requests, and initiate direct messages. A robust automation platform should provide a unified view of these interactions. While Junior focuses specifically on the outbound commenting and visibility aspect, managing the inbound flow efficiently is a critical part of the overall workflow. Look for platforms that help you easily track which posts you have engaged with and surface notifications when those engagements turn into two-way conversations.\n\n## Data Handling, Analytics, and Pipeline Tracking\n\nVanity metrics like impressions and likes are virtually useless for evaluating the ROI of a LinkedIn automation tool. When reviewing features, you must look at how the platform handles data and tracks actual pipeline growth.\n\n### Pipeline Performance Over Vanity Metrics\n\nTraditional tools report on how many connection requests were sent and how many were accepted. This is an activity metric, not a business outcome. Modern platforms should help you understand the conversion funnel of your engagement strategy. \n\nLook for features that track:\n*   The correlation between targeted comments left and the resulting profile views from those specific prospects.\n*   Inbound connection requests generated from post engagements.\n*   The transition from public feed interaction to private direct message conversation.\n\nThese metrics tell you if your AI-generated comments are actually resonating with your target audience or if they are simply taking up space in the feed.\n\n### Data Security and Audit Trails\n\nIf you are operating in B2B sales, agency environments, or specialized consulting, data governance is a major feature consideration. The platform must have clear policies on data storage. Because local-execution tools run on your machine, your browsing data and prospect lists generally remain under your control rather than being aggregated into a massive third-party cloud database. \n\nFurthermore, you need basic audit trails to see exactly what comments the AI drafted, which ones you approved, and when they were published. This is particularly important for teams and agencies that need to maintain strict quality control over client accounts. Many [LinkedIn automation tools for agencies](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) fail this test by operating as black boxes, giving account managers little visibility into what is actually being said on behalf of their clients.\n\n## Usability and Agency-Grade Workflow Efficiency\n\nA tool can have the best AI and the safest architecture in the world, but if the user experience is a convoluted mess of proxy setups and spreadsheet uploads, the software will quickly become shelfware.\n\n### Intuitive Setup and Zero-Configuration Proxies\n\nThe feature you want is a frictionless onboarding experience. Legacy platforms often require users to purchase third-party proxies, configure browser extensions that constantly break when LinkedIn updates its UI, or map complex webhook integrations just to get started. \n\nA platform like Junior is designed to install and run locally, utilizing your existing LinkedIn session. The feature here is the *absence* of complex technical requirements. You download the application, define your professional bio, set your target search criteria, and the system immediately begins sourcing relevant posts for you to review.\n\n### Specialized Use Case Adaptability\n\nA high-quality LinkedIn automation tool must adapt to the unique goals of different user cohorts. The feature set should flex depending on who is at the keyboard:\n\n*   **For Job Seekers:** The ability to track posts from internal recruiters and hiring managers at target companies, allowing the AI to draft comments that subtly highlight relevant skills and career aspirations without begging for a job.\n*   **For Sales Teams:** Workflows designed to engage with multiple stakeholders within a target account, building brand familiarity across a buying committee before the Account Executive ever asks for a meeting.\n*   **For Lead Gen Agencies:** Safe, isolated environment capabilities that allow agencies to run engagement campaigns for clients without triggering the account bans commonly associated with multi-tenant cloud solutions. Examining the [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) reveals why agencies are migrating to localized engagement tools.\n*   **For Founders:** The ability to scale thought leadership. By engaging with other founders and industry leaders in the comments, the AI helps you punch above your weight class, inserting your insights into high-visibility discussions.\n\n## Comparing Automation Approaches: Legacy vs. Modern\n\nTo fully understand the features you need when seeking an Aware alternative, it helps to see the contrast between legacy outbound platforms and modern engagement platforms. \n\n| Feature Category | Legacy Connection Tools (e.g., Cloud APIs) | Modern Engagement Platforms (e.g., Junior) |\n| :--- | :--- | :--- |\n| **Primary Mechanism** | Automated connection requests and cold DMs | Context-aware post commenting and feed visibility |\n| **Architecture** | Cloud-based servers (High ban risk due to data center IPs) | Local execution (Mimics natural human browsing behavior) |\n| **Personalization** | Merge tags (e.g., \"Hi {FirstName}, saw you work at {Company}\") | Bio-trained AI that synthesizes the prospect's post context |\n| **Workflow** | Fully automated \"spray and pray\" sequences | Human-in-the-loop drafting and single-click approval |\n| **Targeting** | Scraping static lists of passive profiles | Identifying active conversations and real-time intent signals |\n| **Outcome** | Crowded inbox, low reply rates, account fatigue | Public visibility, high-trust interactions, inbound pipeline |\n\nChoosing the right features means aligning your tool stack with how LinkedIn actually works today. If you want to dive deeper into head-to-head comparisons, resources like the [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) breakdown offer excellent perspectives on engagement philosophies.\n\n## The Hidden Costs of Choosing the Wrong Feature Set\n\nWhen evaluating platforms, it is easy to be seduced by tools that promise thousands of automated actions for a low monthly price. However, prioritizing raw volume features over safety and engagement features carries severe hidden costs.\n\n**1. The \"LinkedIn Jail\" Penalty**\nWhen you use a platform that lacks robust [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) features (such as local execution and randomized delays), your account will eventually be restricted. The first offense usually results in a temporary ban and a requirement to verify your identity. Subsequent offenses can lead to a permanent ban. Losing a LinkedIn account containing years of connections, recommendations, and content history is a catastrophic outcome for any professional.\n\n**2. Brand Degradation from Poor Personalization**\nTools that lack advanced, context-aware AI often rely on simple keyword triggers. If your tool automatically comments \"Great insights on this!\" on a post where a prospect is discussing a recent company layoff or a personal tragedy, the damage to your professional reputation is immediate and irreversible. Human-in-the-loop approval workflows are not just a nice-to-have feature; they are a critical brand protection mechanism.\n\n**3. Opportunity Cost of the Inbox**\nEvery day spent running automated DM sequences that yield a 1% response rate is a day you could have spent engaging in high-visibility public conversations that drive a 20% inbound profile view rate. The feature set you choose dictates your strategy. If your tool only does DMs, you will only send DMs\u2014and you will continue to see diminishing returns as buyer behavior shifts away from cold outbound. \n\nTo future-proof your strategy, you must prioritize tools built for the realities of the current platform ecosystem, which are consistently highlighted in roundups of the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n## 3 FAQs on LinkedIn Automation Platform Features\n\n### What is the safest architecture for a LinkedIn automation tool?\nThe safest architecture is local execution. Cloud-based platforms route your activity through data center IP addresses, which are easily flagged by LinkedIn's security algorithms as non-human behavior. A local-execution platform runs on your own machine, utilizing your standard IP address and existing browser session. Combined with randomized delays and strict daily action limits, local execution mimics human behavior almost perfectly, keeping your account secure.\n\n### How does AI commenting differ from automated direct messaging?\nAutomated direct messaging pushes uninvited pitches into a private, crowded inbox where prospect defenses are high. AI commenting, conversely, adds value to public discussions. A bio-trained AI reads a prospect's post, understands the context, and drafts a relevant, insightful reply based on your unique expertise. This strategy bypasses the inbox, leverages the psychological principle of reciprocity, and exposes your profile to the prospect\u2019s entire network, driving inbound profile views and warm conversations rather than cold rejections. \n\n### Do I still need an automation platform if I only want to do organic growth?\nYes, but the *type* of automation changes. You do not need a sequence builder to spam connections. Instead, you need an automation platform to handle the heavy lifting of discovery and drafting. A modern tool acts as an intelligent assistant\u2014it continuously scans LinkedIn for posts matching your target keywords, pulls them into a single dashboard, and prepares highly contextual draft responses. You maintain complete creative control and \"organic\" authenticity by reviewing and approving the comments, while the software saves you hours of manual scrolling and writing.\n\nThe features you prioritize today will dictate the quality of your network tomorrow. By moving away from legacy outbound features and focusing on local safety, context-aware AI, and strategic commenting, you position yourself to build genuine relationships and sustainable pipeline in a platform environment that increasingly penalizes spam.", "created_at": "2026-09-21T16:19:27.356767+00:00", "updated_at": "2026-09-21T16:19:27.356772+00:00"};

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
