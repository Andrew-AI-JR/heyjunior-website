    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 108, "slug": "top-software-scaling-linkedin-outreach-without-spamming", "title": "Best Software for Scaling Linkedin Outreach Without Spamming Tools Beyond Waalaxy", "excerpt": "Explore top software beyond Waalaxy to scale LinkedIn outreach safely in 2026 using multi-account setups, intent data, and AI-driven engagement.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575qjpq8e2xtz01vh45gv33yd8d6qm7/best-software-for-scaling-linkedin-outreach-withou-1789921122780-xalal8.png", "published_at": "2026-09-20T16:11:00+00:00", "content": "# Best Software for Scaling Linkedin Outreach Without Spamming Tools Beyond Waalaxy\n\nOpen your LinkedIn inbox right now, and you will likely find a graveyard of identical messages. They usually start with a false familiarity\u2014\"I saw we operate in the same industry\"\u2014and quickly pivot into a pitch for lead generation, software development, or coaching services. \n\nThis is the inevitable result of accessible automation. When it costs almost nothing to send a thousand generic connection requests, the platform floods with noise. For job seekers, sales teams, and founders trying to build real pipeline, this presents a massive problem. How do you scale your outreach and generate conversations when your prospects are actively ignoring their direct messages?\n\nMost professionals turn to standard cloud-based automation tools. Waalaxy often wins the initial software selection because of its friendly interface and budget-friendly pricing. But as your operation grows, relying entirely on volume-based direct messaging inevitably triggers platform restrictions and damages your personal brand. You hit the platform's commercial use limits, your connection acceptance rate plummets, and worse\u2014prospects start labeling your outreach as spam.\n\nTo scale LinkedIn outreach safely in 2026, you have to move beyond basic spray-and-pray sequences. You need software that mimics human behavior, leverages dynamic AI personalization, orchestrates multi-account strategies, or bypasses the crowded inbox entirely in favor of public engagement. \n\nIn this guide, we will break down the mechanics of spam-free scaling, evaluate the limitations of popular entry-level tools like Waalaxy, and explore the advanced software stack required to build meaningful professional relationships at scale.\n\n## The Reality of LinkedIn Outreach in 2026: Why \"Scaling Without Spamming\" is Mandatory\n\nBefore evaluating the software, we have to define what \"spamming\" actually means in the context of LinkedIn. It operates on two distinct levels: technical platform spam and psychological prospect spam.\n\n![Diagram comparing technical LinkedIn platform spam limits with psychological prospect spam signals.](https://assets.bevisible.app/inline-images/j575qjpq8e2xtz01vh45gv33yd8d6qm7/inline-1-1789921069129-bp5g7g.png)\nTechnical spam refers to behavior that triggers LinkedIn's algorithmic defenses. The platform employs strict rate limits to preserve the user experience. If a newly created account suddenly sends 100 connection requests in a single hour, all containing the exact same text payload, the system flags the activity. This results in temporary restrictions, shadowbans (where your messages are sent but filtered into a hidden \"Other\" inbox), or permanent account deletion. \n\nPsychological spam is arguably worse. This occurs when your message successfully bypasses technical filters and lands in the primary inbox, but the prospect immediately recognizes it as automated, irrelevant noise. Even if you are operating within platform limits, sending hundreds of poorly targeted messages damages your reputation. When a prospect clicks \"I don't know this person\" on a connection request, it sends a negative signal back to the algorithm. Accumulate enough of these signals, and your account health deteriorates.\n\n### The Problem with Traditional Volume-Based Strategies\n\nHistorically, the math for LinkedIn outreach was simple: volume equals meetings. If you wanted more meetings, you bought a cloud-based automation tool, scraped a larger list from Sales Navigator, and increased your daily sending limits. \n\nThat playbook is dead. The platform now strictly enforces a limit of around 100 to 250 connection requests per week for most standard accounts. No software can magically bypass this hard limit on a single account without severe risk. \n\nTherefore, \"scaling\" no longer means turning up the volume dial on one profile. Scaling safely requires one of three advanced approaches:\n1.  **Multi-channel Orchestration:** Warming up prospects via email and phone before sending a highly personalized LinkedIn request, increasing the acceptance rate.\n2.  **Multi-account Infrastructure:** Distributing a lower volume of highly targeted messages across dozens of different team member accounts (the agency model).\n3.  **Engagement-First Strategies:** Abandoning the direct message entirely in favor of leaving strategic, context-aware comments on prospect posts to drive inbound profile views and organic connections.\n\n## The Dominant Entry Point: Where Waalaxy Works (and Where It Breaks)\n\nWhen discussing LinkedIn automation, Waalaxy is frequently the baseline. It has built a massive user base by democratizing outreach for non-technical users. \n\nWaalaxy excels at accessibility. It features an intuitive, visual campaign builder that looks more like a modern email marketing platform than a traditional scraping tool. For a solo founder or a small sales team dipping their toes into social selling, it provides a safe, budget-friendly entry point with built-in daily limit protections. \n\nHowever, practitioners evaluating the [top LinkedIn outreach tools often note that while Waalaxy is great for \"polish\" and LinkedIn-only workflows](https://www.reddit.com/r/b2bmarketing/comments/1qt4eq1/top_linkedin_outreach_tools_tested_so_you_dont/), it struggles to support complex, high-volume, or heavily customized strategies.\n\n### The Growth Ceiling\n\nThe primary limitation of relying solely on Waalaxy is that it anchors your strategy to the direct inbox. While it offers multichannel capabilities, its core competency remains connection requests and follow-up DMs. \n\nWhen you attempt to scale a Waalaxy campaign, you inevitably run into the platform's weekly connection limits. Because the tool operates primarily on standard sequences (e.g., Visit Profile -> Wait 1 Day -> Send Request -> Wait 3 Days -> Send Message), the output often feels rigid. Even with basic variable replacement (like inserting the prospect's company name), the lack of deep, contextual AI personalization means the messages still read like templates. \n\nIf your goal is to find consulting clients, high-value enterprise accounts, or senior leadership roles, sending a templated sequence\u2014no matter how cleanly executed by Waalaxy\u2014will likely be perceived as spam by decision-makers who guard their time fiercely.\n\n## Top Software for Scaling LinkedIn Outreach Safely\n\nTo scale beyond the limitations of basic sequencers, you need specialized software tailored to specific outreach methodologies. The following tools represent the best-in-class options for executing sophisticated, spam-free campaigns.\n\n### 1. Expandi: The Cloud-Based Gold Standard for Safe Volume\n\nExpandi has earned a reputation as one of the safest cloud-based automation platforms on the market. While basic tools log into your account from rotating data center IP addresses\u2014an immediate red flag for LinkedIn's security systems\u2014Expandi assigns a dedicated, country-specific IP address to your account. This ensures that your login location remains consistent, mimicking natural human behavior.\n\n![Architecture diagram illustrating dedicated IP and mobile API routing for safe LinkedIn automation.](https://assets.bevisible.app/inline-images/j575qjpq8e2xtz01vh45gv33yd8d6qm7/inline-2-1789921062325-o7pv38.png)\nBeyond IP protection, Expandi is a [robust cloud-based platform designed for multichannel outreach that supports highly personalized campaigns](https://www.salescaptain.io/blog/linkedin-outreach-automation-tools). Its defining feature is its \"Mobile Connector\" technology. \n\nLinkedIn maintains different API limits for its desktop application versus its mobile app. Expandi leverages this architectural quirk by simulating activity through the mobile API, allowing users to safely send a higher volume of connection requests than they could through standard desktop automation. \n\n**Best Use Case:** Sales teams that have deeply researched, highly targeted lists and need to execute complex branching sequences (e.g., \"If prospect liked this post, send message A; if prospect did not engage, send email B\") without risking account bans.\n\n**How it Prevents Spamming:** Expandi randomizes delay times between actions. Instead of sending 50 messages at exactly 9:00 AM, it drips them out irregularly throughout your defined working hours, pausing on weekends if configured. This granular control over operational hours and delay intervals makes the automation nearly indistinguishable from manual human effort.\n\n### 2. HeyReach: The High-Velocity Infrastructure for Agencies\n\nIf you run a lead generation agency or manage a large outbound sales team, scaling through a single account is mathematically impossible. You need horizontal scaling\u2014distributing the workload across multiple profiles. \n\nHeyReach is engineered specifically for this multi-account infrastructure. Instead of trying to push 500 messages a week through one founder's profile (which will result in a ban), HeyReach allows you to connect dozens of LinkedIn accounts to a centralized dashboard. \n\n**Best Use Case:** Agencies running managed outreach for multiple clients, or enterprise sales teams pooling the LinkedIn accounts of their SDRs, Account Executives, and leadership.\n\n**How it Prevents Spamming:** HeyReach safely rotates through connected accounts to execute a unified campaign. If you have a target list of 1,000 prospects, HeyReach will divide that list among 20 different sender profiles, keeping the individual daily volume for each account incredibly low and well within the safety margins. \n\nThis approach completely neutralizes the technical spam risk associated with high-velocity outreach. For a deeper look at evaluating infrastructure tools for agency use, review the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### 3. Overloop: The AI Multichannel Heavyweight\n\nSending a cold LinkedIn connection request to a prospect who has never heard of your brand is inherently risky. The smartest way to scale outreach without seeming spammy is to build familiarity before you ever touch the LinkedIn inbox.\n\nOverloop excels at this multichannel orchestration. It combines LinkedIn automation with cold email and phone task management in a single interface. \n\n**Best Use Case:** Complex B2B sales cycles where a single touchpoint is rarely enough to generate a meeting. \n\n**How it Prevents Spamming:** Overloop allows you to warm up the prospect organically. A sophisticated sequence might look like this:\n1.  Overloop automatically views the prospect's LinkedIn profile (generating a notification on their end).\n2.  Two days later, Overloop sends a highly personalized cold email referencing a recent company milestone.\n3.  Three days later, if the email goes unopened, Overloop finally triggers a LinkedIn connection request.\n\nBy the time the connection request arrives, the prospect has already seen your name and company twice. The outreach feels like persistent, professional follow-up rather than a random spam blast from a stranger. \n\n### 4. PhantomBuster: The Heavy-Duty Data Extraction Engine\n\nPhantomBuster approaches LinkedIn from a completely different angle. It is not fundamentally an outreach sequencer; it is a data extraction and task automation engine. For technical marketers and growth hackers, PhantomBuster is unmatched in its ability to build hyper-targeted audiences.\n\n![Workflow diagram showing intent data extraction from LinkedIn post engagement to enriched prospect list.](https://assets.bevisible.app/inline-images/j575qjpq8e2xtz01vh45gv33yd8d6qm7/inline-3-1789921063006-0cwm8z.png)\nAccording to industry evaluations, [PhantomBuster is a lead generation automation tool for sales teams and businesses that want to automate LinkedIn data extraction](https://www.botdog.co/blog-posts/linkedin-outreach-automation-tools) at an advanced level. \n\n**Best Use Case:** Technical growth teams who want to build custom workflows, such as scraping the list of attendees from a specific industry webinar, enriching those profiles with verified email addresses, and passing that data via API to a separate sequencer.\n\n**How it Prevents Spamming:** The most common cause of spam complaints is irrelevance. PhantomBuster solves this by allowing you to scrape intent signals. Instead of targeting \"Marketing Managers in New York\" (a broad, spam-prone list), you can use PhantomBuster to extract exactly who commented on your competitor's recent post about marketing attribution software. When you eventually reach out to that highly specific list, your messaging can be hyper-relevant, drastically reducing the chance of being marked as spam.\n\nIf you are looking for tools that lean heavily into intent data but prefer a more streamlined interface, you can explore [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n### 5. Junior: Scaling Authentic Engagement Over Cold DMs\n\nEvery tool mentioned so far operates on the same underlying premise: success requires getting into the prospect's direct inbox. But as automation has proliferated, the inbox has become the most heavily guarded, highest-friction area of the platform.\n\nWhat if the best way to scale outreach without spamming is to stop sending direct messages altogether?\n\nJunior is an AI-powered LinkedIn automation tool built on a fundamentally different philosophy: public visibility drives private conversations. Instead of blasting cold connection requests, Junior scales your outreach through strategic, context-aware post commenting.\n\n**Best Use Case:** Job seekers looking to get noticed by hiring managers, consultants building authority, founders driving inbound pipeline, and sales teams who have exhausted traditional DM automation.\n\n**How it Prevents Spamming:** Junior inherently avoids the spam filter because it doesn't send cold messages. It finds highly relevant discussions in your niche and drafts intelligent, human-sounding replies based on your unique bio, tone, and specific goals. You review and approve the comments. \n\nFurthermore, unlike cloud-based connection tools that log in from external servers and risk IP flags, Junior runs locally on your machine. It operates exactly as you would, preserving your account's safety and utilizing natural interaction patterns. By consistently leaving insightful comments on the posts of your target prospects, you generate profile views, inbound connection requests, and direct messages from people who *want* to talk to you. \n\nThis flips the traditional outreach model on its head. For a detailed breakdown of how engagement-first strategies compare to traditional sequencers, read [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) or explore the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n## Comparing Outreach Strategies: DMs vs. Strategic Commenting\n\nChoosing the right software depends entirely on the strategy you intend to deploy. Let's examine the mechanical differences, failure modes, and ideal audiences for the two dominant methodologies: Cold Direct Messaging and Strategic Commenting.\n\n| Feature / Metric | Cold Direct Messaging (Expandi, Waalaxy) | Strategic Commenting (Junior) |\n| :--- | :--- | :--- |\n| **Primary Goal** | Force a direct response in a private channel. | Build public authority to generate inbound interest. |\n| **Platform Limit** | Strictly capped (approx. 100-250/week). | Highly flexible; natural platform usage is encouraged. |\n| **Spam Risk** | High. Algorithmic flags and user reports are common. | Minimal. Comments contribute positively to the ecosystem. |\n| **Account Safety** | Requires dedicated IPs or complex mobile API workarounds. | Extremely safe when running locally on your own machine. |\n| **Personalization** | Relies on merge tags ({{company}}) or external AI scrapers. | Deeply contextual; responds directly to the prospect's ideas. |\n| **Best For** | High-volume SDRs selling transactional SaaS software. | Consultants, founders, and job seekers selling high-trust services. |\n\n### The Mechanics of the Cold DM Sandbox\n\nThe fundamental flaw of the cold DM strategy at scale is that it treats all prospects exactly the same. When you load 1,000 decision-makers into a sequencer, the software executes a linear path. It cannot read the room. \n\nIf a prospect recently had a terrible quarter, a generic \"How are you handling your lead gen?\" message feels tone-deaf. The software pushes forward blindly, resulting in deleted messages and annoyed prospects. \n\nTo make DM automation work without spamming, you must obsessively segment your lists. You cannot use the basic LinkedIn search bar. You must use Sales Navigator to filter for specific intent triggers: prospects who changed jobs in the last 90 days, prospects whose companies recently raised funding, or prospects who have posted on LinkedIn in the last 30 days. The smaller and tighter the list, the safer the outreach. \n\n### The Mechanics of the Public Engagement Sandbox\n\nStrategic commenting operates on a psychological principle called reciprocity. When a prospect spends an hour writing a thoughtful post about industry trends, their immediate desire is validation. They want engagement. \n\nIf you show up in their comments with a generic \"Great post!\"\u2014which is what legacy automation tools provide\u2014you add no value. You blend in with the bots. But if you use an AI tool like Junior to analyze the specific arguments in their post and draft a nuanced, multi-sentence response that builds on their premise, you immediately stand out.\n\n![Whiteboard diagram illustrating how strategic commenting drives inbound profile views and connection requests.](https://assets.bevisible.app/inline-images/j575qjpq8e2xtz01vh45gv33yd8d6qm7/inline-4-1789921055769-9eyyeh.png)\nThe prospect reads the comment, feels validated, and almost invariably clicks your profile to see who you are. If your LinkedIn profile is optimized like a landing page clearly stating how you solve their problems, that profile view often converts into a warm connection request. You have successfully initiated outreach without ever sending a cold pitch. \n\nThis approach scales beautifully because it aligns with LinkedIn's core business model: keeping users engaged on the feed. For more on maintaining safety while using AI for engagement, see [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Core Features to Demand in Spam-Free Automation Software\n\nIf you are evaluating the software market to build your outreach stack, do not get distracted by flashy dashboards or unrealistic promises of \"unlimited connections.\" The safety of your account and the reputation of your brand depend on the underlying architecture of the tool.\n\nDemand these specific features before connecting your LinkedIn account to any third-party software:\n\n### 1. Dedicated or Local IP Execution\nNever use a cloud-based tool that rotates shared data center IP addresses. LinkedIn's security algorithms track the geographic location and IP reputation of every login session. If your account connects from New York at 9:00 AM and then connects from a shared AWS server in Frankfurt at 9:15 AM, your account will be immediately flagged for suspicious activity.\n\nYou must insist on either dedicated, local-country IP addresses (like Expandi offers for its cloud infrastructure) or software that executes locally on your own machine's IP address (like Junior). Local execution is the safest method because it perfectly mirrors your natural internet usage. \n\n### 2. Algorithmic Human Simulation\nAutomation gets caught when it behaves like a machine. Machines are perfectly precise; humans are erratic. \n\nYour software must have randomized delays built into the core logic. If the tool sends a message, it should wait a randomized interval\u2014say, between 47 and 112 seconds\u2014before viewing the next profile. It should pause for \"lunch breaks.\" It should never operate outside of your configured local business hours. \n\n### 3. Action Limit Enforcement\nA dangerous tool will let you execute 500 connection requests in a day if you tell it to. A safe tool will actively prevent you from self-sabotaging. \n\nLook for software that monitors your daily activity across all channels (connections, messages, profile views, comments) and strictly caps them below LinkedIn's rolling limits. The best tools will dynamically adjust these limits based on your account's historical warmup data.\n\n### 4. Dynamic AI Contextualization\nBasic variable replacement is no longer sufficient. Starting a message with \"Hi {{first_name}}, I see you work at {{company}}\" is the fastest way to signal that you are using automation. \n\nModern tools must read unstructured data. Whether it is analyzing the text of a recent post to draft a relevant comment or scraping a company's \"About Us\" page to craft a bespoke opening line, AI must be used to inject genuine context into the outreach. To understand the baseline requirements for AI commenting tools, review the [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## Step-by-Step Guide: Configuring Your Outreach Stack for Maximum Safety\n\nChoosing the right software is only half the battle. How you configure and deploy that software determines whether your campaigns generate revenue or result in a shadowban. Follow this operational framework to protect your account.\n\n### Step 1: The Account Warm-Up Phase\nDo not take a dormant LinkedIn account and suddenly launch a 50-message-per-day campaign. The sudden spike in velocity is a massive red flag. \n\nIf you are using a new account or activating a dormant one, begin with a strict warm-up protocol. For the first week, limit automation to harmless actions: viewing 10 profiles a day and leaving 2 or 3 manual comments. In week two, introduce connection requests, capping them at 5 per day. Gradually increase this volume by 10-15% per week until you reach a comfortable cruising altitude (usually around 20-30 interactions per day).\n\n### Step 2: Boolean Search and List Scrubbing\nAutomation amplifies bad targeting. If you feed garbage lists into your software, you will generate spam complaints at scale. \n\nMove beyond basic title searches. Master Boolean logic in Sales Navigator. \n*   **Bad Search:** `Title: \"Marketing Manager\"`\n*   **Good Search:** `Title: (\"Marketing Manager\" OR \"CMO\") AND Keywords: (\"SaaS\" OR \"B2B\") NOT (\"Agency\" OR \"Consultant\")`\n\nOnce you pull this list, manually scrub it. Take 15 minutes to page through the results and remove irrelevant profiles before importing the data into your software. This manual curation is the single highest-ROI activity in outbound sales.\n\n### Step 3: Crafting the \"Anti-Pitch\"\nWhether you are configuring an email sequence in Overloop or setting up connection messaging, abandon the pitch. The goal of the first touchpoint is never to sell the product; it is to sell the conversation.\n\nKeep messages under 50 words. Focus entirely on a specific problem the prospect is likely facing, based on your list criteria. Ask a soft, low-friction question that requires a simple yes or no response. \n\nIf you are using a tool like Junior, the \"anti-pitch\" happens automatically. By focusing your AI on commenting thoughtfully on the prospect's ideas, you prove your competence organically. For inspiration on finding the right posts to target, check out [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### Step 4: Monitoring the Feedback Loop\nSet up your software, launch the campaign, and then watch the data like a hawk. \n\nDo not look at vanity metrics like \"Total Messages Sent.\" Look at the Connection Acceptance Rate. If your acceptance rate drops below 20%, stop the campaign immediately. Your targeting is off, or your messaging is reading as spam. A healthy, targeted campaign should yield an acceptance rate of 30% to 50%. \n\nTrack your Positive Reply Rate. Getting 100 replies is useless if 95 of them are asking you to take them off your list. Adjust your messaging based on the sentiment of the replies you receive.\n\n## Frequently Asked Questions About LinkedIn Outreach Automation\n\n### Is automating LinkedIn outreach against the Terms of Service?\nYes, technically, LinkedIn's user agreement prohibits the use of third-party software, bots, or browser extensions that automate activity on the platform. This applies to almost all tools on the market. However, enforcement is entirely algorithmic and behavioral. LinkedIn doesn't ban automation inherently; it bans the *behavior* associated with reckless automation (e.g., massive spikes in volume, identical message payloads, jumping IP addresses). Using local, behaviorally sound software minimizes this risk to near zero. \n\n### How many LinkedIn connection requests can I send per day safely?\nAs of 2026, most established accounts should operate under the assumption of a 100-request weekly limit. This averages out to roughly 15 to 20 connection requests per business day. Accounts with a long history of high engagement and a premium Sales Navigator subscription may push slightly higher, but exceeding 25-30 cold requests per day consistently will invite scrutiny.\n\n### Cloud-based vs. local automation: Which is safer?\nLocal automation is fundamentally safer for single users. Cloud-based tools require handing over your session cookies and logging in via remote servers, which LinkedIn monitors closely. High-end cloud tools use dedicated IPs to mitigate this, but it is a workaround. Local automation software runs securely on your own computer, utilizing your own residential IP address and mimicking exactly how you would normally browse the platform. \n\n### Why is Waalaxy considered entry-level?\nWaalaxy is excellent for beginners because of its visual interface and freemium model. However, experienced growth marketers often transition to tools like Expandi for safer cloud infrastructure, HeyReach for multi-account agency scaling, or Junior for AI-driven post engagement once they hit the platform's volume ceilings and require more nuanced, non-templated strategies. \n\n## The Future of LinkedIn Outreach is Context, Not Volume\n\nThe era of scaling LinkedIn outreach by simply blasting more direct messages is permanently over. The platform's algorithms are too smart, and your prospects' fatigue is too high. If you attempt to brute-force your way into the inbox with generic templates, you will damage your brand and eventually lose your account.\n\nTo win in 2026, you must align your software choices with sophisticated strategies. If your business model requires high-volume cold targeting, you must invest in infrastructure like HeyReach to distribute the load across multiple profiles, or Expandi to leverage mobile API workarounds safely. \n\nHowever, if you are a consultant, founder, or agency leader whose business relies on trust and authority, the smartest way to scale is to bypass the cold DM entirely. Tools like Junior allow you to turn public visibility into private pipeline. By automating the discovery of relevant conversations and drafting highly contextual, human-sounding comments, you generate inbound interest without ever risking the \"spam\" label. \n\nThe software you choose dictates the behavior you execute. Choose tools that force you to be relevant, protect your account's technical health, and prioritize genuine conversations over empty metrics.", "created_at": "2026-09-20T16:19:27.255326+00:00", "updated_at": "2026-09-20T16:19:27.255331+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
