    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 53, "slug": "tools-find-relevant-linkedin-posts-comment-on-evaluation", "title": "Tools to Find Relevant Linkedin Posts to Comment On Evaluation Checklist", "excerpt": "Discover the top tools to find relevant LinkedIn posts to comment on. Use our 12-point evaluation checklist to compare cloud, browser, and local AI solutions.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575z0xjwezpbcv3tw3kdff0j98akk31/tools-to-find-relevant-linkedin-posts-to-comment-o-1784989149229-sv58ah.png", "published_at": "2026-07-25T14:00:00+00:00", "content": "# Tools to Find Relevant Linkedin Posts to Comment On Evaluation Checklist\n\nSourcing the right LinkedIn posts is the silent bottleneck of engagement marketing. Most founders and sales teams know they should be commenting on prospects' content to bypass crowded DMs, but they spend 45 minutes endlessly scrolling the feed just to find three decent posts to engage with.\n\nEngagement farming\u2014the strategy of leaving high-value comments on relevant industry discussions to drive profile views and inbound pipeline\u2014only yields a high ROI if you can discover those posts efficiently. \n\nBecause LinkedIn heavily restricts its public search API to protect user privacy, natively searching for fresh, hyper-relevant conversations is clunky. As a result, a massive ecosystem of third-party discovery tools has emerged. But these tools vary wildly in how they source data, how they integrate into your workflow, and critically, how safe they are for your account.\n\nThis guide breaks down the core technologies behind these platforms, provides a comprehensive 12-point evaluation checklist, and reviews the top tools available for comment discovery and execution.\n\n## The Architecture of LinkedIn Post Discovery Tools\n\nBefore evaluating individual tools, you need to understand how they actually pull data. Your choice dictates not just how many posts you find, but whether your LinkedIn account gets flagged for suspicious activity.\n\nTools to find relevant LinkedIn posts generally rely on one of three architectural approaches:\n\n### 1. Cloud-Based Scraping Suites\nThese are external web apps (like Taplio or Supergrow) hosted on remote servers. You provide them with target keywords, hashtags, or specific creator URLs, and their servers constantly ping LinkedIn to pull fresh posts into a dashboard.\n*   **The Advantage:** You don't need your computer open. The platform does the heavy lifting in the background and curates a neat feed for you to log into.\n*   **The Risk:** LinkedIn's security algorithms are notoriously strict regarding cloud scrapers. If a server in AWS US-East suddenly logs into your account while you are sitting in London, LinkedIn may flag the session, log you out, or temporarily restrict the account. \n\n### 2. Browser Extensions (DOM Parsing)\nThese lightweight tools (like AuthoredUp) live inside your Chrome or Edge browser. They don't scrape from external servers; instead, they read the Document Object Model (DOM)\u2014the actual code of the LinkedIn webpage you are currently viewing\u2014to filter and highlight posts.\n*   **The Advantage:** Extremely safe. They use your active, authenticated login session from your actual IP address. They operate exactly where you naturally work.\n*   **The Risk:** They can only analyze what your browser has loaded. They cannot run background tasks while you sleep to build a list of posts for the morning.\n\n### 3. Local Desktop AI Automation\nThis is the newest category in the ecosystem, designed to bridge the gap between heavy automation and total account safety. Tools like Junior run directly on your local machine rather than in the cloud. They automate the process of navigating LinkedIn, finding target posts, and generating context-aware comments, but they do it using your local IP and natural interaction patterns.\n*   **The Advantage:** Maximum safety combined with AI drafting. Because it runs locally, it perfectly mimics human behavior. It also uses your unique bio and goals to craft replies, preventing the \"generic AI spam\" problem.\n*   **The Risk:** You typically need your machine to be on for the automated actions to execute.\n\n![A 2x2 matrix diagram evaluating LinkedIn commenting tools based on account safety and workflow automation.](https://assets.bevisible.app/inline-images/j575z0xjwezpbcv3tw3kdff0j98akk31/inline-1-1784989080074-ytejlf.png)\n## The 12-Point Evaluation Checklist\n\nIf you are evaluating [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), you need a standardized way to compare them beyond their marketing pages. Use this 12-point checklist when testing a new tool with your team.\n\n### Sourcing Capabilities\n- [ ] **Real-Time Data Freshness:** Does the tool pull posts within the \"Golden Hour\" (the first 60 minutes of posting), or does it rely on stale databases that update every 24 hours?\n- [ ] **Boolean Sourcing:** Can you use advanced search operators (`AND`, `OR`, `NOT`, `\"exact phrase\"`) to filter out irrelevant noise?\n- [ ] **Target Account Tracking:** Can you input a specific list of 50-100 LinkedIn URLs (your ICP or competitors) and get notified the moment they post?\n\n### Workflow & Execution\n- [ ] **In-Line Commenting:** Can you read the post, draft a comment, and publish it directly from the tool's interface without having to copy-paste URLs back into LinkedIn?\n- [ ] **Multi-Tab Avoidance:** Does the tool bring the feed to you, or do you find yourself drowning in 40 open LinkedIn tabs?\n- [ ] **Team Collaboration:** Can sales leaders curate a list of target posts and assign them to specific SDRs or founders to comment on?\n\n### Context & AI Quality\n- [ ] **Bio-Driven Context:** Does the AI draft comments based on your specific professional background, or does it use generic \"hype\" prompts?\n- [ ] **Tone Alignment:** Can you adjust the style (e.g., analytical, contrarian, supportive) to match your actual speaking voice?\n- [ ] **Thread Awareness:** Does the tool analyze existing comments on the post so you don't repeat what someone else just said?\n\n### Safety & Compliance\n- [ ] **Execution Environment:** Does the tool run locally on your machine/browser, or does it require you to hand over your session cookies to a remote cloud server?\n- [ ] **Human-Like Throttling:** If the tool automates engagement, does it insert randomized delays (e.g., waiting 12-45 seconds between actions) to mimic human reading speed?\n- [ ] **Daily Limit Safeguards:** Will the software actively stop you from commenting or liking too many posts in a 24-hour window to protect your account health?\n\n## Category 1: LinkedIn-Specific Growth Suites (The All-In-One Options)\n\nGrowth suites are built to be your primary command center for LinkedIn. Instead of just tracking keywords, they actively scrape, filter, and curate viral or highly relevant posts from specific creators or niches so you can comment on them immediately.\n\n### Taplio\nWidely considered the gold standard for dedicated LinkedIn creator growth. For a detailed breakdown of how it compares to local execution, read our guide on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n*   **How it finds posts:** Taplio includes a dedicated \"Engagement\" module. You plug in a list of specific creators (like industry influencers, peers, or prospective clients) or target keywords. Taplio's servers pull their latest posts into a unified feed.\n*   **The Workflow:** You can scroll through this custom feed and drop comments rapidly without ever opening native LinkedIn. It includes built-in AI to help draft responses.\n*   **The Drawback:** Because it is cloud-based, relying heavily on it for automated actions carries inherent risks. Furthermore, its AI generation tends to produce very recognizable \"LinkedIn bro-etry\" unless heavily prompted.\n\n### MagicPost\nMagicPost takes a slightly different approach, focusing on historical success rather than just real-time tracking.\n\n*   **How it finds posts:** It maintains a massive, filterable library of over 500,000 viral LinkedIn posts. You can sort by industry, keyword, and engagement level.\n*   **The Workflow:** This is highly effective if your goal is to find active, massive conversations where you want to drop a contrarian opinion to steal attention from a viral post.\n*   **The Drawback:** Engaging on a post that already has 400 comments drastically reduces your visibility. If you aren't one of the first 15 commenters, your thoughtful reply is usually buried at the bottom of the thread.\n\n### Supergrow\nSupergrow is an excellent alternative for teams and solo creators who find Taplio too bloated. If you are exploring this ecosystem, check out the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n*   **How it finds posts:** It lets you bookmark specific profiles and organize them into highly specific lists (e.g., \"Q3 Prospects,\" \"SaaS Founders,\" \"Sales Leaders\"). \n*   **The Workflow:** You log into your dashboard, click a list, and immediately see the newest content from just those individuals. It creates a high-signal, zero-noise feed.\n*   **The Drawback:** Similar to Taplio, it relies on cloud scraping. \n\n## Category 2: Specialized Browser Extensions\n\nIf you prefer a leaner workflow and want to avoid giving your cookies to external dashboards, browser extensions modify your native LinkedIn experience.\n\n### AuthoredUp\nAuthoredUp originally gained popularity as a post-formatting tool, but its feed curation features are highly valuable for comment sourcing.\n\n*   **How it finds posts:** It operates directly inside your browser. It doesn't find posts while you sleep; instead, it supercharges your active browsing session by allowing you to filter the native LinkedIn feed much more effectively.\n*   **The Workflow:** You can easily sift through content, analyze the readability of posts, and format your comments cleanly before posting them.\n*   **The Drawback:** It lacks the automated \"list building\" and offline scraping capabilities of the growth suites. You still have to do the manual work of scrolling, even if that scrolling is enhanced.\n\n### Aware (formerly Engage AI)\nThis tool focuses specifically on the interaction layer of the native feed.\n\n*   **How it finds posts:** It helps track specific prospects directly within the browser, adding an overlay to LinkedIn that highlights when your target accounts have published new content.\n*   **The Workflow:** As you browse, it provides immediate AI drafting assistance in the comment box, allowing you to choose tones like \"Friendly,\" \"Funny,\" or \"Disagree.\"\n*   **The Drawback:** Relying on simple tone modifiers often leads to generic, surface-level comments. \n\n![A printed 12-point evaluation checklist for LinkedIn software sitting on a wooden desk with a pen.](https://assets.bevisible.app/inline-images/j575z0xjwezpbcv3tw3kdff0j98akk31/inline-2-1784989060495-5oxco7.png)\n## Category 3: The Heavy Automation & Sourcing Combinations\n\nFor enterprise teams or agencies running complex outbound campaigns, finding posts is just step one of a multi-tool sequence.\n\n### PhantomBuster\nPhantomBuster is a headless automation tool that extracts data from the web. If you want to evaluate its safety, review the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n*   **How it finds posts:** You configure a \"Phantom\" (a script) to search LinkedIn Sales Navigator for specific keywords, extract the URLs of users who posted about that keyword in the last 30 days, and dump those URLs into a CSV or Google Sheet.\n*   **The Workflow:** Highly technical. You connect the Google Sheet to Zapier, which might trigger ChatGPT to write a comment, which is then fed into another tool to actually post it.\n*   **The Drawback:** High complexity and high risk. Connecting multiple automated cloud scripts to your LinkedIn account is the fastest way to get restricted. For safer methods, explore [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n## Category 4: The Next Wave\u2014Local Execution & Contextual AI\n\nAs LinkedIn cracks down on cloud-based scrapers and the feed becomes saturated with obvious ChatGPT comments (\"Great insights! I completely agree that AI is the future...\"), the market is shifting toward a hybrid approach: local execution combined with hyper-contextual drafting.\n\n### Junior\nJunior represents the maturation of the engagement category. It is an AI-powered automation tool designed explicitly to start authentic conversations through strategic post commenting rather than generic spam.\n\n*   **How it finds posts:** Junior navigates to relevant discussions based on your defined target audience and goals.\n*   **The Workflow:** Unlike cloud suites, Junior **runs locally on your machine**. This is a critical distinction. Because the actions are executed locally, it uses natural interaction patterns and your actual IP address, protecting your account safety. \n*   **The AI Difference:** Instead of just offering a \"friendly\" or \"professional\" tone button, Junior drafts human-sounding replies based on your unique bio, past experiences, and specific goals. It acts as an extension of your actual expertise. \n*   **The Result:** It helps professionals bypass crowded inboxes and turn public visibility into direct interviews, pipeline, and client conversations without ever looking like a bot. You can see how this methodology compares to heavy messaging tools in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Sourcing Workflows That Actually Drive Revenue\n\nHaving the right tool is useless if your strategy is flawed. Simply commenting on massive, viral posts by top influencers will get you likes, but rarely leads to pipeline. You need to target the \"Middle Class\" of LinkedIn\u2014posts with 5 to 50 comments where the author actually reads every reply.\n\nHere are three advanced workflows to deploy with your tool of choice.\n\n### Workflow 1: Competitor Audience Hijacking\nFind the top 5 creators or companies in your exact niche who have large followings but poor engagement habits (i.e., they don't reply to their own comments).\n1.  Load their profiles into your tracking tool.\n2.  When they post, wait for their audience to ask detailed questions in the comments.\n3.  Use your tool to jump in and answer those questions thoughtfully, effectively stealing the goodwill of your competitor's audience.\n\n### Workflow 2: The Boolean Trigger Event Search\nStop searching for broad terms like `\"B2B Sales\"`. The noise-to-signal ratio is too high. Instead, search for pain points and trigger events.\n\nSet up tracking for specific boolean strings:\n*   `(\"hiring\" OR \"looking for\") AND (\"SDR\" OR \"BDR\") AND NOT \"job\"`\n*   `(\"struggling with\" OR \"trying to figure out\") AND \"cold outreach\"`\n\nWhen a tool pulls a post matching these strings, you aren't just engaging\u2014you are answering a direct cry for help from a potential prospect.\n\n### Workflow 3: The ICP Ego-Bait Strategy\nMost executives have terrible LinkedIn engagement. When a VP of Sales at a target account posts an article and gets zero likes and zero comments, they notice the one person who takes the time to leave a thoughtful, 4-sentence reply.\n1.  Export a list of 100 target prospects from your CRM.\n2.  Load them into a tracking list.\n3.  Commit to being the first commenter on everything they post for three weeks.\n4.  On week four, send the direct message. The acceptance rate will skyrocket.\n\n![A line graph showing the lifecycle of a LinkedIn post and the best times to comment for maximum visibility.](https://assets.bevisible.app/inline-images/j575z0xjwezpbcv3tw3kdff0j98akk31/inline-3-1784989069527-kwzfnx.png)\n## The Hidden Risks of Post Sourcing Platforms\n\nBefore adopting any of the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) has to offer, you must understand the two major failure modes of comment marketing.\n\n### The Cloud-Scraping Ban Hammer\nLinkedIn uses a sophisticated array of signals to detect non-human behavior. If you log into a cloud-based tool that routes your traffic through a data center, LinkedIn detects a mismatch between your browser footprint, your IP address, and your historical location. \n\nIf you value your account history and network, migrating away from cloud-based tools toward local-execution tools like Junior is the most effective way to ensure [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### The Generic AI Penalty (The Ghosting Effect)\nLinkedIn's algorithm is actively fighting AI spam. If a tool drafts a comment that begins with \"I completely agree with this...\" or \"Fascinating insights into [Topic]...\", two things happen:\n1.  **Algorithmic suppression:** The platform detects the predictable syntax of cheap LLMs and collapses the comment under a \"Load more\" button.\n2.  **Human rejection:** The post author sees it, rolls their eyes, and ignores it. \n\nThis is why contextual, bio-driven drafting is non-negotiable. If the AI doesn't know *who* you are, it cannot speak *for* you.\n\n## Frequently Asked Questions\n\n### Do keywords work better than tracking specific creators?\nIt depends on your goal. If you are doing pure lead generation, tracking specific creators (your ICP) is far more effective because you are building a relationship with a known target. If you are trying to build general brand authority and audience, keyword searching helps you find trending conversations outside your immediate network.\n\n### How many comments should I leave per day?\nQuality vastly outperforms quantity. Leaving 10 deeply insightful, highly relevant comments on posts by your exact target buyers will yield more revenue than dropping 100 generic \"Great post!\" comments using an automated tool. If you are automating the drafting process, ensure you are still reviewing and approving the context before hitting send.\n\n### Can I get banned for using a commenting tool?\nYes, if you use the wrong type. Cloud-based scraping and aggressive mass-engagement scripts are high-risk and frequently lead to temporary or permanent bans. Tools that operate locally on your machine, respect rate limits, and mimic human reading and typing speeds are significantly safer.\n\nEvaluating the right tech stack for LinkedIn engagement is no longer just about who can scrape the fastest. It is about balancing discovery speed with account safety, and volume with contextual authenticity. Use the checklist provided to audit your current workflow, and ensure whichever tool you choose actually sounds like you when it speaks to your prospects.", "created_at": "2026-07-25T14:19:22.380927+00:00", "updated_at": "2026-07-25T14:19:22.380934+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
