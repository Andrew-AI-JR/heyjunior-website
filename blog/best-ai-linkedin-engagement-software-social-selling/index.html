    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 55, "slug": "best-ai-linkedin-engagement-software-social-selling", "title": "Best AI Linkedin Engagement Software for Social Selling Tools Beyond Aware", "excerpt": "Discover the top AI LinkedIn engagement software for social selling. Compare tools beyond Aware and learn how to drive pipeline safely with authentic commenting.", "featured_image_url": "https://assets.bevisible.app/featured-images/j574vswp1bfgq6rwmndennhczn8ajdcy/best-ai-linkedin-engagement-software-for-social-se-1785161930155-nlckku.png", "published_at": "2026-07-27T14:00:00+00:00", "content": "# Best AI Linkedin Engagement Software for Social Selling Tools Beyond Aware\n\nCold direct messaging on LinkedIn is yielding diminishing returns. As inboxes become increasingly clogged with automated pitches, decision-makers have retreated to the public feed. They read industry discussions, evaluate insights in the comment sections, and connect with peers based on shared ideas. For job seekers, sales teams, and agency founders, this shift means social selling is no longer about how many connection requests you can send\u2014it\u2019s about how many meaningful conversations you can start.\n\nScaling public engagement, however, introduces a new problem. Manually finding relevant posts and crafting thoughtful, context-aware comments takes hours. Turning to AI to speed up the process often results in generic, robotic replies like \"Great post! Thanks for sharing!\" which damage your reputation faster than they build it. \n\nEnterprise teams often turn to platforms like Aware to monitor discussions and manage brand risk at scale. But if your goal is to directly drive pipeline, book interviews, or acquire consulting clients through individual social selling, enterprise listening tools fall short. You need an engagement engine built for action, authenticity, and account safety.\n\nThis guide breaks down the core evaluation criteria for [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026), examines why platforms like Aware might not fit your specific needs, and reviews the top alternatives designed to turn public visibility into private pipeline.\n\n## The Limitations of Legacy Social Selling (and Aware's Enterprise Focus)\n\nBefore evaluating alternatives, it helps to understand why the market is shifting away from traditional connection tools and passive listening platforms.\n\nAware is an incredibly powerful platform for enterprise collaboration data. It excels at governance, risk management, and broad social listening across employee networks. If you are a Fortune 500 compliance officer needing to ensure employee advocacy on LinkedIn doesn't violate SEC regulations, Aware is the gold standard.\n\nHowever, if you are a founder, a lead gen agency, or a B2B sales professional, your social selling requirements are vastly different. You don't need compliance monitoring; you need a proactive way to bypass crowded inboxes. You need tools that:\n\n1.  Identify hyper-relevant posts where your target buyers are actively discussing their pain points.\n2.  Draft contextual, nuanced replies that sound exactly like you, based on your unique bio and goals.\n3.  Keep your LinkedIn account safe from algorithmic penalties associated with cloud-based automation.\n\nEnterprise platforms are too heavy, and legacy automation tools (which spam connection requests) are too risky. The modern social selling playbook relies on strategic, AI-assisted commenting.\n\n## Core Evaluation Criteria for AI LinkedIn Engagement Tools\n\nNot all AI engagement tools are built the same. When evaluating your options for 2026, you need a strict framework to separate legitimate pipeline generators from high-risk bot scripts. If you are building an [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), prioritize these four pillars:\n\n### 1. Safety Architecture: Cloud vs. Local Execution\nLinkedIn's security algorithms have become ruthlessly efficient at detecting cloud-based automation. Tools that log into your account from a server in Virginia while you are browsing from London will trigger immediate account restrictions. The most critical evaluation metric is where the software runs. Modern, safe tools run locally on your machine, mimicking human browsing behavior, rather than relying on headless cloud servers.\n\n### 2. Contextual Nuance\nBasic AI tools read the text of a post and summarize it. Advanced AI engagement software understands the underlying sentiment of the post, cross-references it with your personal bio, and drafts a comment that adds a unique, contrarian, or additive perspective. The software should allow you to dictate a goal (e.g., \"position me as an expert in B2B SaaS pricing\") and shape the AI's output accordingly.\n\n### 3. Workflow Proximity\nDoes the tool require you to operate out of a completely separate dashboard, or does it integrate natively into your LinkedIn browsing experience? Tools that sit alongside your feed allow for rapid human-in-the-loop editing, ensuring you never accidentally post an unreviewed AI hallucination.\n\n### 4. Feed Curation\nYou cannot engage with buyers if you cannot find them. The software should help surface discussions relevant to your niche, separating high-leverage conversations (a post by a target prospect with 15 comments) from low-leverage echo chambers (a viral post with 10,000 comments where your input will be buried).\n\n![A decision matrix comparing Cloud Automation and Local Automation for LinkedIn engagement](https://assets.bevisible.app/inline-images/j574vswp1bfgq6rwmndennhczn8ajdcy/inline-1-1785161853321-w49j03.png)\n## Top AI LinkedIn Engagement Software Alternatives\n\nIf Aware isn't the right fit for your proactive social selling goals, here are the top software solutions designed to generate visibility and pipeline through engagement.\n\n### 1. Junior: The Authentic Local Commenting Engine\nJunior was built specifically to solve the \"generic AI spam\" problem while prioritizing account safety. Instead of relying on risky cloud servers, Junior is an AI-powered LinkedIn automation tool that runs entirely locally on your machine. This architectural decision makes it arguably the standard for [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\nJunior doesn't send cold DMs. Instead, it acts as a strategic co-pilot for post commenting. Serving job seekers, sales teams, agencies, and consultants, it helps professionals bypass crowded inboxes by finding relevant discussions and drafting context-aware, human-sounding replies based strictly on the user's unique bio and goals.\n\n**Key Advantages for Social Selling:**\n*   **Zero Cloud Risk:** Because it runs locally, it uses natural interaction patterns, heavily protecting your account safety.\n*   **Hyper-Personalization:** The AI drafts comments that actually sound like you, adding real value to industry discussions rather than just summarizing the original post.\n*   **Inbound Pipeline:** By consistently leaving high-value comments on target prospects' posts, you trigger profile views that naturally convert into direct interviews or client conversations.\n\nIf you are transitioning away from automated messaging sequences to find clients, reading up on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) highlights why inbound commenting is outperforming outbound pitching.\n\n### 2. Taplio: The Content Generation Hub\nTaplio is a widely recognized tool for personal branding on LinkedIn. While its primary strength lies in content creation\u2014helping users draft posts, schedule content, and analyze their own profile metrics\u2014it also includes features for feed engagement and social selling CRM integration.\n\n**Key Advantages for Social Selling:**\n*   **Post Scheduling:** Excellent for maintaining a consistent presence on your own feed.\n*   **CRM Features:** Allows you to categorize connections and track leads within their dashboard.\n\n**Tradeoffs to Consider:**\nTaplio operates heavily in the cloud. While they have safeguards, users heavily focused on deep, authentic commenting often find the engagement features secondary to the content scheduling tools. For a deeper breakdown of how content generation compares to pure engagement strategy, see [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n### 3. Supergrow: The Personal Branding Assistant\nSupergrow focuses heavily on helping founders and creators build an audience through AI-assisted post formatting and basic engagement tools. It provides templates, carousel generators, and a clean interface for managing your daily LinkedIn tasks.\n\nWhile it is a strong contender for content creators, sales teams heavily focused on targeted account engagement might need a tool more specialized in nuanced conversation generation. You can explore a broader comparison of [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) to see where the feature sets diverge.\n\n### 4. Dripify: The Cloud Sequence Builder\nDripify is a legacy powerhouse for outbound sequence automation. If your goal is to build complex, multi-step workflows (e.g., View Profile -> Wait 1 Day -> Send Connection Request -> Wait 2 Days -> Send Message), Dripify offers a robust visual sequence builder.\n\n**The Reality of Outbound Sequences in 2026:**\nThe challenge with tools like Dripify isn't the software\u2014it's the strategy. LinkedIn users are highly resistant to automated sequences. Furthermore, because Dripify is cloud-based, it carries inherent account risks compared to local-execution tools. For users looking to build pipeline without alienating prospects, shifting from sequence-building to strategic commenting is often a safer, more profitable bet.\n\n### 5. Phantombuster: The Technical Scraper\nPhantombuster is a tool for technical marketers who want to scrape LinkedIn data, enrich leads, and trigger actions via APIs. It is highly versatile but requires a steep learning curve and constant management of session cookies to avoid account bans.\n\nUsing Phantombuster for engagement is possible but heavily risky due to its strict automation approach. If you are looking for [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster), you should prioritize tools that emulate human behavior locally rather than executing headless API calls. For more on safe execution, refer to [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n## Comparison Matrix: Cloud-Based Automation vs. Local AI Engagement\n\nTo make an informed decision, you must understand the underlying architecture of these tools. Here is how local execution (like Junior) compares to traditional cloud execution across critical social selling metrics.\n\n| Feature | Cloud-Based Engagement | Local AI Engagement (Junior) |\n| :--- | :--- | :--- |\n| **Account Risk Level** | High (Server-side IP triggers LinkedIn security) | Minimal (Runs directly from your machine/IP) |\n| **Setup Complexity** | Moderate (Requires syncing cookies/extensions) | Low (Operates seamlessly with your browser) |\n| **Interaction Style** | Scheduled, batch-processed, often rigid | Real-time, context-aware, human-paced |\n| **Best Use Case** | Broad data scraping, outbound email enrichment | Targeted social selling, pipeline generation, authentic networking |\n| **Tone Quality** | Often generic due to batch processing | Highly personalized, based on specific user goals and bio |\n\n## A Tactical Framework for AI-Assisted Social Selling\n\nOwning the right software is only 20% of the equation. The other 80% is the workflow you wrap around it. Relying entirely on AI to run your social selling without a strategy is a fast track to damaging your personal brand.\n\nHere is a step-by-step framework to use AI engagement software effectively to drive pipeline.\n\n### Step 1: Curate the Right Feed\nDo not let LinkedIn's default algorithm dictate who you engage with. You need to actively curate discussions. Use LinkedIn Sales Navigator or native search to find recent posts from your ideal customer profile (ICP). \n\nTarget posts that have between 3 and 20 comments. If a post has zero comments, the author has no reach, and your visibility will be low. If a post has 500 comments, your contribution will be buried. The 3-20 range is the sweet spot where the author will read your comment, and their small but engaged audience will see it. Finding these posts efficiently is crucial; reviewing the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) can streamline this process.\n\n### Step 2: Leverage the \"Add-and-Pivot\" Commenting Strategy\nWhen using an AI tool like Junior to draft a response, never accept the first output if it merely agrees with the author. The goal of a comment in social selling is to demonstrate your expertise.\n\nUse the **Add-and-Pivot** framework:\n1.  **Acknowledge** the author's core premise.\n2.  **Add** a concrete example, a brief statistic, or a nuanced edge-case from your own experience.\n3.  **Pivot** the conversation slightly to encourage a reply from the author.\n\nBy instructing your AI tool to use this framework based on your specific background, you transform a generic interaction into a micro-consultation.\n\n### Step 3: Triggering the Inbound Profile View\nWhen you leave a highly insightful comment on a target prospect's post, two things happen. First, the prospect feels validated. Second, their curiosity is piqued. They will almost always click your name to view your profile.\n\nThis is why your LinkedIn profile must be optimized as a landing page. Your headline should clearly state the problem you solve and who you solve it for. If your profile is confusing, the engagement is wasted.\n\n### Step 4: The Warm Transition\nOnce the prospect views your profile, or better yet, replies to your comment, the cold barrier is broken. You have earned the right to send a connection request. \n\nDo not pitch in the connection request. Say: *\"Really enjoyed our back-and-forth on your post about [Topic] today. Wanted to stay connected to see more of your feed.\"* \n\nBecause you provided value publicly first, connection acceptance rates skyrocket, and the transition into a pipeline conversation feels entirely natural.\n\n![A flowchart detailing the LinkedIn social selling funnel from commenting to pipeline](https://assets.bevisible.app/inline-images/j574vswp1bfgq6rwmndennhczn8ajdcy/inline-2-1785161852822-rhews4.png)\n## The Hidden Risk: Why You Must Evaluate Account Safety\n\nOne of the most overlooked aspects of social selling software is account longevity. Over the past few years, LinkedIn has aggressively cracked down on spam, automated connection requests, and robotic engagement.\n\nMany professionals have built massive pipelines only to wake up to an account restriction because their cloud-based sequence tool triggered a security flag. When you lose your LinkedIn account, you lose your network, your inbound lead flow, and your industry reputation.\n\nThis is the primary reason why local execution is replacing cloud automation. By running the software locally on your own machine\u2014the same machine and IP address you use every day\u2014you bypass the red flags associated with server-farms in different countries logging into your account. \n\nWhen reviewing an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist), \"local execution\" should be the mandatory first requirement before looking at any other features.\n\n## Frequently Asked Questions\n\n### Do AI engagement tools violate LinkedIn's terms of service?\nTools that circumvent LinkedIn's interface using undocumented APIs, scrape data en masse, or bypass connection limits often violate the terms of service and risk account bans. However, tools that run locally, require human-in-the-loop review, and simply assist in drafting text while operating within normal human browsing patterns maintain a much higher standard of safety.\n\n### Can AI really replicate my personal tone?\nYes, provided the software allows for deep contextual input. Tools that just summarize posts sound robotic. Tools that allow you to input your specific bio, your professional goals, and your unique stylistic preferences (e.g., \"use short sentences, never use emojis, focus on data\") can draft highly authentic replies.\n\n### How many comments per day should I aim for in a social selling routine?\nQuality vastly outweighs quantity. Leaving 15 highly strategic, value-additive comments on posts from targeted prospects will yield significantly more pipeline than blasting 100 generic comments across random feeds. Treat commenting as a targeted outbound activity.\n\n## Rethinking Your Social Selling Tech Stack\n\nTraditional outbound methods on LinkedIn are suffering from fatigue. Your prospects are tired of automated pitches in their DMs, but they remain highly receptive to smart, engaging professionals who add value to their public discussions.\n\nWhile enterprise listening tools like Aware serve a critical corporate function, they are not designed to help individual contributors, founders, and agencies generate direct revenue. To succeed in 2026, you need software that respects the nuance of human interaction while providing the scale that modern sales requires.\n\nBy choosing an AI engagement tool that prioritizes local safety, understands your unique context, and focuses on public feed visibility over private inbox spam, you can turn LinkedIn from a frustrating cold-outbound channel into your most reliable source of inbound pipeline.", "created_at": "2026-07-27T14:19:24.267845+00:00", "updated_at": "2026-07-27T14:19:24.267851+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
