    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 54, "slug": "how-to-find-clients-linkedin-without-cold-dms", "title": "How to use a comment-first approach to find LinkedIn clients without cold DMs", "excerpt": "Tired of ignored pitches? Discover how consultants can find clients on LinkedIn without cold DMs using a proven, comment-first strategy to drive warm inbound leads.", "featured_image_url": "https://assets.bevisible.app/featured-images/j573xp19bf1g8setbke97kr8d98ak15s/how-to-use-a-comment-first-approach-to-find-linked-1785075535508-i3sdps.png", "published_at": "2026-07-26T14:00:00+00:00", "content": "# How to use a comment-first approach to find LinkedIn clients without cold DMs\n\nIf you are a consultant trying to build a pipeline on LinkedIn, you have likely run the numbers on cold direct messaging. The math is grim. \n\nYou send 100 automated connection requests. Maybe 20 get accepted. You fire off a sequence of four automated pitch messages. Nineteen prospects ignore you, and one replies with a polite \u201cnot interested at this time.\u201d You spend hours tweaking scripts, buying new automation tools, and worrying about account restrictions, only to realize that forcing your way into crowded inboxes yields diminishing returns every quarter.\n\nThe most successful consultants have stopped playing this volume game. Instead of chasing leads through private, interruptive messages, they are moving from a \u201cchasing\u201d mindset to an \u201cattracting\u201d mindset. [They position their consultancy as the go-to authority in their niche](https://www.linkedin.com/pulse/effective-client-acquisition-strategies-technology-consultants-ball-tu3ke), leveraging high-value public engagement to pull prospects in.\n\nThis is the comment-first approach. \n\nBy systematically finding relevant industry conversations and adding contextual, thoughtful insights in the comments, you turn your public visibility into direct interviews, warm pipeline, and client conversations. \n\nThis guide breaks down exactly how independent consultants, agency owners, and founders can build a sustainable lead generation engine on LinkedIn entirely without cold DMs.\n\n## The Anatomy of the Comment-First Strategy\n\nBefore diving into the tactics, it helps to understand why commenting outperforms cold outreach for high-ticket consulting services.\n\nWhen you send a cold DM, you are creating a 1-to-1 interaction with a high barrier to entry. The recipient does not know you, trust you, or necessarily have the problem you solve right at this second. You are a disruption.\n\nWhen you leave a highly insightful comment on a post relevant to your target audience, you create a 1-to-Many interaction with zero barrier to entry. \n\n1. The original poster appreciates the engagement.\n2. The hundreds or thousands of people reading the post see your expertise on display.\n3. Your profile becomes a magnet. People click your name, read your headline, and consume your content on their own terms.\n\nIt is the exact strategy that gets clients [from zero to highly qualified leads in days, completely bypassing the need to send hundreds of cold pitches](https://www.linkedin.com/top-content/sales/sales-productivity-tools/streamline-warm-introductions-using-sales-tools/). The comment acts as a micro-audition for your consulting brain.\n\n## Phase 1: Optimize Your Profile for Attraction, Not a Resume\n\nBefore you write a single comment, your profile must be ready to capture the traffic you are about to generate. The comment-first strategy relies entirely on profile conversions. If you leave a brilliant comment but your profile looks like a traditional resume seeking employment, prospects will bounce.\n\nYour profile needs to function as a high-converting landing page. [Write a clear headline, craft a client-focused 'About' section, and showcase your results](https://www.womenconquerbiz.com/linkedin-find-clients-hate-networking/).\n\n### The Client-Focused Headline\n\nYour headline is the only thing (besides your photo and name) that follows your comments around LinkedIn. It dictates whether someone clicks your profile.\n\n**Weak Headline:** *Management Consultant at XYZ Corp | Strategy | Operations*\n\n**Strong Headline:** *Helping B2B Tech Founders Reduce Operational Drag and Increase Margins by 15% | Operations Consultant*\n\nThe strong headline uses a simple formula: **Helping [Target Audience] achieve [Specific Outcome] by [Core Mechanism].** When a B2B tech founder sees that headline next to a smart comment, curiosity compels them to click.\n\n### The Strategic 'About' Section\n\nStop writing your About section in the third person, and stop reciting your employment history. Treat this space as a sales letter.\n\n*   **The Hook:** Acknowledge the specific pain point your ideal client is facing right now.\n*   **The Agitation:** Briefly explain why their current solutions are failing.\n*   **The Solution:** Introduce your consulting framework or approach.\n*   **The Proof:** Mention high-level results you have achieved for similar clients.\n*   **The Call to Action (CTA):** Tell them exactly what to do next. (e.g., \"Book a 15-minute discovery call via the link in my Featured section, or send me a DM saying 'Audit'.\")\n\n### The Featured Section as a Lead Magnet\n\nThe Featured section sits high on your profile and supports rich media. Do not waste it on a link to your company homepage. \n\nInstead, [add your best case studies in the \u201cFeatured\u201d section](thinklittlebig.com/blog/how-accountants-can-use-linkedin-to-attract-more-clients/). You should also [add testimonials, or content relevant to your target accounts](https://www.cleverly.co/blog/linkedin-account-based-marketing). \n\nConsider featuring:\n*   A link to book a strategy call on your calendar.\n*   A comprehensive PDF case study detailing how you solved a massive problem for a past client.\n*   A link to a lead magnet (e.g., a checklist or email course) to capture emails.\n\n![Diagram showing how to optimize a LinkedIn profile for client attraction with a focused headline, about section, and featured](https://assets.bevisible.app/inline-images/j573xp19bf1g8setbke97kr8d98ak15s/inline-1-1785075464008-3n8otf.png)\n## Phase 2: Locating the Right Conversations\n\nLeaving great comments on the wrong posts yields nothing. Your goal is to intercept the attention of your ideal consulting clients. There are three primary ways to find the posts where your future clients are already reading and engaging.\n\n### 1. Targeting Your Ideal Client Profile (ICP) Directly\n\nIf you have a clear list of target accounts or individuals, you should monitor their activity closely.\n\n*   Use LinkedIn search to find individuals matching your ICP (e.g., \"VP of Supply Chain\").\n*   Navigate to their profile and click \"Show all activity,\" then filter by \"Posts.\"\n*   Ring the \"bell\" icon on their profile so you get notified every time they publish.\n\nWhen they post, be one of the first to leave a thoughtful, value-add comment. You are not pitching them; you are validating their thoughts and adding a layer of professional insight. This builds massive rapport before you ever speak privately.\n\n### 2. Engaging with Industry \"Super-Connectors\"\n\nWhat if your ideal clients do not post content? Many executives and founders are \"lurkers\"\u2014they read LinkedIn daily but rarely post their own thoughts.\n\nTo reach them, you must find the \"super-connectors\" in your industry. These are the thought leaders, journalists, software vendors, and analysts whose content your ideal clients actively consume.\n\nIf you sell HR consulting services, find the top HR tech influencers. When they post about talent retention, your ideal clients are reading that post. By leaving a highly detailed, contrarian, or uniquely insightful comment, you hijack the attention of that influencer's audience.\n\n### 3. Monitoring Keyword Triggers\n\nUse LinkedIn's search bar to look for specific phrases related to the problems you solve. Search for terms like *\"struggling with churn,\"* *\"recommendations for a fractional CFO,\"* or *\"trying to figure out our Q4 strategy\"* and filter by \"Posts\" from the past week.\n\nThis surfaces high-intent conversations where people are actively asking for help or venting about the exact problems your consultancy solves.\n\n## Phase 3: Executing the \"Value-Add\" Comment Workflow\n\nThe difference between a comment that gets ignored and a comment that generates a $20,000 consulting contract comes down to substance. \n\n\"Great post!\" or \"Thanks for sharing, agree 100%\" are useless. They demonstrate zero expertise. To generate inbound interest, you must use the C.A.R.E framework for commenting.\n\n### The C.A.R.E. Commenting Framework\n\n*   **Context:** Acknowledge the core premise of the original post to show you actually read it.\n*   **Agreement or Alternative:** State your stance. You can agree with a specific nuance, or politely offer a contrarian perspective.\n*   **Real-world example:** This is the most crucial step. Bring in a data point, a brief anonymized client story, or a specific tactic you use in your consulting practice. This proves you are a practitioner, not just a theorist.\n*   **Ending question (Optional):** End with a soft question back to the creator to spark a thread and boost the comment's visibility.\n\n**Example Scenario:** An industry influencer posts about the difficulty of maintaining company culture during rapid growth.\n\n**Poor Comment:** *\"So true! Culture is everything.\"*\n\n**C.A.R.E. Comment:** *\"You nailed it on the disconnect between leadership and middle management here. In my experience, culture usually breaks at the Director level during rapid scale. When I was consulting for a Series B SaaS last year, we implemented a 'Culture Audit' purely for middle managers, and we found they were actively overriding the founders' values just to hit KPIs. Have you seen similar friction at that specific management layer?\"*\n\nNotice what the second comment does. It validates the poster, introduces a specific consulting engagement, highlights a unique observation, and asks a relevant question. Anyone reading that comment immediately recognizes you as an expert in organizational scaling.\n\n![The C.A.R.E framework for LinkedIn comments: Context, Agreement, Real-world example, and Ending question.](https://assets.bevisible.app/inline-images/j573xp19bf1g8setbke97kr8d98ak15s/inline-2-1785075458485-80se0e.png)\n### The Rule of Constructive Disagreement\n\nDo not be afraid to disagree, provided you do it professionally and back it up with data. Constructive disagreement often yields the highest engagement because it stands out in a sea of toxic positivity. \n\nIf you gently challenge an influencer's premise with a well-reasoned argument from your consulting experience, other readers will flock to your profile out of sheer respect for your critical thinking.\n\n## Phase 4: Transitioning from Public Comment to Private Conversation\n\nThe comment-first strategy naturally leads to what we call the \"Warm Inbound.\" You are not sending a cold DM; you are continuing a conversation that already started in public.\n\nHere are the three ways this transition happens:\n\n### Scenario A: The Direct Inbound\n\nA prospect reads your comment, clicks your profile, reads your optimized About section, and books a call directly through your Featured section. You wake up to a booked meeting with zero outreach required.\n\n### Scenario B: The Profile View Trigger\n\nYou leave a comment. A target prospect reads it and views your profile, but leaves without taking action. \n\nBecause you are monitoring your \"Who viewed your profile\" page, you see them. Now, you have a warm trigger. You send a connection request with a personalized note:\n\n*\"Hi [Name], saw you stopped by my profile\u2014guessing it was from the thread on [Influencer]'s post about Q4 margins. I actually put together a quick checklist on that topic for my clients recently. Happy to send it over if it's helpful. If not, great to connect regardless!\"*\n\nThis is not a cold DM. It is a highly contextual follow-up to a mutual interaction.\n\n### Scenario C: The Comment Thread to DM Pivot\n\nYou are having a great back-and-forth conversation in the comment section with an ideal prospect. After 2-3 replies, you transition it to the DMs.\n\n*\"This is a great discussion, [Name]. I actually have a template I built for this exact workflow. I'll shoot you a quick connection request and drop it in your inbox so we don't monopolize this comment thread.\"*\n\nAgain, completely natural, entirely permission-based, and highly effective.\n\n## Scaling Your Strategy Safely (The Tech Stack)\n\nThe barrier to executing a comment-first strategy is time. Manually scrolling through the feed to find the right posts and writing thoughtful replies can eat up hours of your day. \n\nHistorically, consultants turned to automation to save time, using cloud-based sequencing tools to spam inboxes. As we've established, that method is burning out. If you are comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), you quickly realize that automating comments requires a completely different approach than automating connection requests.\n\nTo scale comment-first growth without resorting to spam or risking a LinkedIn ban, you need the right toolset.\n\n### Finding the Posts\n\nYou need a tool that curates a feed of hyper-relevant posts based on your ideal client profiles and keywords. Instead of relying on LinkedIn's algorithm (which often shows you viral fluff), you want a dedicated dashboard of high-value conversations waiting for your insight. Exploring the [best tools to find relevant LinkedIn posts to comment on](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) is crucial for maintaining efficiency.\n\n### Drafting the Contextual Replies\n\nGenerative AI has changed how we engage. However, generic AI comments (\"Great point, let's connect!\") are arguably worse than silence. They damage your brand.\n\nThe key is using AI to *draft* context-aware, human-sounding replies based on your unique bio, tone, and consulting goals. The AI should read the original post, analyze your consulting background, and suggest a C.A.R.E. framework comment. You then edit that draft, add your specific real-world example, and post it.\n\nThis reduces the time-to-comment from 5 minutes to 30 seconds while maintaining the high quality required for consulting sales. When evaluating the [best AI tools for LinkedIn commenting](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), look for platforms that allow deep persona customization.\n\n### Protecting Account Safety\n\nLinkedIn is aggressively cracking down on cloud-based automation tools. If a tool logs into your account from a server in Virginia while you are sitting in London, your account gets flagged. \n\nFor [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), you must use tools that run *locally* on your machine. Local execution mimics natural human interaction patterns. The tool uses your actual IP address and your actual browser session. \n\nThis is why consultants are seeking robust [Phantombuster alternatives](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) that prioritize local, authentic engagement over high-volume cloud scripting. Tools like Junior are designed specifically for this\u2014running locally to protect account safety while helping you start authentic conversations through strategic post commenting.\n\n![Comparison matrix showing the benefits of local comment automation versus risky cloud-based direct messaging.](https://assets.bevisible.app/inline-images/j573xp19bf1g8setbke97kr8d98ak15s/inline-3-1785075450579-rorsrz.png)\n## The 30-Day Comment-First Implementation Plan\n\nTransitioning from cold outreach to inbound commenting doesn't happen overnight. Here is a realistic 30-day timeline to make the shift.\n\n### Week 1: Foundation and Cleanup\n\n*   **Day 1-2:** Rewrite your LinkedIn headline using the formula provided above.\n*   **Day 3-5:** Overhaul your About section. Remove the resume jargon; write a client-facing sales letter.\n*   **Day 6-7:** Update your Featured section with your best case study and a clear link to book a discovery call.\n\n### Week 2: Audience Mapping\n\n*   **Day 8-10:** Identify and follow 20 industry \"super-connectors\" whose audiences overlap with your ICP. Ring the notification bell on their profiles.\n*   **Day 11-14:** Build a boolean search string to find high-intent keyword posts (e.g., \"looking for recommendations + [your niche]\"). Save this search.\n\n### Week 3: The Daily Habit\n\n*   **Day 15-21:** Dedicate 30 minutes a day to leaving 5 highly targeted, C.A.R.E. framework comments on influencer posts or ICP posts. Do not send any cold DMs this week. Focus entirely on public value.\n\n### Week 4: Harvesting and Optimization\n\n*   **Day 22-28:** Monitor your \"Who viewed your profile\" metrics. Send warm connection requests (Scenario B) to any target accounts that visited your profile after seeing a comment.\n*   **Day 29-30:** Review the [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) to automate the curation and drafting process now that you have proven the manual concept.\n\n## Edge Cases and Potential Pitfalls\n\nNo strategy is bulletproof. Here are the common roadblocks consultants face when adopting a comment-first approach, and how to navigate them.\n\n**\"My ideal clients don't post on LinkedIn.\"** \nAs mentioned earlier, this is incredibly common for C-suite executives or specialized industries (like healthcare or defense). If they don't post, you cannot comment on their content. You must pivot to commenting on the content they *consume*\u2014industry publications, software vendors, and major thought leaders in that specific vertical.\n\n**\"Competitors are stealing my insights.\"** \nWhen you share your consulting frameworks in public comments, competitors will inevitably see them. Let them. The value of a consultant is not knowing the framework; it is in the *execution* of the framework tailored to a specific company. Giving away the \"what\" and the \"why\" proves your expertise. Clients will pay you for the \"how.\"\n\n**\"I'm getting engagement, but no calls.\"** \nIf your comments are getting likes and profile views, but your calendar is empty, the breakdown is happening on your profile. Your headline might be vague, or your Featured section might lack a clear Call to Action. Revisit Phase 1. Ensure your profile removes all friction from booking a discovery call.\n\n## Frequently Asked Questions\n\n### How many comments should I leave per day?\nQuality vastly outweighs quantity. For a consultant selling high-ticket engagements, 5 to 10 highly strategic, paragraph-length comments per day will outperform 50 generic comments. \n\n### Can I still send connection requests?\nYes, but the nature of the request changes. Instead of cold connecting with a pitch, you send \"warm\" connection requests to people who have viewed your profile or engaged with your comments. This dramatically increases your acceptance rate and prevents LinkedIn from restricting your account for low acceptance scores.\n\n### How long does it take to see results?\nUnlike cold DMs which might yield an immediate (though rare) \"yes,\" the comment-first approach builds momentum. You will typically see an increase in profile views within 48 hours. Warm inbound messages and booked calls usually begin materializing consistently between days 14 and 30, provided your profile is optimized to convert.\n\n## Escaping the Inbox Grind\n\nThe era of spray-and-pray cold messaging on LinkedIn is drawing to a close. Decision-makers have zero tolerance for automated inbox clutter, and LinkedIn's algorithms are increasingly hostile to the tools that facilitate it.\n\nFor consultants, this shift is actually a massive opportunity. By adopting a comment-first strategy, you elevate yourself out of the spam folder and into the town square. You replace private begging with public authority. \n\nStart optimizing your profile today, identify the hubs where your ideal clients gather, and begin leaving comments that prove your expertise. When you are ready to scale, leverage tools that prioritize authentic, local AI engagement. The clients will follow the value you create.", "created_at": "2026-07-26T14:19:22.358807+00:00", "updated_at": "2026-07-26T14:19:22.358814+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
