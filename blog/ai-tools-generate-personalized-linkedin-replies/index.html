    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 115, "slug": "ai-tools-generate-personalized-linkedin-replies", "title": "Best AI Tools to Generate Personalized Linkedin Replies Tools Beyond Aware", "excerpt": "Discover the best AI tools to generate personalized LinkedIn replies beyond Aware. Compare Junior, Taplio, and safe local setups to boost inbound engagement.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575y9fpz39h5mkvjx6gs83npd8f6zkk/best-ai-tools-to-generate-personalized-linkedin-re-1790529499235-45jwzi.png", "published_at": "2026-09-28T16:45:00+00:00", "content": "# Best AI Tools to Generate Personalized Linkedin Replies Tools Beyond Aware\n\nIf you spend more than five minutes scrolling through LinkedIn today, you will immediately notice a distinct pattern in the comment sections. Beneath almost every viral post, there is a graveyard of robotic replies: *\"Great insights, thanks for sharing!\"*, *\"I completely agree with this perspective,\"* or a three-paragraph essay that sounds suspiciously like it was written by an eighteenth-century philosopher trying to sell B2B software. \n\nThe widespread adoption of generative AI has solved the problem of writer's block, but it has created a new, much more damaging problem: the loss of authenticity. When everyone has access to the same language models, generic replies become noise. To actually turn public visibility into direct interviews, sales pipelines, and client conversations, you need AI tools that understand context, mimic your specific tone, and protect your account from algorithmic penalties.\n\nFor a long time, Aware has been the default answer for professionals looking to manage LinkedIn engagement. It offers a structured feed and analytics that help you stay on top of conversations. But as LinkedIn's algorithm evolves to prioritize deep, human-centric interactions over sheer volume, simply managing your feed isn't enough. You need tools that bridge the gap between finding the right conversation and crafting a reply that sounds unmistakably like *you*.\n\nThis guide breaks down the best AI tools to generate personalized LinkedIn replies, exploring why legacy platforms are losing their edge and how a new generation of local, context-aware automation is taking over.\n\n## The Problem with First-Generation AI Replies\n\nBefore evaluating specific tools, we have to look at why most AI-generated LinkedIn replies fail. The goal of commenting on a prospect's or industry peer's post is to borrow their audience and demonstrate your expertise. It is a highly leveraged activity; a well-placed comment on a post with 100,000 views can drive hundreds of profile visits.\n\nHowever, first-generation AI tools\u2014mostly cloud-based Chrome extensions that slap a ChatGPT wrapper onto your browser window\u2014fail at this for three distinct reasons.\n\n### 1. The Context Vacuum\nMost basic AI reply generators read the text of the post and nothing else. They do not know who you are, what your company sells, what your unique perspective is, or what relationship you have with the original poster. If a Chief Marketing Officer posts about the struggles of attribution modeling, a basic AI tool will reply with a summary of the post. A truly personalized reply, however, would mention your specific experience running attribution for SaaS companies, tying the author's pain point to your unique bio.\n\n### 2. The Uncanny Valley of AI Tone\nBy default, large language models use an overly enthusiastic, slightly sycophantic tone. They use words like \"delve,\" \"testament,\" \"pivotal,\" and \"crucial.\" When a prospect sees a comment laden with these markers, they instantly recognize it as automated. This doesn't just fail to generate a lead; it actively damages your brand. You look like someone who couldn't be bothered to read their thoughts.\n\n### 3. The Risk of Cloud Automation\nLinkedIn aggressively protects its ecosystem from bot activity. Many popular automation tools run in the cloud, utilizing shared IP addresses or headless browsers that behave in non-human ways. When LinkedIn detects this, the penalties range from shadowbanning your content to outright account restriction. Moving away from risky cloud setups is why many professionals are seeking [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n![Diagram comparing generic bot LinkedIn replies with context-aware personalized comments.](https://assets.bevisible.app/inline-images/j575y9fpz39h5mkvjx6gs83npd8f6zkk/inline-1-1790529454108-oev7sk.png)\n## Evaluating AI Tools for Personalized Replies\n\nWhen looking beyond basic wrappers and legacy platforms like Aware, you need a strict criteria for evaluation. The ideal tool doesn't just write text; it acts as an extension of your own professional brain. If you are building a tech stack for yourself or your team, consider running potential software through a rigorous [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\nHere are the non-negotiable features a modern AI reply tool must possess:\n\n*   **Deep Context Integration:** The tool must allow you to input your professional bio, your current goals (e.g., seeking a senior developer role, selling compliance software, finding consulting clients), and your preferred tone. It should use this data as the foundational prompt for every reply it drafts.\n*   **Local Execution:** To keep your account safe, the tool should run locally on your machine, mimicking natural human interaction patterns (like reading time, scrolling, and clicking) rather than firing off API requests from a server farm in another country.\n*   **Manual Checkpoints:** Total automation is a liability. If someone posts about a tragedy or a massive company layoff, and your AI automatically comments, \"Congratulations on the milestone! \ud83d\ude80\", your reputation is ruined. The tool must draft the reply but require a human to hit \"send.\"\n*   **Strategic Targeting:** Generating a great reply is useless if it is posted on an irrelevant update. The tool needs to help you find high-value conversations\u2014posts from your target accounts, hiring managers, or industry thought leaders.\n\nFor a deeper dive into making sure your software choice won't compromise your account, review the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n## Top AI Tools for Personalized LinkedIn Replies\n\nThe landscape of LinkedIn automation has fractured into different methodologies. Some tools focus on mass connection requests, some on content scheduling, and a select few on the most critical aspect of modern growth: authentic conversation through commenting.\n\n### Junior: The Context-Aware Local Powerhouse\n\nIf you are looking for a platform that learns your voice and protects your account, Junior is currently the strongest alternative on the market. Unlike traditional automation platforms that rely on cloud servers and risky mass-DM strategies, Junior is designed specifically for strategic post commenting. \n\nJunior runs locally on your machine. This is a massive architectural advantage. By operating from your own IP address and mimicking the exact way a human scrolls and interacts with the LinkedIn interface, it virtually eliminates the risk of algorithmic bans. This approach makes it a standout choice for anyone prioritizing [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\nBut Junior's real differentiator is how it handles personalization. When you set up Junior, you feed it your unique bio, your current objectives, and the specific nuances of your expertise. When the tool finds a relevant discussion in your niche, it doesn't just read the post; it cross-references the post's content with your bio to draft a context-aware reply. \n\nFor example, if you are a lead generation agency founder and a prospect posts about cold email deliverability, Junior won't draft a generic \"Great tips on email!\" comment. Instead, it will draft a reply that references your agency's specific approach to SPF/DKIM records, adding genuine value to the conversation. It handles the heavy lifting of drafting, but it always leaves the final approval to you, ensuring you never sound like a bot. \n\nFor users tired of generic growth hacks, examining [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) usually leads directly to Junior's local, bio-driven approach.\n\n### Aware: The Analytics and Feed Manager\n\nAware built its reputation on helping professionals tame the chaotic LinkedIn feed. It is excellent at curating content from specific lists of creators, tracking engagement analytics, and ensuring you don't miss posts from your most important connections. \n\nFor surface-level engagement, Aware is highly effective. It allows you to stay organized and reminds you to comment on key accounts. However, when it comes to the actual generation of highly personalized, context-aware AI replies, Aware leaves much of the heavy lifting to the user. It is a fantastic tool for *finding* the conversation, but it lacks the deep, personalized drafting engine that cross-references your specific career goals against the prospect's post. \n\nIf your primary struggle is organization, Aware is a solid choice. If your primary struggle is crafting high-value, non-spammy comments at scale without burning two hours a day, you will likely need a tool that focuses heavier on the drafting and personalization engine.\n\n### The Chat-Based Assistants: ChatGPT, Claude, and Bing\n\nFor those who want total control and have zero budget, the manual approach using advanced LLMs (Large Language Models) like Claude 3.5 Sonnet or ChatGPT-4o remains viable. \n\nUsing chat-based assistants requires you to build your own prompt architecture. You cannot simply paste a LinkedIn post and say, \"Reply to this.\" You have to train the model on your voice, provide context about the author, and enforce strict word counts.\n\nThe workflow typically looks like this:\n1. Copy the LinkedIn post.\n2. Open your AI assistant.\n3. Paste a massive prompt: *\"You are me. Here is my bio. Here is my target audience. Read the following LinkedIn post from a prospect. Draft a 40-word comment that disagrees slightly with their premise but validates their underlying concern. Do not use words like 'delightful,' 'crucial,' or 'testament'.\"*\n4. Copy the result, edit it, and paste it back into LinkedIn.\n\nWhile the output quality can be exceptional\u2014especially with Claude, which tends to write with more natural, human-like cadence than ChatGPT\u2014the friction is incredibly high. Doing this for 30 posts a day is exhausting. It is personalization, but it is the opposite of automation.\n\n### Taplio and Supergrow: The Cloud-Based Content Engines\n\nTaplio and Supergrow are primarily known for content creation and scheduling, but both offer features for generating replies and engaging with other users. They sit in the middle ground: they are more automated than ChatGPT but heavily rely on cloud-based execution and slightly more generic prompt templates.\n\nThese tools are built for creators whose main goal is audience growth through high-volume posting and rapid-fire commenting. They often feature built-in AI reply buttons directly in their dashboards. The downside is that because they serve thousands of users through similar backend prompts, the replies can sometimes feel repetitive. Furthermore, operating through a cloud-based dashboard means you are trusting their IP management to keep your account safe from LinkedIn's security sweeps. \n\nWhen comparing these options for long-term pipeline generation rather than just vanity metrics, professionals often look closely at [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n![Feature comparison table of LinkedIn reply tools across personalization, safety, and speed.](https://assets.bevisible.app/inline-images/j575y9fpz39h5mkvjx6gs83npd8f6zkk/inline-2-1790529457155-txttrb.png)\n### Legacy Automation: Dripify and Phantombuster\n\nIt is impossible to talk about LinkedIn automation without mentioning the old guard. Tools like Dripify and Phantombuster defined the last era of LinkedIn growth, which was primarily focused on scraping profiles and sending hundreds of automated, cold Direct Messages.\n\nWhile these tools offer massive scale, the market has shifted. Buyers in 2026 are highly resistant to cold DMs. Inboxes are flooded with automated pitches, and LinkedIn's connection limits have tightened severely. Generating a personalized reply in a public comment section is now far more valuable than firing off a generic sequence in a private message.\n\nIf you are currently relying on heavy DM automation to book meetings, it is worth evaluating how public visibility can replace that friction. For consultants specifically, reading up on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) illustrates why commenting is the new cold email.\n\n## Building a Bulletproof Personalized Reply Workflow\n\nKnowing which tools exist is only half the battle. Executing a strategy that generates actual pipeline requires a structured workflow. The goal is to maximize personalization while minimizing the time spent staring at the keyboard. \n\nIf you are using a tool like Junior, much of this is handled natively. If you are piecing together your own stack, you must enforce these steps rigidly.\n\n### Step 1: Strategic Triggering and Targeting\n\nDo not comment on every post on your feed. The algorithm rewards relevance. You need to define your target lists:\n*   **The Prospect List:** Decision-makers at accounts you want to close.\n*   **The Ecosystem List:** Non-competing peers who sell to the same audience (e.g., if you sell SEO services, engage with web design agencies).\n*   **The Thought Leader List:** Industry heavyweights whose comment sections are filled with your ideal clients.\n\nFinding the right posts is often the bottleneck. Relying on LinkedIn's default feed is a mistake, as it will surface viral, low-intent content (like someone's morning routine) rather than niche, high-intent discussions. Upgrading your targeting strategy is critical; you can explore the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) to refine this process.\n\n### Step 2: Context Capture\n\nOnce you identify a post, the AI needs context. A post saying \"Our Q3 numbers are finally up\" means nothing in a vacuum. Is the author a startup founder who just avoided bankruptcy, or a VP of Sales at an enterprise firm who just hit a massive quota? \n\nPersonalized reply generation requires the AI to factor in the author's role, company, and ideally, any past interactions you've had. If your automation tool doesn't capture this metadata automatically, you must feed it into your manual prompts.\n\n### Step 3: Drafting with Guardrails\n\nThis is where the magic (or the disaster) happens. A personalized AI reply must adhere to strict guardrails to sound human:\n\n1.  **The 150-Word Limit:** Real professionals do not leave 400-word comments unless they are intensely passionate about the specific topic. Keep replies punchy. Two to three sentences is the sweet spot.\n2.  **The \"Yes, and...\" Rule:** The best replies validate the original post and add a new piece of information. If a post says, \"Cold calling is dead,\" don't just say, \"I agree, cold calling is tough.\" Say, \"The shift away from cold calling makes intent-data so much more valuable. We saw our connect rates drop 20% last year before making the switch.\"\n3.  **Tone Calibration:** Your AI must know if you are a formal consultant or a casual startup founder. Drafting with varying tones (neutral, warm, analytical) allows you to pick the one that fits the specific conversation.\n\n### Step 4: The Manual Checkpoint (The Golden Rule)\n\nNever, under any circumstances, allow an AI to publish a comment without your explicit approval. \n\nThe internet is wildly unpredictable. Sarcasm, cultural references, and nuanced industry complaints are frequently misunderstood by language models. The manual checkpoint is your safety net. You review the drafted reply, tweak a word or two, add a specific name or a hyper-niche reference only you would know, and then hit send. \n\nThis workflow reduces the time to comment from three minutes to fifteen seconds, allowing you to leave 40 high-quality comments a day in just ten minutes.\n\n## Advanced Strategies: Going Beyond the Basic Reply\n\nOnce you have your tooling and workflow dialed in, you can start using personalized AI replies for more advanced networking plays. The top performers on LinkedIn don't just use comments to say \"hello\"\u2014they use them to engineer serendipity.\n\n### The Disagreement Frame\nMost AI tools default to aggressive agreement. It is safe, polite, and completely forgettable. To stand out, configure your AI to look for minor points of friction. You don't want to be combative, but a polite, evidence-based disagreement is the fastest way to prove you are a human expert. \n\n*AI Prompt adjustment:* \"Draft a reply that respectfully disagrees with a minor premise in the post, offering an alternative viewpoint based on my experience in [Your Industry].\"\n\n### The Value-Add Resource Drop\nIf someone posts a question or a pain point, the standard reply is sympathy. The personalized AI reply should identify the pain point and offer a concrete resource\u2014without a link, initially.\n\n*Example:* \"We struggled with this exact bottleneck in Q2. Implementing a local-first automation setup solved it. Happy to share the framework we used if you're interested.\" \n\nThis sparks a conversation. When they reply \"Yes, please,\" you have earned the right to move to the DMs, completely bypassing the \"cold\" phase of the interaction.\n\n### The Network Weaver\nUse your AI drafts to tag other relevant people. If you see a post about a specific software integration, and you know a peer who specializes in it, your personalized reply should bridge the gap.\n\n*Example AI Draft:* \"Fascinating breakdown of the new API limits. I know @[Name] was just talking about how this impacts enterprise clients.\"\n\nThis double-dips your engagement, pulling another person into the thread and associating you with high-level industry matchmaking.\n\n![Four-step process workflow for generating personalized LinkedIn replies safely.](https://assets.bevisible.app/inline-images/j575y9fpz39h5mkvjx6gs83npd8f6zkk/inline-3-1790529452772-67o3iv.png)\n## Navigating the Future of LinkedIn Engagement\n\nAs we look across the landscape of [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026), the trend is unmistakably moving toward quality over quantity. \n\nLinkedIn has severely restricted the effectiveness of automation that doesn't prioritize human connection. The algorithm now actively penalizes accounts that leave rapid-fire, low-effort comments. It tracks dwell time (how long you stay on a post before commenting) and evaluates the semantic depth of your replies. \n\nIf you are using tools that just spam \"Thanks for sharing,\" you are actively harming your account's reach. The platforms that will win this era are those that respect the ecosystem. They are tools that run locally, mimicking real human behavior, and they are tools that use AI not to replace your brain, but to format your expertise into context-aware replies instantly.\n\nFor job seekers, this means standing out to hiring managers by thoughtfully engaging with their content over weeks, rather than sending a single, desperate DM. For sales teams and agencies, it means replacing the dying cold-email channel with warm, inbound interest generated by demonstrating public expertise. And for founders, it means scaling their personal brand without spending their entire morning chained to the feed.\n\nWhen evaluating your options, look past the legacy players who still rely on cloud bots and basic analytics. To truly compete in the modern feed, look toward solutions that marry deep personalization with local security.\n\n## Frequently Asked Questions\n\n### Can LinkedIn detect if I use an AI tool to generate replies?\nLinkedIn cannot intrinsically detect that text was written by an AI if the text is well-prompted and free of typical AI buzzwords. However, LinkedIn *can* detect how the text is posted. If you use a cloud-based tool that injects the comment via an API in milliseconds, or operates from a server IP address, you will be flagged. This is why tools that run locally on your machine and mimic human typing speeds, like Junior, are critical for safety. For those leaving the old ways behind, reviewing [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) is a necessary first step.\n\n### How do I prevent my AI replies from sounding robotic?\nThe secret lies in context and brevity. First, never let the AI write more than three sentences. AI struggles to maintain a human cadence over long paragraphs. Second, ensure your tool uses your specific professional bio as the core prompt. Finally, manually edit every single draft. Change one word, delete an exclamation point, or add a colloquialism before you hit send. \n\n### Why is commenting better than sending direct messages (DMs)?\nThe modern buyer's inbox is heavily guarded. Cold DMs are often ignored or instantly deleted. Commenting, however, is a public exhibition of your expertise. When you leave a highly personalized, intelligent reply on a post, you aren't just talking to the author\u2014you are talking to everyone who reads that comment section. It builds authority and creates inbound curiosity, leading prospects to view your profile and reach out to you directly. \n\n### Is it safe to use automation on my main LinkedIn account?\nIt depends entirely on the architecture of the automation. Cloud-based connection loops and headless browser bots violate LinkedIn's terms of service and frequently result in bans. Local automation that requires a manual checkpoint (you clicking \"approve\" on a drafted comment) is exponentially safer because it perfectly mirrors normal human usage patterns. \n\nBy upgrading your toolkit to platforms that prioritize context, local execution, and human oversight, you can bypass the crowded inboxes and turn public visibility into your most powerful growth channel.", "created_at": "2026-09-28T16:49:29.232383+00:00", "updated_at": "2026-09-28T16:49:29.232389+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
