    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 146, "slug": "linkedin-comment-automation-pipeline-growth", "title": "How LinkedIn Comment Automation Works for Pipeline Growth", "excerpt": "Learn how LinkedIn comment automation turns public discussions into inbound pipeline, outperforming cold outreach while keeping your account secure.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57dqh2f1abbn5w7bjgy2qy9jh8h2g86/how-linkedin-comment-automation-works-for-pipeline-1793121505853-t6apjx.png", "published_at": "2026-10-29T16:43:00+00:00", "content": "# How LinkedIn Comment Automation Works for Pipeline Growth\n\nIf you have sent a cold LinkedIn Direct Message recently, you already know the math is broken. Inboxes are saturated. Connection requests from strangers are met with immediate skepticism. The traditional outbound playbook relies on sheer volume to squeeze out a fractional conversion rate, resulting in burned accounts, annoyed prospects, and an endless cycle of writing new outreach sequences. But while the private inbox has become a fortress, the public feed remains wide open.\n\nThis is exactly why the most effective B2B growth practitioners are abandoning the private DM in favor of the public comment section. Engaging thoughtfully on other people\u2019s content puts you in front of their audience, leverages their established credibility, and triggers inbound profile views. \n\nUntil recently, the problem with a comment-driven pipeline strategy was execution. Manually monitoring target accounts, reading their posts, and drafting intelligent, context-aware replies takes hours every day. LinkedIn comment automation bridges this gap. It replaces outbound spam by finding relevant discussions and drafting context-aware replies that sound like you. When executed correctly, this approach bypasses the crowded inbox and turns public visibility into direct interviews, pipeline, and client conversations.\n\n![Diagram comparing cold outbound direct messaging versus public comment engagement funnels on LinkedIn.](https://assets.bevisible.app/inline-images/j57dqh2f1abbn5w7bjgy2qy9jh8h2g86/inline-1-1793121455152-xrmw60.png)\n## The Strategic Shift from Outbound DMs to Inbound Engagement\n\nThe software tools that dominated LinkedIn lead generation for the past five years were almost exclusively built for outbound sequences. Users would scrape lists from Sales Navigator, load them into a sequencing engine, and fire off automated connection requests followed by a drip campaign of generic check-ins. \n\nThose tools are facing steeply diminishing returns. LinkedIn has severely tightened connection request limits and improved its spam-detection algorithms. More importantly, buyers have adapted. They ignore automated pitches. \n\nThis reality has driven a search for outreach tools that focus on public engagement. When you comment on a high-performing post published by a prospect, you are not just talking to the prospect. You are talking to their entire audience. If the post author has 50,000 followers and your comment is insightful enough to get pinned or heavily liked, you effectively borrow a fraction of their reach. \n\nThis mechanism flips the traditional funnel. Instead of pushing a message to an unwilling recipient, you demonstrate competence in a public forum. Curious readers click your profile. If your profile is optimized to explain your value proposition, a percentage of those profile viewers will send you a connection request or an inbound message. \n\nYou are no longer hunting for leads. You are creating a gravitational pull that brings leads to you.\n\n## Mechanics of LinkedIn Comment Automation: How It Actually Works\n\nUnderstanding the mechanics of comment automation helps you configure it for maximum pipeline impact. The process is not as simple as pointing a bot at a list of URLs. Modern tools use natural language processing and localized execution to simulate a real human interacting with the feed.\n\nThe workflow generally follows four distinct phases.\n\n### Phase 1: Account and Keyword Targeting\nYou begin by defining where the software should look for conversations. The most effective strategy relies on a hybrid approach of specific target accounts and broad keyword monitoring. \n\nTarget accounts usually include your ideal customers, industry thought leaders, and complementary service providers. By loading these specific profiles into your automation tool, you ensure you are always the first to engage when they publish a new piece of content. \n\nKeyword targeting allows the software to scan the broader LinkedIn ecosystem for specific topics. If you run a lead generation agency, you might track phrases like \"outbound strategy,\" \"B2B sales,\" or \"cold email deliverability.\" When a post containing these keywords gains traction, the software flags it for engagement.\n\n### Phase 2: Post Ingestion and Context Analysis\nOnce a target post is identified, the automation tool reads the content. Older bots simply looked for a trigger word and fired a canned response like \"Great insights!\" Modern AI-powered tools parse the entire post to understand the core argument, the tone, and the author's intent.\n\nThe software evaluates whether the post is a celebration (like a new job announcement), a contrarian opinion, a tactical breakdown, or a question to the audience. This context analysis is the critical difference between spamming the feed and contributing to a discussion. If the system cannot determine the context, or if the post is deemed irrelevant to your goals, the tool skips it entirely to preserve your account's credibility.\n\n### Phase 3: Drafting the Context-Aware Reply\nAfter analyzing the post, the software drafts a response. This is where your unique bio and goals come into play. Tools like Junior do not use generic AI models to write comments. They rely on a deep understanding of who you are, what you sell, and your specific point of view.\n\nYou configure the system with your professional background, your tone of voice, and your specific areas of expertise. When the AI drafts a comment, it cross-references the author's post with your configured profile. The result is a drafted reply that agrees, adds a nuanced perspective, or asks a relevant follow-up question, sounding exactly like a human practitioner.\n\n### Phase 4: Review and Publication\nThe safest implementation of comment automation operates on an approval-first basis. The software presents you with a queue of drafted comments alongside the original posts. You can review the AI's work, tweak a phrase if necessary, and click approve. \n\nThis human-in-the-loop system requires only minutes a day but guarantees that you never publish an off-brand statement. Over time, as you refine your system prompts and the AI learns your preferences, you can transition trusted workflows into fully automatic publication.\n\n![Four-step diagram of the comment automation workflow: targeting, context analysis, drafting, and human review.](https://assets.bevisible.app/inline-images/j57dqh2f1abbn5w7bjgy2qy9jh8h2g86/inline-2-1793121454572-pqfh48.png)\n## Designing a Commenting Strategy for Pipeline Growth\n\nDeploying comment automation without a strategy will generate profile views, but it will not generate revenue. Pipeline growth requires a deliberate approach to targeting and messaging. \n\n### The Hub and Spoke Targeting Method\nMost sales professionals make the mistake of only targeting their direct buyers. If they sell marketing software to Chief Marketing Officers, they load a list of CMOs into their automation tool. \n\nThe problem with this approach is that many CMOs do not post frequently on LinkedIn, and when they do, their posts often have low engagement. Commenting on a post with zero visibility does not scale your reach.\n\nA more effective strategy is the Hub and Spoke method. You identify the \"Hubs\" in your industry. These are the thought leaders, industry publications, and high-visibility creators that your ideal buyers follow and engage with. By consistently leaving high-value comments on the Hub's posts, you position yourself in front of the \"Spokes\" (your actual buyers). \n\nWhen a prospect sees you repeatedly providing valuable insights on the content they consume, familiarity builds. When they eventually need your services, you are already a recognized entity in their professional ecosystem.\n\n### Defining Your Engagement Personas\nTo maximize pipeline conversion, your automated comments should fall into specific engagement personas based on the post type. \n\nFor tactical posts, your persona should be the \"Experienced Peer.\" The AI should be instructed to validate the author's tactic and add a supplementary tip based on your experience. \n\nFor industry news or trend posts, your persona should be the \"Analytical Observer.\" The AI should draft comments that project the implications of the news into the future, demonstrating your forward-thinking expertise.\n\nFor milestone or celebration posts, keep the AI prompt simple and human. A brief congratulatory note is sufficient. Over-engineering a comment on a work anniversary post feels unnatural and damages your credibility.\n\n## Safe vs. Risky Automation Environments\n\nAccount safety is the primary concern for anyone deploying LinkedIn automation. The platform actively monitors for bot activity, and the penalties for violating their terms of service range from temporary restrictions to permanent account bans. \n\nUnderstanding the technical architecture of your chosen tool is a necessary step in protecting your digital livelihood.\n\n### The Problem with Cloud-Based Automation\nMany popular LinkedIn automation tools operate entirely in the cloud. You provide your login credentials or session cookies, and the tool uses a server located in a different city or country to perform actions on your behalf. \n\nLinkedIn's security systems easily detect this behavior. If your account is accessed from an IP address in London, and ten minutes later a server in New York attempts to post a comment using your credentials, the platform flags the geographic impossibility. \n\nTo circumvent this, cloud-based tools often require users to purchase dedicated proxy IP addresses. While a proxy masks the location, it introduces complexity and points of failure. Furthermore, cloud servers operate at speeds no human could achieve, sending requests directly to LinkedIn's API in a highly recognizable pattern. \n\n### The Local Execution Advantage\nThe safest way to automate LinkedIn activity is through local execution. Instead of handing your session cookies to a remote server, the software runs directly on your personal computer.\n\nThis is the architectural approach taken by Junior. By operating locally on the user's machine, the software uses your actual IP address, your actual browser environment, and your established hardware footprint. When the tool navigates to a post, reads the content, and types a comment, the network requests look identical to your normal, manual browsing behavior. \n\nThis approach eliminates the need for proxies and drastically reduces the risk of automated detection. The software interacts with the platform using natural interaction patterns, scrolling and clicking just as you would. For professionals whose LinkedIn accounts are vital to their career or business, this architectural distinction is critical. If you are researching this safety aspect further, you can review the [How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account) for a deeper technical explanation. Additionally, the [Junior for How Does Junior Protect My Linkedin Account](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account-2) guide provides further context on maintaining a secure operating environment.\n\n## Reviewing the Market: Best LinkedIn Comment Automation Tools in 2026\n\nAs the market shifts away from automated connection requests, several tools have emerged to capture the demand for comment-based engagement. If you are evaluating [Dripify alternatives focused on commenting instead of DMs](https://www.commenti.in/blogs/dripify-alternatives), you will find a landscape divided into broad engagement bots and highly personalized AI assistants.\n\nAccording to recent analyses of the [best LinkedIn comment automation tools](https://www.commenti.in/blogs/best-linkedin-comment-automation-tools), the market leaders fall into a few distinct categories. \n\nTools like [Commenti](https://www.commenti.in/) have gained traction for users seeking a hands-off approach. It identifies posts based on targeted creators and generates responses, offering both approval-first and fully automatic posting modes. It serves as a direct alternative for users looking to replace outbound sequences with public engagement. \n\n[PowerIn](https://powerin.io/) focuses heavily on automated engagement across multiple platforms, supporting both LinkedIn and X. It targets creators and keywords to automate the commenting process, making it a viable option for users managing cross-platform visibility. \n\nHowever, many of the tools listed in roundups comparing the [best LinkedIn comment tools in 2026](https://commenty.ai/best-linkedin-comment-tools/) rely on standard cloud-based execution and generalized AI models. While they generate activity, they often struggle with the nuance required for high-ticket B2B pipeline growth. \n\nJunior differentiates itself by prioritizing authentic conversation over sheer volume. By running locally to ensure account safety and demanding detailed user bios to craft highly specific, context-aware replies, Junior is built for users who view their LinkedIn presence as a premium asset. It is designed for founders, consultants, and sales teams who need the efficiency of automation but refuse to compromise their professional reputation with robotic comments. For users comparing operational costs, the [Junior AI Pricing and Subscription Plans Source Page for Job Seekers, Sales Teams, Le](https://www.heyjunior.ai/blog/junior-ai-pricing-and-subscription-plans) outlines the investment required for this localized approach.\n\n![Technical visual comparison of risky cloud-based automation versus safe local browser execution.](https://assets.bevisible.app/inline-images/j57dqh2f1abbn5w7bjgy2qy9jh8h2g86/inline-3-1793121456437-nt81ex.png)\n## The \"Spam At Scale\" Trap: A Contrarian View on AI Comments\n\nThere is a growing fatigue on LinkedIn surrounding AI-generated content. A quick scroll through any popular post reveals dozens of comments that read like textbook summaries, starting with phrases like \"In today's fast-paced digital landscape\" or repeating the author's exact points back to them in a bulleted list. \n\nThe contrarian truth about comment automation is that speed is not your bottleneck. Authenticity is. \n\nDeploying an automation tool simply to be the first to comment on a post is a flawed strategy. If your comment is generic, it will be ignored by the author, buried by the algorithm, and mocked by human readers. Publishing obvious AI drivel actually damages your brand more than doing nothing at all. You signal to your prospects that you are too lazy to read their content, yet desperate enough for their attention to deploy a bot.\n\nThe goal of automation should never be to sound like an AI. The goal is to scale the best version of your professional self. \n\nThis requires investing time in the initial configuration of your tool. You must constrain the AI. You need to provide it with specific instructions on what you believe, what you disagree with, and the specific jargon you use. If you never use exclamation points in real life, instruct the AI to remove them. If you prefer short, punchy sentences, set that as a hard rule. \n\nWhen you treat your automation tool as a junior assistant that needs strict editorial guidelines rather than a magic bullet, you bypass the spam trap entirely. Your comments will stand out precisely because they sound like a real person took the time to write them.\n\n## Configuring Your Automation for Authentic Output\n\nTo achieve that level of authenticity, you need to master system prompting. The way you instruct your automation tool dictates the quality of the pipeline it generates. \n\n### Supplying the Context Bio\nDo not just paste your resume into the tool's configuration settings. The AI needs to understand your perspective, not just your work history. \n\nInstead of writing \"I am a B2B sales director with 10 years of experience,\" write a bio that provides operational context. For example: \"I am a B2B sales director who believes cold calling is still highly effective if the list is highly targeted. I hate aggressive closing tactics. I prefer consultative selling. I use frameworks like MEDDIC. My goal is to build relationships with VP-level decision-makers in the logistics industry.\"\n\nThis detailed prompt gives the AI the raw material it needs to craft comments that reflect your actual business philosophy.\n\n### Defining Negative Constraints\nTelling the AI what *not* to do is often more important than telling it what to do. Establish strict negative constraints in your settings. \n\nInstruct the tool to never use certain emojis. Command it to avoid summarizing the original post. Forbid the use of specific marketing buzzwords. By boxing the AI in with these negative constraints, you force it to generate more creative, direct, and human-sounding text.\n\n### The Refinement Loop\nExpect the first few days of drafted comments to be imperfect. This is normal. Use the approval queue to your advantage. When the AI drafts a response that feels slightly off-brand, do not just delete it. Edit the response manually, publish it, and update your system prompt to address the error. \n\nIf the AI was too formal, add a rule demanding a conversational tone. If it missed the nuance of a technical post, update your bio with more specific industry knowledge. After a week of this refinement loop, the drafted comments will require almost zero editing.\n\n## Measuring Pipeline Impact Beyond Vanity Metrics\n\nA successful comment automation strategy is not measured by the number of likes your comments receive. Those are vanity metrics that do not pay the bills. To evaluate the effectiveness of your pipeline growth, you need to track the metrics that indicate genuine business interest.\n\n### Profile Views and Connection Rates\nThe immediate leading indicator of success is an increase in your profile views. When you leave a high-value comment on a popular post, curious readers will click your name. You should see a noticeable spike in profile traffic within the first two weeks of deploying your strategy.\n\nFollowing the profile views, track your inbound connection requests. Are the people requesting to connect matching your ideal customer profile? If your profile views are up but your connection requests are flat, it indicates a disconnect. Your comments are generating attention, but your profile is not convincing visitors that you are worth connecting with. Ensure your headline clearly states the value you provide and your featured section highlights your best work.\n\n### Inbound Conversations and Booked Meetings\nThe ultimate metric is the number of genuine inbound conversations initiated. When your strategy reaches maturity, prospects will bypass the connection request and send direct messages referencing your comments. They will ask questions about your services, request consultations, or invite you to speak on podcasts.\n\nTrack how many of these inbound conversations transition into booked meetings or scheduled interviews. This conversion rate tells you the exact ROI of your automated engagement. By focusing on these deep-funnel metrics, you can justify the time spent configuring the system and prove the value of the software. If you want to understand how other practitioners are tracking these results, reading [Heyjunior Reviews From Job Seekers Source Guide](https://www.heyjunior.ai/blog/heyjunior-reviews-job-seekers-guide) can provide insight into real-world conversion metrics.\n\n## Building a Sustainable Workflow\n\nTo make comment automation work long-term, it must integrate seamlessly into your daily routine. The most successful practitioners do not spend hours staring at their automation dashboards. They build a tight, fifteen-minute daily workflow.\n\nSchedule a specific time each morning to review your drafted queue. Drink your coffee, read through the AI's suggestions, make minor edits where necessary, and approve the batch. This concentrated burst of activity ensures you maintain a consistent presence on the platform without letting it consume your workday. \n\nBy treating the review process as a non-negotiable daily task, similar to checking your email, you build a compounding asset. Every approved comment is a permanent digital billboard pointing back to your profile, working to generate pipeline long after you log off.\n\n## Frequently Asked Questions About Comment Automation\n\n**Will using automated comment tools get my LinkedIn account restricted?**\nThe risk depends entirely on the architecture of the tool you use. Cloud-based platforms that rely on remote servers and proxies carry a high risk of detection because they violate geographic logic and operate at inhuman speeds. Tools like Junior, which run locally on your machine and mimic natural browsing behavior, are significantly safer. For a comprehensive breakdown of these safety protocols, consult the [Is Junior AI Safe to Use On Linkedin Source Page for Job Seekers, Sales Teams, Lead G](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin).\n\n**Can other users tell that I am using AI to write my comments?**\nThey can tell if you use a generic tool with poor system prompting. If your comments are overly long, robotic, or simply summarize the post, human readers will immediately recognize the AI. However, if you use a context-aware tool, configure it with a detailed personal bio, apply strict negative constraints, and use an approval queue to ensure quality, the output is indistinguishable from a thoughtful human response.\n\n**Does comment automation replace the need for me to write my own original posts?**\nNo. Commenting and posting serve two different functions in a pipeline strategy. Commenting is your outbound distribution method. It gets you in front of new audiences and drives traffic to your profile. Original posting is your conversion mechanism. When that new traffic arrives at your profile, your original posts prove your depth of knowledge and convince the prospect to reach out. The two strategies must work together. Use automation to drive the traffic, and use original content to close the trust gap. \n\nBy shifting your focus from private disruption to public contribution, you align your outreach with the way modern professionals actually want to interact. Comment automation does not remove the human element from networking; it simply scales your ability to participate in the conversations that matter most to your business.", "created_at": "2026-10-29T16:49:22.592812+00:00", "updated_at": "2026-10-29T16:49:22.592818+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {

                },
                {

                },
                {

                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
