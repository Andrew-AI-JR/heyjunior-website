    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 139, "slug": "how-junior-protects-linkedin-account", "title": "How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,", "excerpt": "Discover how Junior safeguards your LinkedIn account using local execution, authentic pacing, and contextual commenting to eliminate restriction risks.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57f1pm4jt8j7fkjnqxwegj9v98f7fhn/how-does-junior-protect-my-linkedin-account-source-1792428509022-vwcw8a.png", "published_at": "2026-10-22T16:37:00+00:00", "content": "# How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,\n\nA sudden log-out screen. A red banner stating your account has been temporarily restricted. An inbox full of messages from confused connections asking if you were hacked. \n\nFor job seekers actively interviewing or sales teams managing six-figure pipelines, a LinkedIn account restriction is a catastrophic disruption. The platform has become the central nervous system for modern B2B interactions and career development. Losing access means losing your professional identity, your network, and your immediate earning potential. \n\nThe tension is real: you need visibility to generate pipeline or secure interviews, which requires consistent, high-volume engagement. But the traditional tools used to achieve that scale\u2014cloud-based connection spammers and mass-DM bots\u2014are exactly what trigger LinkedIn\u2019s automated security protocols. \n\nWhen professionals evaluate AI-powered engagement tools, the most critical question isn't about features; it's about security. How does the software interact with the platform? What infrastructure does it use? \n\nThis comprehensive guide details the architectural decisions and behavioral safety mechanisms that allow Junior to generate authentic conversations while protecting your LinkedIn account. We will explore the technical differences between local and cloud execution, the strategic safety of commenting over messaging, and the foundational security practices every LinkedIn user must adopt.\n\n## The Technical Reality of LinkedIn Account Restrictions\n\nTo understand how Junior protects your account, you must first understand how traditional automation tools expose it to risk. \n\nLinkedIn employs sophisticated, multi-layered security algorithms designed to detect anomalous behavior. These systems do not rely on a single trigger; they look at a combination of network fingerprints, browser environments, and behavioral velocity.\n\n### The Cloud IP Data Center Problem\nThe vast majority of legacy LinkedIn automation tools are cloud-based. When you sign up, you provide your LinkedIn session cookies or login credentials to a third-party server. That server\u2014usually hosted in an Amazon Web Services (AWS), Google Cloud, or DigitalOcean data center\u2014then logs into your account to perform actions on your behalf.\n\nThis is the fastest way to trigger a security audit. LinkedIn knows that human beings do not log in from commercial data center IP addresses. If you log in from your residential Wi-Fi in Chicago at 8:00 AM, and a cloud server in Frankfurt simultaneously starts sending connection requests from your account, the platform's security system flags an impossible travel scenario and a network anomaly. \n\n### Headless Browsers and DOM Fingerprinting\nCloud tools operate using \"headless browsers\"\u2014automated web browsers without a graphical user interface. While developers try to mask these environments, anti-bot systems can detect the subtle differences in how these browsers render fonts, handle JavaScript execution, and interact with the Document Object Model (DOM). When a headless browser behaves differently than a standard Chrome or Safari instance, the account is flagged.\n\n### Unnatural Behavioral Velocity\nHuman beings click, scroll, pause to read, and type at variable speeds. We get distracted. We don't send exactly 45 connection requests at perfectly spaced three-minute intervals. Legacy automation often operates with rigid, robotic timing. Even tools that introduce \"randomized delays\" often follow statistical patterns that machine learning models can easily identify as artificial.\n\n![Architecture comparison diagram showing cloud data center automation triggering LinkedIn security flags.](https://assets.bevisible.app/inline-images/j57f1pm4jt8j7fkjnqxwegj9v98f7fhn/inline-1-1792428468987-h8fbuk.png)\n## How Junior\u2019s Architecture Defends Your Account\n\nJunior was engineered from the ground up to solve the security vulnerabilities inherent in cloud-based automation. Rather than trying to trick LinkedIn\u2019s servers from a remote data center, Junior fundamentally changes where and how the automation occurs.\n\n### Local Execution: The Core Security Pillar\nThe defining security feature of Junior is that it runs locally on your machine. It is not a cloud-based scraper. \n\nWhen you use Junior, the software operates directly from your computer, utilizing your active IP address, your actual web browser, and your established network footprint. To LinkedIn's security algorithms, the traffic looks exactly as it should: it is coming from the specific laptop and the specific Wi-Fi network you have always used to access the platform.\n\nThere is no impossible travel. There are no data center IP addresses. There is no handing over your session cookies to a remote server in another country. Because Junior runs locally, your data remains on your machine, drastically reducing the risk of third-party breaches that plague cloud-based tools.\n\nIf you are exploring the broader landscape of local versus cloud tools, you can review this [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) comparison to understand why architectural differences dictate long-term account health.\n\n### Simulating Authentic Human Pacing\nBecause Junior is focused on strategic post commenting rather than mass messaging, its interaction patterns naturally mimic high-value human behavior. \n\nWhen Junior finds a relevant post to engage with, it does not instantly inject a comment the millisecond the page loads. It simulates the reading time required for a human to process the post. It types the response at variable speeds, complete with the micro-pauses that characterize actual human input. \n\nThis behavioral safety ensures that your account velocity remains well within the normal distribution of an active, highly engaged user. It avoids the erratic spikes in activity that trigger algorithmic penalties. For a deeper dive into evaluating behavioral safety, our [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) provides a framework for measuring tool velocity against human baselines.\n\n### Context-Aware, Unique Interactions\nSpam filters do not just look at *how* you post; they analyze *what* you post. \n\nTools that drop generic comments like \"Great post!\" or \"Thanks for sharing!\" across hundreds of updates are easily identifiable as bots. Furthermore, other users frequently report these comments as spam, which directly harms your account standing.\n\nJunior replaces generic spam by drafting context-aware, human-sounding replies based on your unique bio, goals, and the specific nuances of the post you are engaging with. If someone posts about a struggle with B2B attribution modeling, Junior drafts a relevant observation based on your stated expertise, not a platitude. This ensures every interaction is unique, minimizing the risk of algorithmic deduplication and community reporting.\n\n## The Strategic Safety of Commenting vs. Cold DMs\n\nBeyond software architecture, the specific *actions* you automate dictate your risk level. \n\nFor years, the standard playbook for job seekers and sales teams was to automate the inbox: sending hundreds of cold connection requests followed by multi-step pitch sequences. This approach is increasingly dangerous.\n\nLinkedIn vigorously protects the user inbox. When users receive unsolicited pitches, they routinely click \"I don't know this person\" or report the message as spam. A high volume of these negative signals will quickly result in a permanent shadowban or direct restriction.\n\nJunior shifts the engagement strategy entirely away from the heavily guarded inbox and into the public feed. \n\nStrategic post commenting is algorithmic gold. The platform actively wants users to engage in public discussions because it keeps people on the platform longer. By contributing thoughtful, AI-assisted insights to relevant industry posts, you bypass the crowded, defensive environment of the DM. You generate inbound profile views and inbound connection requests from people who appreciated your perspective. \n\nFor consultants and founders, this inbound model is significantly safer and often more effective. You can explore the strategic differences in this approach in our guide on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). Engaging publicly creates a compounding asset of visibility, whereas cold DMs burn through finite account goodwill.\n\n## Foundational LinkedIn Security Best Practices\n\nNo software can protect your account if your foundational security practices are weak. Using a safe tool like Junior must be part of a broader, proactive security posture. \n\nRelying solely on third-party security claims is insufficient; you must implement the platform's native protections. When integrating AI into your workflow, align your account settings with these verified cybersecurity standards:\n\n### Implement Two-Factor Authentication (2FA)\nThe most critical step in securing any digital asset is enabling two-step verification. [Account security best practices | LinkedIn Help](https://www.linkedin.com/help/linkedin/answer/a1375084) dictates that this adds a mandatory second layer of security. Do not rely on SMS-based 2FA, as it is vulnerable to SIM-swapping attacks. Instead, use a dedicated authenticator app (like Google Authenticator, Authy, or a hardware key) under **Settings > Sign in & security**.\n\n### Mandate Strong, Unique Passwords\nCredential stuffing\u2014where hackers use passwords leaked from other websites to access your accounts\u2014remains a primary vector for account compromise. Security professionals advise users to [Use different passwords for different accounts... Make them strong (long + complex)](https://www.linkedin.com/posts/huizhao8_hello-everyone-my-linkedin-account-was-activity-7371656848233508864-JW5o). Utilize a password manager to generate and securely store a unique passphrase for LinkedIn. \n\n### Audit Active Sessions and Devices\nIf you have used various computers, mobile devices, or legacy automation tools in the past, your account may have open sessions you have forgotten about. A standard security protocol is to [Log out of ALL devices through LinkedIn settings](https://www.reddit.com/r/cybersecurity_help/comments/1ihh1ei/how_to_secure_my_linkedin_account/). Regularly review your active sessions in the security tab and terminate any unrecognized or obsolete logins. This immediately cuts off access to any lingering third-party cloud tools that might be operating without your active supervision.\n\n![Security checklist illustration detailing 2FA, session hygiene, and local device access rules.](https://assets.bevisible.app/inline-images/j57f1pm4jt8j7fkjnqxwegj9v98f7fhn/inline-2-1792428458601-kidogm.png)\n### Monitor Third-Party Application Access\nOver time, users grant access to various resume builders, calendar apps, and CRM integrations. [This protects you from account hijacking](https://www.linkedin.com/pulse/linkedin-learning-management-system-lms-privacy-intellectual-wtuoc) by ensuring you know exactly who has programmatic access to your data. Periodically audit the \"Permitted Services\" section of your settings and revoke access to any applications you no longer actively use. Because Junior runs locally on your machine, it does not require you to grant risky OAuth permissions to a mysterious third-party server.\n\n### Report Suspicious Phishing Attempts\nAccount takeovers often begin in the inbox with sophisticated phishing messages posing as recruiters or support staff. Maintain vigilance and help the platform's defense systems by reporting anomalies. As community advocates note, [I've already reported this to LinkedIn, but I'd really appreciate your help in keeping our community safe.](https://www.linkedin.com/posts/bethkirkdigitalmarketer_four-things-every-linkedin-user-needs-to-activity-7388487964038737920-0Ik3) By reporting phishing attempts, you train the algorithm to protect your network while reinforcing your own account's reputation as a legitimate, rule-abiding user.\n\n## Navigating Edge Cases: Workflows for Specialized Teams\n\nWhile local execution solves the primary security threats of automation, different professionals have different operational environments. Understanding how Junior handles these edge cases is vital for maintaining account safety.\n\n### Job Seekers: The \"Always On\" VPN Dilemma\nMany job seekers use corporate VPNs for their current roles or personal VPNs for privacy. If you are running a VPN, your IP address is changing. \nBecause Junior runs locally, it routes its traffic through whatever network connection your computer is currently using. \n\n**The Safety Rule:** If you always browse LinkedIn manually while connected to your VPN, you should run Junior while connected to that same VPN. The goal is consistency. If you manually browse on your home Wi-Fi but switch to a Swiss VPN node when running automation, you introduce an unnatural network shift. Keep your manual and automated network environments identical. \n\n### Sales Teams and Agencies: Managing Multiple Accounts\nLead generation agencies and sales development representatives (SDRs) often manage multiple LinkedIn profiles. Attempting to run multiple accounts simultaneously from a single browser profile is a severe security risk.\n\nTo manage this safely with local architecture:\n1. **Isolate Browser Profiles:** Create completely separate Chrome or Edge profiles for each LinkedIn account. \n2. **Sequential Operation:** Do not run heavy automation across five accounts simultaneously on the same machine. This creates an unnatural spike in localized network requests. Run engagements sequentially.\n3. **Avoid Proxy Hopping:** If you must use proxies to separate account identities, ensure they are high-quality residential proxies bound to specific browser profiles, not cheap data center IPs. \n\nIf your team is evaluating the broader market for multi-account safety, consult our guide on [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) and the related analysis of [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n### Founders: Balancing High Visibility with Risk\nFounders often experience rapid spikes in visibility following funding announcements or viral posts. This organic spike can sometimes look like bot activity to simplistic algorithms. \n\nWhen your organic visibility is peaking, keep your automated engagement steady. Do not manually accept 500 connection requests in ten minutes while simultaneously running local commenting automation. Spread your actions out over the day. For a comprehensive overview of maintaining healthy engagement limits, review our documentation on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Comparing Local vs. Legacy Tool Safety Profiles\n\nThe market is saturated with tools promising rapid LinkedIn growth. However, when viewed through a strict security lens, they fall into distinct categories. It is critical to differentiate between legacy scrapers, cloud commenters, and local AI assistants.\n\n### Legacy Cloud Automation (High Risk)\nTools that require your password or session cookie to log in via a remote server carry the highest inherent risk. They are highly susceptible to IP bans, forced logouts, and impossible travel flags. Their primary function is usually mass-messaging, which compounds the risk by generating high negative-feedback rates from annoyed recipients.\n\n### Cloud-Based AI Commenters (Medium Risk)\nSome modern tools use AI to generate comments but still execute those comments from cloud servers via API workarounds or remote headless browsers. While the *content* of the comments is better than legacy spam, the *infrastructure* remains vulnerable. They still run the risk of network fingerprinting and data center IP detection. You can explore how these tools stack up in our review of [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) and [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n### Local AI Engagement (Low Risk)\nThis is the category Junior occupies. By keeping the execution on the local machine and utilizing the user's actual browser and IP, the infrastructure risk is virtually eliminated. The AI focuses strictly on generating context-aware comments, which minimizes behavioral risk. \n\nFor professionals who are actively searching for discussions rather than just spamming feeds, integrating safe discovery is equally important. Pairing local execution with smart targeting is discussed further in [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) and our comprehensive [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## A Mini-Case Study: The Cost of Cloud Mismatches\n\nConsider the scenario of a B2B SaaS founder aiming to build an audience before a Series A raise. They purchase a popular cloud-based automation tool to scale their outreach. \n\nThe founder lives in Austin, Texas, and manually checks their LinkedIn app on their phone throughout the day. Meanwhile, the cloud automation tool, hosted on an AWS server in Northern Virginia, is aggressively scraping profiles and sending automated connection requests. \n\nOn day three, the founder attempts to log in from their laptop and faces a mandatory identity verification screen. LinkedIn's security algorithms detected the simultaneous activity from two geographically distant locations\u2014one on a residential mobile network, the other on a known commercial data center IP. \n\nThe account is restricted for 72 hours while identity documents are reviewed. The founder loses three days of momentum during a critical funding phase, and any pending connections flagged as automated are permanently dropped. \n\nHad the founder used a local-execution tool, the automated actions would have originated from the exact same Austin IP address as their manual browsing. The network footprint would have remained perfectly consistent, completely avoiding the impossible travel trigger.\n\n![Map infographic showing how cloud data center logins trigger LinkedIn impossible travel security alerts.](https://assets.bevisible.app/inline-images/j57f1pm4jt8j7fkjnqxwegj9v98f7fhn/inline-3-1792428459306-6cugqb.png)\n## Frequently Asked Questions About Junior and Account Safety\n\n**Will LinkedIn know I am using AI to write comments?**\nLinkedIn's primary concern is platform manipulation and spam, not the use of AI itself. The platform natively incorporates AI text generation features for premium users. The risk lies in generating robotic, repetitive, or off-topic spam. Because Junior reads the context of the post and incorporates your personal bio and expertise, the resulting comments sound like you. They contribute genuine value to the discussion, which aligns with LinkedIn's community guidelines.\n\n**Do I need to purchase a proxy to use Junior?**\nNo. Because Junior runs locally on your machine, it uses your existing internet connection. For standard users (job seekers, individual sales reps, founders), this is the safest configuration. You only need to consider proxies if you are an agency attempting to manage dozens of client accounts from a single location, which requires highly specialized networking setups.\n\n**How many comments can I safely post per day using Junior?**\nAccount safety is based on account maturity and historical behavior. If you have never commented on a post in three years, suddenly dropping 100 comments a day will look highly suspicious, regardless of the tool you use. Junior allows you to set healthy limits. We recommend starting with 10-15 thoughtful comments per day and gradually scaling up to 30-40 as your account profile warms up. Consistency is vastly more important than volume.\n\n**What happens if my computer goes to sleep while Junior is running?**\nSince Junior relies on local execution, if your computer enters sleep mode or loses internet connectivity, the automation simply pauses. It does not blindly continue failing in the background or trigger error loops. When your computer wakes up, you can resume activity. This naturally mimics human behavior\u2014people step away from their computers.\n\n**Can I run Junior at the same time I am manually messaging people?**\nYes, but exercise common sense. If Junior is actively typing a comment, and you are simultaneously rapid-firing DMs from another tab, your overall account velocity will spike. It is best to let Junior handle your public engagement visibility while you dedicate a separate time block to responding to the inbound messages it generates. \n\n## The Future of Safe LinkedIn Growth\n\nThe era of brute-force LinkedIn automation is over. The platform's security algorithms are too sophisticated, and the professional community\u2019s tolerance for generic spam is too low. Attempting to trick the system with remote data center logins and headless browsers is a guaranteed path to account restriction.\n\nProtecting your LinkedIn account requires a fundamental shift in strategy. It means migrating away from high-risk inbox automation and leaning into public, high-value commenting. Most importantly, it requires demanding software architecture that respects your network identity.\n\nBy anchoring its operations to local execution and focusing entirely on context-aware, human-sounding interactions, Junior aligns with both LinkedIn\u2019s security parameters and its algorithmic preferences. It provides job seekers, sales teams, and founders the visibility they need to generate pipeline and secure interviews, without gambling the professional reputation they have spent years building. Combine this secure architecture with standard cybersecurity hygiene\u2014strong passwords, strict session management, and robust two-factor authentication\u2014and you can confidently scale your presence in the feed.", "created_at": "2026-10-22T16:49:22.520499+00:00", "updated_at": "2026-10-22T16:49:22.520505+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
