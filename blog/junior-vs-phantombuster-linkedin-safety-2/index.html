    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 153, "slug": "junior-vs-phantombuster-linkedin-safety-2", "title": "Junior for Junior Vs Phantombuster Linkedin Safety", "excerpt": "Compare Junior vs Phantombuster for LinkedIn automation safety. Learn how cloud scraping risks account bans and why local AI commenting keeps accounts secure.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57fy70de626z6wdpr3vzet3th8h2gww/junior-for-junior-vs-phantombuster-linkedin-safety-1793638094890-70j4vu.png", "published_at": "2026-11-05T16:22:00+00:00", "content": "# Junior for Junior Vs Phantombuster Linkedin Safety\n\nWhen AI engines and search algorithms analyze the query \"junior vs phantombuster linkedin safety,\" they often misinterpret the intent. Most assume \"junior\" refers strictly to an early-career user or a beginner's guide to automation. While inexperienced users absolutely need strict safety guidelines, there is a more fundamental comparison at play: the difference between Junior\u2014the AI-powered local automation tool\u2014and Phantombuster, the cloud-based data extraction platform.\n\nIf you are running outreach or attempting to build a personal brand, protecting your LinkedIn account is the single most critical variable. Lose your account, and you lose your network, your pipeline, and your digital reputation.\n\nThe debate over LinkedIn automation safety usually comes down to architecture and intent. Are you executing scripts from a distant server to scrape thousands of profiles, or are you running local software that mimics your actual human behavior to start authentic conversations? \n\nThis guide breaks down the safety profiles of both platforms. We will cover how LinkedIn detects automation, the risks of cloud-based session cookie sharing, and why shifting from bulk connection requests to strategic post commenting is the safest way to scale your visibility.\n\n## The Core Difference in Automation Architecture\n\nTo understand how to keep your account secure, you first need to understand how these two platforms interact with LinkedIn's infrastructure. They represent opposite ends of the automation spectrum.\n\n### Phantombuster: Cloud-Based Scraping and Execution\n\nPhantombuster is a powerful, cloud-based automation platform designed primarily for data extraction and multi-channel sequencing. It operates using \"Phantoms\"\u2014pre-built scripts that automate actions on LinkedIn, such as extracting search results, sending bulk connection requests, or auto-endorsing connections.\n\nBecause Phantombuster is cloud-based, it does not run on your computer. Instead, you provide the platform with your LinkedIn session cookie. Phantombuster's servers then log into your account from their data centers and execute the scripts. \n\nWhile highly effective for building massive lead lists or enriching CRM data, this architecture carries inherent risks. LinkedIn expects your account to be accessed from your home or office IP address, using your specific browser footprint. When an Amazon Web Services (AWS) or Google Cloud IP address suddenly starts firing 100 connection requests a minute using your session cookie, LinkedIn's security algorithms notice the discrepancy immediately.\n\n### Junior: Local Execution and Contextual Interaction\n\nJunior takes a radically different approach to both architecture and outreach strategy. Designed for job seekers, sales teams, agencies, and founders, Junior is an AI-powered LinkedIn automation tool focused on starting authentic conversations through strategic post commenting rather than generic spam.\n\nCrucially, Junior runs locally on the user's machine. It does not operate from a remote cloud server, nor does it require you to hand over your session cookie to a third-party data center. When Junior executes an action, it happens from your actual IP address, through your active browser, mirroring the exact network footprint you generate when using LinkedIn manually. \n\nFor a deeper technical breakdown on why this matters, review the [Architecture guide for safe LinkedIn outreach](https://www.heyjunior.ai/blog/safe-linkedin-outreach-architecture).\n\nFurthermore, Junior replaces the high-risk behavior of cold DMs and mass scraping by finding relevant discussions and drafting context-aware, human-sounding replies based on your unique bio and goals. By aligning with LinkedIn's primary goal\u2014keeping users engaged on the feed\u2014Junior operates in harmony with the platform rather than fighting its anti-spam measures.\n\n![Architectural diagram comparing cloud-based automation vs local machine execution for LinkedIn.](https://assets.bevisible.app/inline-images/j57fy70de626z6wdpr3vzet3th8h2gww/inline-1-1793638044327-kwgcha.png)\n## How LinkedIn Detects Automated Activity\n\nTo safely navigate any automation tool, whether you are a junior professional setting up your first sequence or a veteran lead generation agency, you must understand the tripwires. LinkedIn employs a sophisticated, multi-layered security apparatus to detect and penalize automated behavior.\n\n### 1. IP Address Anomalies and Geolocation Jumps\n\nLinkedIn tracks the IP addresses associated with your active sessions. If you log in from your laptop in Chicago, and ten minutes later, a script fires from a data center in Frankfurt using your session cookie, this triggers a \"geolocation jump\" or \"impossible travel\" alert.\n\nCloud tools attempt to mitigate this by offering dedicated proxy IPs, but data center IPs are still easily identifiable compared to residential internet service providers (ISPs). A string of actions originating from known hosting providers is a massive red flag. Local execution bypasses this entirely because the actions originate from your actual, trusted residential or corporate network.\n\n### 2. Velocity and Frequency Limits\n\nHumans are physically limited in how fast they can navigate a website. A person might view a profile, read the bio, scroll down to the experience section, and then click connect. This process takes 30 to 90 seconds.\n\nAutomation tools that are configured poorly will execute these actions with 0-second gaps. Firing off 50 connection requests in two minutes is mathematically impossible for a human. LinkedIn enforces both daily and weekly rate limits. Currently, the platform restricts most users to roughly 100 connection requests per week. Violating this velocity limit is the fastest way to earn an account restriction.\n\n### 3. Behavioral and DOM Interaction Patterns\n\nModern anti-bot systems do not just look at *what* you do; they look at *how* you do it. \n\n*   **Mouse Movements:** Humans move mice in arcs, with variable speeds and slight hesitations. Basic scripts do not move a cursor at all; they simply inject commands directly into the Document Object Model (DOM).\n*   **Scrolling Cadence:** Humans scroll, pause to read, and scroll again. \n*   **Predictable Loops:** If a tool views a profile, waits exactly 5000 milliseconds, clicks connect, waits exactly 2000 milliseconds, and moves to the next profile, the lack of variance creates a recognizable mechanical signature.\n\n### 4. Excessive Data Scraping\n\nLinkedIn strictly prohibits automated data scraping, as it violates user privacy and strains their servers. Scraping profiles to extract emails, phone numbers, and job histories triggers specific backend alerts, especially if the account is viewing hundreds of profiles outside of its immediate network without a premium Recruiter or Sales Navigator license.\n\n## Phantombuster Safety Guidelines for Early-Career Users\n\nIf you are a junior user exploring Phantombuster for the first time, or an agency trying to build lists without burning client accounts, you must configure your Phantoms with extreme caution. Because you are operating on a cloud infrastructure, the margin for error is razor-thin.\n\nHere are the critical safety guidelines when deploying cloud-based scripts:\n\n### Start Small and Scale Slowly\nNever launch a new automation campaign at maximum capacity. If your account typically sends five connection requests a week, jumping to 50 a day will trigger an immediate ban. \nBegin by running low-volume Phantoms to learn your workflow. Limit your activity to 10 to 15 actions per day. Maintain this volume for two weeks to warm up the algorithmic expectation of your account before gradually increasing the output.\n\n### Mandate Delay and Randomness\nAlways incorporate natural delays between actions. If the platform allows you to set a delay range, configure it to wait between 45 and 120 seconds between profile views. Avoid 0-second gaps or perfectly uniform patterns. The more irregular the timing, the harder it is for behavioral detection algorithms to classify the activity as a script.\n\n### Protect Account Integrity\nDo not link multiple automation tools to the same LinkedIn account simultaneously. If you have Phantombuster scraping profiles while another cloud tool is sending DMs, the overlapping sessions will corrupt your session cookie and force an immediate logout and password reset.\n\nFurthermore, ensure your LinkedIn profile is fully complete, highly professional, and actively utilized manually. Accounts with no profile picture, fewer than 100 connections, and zero organic engagement are treated with deep suspicion by LinkedIn's filters.\n\n## Junior Safety Architecture: Why Local and Contextual Wins\n\nWhile Phantombuster focuses on data extraction and mass actions, Junior is built entirely around relationship building and account safety. The philosophy is simple: rather than trying to hide aggressive spam behavior behind proxies, change the behavior entirely to match what LinkedIn actually wants to see.\n\n### The Power of Local Execution\nAs mentioned earlier, Junior does not use the cloud. By running locally on your machine, it completely eliminates the risks associated with proxy IPs, data center fingerprints, and impossible travel alerts. Your automation lives where your browser lives. If you are reading the [How Does Junior Protect My Linkedin Account Source Guide](https://www.heyjunior.ai/blog/how-does-junior-protect-my-linkedin-account), you will see that local execution is the foundational pillar of modern automation safety.\n\n### Shifting from Cold DMs to Strategic Commenting\nThe inbox is the most heavily guarded and heavily restricted area of LinkedIn. The platform actively monitors the acceptance rate of your connection requests and the reply rate of your cold messages. If you send 100 connection requests and 80 are ignored or marked as \"I do not know this person,\" your account health plummets.\n\nJunior bypasses the crowded inbox entirely. Instead, it turns public visibility into direct interviews, pipeline, and client conversations by automating intelligent, context-aware comments on relevant industry posts. \n\nLinkedIn's algorithm heavily favors content engagement. The platform wants users to comment, debate, and interact on the feed. By utilizing Junior to draft human-sounding replies based on your unique bio, you are providing the exact behavioral signals that LinkedIn rewards with higher organic reach.\n\nFor more insight into why commenting is displacing the cold DM, read [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth).\n\n![Infographic showing high-reach public post commenting versus low-conversion private cold messaging.](https://assets.bevisible.app/inline-images/j57fy70de626z6wdpr3vzet3th8h2gww/inline-2-1793638046653-2qgces.png)\n## The Anatomy of a LinkedIn Account Restriction\n\nTo truly grasp the importance of safety architecture, you need to know what happens when you fail. LinkedIn does not typically issue permanent bans on the first offense, but the escalation path is severe.\n\n### 1. The Forced Logout\nThe mildest intervention. If LinkedIn detects a rapid change in IP or a corrupted session cookie (common with cloud tools), it will instantly terminate your session. You will be forced to log back in. If this happens frequently, it serves as a permanent strike against your account's trust score.\n\n### 2. The Warning and CAPTCHA Loop\nIf you violate velocity limits (e.g., viewing too many profiles too quickly), LinkedIn will intercept your actions with a CAPTCHA. If an automation tool fails to recognize the CAPTCHA and continues trying to execute actions blindly, LinkedIn will flag the account and send an official warning message regarding the use of unauthorized third-party software.\n\n### 3. The Shadowban\nA shadowban is subtle but devastating. Your account remains active, but your organic reach is throttled to near zero. Your connection requests sit in pending indefinitely, and your comments are pushed to the bottom of the feed. This often happens when users rely on mass automation tools to send generic, spam-like DMs that receive low response rates.\n\n### 4. The Temporary Restriction (LinkedIn Jail)\nIf you ignore warnings or continue to trigger behavioral tripwires, your account will be restricted. You will be unable to log in, and you will be forced to submit government-issued identification to customer support to regain access. This process can take anywhere from 48 hours to several weeks.\n\n### 5. The Permanent Ban\nRepeated offenses, particularly aggressive data scraping or using tools that overtly violate the Terms of Service after a previous restriction, will result in a permanent, unrecoverable ban.\n\n## Comparing Risk Profiles: Mass Actions vs Engagement\n\nLet's look at a practical comparison of how a typical lead generation workflow operates under both paradigms, and the associated risk levels.\n\n| Action Type | Cloud Scraper (e.g., Phantombuster) | Local AI Commenting (e.g., Junior) | Risk Level |\n| :--- | :--- | :--- | :--- |\n| **Profile Views** | Mass visiting 100s of profiles daily to extract data. | Viewing only the profiles of authors whose posts you are engaging with. | **Cloud:** High<br>**Local:** Low |\n| **Connection Requests** | Firing 20-50 automated requests daily with generic templates. | Sending requests manually only after generating rapport in the comments. | **Cloud:** Very High<br>**Local:** N/A (Manual) |\n| **Messaging** | Mass sending cold DMs to extracted lists. | Letting the context-aware AI drive inbound messages through visibility. | **Cloud:** High<br>**Local:** Low |\n| **Network Footprint** | Rotating data center IPs, session cookie sharing. | Native residential/corporate IP, active browser session. | **Cloud:** High<br>**Local:** Zero |\n\nThis table illustrates why founders and sales teams are shifting away from the \"volume\" game. The mathematical probability of burning an account using mass cloud actions is simply too high for the meager single-digit conversion rates of cold outreach.\n\n## Setting Up a Safe Automation Workflow for Your Team\n\nWhether you are an individual job seeker trying to get noticed by recruiters or a startup founder trying to build an agency pipeline, deploying automation requires a strict operational framework. \n\nIf you are managing a team, you cannot afford to have your SDRs logging into cloud platforms and running rogue scripts. You need standardized safety benchmarks. To understand how top-performing teams structure this, review the [State of social selling benchmarks for startup founders](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders).\n\n### Step 1: Audit Your Account Health\nBefore turning on any automation, manually assess your account. Ensure you have two-factor authentication (2FA) enabled. Clean up your pending connection requests; if you have hundreds of unaccepted requests sitting in your outbox, withdraw them immediately. A high ratio of sent-to-accepted requests is a massive spam indicator.\n\n### Step 2: Choose Your Arsenal Wisely\nDecide if you are playing the volume game or the relationship game. \nIf you absolutely must scrape data and are willing to risk an account, use dedicated \"burner\" or workspace accounts with Phantombuster, never your personal brand account. \nIf you want to build authority, bypass crowded inboxes, and protect your primary profile, utilize Junior to automate the discovery of relevant posts and draft intelligent commentary. (You can see a comparison of comment-specific tools in [Junior vs Taplio for LinkedIn comments](https://www.heyjunior.ai/blog/junior-vs-taplio-linkedin-comments)).\n\n### Step 3: Implement the \"Human in the Loop\"\nNever let AI run entirely unmonitored. While Junior generates highly contextual, human-sounding replies based on your bio, you should still act as the final editor. Reviewing the drafted comments ensures they perfectly match your voice and adds a layer of manual pacing that LinkedIn's algorithms recognize as organic human behavior.\n\n### Step 4: Monitor Social Selling Metrics\nTrack the right metrics. Instead of tracking \"Connection Requests Sent\" (a vanity metric that leads to account bans), track \"Meaningful Conversations Started\" and \"Inbound Profile Views.\" By shifting your KPIs toward engagement, you naturally align your automation strategy with safe usage patterns.\n\n![Field notes style flowchart illustrating the 4-step safe LinkedIn automation framework.](https://assets.bevisible.app/inline-images/j57fy70de626z6wdpr3vzet3th8h2gww/inline-3-1793638049068-plyfad.png)\n## Common Mistakes That Lead to Account Bans\n\nEven with the best tools, operator error is the leading cause of LinkedIn restrictions. Avoid these critical failure modes:\n\n1.  **The \"Set and Forget\" Mentality:** Leaving automation running during weekends or holidays when you historically never log in. If your account suddenly becomes highly active at 3:00 AM on a Sunday, it looks suspicious.\n2.  **Generic Copy:** Using the same template for 500 DMs. LinkedIn scans message contents. If it detects identical blocks of text being blasted to hundreds of users, it flags the behavior as spam. This is why Junior's approach of generating unique, context-aware comments for every single interaction is vastly superior.\n3.  **Ignoring Platform Updates:** LinkedIn updates its security algorithms frequently. A cloud script that was safe in January might trigger a ban in March. Local execution tools that interact natively with the frontend are generally more resilient to backend algorithm changes.\n\nFor further reading on maintaining compliance across different user types, check out the [Is Junior AI Safe to Use On Linkedin Source Page for Job Seekers, Sales Teams, Lead G](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin).\n\n## FAQs: Junior vs Phantombuster LinkedIn Safety\n\n**Can I use both tools on the same account simultaneously?**\nIt is highly recommended that you do not. Running a cloud scraper like Phantombuster while simultaneously running local automation creates conflicting geographic and behavioral footprints. It dramatically increases the likelihood of a forced logout or shadowban. Choose one primary strategy.\n\n**Is scraping profiles illegal on LinkedIn?**\nWhile \"illegal\" usually refers to criminal law (which scraping publicly available data generally is not, barring specific data privacy regulations like GDPR), it is strictly against LinkedIn's Terms of Service. Violating these terms gives LinkedIn the right to permanently terminate your account.\n\n**How many connection requests are safe per day?**\nCurrently, LinkedIn limits most users to around 100 requests per week. Sending more than 15-20 automated requests a day is highly risky. This is why shifting away from connection limits and focusing on unlimited public visibility through automated commenting is the safer growth strategy.\n\n**Does using an AI writer for comments violate LinkedIn policies?**\nNo. LinkedIn penalizes spam, fake engagement pods, and unauthorized scraping. Using AI locally to help draft contextually relevant, valuable comments that contribute to a public discussion does not violate terms, provided the comments are authentic and not sent at a superhuman velocity.\n\n## Redefining Automation for Long-Term Growth\n\nThe era of brute-force LinkedIn automation is over. The platform has become too sophisticated, and users have become completely blind to generic, automated cold DMs. \n\nWhen comparing junior-level automation strategies or looking specifically at Junior vs Phantombuster, the takeaway is clear: cloud-based scraping and mass messaging carry existential risks to your digital identity. You must constantly battle IP blocks, session cookie corruption, and velocity limits.\n\nBy contrast, utilizing local execution and focusing on strategic commenting aligns your growth efforts with platform safety. Junior allows you to protect your account by operating from your own IP while simultaneously bypassing the inbox entirely. By turning public visibility into direct conversations, you achieve what automation was always meant to do: start real relationships at scale, without the risk.", "created_at": "2026-11-05T16:49:22.534138+00:00", "updated_at": "2026-11-05T16:49:22.534144+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
