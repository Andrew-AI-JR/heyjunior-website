    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 125, "slug": "junior-vs-aware-ai-linkedin-sales-engagement", "title": "Junior vs Aware: AI tools for LinkedIn sales engagement", "excerpt": "Compare Junior and Aware for LinkedIn sales engagement. Discover how AI comment drafting vs feed curation impacts pipeline, safety, and outreach efficiency.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57d6q9rpfr5t7ytjdfe3vvyy58f7cy2/junior-vs-aware-ai-tools-for-linkedin-sales-engage-1791217114008-8n5cv2.png", "published_at": "2026-10-08T16:15:00+00:00", "content": "# Junior vs Aware: AI tools for LinkedIn sales engagement\n\nThe B2B sales engagement landscape has fundamentally shifted. Static email drip campaigns and blind cold calling have been completely replaced by signal-led engagement and autonomous AI agents. Sales teams are realizing that dropping thousands of automated connections and generic direct messages into LinkedIn inboxes no longer generates pipeline. Buyers are saturated, inboxes are guarded, and platforms are aggressively cracking down on low-effort automation. \n\nInstead of shouting into the void of a crowded inbox, top-performing sales professionals are moving to the public square: the LinkedIn comment section. Engaging meaningfully on public posts bypasses the inbox entirely, captures the attention of the original poster, and puts your insights in front of their entire audience. \n\nHowever, scaling public engagement requires the right infrastructure. If you try to manage this manually, you lose hours endlessly scrolling the feed. If you try to automate it poorly, you risk your professional reputation and your account safety. Two platforms frequently surface for teams looking to systematize their social selling: Aware and Junior. \n\nWhile both platforms aim to help you generate pipeline through LinkedIn, their core philosophies are entirely different. Aware operates as a listening post and feed organizer, giving you analytics and structured lists. Junior operates as an active, local AI agent that finds relevant discussions and drafts highly contextual, human-sounding replies based on your unique goals. \n\nUnderstanding which approach fits your sales motion is critical to building a sustainable engagement strategy.\n\n## The Shift in B2B Sales: From Cold Pitching to Signal-Led Engagement\n\nModern AI engagement platforms are categorized into distinct layers of the sales funnel, mapped to their standout capabilities. For years, teams relied heavily on multi-channel outreach tools. Platforms designed to find prospects, automate multichannel touches, and scale personalization have dominated the conversation. Tools combining data, sequencing, and deliverability infrastructure into a single platform eliminated fragmented tech stacks. \n\nWe are also seeing the rise of the autonomous AI SDR. Digital workers that research leads, write context-aware email outreach, handle initial replies, and book meetings directly onto human reps' calendars are becoming standard issue for scaling startups. \n\n![Diagram of the modern B2B sales engagement stack showing intent data, email sequencing, and public social interaction layers.](https://assets.bevisible.app/inline-images/j57d6q9rpfr5t7ytjdfe3vvyy58f7cy2/inline-1-1791217067534-mrfb1t.png)\nBut there is a distinct gap in the social layer. While autonomous agents can handle email efficiently, LinkedIn is a walled garden with strict rules against unauthorized cloud scraping and high-volume messaging. The multi-channel \"volume trap\" fails on social media. \n\nTo break through this trap, sales teams must pivot to signal-led engagement. Signal-led prospecting means reaching out only when high-intent buying signals occur. Rather than blasting generic messages, modern growth operations use deep enrichment to monitor job changes, funding rounds, and intent data, anchoring their outreach to exactly why they are speaking to a prospect right now.\n\nOn LinkedIn, a \"signal\" is a post from a prospect discussing a pain point, asking a question, or sharing an opinion related to your industry. Engaging with that post is the most natural, highest-converting first touchpoint available to a B2B sales team. The challenge lies in finding those posts and replying thoughtfully before the conversation goes stale. \n\nThis is exactly where tools like Aware and Junior enter the tech stack, serving as specialized engines for [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n## Understanding Aware: The Feed Management Philosophy\n\nAware is fundamentally an analytics and organization layer built on top of LinkedIn. It is designed for creators, founders, and sales professionals who feel overwhelmed by LinkedIn's native feed and want a structured way to monitor specific accounts.\n\n### Core Capabilities of Aware\n\nThe primary value proposition of Aware is noise reduction. LinkedIn's native algorithm shows you what it thinks will keep you on the platform, which is rarely what you actually need to see to close deals. Aware solves this by allowing users to create custom feeds. \n\nYou can build a list of your top fifty target accounts and view a timeline consisting only of their posts. You can build a separate list of industry influencers, ensuring you never miss an opportunity to comment on a high-visibility post. Aware also provides robust analytics, tracking your follower growth, post impressions, and comment metrics over time. \n\nFor a sales team, this CRM-lite functionality is highly beneficial. A manager can instruct an SDR to monitor a specific tier of accounts and engage with them daily. Aware provides the dashboard to make that monitoring possible.\n\n### The Bottleneck: Human Execution\n\nWhere Aware leaves a gap is at the point of execution. Aware will show you exactly what your prospect posted five minutes ago, but you still have to stare at a blank text box, formulate a thoughtful response, type it out, and hit send. \n\nIf you are tracking one hundred prospects, drafting contextually relevant, insightful comments for each of their posts requires hours of focused writing every day. Aware organizes the workload, but it does not do the heavy lifting of drafting the engagement. For sales teams expected to maintain high activity metrics across multiple channels, this manual bottleneck often results in reps falling back on generic, low-effort replies just to hit their daily targets.\n\n## Understanding Junior: The AI-Powered Action Engine\n\nJunior approaches LinkedIn engagement from the opposite direction. Rather than simply organizing the feed for you to act on manually, Junior is an AI-powered execution engine built to start authentic conversations through strategic post commenting. \n\n### Context-Aware, Human-Sounding Drafting\n\nThe core differentiator of Junior is its ability to replace cold outreach by finding relevant discussions and actively drafting replies. Junior does not rely on a one-size-fits-all prompt. Instead, the user configures a highly specific unique bio and sets detailed goals. \n\nWhen Junior identifies a relevant post, it analyzes the nuance of the original content and cross-references it against your professional background, tone, and specific objectives. The resulting drafted comment is context-aware. It does not sound like generic AI output because it is constrained by your actual expertise and lived experience. The AI acts as a smart ghostwriter, presenting you with a nearly finished thought that you simply review, lightly edit if necessary, and publish.\n\nThis eliminates the blank-page syndrome that stalls sales reps. By reducing the time it takes to write a high-quality comment from five minutes to fifteen seconds, Junior allows sales teams to scale their public visibility without sacrificing authenticity.\n\n### Local Execution and Account Safety\n\nThe technical architecture of an engagement tool determines its safety. Cloud-based connection tools and automated messaging bots rely on server-side scraping or API workarounds. LinkedIn actively detects and penalizes these methods, resulting in shadowbans, restricted accounts, and permanent bans. \n\nJunior takes a fundamentally different path. It runs locally on the user's machine. By operating within your own browser environment, Junior utilizes natural interaction patterns. It navigates at human speeds, clicks where a human would click, and avoids the unnatural behavioral spikes that trigger LinkedIn's security algorithms. \n\nThis focus on local execution allows professionals to bypass crowded inboxes and turn public visibility into direct interviews, pipeline, and client conversations without placing their primary professional asset at risk. If you are comparing safety profiles, reviewing a [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) reveals exactly why local architecture is non-negotiable for enterprise sales teams.\n\n## Junior vs Aware: Feature-by-Feature Comparison\n\nTo make an informed decision between the two tools, you have to look at how they handle the specific daily workflows of a B2B sales professional. \n\n### Finding the Right Conversations\n\n**Aware** relies on manual list curation. You must know who you want to track, find their profile, add them to a specific list, and then check that list daily. It is highly effective for Account-Based Marketing (ABM) where the target list is small, defined, and static. If your entire strategy relies on interacting with thirty specific decision-makers, Aware\u2019s feed organization is incredibly focused.\n\n**Junior** takes a broader, discovery-oriented approach. While you can certainly target specific individuals, Junior excels at finding relevant discussions based on topics, keywords, and industry signals. This is critical for lead generation and finding net-new prospects. If you are looking for [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio), Junior\u2019s ability to surface conversations you would have otherwise missed gives it a distinct advantage in top-of-funnel discovery.\n\n### Crafting the Engagement\n\n**Aware** provides the text box. It is entirely up to the user to generate the insight, match the tone of the poster, and write a compelling comment that advances the conversation. \n\n**Junior** provides the draft. By leveraging large language models heavily constrained by your personal bio, Junior drafts comments that add immediate value. It might summarize a complex point, offer a contrarian view based on your industry experience, or ask a highly specific follow-up question. This capability is why many teams evaluating [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) ultimately prefer Junior; the output requires minimal editing to sound genuinely human.\n\n### Analytics and Measurement\n\n**Aware** wins in the pure analytics category. It provides deep visibility into your own profile performance, tracking impressions, engagement rates, and follower growth with granular detail. It acts as a comprehensive dashboard for your personal brand metrics.\n\n**Junior** focuses less on retrospective vanity metrics and more on forward-looking pipeline generation. The ROI of Junior is measured not just in impressions, but in the number of inbound profile views, direct messages, and booked meetings that result from consistent, high-quality public engagement. \n\n### Summary Matrix\n\n| Feature Focus | Aware | Junior |\n| :--- | :--- | :--- |\n| **Core Function** | Analytics and list-based feed curation. | AI-drafted context-aware engagement. |\n| **Post Discovery** | Manual curation of known target lists. | AI-assisted discovery of relevant topical discussions. |\n| **Response Generation**| Fully manual typing required. | Context-aware, bio-informed AI drafting. |\n| **Account Safety** | Cloud-based tracking (generally safe for read-only actions). | Local execution mimicking human interaction patterns. |\n| **Ideal User Workflow** | Reviewing analytics and tracking known creators. | Turning visibility into active sales pipeline efficiently. |\n\n## The Real Cost of the \"Volume Trap\" in Modern Outreach\n\nMany sales teams fail on LinkedIn because they apply an email mentality to a social network. Email is a private, 1-to-1 medium where volume can sometimes compensate for low conversion rates. If you send ten thousand emails and book five meetings, the math might still work for your organization. \n\nLinkedIn is a public, multi-node network. When you automate generic connection requests and spammy direct messages, you are not operating in a vacuum. Prospects mark your messages as spam. Your acceptance rate plummets. The LinkedIn algorithm detects this low-quality activity and actively throttles your profile\u2019s reach. \n\nMore importantly, generic direct messages actively damage your brand. When a senior executive receives a message saying, \"I noticed we are in the same industry, do you have fifteen minutes to discuss synergies?\" they do not just ignore it; they lose respect for the sender. \n\nPublic commenting flips this dynamic. When you leave a thoughtful comment on that same executive's post, you are providing value first. You are validating their ideas in public, boosting their post's reach, and demonstrating your own expertise to everyone who reads the thread. \n\nThe challenge is that thoughtful public commenting is hard to scale manually. A sales rep can easily send one hundred automated DMs in five minutes using legacy tools. Writing twenty genuinely insightful comments might take two hours. Junior bridges this gap, allowing a rep to generate twenty highly contextual, bio-informed comments in fifteen minutes. It delivers the scale of the volume trap without the brand damage or account risk.\n\n## Why Local Execution Matters for LinkedIn Safety\n\nThe technical implementation of your engagement tool is not just an IT concern; it is a critical business continuity issue. \n\nOver the past few years, LinkedIn has aggressively escalated its war on automated scraping and unauthorized bot activity. Tools that operate entirely in the cloud, utilizing headless browsers or undocumented APIs on remote servers, are routinely identified and banned. When a platform is hit by a ban wave, its users often wake up to find their LinkedIn accounts restricted or permanently deleted.\n\n![Architectural comparison diagram showing the safety differences between cloud-based LinkedIn automation and local browser exe](https://assets.bevisible.app/inline-images/j57d6q9rpfr5t7ytjdfe3vvyy58f7cy2/inline-2-1791217067008-nhzram.png)\nThis environment requires a fundamental rethink of how we deploy automation. If you are researching [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely), the most critical factor to evaluate is where the automation is physically running.\n\nJunior mitigates cloud-based risks by running locally on your machine. This means the requests to LinkedIn's servers originate from your actual IP address, through your actual browser session, and utilize your existing authentication tokens. \n\nFurthermore, Junior enforces natural interaction patterns. A cloud bot might attempt to drop fifty comments across fifty different profiles in three seconds\u2014an impossible feat for a human that instantly triggers a security flag. Junior operates at a human cadence. It scrolls, pauses, reads, and types at realistic speeds. \n\nFor a deeper dive into establishing secure parameters for your team, reviewing strategies for [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) ensures you protect your most valuable digital asset while still scaling your outreach.\n\n## Scenario: Finding Consulting Clients Without Automated Messaging\n\nTo understand how these tools function in a real-world B2B environment, consider the workflow of a high-ticket SaaS consultant trying to build a pipeline. \n\nInitially, the consultant tries the legacy approach. They purchase a cloud-based connection automation tool and scrape a list of five hundred SaaS founders. They launch a sequence: connection request, followed immediately by a pitch in the DM upon acceptance. The result? A 10% connection rate, zero replies, and two warnings from LinkedIn regarding excessive messaging. \n\nRealizing this is damaging their brand, the consultant switches to a manual social selling strategy using Aware. They build a list of fifty high-value SaaS founders and check Aware daily. The organization is excellent; they never miss a post. However, writing a thoughtful, 100-word response to ten different posts takes an hour of deep work every morning. Between client calls and actual consulting work, the habit slips. They engage sporadically, and the pipeline dries up. \n\nFinally, the consultant implements Junior. They configure their Junior bio explicitly around their expertise in reducing churn for B2B SaaS companies. \n\nThe new daily workflow looks completely different:\n1. The consultant opens Junior, which has already surfaced relevant posts from SaaS founders discussing retention, pricing models, and customer success. \n2. Junior analyzes a founder's post complaining about high churn in Q3. \n3. Based on the consultant's unique bio, Junior drafts a comment: \"This is exactly what we saw in the market last quarter. We found that moving onboarding from a 14-day window to a 7-day high-touch sprint reduced month-one churn by 18%. Are you seeing the drop-off early in the lifecycle, or post-activation?\"\n4. The consultant reviews the draft, realizes it is exactly what they would have said, and hits approve. \n\nThis process takes thirty seconds per post. In fifteen minutes, the consultant has placed highly contextual, value-add insights on twenty different target accounts. The original poster replies, views the consultant\u2019s profile, and sends an inbound connection request. The relationship starts with established authority rather than a cold pitch. \n\nThis specific workflow highlights the core difference explored in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). Generating clients requires interaction, not just transmission. \n\n## Evaluating Your AI Engagement Stack: Which Tool Fits?\n\nWhen deciding how to allocate your budget and your team's time, you must align the tool with your primary operational bottleneck. \n\nIf your bottleneck is **organization and reporting**, and you have a dedicated team of writers ready to manually craft responses all day, Aware is an excellent choice. It provides the visibility and the metrics required to manage a large-scale manual social selling operation. \n\nIf your bottleneck is **execution and writing bandwidth**, Junior is the required solution. For teams that know they need to engage publicly but cannot afford to spend hours writing comments, Junior provides the AI leverage necessary to scale. \n\nIf you are currently mapping out your specific requirements, running your team's needs through an [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) will clarify which feature set aligns with your revenue goals. \n\nConsider the following decision criteria:\n\n*   **Are you focused on inbound or outbound?** Aware tracks the inbound performance of your own posts exceptionally well. Junior is an outbound engine, designed to put your voice onto other people's posts to draw them back to you. \n*   **What is your risk tolerance?** Any tool interacting with LinkedIn requires safety scrutiny. Junior's local, natural-pattern architecture is built specifically to operate within LinkedIn's terms of service gracefully.\n*   **Do you need to scale beyond a static list?** If you only ever want to talk to the same fifty people, list curation works. If you need to find net-new conversations across the platform based on keyword signals, you need an AI discovery engine. For a broader comparison of discovery methods, teams often look at [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n## The Multi-Channel Context: Where Do LinkedIn Commenting Tools Fit?\n\nIt is important to view AI engagement tools not as standalone silver bullets, but as the social layer within a broader revenue architecture. \n\nModern growth teams utilize data providers to find verified contact information and intent signals. They use AI SDRs to orchestrate email touches. However, when a high-value prospect ignores an email, the worst thing a rep can do is send four more automated emails. \n\nInstead, the rep should shift channels. When an email sequence stalls, the rep can use Junior to find that specific prospect's recent LinkedIn activity and leave a thoughtful comment. This multi-channel approach\u2014mixing private email touches with public, value-add social interactions\u2014creates the perception of ubiquity. The prospect sees you in their inbox, but they also see you providing intelligent insights in their industry peers' comment sections. \n\nThis combination of deep enrichment data and local AI social execution represents the most sophisticated B2B sales motion currently available.\n\n## Frequently Asked Questions (FAQs)\n\n### Are AI-generated comments penalized by the LinkedIn algorithm?\nLinkedIn penalizes low-quality, generic engagement (e.g., \"Great post!\", \"Thanks for sharing!\"). The algorithm does not penalize the origin of the text; it evaluates the substance, length, and contextual relevance of the comment. Because Junior drafts highly specific, bio-informed replies that add actual value to the discussion, these comments frequently trigger positive algorithmic signals, boosting the visibility of both the original post and your profile. \n\n### Can a sales team use Aware and Junior together?\nYes, they serve completely different functions that can complement one another. A sales manager might use Aware to track the overall social selling metrics of their team and identify high-priority posts from top-tier accounts. The SDRs would then use Junior to actually execute the engagement, generating the contextual replies required to capture attention on those identified posts. \n\n### How does local AI execution protect my account compared to cloud tools?\nCloud tools require you to hand over your session cookies to a remote server. That server then makes requests to LinkedIn from an IP address in a data center, often simultaneously with thousands of other automated accounts. LinkedIn flags this activity easily. Local execution means the software runs directly on your computer, in your browser. The actions originate from your normal IP address and simulate human delays between clicks and keystrokes, making it virtually indistinguishable from a user manually browsing the platform. \n\n### Does AI commenting replace the need to post original content?\nIt does not replace original content, but it is a much faster path to pipeline. Building an audience through original posts takes months of consistent effort. Commenting on the posts of people who already have your target audience\u2019s attention allows you to siphon visibility immediately. For sales teams focused on quarter-by-quarter revenue, strategic commenting via Junior yields a much faster return on time invested than waiting for inbound leads from original content.", "created_at": "2026-10-08T16:19:35.588140+00:00", "updated_at": "2026-10-08T16:19:35.588146+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {

                },
                {

                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
