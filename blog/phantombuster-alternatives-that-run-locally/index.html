    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 61, "slug": "phantombuster-alternatives-that-run-locally", "title": "Phantombuster Alternatives for Phantombuster Alternatives That Run Locally", "excerpt": "Discover top PhantomBuster alternatives that run locally on your machine. Learn how local tools protect your accounts from cloud bans.", "featured_image_url": "https://assets.bevisible.app/featured-images/j573cqtewzrhbk398bc9xh1rr58ajmgr/phantombuster-alternatives-for-phantombuster-alter-1785680309549-bxj3g6.png", "published_at": "2026-08-02T14:00:00+00:00", "content": "# Phantombuster Alternatives for Phantombuster Alternatives That Run Locally\n\nCloud-based automation platforms like PhantomBuster once made web scraping and LinkedIn lead generation effortless. You could paste a session cookie, configure a cloud script, and let remote servers scrape profiles or dispatch connection requests on autopilot. Today, that cloud-first approach creates massive operational risk. Major platforms, especially LinkedIn, deploy sophisticated security infrastructure designed specifically to detect cloud datacenter IP addresses, session cookie hijacking, and non-standard browser fingerprints.\n\nWhen a cloud service logs into your account from an AWS or DigitalOcean data center in Oregon while your real phone or laptop is connected to a home Wi-Fi network in Chicago, anti-abuse systems trigger security checkpoints instantly. CAPTCHAs, forced password resets, temp bans, and permanent account restrictions follow shortly after.\n\nRunning automation locally on your own hardware solves this fundamental flaw. A local tool executes scripts or generates engagement directly on your laptop or desktop. It uses your actual residential IP address, preserves your native browser session cookies, and mirrors genuine human interaction patterns. Whether you are a developer looking for open-source scraping libraries or a sales professional seeking a turn-key engagement engine, finding reliable PhantomBuster alternatives that run locally is the single most effective step you can take to safeguard your accounts while maintaining outreach efficiency.\n\nThis guide breaks down why cloud automation fails, evaluates the top local alternatives across developer and no-code categories, provides an architectural comparison, and walks through a step-by-step transition framework to keep your outreach safe and productive.\n\n---\n\n## Why Cloud Automation Fails: The Local Architecture Advantage\n\nTo understand why local automation is superior for account longevity, you need to understand how platforms like LinkedIn identify automated activity. Cloud automation providers operate thousands of concurrent processes on virtual private servers (VPS) hosted by major cloud vendors. Even when these services route traffic through rotating residential proxy networks, several distinct footprints betray them.\n\n![Diagram comparing cloud automation architecture risk versus local machine execution security.](https://assets.bevisible.app/inline-images/j573cqtewzrhbk398bc9xh1rr58ajmgr/inline-1-1785680237709-kleogh.png)\n### 1. Datacenter IP Flags and Session Cookie Hijacking\nCloud platforms require you to copy your session cookies (such as `li_at`) and upload them to remote servers. When PhantomBuster executes a cloud job, it sends HTTP requests or boots a headless browser session from a cloud server. Security algorithms compare the IP address of that request against your recent login history. If the session jumps between different subnets or originates from known commercial data center blocks, the security system flags the account for suspicious activity.\n\n### 2. Browser Fingerprinting and Behavioral Analytics\nModern anti-bot detection extends far beyond IP tracking. Platforms analyze canvas rendering, WebGL attributes, available hardware threads, audio context signatures, and mouse trajectory vectors. Cloud-based headless Chrome instances frequently reveal missing graphics hardware or default headless browser flags. Furthermore, cloud phantoms perform actions at mechanical speeds, navigating directly to target profile URLs without preliminary page scrolling, mouse movement, or natural idle times.\n\n### 3. The Local Advantage\nWhen an automation tool runs locally on your machine, it inherits the exact network environment and device telemetry you use for everyday browsing:\n\n* **Residential IP Integrity:** Requests originate from your local Internet Service Provider (ISP) rather than a cloud server or flagged proxy pool.\n* **Persistent Cookie Hygiene:** There is no need to export sensitive authentication tokens to third-party databases. Session cookies stay inside your local browser storage.\n* **Authentic Hardware Fingerprint:** WebGL rendering, GPU drivers, system fonts, and screen resolutions naturally match a real user device.\n* **Natural Human Patterns:** Local execution allows scripts to utilize local system timers, realistic browser viewport sizes, and native mouse movement vectors.\n\nBy keeping execution on your hardware, you eliminate the primary signals that trigger security blocks.\n\n---\n\n## Categorizing Local Alternatives to PhantomBuster\n\nReplacing PhantomBuster with a local system depends on your technical capability and core objective. Local solutions generally fall into three distinct categories:\n\n1. **Local AI & Authentic Engagement Engines:** Designed for non-technical users who need safe, high-converting LinkedIn visibility and conversation starter tools without cold DM spam.\n2. **Developer Frameworks & Code Libraries:** Built for software engineers and data analysts who require full control over web scraping, browser automation, and custom workflow pipelines.\n3. **Local No-Code RPA & Visual Workflow Builders:** Suited for operations teams who want visual drag-and-drop automation that runs inside a local desktop browser extension or application.\n\n---\n\n## Top Local Alternatives to PhantomBuster\n\n### 1. Junior\n\n[Junior](https://www.heyjunior.ai/) is an AI-powered LinkedIn automation engine built specifically around local execution and authentic interaction. Rather than relying on cloud phantoms that blast generic DMs or scrape profiles aggressively, Junior runs on your local machine to build pipeline through strategic, context-aware post commenting.\n\n#### Key Features\n* **Local Machine Runtime:** Junior runs directly on your computer, using your local browser environment and residential IP address to ensure account safety.\n* **Bio-Grounded AI Comment Drafting:** Instead of standard surface-level praise, Junior analyzes target LinkedIn posts and drafts context-aware, human-sounding comments based on your unique professional background and goals.\n* **Discussion Discovery Engine:** Finds high-impact discussions in your target niche, allowing you to establish authority in front of prospects before ever reaching out directly.\n* **Natural Interaction Dynamics:** Uses human-like browsing rhythms, eliminating robotic speed spikes that trigger account flags.\n\n#### Pros & Cons\n* **Pros:** Highest account safety profile; eliminates cold outreach spam in favor of warm inbound conversations; zero coding required; seamless integration with local browser sessions.\n* **Cons:** Focused on authentic engagement and post commenting rather than raw bulk scraping or mass cold messaging.\n\n#### Ideal For\nJob seekers, consultants, founders, and sales teams who want to build real relationships on LinkedIn safely. If you want to explore more options in this category, review our guide on [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n---\n\n### 2. Playwright (Node.js / Python)\n\nPlaywright is an open-source browser automation library developed by Microsoft. It supports Chromium, Firefox, and WebKit, providing reliable local browser execution.\n\n#### Key Features\n* **Multi-Browser Support:** Executes headless or headed automation across Chromium, Firefox, and Safari engines.\n* **Auto-Waiting Capabilities:** Waits for elements to be actionable before performing clicks or text entry, reducing flaky scripts.\n* **Network Interception:** Allows local interception and modification of network requests to extract raw JSON API responses directly.\n* **Storage State Reuse:** Saves authenticated browser state locally, preventing repeated login attempts.\n\n#### Pros & Cons\n* **Pros:** Extremely fast, robust execution; complete control over browser fingerprints and headers; free open-source software.\n* **Cons:** Requires software development experience; maintenance overhead when target website DOM structures update.\n\n#### Ideal For\nDevelopers who need to build custom, highly resilient scraping pipelines or workflow routines on their local hardware.\n\n---\n\n### 3. Puppeteer\n\nPuppeteer is a Node.js library maintained by Google that provides a high-level API to control Chrome or Chromium over the DevTools Protocol.\n\n#### Key Features\n* **Native Chrome Control:** Drives Chrome directly with fine-grained access to network events, performance metrics, and DOM manipulation.\n* **Stealth Plugin Ecosystem:** Works with `puppeteer-extra-plugin-stealth` to evade standard browser detection scripts.\n* **PDF & Screenshot Generation:** Excellent for locally rendering and saving visual proof of page states.\n\n#### Pros & Cons\n* **Pros:** Massive community support; extensive plugin library; lightweight setup for Node.js developers.\n* **Cons:** Limited to Chromium-based browsers; requires ongoing maintenance to evade updated bot detection scripts.\n\n#### Ideal For\nNode.js engineers building custom local data extractors who require fine control over Chrome instances.\n\n---\n\n### 4. Selenium WebDriver\n\nSelenium remains the classic open-source cross-platform browser automation framework. With bindings in Python, Java, C#, and JavaScript, it offers broad flexibility for local execution.\n\n#### Key Features\n* **Language Flexibility:** Script local automation in your programming language of choice.\n* **Native Browser Driver:** Interacts directly with native browsers (Chrome, Firefox, Edge, Safari) installed on your system.\n* **Undetected-Chromedriver:** Python developers can use specialized drivers designed to bypass anti-bot services like Cloudflare.\n\n#### Pros & Cons\n* **Pros:** Massive ecosystem; works with installed desktop browsers; vast documentation.\n* **Cons:** Slower than modern frameworks like Playwright; configuration can be complex.\n\n#### Ideal For\nPython developers or QA engineers who already have existing Selenium scripts and want to adapt them for local data tasks.\n\n---\n\n### 5. Axiom.ai (Local Desktop Runner)\n\nAxiom.ai is a visual browser automation tool that allows non-developers to build bots through a browser extension and run them locally on their desktop.\n\n#### Key Features\n* **Visual Step Builder:** Drag-and-drop elements to scroll, click, extract text, and fill forms.\n* **Local Desktop Execution:** Runs actions directly inside your local Chrome browser session without sending credentials to cloud servers.\n* **Webhook & CSV Connectivity:** Easily import input URLs from local spreadsheets and trigger routines via local triggers.\n\n#### Pros & Cons\n* **Pros:** No coding skills required; visual selector picker; safe local execution inside your own Chrome instance.\n* **Cons:** Visual workflows can break when page UI updates; high visual complexity for multi-step branching logic.\n\n#### Ideal For\nOperations teams and marketers who need no-code browser automation for routine web tasks without coding Python or JavaScript.\n\n---\n\n### 6. PyAutoGUI & Local RPA Frameworks\n\nPyAutoGUI is a Python module that programmatically controls the mouse and keyboard to simulate direct hardware input at the operating system level.\n\n#### Key Features\n* **OS-Level Simulation:** Moves the physical mouse cursor, clicks screen coordinates, and types keys at the operating system layer.\n* **Browser Independent:** Works on any desktop software, including native web browsers, electron apps, and desktop clients.\n* **Zero Browser API Footprint:** Bypasses DOM-level JavaScript detection scripts because actions occur at the screen/input level.\n\n#### Pros & Cons\n* **Pros:** Virtually impossible for web scripts to detect via standard browser DOM event listening.\n* **Cons:** Takes over your physical machine while running; resolution-dependent and fragile if window positions shift.\n\n#### Ideal For\nAdvanced developers who need an unbreakable fallback layer for high-security desktop automation tasks.\n\n---\n\n## Feature & Safety Comparison Matrix\n\nThe following matrix evaluates PhantomBuster against top local alternatives across core technical criteria:\n\n| Feature / Metric | PhantomBuster (Cloud) | Junior (Local AI) | Playwright / Puppeteer | Axiom.ai (Local) | PyAutoGUI (RPA) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **Execution Location** | Cloud VPS | Local Machine | Local Machine | Local Machine | Local Machine |\n| **IP Address Source** | Datacenter / Proxy | Native Residential IP | Native Residential IP | Native Residential IP | Native Residential IP |\n| **Session Cookie Risk** | High (Exported to Cloud) | Very Low (Local Only) | Low (Stored Locally) | Very Low (Local Chrome) | Zero (Uses Native UI) |\n| **Technical Skill Required** | Low | Low (Turnkey) | High (Code Required) | Low to Medium | High (Python Code) |\n| **Primary Use Case** | Cloud Scraping & Blasts | Warm AI Engagement | Custom Scraping Pipelines | Visual No-Code Tasks | OS Desktop Automation |\n| **Account Safety Rating** | Low | Extremely High | Medium to High | High | Very High |\n\nFor a deeper breakdown of safely scaling outreach tools, read our comprehensive review on the [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n---\n\n## Practical Guide: Transitioning from PhantomBuster Cloud to Local Execution\n\nMigrating your workflow from cloud phantoms to a local desktop runtime requires updating your technical habits. Follow this four-step transition roadmap to protect your accounts.\n\n![Process flowchart showing the four-step transition roadmap from cloud phantoms to local desktop execution.](https://assets.bevisible.app/inline-images/j573cqtewzrhbk398bc9xh1rr58ajmgr/inline-2-1785680241048-qanxgw.png)\n### Step 1: Audit and Map Your Cloud Phantoms\nCatalog every active task you run on PhantomBuster. Identify whether each job is primarily **data extraction** (e.g., pulling lead lists) or **social engagement** (e.g., sending messages or comments).\n\n* **For Data Extraction:** Transition from cloud phantoms to custom local Playwright scripts or visual local tools like Axiom.ai.\n* **For Engagement & Outreach:** Replace automated connection blasts with local, context-aware engagement tools like Junior. For comparative insights on engagement strategies, see [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### Step 2: Revoke Exported Session Cookies\nWhen you stop using cloud services, log out of your LinkedIn sessions on all browsers to invalidate all previously exported session cookies (`li_at`). Log back in cleanly on your primary local browser. This ensures that any stale cloud instances lose access immediately.\n\n### Step 3: Implement Local Pacing and Natural Delays\nIf you write local scripts using Python or Node.js, ensure you incorporate randomized delays between operations. Avoid precise intervals like `sleep(10)`\u2014use randomized distributions such as `sleep(random.uniform(12.5, 34.2))`. If you use desktop software like Junior, native human timing rhythms are handled automatically.\n\n### Step 4: Pivot from Mass Cold Outreach to Authentic Local Commenting\nInstead of scraping 500 profiles and firing off automated connection requests\u2014which triggers daily limit warnings\u2014focus on high-impact public discussions. Using Junior on your local machine to leave thoughtful comments on key industry posts builds public visibility and generates inbound profile views. To maintain long-term compliance, review our guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n---\n\n## Architectural Evaluation Checklist: Selecting the Right Local Automation Tool\n\nBefore implementing a local alternative, evaluate it against this three-tier compliance checklist. For a detailed rubric, consult our [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### Security & Environment Requirements\n* [ ] **Local Storage Verification:** Does the tool store all session tokens and personal data strictly on your local hard drive?\n* [ ] **Native IP Alignment:** Does the tool execute network requests using your computer's native residential connection?\n* [ ] **Headed Browser Mode:** Can the tool operate inside a visible, standard browser instance rather than a detected headless shell?\n\n### Operational Efficiency & Maintenance\n* [ ] **Low Maintenance Overhead:** Does the tool require constant code updates whenever a website alters its HTML selectors?\n* [ ] **Resource Optimization:** Does the application run quietly in the background without hogging system CPU and RAM?\n* [ ] **Human Rhythm Simulation:** Does the software include randomized dwell times and non-linear cursor movements?\n\n### Strategy & Pipeline Alignment\n* [ ] **Quality over Volume:** Does the tool encourage context-driven, warm engagement over high-volume spam?\n* [ ] **Conversion Focus:** Does the output generate meaningful public interactions that lead to profile visits and direct conversations?\n* [ ] **Compliance Alignment:** Check against our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) to confirm your tool meets safety standards.\n\n---\n\n## Debunking Common Myths About Local Automation\n\n### Myth 1: \"Local Automation Is Too Slow Compared to Cloud Servers\"\n**Reality:** Cloud phantoms allow you to launch dozens of parallel tasks, but high-volume automation on protected platforms leads directly to account bans. Fast automation that gets your account suspended delivers zero ROI. Local execution operates at sustainable human speeds, producing higher conversion rates and long-term account longevity.\n\n### Myth 2: \"Headless Browsers Are Invisible If Run Locally\"\n**Reality:** Running Playwright or Puppeteer in headless mode (`headless: true`) locally still exposes telltale browser flags (such as `navigator.webdriver = true` or modified WebGL hardware strings). To ensure total safety, local scripts should run in headed mode using real browser profiles, or rely on dedicated desktop tools designed to mimic human browsing signatures.\n\n### Myth 3: \"All Local Alternatives Require Advanced Programming Skills\"\n**Reality:** While frameworks like Playwright and Selenium require coding, modern applications like Junior give non-technical professionals a local, turnkey desktop experience. You get all the safety benefits of local execution without writing a single line of script. Explore how this compares to other tools in our roundup of the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n---\n\n## Frequently Asked Questions\n\n### Can PhantomBuster run locally on my personal computer?\nNo. PhantomBuster is built specifically as a cloud-hosted platform. Its phantoms execute on remote servers owned by PhantomBuster. To run automation locally on your machine, you must use local desktop tools like Junior, visual automation runners like Axiom.ai, or custom local code scripts using Playwright or Selenium.\n\n### Why does LinkedIn detect cloud platforms like PhantomBuster so easily?\nCloud platforms access your account from commercial datacenter IP ranges that differ from your real location. Furthermore, cloud servers run automated headless browsers that display unique hardware signatures, and they execute tasks at mechanical, non-human speeds. Combined, these signals make cloud phantoms easy targets for automated detection.\n\n### What is the safest local method for automating LinkedIn engagement?\nThe safest method is engaging publicly through strategic, context-aware post commenting using a local tool like Junior. By running directly on your local device, using your native residential IP, and generating insightful, human-sounding comments based on your professional bio, Junior generates warm profile traffic without triggering platform spam filters.\n\n### Do I need residential proxies if I run automation locally on my laptop?\nIf you are operating a single personal account from your primary laptop, you do not need external proxies. Your local home or office Wi-Fi provides an authentic residential IP. However, if you are an agency managing multiple accounts from a single machine, you should assign a distinct, dedicated residential proxy to each account profile.", "created_at": "2026-08-02T14:19:22.363155+00:00", "updated_at": "2026-08-02T14:19:22.363162+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
