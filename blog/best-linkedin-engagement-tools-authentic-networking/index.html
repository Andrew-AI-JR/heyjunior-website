    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 123, "slug": "best-linkedin-engagement-tools-authentic-networking", "title": "Best LinkedIn engagement tools for authentic networking", "excerpt": "Discover if using AI for LinkedIn engagement is safe. Learn why local execution matters and explore the best tools for authentic, high-converting networking.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57ajab0gqyt58nw6q3w2wk5798f7968/best-linkedin-engagement-tools-for-authentic-netwo-1791042523784-tpq3sn.png", "published_at": "2026-10-06T15:25:00+00:00", "content": "# Best LinkedIn engagement tools for authentic networking\n\nIf you are evaluating LinkedIn automation in 2026, you are likely wrestling with a contradictory problem. You know that manual networking doesn't scale, but you also see your own feed clogged with generic, robotic comments that clearly came from a prompt. You want to scale your outreach, but you are rightly asking: is it safe to use AI for LinkedIn engagement?\n\nThe short answer is yes, but the definition of \"safe\" has changed. \n\nTwo years ago, safety meant avoiding an account restriction. Today, platform bans are just one part of the equation. The far more common\u2014and arguably more damaging\u2014penalty is the silent algorithmic downgrade and the loss of professional trust. When your prospects identify your outreach as automated, you don't get banned; you just get ignored. \n\nThis guide breaks down the mechanics of safe AI engagement, why the shift from cold direct messages (DMs) to public commenting is happening, and the best LinkedIn engagement tools available for professionals who want to build genuine relationships without the manual grind.\n\n## The Two Types of Safety on LinkedIn\n\nWhen professionals ask about the safety of AI tools on LinkedIn, they are usually confusing two different concepts: technical compliance and social authenticity. To build a sustainable pipeline, you have to master both.\n\n### 1. Technical Safety (Account Protection)\n\nTechnical safety refers to how a tool interacts with LinkedIn\u2019s servers. LinkedIn employs sophisticated anti-scraping and anti-bot mechanisms to protect its platform. If an automation tool triggers these defenses, your account can face a temporary restriction, shadowbanning, or permanent suspension. \n\nMost traditional automation tools operate in the cloud. They log into your account from a datacenter IP address\u2014often halfway across the world from where you normally browse\u2014and execute actions at superhuman speeds. They send 100 connection requests in an hour or scrape thousands of profiles simultaneously. LinkedIn's security algorithms easily flag this behavior because it does not mimic human interaction patterns. \n\nSafe tools, conversely, run locally on your own machine. They use your actual IP address, respect natural human delays (like pausing between clicks), and operate strictly within LinkedIn\u2019s intended user interface. \n\n### 2. Algorithmic and Social Safety (Reputation Protection)\n\nThe second, more nuanced layer of safety is social. This is where AI often fails if not managed correctly. \n\nLinkedIn's algorithm is designed to prioritize meaningful human interaction. As AI generation has become widespread, the platform\u2014and its users\u2014have developed a low tolerance for obvious automation. [Engagement is evaporating lately](https://www.linkedin.com/posts/rachel-rappaport_engagement-is-evaporating-lately-and-yes-activity-7375886932536426496-m8og) for accounts that rely on generic, AI-generated content, while authentic, nuanced communication is rewarded.\n\nThe data backs this up. Recent academic analysis of the platform highlights that content and comments clearly identified as AI-generated receive significantly less engagement\u2014up to 45% less than human-authored content. Even more concerning for sales teams and founders is that 62% of users are less likely to trust content they perceive as AI-generated [The Rise of AI-Generated Content on LinkedIn](https://www.researchgate.net/publication/391873822_The_Rise_of_AI-Generated_Content_on_LinkedIn_Implications_for_Engagement_Trust_and_Thought_Leadership). \n\nSocial safety means your AI output must be context-aware. It cannot simply summarize a post and add \"Great insights!\" It must bring a specific perspective, reference your unique background, and sound like a human professional having a real conversation. As noted by industry observers, [no one cares if you use AI to write your posts](https://www.linkedin.com/posts/faroukbacha_no-one-cares-if-you-use-ai-to-write-your-activity-7363555388111085569-0vaa), provided you do not get caught using it by producing generic, thoughtless output. \n\n![Diagram comparing technical account safety and social reputation safety for LinkedIn AI engagement.](https://assets.bevisible.app/inline-images/j57ajab0gqyt58nw6q3w2wk5798f7968/inline-1-1791042446544-6ooj5f.png)\n## The Shift From Cold DMs to Strategic Public Commenting\n\nFor years, the standard playbook for job seekers, lead gen agencies, and sales teams was volume-based cold outreach. You would build a list, load it into a tool, and fire off hundreds of automated connection requests and generic pitch DMs.\n\nThat era is over. Decision-makers guard their inboxes aggressively. A cold DM from a stranger is met with immediate skepticism, if it gets read at all.\n\nThe modern, high-converting alternative is strategic public commenting. Instead of interrupting a prospect in their private inbox, you join a conversation they are already having in public. When a founder or hiring manager posts about a challenge in their industry, a thoughtful, insightful comment does three things:\n\n1.  **Bypasses the inbox:** Your prospect receives a notification that you engaged with their content, completely avoiding the crowded DM request folder.\n2.  **Builds public authority:** Your comment is visible not just to the author, but to their entire network. A great comment acts as a micro-billboard for your expertise.\n3.  **Warms up the relationship:** After you have engaged thoughtfully on a prospect's content two or three times, a subsequent connection request is no longer cold. It has a significantly higher acceptance rate.\n\nHowever, writing tailored, context-rich comments on dozens of posts a day is incredibly time-consuming. This is exactly where the right AI engagement tools bridge the gap between scale and authenticity.\n\n## Best LinkedIn Engagement Tools for Authentic Networking\n\nThe landscape of [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) is divided. On one side are the legacy volume-pushers focused on connection limits and DM sequences. On the other are the newer, context-driven tools designed to facilitate real conversations. \n\nHere is how the top options stack up for professionals prioritizing safety and authenticity.\n\n### 1. Junior (Best for authentic, context-aware commenting)\n\nJunior represents a fundamental shift in how professionals handle [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin). Instead of automating generic connection requests, Junior is an AI-powered LinkedIn automation tool designed specifically to start authentic conversations through strategic post commenting.\n\n**How it works:**\nJunior replaces the manual hunt for relevance. It finds targeted discussions relevant to your niche\u2014whether you are a job seeker looking for hiring managers or a consultant seeking pipeline. Rather than spitting out generic replies, Junior drafts context-aware, human-sounding comments based on your unique bio, past experiences, and specific networking goals. \n\n**Why it leads in safety:**\nUnlike cloud-based tools that ping LinkedIn from remote servers, Junior runs locally on your own machine. All actions originate from your actual IP address and mimic natural human browsing speeds. This architectural choice makes it virtually impossible for LinkedIn's security systems to flag the activity as datacenter automation. \n\n**Best for:** \nFounders, sales teams, consultants, and job seekers who want to turn public visibility into direct interviews and client conversations without risking their account or sounding like a bot. \n\n### 2. Taplio (Best for broad content scheduling)\n\nTaplio is a popular choice for creators focused on outbound content generation rather than inbound engagement. It offers a robust suite of tools for drafting posts, analyzing metrics, and scheduling content weeks in advance. \n\n**The trade-offs:**\nTaplio operates in the cloud. When comparing [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), the distinction usually comes down to your primary goal. If you want to blast content to a large audience and schedule posts across different time zones, Taplio's cloud infrastructure is helpful. However, if your goal is engaging directly with specific high-value prospects, cloud-based tools carry a slightly higher inherent risk regarding account safety flags. Furthermore, while Taplio has commenting features, its primary strength remains broad content scheduling.\n\n### 3. Supergrow (Best for personal brand ideation)\n\nSupergrow focuses heavily on helping users ideate and format their own posts. It provides templates, formatting tools, and AI writing assistance to help users maintain a consistent posting schedule. \n\n**The trade-offs:**\nSupergrow is excellent for the \"blank page problem\" when you don't know what to post on your own feed. However, it is less focused on the outbound engagement piece\u2014finding your prospects' posts and engaging with them. For teams looking for [best AI tools for Linkedin commenting tools beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), you generally need a tool strictly dedicated to comment generation and context-matching rather than just post creation.\n\n### 4. Dripify (Best for traditional DM sequences)\n\nDripify is a well-known player in the traditional LinkedIn automation space. It allows you to build complex logic sequences: send a connection request, wait two days, send a message, wait three days, endorse a skill. \n\n**The trade-offs:**\nWhile Dripify offers a powerful sequence builder, it relies heavily on the outdated cold DM model. As we have established, the effectiveness of automated inbox sequences is plummeting. When evaluating [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), the choice is philosophical: do you want to play a low-conversion numbers game in the inbox, or a high-conversion relationship game in the public feed? Additionally, Dripify is cloud-based, which requires careful management of daily limits to avoid platform penalties.\n\n### 5. Phantombuster (Best for data scraping)\n\nPhantombuster is a highly technical tool used primarily for data extraction. If you need to scrape the profile data of every attendee at a specific LinkedIn event and export it to a CSV for a cold email campaign, Phantombuster is incredibly powerful.\n\n**The trade-offs:**\nIt is not an engagement tool in the true sense. While you can use its APIs to automate actions, it requires technical setup and is highly disconnected from authentic networking. If you are looking to build relationships through conversation, you will quickly find yourself searching for [Phantombuster alternatives for automate Linkedin comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n![Flowchart comparing the failure rate of cold direct messages against strategic public commenting on LinkedIn.](https://assets.bevisible.app/inline-images/j57ajab0gqyt58nw6q3w2wk5798f7968/inline-2-1791042449464-trrnqs.png)\n## The Mechanics of Safe Local Execution\n\nTo fully understand why tools like Junior emphasize local execution, it helps to understand exactly what LinkedIn's security algorithms are looking for.\n\nWhen you log into LinkedIn normally, your browser sends a specific set of data to LinkedIn's servers. This includes your IP address (which likely resolves to your local internet service provider), your browser footprint, and behavioral data like how quickly your mouse moves or how long you pause before scrolling.\n\nCloud-based automation tools run on servers in places like AWS or DigitalOcean data centers. When they log into your account, LinkedIn instantly sees an IP address belonging to a commercial data center. Furthermore, these tools often use \"headless browsers\" (browsers without a graphical user interface) that navigate the site instantly, clicking buttons in milliseconds. \n\nLinkedIn does not have to read your messages to know you are using automation; the technical footprint gives you away before you even send a request. \n\nLocal execution tools solve this by sitting on your actual machine. When the tool interacts with LinkedIn, it uses your normal IP address. It clicks elements on the screen at human speeds. It takes breaks. To the platform's security algorithms, local execution looks exactly like you sitting at your desk manually typing out comments. This is why local execution is the non-negotiable standard for safe engagement in 2026.\n\n| Feature | Cloud-Based Automation | Local Execution (e.g., Junior) |\n| :--- | :--- | :--- |\n| **IP Address** | Data center (High risk of flagging) | Your local ISP (Normal behavior) |\n| **Interaction Speed** | Instant/API-based (Unnatural) | Human-paced delays (Natural) |\n| **Account Safety** | Requires careful limit management | Inherently mimics safe daily usage |\n| **Setup** | Web login, sometimes requires session cookies | Runs securely on your own device |\n\n## How to Avoid the \"Uncanny Valley\" of AI Content\n\nEven if you are using a safe, locally executed tool, you can still fail the authenticity test if your comments sound robotic. \n\nThe \"uncanny valley\" of AI refers to text that is grammatically perfect but completely devoid of human soul, nuance, or specific context. If you have spent any time on LinkedIn recently, you know exactly what this looks like. It is the comment that starts with \"Delving into this robust dynamic...\" or \"Great insights! It is crucial to remember that...\"\n\nWhen you use generic AI, you signal to the creator that you didn't actually read their post, you just want to siphon off their audience. This damages your brand. To engage safely and authentically, follow these core principles.\n\n### 1. Inject Your Bio and Goals\n\nGeneric AI models like vanilla ChatGPT only know the prompt you give them in that moment. To make AI comments sound like you, the tool needs persistent context. \n\nYour automation tool must know who you are. Are you a senior software engineer looking for startup roles? Are you a B2B sales director targeting manufacturing CEOs? Your comments should reflect that specific lens. A good tool will use your professional bio as a foundational layer for every comment it drafts, ensuring the output aligns with your actual expertise and goals. \n\n### 2. Add Friction to the Workflow\n\nIf a tool allows you to \"auto-comment\" on fifty posts while you sleep, do not use it. \n\nAuthentic engagement requires human oversight. The safest and most effective way to use AI is as a drafting assistant, not an autonomous agent. A tool like Junior finds the relevant post and drafts a highly contextual reply based on your background, but it should always present that draft to you for review. \n\nTaking five seconds to tweak a drafted comment\u2014perhaps by adding a specific memory from a past project or adjusting the tone to be slightly more casual\u2014turns a B+ AI draft into an A+ human interaction. \n\n### 3. Avoid AI-Generated Imagery Where Possible\n\nWhile this guide focuses on engagement and commenting, it is worth noting that LinkedIn's algorithms are increasingly scrutinizing AI generation across all content types. \n\nThere are growing reports within the community that [LinkedIn penalizes AI-generated graphics](https://www.linkedin.com/posts/xamsor_it-looks-like-linkedin-penalizes-ai-generated-activity-7433679919844319233-H3Dp), with users seeing significant reach reductions on posts relying heavily on obvious AI imagery. When building your brand, keep the visual elements as authentic and human as possible to maintain maximum algorithmic reach, reserving your AI leverage for text-based drafting and targeted conversation discovery.\n\n### 4. Disagree Politely\n\nOne of the easiest ways to spot a generic bot is that it agrees with absolutely everything. AI models are natively trained to be sycophantic and helpful. They want to praise the original poster.\n\nHuman professionals have opinions. They see nuance. If a prospect posts a controversial take on industry trends, a respectful, well-reasoned counterpoint or a question about an edge case is incredibly valuable. It shows you actually read the post and understand the subject matter deeply. Train your engagement tool (or edit the output) to occasionally play devil's advocate or ask clarifying questions rather than just offering applause. \n\n![Checklist notebook showing the 3-step process of combining AI drafts with human review for authentic engagement.](https://assets.bevisible.app/inline-images/j57ajab0gqyt58nw6q3w2wk5798f7968/inline-3-1791042447178-fudwuj.png)\n## The Return on Investment of Authentic Engagement\n\nWhy go through all this effort to curate comments instead of just blasting connection requests? Because the conversion rates heavily favor authenticity.\n\nConsider a typical sales scenario. You identify a target account and want to speak with the VP of Operations. \n\n**Path A (Traditional Automation):**\nYou use a cloud-based scraper to send a connection request. If they accept, you immediately send a multi-paragraph pitch about your services. The VP sees this, realizes they are in an automated sequence, and either ignores the message or removes the connection. \n\n**Path B (Authentic AI Engagement):**\nYou use a local tool like Junior. Junior flags that the VP of Operations just posted about supply chain bottlenecks. Junior drafts a thoughtful comment referencing your background in logistics optimization and asks a smart question about their specific approach. You review it, click post. The VP replies to your comment. Two days later, they post again, and you leave another insightful comment. \n\nA week later, you send a connection request with a simple note: \"Really enjoying your recent posts on supply chain issues, would love to connect.\"\n\nThe VP accepts. Because you have already demonstrated value and established a micro-relationship in public, they are far more receptive when you eventually bring up how your service solves the exact bottlenecks they were posting about. \n\nThis is how modern social selling works. It is not about tricking people into talking to you; it is about finding the right conversations faster and participating in them intelligently. There are developers [building AI tools to help with LinkedIn engagement (not spam)](https://www.reddit.com/r/SaaS/comments/1pplo7c/building_an_ai_tool_to_help_with_linkedin/), and the market is rapidly migrating toward these solutions because they actually drive revenue.\n\n## Frequently Asked Questions\n\n### Will LinkedIn ban my account for using AI?\nLinkedIn does not explicitly ban the use of AI to help write content or draft comments. They provide their own AI drafting tools in some premium features. What they do penalize is unnatural bot behavior (executing hundreds of actions instantly from data center IP addresses) and generic, low-quality spam that degrades the user experience. Using a locally executed tool that drafts context-aware comments for your review is safe.\n\n### How can people tell if a comment is AI-generated?\nPeople spot AI through specific vocabulary tics (words like \"delve,\" \"robust,\" \"testament,\" \"tapestry\"), a lack of personal experience, and overly formal, sycophantic agreement with the original post. AI also struggles with brevity; it often writes three paragraphs when one sentence would suffice. You avoid this by using tools that incorporate your personal bio and by manually reviewing drafts before posting.\n\n### What is the best way to transition from cold DMs to public commenting?\nStart by identifying 20 to 30 high-value prospects or thought leaders in your niche. Use a tool designed for strategic engagement to monitor their activity. Commit to leaving one thoughtful, context-rich comment on their posts before ever sending a connection request. Focus on adding value to the public discussion rather than trying to pull them into a private sales pitch immediately.", "created_at": "2026-10-06T15:49:27.895111+00:00", "updated_at": "2026-10-06T15:49:27.895117+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',

                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const tryItHref = assetRoot + 'try-it.html?goal=sales&src=' + encodeURIComponent(ctaSrc);
                const trialHref = assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>See what Junior would say on a post from your market</h2>
                        <p>Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
