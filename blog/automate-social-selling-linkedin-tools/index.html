    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 114, "slug": "automate-social-selling-linkedin-tools", "title": "Best Automate Social Selling On Linkedin Tools Beyond Phantombuster", "excerpt": "Discover how to automate social selling on LinkedIn safely. Move beyond legacy scrapers to engagement-first AI tools that drive authentic pipeline in 2026.", "featured_image_url": "https://assets.bevisible.app/featured-images/j572efg6pk2by20b4wes8tarhs8d7qg7/best-automate-social-selling-on-linkedin-tools-bey-1790437696929-kq6oh5.png", "published_at": "2026-09-26T15:40:00+00:00", "content": "# Best Automate Social Selling On Linkedin Tools Beyond Phantombuster\n\nIf you are running a B2B sales motion, looking for consulting clients, or trying to land interviews, you already know the harsh reality of the modern LinkedIn inbox. It is completely overrun. Decision-makers log in to find dozens of automated connection requests, all followed immediately by a multi-paragraph pitch for offshore development, lead generation, or a SaaS product they do not need. \n\nFor years, the standard playbook for LinkedIn growth was built on brute force. You would scrape a list of thousands of profiles, plug them into a cloud-based automation sequence, and blast out templated messages. Tools like Phantombuster pioneered this era of high-volume, low-touch extraction. But that era is effectively over. Buyers have developed immunity to automated pitches, and LinkedIn has dramatically tightened its security, limiting connection requests and aggressively banning accounts that exhibit bot-like behavior. \n\nToday, successful [social media sales automation](https://www.linkedin.com/top-content/sales/sales-automation-tools-to-consider/social-media-sales-automation/) requires a completely different approach. It bridges the gap between digital marketing and sales, allowing you to scale relationships without losing authenticity. Instead of interrupting prospects in their private inboxes, modern social selling is about earning visibility in the public feed through strategic, context-aware engagement.\n\nThis requires moving beyond legacy scraping tools and adopting platforms designed for the current engagement-first reality. In this guide, we will break down why traditional automation fails, how to build a modern social selling workflow, and the tools you need to bypass crowded inboxes and turn public visibility into direct interviews, pipeline, and client conversations.\n\n## The Phantombuster Trap: Why Legacy Automation is Failing\n\nTo understand how to automate social selling today, you have to understand why the old methods stopped working. Phantombuster and similar legacy tools operate primarily as data extraction and workflow automation platforms. They sit in the cloud, log into your LinkedIn account via session cookies, scrape data, and execute bulk actions like sending 50 connection requests a day.\n\n### The Problem with Cloud-Based Automation\nCloud automation relies on servers located in data centers entirely separate from your physical location. If you live in London, but your automation tool is pinging LinkedIn from an AWS server in Virginia at superhuman speeds, LinkedIn\u2019s security algorithms immediately flag the discrepancy. \n\nFurthermore, because these tools operate from the cloud, they often execute actions in predictable, robotic loops. They click the exact same elements at the exact same intervals, making them highly vulnerable to LinkedIn\u2019s automated detection systems. The platform has cracked down heavily on this, restricting accounts to roughly 100 connection requests per week. If a cloud tool glitches or pushes past these limits, your account risks a permanent ban. \n\n### The Conversion Rate Collapse\nBeyond the technical risks, the conversion rate of cold, automated direct messaging has plummeted. When every SDR, founder, and recruiter is using the exact same playbook, the tactic loses its efficacy. \n\nWhen you automate a connection request that says, *\"Hi [First Name], noticed we are both in the B2B space and wanted to connect,\"* you are signaling to the prospect that they are simply a row in a spreadsheet. Even if you use sophisticated personalization variables, the timing and context are usually entirely disjointed from the prospect's actual day-to-day priorities. They accept the request out of habit, ignore the immediate follow-up pitch, and your message sinks to the bottom of their inbox.\n\nIf you want a deeper look into the safety implications of legacy tools and how to pivot, reviewing [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is a strong starting point.\n\n## The Paradigm Shift: Engagement as the New Outreach\n\nIf cold messaging is dying, what replaces it? The answer is visible engagement.\n\nThink about how you interact with LinkedIn. You scroll the feed, you read posts from your network, and you look at the comments section to see who is adding value to the conversation. If a stranger sends you a cold pitch, you ignore it. But if a stranger consistently leaves thoughtful, highly relevant comments on your posts\u2014or on posts from industry leaders you follow\u2014you eventually click their profile. You read their headline. You check out their featured section. \n\nThis is the core of modern social selling. It shifts the dynamic from outbound interruption to warm inbound attraction. By commenting intelligently on the right posts, you position yourself as a peer and a subject matter expert. When you eventually send a connection request, it is no longer cold. The prospect recognizes your name and face from the feed.\n\n![Diagram contrasting legacy cold inbox messaging with modern public feed engagement on LinkedIn](https://assets.bevisible.app/inline-images/j572efg6pk2by20b4wes8tarhs8d7qg7/inline-1-1790437652993-gyrc8m.png)\n### Why Commenting Outperforms Direct Messaging\n1. **The Multiplying Effect:** When you send a DM, only one person sees it. When you leave a high-quality comment on an industry-relevant post, the author sees it, their network sees it, and the broader LinkedIn algorithm pushes that interaction into more feeds. A single comment can generate hundreds of profile views.\n2. **Reduced Friction:** A comment does not ask for anything. A DM almost always asks for time, a meeting, or a purchase. Commenting lowers the barrier to interaction, allowing trust to build organically.\n3. **Algorithm Alignment:** LinkedIn rewards conversations. The platform\u2019s algorithm actively promotes posts that generate discussion. When you comment, you are helping the author's reach, which triggers reciprocity. \n\nThe challenge, historically, has been scale. Leaving thoughtful, context-aware comments takes time. You have to read the post, understand the nuance, relate it to your own expertise, and type out a response. Doing this 50 times a day manually is a full-time job. This is where modern AI automation steps in.\n\n## Top Tools for Automating Social Selling in 2026\n\nTo execute an engagement-first social selling strategy, you need tools that prioritize safety, context, and intelligent interaction over sheer volume. Here is a breakdown of the modern tech stack.\n\n### 1. Junior: The Engagement-First Local AI Alternative\nWhen evaluating [how to automate social selling actually works](https://www.youtube.com/watch?v=-yNoCeiqcII&t=16) for modern teams, the most critical shift is moving from cloud-based spammers to local, context-aware assistants. This is exactly where Junior operates.\n\nJunior is an AI-powered LinkedIn automation tool specifically designed to start authentic conversations through strategic post commenting. It completely bypasses the risks of cloud-based scraping by running locally on your own machine. When Junior engages on your behalf, it uses your actual IP address and natural human browsing patterns, making it virtually undetectable to LinkedIn\u2019s security algorithms. \n\nInstead of spamming inboxes, Junior acts as your personal engagement SDR. It finds relevant discussions based on your targeting parameters and drafts context-aware, human-sounding replies. It doesn't just summarize the post; it formulates responses based on your unique bio, tone, and goals. \n\nFor professionals who want to scale their visibility without risking their reputation or account safety, Junior replaces the outdated Phantombuster model. If you are comparing strategies for generating inbound leads without mass messaging, exploring [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) highlights the massive difference in outcomes between feed engagement and inbox automation.\n\n### 2. LinkedIn Sales Navigator: The Targeting Engine\nNo automation tool can succeed without high-quality targeting. LinkedIn Sales Navigator remains the foundational data layer for social selling. While it doesn't automate your outreach, it automates your list building and monitoring.\n\nSales Navigator allows you to move beyond basic title searches and use behavioral triggers. You can filter for prospects who have posted on LinkedIn in the last 30 days, changed jobs recently, or been mentioned in the news. By feeding these highly targeted, active lists into your engagement workflow, you ensure your automation efforts are directed only at people who are actually active on the platform.\n\n### 3. Taplio: The Content Creation Hub\nWhile Junior handles the engagement side of the equation, platforms like Taplio focus heavily on the content creation and scheduling side. Taplio provides AI assistance for drafting your own posts, analyzing top-performing content in your niche, and scheduling your calendar. \n\nHowever, when it comes to outbound engagement and growth, many users find Taplio's cloud-based automated liking and generic commenting features to be risky and lacking in deep context. If your primary goal is safe, high-quality interaction that sounds exactly like you, evaluating [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) will help clarify which architecture best suits your social selling motion.\n\n## Step-by-Step Guide: Automating Your Social Selling Workflow\n\n[Mastering Social Selling on LinkedIn](https://www.youtube.com/watch?v=_B8GPjImx5c) requires a documented, repeatable system. You cannot just turn on an AI tool and hope for the best. You need a structured workflow that moves a prospect from a stranger to a warm connection. Here is the blueprint for automating that process effectively.\n\n### Step 1: Define Your Highly Specific ICP\nBroad targeting kills automation. If your target audience is simply \"Founders in Tech,\" your AI comments will lack edge because the underlying context is too wide. You need to narrow your focus to specific pain points. \n\nInstead of targeting all founders, target \"Series A SaaS founders actively hiring sales leadership.\" The more specific your audience, the easier it is to train your AI on the exact perspectives, terminology, and value propositions that will resonate with them.\n\n### Step 2: Build Dynamic Lists in Sales Navigator\nOnce your ICP is defined, build your lists in Sales Navigator. The critical filter here is \"Posted on LinkedIn in past 30 days.\" Engaging with inactive accounts is a waste of your automation bandwidth.\n\n*   **Boolean Search Mastery:** Use precise Boolean strings to find exact matches. For example: `(\"VP of Sales\" OR \"Head of Sales\") AND (\"SaaS\" OR \"Software\") NOT (\"Consultant\")`.\n*   **Account-Based Monitoring:** Save these searches so Sales Navigator automatically populates your feed with new leads that meet your criteria. You are building a living database of people you want to engage with.\n\n### Step 3: Deploy Context-Aware Automated Commenting\nThis is the stage where you leave traditional automation behind and deploy Junior. Instead of exporting that Sales Navigator list to a cold DM sequence, you configure Junior to monitor the active posts from those specific leads.\n\nWhen a prospect on your list posts an update, Junior analyzes the text. Because Junior is pre-configured with your specific bio, industry expertise, and chosen tone of voice, it drafts a comment that adds genuine value to the discussion. \n\n![Comparison card diagram illustrating generic bot replies versus context-aware AI commenting on LinkedIn](https://assets.bevisible.app/inline-images/j572efg6pk2by20b4wes8tarhs8d7qg7/inline-2-1790437651775-gmh9k5.png)\nThe difference between a generic bot and a well-configured AI assistant is staggering. \n\n| Comment Type | Example | Impact |\n| :--- | :--- | :--- |\n| **Generic Bot (Cloud)** | \"Great post! Thanks for sharing.\" | Ignored. Signals low effort. Can actively harm your brand reputation. |\n| **Summarizing AI** | \"I agree that social selling is replacing cold calling. Good insights.\" | Better, but still boring. Does not add net-new value to the conversation. |\n| **Context-Aware AI (Junior)** | \"Spot on about the drop in cold DM reply rates. We saw the exact same thing last quarter\u2014switching our SDRs to an engagement-first model boosted our meeting booked rate by 22%. Have you found that longer sales cycles respond better to this?\" | Drives engagement. Validates the author's point, adds data from your unique perspective, and ends with a question to spark a reply. |\n\n### Step 4: The Human Review Checkpoint\nTotal, unchecked automation is a dangerous game. While Junior generates incredibly high-quality drafts, the safest and most effective workflow includes a quick human review. Junior queues up the drafted comments on your local machine. You can spend 10 minutes a day rapidly reviewing, tweaking, and approving the comments. This ensures your voice is perfectly aligned and prevents any AI hallucinations from making it to a live prospect's post.\n\nThis hybrid approach\u2014AI doing the heavy lifting of context gathering and drafting, with a human providing final approval\u2014is the gold standard for modern social selling. To benchmark your current process against industry standards, run your workflow through the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### Step 5: The Warm Handoff to Direct Messaging\nAutomation should handle the initial engagement, but closing the deal requires human-to-human interaction. Once you have established a presence on a prospect's posts\u2014say, you have commented on three of their updates and they have replied to two of them\u2014they are now a warm lead.\n\nAt this point, you send a manual connection request. Do not use an automated template. Reference the specific conversation you were just having in the feed. \n\n*\"Hey Sarah, really enjoyed our back-and-forth on your post about outbound metrics yesterday. Would love to connect and keep following your updates.\"*\n\nBecause you have already provided value publicly, the acceptance rate for this type of request often exceeds 80%. Once connected, you can transition the conversation into a DM, exploring their pain points naturally. You have bypassed the crowded cold inbox entirely.\n\n## Advanced Strategies by Use Case\n\nSocial selling automation looks slightly different depending on your role. Here is how different professionals utilize platforms like Junior to drive specific outcomes.\n\n### For B2B Sales Teams and SDRs\nSales teams are under immense pressure to hit quota, often leading to a \"spray and pray\" mentality. The most successful SDRs are pivoting away from volume DMs and using automation to map accounts.\n\nIf an SDR is targeting a specific enterprise account, they can use Junior to track and engage with multiple stakeholders within that company\u2014the VP of Engineering, the CTO, and the Lead Developer. By leaving smart, industry-relevant comments on posts across the entire buying committee, the SDR creates a surround-sound effect. When the Account Executive eventually reaches out, the target company already recognizes the vendor's brand because their representatives have been actively adding value in their feeds.\n\n### For Job Seekers\nThe modern job hunt is a sales motion. Applying to hundreds of roles via generic portals rarely works. Job seekers can use automation to bypass the recruiter and get directly in front of the hiring manager.\n\nA job seeker can build a list of VPs and Directors at their target companies. By using Junior to draft thoughtful comments on their industry updates, the job seeker demonstrates their expertise publicly. This routinely leads to hiring managers clicking the job seeker\u2019s profile and initiating inbound conversations about open roles before they are even posted publicly.\n\n### For Lead Gen Agencies and Consultants\nAgencies have built entire business models on selling Phantombuster sequences to their clients. As those sequences fail, agencies are churning clients at record rates. Forward-thinking lead gen agencies are switching to \"Engagement as a Service.\"\n\nInstead of selling 500 cold emails a day, they manage the local AI infrastructure for their clients, setting up Junior to automate high-quality commenting at scale. This protects the client's account safety and generates warmer, higher-intent leads, allowing the agency to charge a premium for a service that actually delivers ROI in 2026.\n\n## Automation Safety: How to Protect Your Account\n\nYou cannot discuss LinkedIn automation without addressing account safety. LinkedIn\u2019s terms of service technically restrict third-party automation, but the platform\u2019s enforcement is entirely behavioral. They ban accounts that act like bots. If your automation acts like a human, you stay under the radar.\n\n### The Local Advantage\nAs mentioned earlier, running automation locally on your own machine is the single biggest safety upgrade you can make. When Junior operates, it uses your device, your browser environment, and your local IP address. To LinkedIn's servers, Junior looks exactly like you sitting at your desk, clicking your mouse.\n\n### Rate Limits and Human Pacing\nCloud bots try to execute tasks instantly. A human takes time to read a post, formulate a thought, and type it out. Safe automation tools build in randomized delays. They pause between page loads. They don't process 50 comments in 5 seconds; they spread them out over an hour, mimicking natural behavior.\n\nNever attempt to max out your engagement limits on day one. If you have been completely inactive on LinkedIn and suddenly leave 100 comments in a day, the algorithm will flag the anomaly. Start with 10 automated engagements a day and slowly ramp up over several weeks. For a comprehensive breakdown of rate limits and safety protocols, refer to [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Measuring the ROI of Social Selling Automation\n\nTraditional automation tracked vanity metrics: connections sent, connections accepted, and emails delivered. Because modern social selling focuses on engagement and inbound visibility, your KPIs must shift.\n\nHere are the metrics that actually indicate your automated social selling is working:\n\n1.  **Profile View Velocity:** This is your leading indicator. If your automated comments are relevant and well-crafted, you should see a sustained, weekly increase in the number of people viewing your profile. \n2.  **Inbound Connection Requests (from ICP):** As you become a fixture in the comments of your target accounts, those prospects will start sending *you* connection requests. Track how many inbound requests you receive from people matching your Sales Navigator criteria.\n3.  **Comment-to-DM Conversion Rate:** Track how many public comment threads naturally transition into private, high-intent DM conversations.\n4.  **Pipeline Generated:** Ultimately, social selling must tie back to revenue or core goals. How many discovery calls, interviews, or client meetings were sourced directly from an initial interaction in the feed?\n\n## Frequently Asked Questions (FAQ)\n\n### Is automating social selling on LinkedIn against the rules?\nLinkedIn\u2019s User Agreement states that using bots or automation tools to scrape data or automate activity is not permitted. However, enforcement is primarily aimed at high-volume, cloud-based spam tools that degrade the user experience. By using local software like Junior that operates within normal human limits and adds genuine value to the feed, you drastically minimize the risk of detection or penalty. The goal is to assist your authentic engagement, not replace it with spam.\n\n### How many comments should I automate per day?\nVolume should never supersede quality. For most professionals, leaving 15 to 30 highly targeted, deeply contextual comments per day is more than enough to generate significant pipeline. If you try to push past 50 to 100 comments a day, not only do you risk algorithmic penalties, but the quality and relevance of the interactions will inevitably degrade. Treat your daily engagements as curated interactions, not a numbers game.\n\n### Can AI actually mimic my specific tone of voice?\nYes, but it requires upfront configuration. Off-the-shelf generative AI tends to sound overly enthusiastic or formal. Tools designed specifically for social selling solve this by allowing you to input your professional background, your contrarian viewpoints, and your specific communication style. The AI uses this context to draft responses that don't just sound human, but sound specifically like *you*. This is why the human review step is so powerful\u2014you train the model on your preferences over time.\n\n## The Future of LinkedIn Growth\n\nThe days of exporting a list from Sales Navigator, plugging it into a cloud scraper, and spamming a thousand inboxes are behind us. Buyers are smarter, the algorithms are stricter, and the noise level is deafening. \n\nIf you want to understand [how to automate LinkedIn posts with AI](https://www.youtube.com/watch?v=ap0MoOBmim8) or scale your outbound motion, the answer is no longer volume. It is relevance at scale. \n\nBy shifting your strategy from direct messaging to public engagement, and by upgrading your toolset from legacy cloud scrapers to local, context-aware AI assistants like Junior, you can automate the heavy lifting of social selling. You bypass the ignored inbox, build authority in the public feed, and start authentic conversations that actually convert into revenue. The tools have evolved; it is time your strategy did too.", "created_at": "2026-09-26T15:49:26.771075+00:00", "updated_at": "2026-09-26T15:49:26.771082+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
