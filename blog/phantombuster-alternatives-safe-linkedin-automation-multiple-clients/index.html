    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 98, "slug": "phantombuster-alternatives-safe-linkedin-automation-multiple-clients", "title": "Phantombuster Alternatives for Safe Linkedin Automation for Managing Multiple Client", "excerpt": "Explore safe Phantombuster alternatives for managing multiple LinkedIn accounts. Learn why local execution and comment-first strategies prevent account bans.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5724g6hq5zx73cvzwprj3stz98d6r0a/phantombuster-alternatives-for-safe-linkedin-autom-1788968931119-qc0wp6.png", "published_at": "2026-09-09T15:39:00+00:00", "content": "# Phantombuster Alternatives for Safe Linkedin Automation for Managing Multiple Client\n\nYou know the sinking feeling. You log into your agency\u2019s communication channel on a Tuesday morning, and a client has left a frantic message: *\u201cLinkedIn just asked for my ID, and I can\u2019t log in. What did you guys do?\u201d*\n\nIf you manage multiple LinkedIn accounts for clients, founders, or sales teams, keeping those accounts safe is your single biggest operational bottleneck. Traditional automation platforms built their reputation in an era when LinkedIn\u2019s security was lax. Tools would run complex sequences from cloud servers, firing off hundreds of connection requests and automated direct messages (DMs) a day. \n\nToday, that approach is a liability. LinkedIn has deployed sophisticated behavioral tracking, device fingerprinting, and strict velocity limits to combat inbox spam. When an agency routes ten different client accounts through a single automation platform using generic data-center proxies, they are essentially playing Russian roulette with their clients' digital reputations.\n\nAgencies and growth consultants are actively seeking safe alternatives to legacy scrapers and cloud-based automation tools. They are moving away from brute-force messaging and toward intelligent, local-execution models that prioritize public engagement over private spam. \n\nThis guide explores the inherent risks of legacy cloud automation, the technical requirements for safely managing multiple accounts, and why pivoting to an AI-assisted, comment-first strategy is the most effective way to scale client results today.\n\n## The Hidden Risks of Cloud-Based Multi-Account Management\n\nTo understand why managing multiple client accounts is so dangerous with traditional tools, you have to look at how these platforms interact with LinkedIn\u2019s servers. \n\nWhen you use a standard cloud automation platform to manage your clients, you typically export a session cookie from the client\u2019s browser and paste it into the tool\u2019s dashboard. The platform then spins up a headless browser (a browser without a graphical user interface) on a cloud server and uses that cookie to impersonate the client.\n\nFor a long time, simply masking this activity with a proxy was enough. If the client lived in New York, you bought a New York proxy IP. But LinkedIn\u2019s security apparatus has evolved far beyond simple IP checks.\n\n### Browser Fingerprinting and Correlation\n\nEvery time a browser connects to LinkedIn, it hands over a highly specific \"fingerprint.\" This includes the user-agent string, screen resolution, operating system, installed fonts, and hardware rendering data (WebGL). \n\nWhen an agency uses a cloud platform to run 20 client accounts, the platform often generates 20 very similar, synthetic browser fingerprints. Even if you use dedicated IPs and separate Chrome profiles per client to isolate activity and reduce cross-account fingerprinting\u2014a method recommended by experienced automation guides for multi-account management [phantombuster](https://phantombuster.com/blog/social-selling/manage-multiple-linkedin-accounts/)\u2014the underlying cloud infrastructure often gives you away. \n\nLinkedIn\u2019s algorithms are designed to detect when a cluster of accounts behaves identically or originates from the same block of data-center IPs. If one client account gets flagged for aggressive behavior, LinkedIn can retroactively correlate that account\u2019s fingerprint and IP subnet with your other clients. Suddenly, you have a cascading wave of account restrictions across your entire client roster.\n\n### The Problem with Concurrent Logins\n\nAnother major red flag for LinkedIn is geographic and temporal impossibility. If your client logs into their LinkedIn app on their iPhone in Chicago at 2:00 PM, and your cloud automation tool simultaneously sends a connection request from a server in Virginia at 2:01 PM, the session mismatch is instantly recorded. \n\nSome agencies try to solve this by explicitly telling clients never to log in during automation hours. But clients are human; they forget, they see a notification, and they click it. When the platform detects simultaneous activity from two vastly different environments, it invalidates the session cookie and triggers a security checkpoint.\n\n![Excalidraw diagram showing session conflict between a mobile user in Chicago and a cloud server in Virginia triggering a secu](https://assets.bevisible.app/inline-images/j5724g6hq5zx73cvzwprj3stz98d6r0a/inline-1-1788968863413-r2d59q.png)\n### Behavioral Velocity and the DM Trap\n\nThe final, and perhaps most common, reason client accounts get banned is simply the nature of the activity itself. Legacy automation tools are heavily geared toward outbound connection requests and cold DMs. \n\nLinkedIn imposes strict, albeit unpublicized, limits on connection requests (often capping around 100 per week for average users). When an agency takes over a dormant client account and immediately scales up to 30 connection requests and 50 automated DMs a day, the velocity spike triggers an automated review. If those DMs go unanswered, or worse, if recipients click \"I don't know this person,\" the account\u2019s trust score plummets.\n\n## Phantombuster Alternatives: Why Local Execution Matters\n\nThe search for safer infrastructure has led technical marketers to abandon cloud-proxy models in favor of local execution. \n\nInstead of routing your client\u2019s activity through a third-party server farm, local automation runs directly on a local machine. This fundamentally changes the security profile of the automation.\n\nJunior, for example, is designed specifically around this safety-first architecture. Unlike cloud-based connection tools, Junior runs locally on the user's machine. By operating within the local environment, the automation uses the exact same IP address, Mac address, and browser fingerprint that the client already uses naturally. There are no data-center proxies to flag and no geographic anomalies to trigger a lockdown. \n\nFor agencies managing multiple clients, this architectural shift requires a different operational workflow. Instead of holding all client sessions in one central cloud dashboard, agencies are setting up dedicated, isolated local environments (such as remote desktops or dedicated micro-PCs) for client workloads, or they are having the clients run the lightweight software on their own machines while the agency manages the strategy and targeting.\n\nThis level of isolation provides the safest possible foundation for [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## The Strategic Pivot: From Cold DMs to Strategic Commenting\n\nSecuring the infrastructure is only half the battle. To truly protect client accounts while delivering high ROI, agencies must also change *what* the automation is doing. \n\nThe traditional playbook\u2014scraping a list from Sales Navigator, loading it into an automation tool, and blasting a five-step DM sequence\u2014is suffering from severely diminishing returns. Decision-makers' inboxes are flooded with automated pitches. They ignore them, delete them, or report them as spam.\n\nInstead of fighting for attention in a crowded, hostile inbox, modern growth strategies focus on the public feed. By leaving thoughtful, context-aware comments on posts from targeted prospects or industry leaders, you place your client in front of both the post author and their entire audience. \n\n### Why Commenting Outperforms Messaging\n\n1. **Lower Friction, Higher Trust:** A cold DM is an uninvited interruption asking for someone's time. A thoughtful comment is a public contribution to a conversation the prospect started. It flatters the author and builds immediate goodwill.\n2. **Algorithmic Favorability:** LinkedIn\u2019s algorithm rewards content that generates conversation. When you comment on a prospect's post, you help their reach. In return, the algorithm is more likely to show your client's future posts to that prospect.\n3. **Compounding Visibility:** A DM is seen by one person. A high-quality comment on an active post might be seen by hundreds or thousands of secondary connections, turning a single action into a billboard for your client's expertise.\n4. **Inherent Safety:** Commenting naturally mimics human behavior. It is much harder to trigger velocity limits by leaving 15 thoughtful comments a day than it is by sending 100 connection requests.\n\nThis is the core philosophy behind Junior. As an AI-powered LinkedIn automation tool, it is explicitly designed to start authentic conversations through strategic post commenting rather than generic spam. By finding relevant discussions and drafting context-aware, human-sounding replies based on the user's unique bio and goals, it replaces the outdated cold DM model entirely.\n\nIf you are currently evaluating your stack for this shift, reviewing an [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) is a necessary first step.\n\n![Editorial workflow diagram contrasting the cold direct message approach with the public strategic commenting model.](https://assets.bevisible.app/inline-images/j5724g6hq5zx73cvzwprj3stz98d6r0a/inline-2-1788968864655-g4qzp8.png)\n## Implementing a Safe Multi-Account Architecture\n\nIf you are transitioning your agency or sales team away from legacy cloud scrapers, you need a disciplined framework for onboarding and managing client accounts. \n\nSafety is not just about the software you use; it is about the governance, pacing, and operational boundaries you set.\n\n### 1. Establish Strict Governance and Delegated Access\n\nBefore automating any client account, you must align on expectations. Implement delegated access rather than sharing passwords, enabling client-permissioned control without credential exposure [sales-mind](https://sales-mind.ai/blog/automate-linkedin-outreach-multiple-clients). \n\nYou should obtain written authorization and clearly define which actions are permitted (e.g., commenting, specific types of engagement, limits on connection requests) to protect both the agency and the client, and ensure compliance with LinkedIn terms [phantombuster](https://phantombuster.com/blog/social-selling/manage-multiple-linkedin-accounts/).\n\nCreate a strict \"Rules of Engagement\" document for your clients. This should outline:\n*   The exact hours the automation will run.\n*   The agreement that clients will not perform manual bulk actions (like accepting 50 connections at once) while the strategy is active.\n*   The approval process for the AI's contextual knowledge base (ensuring the AI understands the client's tone, offers, and hard \"no-go\" topics).\n\n### 2. Environment Isolation\n\nIf you are using a tool that requires local execution to guarantee safety, you have two primary deployment models for multiple clients:\n\n**The Client-Hosted Model:**\nThe software runs on the client's actual machine in the background. The agency provides the strategic oversight, configures the targeting parameters, refines the AI prompts, and monitors the analytics. This is the absolute safest method, as the activity originates from the exact hardware and network the client uses daily.\n\n**The Agency-Hosted Isolated Model:**\nThe agency sets up dedicated, isolated local environments (such as distinct virtual machines running on dedicated agency hardware) for each client. Each environment uses a strict, dedicated residential ISP connection matching the client's geography, and a dedicated, isolated browser profile. This setup avoids the overlapping fingerprints of cloud-based headless browsers but requires more technical overhead from the agency.\n\n### 3. The 14-Day Warm-Up Protocol\n\nYou can never take a dormant or lightly used LinkedIn account and immediately push it to maximum daily limits. You must start with conservative daily quotas and ramp up gradually based on acceptance and engagement metrics to avoid triggering LinkedIn restrictions [phantombuster](https://phantombuster.com/blog/social-selling/manage-multiple-linkedin-accounts/).\n\nA standard agency warm-up protocol for a comment-first strategy looks like this:\n\n*   **Days 1-3:** Profile optimization. No automation. The agency updates the client's headline, bio, and featured section to align with the commenting strategy. (When people read a great comment, they click the profile. The profile must be ready to convert).\n*   **Days 4-7:** Manual-speed engagement. The automation is set to engage with only 3 to 5 highly targeted posts per day. The AI drafts the comments, and the agency monitors the tone strictly to ensure the client's voice is accurately captured.\n*   **Days 8-14:** Gradual scaling. Increase daily comments by 1 or 2 per day, stopping around 15 to 20 strategic comments daily. \n*   **Day 15+:** Sustained operation. The account operates at a consistent, safe volume. The focus shifts entirely from volume to the *quality* of the interactions and the resulting inbound profile views and direct messages.\n\n### 4. Structuring the AI Prompts for Authentic Voice\n\nThe fastest way to ruin a client's reputation is to let an AI generate generic, robotic comments like \"Great post! Thanks for sharing.\" \n\nWhen transitioning to [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely), the agency's value shifts from \"managing servers\" to \"prompt engineering and strategic targeting.\"\n\nJunior excels here by allowing you to inject the user's unique bio, goals, and viewpoints. For a client who is a supply chain consultant, the AI should be configured to specifically look for posts about logistics bottlenecks and reply with nuanced observations about inventory management. The agency's role is to feed the AI the client's specific frameworks, contrarian opinions, and industry jargon so the comments are indistinguishable from the client's own thoughts.\n\n![Fourteen-day agency warm-up timeline showing progressive engagement scaling for client LinkedIn accounts.](https://assets.bevisible.app/inline-images/j5724g6hq5zx73cvzwprj3stz98d6r0a/inline-3-1788968868338-dgiaek.png)\n## Comparing Workflows: Legacy Cloud vs. Local AI Engagement\n\nTo clearly understand the operational shift, let's look at how managing a client changes when moving from a traditional tool to a modern, local-execution platform.\n\n| Feature Area | Legacy Cloud Automation (e.g., traditional scrapers) | Local AI Engagement (Junior) |\n| :--- | :--- | :--- |\n| **Execution Environment** | Shared cloud servers, data-center IPs, headless browsers. High risk of cross-account fingerprinting. | Local execution on the client's machine or dedicated local setup. Uses organic IP and actual browser. |\n| **Primary Growth Tactic** | Mass connection requests and multi-step cold DM sequences. | Public visibility through highly targeted, AI-drafted post commenting. |\n| **Account Safety Risk** | High. Frequently triggers log-outs, ID verifications, and temporary or permanent bans. | Extremely Low. Natural interaction patterns and local execution bypass standard automation triggers. |\n| **Agency Value Proposition** | Volume. Promising \"X thousand outreach messages sent per month.\" | Quality & Pipeline. Promising \"X number of strategic conversations and inbound profile views generated.\" |\n| **Client Inbox Experience** | Cluttered with annoyed replies, \"not interested\" messages, and spam warnings. | Clean. The inbox is reserved for prospects who proactively reach out after seeing a public comment. |\n\nFor a deeper dive into how this comparison plays out against specific legacy architectures, you can review analyses like [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Real-World Agency Scenario: The Pivot to Pipeline\n\nConsider the case of a B2B lead generation agency managing 15 consultant profiles. For two years, they used a popular cloud-based automation suite to scrape LinkedIn groups and send 50 connection requests a day per client. \n\nIn year one, they booked a steady stream of meetings. By year three, connection acceptance rates plummeted from 30% to 8%. Worse, LinkedIn rolled out a security update that flagged data-center proxy IPs. In a single week, four of their clients received temporary account restrictions. The clients were furious, and the agency spent a week doing damage control instead of generating leads.\n\nThe agency decided to pivot. They moved away from cloud scraping and adopted a decentralized, local-execution model using AI commenting. \n\nInstead of targeting 50 random group members a day, they targeted 15 specific industry influencers and high-value prospects per client. They configured the AI to draft insightful, contrarian replies to the prospects' posts. \n\nThe results fundamentally changed their business model:\n1.  **Zero Bans:** Because the software ran locally and mimicked human commenting speed, account restrictions dropped to zero.\n2.  **Higher Intent Leads:** Prospects started sending inbound connection requests to the clients, often referencing the intelligent comment left on their post.\n3.  **Easier Reporting:** The agency stopped reporting on \"messages sent\" (a vanity metric) and started reporting on \"inbound profile views\" and \"inbound DMs,\" which mapped directly to their clients' sales pipelines.\n\nThis is the exact trajectory outlined in the evolution of the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026). The market is moving toward quality, and the tools are adapting to protect the user.\n\n## Common Pitfalls When Managing Multiple Accounts\n\nEven with the safest tools, human error can compromise client accounts. Agencies must be vigilant against these common failure modes:\n\n**The Copy-Paste Strategy:** Agencies often try to save time by using the same targeting parameters and AI prompt instructions across multiple clients in the same industry. If three different clients start leaving eerily similar comments on the same influencer's post, the influencer will notice, and the credibility of all three clients is destroyed. Every client needs a strictly unique interaction profile.\n\n**Ignoring the Native Feed:** If an automation tool is leaving 20 brilliant comments a day, but the client never logs in to respond to the replies those comments generate, the effort is wasted. Agencies must either manage the resulting inbox traffic or aggressively train their clients to log in daily and capitalize on the conversations the automation has started.\n\n**Chasing the Wrong Influencers:** A common mistake is targeting massive \"LinkedIn Top Voices\" with millions of followers. While your client's comment might get some visibility, it will quickly be buried under hundreds of others. The best agency strategy is to target \"micro-influencers\" and specific decision-makers with 2,000 to 15,000 followers. A well-placed comment on these posts stands out and often leads directly to a conversation with the author.\n\n## Rethinking Client Growth on LinkedIn\n\nThe days of treating LinkedIn like a cheap email server are over. The platform's security algorithms are too smart, and users' tolerance for automated spam is too low. For agencies, founders, and sales teams managing multiple accounts, the risk of using legacy cloud automation to blast DMs far outweighs the shrinking rewards.\n\nThe future of LinkedIn growth belongs to those who prioritize authentic, public engagement. By utilizing tools that run locally to ensure absolute account safety, and leveraging AI to draft context-aware, human-sounding replies, professionals can bypass crowded inboxes entirely. \n\nTurning public visibility into direct interviews, pipeline, and client conversations is not just safer; it is vastly more effective. As you evaluate your stack and your agency's operating procedures, prioritize infrastructure that respects the platform's limits and a strategy that respects the prospect's time.\n\n## Frequently Asked Questions\n\n### Is it safe to manage multiple LinkedIn accounts from one computer?\nManaging multiple accounts manually from a single browser is risky because LinkedIn tracks session data and browser fingerprints. If you log in and out of different accounts rapidly from the same IP and browser, it signals unnatural behavior. Safe management requires strict environment isolation\u2014using separate, dedicated local profiles, virtual machines, or having the automation run directly on the client's own machine.\n\n### How do you safely scale LinkedIn automation for lead gen agencies?\nScaling safely requires abandoning the volume-based approach. Instead of trying to scale by sending thousands of DMs across dozens of accounts via a centralized cloud server, agencies should scale by deploying local, engagement-focused automation. Establish strict behavioral limits, use delegated access for configuration, and focus on high-value actions like intelligent commenting that mimic natural human networking.\n\n### Why do LinkedIn accounts get restricted during agency outreach?\nAccounts typically get restricted for three reasons: IP/location anomalies (the agency logs in from a cloud server while the client is active on their phone), velocity spikes (sending 50 connection requests a day on an account that usually sends two), and low reputation scores (too many people ignoring DMs or clicking \"I don't know this person\"). Shifting to a local-execution, comment-first strategy mitigates all three of these major risk factors.", "created_at": "2026-09-09T15:49:26.666310+00:00", "updated_at": "2026-09-09T15:49:26.666315+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
