    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 58, "slug": "best-ai-engagement-tools-b2b-sales-teams-linkedin-outreach", "title": "Best AI engagement tools for B2B sales teams to scale LinkedIn outreach", "excerpt": "Discover the best AI engagement tools for B2B sales teams in 2026. Compare platforms for LinkedIn outreach, comment strategy, and pipeline generation.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5776b33hg4br3dtzbhshp9kz98ajv7z/best-ai-engagement-tools-for-b2b-sales-teams-to-sc-1785421136734-hmami2.png", "published_at": "2026-07-30T14:00:00+00:00", "content": "# Best AI engagement tools for B2B sales teams to scale LinkedIn outreach\n\nB2B buyers have built a permanent resistance to automated sales cadences. Inboxes are flooded with template-driven emails, InMails are routinely ignored, and aggressive LinkedIn connection campaigns frequently result in restricted accounts or flagged domains. Selling to modern decision-makers requires meeting them where they are already active, discussing the exact problems they are publicly talking about.\n\nAI engagement tools for B2B sales teams have evolved beyond simple drip sequences. The most effective tech stack now focuses on context-aware public engagement, account intelligence, and local safety controls that protect brand reputation while generating real pipeline.\n\nThis guide breaks down the best AI engagement tools available for B2B sales teams looking to scale their LinkedIn outreach, bypass crowded inboxes, and build authentic relationships with target accounts.\n\n![Diagram comparing cold inbox outreach versus the public engagement sales flywheel](https://assets.bevisible.app/inline-images/j5776b33hg4br3dtzbhshp9kz98ajv7z/inline-1-1785421044458-fw5fc2.png)\n## The Shift from Cold Outbound to Public Engagement\n\nTraditional outbound outreach relies on sheer volume: send thousands of cold emails or connection requests, accept a 1% conversion rate, and burn through market TAM (Total Addressable Market). For high-value B2B deals, this approach creates friction and damages account perception before a representative ever speaks with a decision-maker.\n\nPublic engagement operates on a different dynamic. When a prospective VP of Sales or CTO writes a post on LinkedIn, they are explicitly inviting conversation around that specific topic. Leaving a thoughtful, value-additive comment on that post places your team directly in front of the prospect and their entire professional network.\n\n### Why Public Engagement Beats Cold DMs\n\n1. **Zero Inbox Friction**: Prospects view cold InMails as sales pitches, but they view post comments as peer interactions.\n2. **Network Multiplier**: A cold DM is seen by one person. A public comment is seen by thousands of the prospect's followers, including colleagues, peers, and industry decision-makers.\n3. **Built-in Timing Signals**: Commenting on a post written two hours ago guarantees you are engaging when the buyer is actively seated at their keyboard.\n4. **Warmed-up Outreach**: When a sales representative eventually sends a direct connection request or email after two or three meaningful public interactions, the acceptance rate increases dramatically because the prospect already recognizes their name.\n\nFor a deeper dive into modern social engagement platforms, review our guide to the [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n---\n\n## Core Categories of AI Sales Engagement Tools\n\nTo build an effective tech stack, sales leaders need to understand where different platforms fit within the revenue cycle. AI engagement tools generally fall into four core functional categories.\n\n| Category | Core Focus | Representative Tools | Primary Output |\n| :--- | :--- | :--- | :--- |\n| **Public & Comment Engagement** | Visibility, post discussions, peer relationship building | Junior, Taplio | High-value public comments, warm pipeline |\n| **Multichannel Cadence Execution** | Orchestrating email, call, and social touchpoints | Outreach, Salesloft, HubSpot | Automated follow-up sequences |\n| **Email Personalization Engines** | Dynamic copy generation for cold inbox outreach | Lemlist, Woodpecker | Tailored cold email body text |\n| **Conversation Intelligence** | Analyzing recorded buyer calls and coaching reps | Gong, Chorus (Gong) | Account insights, call feedback |\n\nSelecting the right tools requires balancing workflow efficiency with account safety and message quality.\n\n---\n\n## 1. Junior: AI-Powered Strategic Commenting for B2B Sales\n\n[Junior](https://www.heyjunior.ai/) is built specifically to turn public LinkedIn engagement into sales pipeline. Rather than blasting automated connection requests or generic cold DMs, Junior identifies high-value posts from target accounts and drafts context-aware, human-sounding comments based on your team's custom bio, value proposition, and outreach objectives.\n\n![Comparison between cloud automation server risks and Junior local browser execution safety](https://assets.bevisible.app/inline-images/j5776b33hg4br3dtzbhshp9kz98ajv7z/inline-2-1785421043178-wbxdo4.png)\n### Key Features for B2B Revenue Teams\n\n* **Local Machine Execution**: Unlike cloud-based scraper tools that run on shared IP servers, Junior runs locally inside your browser. This mirrors real human browsing patterns and eliminates the cloud-bot footprints that trigger LinkedIn security flags.\n* **Strategic Context Engine**: Junior reads the full text of a prospect's post and combines it with your rep's specific professional background to generate insightful comments that sound like a seasoned industry practitioner.\n* **Targeted Feed Filtering**: Automatically aggregates posts from designated decision-makers, strategic keywords, or niche industry topics so reps do not waste hours manually scrolling.\n* **Inbound Conversation Trigger**: By establishing a consistent, valuable presence on a target executive's posts, sales reps turn public visibility into warm direct conversations and inbound meeting requests.\n\n### Why Local Execution Matters for Security\n\nLinkedIn monitors account behavior for suspicious API usage, cloud IP addresses, and unnatural messaging speed. Traditional cloud automation platforms frequently place sales accounts at risk of temporary bans or permanent restrictions. Because Junior operates locally on the user's machine, it maintains natural interaction intervals and protects account health.\n\nFor teams evaluating safe automation options, read our detailed comparison on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) and review the [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) framework.\n\n---\n\n## 2. Outreach & Salesloft: Multichannel Sequence Orchestration\n\nFor enterprise sales organizations that require structured, multi-step sequences across phone, email, and social tasks, enterprise sales engagement platforms (SEPs) like Outreach and Salesloft remain foundational stack components.\n\n### Capabilities\n\n* **Adaptive Cadences**: AI algorithms adjust follow-up timing and channel selection based on buyer interaction signals (such as email opens or content clicks).\n* **Account-Based Routing**: Automatically assigns multi-threading tasks across account executives and business development reps (BDRs).\n* **CRM Synchronization**: Deep integration with Salesforce and HubSpot to track deal activity across complex buyer committees.\n\n### Limitations in Social Outreach\n\nWhile enterprise SEPs excel at email sequence tracking and phone queue management, their LinkedIn engagement features are typically limited to manual task reminders or basic connection requests. They lack native, contextual AI tools designed to participate in public comment discussions where prospective buyers spend their active time.\n\n---\n\n## 3. Lemlist & Woodpecker: AI Cold Email Personalization\n\nFor cold outreach centered on the inbox, tools like Lemlist and Woodpecker leverage generative AI to personalize email body copy and dynamic image assets at scale.\n\n### Capabilities\n\n* **Dynamic Copy Personalization**: AI prompts scrape prospect website content, recent news, or LinkedIn bio text to draft custom intro sentences.\n* **Warm-up Networks**: Built-in deliverability features warm up sending domains gradually to prevent landmines in spam folders.\n* **Multichannel Sequences**: Connects cold email touchpoints with basic LinkedIn profile views or connection tasks.\n\n### Limitations\n\nCold email personalization faces decreasing returns as enterprise spam filters grow stricter. Personalized email text alone often fails to break through when executives receive dozens of unsolicited messages per day. Combining email sequences with public social engagement produces significantly higher response rates.\n\n---\n\n## 4. Gong: Conversation Intelligence & Deal Context\n\nEngagement does not end when a meeting is booked. Gong uses speech recognition and natural language processing to analyze video calls, phone conversations, and email exchanges across the entire sales cycle.\n\n### Capabilities\n\n* **Deal Health Scoring**: Analyzes buyer sentiments, talk-to-listen ratios, and competitive mentions to highlight deal risks.\n* **AI Call Summaries**: Automatically extracts key action items, buyer pain points, and objections for seamless CRM logging.\n* **Sales Coaching**: Identifies top-performing talk tracks and enables sales managers to scale winning playbooks across the team.\n\n### How Conversation Intelligence Integrates with Outreach\n\nInsights captured in Gong\u2014such as specific buyer objections or software pain points\u2014can directly inform the contextual prompts used in public engagement tools like Junior. When a representative knows the top three objections in their market segment, they can train their AI commenting profiles to address those exact topics publicly on industry posts.\n\n---\n\n## Comparing Tool Capabilities for B2B LinkedIn Strategy\n\nWhen evaluating software to scale LinkedIn visibility and account relationships, sales leaders often compare post scheduling tools, cloud scraper bots, and browser-native AI engagement assistants.\n\n| Tool Type | Example Platforms | Direct Outreach Safety | AI Public Comment Quality | Primary Sales Value |\n| :--- | :--- | :--- | :--- | :--- |\n| **Browser-Native Comment Engine** | Junior | **High** (Runs locally, human patterns) | **High** (Bio & context aware) | Warm inbound leads, direct relationship opening |\n| **Content & Growth Suites** | Taplio, Supergrow | **Medium** (Cloud-focused analytics) | **Moderate** (Generic AI text) | Content creation, profile branding |\n| **Cloud Scraper / Automation** | Phantombuster, Dripify | **Low** (High ban risk on cloud IPs) | **Low** (Template spin text) | Mass connection scraping |\n\nFor a direct comparison of specialized platforms, read [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) and explore [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n---\n\n## Step-by-Step: Setting Up a Public AI Engagement Workflow\n\nTo build a predictable stream of warm sales conversations without risking account safety, sales teams can implement a four-step public engagement workflow.\n\n![Four-step workflow diagram showing how B2B sales teams convert public post comments into pipeline](https://assets.bevisible.app/inline-images/j5776b33hg4br3dtzbhshp9kz98ajv7z/inline-3-1785421036797-m1doks.png)\n### Step 1: Define Target Account Watchlists\n\nIdentify the top 50 to 200 key decision-makers in your active pipeline or target account list. Instead of adding them immediately to a cold connection queue, import their LinkedIn profiles into your engagement platform watchlist.\n\n### Step 2: Establish Unique Persona Profiles\n\nTrain your AI engagement assistant with detailed context about your sales representatives:\n* Professional title and past industry experience.\n* Core technical expertise and domain terminology.\n* Case study points and non-salesy value propositions.\n* Communication tone (e.g., analytical, consultative, concise).\n\nThis background context ensures generated comments sound like authentic observations from an experienced industry professional rather than auto-generated praise.\n\n### Step 3: Implement Strategic Daily Commenting\n\nSet aside 15 minutes each morning for sales reps to review suggested posts from target prospects. Using Junior, representatives review context-aware comment drafts, make brief custom edits if desired, and post directly through their local browser session.\n\n### Step 4: Transition Public Interest into Private Pipeline\n\nWhen a prospect replies to a representative's comment, likes their response, or visits their profile, the warm window opens. The representative follows up within 24 hours with a hyper-relevant connection request or direct message referencing the exact public discussion.\n\n```\nPublic Post Interaction -> Prospect Profile Visit -> Warm Connection Request -> Contextual Sales Conversation\n```\n\nFor a full security audit of your outreach tech stack, refer to the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n---\n\n## Critical Risk Factors in LinkedIn Automation\n\nNot all engagement software is engineered with security in mind. B2B revenue operations must carefully evaluate security protocols before deploying tools across a corporate sales team.\n\n### Risk Factor 1: Cloud-Based Scraping and Shared IPs\n\nTools that require users to input their LinkedIn session cookies into a cloud server expose account credentials to security risks. When dozens of accounts execute actions from shared datacenter IP addresses, platform security algorithms quickly flag and restrict those accounts. Sales teams seeking secure alternatives can consult [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n### Risk Factor 2: Generic AI Output and Brand Damage\n\nLeaving low-quality comments such as \"Great insights!\", \"Thanks for sharing!\", or obviously hallucinated paragraph responses damages professional reputation. Senior executives instantly recognize generic AI spam. AI engagement tools must use context-aware models that read the full post content and apply rep-specific domain knowledge.\n\n### Risk Factor 3: Over-Automated Messaging Volumes\n\nAttempting to send 100 connection requests or cold DMs per day triggers automatic platform rate limits. By contrast, engaged public commenting carries higher interaction thresholds because public discussions represent normal, healthy platform usage.\n\nCheck your toolset against the [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) to verify account safety standards.\n\n---\n\n## Real-World Scenario: Converting Social Discussions into B2B Pipeline\n\nA mid-market B2B software firm specializing in logistics management wanted to connect with Supply Chain VPs at Fortune 2000 enterprises. Cold email response rates had dropped below 0.8%, and automated connection sequences resulted in two representative account warnings.\n\nThe sales team shifted to a public-first engagement strategy using Junior:\n\n1. The team mapped out 150 active Supply Chain executives posting about warehouse automation and supply chain resilience.\n2. Reps configured Junior with context around logistics bottlenecks, enterprise ROI metrics, and practical industry terminology.\n3. Each morning, reps dropped 8-10 insightful comments on target executive posts.\n4. Within three weeks, 42% of targeted executives replied to public comments, and 28% viewed the reps' profiles.\n5. Reps transitioned those warm public interactions into private connection requests, yielding a 65% acceptance rate and generating 14 qualified pipeline opportunities in 30 days.\n\nFor strategies on identifying high-intent posts, review [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n---\n\n## Frequently Asked Questions\n\n### Can AI engagement tools replace my entire cold email stack?\n\nAI engagement tools are designed to complement, not eliminate, your existing email and phone cadences. Using public LinkedIn commenting to establish initial familiarity makes subsequent cold emails and phone calls significantly more effective.\n\n### How does local machine execution protect my sales reps' accounts?\n\nLocal machine execution runs all browser actions directly through your representative's local computer and standard IP address, utilizing normal browser session headers. This prevents LinkedIn from detecting datacenter IP proxies or third-party cloud server logins.\n\n### What is the ideal daily commenting volume for a B2B sales rep?\n\nFor optimal visibility and safety, a sales rep should aim for 10 to 20 high-quality, context-rich comments per day target executives and industry discussions. Quality and context matter far more than sheer volume.\n\n### How quickly do sales teams see pipeline results from public commenting?\n\nMost teams notice increased profile views and higher connection request acceptance within the first 7 to 10 days. Direct sales conversations and inbound discovery meetings typically begin developing within 2 to 4 weeks of consistent engagement.\n\n---\n\n## Summary: Choosing the Right Stack for Your Sales Team\n\nScaling B2B LinkedIn outreach in 2026 requires moving away from intrusive, inbox-cluttering automation toward value-driven public interaction. While enterprise tools like Outreach and Gong manage internal cadences and conversation analysis, tools like Junior provide the necessary top-of-funnel public engagement engine.\n\nBy executing context-aware comments locally on rep devices, your team can build genuine relationships with high-value prospects, safeguard corporate LinkedIn profiles, and turn public visibility into repeatable revenue pipeline.", "created_at": "2026-07-30T14:19:22.379710+00:00", "updated_at": "2026-07-30T14:19:22.379724+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
