    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 124, "slug": "ai-engagement-tools-b2b-sales-teams", "title": "How to scale B2B sales engagement with AI-powered LinkedIn comments", "excerpt": "Learn how modern B2B sales teams use AI engagement tools and signal-led LinkedIn comments to bypass crowded inboxes and convert public visibility into pipeline.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57aszbc2vy8ncmshd4a3bbh3x8f7ksq/how-to-scale-b2b-sales-engagement-with-ai-powered-1791128894295-cj9bqt.png", "published_at": "2026-10-07T15:29:00+00:00", "content": "# How to scale B2B sales engagement with AI-powered LinkedIn comments\n\nThe B2B sales engagement landscape has fundamentally shifted. If you look at the current playbook for outbound growth, nearly every strategy focuses entirely on the private inbox. Static email drip campaigns and blind cold calling have been heavily replaced by deep data enrichment and autonomous AI agents. \n\nWe now have multi-channel platforms like Amplemarket and Apollo scaling personalization across millions of contacts. We have autonomous AI SDRs like Artisan\u2019s Ava and 11x.ai\u2019s Alice handling entire email cadences and calendar bookings without human intervention. We have signal-led enrichment tools like Salesmotion and Clay scraping dozens of data providers to ensure outreach only happens when a buying signal occurs.\n\nBut this relentless focus on the inbox has created a massive blind spot for sales teams. \n\nBecause every sales team now has access to these advanced enrichment and AI writing tools, buyer inboxes are more crowded than ever. Even a highly personalized, signal-led email is competing against fifty other highly personalized, signal-led emails. \n\nTo break through the noise, modern B2B sales teams are turning to a layer of engagement that most AI tools completely ignore: public social visibility. Specifically, they are using AI to scale authentic, context-aware LinkedIn comments. This strategy bypasses the crowded inbox, builds public authority, and turns passive visibility into direct pipeline.\n\nHere is exactly how B2B sales teams, founders, and lead gen agencies are building signal-led commenting workflows, protecting their accounts, and converting public interactions into booked meetings.\n\n## The missed layer in modern B2B sales engagement\n\nModern AI engagement platforms are generally categorized into distinct layers of the sales funnel. Multi-channel outreach platforms handle the volume and deliverability. Autonomous AI SDRs handle the drafting and replying. Enrichment platforms handle the intent data and lead research. \n\nYet, nearly all of these tools culminate in the exact same action: sending a direct message or an email. \n\nDirect outreach operates on a one-to-one basis. If a prospect ignores your email, the effort is wasted. Furthermore, direct outreach forces a binary decision on the buyer: either reply and enter a sales cycle, or delete the message. In a market where buyers prefer to do their own research before speaking to a rep, forcing early binary decisions often leads to lower conversion rates.\n\n![Comparison diagram showing private inbox outreach vs public social engagement on LinkedIn.](https://assets.bevisible.app/inline-images/j57aszbc2vy8ncmshd4a3bbh3x8f7ksq/inline-1-1791128850681-voadlq.png)\nSocial engagement flips this dynamic. When a sales rep leaves a thoughtful, well-researched comment on a target account's LinkedIn post, several things happen simultaneously:\n\n1. **The target prospect sees the interaction:** You bypass the email spam filter and appear directly in their notifications.\n2. **The prospect's network sees the interaction:** Because LinkedIn's algorithm pushes active discussions into the feeds of secondary connections, your comment acts as a micro-billboard for your expertise.\n3. **The interaction is non-threatening:** A comment does not demand a meeting. It is a low-friction interaction that builds familiarity over time. \n\nThe challenge has always been scale. Manually reading dozens of posts and writing thoughtful replies takes hours\u2014time that sales reps are heavily discouraged from spending on social media. This is why sales teams historically fell back on automated direct messaging. \n\nBut with the introduction of AI models capable of deep context digestion, sales teams can now automate the research and drafting phases of social engagement. By treating LinkedIn comments as a distinct channel within the sales engagement stack, teams can warm up accounts effectively before the AI SDR ever sends that first email.\n\n## Why signal-led commenting outperforms cold DMs\n\nTo understand why commenting is becoming a primary engagement tool, we have to look at how buyers consume information on LinkedIn. \n\nWhen a decision-maker posts on LinkedIn, they are signaling two things: they are active on the platform right now, and they care enough about a specific topic to publish their thoughts on it. This is a massive intent signal.\n\nIf you send a cold connection request followed by an automated DM, you are interrupting their day with your agenda. This is the exact strategy that gets accounts restricted and annoyed buyers reaching for the \"I don't know this person\" button. If you are comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), the core difference lies in this interruption versus contribution model. DMs interrupt; comments contribute.\n\nSignal-led commenting operates on the premise that the best way to start a conversation is to join one that is already happening. \n\nWhen you leave a contextually relevant comment on a prospect's post, you trigger reciprocity. The prospect feels validated that someone read and appreciated their content. When you consistently show up in their notifications adding value, you build passive familiarity. By the time you finally send a direct message or an email, you are no longer a cold outbound rep; you are a familiar face from their network.\n\n## The core problem with legacy LinkedIn automation\n\nIf commenting is so effective, why isn't every sales team doing it? \n\nThe short answer is that early automation tools ruined the ecosystem. When the first wave of LinkedIn commenting tools hit the market, they operated on simple keyword triggers and templates. This resulted in thousands of bots posting \"Great insights! Thanks for sharing\" or \"I totally agree with this\" on highly nuanced industry posts. \n\nNot only did this fail to generate pipeline, but it actively damaged the brand reputation of the reps using them. Buyers easily spot generic automation. \n\nFurthermore, many of these early tools were cloud-based. Platforms like Phantombuster and various multi-tenant cloud scrapers log into LinkedIn from remote servers. LinkedIn's security algorithms are highly tuned to detect this. If your account suddenly logs in from an AWS data center in Virginia while you are sitting in London, LinkedIn flags the account. Repeated offenses lead to permanent bans.\n\nThis creates a dual requirement for modern AI engagement tools: they must generate hyper-contextual, human-sounding text, and they must operate within strict safety parameters. \n\nThis is where the landscape splits. Teams evaluating [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) are actively moving away from cloud-based scraping toward local, natural interaction patterns. \n\nJunior was built specifically to address these two massive failures in the market. By running locally on the user's machine, it uses the rep's actual browser session and IP address. LinkedIn sees normal, human-like activity because the software operates exactly where the human operates. \n\n![Three-step workflow diagram showing list curation, context injection, and local human approval for AI commenting.](https://assets.bevisible.app/inline-images/j57aszbc2vy8ncmshd4a3bbh3x8f7ksq/inline-2-1791128845600-zyfhhc.png)\n## Building a signal-led commenting workflow for sales teams\n\nScaling AI-powered comments requires a deliberate workflow. You cannot simply turn an AI loose on your feed and hope for the best. A successful B2B engagement strategy requires targeting, context mapping, and human oversight.\n\n### Step 1: Curating the target list\n\nThe first step in signal-led commenting is ensuring you are interacting with the right people. Scrolling the default LinkedIn feed is highly inefficient, as the algorithm prioritizes viral content and creators over your actual Total Addressable Market (TAM).\n\nInstead, sales teams should build specific lists of target accounts and decision-makers. You can use tools like LinkedIn Sales Navigator to create lead lists based on job changes, recent funding rounds, or specific industry keywords. \n\nOnce you have these lists, the goal is to monitor them for activity. You want to engage with decision-makers who have posted in the last 24 to 48 hours. When you are looking for the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio), the primary criteria should be how easily the tool allows you to filter out viral noise and focus strictly on ICP (Ideal Customer Profile) accounts.\n\n### Step 2: Injecting user context and brand voice\n\nThe fastest way to fail at AI commenting is to use a generic prompt. If the AI does not know who you are, what you sell, or what your unique perspective is, it will default to safe, corporate platitudes.\n\nModern tools require a setup phase where you feed the system your specific context. In Junior, this involves defining your bio, your goals, and your unique angles. \n\nFor example, if you sell cybersecurity software, you do not want your AI generating comments that just agree with the author. You want the AI to read a post about data breaches, analyze it through the lens of a cybersecurity expert, and draft a comment that adds a new statistic or a specific technical nuance. \n\nThe AI should act as a junior assistant that understands your worldview, reading the post and drafting a reply based on *your* designated perspective.\n\n### Step 3: Local drafting and human approval\n\nAutomation should handle the heavy lifting of reading the post and generating the draft, but the human must remain in the loop for the final send. \n\nWhen you use a tool that operates locally, the workflow becomes seamless. You open the target post, the AI reads the specific context of that discussion, and it drafts a reply right in your browser. You review the draft, tweak a word or two if necessary to match your exact tone, and hit post. \n\nThis hybrid approach ensures zero generic spam goes out under your name while reducing the time it takes to leave a thoughtful comment from five minutes to fifteen seconds. \n\n## The anatomy of a high-converting AI comment\n\nNot all comments are created equal. Even with advanced AI, if you optimize for the wrong output, you will see zero return on your engagement efforts. A high-converting comment in B2B sales must achieve three specific things: it must validate the creator, add net-new value, and invite a natural follow-up.\n\n### Validation without sycophancy\nAvoid starting comments with \"I completely agree\" or \"Great post.\" These are filler phrases that consume valuable screen space. Instead, validate the premise by expanding on it. If a prospect posts about the difficulty of hiring engineers, start your comment by acknowledging the specific pain point they mentioned.\n\n### Adding net-new value\nThis is where you train your AI tool to shine. The comment should bring something new to the table. This could be a contradictory viewpoint (handled respectfully), a supporting statistic, or an observation from your own client base. \n\n*Weak AI output:* \"Hiring engineers is definitely tough right now. Finding the right talent takes a lot of effort.\"\n*Strong AI output:* \"The drop in applicant quality you mentioned aligns exactly with what we saw last quarter. We noticed a 40% increase in applications, but interview pass rates dropped by half. Have you tried shifting to skills-based assessments pre-interview?\"\n\n### Inviting the follow-up\nThe best comments end with a soft, open-ended question. This encourages the prospect to reply to your comment, which further boosts the visibility of the post and deepens the interaction between the two of you. \n\n## Transitioning from public comment to private pipeline\n\nThe ultimate goal of AI engagement tools for B2B sales teams is not to become a LinkedIn influencer; it is to generate pipeline. Knowing when and how to transition a public interaction into a private conversation is the hardest part of the playbook.\n\nHere is a tested sequence for moving from comment to meeting:\n\n1. **The initial engagement (Day 1):** You leave a highly contextual AI-drafted comment on their post. They like it or reply to it. Do nothing else. Let the interaction breathe.\n2. **The second touch (Day 3-5):** When they post again, leave another insightful comment. By now, they recognize your name and profile picture.\n3. **The connection request (Day 7):** Send a connection request. Do not pitch. Use a blank connection request or a simple note referencing the previous discussion. Because you have already interacted publicly, your acceptance rate will typically sit between 60% and 80%.\n4. **The transition to DM (Day 10):** Once connected, monitor their activity or their company's trigger events (which your enrichment tools like Clay or Salesmotion are tracking). Send a DM that bridges the gap between your public discussions and a specific problem they might be facing.\n\nFor instance: *\"Hey [Name], really enjoyed our back-and-forth on your post about engineer retention last week. I actually put together a brief teardown of how teams are fixing that specific leak in the hiring funnel. Happy to send the link over if it\u2019s helpful\u2014no worries if not.\"*\n\nThis approach eliminates the friction of cold outbound. You are not asking for a meeting; you are offering an extension of a conversation you have already been having. \n\n## Safe execution: Why architecture matters\n\nWe cannot discuss AI engagement on LinkedIn without heavily addressing account safety. LinkedIn actively patrols for bot activity, and sales teams cannot afford to have their primary rep accounts restricted.\n\nWhen evaluating an [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), the technical architecture of the tool should be your primary concern. \n\nCloud-based automation uses headless browsers (browsers running on servers without a graphical user interface) and datacenter IP addresses. LinkedIn detects these easily. They look for mismatching geographic locations, inhuman click speeds, and hidden browser extensions.\n\nTo achieve [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), you must utilize local execution. Junior, for example, runs locally on the user's machine. It does not connect through a proxy in another country. It operates within your active LinkedIn session, mimicking exact human behavior patterns. \n\nWhen you compare [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), this architectural difference is stark. While Taplio offers broad cloud-based scheduling and CRM features, it inherently carries the risk associated with cloud automation. For sales reps where account safety and highly contextual, one-to-one conversational drafting are paramount, a localized tool provides the necessary protection and nuance.\n\n![Architecture diagram contrasting risky cloud-based automation with safe local browser execution for LinkedIn.](https://assets.bevisible.app/inline-images/j57aszbc2vy8ncmshd4a3bbh3x8f7ksq/inline-3-1791128846640-2e4qzk.png)\n## Expanding the playbook: Use cases beyond direct sales\n\nWhile B2B sales teams are the primary adopters of signal-led AI commenting, the workflow extends effectively to other roles heavily dependent on networking.\n\n### Lead Generation Agencies\nAgencies running outreach for clients face a massive deliverability problem. Email warmups take weeks, and domain reputation is fragile. By incorporating AI commenting into their multi-channel sequences, agencies can warm up target accounts for their clients organically. Providing this as a service layer\u2014managing the client's public engagement safely before sending the first cold email\u2014creates massive differentiation in a crowded agency market.\n\n### Founders and Consultants\nFor founders and independent consultants, personal brand is often the only differentiator early on. However, founders rarely have time to spend two hours a day networking on LinkedIn. By using an AI assistant to surface relevant industry discussions and draft initial thoughts, founders can maintain a highly visible, authoritative presence in their niche with just ten minutes of review time per day. \n\n### Job Seekers\nThe modern job hunt is essentially a B2B sales campaign where the product is the candidate. Cold applying is the equivalent of cold emailing. Job seekers using AI engagement tools to leave insightful comments on the posts of hiring managers, VP of Engineering, or Heads of Marketing drastically increase their chances of securing an interview. They transform from a name on a resume stack to a recognizable industry peer.\n\n## Evaluating AI engagement tools for LinkedIn\n\nIf you are mapping out your sales stack for the upcoming year, and you want to move beyond the saturated inbox, you need to evaluate commenting tools rigorously. Look for tools that pass the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\nHere are the critical criteria to measure against:\n\n*   **Contextual awareness:** Does the tool simply summarize the post, or can it inject your specific bio, goals, and unique value proposition into the draft?\n*   **Execution environment:** Is it cloud-based (high risk) or local/browser-based (low risk)?\n*   **Workflow integration:** Does it allow you to quickly cycle through a curated list of ICP posts without getting distracted by the main feed?\n*   **Tone customization:** Does it sound like a human, or does it overuse AI-isms like \"unlock,\" \"dive into,\" and \"in today's digital landscape\"?\n*   **Safety limits:** Does the tool naturally restrict volume to mimic human capabilities, or does it encourage blasting 500 comments a day?\n\nWhen looking at the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) or the [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster), remember that the goal is not maximum volume. The goal is maximum relevance at a sustainable, safe scale.\n\n## FAQs about AI engagement in B2B sales\n\n**Does LinkedIn penalize AI-generated comments?**\nLinkedIn penalizes spam and automated bot behavior (like cloud scraping and rapid-fire posting). They do not penalize the origin of the text if it is thoughtful, contextually relevant, and posted safely by a human. If an AI writes a highly valuable insight and you post it natively, LinkedIn\u2019s algorithm rewards the interaction because it keeps users on the platform. \n\n**How much time should a sales rep spend commenting per day?**\nWith AI assistance, a rep should spend no more than 15 to 20 minutes a day on social engagement. This is enough time to review, lightly edit, and post 10 to 15 highly targeted comments on ICP accounts. This consistent daily action compounds rapidly over a quarter.\n\n**Can I replace my cold email outreach with LinkedIn commenting?**\nThey are complementary, not competitive. Commenting is the top-of-funnel warm-up. It builds the visibility and reciprocity needed so that when your AI SDR (like Artisan or 11x) or your multi-channel sequence (like Amplemarket) finally sends that email, the prospect already knows who you are.\n\n**Is it safe to automate LinkedIn engagement?**\nIt is only safe if you use local, human-mimicking software. Avoid any tool that requires you to hand over your LinkedIn cookies to a third-party server. Stick to local tools that operate within your actual browser session.\n\n## The future of the B2B sales stack\n\nThe era of scaling mediocre outbound to thousands of prospects is coming to a close. Data enrichment tools have made it easy to find anyone. AI writing tools have made it easy to write to anyone. The result is a saturated inbox where even good outreach goes ignored.\n\nThe most successful B2B sales teams, reviewing the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026), recognize that attention has shifted to the public feed. By deploying AI to scale thoughtful, context-aware comments safely, they are building a predictable pipeline of warm leads who actually want to have a conversation. \n\nMoving your focus from purely private intrusion to public contribution is the most effective way to ensure your sales engagement strategy survives the AI volume trap. By leveraging tools designed specifically for safe, authentic conversation starting, you bypass the crowded inbox entirely and meet your buyers exactly where they are already spending their time.", "created_at": "2026-10-07T15:49:29.110034+00:00", "updated_at": "2026-10-07T15:49:29.110041+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
