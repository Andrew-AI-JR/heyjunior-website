    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 174, "slug": "tools-career-coaches-candidates-network-checklist", "title": "Tools for Career Coaches to Help Candidates Network Evaluation Checklist", "excerpt": "Evaluate the best networking tools for career coaches to help candidates land interviews. A complete checklist covering discovery, AI drafting, and CRM.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57f2x7hs6sd2pre2w8fdzeqqd8h5y8w/tools-for-career-coaches-to-help-candidates-networ-1795537092578-09j3xs.png", "published_at": "2026-11-27T16:15:00+00:00", "content": "# Tools for Career Coaches to Help Candidates Network Evaluation Checklist\n\nHelping candidates network is one of the highest-leverage things a career coach can do, yet it remains the area where job seekers experience the most friction, anxiety, and inertia. You can optimize a resume to perfection and run flawless mock interviews, but if your candidate is paralyzed by the prospect of reaching out to strangers, their pipeline will remain dangerously thin. \n\nThe traditional advice of \"just reach out and grab a virtual coffee\" is no longer sufficient. Today\u2019s professionals are guarding their time, and their inboxes are flooded with generic connection requests. For a candidate to break through, they need a systematic, less intimidating networking engine. This requires shifting from sheer willpower to a well-structured technology stack. \n\nHowever, throwing software at an anxious job seeker often backfires. If the tools are too complex, candidates abandon them. If the tools encourage spammy behavior, candidates damage their professional reputations. As a career coach, your job is to curate a safe, effective, and intuitive tech stack that turns public visibility into direct interviews. \n\nThis comprehensive evaluation checklist breaks down the tools career coaches need to help candidates network across four distinct stages: Targeting and Discovery, AI-Assisted Personalization, Outreach and Visibility Automation, and Relationship Tracking. \n\n## The Candidate Networking Friction Point\n\nBefore evaluating specific tools, it helps to understand why candidates fail at networking in the first place. When you assign a candidate the task of \"reaching out to five industry professionals this week,\" you are actually asking them to execute a complex series of micro-tasks:\n\n1. Identify the right companies.\n2. Find the right individuals within those companies.\n3. Overcome the psychological barrier of initiating contact (imposter syndrome).\n4. Draft a message that is compelling but not desperate.\n5. Hit send.\n6. Remember to follow up when they inevitably do not get an immediate reply.\n\nWithout tools to scaffold this process, candidates usually stall at step two or three. They spend hours scrolling LinkedIn, feeling overwhelmed by the sheer volume of profiles, and eventually close the tab. When they do manage to send a message, it is often a generic template copied from a blog post, which yields a dismal response rate, further reinforcing their belief that \"networking doesn't work for me.\"\n\nTo solve this, a modern career coaching practice must equip candidates with tools that lower the barrier to entry at each stage of the outreach lifecycle. \n\n![Diagram illustrating the 6-step candidate networking funnel and points of friction where job seekers stall.](https://assets.bevisible.app/inline-images/j57f2x7hs6sd2pre2w8fdzeqqd8h5y8w/inline-1-1795537049976-plwrx7.png)\n## Stage 1: Targeting and Discovery Tools \n\nBefore a candidate can initiate a conversation, they need to know exactly who they are trying to talk to. Discovery tools help narrow the vast ocean of professionals down to a highly targeted pond of high-probability connections.\n\n### The LinkedIn Alumni Tool\n\nThe single most underutilized free feature in the job search landscape is the LinkedIn Alumni Tool. For candidates who feel intimidated by cold outreach, shared educational background provides the strongest built-in warm connection point. \n\nAs a coach, you should not just tell candidates to use it; you need to teach them the precise mechanics. Have them navigate to their university\u2019s school page, click the \"Alumni\" tab, and begin filtering. \n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Completely free, universally applicable, high response rates due to tribal affiliation (\"We both went to X\").\n*   **Weaknesses:** Relies heavily on the candidate's university size. Candidates from smaller, non-target schools may find fewer direct matches at top-tier companies.\n*   **Coaching Implementation:** Teach candidates to search by geographic region first, then by target employer. If a candidate wants to work at Salesforce in Chicago, the Alumni tool will instantly reveal the five people who share their alma mater and currently sit in that exact office. \n\n### Apollo.io and RocketReach\n\nWhile LinkedIn is the primary hub for professional networking, relying solely on LinkedIn connection requests can be a bottleneck, especially if a candidate is dealing with weekly connection limits or low acceptance rates. Email remains a powerful channel for informational interviews, provided the candidate can find the right address.\n\nTools like Apollo.io and RocketReach allow candidates to find verified professional email addresses for decision-makers and peers at their target companies.\n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Bypasses LinkedIn\u2019s crowded inbox. Professional emails often command more immediate attention than social media notifications. \n*   **Weaknesses:** Can feel intrusive if the outreach is not highly personalized. Free tiers have strict limitations on the number of lookups. \n*   **Coaching Implementation:** Advise candidates to use these tools strategically. Email should be reserved for high-value targets\u2014such as a hiring manager or a senior director\u2014where a well-crafted, highly specific message can bypass the standard application queue. \n\n## Stage 2: AI-Assisted Personalization \n\nThe vast majority of candidate networking fails because the outreach feels like spam. Hiring managers and industry veterans can spot a copy-pasted template from a mile away. The challenge for the career coach is teaching candidates how to personalize outreach at scale without spending three hours researching a single individual. \n\n### ChatGPT and Claude for Roleplay and Drafting\n\nGenerative AI has fundamentally changed how we approach the \"blank page\" problem. However, if a candidate simply asks ChatGPT to \"write a networking email,\" the result will be verbose, overly formal, and painfully generic. The real value of AI in this stage lies in hyper-specific contextual drafting and interactive roleplay.\n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Infinite patience, immediate turnaround, completely customizable tone. \n*   **Weaknesses:** Prone to hallucination and \"AI speak\" (e.g., using words like \"delve,\" \"testament,\" or \"navigate the landscape\"). \n*   **Coaching Implementation:** Provide your candidates with strict prompt architecture. Teach them to paste their target's LinkedIn \"About\" section and recent experience into the AI, accompanied by a prompt like: \n\n*Act as an expert career coach. I want to ask this person for a 15-minute informational interview. Review their background and generate three distinct, hyper-personalized outreach angles. Each angle should be under 75 words, reference a specific detail from their background, and end with a low-friction question. Do not use overly formal language.*\n\nThis takes the heavy cognitive load off the candidate while ensuring the final message remains highly relevant to the recipient.\n\n### Whali and Specialized Outreach Assistants\n\nFor candidates who struggle to manage raw AI prompts, specialized platforms like Whali offer a more structured approach. These platforms are built specifically for professional outreach, searching professional profiles, and using AI to write networking emails that reference shared backgrounds or specific interests.\n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Reduces the need for prompt engineering. Built-in guardrails prevent the AI from generating inappropriate or overly aggressive copy. \n*   **Weaknesses:** Adds another subscription cost to the candidate's tech stack. \n*   **Coaching Implementation:** Use specialized tools for candidates targeting highly competitive fields (like investment banking or management consulting) where outreach volume needs to be slightly higher, but personalization cannot be sacrificed.\n\n![Visual comparison between generic AI outreach prompts and a structured coaching prompt framework.](https://assets.bevisible.app/inline-images/j57f2x7hs6sd2pre2w8fdzeqqd8h5y8w/inline-2-1795537049597-swknpw.png)\n## Stage 3: Outreach and Visibility Automation \n\nThis is the most critical and delicate stage of the candidate networking tech stack. For years, the default method for scaling networking was to use cloud-based automation tools to blast hundreds of generic connection requests and cold Direct Messages (DMs). \n\nThis approach is now actively harmful. \n\nFirst, LinkedIn\u2019s spam filters have become remarkably aggressive. Candidates using poorly configured cloud automation risk having their accounts permanently restricted\u2014a catastrophic event in the middle of a job search. Second, decision-makers are exhausted by automated \"pitch-slapping\" and generic coffee requests. \n\nThe modern approach to visibility automation relies on organic interaction, specifically through strategic post commenting. When a candidate leaves an insightful, relevant comment on an industry leader's post, they are essentially bypassing the crowded inbox and networking in public. The target sees the comment, views the candidate's profile, and the relationship begins authentically.\n\n### Junior: The Authentic Alternative to Spam\n\nWhen evaluating tools for visibility, career coaches should strongly consider platforms designed around conversation rather than broadcasting. Junior is an AI-powered LinkedIn automation tool specifically built to start authentic conversations through strategic post commenting. \n\nFor job seekers, it replaces the dreaded cold DM by automatically finding relevant industry discussions and drafting context-aware, human-sounding replies based on the candidate's unique bio, skills, and goals. \n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Focuses entirely on inbound visibility and relationship building. Instead of sending 50 ignored DMs, a candidate can leave 15 highly contextual comments on posts by hiring managers and recruiters. \n*   **Safety:** Unlike traditional cloud-based connection tools that trigger LinkedIn's security algorithms, Junior runs locally on the user's machine. This mirrors natural human interaction patterns, keeping the candidate's account safe from restrictions. \n*   **Authenticity:** It drafts replies based on the user's distinct professional background, avoiding the generic \"Great post!\" comments that plague LinkedIn.\n\nIf your candidates are currently attempting to use outdated automation, you should review [Dripify Alternatives Focused On Commenting Instead of Dms Evaluation Checklist](https://www.heyjunior.ai/blog/dripify-alternatives-commenting-evaluation-checklist) to understand why the shift toward public visibility yields higher response rates for job seekers. \n\n### Local vs. Cloud Execution\n\nAccount safety must be the primary criterion when recommending automation. A candidate cannot afford a temporary ban during peak interview season. Many legacy tools run in the cloud, utilizing different IP addresses that flag the account as compromised.\n\nTeaching candidates to use tools that run locally ensures their digital footprint looks exactly like a human sitting at their computer. For a deeper understanding of this technical necessity, reference the [Phantombuster Alternatives That Run Locally Evaluation Checklist](https://www.heyjunior.ai/blog/phantombuster-alternatives-run-locally-checklist). \n\n### The Cost of Visibility\n\nJob seekers are often highly sensitive to software costs, especially if they have been out of work for an extended period. When evaluating AI commenting tools, coaches must balance feature depth against monthly subscriptions. \n\nMany enterprise-grade visibility tools cost upwards of $100 per month, which is difficult to justify for a candidate. Directing them toward [Cheaper Alternatives to Taplio for AI Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/cheaper-alternatives-taplio-ai-commenting) helps them build a powerful visibility engine without depleting their savings. For coaches wanting a direct feature comparison to present to candidates, the [Junior Vs Taplio for Linkedin Commenting Source Page for Job Seekers, Sales Teams, Le](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-commenting) provides a clear breakdown of why locally-run, bio-trained commenting outshines generic engagement pods.\n\n![Diagram contrasting risky cloud-based mass DMs with safe, local AI post commenting for candidate visibility.](https://assets.bevisible.app/inline-images/j57f2x7hs6sd2pre2w8fdzeqqd8h5y8w/inline-3-1795537048796-sa204a.png)\n## Stage 4: Relationship Tracking and CRM\n\nNetworking is not a discrete event; it is a lifecycle. A candidate might have a fantastic informational interview with a product manager in October, but if they fail to follow up when a role opens in January, the initial effort is wasted. \n\nThe human brain is terrible at remembering to follow up with loose ties. Candidates need a Customer Relationship Management (CRM) system, but traditional sales CRMs like Salesforce or HubSpot are vastly overcomplicated for a job search. \n\n### Teal and Specialized Job Trackers\n\nTeal has emerged as a premier tool for candidates managing the holistic job search process, combining a resume builder with a built-in job tracker and contact manager.\n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Highly visual, designed specifically for the candidate experience, includes built-in templates for follow-up. \n*   **Weaknesses:** Less flexible for candidates executing highly complex, multi-tiered networking strategies across multiple industries simultaneously.\n*   **Coaching Implementation:** This is ideal for candidates who need a centralized hub. The chrome extension allows them to bookmark jobs and automatically link the contacts they are networking with at those specific companies.\n\n### Notion for Custom Networking Pipelines\n\nFor candidates who think systematically and prefer a customized environment, Notion is an incredibly powerful tool. As a coach, you can build a proprietary Notion template and distribute it to your clients.\n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Infinitely customizable. You can build Kanban boards that track contacts from \"Identified\" to \"Contacted\" to \"Interview Complete\" to \"Nurture.\"\n*   **Weaknesses:** The blank canvas can be paralyzing. Candidates will spend more time designing the perfect database than actually talking to people if left unchecked.\n*   **Coaching Implementation:** Never give a candidate a blank Notion page. Provide a pre-built template with required fields: Contact Name, Company, Date of Last Interaction, Notes, and a strict \"Next Action Date.\"\n\n### Streak CRM for Gmail\n\nMany networking conversations eventually move off LinkedIn and into email. Streak is a lightweight CRM that lives directly inside a user's Gmail inbox. \n\n**Evaluation for Candidate Use:**\n*   **Strengths:** Zero context switching. Candidates do not have to open a separate application to log their networking activity; it happens right where they send the emails. \n*   **Weaknesses:** Only works for candidates who conduct the majority of their outreach via Gmail. \n*   **Coaching Implementation:** Set up a simple visual pipeline for the candidate inside Streak. Show them how to use the \"Snooze\" feature to automatically bring an email back to the top of their inbox if a target hasn't replied in five days. \n\n## The Evaluation Checklist: How to Choose Tools for Your Practice\n\nWhen you are assessing whether to add a new networking tool to your coaching curriculum, do not just look at the marketing page. Run the software through this strict evaluation framework to ensure it will actually help, rather than hinder, your candidates.\n\n### 1. The Safety and Reputation Rubric\n*   **Does the tool respect platform terms of service?** (Look for local execution over cloud-based hacking).\n*   **Does the tool prevent spam?** (If a tool allows a candidate to send 500 identical messages with one click, do not recommend it. It will damage their professional brand).\n*   **Is the AI context-aware?** (Does the tool read the target's profile before drafting, or does it just insert `[First Name]` into a static template?)\n\n### 2. The Friction and Adoption Rubric\n*   **Time to first value:** Can the candidate get a meaningful result (a drafted message, a discovered email, a posted comment) within 15 minutes of signing up?\n*   **Cognitive load:** Does the tool require the candidate to learn complex boolean logic or advanced prompt engineering? \n*   **Integration:** Does this tool play nicely with the rest of their workflow, or does it require them to export and import CSV files manually?\n\n### 3. The Economic Rubric\n*   **Cost-to-Value Ratio:** Job seekers are effectively running a business with zero revenue. Every dollar matters. Ensure the tool has a generous free tier or a low monthly cost.\n*   **Commitment limits:** Avoid tools that require annual contracts. The goal is for the candidate to get a job and cancel the software within three to six months. \n\n## A Case Study in Tech-Enabled Candidate Networking\n\nConsider the common scenario of a candidate transitioning industries. Let\u2019s look at Sarah, a former high school teacher attempting to break into corporate instructional design at mid-sized SaaS companies. \n\n**The Old Way (High Friction, Low Yield):**\nSarah searches \"Instructional Designer SaaS\" on LinkedIn. She finds 400 people. She feels overwhelmed. She randomly clicks on five profiles, clicks \"Connect,\" and sends the default LinkedIn message. Two accept, but neither replies to her follow-up. She decides networking is a waste of time and returns to blindly submitting resumes on Indeed.\n\n**The Tech-Enabled Way (Low Friction, High Yield):**\nSarah\u2019s coach implements a defined tech stack. \n\n1.  **Discovery:** Sarah uses the LinkedIn Alumni tool to find instructional designers who also graduated from her state university. She finds 12 perfect matches. \n2.  **Visibility:** Instead of immediately asking for a favor, Sarah uses Junior running locally on her machine. Over two weeks, Junior helps her leave thoughtful, bio-relevant comments on the posts of these 12 targets, as well as several hiring managers at her target companies. She becomes a familiar, insightful face in their notifications.\n3.  **Personalization:** When a hiring manager posts about a new onboarding challenge, Sarah uses a structured AI prompt to draft a hyper-specific Direct Message referencing her recent comment on their post and offering a brief perspective from her teaching background. \n4.  **CRM:** She logs this outreach in her Notion tracker and sets a reminder to follow up in one week. \n\nBecause Sarah shifted from cold, automated DMs to tech-assisted organic visibility, the hiring manager recognizes her name, accepts the connection, and agrees to a brief chat. The technology did not replace the human connection; it cleared away the administrative debris so the human connection could actually happen.\n\n## Common Pitfalls When Implementing Tech for Candidates\n\nEven with the best tools, career coaches must watch out for predictable failure modes when candidates adopt networking technology. \n\n### Over-Automation and the \"Set It and Forget It\" Trap\nCandidates often want a silver bullet. When they discover automation, their instinct is to crank the volume to maximum, hoping that sending 1,000 messages will mathematically guarantee a job. You must enforce the concept that networking is about precision, not volume. Tools like Junior are effective precisely because they scale *authenticity* via public comments, not because they allow for infinite spam.\n\n### Ignoring Profile Optimization\nNo amount of brilliant outreach or automated commenting will save a terrible LinkedIn profile. If a candidate uses these tools to drive traffic to a profile that lacks a clear headline, features an unprofessional photo, or has a sparse \"About\" section, the conversion rate from profile view to conversation will be zero. Always ensure the foundation is solid before turning on the visibility engine.\n\n### Neglecting the Offline Transition\nThe goal of networking tools is to get off the tools. The software exists solely to secure a phone call, a video meeting, or an in-person coffee. Candidates sometimes get addicted to the digital interaction, racking up comments and connections but never making the \"ask\" for a real conversation. Coaches must provide clear scripts for how to transition a warm digital interaction into a calendar invite.\n\n![Four-week progressive implementation roadmap for introducing networking tools to career coaching clients.](https://assets.bevisible.app/inline-images/j57f2x7hs6sd2pre2w8fdzeqqd8h5y8w/inline-4-1795537052659-b0qtkp.png)\n## Structuring a 4-Week Networking Tech Rollout\n\nTo prevent overwhelm, introduce the networking tech stack to your candidates progressively. Do not hand them four different software subscriptions on day one. \n\n**Week 1: Foundation and Discovery**\n*   Focus purely on target identification.\n*   Introduce the LinkedIn Alumni Tool and basic boolean searches.\n*   Have the candidate build a list of 30 high-priority targets. \n*   Set up their CRM (Teal or Notion) and input the initial targets. \n\n**Week 2: Visibility and Passive Engagement**\n*   Introduce the concept of public networking.\n*   Install and configure Junior for local, safe AI commenting. \n*   Goal: Leave 5 to 10 context-aware comments per day on the posts of their target list and industry leaders. Focus on becoming a recognized name in the ecosystem. \n\n**Week 3: AI-Assisted Direct Outreach**\n*   Begin transitioning warm visibility into direct contact.\n*   Teach the candidate how to use AI (ChatGPT/Claude) to draft personalized connection requests or emails for the targets they have been actively engaging with.\n*   Introduce email discovery (Apollo/RocketReach) for targets who are not active on LinkedIn.\n\n**Week 4: Pipeline Management and Nurture**\n*   Focus on the CRM.\n*   Teach follow-up cadences. Show the candidate how to use AI to draft polite, non-pushy follow-up messages for targets who have gone dark.\n*   Shift the candidate into a sustainable daily routine (e.g., 15 minutes of commenting, 10 minutes of direct outreach, 5 minutes of CRM updating).\n\n## Frequently Asked Questions\n\n### How do I convince a reluctant candidate to use networking tools?\nFocus on the concept of leverage. Reluctant candidates usually hate networking because it feels inefficient and emotionally draining. Show them that these tools are designed to remove the \"blank page\" anxiety. Frame the tools not as \"networking software\" but as \"research and drafting assistants\" that do the heavy lifting before the human steps in.\n\n### Are LinkedIn automation tools safe for job seekers?\nThe safety of automation entirely depends on the architecture of the tool. Cloud-based tools that bypass LinkedIn's interface and blast hundreds of connection requests are highly unsafe and frequently lead to account restrictions. Tools that run locally on the user's machine and focus on natural engagement patterns (like commenting rather than bulk DMs) are significantly safer. For a detailed breakdown of this security distinction, coaches should review the [Engage AI Vs Junior Which Is Safer Source Page for Job Seekers, Sales Teams, Lead Gen](https://www.heyjunior.ai/blog/engage-ai-vs-junior-which-is-safer) to understand how to protect candidate accounts.\n\n### Should candidates pay for premium networking tools?\nGenerally, candidates should minimize subscription fatigue. However, investing $30 to $50 a month in a tool that actively generates interviews is often more cost-effective than remaining unemployed for an extra month. Advise candidates to utilize free tiers for discovery and CRM, and consolidate their budget into a single high-quality visibility and outreach tool. \n\n### How much time should a candidate spend on these tools daily?\nThe technology should decrease the time spent on administration. A well-trained candidate with a dialed-in tech stack should spend no more than 30 to 45 minutes a day managing their network. This includes letting an AI tool help draft comments, sending a few personalized messages, and updating their CRM.\n\nBy equipping your candidates with a curated, safe, and highly effective networking tech stack, you transition them from anxious job seekers to empowered professionals. They stop waiting for a recruiter to pull their resume out of an ATS black hole, and start actively building relationships that lead directly to the hidden job market.", "created_at": "2026-11-27T16:19:23.169104+00:00", "updated_at": "2026-11-27T16:19:23.169109+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {

            const encodedTitle = encodeURIComponent(title);

                },
                {
                    name: 'X',

                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
