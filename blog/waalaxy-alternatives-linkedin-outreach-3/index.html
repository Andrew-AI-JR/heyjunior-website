    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 87, "slug": "waalaxy-alternatives-linkedin-outreach-3", "title": "Waalaxy Alternatives for Waalaxy Alternatives for Linkedin Outreach", "excerpt": "Looking for Waalaxy alternatives? Compare top LinkedIn automation tools, explore safety risks, and discover AI engagement strategies that drive warm inbound.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57ckzrb22pggqs6232b1b99kh8d658k/waalaxy-alternatives-for-waalaxy-alternatives-for-1788022130969-039v4u.png", "published_at": "2026-08-29T16:44:00+00:00", "content": "# Waalaxy Alternatives for Waalaxy Alternatives for Linkedin Outreach\n\nIf you are deep in the research rabbit hole, searching for the definitive guide to Waalaxy alternatives for LinkedIn outreach, you have likely realized one frustrating truth about the automation market in 2026: most tools are just slightly repackaged versions of the exact same cold DM engine. \n\nFor years, Waalaxy (and its predecessor, ProspectIn) dominated the entry-level LinkedIn automation space. It promised a simple, visually appealing way to send hundreds of connection requests and automated follow-ups. But as LinkedIn tightened its algorithms, capped connection requests to roughly 100 per week, and users grew increasingly blind to generic \"Hi {first_name}, I saw we work in the same industry\" messages, the foundational model of cloud-based cold messaging began to crack.\n\nToday, job seekers, sales teams, lead generation agencies, and founders are abandoning standard automated messaging. They aren't just looking for a tool with a different logo; they are looking for a fundamentally different way to generate pipeline and interviews. \n\nThis comprehensive guide breaks down the current landscape of LinkedIn outreach. We will explore the top traditional direct messaging tools that serve as direct replacements for Waalaxy, and more importantly, we will dive into the massive paradigm shift toward AI-powered strategic commenting\u2014a method that bypasses the crowded inbox entirely.\n\n## Why Are Teams Looking for Waalaxy Alternatives?\n\nTo understand what makes a good alternative, we first have to understand why users are migrating away from Waalaxy and similar cloud-based connection tools. The exodus usually comes down to three distinct failure modes: deliverability, account safety, and the psychological fatigue of cold outreach.\n\n### 1. The Death of the LinkedIn Inbox\nThe modern LinkedIn inbox is a hostile environment for genuine connection. Decision-makers, recruiters, and founders are bombarded daily by automated pitches. Even if your Waalaxy sequence successfully bypasses LinkedIn's spam filters, it lands in an inbox where the recipient's default behavior is to hit \"Ignore.\" Context collapse is the primary enemy here; an automated message cannot possibly read the room, understand the prospect's current mood, or reference a nuanced thought they shared that morning.\n\n### 2. Cloud-Based Safety Concerns\nWaalaxy operates primarily as a cloud-based tool (often utilizing a browser extension to trigger cloud actions). LinkedIn's security infrastructure has evolved dramatically. When a platform detects activity originating from known data center IP addresses (like AWS or Google Cloud), or notices inhumanly perfect clicking patterns happening in the background, it flags the account. Many users seek alternatives simply because they have received their first or second warning from LinkedIn and cannot afford to lose their digital identity.\n\n### 3. The Need for Multi-Threading\nUsers often outgrow Waalaxy's linear sequences. Advanced outbound teams realize that LinkedIn alone isn't enough; they need tools that can dynamically shift between LinkedIn engagement, email follow-ups, and phone touchpoints based on real-time behavior.\n\n![Whiteboard diagram comparing private cold DMs with strategic public commenting on LinkedIn](https://assets.bevisible.app/inline-images/j57ckzrb22pggqs6232b1b99kh8d658k/inline-1-1788022072972-7kpcrn.png)\n## The Paradigm Shift: Replacing Cold DMs with Strategic Engagement\n\nBefore we list the traditional messaging tools, we need to address the elephant in the room. If cold DMs are yielding diminishing returns, what is the alternative?\n\nThe answer is public visibility through strategic engagement. \n\nInstead of sending 100 private messages that get ignored, modern professionals are leaving 20 highly relevant, context-aware comments on the posts of their target prospects or industry leaders. A thoughtful comment doesn't just reach the author; it is viewed by their entire network. This turns a 1-to-1 interaction into a 1-to-many broadcast.\n\n### Enter Junior: The Anti-Spam Engagement Engine\nFor teams tired of burning their reputation on cold outreach, [Junior](https://www.heyjunior.ai/) represents the most significant departure from the Waalaxy model. Junior is an AI-powered LinkedIn automation tool designed specifically to start authentic conversations through strategic post commenting, rather than generic spam.\n\nHere is how the engagement-first model differs from traditional outreach:\n\n*   **Context over Cadence:** Instead of relying on a multi-step drip campaign, Junior finds relevant discussions in your niche and drafts context-aware, human-sounding replies based on your unique bio and business goals.\n*   **Local Execution:** Unlike Waalaxy's cloud infrastructure, Junior runs locally on the user's machine. It uses your actual IP address and natural interaction patterns, effectively neutralizing the risk of account bans associated with cloud scraping.\n*   **Inbound Pipeline:** By consistently adding value in the comment section, you trigger the rule of reciprocity. Prospects view your profile and send *you* connection requests, turning cold outbound into warm inbound.\n\nIf you are a consultant trying to build a client base without appearing desperate in the DMs, the difference is night and day. You can read more about this strategic shift in our breakdown of [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Top Traditional Waalaxy Alternatives (The \"Better DM\" Approach)\n\nIf you are committed to the cold messaging approach but simply want a more robust, safer, or more affordable tool than Waalaxy, the market offers several mature options. These platforms generally fall into two categories: high-end agency tools focused on dynamic personalization, and budget-friendly standalone CRM tools.\n\n### 1. Expandi\nExpandi is widely considered the premium standard for traditional LinkedIn automation. It was built specifically to address the safety concerns that plague cheaper tools.\n\n*   **Core Strengths:** Expandi utilizes dedicated, country-based IP addresses for every user, making it much harder for LinkedIn to flag the activity as automated. It also features \"smart limits\" that randomize delay times between actions to mimic human behavior.\n*   **Dynamic Personalization:** Where Expandi truly shines is in its dynamic workflows. You can build complex, logic-based sequences (e.g., \"If they liked my post, send message A; if they viewed my profile, send message B\"). It also integrates seamlessly with hyper-personalization tools to send customized images and GIFs in the DMs.\n*   **Best For:** Lead generation agencies and high-ticket B2B sales teams managing multiple accounts.\n*   **Trade-offs:** It is significantly more expensive than Waalaxy, and the interface can be overwhelming for a solo founder or job seeker who just wants a quick setup.\n\n### 2. LinkedHelper (LinkedIn Helper)\nLinkedHelper is the veteran of the space. While its earlier iterations operated as a risky Chrome extension, it has since evolved into a standalone, locally installed application with its own dedicated browser environment.\n\n*   **Core Strengths:** Because LinkedHelper is a standalone app that runs locally on your machine, it is incredibly safe. It mimics actual mouse clicks and typing, operating exactly like a human sitting at a desk. It offers some of the most granular scraping and data extraction features on the market.\n*   **Flexibility:** You can build almost any automation flow imaginable, from endorsing skills to scraping entire company hierarchies. \n*   **Best For:** Power users, technical founders, and data-driven marketers who want absolute control over every micro-interaction and data point.\n*   **Trade-offs:** The learning curve is steep. The UI looks like database software from 2012, and because it runs locally, you must keep your computer on and awake for the automation to run (unless you set up a dedicated remote server).\n\n### 3. Octopus CRM\nOctopus CRM is the polar opposite of LinkedHelper. It is designed to be as simple, visual, and affordable as possible, making it a very direct 1-to-1 replacement for users who liked Waalaxy's ease of use but want a different pricing model.\n\n*   **Core Strengths:** Octopus breaks LinkedIn outreach into a simple, visual funnel: Connect -> Message -> Endorse -> View Profile. You push leads from LinkedIn search directly into your Octopus dashboard and process them in bulk.\n*   **Cost-Effective:** It is one of the most affordable tools on the market, making it highly accessible.\n*   **Best For:** Solo entrepreneurs, small sales teams, and beginners who need a straightforward replacement without a massive financial commitment.\n*   **Trade-offs:** It lacks the deep conditional logic of Expandi. It is also a Chrome extension, which carries slightly more risk than local standalone apps if you push the volume limits too hard.\n\n### 4. Dux-Soup\nDux-Soup is another legacy player that has maintained a massive user base by focusing on lightweight, browser-based automation. \n\n*   **Core Strengths:** Dux-Soup excels at profile visiting and lead tagging. It acts as a lightweight CRM overlaid directly on top of the LinkedIn UI. It is incredibly easy to set up and integrates smoothly with tools like Hubspot and Pipedrive.\n*   **Browser Integration:** It runs within your standard Chrome browser, allowing you to manually intervene in conversations without switching platforms.\n*   **Best For:** SDRs and recruiters who want a tool to handle the repetitive clicking while they focus on the actual conversation management.\n*   **Trade-offs:** It can be resource-heavy on your browser, and it requires strict adherence to daily limits to avoid LinkedIn's detection algorithms.\n\n### 5. Meet Alfred\nMeet Alfred aims to bridge the gap between LinkedIn automation and multi-channel outreach.\n\n*   **Core Strengths:** Alfred allows you to build sequences that cross boundaries. A prospect might receive a LinkedIn connection request, followed by an email, followed by a Twitter (X) engagement. \n*   **Built-in CRM:** It offers a robust internal CRM that helps track the status of relationships across all these channels.\n*   **Best For:** Teams that have strong email enrichment processes and want to attack target accounts from multiple angles simultaneously.\n*   **Trade-offs:** Historically, users have reported occasional bugs with the platform's syncing capabilities, and managing multi-channel sequences requires highly accurate data enrichment to ensure you aren't emailing the wrong person while messaging them on LinkedIn.\n\n![Feature comparison card grid of traditional Waalaxy alternatives](https://assets.bevisible.app/inline-images/j57ckzrb22pggqs6232b1b99kh8d658k/inline-2-1788022077072-3n92zk.png)\n## Feature Matrix: How the Contenders Compare\n\nTo make the decision easier, here is a high-level comparison of how these tools stack up against each other across key critical dimensions.\n\n| Platform | Primary Approach | Execution Environment | Best Feature | Complexity |\n| :--- | :--- | :--- | :--- | :--- |\n| **Waalaxy** | Cold DMs & Email | Cloud / Extension | Visual sequence builder | Low |\n| **Junior** | AI Commenting | Local Machine | Context-aware AI drafting | Low |\n| **Expandi** | Cold DMs & Email | Cloud (Dedicated IP) | Smart randomized delays | High |\n| **LinkedHelper** | Deep Automation | Local Standalone App | Unmatched flexibility | Very High |\n| **Octopus CRM** | Cold DMs | Chrome Extension | Simplicity and price | Low |\n| **Meet Alfred** | Multi-channel | Cloud | Cross-platform sequences | Medium |\n\nIf you are currently evaluating your tech stack and want a rigorous framework for making this decision, we recommend utilizing an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) to ensure you aren't sacrificing security for convenience.\n\n## Assessing Risk: Cloud-Based vs. Local Automation\n\nOne of the most overlooked aspects of choosing a Waalaxy alternative is understanding *how* the tool interacts with LinkedIn's servers. The technical architecture of your chosen tool dictates your risk level.\n\n### The Cloud Problem\nCloud-based tools (like Waalaxy, Meet Alfred, and standard Expandi configurations) log into your LinkedIn account from a remote server. Even if they use a dedicated proxy to match your country, LinkedIn's security algorithms look at browser fingerprinting, canvas hashing, and packet latency. If your account is suddenly active 24/7 from a data center IP, while you are also periodically logging in from your mobile phone on a residential IP, it creates an unnatural footprint. \n\nLinkedIn issues warnings, forces logouts, and temporarily restricts accounts that display these disjointed footprints.\n\n### The Local Solution\nTools that execute locally fundamentally solve this problem. Applications like LinkedHelper (for deep data scraping and DMs) and Junior (for AI-driven commenting and engagement) run directly on your own computer. \n\nWhen Junior or LinkedHelper interacts with LinkedIn, it uses your actual residential or office Wi-Fi. It uses your actual hardware footprint. To LinkedIn's servers, the automation looks indistinguishable from you sitting at your desk, clicking through your feed. \n\nFor a deeper dive into the technical mechanics of protecting your digital identity, review our guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n![Technical diagram comparing cloud-based proxies versus local execution for LinkedIn account safety](https://assets.bevisible.app/inline-images/j57ckzrb22pggqs6232b1b99kh8d658k/inline-3-1788022073548-ivtr9g.png)\n## Building a Modern LinkedIn Outreach Tech Stack\n\nAs outreach evolves in 2026, the most successful teams are no longer looking for a single \"all-in-one\" silver bullet. Instead, they are building modular tech stacks that combine specialized tools. \n\n### Step 1: Data Enrichment (The Foundation)\nBefore you can engage, you need accurate data. Tools like Snov.io, Skrapp, or Apollo are essential for building targeted lists and finding verified email addresses. Relying purely on LinkedIn Sales Navigator searches often results in bloated, inaccurate lists. You use these tools to define your Total Addressable Market (TAM).\n\n### Step 2: The Engagement Layer (The Warm-Up)\nInstead of immediately dumping that list into a cold DM sequence, modern playbooks insert an engagement layer. This is where tools like Junior shine. You feed your target list into the platform, and the AI systematically finds posts by these prospects, dropping thoughtful, relevant comments over a two-week period. \n\nBecause Junior leverages your specific bio and goals, the comments don't sound like AI. They sound like a colleague adding to the conversation. (For more on the distinction between basic AI and advanced context mapping, see our review of the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow)).\n\n### Step 3: The Conversion Layer (The Ask)\nOnce a prospect has seen your name in their notifications three times via insightful comments, the dynamic changes. Now, when you finally send a direct message (or when they inevitably send one to you), it isn't cold outreach. It is a warm conversation between two professionals who are already interacting. \n\nFor the final DM push, you can use a lightweight CRM like Octopus, or better yet, handle it manually since the volume required to book a meeting has dropped drastically due to the pre-warming phase. \n\n## Strategic Nuance: Avoiding the \"Automation Trap\"\n\nThe biggest mistake teams make when transitioning away from Waalaxy is bringing their bad habits to a new platform. Changing the software does not fix a broken strategy. \n\nIf your message is \"Hi {first_name}, our agency helps companies like {company_name} achieve 3x ROI, do you have 15 minutes?\", it will fail on Expandi just as spectacularly as it failed on Waalaxy.\n\n### The Failure of Context\nAutomation fails when it lacks context. Human beings are excellent at detecting patterns. We know what a templated message looks like, even if the variables are populated correctly. \n\n### The Success of Relevance\nIf you insist on using a cold DM alternative, you must segment your lists hyper-specifically. Build a list of 50 people who all attended a specific virtual summit last week. Your automated message should reference that summit directly. The more narrow the list, the more relevant the automated copy can be.\n\nIf you switch to an engagement-first model with Junior, the context is baked into the interaction. You are responding directly to a thought the prospect just shared with the world. You are validating their ideas in public, which naturally disarms their sales defenses.\n\n## Why Job Seekers and Solo Founders Need a Different Approach\n\nEnterprise sales teams can afford to burn through leads. If a massive software company annoys 1,000 prospects with a poorly targeted DM campaign, they just buy another list of 10,000. \n\nJob seekers, solo consultants, and boutique founders do not have that luxury. Your Total Addressable Market might only be 200 specific hiring managers or VP-level decision-makers. You cannot afford to end up in their blocked list.\n\nFor this demographic, traditional Waalaxy alternatives are often the wrong choice entirely. You do not need to send 100 messages a day; you need to have three highly meaningful conversations a week. \n\nThis is why tools that facilitate discovery and genuine interaction are dominating the boutique space. For a deeper understanding of how these discovery tools operate, explore our breakdown of the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) and our head-to-head comparison in [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n## Frequently Asked Questions\n\n### What is the safest LinkedIn automation tool?\nThe safest tools are those that execute actions locally on your machine rather than from a cloud server, and those that prioritize low-volume, high-quality interactions. LinkedHelper is highly regarded for safe local DM automation, while Junior is the premier safe option for local, AI-driven commenting and engagement. \n\n### Can you get banned for using Waalaxy?\nYes. Using any third-party automation tool violates LinkedIn's Terms of Service. While tools build in safeguards, aggressively pushing connection request limits (exceeding 100 per week) or using cloud-based IPs increases your risk of temporary restrictions or permanent bans. \n\n### How many LinkedIn messages can you send per day?\nWhile it varies based on your account's \"warmth\" and whether you have a premium subscription like Sales Navigator, a safe baseline for 2026 is no more than 20-30 new connection requests per day (staying under ~100 per week), and 30-50 direct messages to existing connections. Pushing beyond these limits reliably triggers algorithmic flags.\n\n### Is cold messaging dead on LinkedIn?\nCold messaging is not entirely dead, but the conversion rate has plummeted. It requires significantly better copywriting, highly targeted micro-lists, and multi-channel reinforcement to succeed today. For most users, shifting effort from cold DMs to public commenting yields a much higher return on time invested.\n\n## Making the Final Decision\n\nChoosing between Waalaxy alternatives ultimately comes down to acknowledging what is broken in your current process. \n\nIf your deliverability is fine, your copy is highly converting, and you simply need a tool that handles complex logic better than Waalaxy, an enterprise platform like Expandi is the logical next step.\n\nIf you are tired of paying high monthly fees for a clunky interface and just want a straightforward way to process lists, Octopus CRM provides a budget-friendly landing spot. \n\nHowever, if you are realizing that the entire methodology of cold, automated direct messaging is yielding diminishing returns\u2014if you are tired of being ignored and want to actually build pipeline, authority, and relationships\u2014it is time to step out of the inbox. \n\nBy leveraging tools like Junior to automate the discovery and drafting of highly contextual comments, you stop interrupting your prospects and start participating in their world. You bypass the spam filters, protect your account through local execution, and turn your visibility into direct interviews and client conversations. To see how this fits into the broader ecosystem of the year, check out our roundup of the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).", "created_at": "2026-08-29T16:49:25.252929+00:00", "updated_at": "2026-08-29T16:49:25.252934+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
