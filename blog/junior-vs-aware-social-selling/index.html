    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 145, "slug": "junior-vs-aware-social-selling", "title": "Junior vs Aware: Choosing the right approach for social selling", "excerpt": "Compare Junior AI vs Aware for LinkedIn social selling. Discover differences in account safety, local vs cloud execution, CRM sync, and comment quality.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57c8q4xrax8cwang0t2e2xwx58h2ma0/junior-vs-aware-choosing-the-right-approach-for-so-1793119717673-z3zwv1.png", "published_at": "2026-10-28T16:13:00+00:00", "content": "# Junior vs Aware: Choosing the right approach for social selling\n\nThe era of the cold LinkedIn direct message is effectively over. Buyers, founders, and hiring managers are experiencing unprecedented inbox fatigue, routinely ignoring connection requests that carry even a hint of an automated pitch. If your primary strategy for generating pipeline or landing interviews involves blasting out hundreds of identical DMs, you are likely burning your total addressable market and risking account restrictions.\n\nThe modern battleground for attention has shifted from the private inbox to the public feed. Engaging in the comment sections of industry leaders, prospects, and peers is now the most reliable way to bypass inbox blindness. Strategic commenting turns public visibility into inbound profile views, which organically convert into direct interviews, pipeline, and client conversations. \n\nBut executing this at scale introduces a massive operational bottleneck. Manually finding the right posts, reading them, and crafting thoughtful, nuanced replies takes hours every day. To solve this, the market has split into distinct approaches: hiring entry-level staff to manage the workload, or adopting specialized B2B software like Aware or Junior AI.\n\nWhen evaluating your options for social selling workflows, the decision fundamentally comes down to how you balance execution speed, account safety, and conversational authenticity. \n\n![Diagram comparing cold DM outreach failure rates with public comment engagement converting to inbound pipeline.](https://assets.bevisible.app/inline-images/j57c8q4xrax8cwang0t2e2xwx58h2ma0/inline-1-1793119664309-bkdgkl.png)\n## The Core Dilemma: Automation, Delegation, or Augmentation\n\nBefore comparing specific software platforms, it helps to understand why executives and sales leaders often struggle with social selling execution. The initial instinct for many growing teams is to simply delegate social media management to an entry-level employee. \n\nThere is a long-standing misconception that leaving comments and managing a LinkedIn presence is an easy task suited for junior staff. However, [social media isn't a \"junior role\"](https://www.linkedin.com/posts/beth-finlay-86b0ba175_nope-social-media-isnt-a-junior-role-activity-7419443791620706304-6IMx) that anyone can execute flawlessly. Crafting a comment that actually drives a B2B buyer to click your profile requires a deep understanding of industry nuance, brand voice, and strategic positioning. \n\nWhen an entry-level SDR or virtual assistant manages a founder\u2019s or senior executive\u2019s account, the engagement often falls flat. The comments lack the hard-earned perspective that peers expect, resulting in generic agreements like \"Great points, completely agree!\" which add zero value to the conversation and fail to generate inbound interest.\n\nRecognizing that manual delegation often fails to capture the necessary brand voice, teams turn to software. This is where the choice between Aware and Junior AI becomes critical. Both tools are designed to accelerate social selling, but their underlying philosophies, technical infrastructures, and execution models are vastly different.\n\n## What is Aware? (The B2B Engagement Accelerator)\n\nAware is a software platform explicitly designed for B2B sales teams who need to increase their volume of LinkedIn engagement rapidly. Positioned as a next-generation growth tool, it focuses on building custom lists of prospects and engaging with them through rapid-fire commenting workflows.\n\nAccording to [user feedback on G2](https://www.g2.com/products/aware-b2b-aware/reviews), Aware is heavily optimized for speed and administrative tracking. It pulls prospect activity into a centralized feed, allowing sales reps to quickly fire off comments one after another without having to navigate through the native LinkedIn interface.\n\n### The Strengths of Aware\n\n1. **CRM Synchronization:** Aware\u2019s biggest selling point for enterprise teams is its bidirectional sync with CRMs like HubSpot and Salesforce. When an SDR leaves a comment on a prospect's post, that activity is logged natively in the CRM. This solves a major administrative headache for sales managers who want to track social selling as a measurable KPI.\n2. **Intent Signals:** The platform cross-references prospect activity against competitors and influencers, surfacing high-priority posts that warrant engagement. This helps reps focus their time on accounts showing active intent.\n3. **Rapid-Fire Workflows:** By consolidating a custom list of posts into a single interface, Aware significantly cuts down the time it takes to leave 50 or 100 comments a day.\n\n### The Risks and Limitations of Aware\n\nWhile speed and tracking are valuable, they introduce unique risks in a social selling environment that prioritizes authenticity. \n\nWhen a tool encourages \"rapid-fire\" engagement, the quality of the comments naturally degrades. A sales rep blitzing through 50 posts in 15 minutes is unlikely to leave thoughtful, context-rich insights. They are more likely to rely on repetitive phrases or lean too heavily on basic AI generation, resulting in a robotic tone. \n\nFurthermore, cloud-based tools that interface aggressively with LinkedIn data often trigger the platform's security algorithms. LinkedIn is notoriously hostile toward tools that manipulate the feed or act as a middleman for engagement, leading to potential account flags if the volume of activity looks unnatural.\n\n![Architectural diagram showing cloud-based social selling workflow and potential account detection signals.](https://assets.bevisible.app/inline-images/j57c8q4xrax8cwang0t2e2xwx58h2ma0/inline-2-1793119665609-4qzsmb.png)\n## What is Junior AI? (The Context-Aware Local Assistant)\n\nJunior AI takes a fundamentally different approach to social selling. Rather than focusing on rapid-fire volume and CRM data logging, Junior is designed to start authentic conversations through strategic post commenting. It serves job seekers, sales teams, agencies, and founders by finding relevant discussions and drafting context-aware, human-sounding replies based on the user's unique bio and goals.\n\nThe core philosophy of Junior AI is that a single, highly insightful comment on a viral industry post is worth more than 100 generic comments on random prospect feeds. \n\n### The Strengths of Junior AI\n\n1. **Hyper-Personalized Context:** Unlike basic AI generators that simply summarize the original post, Junior AI is trained on your specific professional background, goals, and tone. If you are a cybersecurity consultant, Junior crafts replies that inject cybersecurity framing into the discussion. The output sounds like *you*, leveraging your unique expertise.\n2. **Local Execution for Maximum Safety:** Traditional automation tools operate in the cloud, pinging LinkedIn\u2019s servers from data centers. LinkedIn easily detects these abnormal IP addresses and flags the accounts. Junior AI, however, runs locally on the user's machine. It uses natural interaction patterns from your actual IP address, drastically reducing the risk of account bans. \n3. **Bypassing the Inbox:** By generating high-quality replies on public posts, Junior AI focuses on building inbound curiosity. When you drop a brilliant insight on a thought leader's post, their audience clicks your profile. This turns public visibility directly into pipeline.\n\n### The Limitations of Junior AI\n\nBecause Junior AI prioritizes safety and authenticity, it is not built for the \"spray-and-pray\" user. If your goal is to leave 500 comments a day using a fully hands-off, automated background script, Junior is not the right tool. It requires a human-in-the-loop approach, asking you to review and approve the context-aware drafts to ensure they perfectly match your intent before posting. It also does not natively function as a heavyweight enterprise CRM, focusing instead on the execution of the engagement itself.\n\n## Direct Comparison: Architecture, Safety, and Workflow\n\nTo make an informed decision between these two approaches, we have to look past the marketing copy and examine how these tools actually function in your day-to-day workflow. \n\n### Account Security and Infrastructure\n\nThe most critical factor in choosing a LinkedIn automation tool is whether it will get your account permanently banned. LinkedIn's engineering team aggressively targets third-party automation, rolling out routine updates designed to catch bots.\n\n**Aware** operates as a centralized platform, which often involves cloud-based processing or extensive browser extensions that manipulate the DOM (Document Object Model) of the LinkedIn page to inject custom UI elements. While convenient, these methods leave a recognizable footprint. If you are aggressively using a centralized tool to scrape prospect data and inject comments, you run the risk of triggering an automated security restriction. \n\n**Junior AI** mitigates this by running locally. All actions originate from your actual computer, using your standard IP address and browser session. It mimics human reading times, scrolling behavior, and typing delays. If you want a deep dive into the technical mechanisms of local vs. cloud safety, reviewing the [How Does Junior Protect My Linkedin Account](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account) source page for job seekers and sales teams provides clarity on exactly why local architecture is superior for long-term account health.\n\n### Engagement Depth vs. Engagement Breadth\n\nThe structural difference between the two tools dictates your overall strategy. \n\nAware pushes you toward **Engagement Breadth**. The goal is to touch as many accounts as possible. The UI encourages you to move quickly down a list. This is highly effective if your primary goal is just to stay top-of-mind with a massive list of tier-3 accounts, where simply seeing your name pop up in their notifications is the desired outcome. \n\nJunior AI pushes you toward **Engagement Depth**. It assumes that your target audience will actually read the comment you leave. If a prospect reads a generic AI comment, they instantly lose trust in you. Junior AI reads the nuances of the post, references your unique bio, and drafts a reply that adds a contrary viewpoint, a supporting data point, or a thoughtful follow-up question. This depth is what actually drives a prospect to click your profile and initiate a direct message. \n\n### Workflow Breakdown\n\n| Feature / Capability | Aware Workflow | Junior AI Workflow |\n| :--- | :--- | :--- |\n| **Primary Goal** | High-volume, rapid-fire engagement tracking. | Authentic, context-rich conversation starting. |\n| **Execution Environment** | Cloud-assisted / Centralized dashboard. | Local machine / Native interaction patterns. |\n| **Content Generation** | Basic text generation and custom lists. | Bio-trained, context-aware personalized drafting. |\n| **CRM Logging** | Native sync with Salesforce and HubSpot. | Focuses on generating the inbound message first. |\n| **Safety Profile** | Moderate risk due to centralized API/DOM footprints. | Extremely low risk due to local execution architecture. |\n| **Target User** | SDR managers tracking activity metrics. | Founders, job seekers, agencies, and high-value sales. |\n\n![Comparison graph showing Aware focused on volume and Junior AI positioned for high context and account safety.](https://assets.bevisible.app/inline-images/j57c8q4xrax8cwang0t2e2xwx58h2ma0/inline-3-1793119666068-2q8xhj.png)\n## A Tale of Two Reps: The Reality of Implementation\n\nTo illustrate how these structural differences play out in the real world, consider the scenario of a mid-market SaaS sales team trying to penetrate the financial services sector. \n\nMarcus and Sarah are both senior account executives. They both recognize that their cold DMs are being ignored by Chief Financial Officers (CFOs), so they pivot to social selling via commenting. \n\nMarcus adopts a rapid-fire B2B tool. He builds a list of 200 target CFOs. Every morning, his tool surfaces 40 new posts from this list. Marcus spends 15 minutes clicking through, dropping variations of \"Great insight, thanks for sharing!\" and \"Completely agree with this approach to Q3 budgeting.\" His CRM dashboard looks incredible. His manager praises his high activity metrics. However, after three months, Marcus has generated zero inbound meetings. The CFOs saw his comments, recognized the low effort, and ignored him.\n\nSarah takes a different approach using Junior AI. She focuses on just 30 high-value CFOs and 10 major financial thought leaders. When she opens her feed, Junior AI identifies a complex post from a target CFO discussing the friction of migrating legacy accounting data. Instead of a generic reply, Junior AI references Sarah's bio (which highlights her expertise in seamless data migration protocols) and drafts a nuanced comment: *\"The legacy data drag is real. When we ran an analysis on Q2 migrations, we found that parallel testing actually reduced that specific friction by 40%. Have you looked into isolating the ledger data first?\"* \n\nSarah reviews the draft, tweaks one word to match her personal slang, and posts it. It takes her slightly longer per post than Marcus, but the depth of the comment catches the CFO's attention. The CFO replies to the comment, clicks Sarah's profile, and sends a connection request asking for more information on the parallel testing stat. Sarah bypassed the crowded inbox entirely and generated a warm pipeline opportunity. \n\nThis scenario highlights the core truth of modern social selling: **Metrics do not equal momentum.** Tracking 50 generic comments in a CRM is useless if those comments do not initiate actual conversations.\n\n## Addressing the \"Junior Employee\" Misconception\n\nAs mentioned earlier, many organizations attempt to solve the social selling problem by hiring entry-level staff\u2014often referred to as a \"junior\"\u2014to manage the engagement workflow manually. It is crucial to distinguish between relying on a junior employee and utilizing a tool like Junior AI. \n\nWhen you hand your LinkedIn credentials to a junior employee, you face several immediate challenges:\n*   **Knowledge Gaps:** An entry-level employee simply does not possess the decade of industry experience required to debate the nuances of your niche with other senior leaders. \n*   **Tone Matching:** It takes months of training for a human to perfectly capture a founder's or executive's specific voice, cadence, and communication style.\n*   **Turnover Friction:** If the employee leaves, you lose all the institutional knowledge they built around managing your account. \n\nReplacing this manual, error-prone human workflow with Junior AI allows the executive to maintain complete control over the strategic output while offloading the heavy lifting of drafting. Junior AI has perfect recall of your bio, understands the exact guardrails of your brand voice, and never suffers from writer's block. It bridges the gap between executive-level insight and software-level scale.\n\n## Navigating Cost and Resource Allocation\n\nWhen evaluating the total cost of ownership for social selling tools, you must factor in both the subscription price and the time required to manage the software. \n\nAware is priced as a B2B SaaS tool, typically catering to larger teams that require CRM integrations and manager-level dashboards. The cost scales with the number of seats and the depth of the data integration required. For enterprise teams that absolutely mandate Salesforce syncing for every social interaction, this cost is easily justified.\n\nJunior AI operates on a model more suited for individual power users, founders, and specialized agency teams. Because it runs locally and focuses purely on generating the highest quality contextual replies, it avoids the massive overhead of maintaining centralized data-sync infrastructure. If you are comparing options and want to understand how this impacts the bottom line, reviewing the [Junior AI Pricing and Subscription Plans](https://www.heyjunior.ai/blog/junior-ai-pricing-and-subscription-plans) source page provides a clear breakdown of how the tool scales for different user types, from job seekers trying to land interviews to lead gen agencies managing multiple client profiles.\n\n## 3 Social Selling Mistakes Neither Tool Can Fix\n\nRegardless of whether you choose the rapid-fire workflows of Aware or the context-aware local intelligence of Junior AI, software cannot fix a fundamentally broken social strategy. To get the most out of your chosen tool, you must avoid these three critical failures:\n\n### 1. Engaging with the Wrong Tier of Creators\nMany users automate comments on posts from massive influencers (creators with 500k+ followers) hoping to capture algorithmic visibility. While leaving a great comment early on a viral post can drive profile views, these followers are rarely your target B2B buyers. Your engagement strategy must focus on niche industry leaders and actual prospects who have smaller, highly concentrated followings of decision-makers. \n\n### 2. Missing a Clear Point of View (POV)\nIf your LinkedIn profile bio is generic, your automated drafts will be generic. Junior AI excels because it uses your unique bio to frame its replies. If your profile simply says \"Experienced Sales Professional,\" the AI has nothing to work with. If your profile says, \"I help mid-market logistics companies reduce fleet maintenance costs using predictive analytics,\" the AI can inject that specific expertise into every comment it drafts. A strong POV is the fuel for effective AI generation.\n\n### 3. Failing to Transition from Public to Private\nThe goal of social selling via commenting is not just to be known as a prolific commenter. The goal is to move the relationship from the public feed to a private conversation. When a prospect replies to your insightful comment, or views your profile after reading it, that is your trigger to send a highly contextual, personalized direct message. If you do not have a system for capitalizing on the inbound attention your tool generates, you are leaving pipeline on the table.\n\n## The Verdict: Which Approach Fits Your Strategy?\n\nChoosing between Aware and Junior AI requires an honest assessment of your organizational maturity and your primary bottleneck. \n\nIf you are running a massive SDR team, require strict CRM logging for every social interaction, and prioritize broad coverage over deep relationship-building, Aware provides the infrastructure to manage that velocity. It is a tool built for administrative oversight and rapid execution. \n\nHowever, if your priority is **account safety** and **conversational authenticity**, Junior AI is the superior approach. \n\nFor job seekers trying to catch a hiring manager's eye, founders building personal brands, or sales professionals targeting high-value enterprise accounts, a generic comment is worse than no comment at all. Junior AI ensures that every piece of engagement you leave adds genuine value to the discussion, sounds remarkably human, and keeps your LinkedIn account entirely safe through its local-execution architecture. \n\nIf you are ready to stop blasting cold DMs into the void and start building real pipeline through strategic visibility, check to see if [Junior AI is safe to use on LinkedIn](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin) for your specific use case. The tools you use dictate the quality of the conversations you start\u2014choose the one that makes you sound like an industry leader, not a rapid-fire bot. \n\n## Frequently Asked Questions\n\n### Which tool is safer for my LinkedIn account?\nBecause it runs locally on your machine and uses your actual IP address and natural interaction patterns, Junior AI carries a significantly lower risk of triggering LinkedIn's security algorithms compared to cloud-based tools or aggressive browser extensions that manipulate the platform's code. \n\n### Can software completely replace my need to read LinkedIn posts?\nNo. Even with highly advanced context-aware tools like Junior AI, a human-in-the-loop workflow is essential. The AI is designed to do the heavy lifting of drafting a nuanced, bio-specific response, but you should always review the comment to ensure it perfectly aligns with your intent and the tone of the original post before hitting send. \n\n### Does commenting actually impact the LinkedIn algorithm?\nYes. LinkedIn\u2019s algorithm heavily favors posts that generate meaningful conversations. When you leave a substantive comment (rather than a generic \"Great post\"), the algorithm is more likely to feature your comment at the top of the discussion, granting you maximum visibility to everyone else who views that post. This is why depth of engagement always outperforms sheer volume.", "created_at": "2026-10-28T16:19:22.342274+00:00", "updated_at": "2026-10-28T16:19:22.342283+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
