    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 97, "slug": "best-ways-sales-reps-automate-linkedin-comments", "title": "Best Ways for Sales Reps to Automate Linkedin Comments Tools Beyond Engage AI", "excerpt": "Discover the best ways for sales reps to automate LinkedIn comments safely. Compare modern persona-driven AI tools beyond Engage AI to build real pipeline.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575kpg1kdesne9k6ydwq11vds8d6zmp/best-ways-for-sales-reps-to-automate-linkedin-comm-1788886320408-m1xi9q.png", "published_at": "2026-09-08T16:44:00+00:00", "content": "# Best Ways for Sales Reps to Automate Linkedin Comments Tools Beyond Engage AI\n\nCold messaging on LinkedIn is suffering from diminishing returns. As decision-makers' inboxes overflow with automated connection requests and generic pitches, sales teams are realizing that public engagement is the new cold outreach. Leaving thoughtful, context-aware comments on a prospect\u2019s posts bypasses the crowded inbox, builds familiarity, and turns public visibility into direct pipeline. \n\nThe problem is scale. Reading dozens of posts daily and crafting unique, insightful replies takes hours that most sales reps do not have. [Automating LinkedIn comments is a valuable skill for marketers and salespeople looking to efficiently engage prospects](https://www.bardeen.ai/answers/how-to-automate-linkedin-comments), but the early iterations of automation left much to be desired. \n\nFor a long time, tools like Engage AI dominated this space. But the landscape has shifted. [Generic auto-comment tools (Engage AI, Taplio's quick comments) are fast but produce low-quality output](https://www.simular.ai/use-cases/linkedin-auto-comment) that prospects can spot instantly. A comment that reads, \"Great insights on B2B sales, thanks for sharing!\" does nothing to build authority. Worse, deploying cloud-based automation tools risks account restrictions.\n\nIf you want to [automate Linkedin comments safely](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) while maintaining the authenticity required to book meetings, you need a different approach. This guide breaks down the best ways for sales reps to automate LinkedIn comments, evaluates the top tools beyond Engage AI, and provides a playbook for turning comment automation into a reliable revenue channel.\n\n## The Flaws of Legacy Comment Automation\n\nBefore exploring the best solutions, it helps to understand why the first generation of AI commenting tools fails modern sales teams. \n\nWhen sales reps first discovered they could use AI to generate comments, the standard workflow was simple: install a browser extension, click a button, and let the AI summarize the post. Tools like Engage AI gained popularity because they removed the friction of typing. \n\nHowever, this approach introduced three critical failure modes:\n\n1. **The \"Parrot\" Effect:** Early AI tools simply rephrased the original post. If a prospect posted about the challenges of Q4 forecasting, the AI would generate: \"I agree, Q4 forecasting is definitely a challenge. Thanks for sharing these tips!\" This adds zero value to the conversation and signals to the prospect that a bot is doing the heavy lifting.\n2. **Lack of Persona Alignment:** A successful sales rep comments from a place of expertise. Generic AI tools do not know your background, your company's value proposition, or your specific campaign goals. They write like generic cheerleaders, not industry peers.\n3. **Account Safety Risks:** Many legacy automation tools operate in the cloud, routing your LinkedIn activity through data center IPs. LinkedIn\u2019s security algorithms flag this behavior rapidly. \n\nTo succeed today, [automation tools should mimic human behavior to keep outreach safe and natural](https://www.joinvalley.co/blog/linkedin-message-automation-ai-personalization). That means shifting away from high-volume, generic spam and moving toward highly contextual, locally executed AI drafting.\n## Best Ways to Automate LinkedIn Comments in 2026\n\nThe market for LinkedIn engagement has matured. Today's sales reps have several technical approaches to choose from. Here is a breakdown of the best ways to automate your commenting workflow, moving from legacy methods to state-of-the-art solutions.\n\n### 1. Locally Executed, Persona-Trained AI (The Junior Way)\n\nThe most effective way to automate comments without sacrificing authenticity or account safety is to use a locally executed AI tool trained on your specific professional identity. \n\nThis is the category where Junior excels. Unlike cloud-based connection tools or simple text expanders, Junior is designed specifically to start authentic conversations through strategic post commenting. \n\n**How it works for sales reps:**\n*   **Local Execution:** Junior runs locally on your machine. All activity originates from your actual IP address and hardware footprint, making it indistinguishable from human browsing. This is the cornerstone of [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n*   **Deep Context & Persona:** Instead of just summarizing a post, Junior drafts replies based on your unique bio, your company's solutions, and your specific outreach goals. It contextualizes the prospect's post against your expertise.\n*   **Human-Sounding Cadence:** The AI is tuned to write like a professional colleague\u2014using natural interaction patterns rather than overly enthusiastic, emoji-laden bot speak.\n\nFor sales teams looking for the [best AI tools for Linkedin commenting tools beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) or Engage AI, a localized, persona-driven approach offers the highest return on investment. It allows you to review and publish hyper-relevant comments in seconds, effectively turning your feed into a high-converting lead list.\n\n### 2. Browser Extensions with Static Prompting (Engage AI)\n\nWe must acknowledge Engage AI, as it remains a common entry point for many reps. These tools operate as browser overlays. When you view a post, you select a tone (e.g., \"Insightful,\" \"Funny,\" \"Disagree\"), and the extension prompts an LLM to generate a reply.\n\n**The Reality for Sales:**\nWhile fast, this method requires constant manual prompting and editing to avoid sounding robotic. Because the tool lacks deep, persistent knowledge of your specific sales goals or value proposition, the output remains superficial. It is better than typing from scratch if you suffer from writer's block, but it is not a complete automation system for building pipeline. \n\n### 3. Content Schedulers with Engagement Add-ons (Taplio)\n\nMany founders and sales leaders use tools like Taplio to schedule their own content. Over time, these platforms have added basic engagement features, allowing users to leave quick AI-generated comments on posts within their network.\n\n**The Reality for Sales:**\nThese platforms are content-first, engagement-second. The commenting features are often bulk-action oriented, which increases the risk of sounding generic. If your primary goal is inbound lead generation through outbound commenting, comparing [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) reveals that dedicated commenting tools provide vastly superior conversational depth.\n\n### 4. Custom Workflow Builders (Bardeen & Simular)\n\nFor highly technical sales ops teams, custom workflow builders offer a way to stitch together LinkedIn scraping and AI generation. Using tools like Bardeen or Simular, you can create a workflow that scrapes a specific prospect's recent posts, sends the text to OpenAI via API, and drafts a comment in a Google Sheet for your review.\n\n**The Reality for Sales:**\nThis method offers immense flexibility but comes with a steep learning curve and high maintenance. When LinkedIn updates its UI, custom scrapers frequently break. Furthermore, moving data out of LinkedIn and injecting comments back via API can trigger security flags. While fascinating for operations managers, frontline sales reps usually find custom workflows too fragile for daily use.\n\n### 5. Multi-Channel Outreach Platforms with Light Engagement \n\nPlatforms like HeyReach, Valley, and Dripify are traditionally built for cold DMs and email sequencing. Recently, they have added \"auto-comment\" steps to their sequences. [Beyond automation tools, you can use networking card software to add people from offline events to your automation pool right away](https://www.heyreach.io/blog/best-linkedin-automation-tools), feeding them into these large-scale sequences.\n\n**The Reality for Sales:**\nThese tools view commenting merely as a warm-up step before a cold DM. The comments are usually pre-written (\"Great post!\") or use very basic AI. If you are trying to move away from cold messaging entirely, this approach misses the point. When evaluating [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), the distinction is clear: one relies on inbox volume, the other relies on public authority.\n\n![Architectural diagram illustrating five different technical approaches to LinkedIn comment automation for sales reps.](https://assets.bevisible.app/inline-images/j575kpg1kdesne9k6ydwq11vds8d6zmp/inline-2-1788886092864-mrc5ce.png)\n## Core Capabilities of a Winning Comment Automation Tool\n\nIf you are building your tech stack and reviewing an [AI tools for Linkedin commenting evaluation checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), you must look beyond basic text generation. The best tools differentiate themselves across three specific axes:\n\n### 1. Account Safety and Infrastructure\nLinkedIn actively patrols for unauthorized automation. Cloud-based tools that log in on your behalf from distinct IP addresses run a high risk of getting your account temporarily or permanently restricted. \n*   **The Fix:** Demand local execution. The tool must operate entirely within your local browser environment, matching your hardware fingerprint and IP address. (This is a core reason sales teams seek [Phantombuster alternatives for automate Linkedin comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely)).\n\n### 2. Contextual Nuance and Memory\nA good tool doesn't just read the post; it reads *you*. It needs to know your company, your role, the specific target audience you are speaking to, and the outcome you want (e.g., booking a demo vs. simply networking). \n*   **The Fix:** Look for tools that allow you to build a persistent \"persona\" or \"bio.\" The AI should reference this background data every time it drafts a comment, ensuring consistency in your voice.\n\n### 3. Smart Targeting Capabilities\nWriting a great comment is useless if you leave it on the wrong post. [Instead of spending hours each week writing manual comments, you can automate](https://www.joinvalley.co/blog/automate-linkedin-comments-strategies) the drafting process, but you still need a mechanism to surface high-value conversations.\n*   **The Fix:** The best platforms help you filter the noise. They should allow you to target specific lists of decision-makers, track competitors' posts to engage their audience, and monitor specific industry keywords. Finding the right conversation is just as critical as having the right [best tools to find relevant Linkedin posts to comment on tools beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### Feature Comparison Matrix\n\n| Feature | Junior | Engage AI | Taplio | Custom Builders (Bardeen) |\n| :--- | :--- | :--- | :--- | :--- |\n| **Execution Environment** | Local (Maximum Safety) | Browser Extension | Cloud-based | Cloud/Hybrid |\n| **Persona-Trained Drafting** | Yes (Deep integration) | No (Static prompts) | Basic (Brand voice) | Yes (Requires custom prompt engineering) |\n| **Primary Use Case** | Sales conversations & Pipeline | Quick engagement | Content scheduling | Ops/Data flow |\n| **Learning Curve** | Low | Low | Medium | High |\n\n## The \"Comment to Pipeline\" Playbook\n\nKnowing which tool to use is only half the battle. The other half is execution. You cannot simply turn on an AI commenter and expect your calendar to fill with meetings. \n\nHere is a step-by-step playbook for sales reps to automate their LinkedIn comments effectively and turn engagement into revenue.\n\n### Phase 1: Curate Your Engagement Universe\nYour AI tool can only comment on what you feed it. If your LinkedIn feed is full of motivational quotes and irrelevant viral videos, your comments will not reach decision-makers.\n\n1.  **Clean your feed:** Unfollow connections who post irrelevant content. \n2.  **Build a target list:** Identify 50-100 high-value prospects. Navigate to their profiles and ring the \"bell\" icon to ensure you are notified when they post.\n3.  **Identify industry aggregators:** Find the top 10 influencers or consultants in your niche. Their comment sections are watering holes for your target prospects. Engaging early on their posts guarantees visibility.\n\n### Phase 2: Configure Your AI Persona\nIf you are using a sophisticated tool like Junior, spend time dialing in your persona. \n*   **Who you are:** \"I am an enterprise account executive specializing in supply chain logistics software.\"\n*   **Your goal:** \"My goal is to position myself as a helpful consultant, highlighting operational inefficiencies without sounding salesy.\"\n*   **Your tone:** \"Professional, concise, slightly analytical. Never use words like 'game-changer' or 'disruptive.'\"\n\nThe tighter your persona configuration, the less editing you will need to do during your daily workflow.\n\n### Phase 3: The Daily Automation Routine (The 15-Minute Sprint)\nInstead of dedicating two hours to social selling, compress it into a highly focused 15-minute daily sprint.\n\n1.  **Open your prioritized feed:** Use your tool's targeting features to pull up posts from your defined lists.\n2.  **Trigger the AI draft:** Let your local tool read the post and generate a context-aware response based on your persona.\n3.  **The Human-in-the-Loop Review:** This is non-negotiable. Read the generated draft. Does it sound like you? Does it add value to the prospect's original thought? Tweak a few words if necessary.\n4.  **Publish:** Hit send and move to the next post.\n\nBy using this hybrid approach\u2014AI for the heavy lifting of drafting, and human judgment for the final polish\u2014you can leave 20-30 high-quality, thought-provoking comments in the time it used to take to write three.\n\n### Phase 4: Harvesting the Signals\nPublic commenting works because it creates inbound curiosity. When you consistently leave intelligent comments on a prospect's posts, two things happen:\n*   They view your profile.\n*   They send you a connection request.\n\nWhen a prospect views your profile after you have commented on their post, that is your trigger to act. *Now* you send the direct message. Because you have already established familiarity publicly, your DM is no longer cold. It is a warm continuation of a conversation you already started.\n\n![Flowchart showing the 4-phase Comment to Pipeline sales playbook from curation to warm direct messages.](https://assets.bevisible.app/inline-images/j575kpg1kdesne9k6ydwq11vds8d6zmp/inline-3-1788886134031-e2b1y8.png)\n## Failure Modes and Edge Cases to Avoid\n\nEven with the [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) offers, automation requires vigilance. Here are the common traps sales reps fall into and how to avoid them.\n\n### Commenting on Sensitive Posts\nAI tools analyze text, but they sometimes struggle with deep emotional subtext. If a prospect posts about a company layoff, a personal tragedy, or a controversial political opinion, an AI might misinterpret the tone and generate a cheerfully tone-deaf response. \n\n**The Solution:** Always read the first two lines of the post before hitting the generate button. If the topic is highly sensitive, bypass the automation entirely and leave a brief, genuinely human note\u2014or skip commenting altogether.\n\n### The \"Echo Chamber\" Reply\nA common failure of poorly prompted AI is simply agreeing with everything the author says. \"I completely agree, John. Data silos are indeed the biggest threat to productivity!\" \nWhile harmless, this does not build authority. \n\n**The Solution:** Configure your automation tool to introduce a \"yes, and...\" or a \"respectful pivot.\" The AI should be prompted to agree with the premise, but introduce a new angle or a brief example from your own experience. \n\n### Ignoring the Existing Conversation\nIf a prospect's post already has 40 comments, and your AI generates a comment that repeats a point someone else just made, you look unobservant.\n\n**The Solution:** Advanced tools are getting better at analyzing the context of existing comments, but as a rule of thumb, try to engage early. Ringing the bell on prospect profiles ensures you are among the first to comment, maximizing your visibility and minimizing the chance of repeating another commenter's point.\n\n## FAQs About LinkedIn Comment Automation\n\n**Will my account get banned for automating comments?**\nIf you use cloud-based tools that log in from external servers, or extensions that rapidly spam hundreds of comments an hour, yes, you risk a ban. However, if you use a local-execution tool like Junior that mimics natural human browsing speeds, and you maintain a reasonable daily volume, your account remains safe. Review an [automate Linkedin comments safely evaluation checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) before purchasing any software.\n\n**Can prospects tell I am using AI to comment?**\nThey can if you use generic tools that rely on stock phrases (\"Thanks for sharing!\", \"Great insights!\"). They cannot tell if you use persona-trained AI that incorporates your actual industry expertise, frames responses uniquely, and undergoes a brief human review before posting.\n\n**How many comments should a sales rep automate per day?**\nQuality drastically outweighs volume in public engagement. Aiming for 20 to 30 highly contextual, thoughtful comments per day on targeted prospect accounts will generate significantly more pipeline than 100 generic comments scattered randomly across your feed. \n\n## Moving From the Inbox to the Timeline\n\nThe era of blasting 100 cold connection requests a day and hoping for a 1% meeting booked rate is ending. Buyers are fatigued. They protect their inboxes aggressively, but they still crave professional validation and interesting discussions on their public posts.\n\nFor sales reps, the timeline is the new inbox. Automating LinkedIn comments is the most efficient way to maintain a massive presence in your prospects' minds without dedicating your entire day to social media. \n\nBy stepping beyond basic browser extensions like Engage AI and adopting sophisticated, locally executed, persona-driven tools like Junior, you protect your account while scaling your authentic voice. You stop being another ignored pitch in a crowded DM folder, and you start being the insightful industry peer they actually want to talk to.", "created_at": "2026-09-08T17:19:25.226766+00:00", "updated_at": "2026-09-08T17:19:25.226774+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
