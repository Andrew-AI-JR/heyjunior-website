    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 101, "slug": "aware-alternatives-warm-up-outbound-leads-linkedin", "title": "Aware Alternatives for Warm Up Outbound Leads On Linkedin", "excerpt": "Discover why cold LinkedIn DMs fail and how to use Aware alternatives like Junior to warm up outbound leads with authentic, safe AI commenting strategies.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57c54j11169km85z4dqs0nh418d6f8c/aware-alternatives-for-warm-up-outbound-leads-on-l-1789231733859-q7zk10.png", "published_at": "2026-09-12T16:22:00+00:00", "content": "# Aware Alternatives for Warm Up Outbound Leads On Linkedin\n\nIf you open your LinkedIn inbox right now, you are likely staring at a graveyard of identical, automated pitches. The \"connect and pitch\" playbook\u2014once the holy grail of B2B lead generation\u2014has flatlined. Decision-makers have developed profound inbox blindness, and the threshold for what constitutes spam has never been lower.\n\nThe goal of outbound on LinkedIn in 2026 is no longer about hitting a volume of 100 cold direct messages (DMs) per day. Instead, the objective is to transition unknown, cold prospects into familiar, context-aware contacts long before you ever ask for a meeting. It is about perceived familiarity, relevance, and timing. You need to show up in their notifications before you show up in their inbox.\n\nMany revenue teams and founders look to analytics and listening platforms like Aware to understand their audience or track employee advocacy. While tracking sentiment and analyzing network data is valuable, it leaves a critical gap: execution. Knowing *who* to engage is only half the battle; the other half is doing the actual engaging without spending four hours a day manually typing comments or resorting to dangerous, spammy cloud automation.\n\nThis is where the shift toward active, localized commenting strategies comes in. In this comprehensive guide, we will break down the exact framework for warming up outbound leads, the psychology behind why commenting outperforms direct messaging, and why tools like Junior have emerged as the premier Aware alternatives for professionals who want to turn public visibility into direct pipeline.\n\n## The Core Problem with Cold LinkedIn Outbound in 2026\n\nTo understand why we must \"warm up\" leads, we have to look at why cold outbound is failing. \n\nFor years, the standard operating procedure for sales teams and lead generation agencies was simple: scrape a list of targets from Sales Navigator, load them into a cloud-based automation platform, and fire off a 4-step sequence starting with a generic connection request. \n\nThis approach created two massive problems:\n\n1. **Market Saturation:** When every agency and sales rep runs the exact same playbook, the target audience adapts. Executives now routinely ignore connection requests from anyone with a \"We help [X] achieve [Y]\" headline. \n2. **Platform Penalties:** LinkedIn has aggressively cracked down on bulk automation. Cloud-based tools that ping LinkedIn's servers from random IP addresses often result in shadowbans, restricted accounts, or permanent bans. \n\nHigh volume of low-quality touches burns your Total Addressable Market (TAM) faster than you can build it. As noted in industry analyses on how to [scale without burning leads](https://expandi.io/blog/linkedin-outreach-for-leadgen-agencies/?utm_source=chatgpt.com), protecting your reputation while conducting outreach is paramount. You cannot afford to alienate a highly qualified prospect because they received an irrelevant, automated pitch the day after they changed jobs.\n\n### The Psychology of the Notification Bell vs. The Inbox\n\nWhy does warm outreach center around public engagement rather than private messaging? It comes down to platform psychology.\n\nWhen a user sees a red badge on their LinkedIn **Inbox** icon, their default emotional state is defensive. They anticipate a pitch, a request for their time, or an obligation to reply. It feels like a chore.\n\nWhen a user sees a red badge on their **Notifications** icon (indicating a like or a comment on their post), their default emotional state is positive. They anticipate validation, peer recognition, and dopamine. They *want* to click it. \n\nBy shifting your initial touchpoints from the inbox to the feed, you bypass the defensive barrier. You associate your name, face, and headline with validation rather than an imposition. \n\n![Comparison diagram showing how prospects react defensively to cold LinkedIn inboxes versus receptively to post notification b](https://assets.bevisible.app/inline-images/j57c54j11169km85z4dqs0nh418d6f8c/inline-1-1789231671018-j79103.png)\n## What Does It Actually Mean to \"Warm Up\" a Lead?\n\nWarming up a lead on LinkedIn is the systematic process of building micro-familiarity. \n\nWhen you eventually send a direct message, the prospect's reaction should not be, \"Who is this person and how did they find me?\" It should be, \"Oh, I recognize this name. They left that insightful comment on my post about supply chain logistics last week.\"\n\nThis perceived familiarity fundamentally alters the power dynamic of the conversation. You are no longer a vendor begging for 15 minutes; you are a peer initiating a relevant discussion. A properly executed warm outbound strategy can easily triple your response rates.\n\nHere is the step-by-step framework for implementing a modern warm-up strategy.\n\n## Step 1: Start with Buying Signals, Not Random Lists\n\nDo not begin your outbound motion with messaging. Begin by identifying individuals who are already slightly \"warm\" to your ecosystem, even if they do not explicitly know it yet. A list of 50 highly signaled prospects will universally outperform a list of 5,000 random demographic matches.\n\n### Recognizing High-Value Intent Signals\n\nLook for prospects who are actively leaving a digital footprint related to your offering. Good warm signals include:\n\n* **Profile Viewers:** They looked at your profile but didn't connect. Why? They were likely searching for a solution you provide.\n* **Content Engagers:** They liked or commented on your recent posts. \n* **Company Page Followers:** They opted in to hear from your brand.\n* **Competitor Audience:** They actively engage with your direct competitors' content, showing clear problem awareness.\n* **Industry Event Attendees:** They clicked \"Attend\" on a relevant LinkedIn Audio event or webinar.\n\nThese individuals already have baseline context about your world. Engaging them at this specific moment leverages timing to your advantage, which is a core tenet of effective [warm outbound implementation](https://getfuzzy.ai/blog/warm-outbound-linkedin?utm_source=chatgpt.com). You aren't interrupting them; you are joining a conversation they are already having.\n\n## Step 2: \"Pre-Warm\" Through Strategic Engagement (The 3-7 Day Rule)\n\nOnce you have identified your signal-based list, you enter the pre-warming phase. The goal here is to interact in a way that feels distinctly human and low-pressure. You want to establish a cadence of interactions over 3 to 7 days before you ever attempt to connect or send a direct message.\n\n### The Anatomy of the 3-7 Day Sequence\n\nSpacing out your interactions is critical. If you view a prospect's profile, like three of their posts, leave two comments, and send a connection request all within 10 minutes, you emit overwhelming stalker vibes. It feels frantic and clearly automated. Natural human behavior is sporadic.\n\n**Day 1: The Silent Acknowledgment**\n* Action: View their profile.\n* Purpose: Your name and headline appear in their \"Who viewed your profile\" section. It is a passive, non-intrusive introduction.\n\n**Day 3: The Insightful Comment**\n* Action: Find a recent, relevant post of theirs and leave a meaningful, multi-sentence comment. \n* Purpose: You deliver value publicly. \n* *Rule of Thumb:* Never comment \"Great post!\" or \"Thanks for sharing!\" These add zero value and are immediately recognized as engagement pod behavior or lazy automation. Add a specific insight, ask a follow-up question, or share a brief anecdote that supports their thesis.\n\n**Day 5: The Secondary Interaction**\n* Action: Engage with a comment they left on *someone else's* post, or engage with their company's content.\n* Purpose: You demonstrate that you are active in the same broader industry circles, establishing yourself as a peer rather than a vendor.\n\n**Day 7: The Contextual Connection Request**\n* Action: Send a connection request directly referencing the interaction from Day 3 or Day 5.\n* Purpose: Moving the relationship from public to private with clear, earned context.\n\nBy the time you reach Day 7, the prospect has seen your face and headline at least three times in positive, non-demanding contexts. When the connection request arrives, it feels like a natural next step in a budding professional relationship. This methodical approach to building context significantly [improves response rates](https://www.joinvalley.co/blog/best-way-to-do-warm-outbound-on-linkedin-the-complete-guide?utm_source=chatgpt.com).\n\n![Timeline chart illustrating the 7-day LinkedIn pre-warming sequence from profile view to contextual connection request.](https://assets.bevisible.app/inline-images/j57c54j11169km85z4dqs0nh418d6f8c/inline-2-1789231679094-eguz8r.png)\n## Step 3: Build Familiarity Through Content (Your Silent Warming Layer)\n\nWhile you are actively engaging with prospects, you must also maintain a robust \"silent warming layer\" on your own profile. \n\nWhen you leave a brilliant comment on a CEO's post, their first instinctive action is to hover over your name. Their second action is to click your profile. If they land on a profile that reads like a dry resume, the momentum stops. If they land on a profile teeming with insights regarding their exact pain points, the outbound motion practically completes itself.\n\n### Treating Your Profile Like a Landing Page\n\nYour content strategy operates while you sleep. You should regularly post content that:\n* Discusses your prospects' daily pain points (without aggressively pitching your product).\n* Shares contrarian or lesser-known insights from your specific niche.\n* Breaks down real-world scenarios, case studies, or failures.\n\nThis creates a self-reinforcing loop. You comment on a prospect's post -> they view your profile -> they read your recent post addressing their exact problem -> they send *you* an inbound connection request. Integrating a strong [content strategy into your outbound sales](https://www.linkedin.com/top-content/sales/b2b-sales-strategies/how-to-use-content-in-outbound-sales-strategies/?utm_source=chatgpt.com) is the ultimate leverage point for modern B2B growth.\n\n## Evaluating Aware Alternatives for Active Engagement\n\nIf you understand the necessity of this warm-up process, the immediate operational challenge becomes time. Manually tracking signals, finding relevant posts, and drafting highly contextual comments for 50 leads a day can easily consume three hours.\n\nThis is why teams look to software. While platforms like Aware excel at organizational listening, data governance, and tracking employee sentiment, they are not built to execute localized, safe, AI-driven outbound engagement for individual contributors. \n\nWhen searching for the right tool to automate this strategy, you must navigate a minefield of poor options. \n\n### The Danger of Legacy Cloud Automation\n\nMost legacy LinkedIn automation tools operate in the cloud. They log into your account from an external server (often in a different country), scrape data rapidly, and mass-send generic messages. LinkedIn's security algorithms are now incredibly adept at catching this. \n\nUsing cloud automation for commenting or messaging risks:\n* \"You've reached the weekly invitation limit\" warnings.\n* Forced logouts and mandatory ID verification.\n* Complete account restriction.\n\nTo safely scale, you need to understand the nuances of [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### The \"AI Voice\" Problem\n\nThe second generation of commenting tools introduced AI, but poorly. They simply hooked into a basic LLM API and blasted out comments like, \"Fascinating perspective on B2B sales! I completely agree that strategies must evolve. Let's connect!\" \n\nThis reads like a robot. It damages your personal brand because it lacks your unique point of view, tone, and specific expertise. Prospects can spot these generic AI comments a mile away, and they often screenshot them to mock them publicly. \n\nIf you are evaluating tools, you should consult an [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) to ensure you aren't sacrificing authenticity for speed.\n\n## Junior: The AI-Powered Alternative for Authentic Warm-Ups\n\nIf legacy cloud tools are dangerous and basic AI tools are embarrassing, what is the solution for scaling the 3-7 day warm-up sequence?\n\nThis is where Junior fundamentally changes the operational reality for job seekers, sales teams, agencies, and founders. Junior is designed specifically to solve the bottleneck of authentic engagement. It is arguably the most effective alternative for actively warming up leads because it prioritizes safety, context, and local execution.\n\n### How Junior Replaces the Cold DM\n\nInstead of relying on spammy connection requests, Junior helps you bypass crowded inboxes by turning public visibility into direct conversations. \n\n**1. Localized Execution for Ultimate Safety**\nUnlike cloud-based tools that trigger LinkedIn's security alarms, Junior runs locally on your machine. It uses natural interaction patterns\u2014mimicking the exact way a human would scroll, pause, and type. Your IP address doesn't change, and you don't trigger simultaneous logins from different continents. This local-first architecture makes Junior one of the premier [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n**2. Context-Aware, Bio-Driven AI**\nJunior does not write generic platitudes. The AI is trained specifically on your unique bio, your goals, and your tone of voice. When Junior drafts a comment for a prospect's post, it synthesizes the prospect's content with *your* expertise. \n\nIf you are a fractional CFO and a prospect posts about cash flow challenges, Junior drafts a reply highlighting a specific financial insight relevant to your background. It sounds exactly like you, saving you the cognitive load of drafting from scratch while maintaining the high quality required to spark a real conversation.\n\n**3. Finding the Right Discussions**\nYou don't have to manually hunt for relevant posts. Junior helps you find the right discussions happening in your niche, allowing you to focus your engagement where it will have the highest impact. If you want to dive deeper into how it compares to other discovery tools, you can review this guide on the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\nBy automating the heavy lifting of finding posts and drafting contextual replies locally, Junior allows a single founder or sales rep to execute 30-50 high-quality warm-up touches daily in just a few minutes, safely.\n\n![Architecture diagram comparing risky cloud-based LinkedIn automation with safe, localized desktop AI engagement.](https://assets.bevisible.app/inline-images/j57c54j11169km85z4dqs0nh418d6f8c/inline-3-1789231682642-0tcj2z.png)\n## The Consultant\u2019s Pivot: A Mini-Case Study in Warm Outbound\n\nTo illustrate the difference between cold volume and warm engagement, consider the typical trajectory of a boutique consulting founder\u2014let's call her Sarah. \n\nSarah runs a go-to-market consultancy for SaaS startups. Initially, she used a traditional cloud automation tool to send 100 connection requests a day to SaaS founders, followed by a three-part pitch sequence. \n\n**The Old Metrics (Cold Outbound):**\n* 100 requests sent daily.\n* 15 accepted (15% acceptance rate).\n* 14 ignored the follow-up pitch.\n* 1 replied with \"Not interested right now.\"\n* **Result:** Zero pipeline, high account risk, damaged brand reputation.\n\nFrustrated, Sarah abandoned the mass-messaging approach and shifted to a warm-up commenting strategy using Junior. Instead of targeting 100 random founders, she focused on finding founders actively posting about growth hurdles, team alignment, or marketing spend.\n\n**The New Metrics (Warm Engagement via Junior):**\n* 25 highly contextual comments left daily on founder posts (drafted by Junior based on her GTM expertise).\n* 15 founders replied to her comment publicly.\n* 10 founders clicked her profile (Silent Warming Layer engaged).\n* 4 founders sent *her* an inbound connection request.\n* She sent 6 connection requests to the others, referencing the thread. (All 6 accepted).\n* **Result:** 10 warm conversations started per week, leading to 2 closed consulting retainers in month one, without sending a single cold pitch.\n\nThis pivot perfectly illustrates the core philosophy explored in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). Quality engagement at a moderate volume entirely outclasses poor engagement at a high volume.\n\n## 5 Best Practices for Scaling Warm Outbound\n\nIf you are committing to this methodology, there are specific guardrails you must put in place to ensure you remain effective and authentic. Social selling requires finesse; executing these [B2B outbound best practices](https://www.trychattie.com/pt-br/blog/social-selling-linkedin-outbound-best-practices?utm_source=chatgpt.com) ensures you generate leads rather than annoyance.\n\n### 1. Avoid the \"Forced Agreement\" Trap\nWhen commenting, you do not always have to agree with the original poster. In fact, polite, evidence-based disagreement or expanding on an edge case often generates much more visibility than simple agreement. If a prospect posts, \"Cold calling is the only way to grow,\" a comment saying, \"Interestingly, we've found that blending cold calling with targeted LinkedIn commenting reduces no-show rates by 30%. Have you tested a hybrid approach?\" is highly engaging.\n\n### 2. Connect the Comment to the DM Naturally\nWhen you transition from the public feed to the private inbox, the transition must be seamless. \n* **Bad DM:** \"Hey, loved your post today. We help companies like yours generate more leads. Got 15 mins?\"\n* **Good DM:** \"Hey John, great back-and-forth on your post today about SDR attrition. I actually wrote a brief breakdown on how we reduced churn in our team last quarter. Happy to shoot over the link if it's helpful, otherwise, just great to connect with a fellow revenue leader.\"\n\n### 3. Leverage Competitor Audiences Carefully\nOne of the highest-intent warm-up strategies is engaging with people who comment on your competitors' posts. However, do not poach aggressively. If someone asks a competitor a question in the comments that goes unanswered, providing a helpful, brand-neutral answer is a brilliant way to build authority and warm up a highly qualified lead.\n\n### 4. Pace Your Automation\nEven with a tool like Junior that operates locally, you must respect the physical limits of human behavior. You cannot leave 500 comments a day. Establishing safe operational limits is critical. For a deep dive into safety protocols, review the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### 5. Measure Reply Rate Over Acceptance Rate\nIn the old model, \"Connection Acceptance Rate\" was the vanity metric everyone chased. In a warm outbound model, \"Meaningful Reply Rate\" is the only metric that matters. It does not matter if 1,000 people accept your connection request if zero of them will have a conversation with you. Optimize your process for starting chats, not hoarding connections.\n\n## Common Myths and Failure Modes in LinkedIn Outbound\n\nAs this methodology becomes standard, several misconceptions have emerged. Let's bust the most prevalent myths.\n\n**Myth 1: \"I need to post 5 times a day to warm up leads.\"**\n*Reality:* You do not need to be a full-time content creator. Your outbound strategy (commenting) drives traffic to your profile. You only need a few high-quality, pinned posts that clearly articulate your value proposition and demonstrate expertise. Two thoughtful posts a week, combined with active commenting via a tool like Junior, is more than enough to establish the silent warming layer. \n\n**Myth 2: \"If I comment on their post, I shouldn't send a connection request the same day.\"**\n*Reality:* This is generally true, which is why the 3-7 day framework exists. Sending a request the millisecond after you comment often betrays your intent\u2014it shows the comment was just a transactional stepping stone to get into their inbox. Let the comment breathe. Let them reply. *Then* connect.\n\n**Myth 3: \"All AI commenting tools are basically the same.\"**\n*Reality:* The difference between a generic API wrapper and a purpose-built engagement tool is massive. Comparing different tiers of tools is essential. If you are serious about this channel, read up on the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) to understand why context-aware AI is non-negotiable, and explore [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) to grasp the security differences.\n\n## Frequently Asked Questions (FAQs)\n\n### How long should I warm up a lead before pitching?\nThere is no universal timeline, but the general rule is to wait for a \"pull\" signal. A pull signal is when the prospect replies to your comment, views your profile, or accepts your contextual connection request and replies to your welcome message. Once they have engaged back, you have earned the right to ask a probing question. You still shouldn't pitch immediately; instead, ask a question related to a pain point you solve to see if there is an opening.\n\n### Can I completely automate the warm-up process?\nYou can automate the *mechanics* of the warm-up (finding posts, drafting contextual replies, executing the keystrokes locally), but you should never fully abdicate the *strategy*. Tools like Junior act as a brilliant co-pilot, drafting human-sounding replies based on your bio. However, as the user, you still review, approve, or lightly tweak the output to ensure it aligns perfectly with your goals. Total hands-off automation usually leads to generic output and missed nuances.\n\n### What if my target leads don't post content?\nThis is a very common scenario\u2014only about 3-5% of LinkedIn users post original content regularly. If your prospect doesn't post, you can warm them up by:\n1. Engaging with their company page's content (often monitored by leadership).\n2. Finding posts they have liked or commented on, and replying to their comments in those threads.\n3. Engaging with broader industry posts (like a major publication or influencer in your niche) where you know they are likely scrolling. \n\nWhen executing this broader engagement, evaluating platforms like [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) will help you determine the best way to discover these secondary touchpoints.\n\n### Is this method only for Sales Teams?\nNo. Warming up outbound leads via authentic commenting is wildly effective for job seekers trying to get the attention of hiring managers, lead gen agencies trying to book meetings for clients, and founders trying to secure early design partners or investors. The psychology of validation and familiarity applies across all professional networking. For a broader look at the landscape, review the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n## Redefining the Outbound Playbook\n\nThe days of exporting a list of 5,000 names, dumping them into a cloud sequencer, and waiting for the meetings to roll in are permanently over. That approach now yields burned leads, damaged personal brands, and restricted accounts. \n\nWarming up outbound leads on LinkedIn is a requirement, not a luxury. By shifting your focus from the inbox to the feed, you leverage the platform's natural psychology. You provide validation through thoughtful engagement, you build micro-familiarity over 3 to 7 days, and you transition from a cold vendor to a recognized peer.\n\nWhile enterprise analytics platforms like Aware provide high-level insights, they do not execute the daily, localized engagement required to fill your pipeline. By adopting AI-powered, local-first alternatives like Junior, you can scale this authentic warm-up process without sacrificing the human element that makes it work. You stop spamming, start conversing, and turn your public visibility into the most reliable revenue channel in your business.", "created_at": "2026-09-12T16:49:26.586984+00:00", "updated_at": "2026-09-12T16:49:26.586989+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

                },
                {
                    name: 'X',

                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'

                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
