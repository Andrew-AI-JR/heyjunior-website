    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 66, "slug": "taplio-alternatives-ai-software-startup-founders-social-selling", "title": "Taplio Alternatives for AI Software for Startup Founders Doing Social Selling", "excerpt": "Discover top Taplio alternatives for startup founders doing AI-powered social selling on LinkedIn. Compare safety, contextual commenting, and deal pipeline tools.", "featured_image_url": "https://assets.bevisible.app/featured-images/j578de10bvhbtw6hr9wjysw4e18ajed3/taplio-alternatives-for-ai-software-for-startup-fo-1786112321028-k7p59l.png", "published_at": "2026-08-07T14:00:00+00:00", "content": "# Taplio Alternatives for AI Software for Startup Founders Doing Social Selling\n\nMost early-stage SaaS founders treat LinkedIn like a broadcast channel. They schedule five text posts a week, auto-generate carousel graphics, and track impressions, believing that audience size directly translates into sales pipeline. By month three, they discover a frustrating reality. Their posts get decent view counts from peers, yet zero qualified buyers reach out. When they attempt to scale by blasting cold DMs or deploying cloud automation software, prospect response rates hover near zero, and LinkedIn issues account warnings.\n\nTaplio became the default tool for LinkedIn content creation and personal branding. It built an intuitive suite for post generation, scheduled publishing, and carousel design. However, personal branding is not the same as social selling. A founder looking to close early adopters, secure seed investments, or sign enterprise pilot customers requires direct, high-intent conversations rather than superficial impression metrics.\n\nIn 2026, the mechanics of B2B social selling have shifted. Inboxes are guarded by aggressive spam filters and buyer fatigue. Decision-makers rarely reply to automated connection requests or generic cold DMs. Instead, high-value conversations originate in public comment sections where buyers actively discuss operational pain points, industry trends, and tool evaluations.\n\nIf you are a startup founder looking for AI software that drives actual pipeline through social selling, relying solely on Taplio leaves major gaps in your tech stack. This guide analyzes the top Taplio alternatives designed specifically for founder-led social selling, contextual engagement, lead intelligence, and safe account growth.\n\n---\n\n## Why Taplio Falls Short for Founder-Led Social Selling\n\nTo choose the right alternative, you must understand where Taplio excels and where its architecture fails early-stage sales teams.\n\nTaplio was constructed primarily as an all-in-one creator OS. It focuses heavily on content volume: writing posts with generative AI, scraping viral templates, scheduling content across time zones, and auto-dming people who comment on specific keywords. For content creators selling info products or building broad personal brands, this broadcast-centric workflow functions well. For founders doing strategic B2B social selling, three critical shortcomings quickly emerge.\n\n### 1. Broadcast Reach vs. Target Account Engagement\nPublishing content reaches whoever the algorithm chooses to show it to. In early-stage selling, your ideal customer profile (ICP) consists of perhaps 500 target accounts or specific job titles. Waiting for those specific executives to stumble across your scheduled post is inefficient. Social selling requires proactive outreach, bringing your domain expertise directly to the discussions your ideal prospects are already having.\n\n### 2. The Risk of Cloud-Based Automated Actions\nTaplio and traditional cloud automation tools operate by connecting to your LinkedIn account via cloud servers and browser extension sessions. LinkedIn's detection algorithms closely monitor server IP addresses, abnormal request rates, and headless browser sessions. High-volume cloud automation frequently leads to temporary restrictions, shadowbans, or permanent account suspension. When a founder's personal profile is restricted, their primary pipeline engine disappears overnight.\n\n### 3. Generic AI Tone and Accountable Persona Framing\nEarly generative AI tools produced recognizable patterns: overly enthusiastic adjectives, rocket emojis, repetitive formatting, and shallow commentary. Modern B2B buyers ignore generic AI responses. When a software platform posts generic AI comments or automated outreach messages on your behalf, it damages your personal credibility as a domain expert.\n\n![Comparison framework between broadcast content creation and intent-based conversational selling for founders.](https://assets.bevisible.app/inline-images/j578de10bvhbtw6hr9wjysw4e18ajed3/inline-1-1786112250266-3iv5a0.png)\n### Comparison: Broadcast Content Creation vs. Intent-Based Conversational Selling\n\n| Operational Focus | Content Creation Software (e.g., Taplio) | Intent-Based Social Selling (e.g., Junior) |\n| :--- | :--- | :--- |\n| **Primary Metric** | Impressions, post views, general follower count | Direct conversations, qualified leads, pipeline created |\n| **Lead Source** | Passive inbound from public post reach | Proactive targeting of active, relevant discussions |\n| **Engagement Medium** | Scheduled posts, broadcast carousels, auto-DMs | Contextual, human-sounding comments on prospect posts |\n| **Account Security** | Cloud-based server requests and browser sessions | Local machine execution with human interaction timing |\n| **Buyer Experience** | Broadcast marketing push | Peer-to-level contextual conversation |\n| **Conversion Method** | Call-to-action links in posts or automated inbox drops | Frictionless transition from public comment to warm DM |\n\n---\n\n## Top Taplio Alternatives for Startup Founders (Categorized by Sales Motion)\n\nNo single tool handles every aspect of social selling flawlessly. Startup founders who succeed on LinkedIn build a streamlined stack tailored to their primary growth engine. Here are the leading software alternatives categorized by their function in your sales stack.\n\n### Category 1: Contextual Engagement & Comment-Driven Pipeline\n\n#### 1. Junior\n**Best For:** Startup founders, agencies, and sales leaders who want to generate warm pipeline through strategic post commenting without risking account safety.\n\nJunior approaches social selling from a fundamentally different premise than Taplio. Instead of focusing on broadcasting posts to a broad audience, Junior helps founders find high-intent LinkedIn discussions and participate with context-aware, insightful comments.\n\n##### Key Selling Features:\n* **Local Machine Execution:** Junior runs directly on the user's local computer inside a real browser environment. It avoids cloud server IPs, ensuring interaction patterns mirror natural human browsing and protecting account safety.\n* **Bio-Grounded AI Engine:** Rather than generating generic AI text, Junior drafts responses grounded in the founder's specific biography, company positioning, tone, and strategic goals.\n* **Strategic Comment Monitoring:** Tracks posts from ideal prospects, industry thought leaders, and specific keyword topics, allowing founders to insert their expertise exactly where buyers are active.\n* **Direct Conversation Catalyst:** Focuses on converting public comment threads into private, warm inbox discussions, eliminating the need for cold outbound messaging.\n\n##### Where It Surpasses Taplio:\nTaplio treats commenting as a secondary feature for boosting post reach. Junior treats strategic commenting as the core sales engine. By operating locally, Junior eliminates account suspension risks associated with cloud tools while producing nuanced, professional commentary that positioning founders as trusted industry peers.\n\nFor a deeper look at how strategic commenting compares to traditional post scheduling, read our comparison on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n---\n\n### Category 2: Content Optimization & Personal Brand Analytics\n\n#### 2. AuthoredUp\n**Best For:** Founders who want deep analytics and a distraction-free post editor without aggressive automation or cloud connectivity risks.\n\nAuthoredUp is a dedicated content creation and analytics tool built directly into the desktop browser experience. It does not automate interactions or send messages; instead, it focuses on helping users draft, format, preview, and analyze LinkedIn posts.\n\n##### Key Selling Features:\n* Real-time post formatting preview for mobile, tablet, and desktop views.\n* Detailed post analytics, including readability scoring, hook performance, and historical engagement comparisons.\n* Snippet management and draft organization for founder thought leadership content.\n* Completely safe execution with zero risk to LinkedIn account standing.\n\n##### Why Founders Choose It Over Taplio:\nAuthoredUp provides superior visual editor controls and deeper statistical analysis of post performance without charging for features founders rarely use, such as cloud messaging automation.\n\n#### 3. MagicPost\n**Best For:** Early-stage founders who need fast AI drafting tailored specifically to SaaS and B2B technology verticals.\n\nMagicPost focuses on writing long-form posts, carousels, and visual posts using structured AI frameworks. It analyzes top-performing B2B content structures to help non-writers articulate complex product features into clean social content.\n\n##### Key Selling Features:\n* Structured post templates designed for product launches, technical teardowns, and founder journey narratives.\n* Multi-language AI tone adaptation.\n* Integrated visual image and slide deck generator.\n\n---\n\n### Category 3: Target Account Prospecting & Lead Intelligence\n\n#### 4. LinkedIn Sales Navigator\n**Best For:** Lead identification, account mapping, and monitoring executive changes across target accounts.\n\nSales Navigator remains the foundational database for B2B prospecting. While it lacks built-in AI post writing or automated engagement features, its filtering capability is unmatched for finding exact buying personas.\n\n##### Key Selling Features:\n* Lead and Account Saved Lists with custom alert triggers for post activity, job changes, and company funding events.\n* Advanced search parameters including headcounts, specific technology stacks, and recent profile activity.\n* Direct integration with major CRMs such as HubSpot and Salesforce.\n\n##### Why Founders Pair It with Alternatives:\nSales Navigator tells you *who* to talk to and *when* they publish content, but offers no native assistance for drafting context-aware commentary or scaling organic outreach. Pairing Sales Navigator's search capabilities with local engagement tools provides a powerful prospect discovery pipeline.\n\n#### 5. Apollo.io\n**Best For:** Multi-channel prospecting, contact enrichment, and verified email/phone data retrieval.\n\nApollo provides a vast database of global professional contacts combined with multi-channel outreach sequencing. While Taplio restricts its scope to LinkedIn social media actions, Apollo links social touchpoints to traditional email and phone outreach.\n\n##### Key Selling Features:\n* Over 275 million verified B2B contact records.\n* Automated email sequencing combined with manual social touch task reminders.\n* Intent signals tracking company research patterns across the web.\n\n--- \n\n### Category 4: Relationship Management & Pipeline Tracking\n\n#### 6. folk CRM\n**Best For:** Founders who need a lightweight, flexible CRM designed specifically to turn social contacts into organized deal pipelines.\n\nTraditional enterprise CRMs like Salesforce are too heavy for agile founders. folk CRM operates as a lightweight relationship manager that pulls prospect details directly from LinkedIn profiles via a browser extension.\n\n##### Key Selling Features:\n* One-click contact capture from LinkedIn profile pages and post comment sections.\n* Pipeline visual boards custom-tailored for founder sales, investment raising, or design partner onboarding.\n* Smart contact deduplication and email enrichment.\n\n#### 7. LeadDelta\n**Best For:** Organizing first-degree LinkedIn connections into tagged, filterable databases.\n\nFounders often accumulate thousands of 1st-degree connections over time without a clear system to filter or message them. LeadDelta turns your 1st-degree connection list into a clean table interface.\n\n##### Key Selling Features:\n* Tagging and custom note management for 1st-degree connections.\n* Inbox filter system separating qualified buyers from sales pitch spam.\n* Team view synchronization to manage collective network connections across co-founders.\n\n---\n\n## Taplio vs. Top Founder Alternatives: Features & Fit Comparison\n\nTo simplify your evaluation process, the table below highlights how the primary alternatives stack up across safety, workflow, and core sales capabilities.\n\n| Tool Name | Primary Purpose | Execution Model | Account Safety Level | Lead Conversion Engine | Ideal Founder Use Case |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **Taplio** | Content scheduling & viral post generation | Cloud server & extension session | Moderate risk (if overused) | Inbound post impressions & auto-DMs | Creator-founders building broad brand awareness |\n| **Junior** | Contextual comment engagement & pipeline creation | Local machine execution | Very high (human interaction patterns) | Context-aware public comment to warm DM transition | B2B founders targeting specific ICP accounts and deal pipeline |\n| **AuthoredUp** | Post drafting, formatting, & deep analytics | Local browser analytics | Maximum (no automated requests) | Pure content presentation optimization | Founders who write their own posts and want detailed analytics |\n| **Sales Navigator** | Target prospect search & account tracking | Native LinkedIn platform | Maximum (official tool) | Account tracking alerts & targeted list filtering | Enterprise sales founders mapping complex buying committees |\n| **folk CRM** | Relationship logging & lightweight sales tracking | Web app & chrome extension | Maximum (data layer tool) | Direct contact organization & follow-up tracking | Early-stage founders managing up to 100 active pipeline deals |\n| **Apollo.io** | Contact enrichment & email outbound sequencing | Web platform & database | High (for email outbound) | Cold email + social task sequences | Founders running high-volume outbound email and phone calls |\n\n---\n\n## Deep-Dive: Why Strategic Commenting Beats Broadcast Content for Early-Stage Sales\n\nWhen founders evaluate software for social selling, they often assume creating content is the fastest route to revenue. However, data from active B2B startup programs reveals a stark contrast in conversation rates between broadcast publishing and strategic commenting.\n\nIn recent industry benchmarks on B2B LinkedIn growth listed on resource hub [thegro.ai](https://thegro.ai/explore/en/list/10-best-ai-tools-for-linkedin-social-selling-in-2026?utm_source=chatgpt.com), intent-based engagement workflows generated higher executive reply rates than cold messaging campaigns. Similarly, comparative analyses across [connectsafely.ai](https://connectsafely.ai/articles/best-social-selling-tools-linkedin-2026?utm_source=chatgpt.com) highlight that local-running execution tools significantly lower profile flag rates compared to legacy cloud messaging bots.\n\nConsider the operational journey of a SaaS founder named Alex selling specialized workflow software to Vice Presidents of Operations.\n\n### Scenario: The Broadcast Approach (Taplio)\nAlex uses an AI generator to draft five weekly posts about operational bottlenecks. He schedules them to publish automatically. Over two months:\n* Total post impressions: 45,000\n* Average engagement per post: 18 likes (mostly from startup peers, recruiters, and co-founders)\n* Direct inbound sales inquiries from target VP Operations: 0\n* Time spent writing, editing carousels, and monitoring schedule: 6 hours per week\n\n**The Result:** Alex has built modest brand awareness among a general audience, but zero measurable pipeline for his software.\n\n### Scenario: The Contextual Commenting Approach (Junior)\nAlex switches strategy. He defines 30 target executives and 5 industry topic keywords. He uses [Junior](https://www.heyjunior.ai/) to track when these target executives or industry leaders publish posts about operational challenges.\n\nWhen a VP of Operations posts about workflow friction in their team, Junior drafts a context-aware comment incorporating Alex's unique methodology. Alex reviews the proposed text, adds a specific observation, and posts the comment. \n\nOver two months:\n* Relevant posts commented on: 120\n* Profile visits from target buyers: 340\n* Warm comment threads that moved into active direct messages: 14\n* Qualified sales demo meetings booked: 5\n\n![Flowchart diagram showing how a founder converts a public comment thread into a direct sales call.](https://assets.bevisible.app/inline-images/j578de10bvhbtw6hr9wjysw4e18ajed3/inline-2-1786112252872-wtbbc8.png)\n**The Result:** Alex closes two pilot customers within 60 days without spending hours creating graphic carousels or sending unsolicited cold DMs.\n\nUnderstanding how to find these active conversations is critical. If you want to refine your targeting process, explore our guide on the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n---\n\n## The Architecture of Safe AI Social Selling: Local vs. Cloud Software\n\nFor startup founders, keeping your LinkedIn account safe is an operational imperative. Account suspensions delay sales pipeline, disrupt brand presence, and destroy momentum.\n\nWhen choosing software to assist your social selling efforts, the underlying technical architecture matters significantly. Tools generally fit into two structural categories: **Cloud Automation Architecture** and **Local Machine Architecture**.\n\n```\nCloud Automation Architecture (High Risk):\n[ Cloud Server / Data Center ] ---> [ Headless Chrome / Proxy IP ] ---> [ LinkedIn API / Web Interface ]\n                                                                               |\n                                                                  (Triggers Automation Filters)\n\nLocal Machine Execution Architecture (Maximum Safety):\n[ User's Local Desktop ] ---> [ Real Local Browser Session ] ---> [ Native Human Action Timing ] ---> [ LinkedIn ]\n```\n\n### Cloud Automation Architecture (High Risk)\nMost legacy social media tools and LinkedIn automation systems run on remote cloud servers located in data centers. When you connect your account, these platforms assign a static or rotating proxy IP address and run your session inside a virtualized, headless browser.\n\nLinkedIn\u2019s security systems detect these patterns easily:\n1. Data center IP ranges differ from standard residential internet service providers (ISPs).\n2. Browser footprints lack typical local browser cached data, plugins, and physical device hardware characteristics.\n3. Server execution often performs requests at rigid intervals or unnatural times of day.\n\nEven when cloud tools limit daily action counts, the connection source itself can trigger verification checkpoints or temporary restrictions.\n\n### Local Machine Architecture (Maximum Safety)\nLocal tools like Junior execute actions directly on your personal computer inside your active browser session. \n\nBecause interactions occur directly on your local system:\n1. All web requests originate from your genuine residential or office IP address.\n2. Browser canvas fingerprinting matches your regular daily activity precisely.\n3. Interaction timings incorporate natural human micro-delays, mouse cursor movements, and typing cadences.\n\nBy executing actions locally, you eliminate data-center footprints entirely. To understand how account safety parameters function in detail, review our operational breakdown on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n---\n\n## Myth-Busting: 3 Common Myths About Founder Social Selling in 2026\n\nAs social selling strategies evolve, outdated tactics persist across marketing blogs. Discussions among SaaS founders on platforms like [Reddit's /r/SaaS community](https://www.reddit.com/r/SaaS/comments/1ticj3j/its_2026_and_most_saas_founders_still_treat/?utm_source=chatgpt.com) reveal growing frustration with generic social tactics that fail to generate revenue. Let's debunk three persistent myths.\n\n### Myth 1:", "created_at": "2026-08-07T14:19:22.521179+00:00", "updated_at": "2026-08-07T14:19:22.521187+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
