    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 131, "slug": "best-ai-linkedin-tools-authentic-comments", "title": "Best AI LinkedIn tools for writing authentic comments", "excerpt": "Discover the best AI LinkedIn tools to write authentic, non-robotic comments, keep your account safe, and turn daily engagement into high-value pipeline.", "featured_image_url": "https://assets.bevisible.app/featured-images/j578csc46fwxjhwn07g46p74pd8f719a/best-ai-linkedin-tools-for-writing-authentic-comme-1791733698808-1fxdfe.png", "published_at": "2026-10-14T15:17:00+00:00", "content": "# Best AI LinkedIn tools for writing authentic comments\n\nIf you spend more than five minutes scrolling your LinkedIn feed, you will spot them. They sit at the bottom of popular posts, aggressively agreeable and painfully robotic. \n\n\"Great insights on B2B sales! It is truly vital to leverage synergies in today's digital landscape. What are your thoughts on this?\"\n\nThis influx of synthetic agreement is impossible to ignore. Industry leaders are increasingly calling out the trend of [AI-generated activity](https://www.linkedin.com/posts/josh-braun_ive-noticed-a-new-trend-on-linkedin-ai-generated-activity-7256041838174728192-bYC_), noting that while automation is rising, the quality of conversation is plummeting. Generic AI comments do not just fail to start conversations; they actively damage your personal brand, signaling to prospects and peers that their thoughts weren't worth your actual time. \n\nThe problem is not the artificial intelligence itself. The problem is the execution. When professionals use a single, basic prompt to generate a reply, the language model attempts to do too many jobs at once\u2014summarize the post, sound professional, and ask a question\u2014resulting in the safest, most generic answer possible. \n\nYou can write better LinkedIn comments with AI, but it requires treating the technology as a thought partner rather than an autopilot. \n\nThis guide breaks down exactly how to train AI to write in your authentic voice, the specific prompts that yield contrarian and insightful angles, and the best AI LinkedIn tools designed to protect your account while driving real pipeline.\n\n## The anatomy of a terrible AI comment\n\nTo understand how to write better comments, you have to understand why default AI outputs fail on social platforms. \n\nMost AI LinkedIn comments fall into one of three failure modes:\n\n1.  **The Echo Chamber:** The comment simply restates the original post's premise using slightly different adjectives. If the post is about cold calling, the comment says, \"Cold calling is definitely still alive and requires skill.\" It adds zero net-new value to the discussion.\n2.  **The Sycophant:** The AI is overly enthusiastic. It uses phrases like \"Absolutely brilliant take!\" or \"This is a masterclass in leadership!\" This level of flattery rarely happens in natural professional conversations and immediately raises red flags.\n3.  **The Unnatural Academic:** Default language models love the words *delve, leverage, testament, crucial,* and *multifaceted*. They write comments that sound like a college thesis introduction rather than a quick exchange at a networking event. \n\n[Most AI comments fail](https://promptsdaily.substack.com/p/ai-linkedin-comments) because the user relies on a zero-shot prompt. They paste the original post into an interface and hit \"generate reply.\" Without context about who you are, what your goals are, and how you naturally speak, the model defaults to the statistical average of all professional text it was trained on. \n\nThe statistical average is boring. If you want to use public visibility to book interviews, generate lead flow, or sign consulting clients, you cannot afford to be boring.\n\n![Comparison diagram showing three failure modes of generic AI comments versus authentic high-converting comments.](https://assets.bevisible.app/inline-images/j578csc46fwxjhwn07g46p74pd8f719a/inline-1-1791733653412-i5mt61.png)\n## How to write better LinkedIn comments with AI\n\nTo transform an AI from a generic text generator into a highly effective networking assistant, you have to constrain it. You need to give it rules, context, and specific angles. \n\n### Prime the AI with your personal style\n\nBefore you ask an AI to write a single word for you, you must establish your communication baseline. Generic AI comments are easily spotted and ignored, but a properly primed model can mimic your cadence with surprising accuracy.\n\nStart by feeding the AI examples of your best-performing past comments. Show it how you format your sentences. Do you use emojis? Do you prefer short, punchy statements or slightly longer, analytical paragraphs? \n\nNext, give the AI explicit negative instructions. Negative constraints are often more powerful than positive instructions because they strip away the robotic tells. \n\nA strong priming prompt looks like this:\n*I want you to act as my LinkedIn ghostwriter. Before we write anything, you must adopt these rules: Never use passive voice. Do not use the words 'delve', 'leverage', 'testament', or 'crucial'. Never start a comment with 'Great post' or 'I completely agree'. Never end a comment by asking a generic question like 'What do you think?' Keep sentences short and conversational.*\n\n### Use AI for angles, not answers\n\nThe best comments on LinkedIn do not just agree with the original author; they expand the conversation. They bring a new perspective, offer a counter-point, or share a micro-case study. \n\nInstead of asking the AI to \"write a reply,\" [use ChatGPT to craft unique comments](https://www.forbes.com/sites/jodiecook/2025/04/30/5-chatgpt-prompts-to-write-linkedin-comments-that-are-actually-good/) by asking it to brainstorm different approaches to the original post.\n\nPaste the target LinkedIn post into your AI of choice and ask for three specific angles:\n1.  **The Contrarian:** \"What is a respectful but opposing viewpoint to this post's main argument?\"\n2.  **The Expansion:** \"What is a logical next step or advanced tactic that builds upon what the author just said?\"\n3.  **The Synthesis:** \"How does this concept apply specifically to [Your Industry/Niche]?\"\n\nBy asking for angles, you force the AI to act as a brainstorming partner. You can look at the three ideas, pick the one that aligns with your actual experience, and write the comment yourself\u2014or ask the AI to draft a 30-word response based purely on that chosen angle. \n\n### The 80/20 rule of AI drafting\n\nEven with excellent prompts, you should rarely copy and paste an AI output directly into LinkedIn. Adopt the 80/20 rule: Let the AI do 80% of the heavy lifting (structuring the thought, checking spelling, finding the angle), and reserve the last 20% for your own manual editing.\n\nAdd your own \"spice.\" Swap out a polished word for a colloquial one. Add a specific metric from your own career (e.g., changing \"This saved us time\" to \"This cut our onboarding from 14 days to 3\"). \n\n[You can train AI to write in a certain style](https://www.reddit.com/r/SocialMediaMarketing/comments/1pgfgyp/anyone_here_using_ai_to_write_linkedin_posts_that/), but inserting your actual lived experience is what bridges the gap between sounding \"natural\" and sounding uniquely like *you*.\n\n## Best AI LinkedIn tools for writing authentic comments\n\nManaging prompts manually is fine if you only want to leave one or two comments a day. But if you are a sales team trying to warm up 50 accounts, or a founder trying to build a massive top-of-funnel audience, manual copying and pasting breaks down quickly. \n\n[Leaving comments on LinkedIn with AI quickly](https://www.youtube.com/watch?v=pbG0YF7Ufxw) requires dedicated tooling. However, the tool you choose determines whether you build genuine relationships or risk a permanent account ban. \n\nHere are the best AI LinkedIn tools available, categorized by their approach to safety, authenticity, and automation.\n\n### 1. Junior\n\nJunior is built specifically for professionals who want to turn public visibility into direct interviews, pipeline, and client conversations without sacrificing their reputation. \n\nUnlike traditional cloud-based connection tools that blindly spam connection requests and generic comments, Junior focuses entirely on strategic, context-aware engagement. It is an AI-powered LinkedIn automation tool designed to start authentic conversations through smart post commenting.\n\n**Why it stands out:**\nJunior operates differently from almost every other tool on the market because it runs locally on your machine rather than in the cloud. This architectural difference is critical for account safety. Cloud tools trigger LinkedIn's security algorithms because they log in from unfamiliar server IP addresses. Junior acts like a normal human using a normal browser, mimicking natural interaction patterns and keeping your account secure. If you want a deep dive on keeping your account out of restriction, review this [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n**How it handles AI context:**\nInstead of generic prompts, Junior uses your unique bio, current role, and specific networking goals to draft replies. If you are a cybersecurity consultant commenting on a post about data privacy, Junior factors your consulting background into the draft, ensuring the comment sounds like an expert weighing in, rather than a bot regurgitating the post. \n\nBy finding relevant discussions automatically and drafting human-sounding replies, Junior replaces the need for aggressive cold DMs. It allows job seekers and lead gen agencies to bypass crowded inboxes by engaging prospects where they are already active. \n\nFor a direct look at how this approach compares to high-volume messaging platforms, check out [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### 2. Taplio\n\nTaplio is one of the most widely recognized tools in the LinkedIn creator ecosystem. It is primarily built for comprehensive content creation\u2014helping users schedule posts, find viral inspiration, and track their analytics. \n\nTaplio does include AI commenting features, allowing users to reply to posts directly from their dashboard. It generates responses based on the sentiment you select (agree, disagree, question, etc.). \n\n**Tradeoffs to consider:**\nTaplio is a cloud-based platform. While highly convenient for managing multiple accounts or working with a virtual assistant, heavy reliance on cloud-based engagement can sometimes flag LinkedIn's automation detectors if usage spikes unnaturally. Furthermore, because Taplio is built broadly for \"creators,\" its commenting AI sometimes leans toward engagement-bait rather than nuanced, industry-specific B2B relationship building. \n\nIf you are weighing these platforms, reading [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) will help clarify which engagement philosophy better suits your business model.\n\n### 3. Supergrow\n\nSupergrow is another strong contender in the LinkedIn growth space, focusing heavily on audience building and content formatting. It provides excellent carousels, post templates, and formatting tools to make your original content stand out in the feed.\n\nLike Taplio, Supergrow offers AI comment generation to help speed up your daily engagement routine. It is particularly useful for users who want to manage their entire LinkedIn presence (posting and replying) from a single tab.\n\n**Tradeoffs to consider:**\nThe AI models used by broad scheduling tools often lack the deep, personal context required for highly technical or specialized enterprise sales conversations. If your goal is primarily to boost your own post reach by returning favors in the comments, it works well. If your goal is to book meetings with skeptical C-suite executives, you may need a tool more specialized in context-aware drafting. \n\nFor more context on how Supergrow stacks up against specialized commenting tools, review the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n### 4. ChatGPT and Claude\n\nSometimes, the best tool isn't a dedicated LinkedIn software at all, but rather a direct interface with a frontier language model like OpenAI's ChatGPT or Anthropic's Claude. \n\n**Why it stands out:**\nUsing these models manually gives you absolute control over the prompt engineering. You can upload PDFs of your company's whitepapers, paste in a prospect's entire LinkedIn history, and ask the AI to synthesize a highly personalized, deeply insightful comment based on all that unstructured data. Claude, in particular, is known for its nuanced, human-sounding writing style that avoids many of the common AI clich\u00e9s.\n\n**Tradeoffs to consider:**\nThe downside is scale. Manually copying a post, pasting it into ChatGPT, writing a prompt, copying the result, editing it, and pasting it back into LinkedIn takes several minutes per post. If you need to engage with 40 prospects a day, this manual workflow will easily consume two hours of your time. \n\n### 5. Phantombuster\n\nPhantombuster is an established player in the broader data scraping and social media automation market. It allows you to build complex \"Phantoms\" (scripts) that can extract lists of commenters, auto-like posts, and leave pre-written or AI-generated comments at scale.\n\n**Tradeoffs to consider:**\nPhantombuster is powerful, but it is built for mass automation, not nuanced relationship building. Leaving AI comments via cloud-based scraping tools carries a significantly higher risk of account restriction. LinkedIn's detection systems are highly tuned to catch the erratic, non-human navigation patterns that scrapers often leave behind. \n\nIf you are currently using scrapers and want to transition to a more secure model, explore [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) or look into the [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n![Matrix chart comparing LinkedIn commenting tools by account safety, automation type, and comment authenticity.](https://assets.bevisible.app/inline-images/j578csc46fwxjhwn07g46p74pd8f719a/inline-2-1791733648468-3i7k7c.png)\n## Finding the right posts to comment on\n\nWriting a brilliant, context-aware comment is useless if you leave it on a post that no one sees, or on a post written by someone outside your target market. Effective AI commenting requires strategic targeting. \n\nA common mistake sales teams make is commenting blindly on their own company page's posts or on viral posts with 5,000+ comments. In the first scenario, you are trapped in an echo chamber. In the second, your thoughtful comment is buried beneath an avalanche of noise.\n\nThe strategy is to find \"Goldilocks posts.\" These are posts written by your ideal clients or industry peers that have some traction (perhaps 10 to 50 likes) but aren't yet viral. If you drop a high-quality, AI-assisted comment early in the lifecycle of a post like this, you secure top visibility. \n\nTo streamline this process, you need tools that don't just write text, but curate feeds. For a breakdown of how to automate your feed curation, check out the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio). \n\n## Evaluating AI tools for LinkedIn commenting\n\nNot all AI tools are created equal. When evaluating software to manage your LinkedIn presence, you must look beyond the marketing copy and understand the underlying mechanics of how the tool interacts with the platform. \n\nHere are the three primary evaluation criteria:\n\n### 1. The security architecture (Local vs. Cloud)\n\nThis is the most critical factor. LinkedIn actively monitors how accounts access the platform to prevent bot networks from degrading the user experience. \n\n| Feature | Cloud-Based Automation | Local-Based Automation (e.g., Junior) |\n| :--- | :--- | :--- |\n| **IP Address** | Often uses data center IPs, which are easily flagged. | Uses your actual computer's residential/office IP. |\n| **Session Cookies** | Requires exporting session cookies to a third-party server. | Operates directly within your active, secure browser session. |\n| **Interaction Patterns** | Can execute actions instantly, triggering speed limits. | Mimics human scrolling, clicking, and typing delays. |\n| **Risk Profile** | High risk of temporary or permanent account restriction. | Low risk; behavior is virtually indistinguishable from manual use. |\n\nFor a deeper dive into protecting your digital identity while scaling outreach, read up on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### 2. Contextual awareness\n\nDoes the tool know who you are? A good evaluation question to ask a software vendor is: \"If I comment on a post about supply chain logistics, will the AI know that I sell inventory management software and subtly weave that perspective into the draft?\" \n\nIf the tool only looks at the target post and ignores your unique profile, it will generate generic summaries. The best tools, like Junior, ingest your bio and goals, acting as a true proxy for your professional brand.\n\n### 3. Workflow integration\n\nDoes the tool force you to change how you work, or does it augment your existing habits? \n\nSome tools require you to operate entirely within their dashboard, alienating you from the native LinkedIn experience. Others operate as lightweight overlays or browser extensions, allowing you to scroll naturally and call upon the AI only when you spot an opportunity. \n\nTo rate your current tech stack against industry standards, run through this [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) before making a purchasing decision. \n\n![Technical diagram contrasting cloud-based vs local browser-based LinkedIn automation architectures for account safety.](https://assets.bevisible.app/inline-images/j578csc46fwxjhwn07g46p74pd8f719a/inline-3-1791733654696-piubj6.png)\n## Frequently Asked Questions\n\n### Does LinkedIn penalize AI comments?\nLinkedIn does not explicitly ban the use of AI to generate text, provided the text is not spam. However, LinkedIn *does* penalize the use of unauthorized automation tools, scrapers, and bot networks. If your AI comments are posted via a cloud tool that violates their Terms of Service, your account can be restricted. Furthermore, LinkedIn's algorithms are designed to reward meaningful engagement. If your AI comments are low-quality, users will ignore them, and the algorithm will naturally suppress your visibility.\n\n### How many comments should I leave a day for maximum reach?\nQuality scales better than quantity. Leaving 100 generic \"Great post!\" comments will yield worse results than leaving 15 highly targeted, insightful comments on prospects' posts. If you are using local automation like Junior, focus on 20 to 30 high-quality interactions per day. This keeps you well within safe human limits while providing enough surface area to generate inbound profile views and connection requests. \n\nFor a broader look at top-tier engagement strategies this year, explore the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n### What makes a LinkedIn comment \"good\"?\nA good comment achieves three things:\n1. It validates the original author, making them feel heard.\n2. It adds a new piece of information, a unique perspective, or a relevant question that furthers the discussion.\n3. It subtly signals your own expertise without being a blatant sales pitch.\n\n## Turning public visibility into pipeline\n\nWriting better LinkedIn comments with AI is not about tricking people into thinking you are sitting at your keyboard typing every word. It is about scaling your expertise. \n\nWhen you configure AI properly\u2014giving it constraints, feeding it your context, and running it safely on your local machine through tools like Junior\u2014it ceases to be a spam generator. It becomes a tireless research assistant that surfaces opportunities and drafts strong starting points for real conversations. \n\nThe goal of commenting on LinkedIn has never been to simply leave text on a page. The goal is to bypass the crowded DM inbox, prove your competence in public, and earn the right to move the conversation offline. By treating AI as a thought partner and choosing tools built for authenticity rather than sheer volume, you can turn daily engagement into a predictable revenue channel.", "created_at": "2026-10-14T15:19:27.055104+00:00", "updated_at": "2026-10-14T15:19:27.055112+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
