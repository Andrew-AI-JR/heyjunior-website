    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 65, "slug": "best-how-agencies-can-safely-scale-linkedin-engagement-tools-beyond-dripify", "title": "Best How Agencies Can Safely Scale Linkedin Engagement Tools Beyond Dripify", "excerpt": "Discover how agencies can safely scale LinkedIn engagement beyond Dripify. Compare top tools, local execution models, and safe comment-first strategies.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5779r93r883nkr4v2h2rqwpjn8ajqvw/best-how-agencies-can-safely-scale-linkedin-engage-1786025935974-93sifs.png", "published_at": "2026-08-06T14:00:00+00:00", "content": "# Best How Agencies Can Safely Scale Linkedin Engagement Tools Beyond Dripify\n\nManaging LinkedIn outreach across multiple client profiles presents a constant operational trade-off. Lead generation and growth agencies are stuck between two bad options. On one side, running high-volume connection sequences risks getting high-value client accounts temporarily restricted or permanently banned. On the other side, manually commenting on posts and writing personalized messages limits your team to just a few profiles per account manager.\n\nFor years, platforms like Dripify served as the industry default for automated sequence building. They allowed agencies to queue connection requests, profile views, and follow-up DMs in bulk. LinkedIn's detection systems have evolved significantly. The platform now uses sophisticated behavioral heuristics, rate-limiting algorithms, and browser environment monitoring to track automated activity. Cloud-hosted sequences firing identical messaging trees across multiple accounts trigger risk flags faster than ever.\n\nTo build a durable LinkedIn service offering, agencies must shift their strategy. Scaling safety requires moving away from cold inbox invasion and adopting strategic, public-facing engagement powered by localized execution and context-aware AI. \n\nThis guide breaks down the mechanics of safe account scaling, evaluates the best LinkedIn engagement alternatives to Dripify, and provides an actionable operational blueprint for agency teams.\n\n![Diagram comparing cloud server sequence automation with local desktop execution architecture.](https://assets.bevisible.app/inline-images/j5779r93r883nkr4v2h2rqwpjn8ajqvw/inline-1-1786025857337-kiuxgl.png)\n## Why Traditional Drip Tools Like Dripify Put Agency Clients at Risk\n\nTo understand why Dripify and similar cloud sequence tools face increasing friction, you have to look at how LinkedIn detects automation. LinkedIn does not merely count how many messages an account sends in an hour; it evaluates the entire behavioral footprint of the session.\n\n### The Failure Modes of Cloud Sequence Automation\n\n1. **Static Cloud Server IPs and Telemetry Signals**\n   Most traditional drip tools host account actions on shared cloud servers (such as AWS or DigitalOcean) routing through commercial proxy networks. LinkedIn monitors session headers, TLS fingerprints, and hardware canvas details. When an account logs in from a local browser in Chicago and simultaneously executes headless browser requests from a server data center, the security flag triggers immediately.\n\n2. **Inbox Saturation and Decreasing Acceptance Rates**\n   Decision-makers receive dozens of template-based connection requests daily. When an account's connection acceptance rate drops below 20% or receives multiple \"I don't know this person\" responses, LinkedIn's risk score for that account spikes. Drip sequences rely on direct inbox outreach, placing all account health on a low-converting channel.\n\n3. **Mechanized Action Timing**\n   Even when cloud tools randomize delays between actions (for instance, waiting 3 to 7 minutes between invites), the underlying action order remains linear and predictable. Real human users do not perform 20 consecutive connection requests followed by 20 consecutive profile visits at regular intervals.\n\nAgencies managing founders and enterprise executives cannot afford account suspensions. A single restricted profile damages client trust and halts pipeline generation. For a deeper breakdown of how messaging sequences compare to conversation-first approaches, review our comparison on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## The New Safe Scaling Paradigm: Strategic Public Engagement\n\nInstead of forcing cold messages into crowded inboxes, top-performing agencies scale LinkedIn reach by driving public visibility. The logic is straightforward: public engagement on high-performing posts generates profile views, inbound connection requests, and warm direct messages.\n\n### Public Visibility vs. Private Inbox Cold Outreach\n\n| Operational Factor | Private Inbox Outreach (Drip Sequences) | Strategic Public Engagement (Comment-First) |\n| :--- | :--- | :--- |\n| **Primary Risk Vector** | High (Invite caps, spam reports, flag rates) | Very Low (Public actions match organic platform use) |\n| **Conversion Mechanism** | Cold push messaging to unprimed prospects | Inbound interest driven by expert commentary |\n| **Detection Triggers** | Sudden spikes in sent messages/invites | Native interaction rhythms on feed posts |\n| **Account Scalability** | Hard capped by LinkedIn weekly invite limits | Highly scalable through targeted comment volume |\n| **Prospect Perception** | High risk of feeling like sales spam | Perceived as industry thought leadership |\n| **Execution Architecture** | Shared cloud servers and proxies | Local machine execution via organic browser session |\n\nBy refocusing account efforts on public post commenting, agencies bypass weekly connection limits. A well-crafted comment on a viral industry post or a prospect's update gets read by hundreds of potential buyers. When those prospects visit your client's profile, they enter a warm inbound funnel.\n\nTo maintain account health while using automation tools, agencies must ensure their tech stack relies on natural execution patterns. You can review the complete criteria in our guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n![Four key pillars for evaluating safe LinkedIn engagement tools for agencies.](https://assets.bevisible.app/inline-images/j5779r93r883nkr4v2h2rqwpjn8ajqvw/inline-2-1786025860279-svyzoh.png)\n## Key Evaluation Criteria for Agency LinkedIn Tools\n\nWhen evaluating engagement tools beyond Dripify, agencies must look past high-level feature lists and examine the underlying technology. Below are the key selection criteria for choosing software that protects client accounts while scaling volume.\n\n### 1. Execution Architecture (Local vs. Cloud)\nCloud-based tools run on remote servers, making them accessible via web dashboards but vulnerable to platform detection. Local execution tools run directly on the account manager's machine or dedicated client environment, leveraging the actual local browser session, local IP address, and native cookies. This eliminates security flags caused by conflicting geographic sessions.\n\n### 2. Contextual Intelligence and Personalization\nGeneric automation tools generate repetitive, generic comments such as \"Great insights!\" or \"Thanks for sharing!\" LinkedIn's algorithms and users easily spot this spam. Leading tools use advanced AI models trained on specific user profiles, bio context, and target buyer personas to draft insightful, unique responses tailored to the post's core message.\n\n### 3. Workflow Control and Human-in-the-Loop Options\nFull autonomy can lead to brand risk if an AI model misinterprets a sensitive post. Agencies need fine-grained control: options to run on complete autopilot for trusted accounts, or a one-click review queue where account managers can approve or edit drafted comments before publication.\n\n### 4. Feed Sourcing and Discovery Depth\nAn engagement tool is only as good as the posts it selects. Agencies require tools that do not just scrape random keywords, but actively index strategic discussions, industry creators, target prospect activity, and niche topic feeds. Learn how to audit these capabilities using our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## Top Tools for Agencies to Safely Scale LinkedIn Engagement\n\n### 1. Junior: The Local, AI-Powered Commenting Infrastructure\n\n[Junior](https://www.heyjunior.ai/) is an AI-powered LinkedIn automation tool built specifically to start authentic conversations through strategic post commenting rather than generic inbox spam. Designed for sales teams, lead gen agencies, founders, and consultants, Junior replaces cold DMs by identifying relevant industry discussions and drafting context-aware, human-sounding replies based on the user's background, voice, and offer.\n\nUnlike traditional cloud sequence tools like Dripify, Junior runs locally on the user's machine. By executing actions within the native local browser environment, it uses the client's actual IP address and local session patterns, neutralizing account safety risks associated with remote server proxies.\n\n#### Why Junior Leads for Agency Scaling\n* **Local Execution Engine:** Operates directly on the host machine using organic browser sessions, keeping client profiles safe from proxy flags.\n* **Context-Aware AI Generation:** Incorporates detailed client bios, positioning docs, and specific campaign goals to draft insightful comments that sound like a senior executive.\n* **Strategic Post Discovery:** Scans feeds, niche keywords, and target profiles to surface discussions where target prospects are actively engaging.\n* **Hybrid Review Controls:** Allows agencies to switch seamlessly between automatic execution and quick manual review queues for complete quality assurance.\n* **Inbound Conversation Triggering:** Focuses on turning public visibility into profile visits, warm connection requests, and inbound client inquiries.\n\nFor agencies looking to replace outdated sequence tools, Junior offers a safe, scalable approach to building authority. Explore how Junior compares against other alternatives in our roundups on [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) and [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n### 2. HeyReach: Multi-Account Cold Outreach Pooling\n\nHeyReach is designed for outbound sales agencies focused primarily on high-volume connection requests and messaging across dozens of sender profiles. Rather than scaling a single account beyond platform limits, HeyReach pools multiple sender profiles together to distribute cold outreach campaigns.\n\n* **Strengths:** Excellent campaign rotation across multiple sales rep accounts; unified inbox for managing incoming responses; strong CRM webhooks.\n* **Weaknesses:** Still relies heavily on private inbox sequence messaging, which carries higher risk than public engagement strategies.\n* **Best For:** Scale-up lead generation agencies running multi-account cold messaging pools.\n\n### 3. Expandi: Cloud Omnichannel Automation\n\nExpandi remains a major cloud-based platform for running combined LinkedIn and email outreach sequences. It provides dedicated IP addresses for each account and advanced conditional logic builder steps.\n\n* **Strengths:** Robust omnichannel workflow builder; dynamic image personalization; account warm-up protocols.\n* **Weaknesses:** Cloud architecture requires strict proxy management; primary focus remains on inbox sequences rather than public feed presence.\n* **Best For:** Mid-sized agencies running integrated email and LinkedIn connection sequences.\n\n### 4. Taplio: Content Scheduling and Light Engagement\n\nTaplio is primarily a content creation and scheduling platform tailored for personal branding. While it includes basic engagement features, its main focus is helping creators draft posts using AI and schedule content calendars.\n\n* **Strengths:** Comprehensive post scheduling; viral post library for inspiration; built-in AI writing assistant.\n* **Weaknesses:** Lacks local execution architecture for safe automated commenting at scale; engagement features are largely manual or basic web calls.\n* **Best For:** Agencies managing content calendars rather than automated outreach systems. Read our detailed comparison on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) and explore options in [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### 5. PhantomBuster: Modular Scraping and Micro-Workflows\n\nPhantomBuster provides a library of individual scraping and action scripts (\"Phantoms\") that agencies can string together. It offers high flexibility for custom data extraction and specialized actions.\n\n* **Strengths:** Flexible web scraping capabilities; wide range of platform integrations; custom workflow setup.\n* **Weaknesses:** High setup complexity; cloud execution requires careful cookie management to avoid account bans; lacks dedicated AI comment generation engines.\n* **Best For:** Data-driven agencies needing specialized scraping pipelines. Review safer options in our list of [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n## Side-by-Side Comparison of Top Agency Tools\n\n| Tool | Execution Model | Primary Focus | Account Risk Level | Comment AI Quality | Best Agency Use Case |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **Junior** | Local Machine | Public Commenting & Inbound Conversations | Extremely Low | High (Bio-Aware & Contextual) | Safely scaling profile engagement & authority |\n| **Dripify** | Cloud Server | Outbound DM & Connection Sequences | Medium-High | Low (Template/Basic AI) | Traditional connection sequences |\n| **HeyReach** | Cloud Server | Multi-Account Sender Pooling | Medium | N/A (Focuses on DMs) | High-volume cold connection outreach |\n| **Expandi** | Cloud Server | Omnichannel LinkedIn + Email | Medium | Basic | Integrated email and LinkedIn outreach |\n| **Taplio** | Web App / Cloud | Content Creation & Scheduling | Low | Moderate | Content creation and personal branding |\n| **PhantomBuster** | Cloud Server | Data Scraping & Workflow Automation | High (if misconfigured) | Low | Custom growth engineering & list building |\n\nFor a detailed checklist on auditing these tools for account safety, standard operating procedures, and technical setup, consult our [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n![Step-by-step SOP flowchart for agency client LinkedIn engagement pipeline.](https://assets.bevisible.app/inline-images/j5779r93r883nkr4v2h2rqwpjn8ajqvw/inline-3-1786025850554-r5tg28.png)\n## SOP: How Agencies Can Implement a Safe LinkedIn Engagement Workflow\n\nTransitioning client accounts from risky DMs to safe, high-converting public engagement requires an established operational routine. Below is the step-by-step Standard Operating Procedure (SOP) used by leading agencies.\n\n```\nPhase 1: Client Persona Engineering\n  \u2502\n  \u25bc\nPhase 2: Strategic Signal & Feed Sourcing\n  \u2502\n  \u25bc\nPhase 3: Contextual AI Comment Generation\n  \u2502\n  \u25bc\nPhase 4: Localized Execution & Pacing\n  \u2502\n  \u25bc\nPhase 5: Inbound Pipeline Conversion\n```\n\n### Phase 1: Client Persona and Positioning Engineering\nBefore launching any engagement tool, feed the AI engine with high-fidelity context about your client. Create a brand bible containing:\n* **Target Ideal Customer Profile (ICP):** Roles, industries, and main pain points.\n* **Unique Perspective & Value Proposition:** Key methodologies, contrarian industry views, and offer specifics.\n* **Tone & Vocabulary Controls:** Preferred phrases, forbidden buzzwords, and formatting preferences (e.g., short paragraphs, concise statements).\n\nIn Junior, this context is attached directly to the profile profile configuration, ensuring every generated comment sounds like an authentic contribution from the client.\n\n### Phase 2: Strategic Signal Sourcing\nConfigure your tool to track high-intent conversations rather than general feed noise. Focus on four target sources:\n1. **Key Industry Influencers:** Profiles of thought leaders whose posts attract your target buyers in the comment section.\n2. **Target Account Executives:** Posts published directly by decision-makers at target accounts.\n3. **Niche Keyword Topics:** Specific hashtags or keyword searches monitoring acute industry problems.\n4. **Peer Prospects:** Second-degree connections within target industries who post regularly.\n\n### Phase 3: Comment Drafting and Quality Control\nSet operational parameters based on account maturity and client preferences:\n* **For High-Profile Executives:** Enable Review Mode. The tool drafts comments into a quick review queue. An account manager audits, edits if necessary, and approves each comment with a single click.\n* **For Scaled Growth Profiles:** Enable Autopilot Mode within strict guardrails (e.g., maximum 15\u201320 comments per day, spaced naturally throughout business hours).\n\n### Phase 4: Localized Execution and Operational Guardrails\nRun the execution engine locally on dedicated agency machines or localized desktop instances where client browser profiles are already authenticated. Adhere to these safe daily volume limits per profile:\n* **Profile Visits:** 30 \u2013 50 per day\n* **Public Comments:** 10 \u2013 20 high-value comments per day\n* **Connection Requests (Inbound Warm Follow-up):** 5 \u2013 10 per day\n\n### Phase 5: Transitioning Visibility into Pipeline\nPublic engagement naturally drives profile views. Ensure client profiles are optimized as conversion landing pages with clear call-to-action links in their bio. When target prospects view the client profile or like their comments, follow up manually with a warm, contextual message referencing the public discussion.\n\n## Case Scenario: Transforming Client Lead Generation\n\nConsider an agency managing the LinkedIn profile of a founder offering enterprise logistics consulting. \n\n* **Old Approach (Cloud Sequences):** The agency used cloud drip software to send 100 connection requests per week with a direct pitch. Result: 12% acceptance rate, 2 account warnings for invite limits, and zero booked calls over 30 days.\n* **New Approach (Local Comment Engagement via Junior):** The agency configured Junior to monitor posts from supply chain directors and industry analysts. Junior generated 15 insightful comments per day drawing from the founder's framework notes. \n* **Outcome over 30 Days:** The client profile achieved over 1,400 organic views. Target prospects began responding directly to the comments, generating 22 warm connection requests and 6 scheduled discovery calls without sending a single cold invite.\n\nFor additional strategic contexts and tool selections across different agency models, consult our complete guide on [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n## Common Agency Myths About LinkedIn Automation\n\n### Myth 1: \"Rotating Cloud Proxies Prevent Account Restrictions\"\n**Reality:** Proxies only mask IP location. They do not obscure browser fingerprinting differences, headless canvas anomalies, or unnatural behavioral timing. When automated actions occur outside native desktop browsing environments, security algorithms flag the pattern regardless of IP location.\n\n### Myth 2: \"Scaling Requires Increasing Sent Message Volume\"\n**Reality:** Pushing volume through private inbox outreach faces diminishing returns due to widespread spam filters and user fatigue. Scaling value comes from public visibility, where one high-quality comment delivers impressions to hundreds of decision-makers simultaneously.\n\n### Myth 3: \"AI-Generated Comments Sound Like Generic Bot Spam\"\n**Reality:** Early-generation tools relied on basic template prompts or simple language models that produced generic reactions. Modern engines like Junior ingest detailed client bios, positioning strategies, and post context to generate nuanced, technical responses that read as genuine human expertise.\n\n## Frequently Asked Questions\n\n### How many daily LinkedIn comments can an agency safely make per profile?\nFor most established profiles, a safe operational ceiling is 15 to 25 high-quality comments per day. Newer or low-activity accounts should start at 5 to 10 comments daily and gradually warm up over two to three weeks. Quality and context matter far more than raw volume.\n\n### Why are local execution tools safer than cloud sequence tools like Dripify?\nLocal execution tools operate within the actual browser session on the user's host machine, matching local IP addresses, operating system telemetry, and existing browser cookies. Cloud sequence tools execute actions on remote server data centers, creating mismatched session fingerprints that trigger LinkedIn account safety checks.\n\n### Can automated commenting replace cold DM outreach entirely?\nFor high-value consulting, agency services, and B2B enterprise sales, public comment engagement frequently outperforms cold DMs. It establishes authority publicly,priming prospects so that subsequent direct messages are warm, welcome, and contextual.\n\n### How does Junior ensure generated comments align with client brand guidelines?\nJunior builds a tailored knowledge base for each account using client bios, target buyer profiles, preferred talking points, and specific messaging rules. This allows the AI model to generate comments that reflect the client's voice while avoiding forbidden phrases or off-brand topics.\n\nBy replacing risky cold DM sequences with local, strategic public engagement, agencies can protect client accounts while driving consistent lead generation. Explore how [Junior](https://www.heyjunior.ai/) enables safe, scalable growth for your agency's LinkedIn operations.", "created_at": "2026-08-06T14:19:22.347947+00:00", "updated_at": "2026-08-06T14:19:22.347954+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
