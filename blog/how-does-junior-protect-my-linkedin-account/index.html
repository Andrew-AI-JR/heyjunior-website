    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 141, "slug": "how-does-junior-protect-my-linkedin-account", "title": "How Does Junior Protect My Linkedin Account Source Guide", "excerpt": "Learn how Junior protects your LinkedIn account using local execution, human-like commenting, and IP consistency to prevent bans and restrictions.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57d7p1hw0h2p4s0cw45xvz48s8f6h6s/how-does-junior-protect-my-linkedin-account-source-1792599481250-jttuth.png", "published_at": "2026-10-24T16:14:00+00:00", "content": "# How Does Junior Protect My Linkedin Account Source Guide\n\nThere are few things more anxiety-inducing for a founder, job seeker, or sales professional than logging into LinkedIn and seeing the gray \"Account Restricted\" screen. When your professional reputation, pipeline, and job prospects live on a single platform, losing access is a catastrophic failure. \n\nThe immediate culprit is usually automation. Over the last three years, LinkedIn has aggressively cracked down on third-party tools, deploying sophisticated behavioral heuristics, browser fingerprinting, and velocity checks to identify and ban automated accounts. Most professionals know they need to scale their networking to bypass crowded inboxes, but they are rightfully terrified of the compliance risks. \n\nThis creates a tension: you need visibility to generate direct interviews and client conversations, but traditional connection bots put your digital identity on the chopping block. \n\nWhen users ask, \"how does junior protect my linkedin account,\" the answer lies in a fundamental shift away from cloud-based server manipulation and mass cold outreach. Junior operates entirely differently from legacy tools by running locally on your machine, mimicking natural human interaction patterns, and replacing generic spam with context-aware, AI-driven commenting.\n\nHere is a definitive look at the architectural, behavioral, and operational safeguards Junior uses to protect your LinkedIn presence, alongside the foundational security practices every professional must implement.\n\n## The Core Problem: Why LinkedIn Bans Cloud Automation\n\nTo understand how Junior keeps you safe, you have to understand exactly how LinkedIn catches other tools. \n\nMost LinkedIn automation platforms are cloud-based. You provide them with your login credentials or a session cookie, and their servers (often located in completely different geographic regions than you) log into your account to execute actions. \n\nLinkedIn's security infrastructure easily detects this through three primary vectors:\n\n1. **IP and Geolocation Jumping:** If you check your feed from your phone in Chicago at 9:00 AM, and a cloud server executes a connection request from an AWS data center in Virginia at 9:02 AM, the geographic impossibility triggers an immediate security flag.\n2. **Headless Browser Fingerprinting:** Cloud tools use headless browsers (browsers without a graphical user interface) to scrape and interact with pages. LinkedIn reads the underlying signature of these browsers\u2014screen resolution, font rendering, hardware concurrency\u2014and instantly identifies them as non-human.\n3. **Robotic Velocity and DOM Interaction:** Humans click randomly, scroll at variable speeds, and pause to read. Cloud scripts locate specific Document Object Model (DOM) elements and execute actions in milliseconds. This programmatic perfection is a dead giveaway.\n\nFurthermore, cloud tools rely on mass cold Direct Messages (DMs). When you send 100 identical connection requests and 20 people click \"I don't know this person,\" LinkedIn\u2019s algorithm penalizes your account health. High rejection rates are the fastest path to a permanent ban.\n\n## The Architecture of Safety: Local Execution\n\nThe most critical way Junior protects your account is its fundamental architecture. Unlike cloud-based connection tools, Junior runs entirely locally on your machine. \n\n![Comparison diagram showing cloud server automation triggering security flags versus Junior local execution.](https://assets.bevisible.app/inline-images/j57d7p1hw0h2p4s0cw45xvz48s8f6h6s/inline-1-1792599437974-b017xg.png)\nThis means Junior does not require you to hand over your session cookies to a remote server, nor does it ask for your password to run background scripts in a different timezone. Because it operates locally, all network requests originate from your actual IP address. \n\nWhen LinkedIn's security systems analyze the traffic, they see requests coming from the exact same machine, browser, and internet provider that you use for your manual daily browsing. The browser fingerprint matches perfectly. There is no IP jumping. There is no suspicious backend server logging in on your behalf. \n\nBy tying the tool to your local environment, Junior eliminates the primary technical trigger that causes 90% of automated account restrictions. \n\n## Natural Interaction Patterns Over Spray-and-Pray\n\nTechnical safety is only half the battle. Behavioral safety is equally critical. If a human acts like a spammer, LinkedIn will still ban them, regardless of their IP address.\n\nTraditional tools operate on a \"spray-and-pray\" methodology. They scrape lists of thousands of profiles and blast generic cold DMs. This creates friction. Recipients are annoyed by generic pitches, and they frequently report these messages. User reports are a manual override to any algorithm; if real people tell LinkedIn you are spamming them, your account will be restricted.\n\nJunior takes a completely different behavioral approach to generating visibility: strategic post commenting. \n\nInstead of forcing your way into crowded, guarded inboxes, Junior finds relevant discussions in your industry and helps you leave thoughtful, context-aware replies in the public feed. Commenting is a native, encouraged behavior on the platform. It generates goodwill rather than annoyance. When you leave a highly relevant comment on an industry leader's post, you aren't just reaching that leader; you are reaching their entire audience. \n\nBecause Junior reads the post and drafts replies based on your unique bio and goals, the interactions sound distinctly human. This prevents the platform from recognizing repetitive text strings (another common ban trigger) and prevents users from flagging your activity. For more on how the system ensures this quality, you can review the [Best AI LinkedIn tools for writing authentic comments](https://www.heyjunior.ai/blog/best-ai-linkedin-tools-authentic-comments).\n\nBy shifting the strategy from unsolicited private messages to public, value-add conversations, the risk of user-generated spam reports drops to near zero. \n\n## Context-Aware AI Limits Repetitive Footprints\n\nAnother method LinkedIn uses to detect bots is analyzing the text being sent. If an account sends the exact phrase \"Hi [First Name], I noticed we work in the same industry and would love to connect\" fifty times a day, the database easily flags the repetition. \n\nJunior utilizes advanced AI to ensure no two interactions are the same. When you use Junior, it doesn't just pull from a pre-written template bank. It reads the specific content of the target post, analyzes the nuances of the conversation, cross-references your personal bio and professional goals, and generates a unique, tailored response. \n\nThis variability mimics human cognition. If you want to understand how to leverage this without losing your personal voice, exploring [How to write better LinkedIn comments using AI without sounding automated](https://www.heyjunior.ai/blog/write-better-linkedin-comments-ai) provides a deeper look into prompt tuning and persona alignment. The result is a digital footprint that is entirely organic, making algorithmic detection virtually impossible.\n\n## The Myth of Cloud \"Warm-ups\" and \"Dedicated Proxies\"\n\nTo ease user fears, many cloud automation vendors sell features like \"account warm-ups\" and \"dedicated proxies.\" It is vital to debunk these as they offer a false sense of security.\n\n**The Dedicated Proxy Myth:** Cloud tools will assign you a dedicated IP address so it doesn't look like you are sharing a server with 500 other spammers. However, these IP addresses belong to commercial data centers (like AWS, DigitalOcean, or Google Cloud). LinkedIn knows that human beings do not browse social media from commercial server farms. They browse from residential ISPs (like Comcast or AT&T) or corporate office networks. A dedicated data-center IP is a massive red flag. \n\n**The Warm-up Myth:** Cloud tools will slowly increase your outreach volume over weeks to \"warm up\" your account. While gradual scaling is smart, warming up a fundamentally flawed architecture is useless. If you are operating from a headless browser on a server farm, it doesn't matter if you send 5 requests a day or 50. The technical footprint is still compromised.\n\nBecause Junior operates from your actual machine and your actual residential or corporate internet connection, it requires no proxy smoke-and-mirrors.\n\n## Foundational Account Security: The User's Responsibility\n\nWhile Junior handles the technical and behavioral safety of your networking, maintaining a secure LinkedIn account also requires basic cybersecurity hygiene. If a bad actor gains access to your credentials, they can ruin your reputation or lock you out entirely, rendering any automation safety moot.\n\nBased on standard security practices and insights from cybersecurity experts, here is how you must secure the baseline of your account to work in tandem with Junior. \n\n### 1. Enforce Two-Factor Authentication (2FA)\nActivating two-step verification is non-negotiable. This adds a mandatory second layer of security under your **Settings > Sign in & security** dashboard. Security professionals strongly recommend using an authenticator app (like Google Authenticator or Authy) rather than SMS, as SMS can be vulnerable to SIM-swapping attacks [4](https://www.reddit.com/r/cybersecurity_help/comments/1ihh1ei/how_to_secure_my_linkedin_account/). Because Junior runs locally on your authenticated machine, having 2FA enabled will never interfere with its operation\u2014unlike cloud tools that often force you to disable 2FA so their servers can log in unattended.\n\n### 2. Implement Strong, Unique Passwords\nUsing a weak password, or reusing a password from a different site that has been breached, is the leading cause of account takeover. Your password must be long, complex, and entirely unique to LinkedIn [1](https://www.linkedin.com/posts/huizhao8_hello-everyone-my-linkedin-account-was-activity-7371656848233508864-JW5o) [2](https://www.linkedin.com/help/linkedin/answer/a1375084). Employ a reputable password manager to generate and store this credential securely. \n\n### 3. Actively Manage Your Active Sessions\nIt is surprisingly common to log into LinkedIn on a public computer, a former employer's device, or a mobile browser and forget to log out. Regularly navigate to your settings and check your active sessions. Log out of all unused or unknown devices [4](https://www.reddit.com/r/cybersecurity_help/comments/1ihh1ei/how_to_secure_my_linkedin_account/) [5](https://www.linkedin.com/pulse/linkedin-learning-management-system-lms-privacy-intellectual-wtuoc). This protects you from session hijacking, ensuring that the only active tokens belong to your current phone and the local machine running Junior.\n\n![Clean UI wireframe diagram showing recommended LinkedIn account security settings and active session management.](https://assets.bevisible.app/inline-images/j57d7p1hw0h2p4s0cw45xvz48s8f6h6s/inline-2-1792599439190-2r6o2r.png)\n### 4. Audit Connected Third-Party Apps\nOver the years, you may have granted access to various resume builders, portfolio sites, or older productivity tools. Regularly review which third-party applications have access to your account data and revoke access for anything you no longer use.\n\n### 5. Report Phishing and Suspicious Activity\nIf you receive a strange message with a suspicious link, even from a trusted connection, do not click it. Their account may have been compromised. Report the activity to LinkedIn immediately to protect the broader community [3](https://www.linkedin.com/posts/bethkirkdigitalmarketer_four-things-every-linkedin-user-needs-to-activity-7388487964038737920-0Ik3). \n\n## Scaling Your Networking Safely\n\nJunior is designed for professionals who understand that quality trumps sheer volume. For job seekers trying to catch the attention of hiring managers, or consultants looking for high-value leads, sending 1,000 bad messages is less effective than leaving 10 brilliant comments.\n\nIf you are currently navigating a career transition, you can see how this targeted approach works by reading [How to use AI commenting to network on LinkedIn during a job search](https://www.heyjunior.ai/blog/ai-commenting-linkedin-job-search).\n\nTo keep your account safe while scaling, adhere to these pacing rules:\n\n*   **Respect the speed of human reading:** Junior is designed to operate at human speeds. Do not attempt to bypass these guardrails to force it to comment on 100 posts in ten minutes. \n*   **Curate your feed:** The AI is only as good as the content it interacts with. Spend time curating your feed so that Junior is commenting on relevant, high-quality industry posts rather than low-effort engagement bait.\n*   **Engage manually too:** Ensure that your account still shows varied activity. Like posts, share articles, and reply to your own DMs manually. A healthy account features a diverse mix of interaction types.\n\n## Comparing Risk Profiles: A Structural View\n\nTo crystallize the difference in account protection, consider how different approaches handle the primary failure points of LinkedIn automation.\n\n| Risk Factor | Traditional Cloud Automation | Junior (Local AI Automation) |\n| :--- | :--- | :--- |\n| **IP Location** | Uses commercial data center IPs, triggering geographic security flags. | Uses your local network IP, matching your normal browsing behavior exactly. |\n| **Browser Fingerprint** | Relies on headless browsers which are easily identified by anti-bot scripts. | Operates within your actual, active browser environment. |\n| **Action Type** | Mass cold connection requests and DMs, leading to high user rejection rates. | Strategic, public post commenting that generates positive engagement and views. |\n| **Content Uniqueness** | Spun text or identical templates leading to algorithmic detection. | Context-aware AI generation tailored to specific post nuances and your personal bio. |\n| **2FA Compatibility** | Often requires disabling 2FA or handing over backup codes to remote servers. | Completely compatible with strict 2FA since it runs on an already-authenticated local session. |\n\nThis structural difference is why reviews from heavy users consistently highlight account longevity. For more on user experiences regarding safety and efficacy, you can explore the [Heyjunior Reviews From Job Seekers Source Guide](https://www.heyjunior.ai/blog/heyjunior-reviews-job-seekers-guide).\n\n## Frequently Asked Questions About Junior and Account Safety\n\n**Does Junior bypass LinkedIn's daily action limits?**\nNo. Bypassing rate limits is the fastest way to get banned. Junior is designed to work well within LinkedIn's natural daily action thresholds. It focuses on high-converting public interactions rather than burning through action limits with ignored DMs.\n\n**Do I need to leave my computer on and browser open?**\nYes. Because Junior protects your account by running locally, your machine must be on and awake for it to operate. This is a feature, not a bug. It ensures that activity only happens when a human would realistically be at their desk, further solidifying the natural appearance of the activity.\n\n**Will people know an AI wrote my comment?**\nNot if properly configured. Junior doesn't write generic \"Great post!\" comments. It synthesizes the post's content and injects your specified viewpoint and expertise. It sounds like you, just faster. If you are comparing options, looking at the [Best LinkedIn networking tools for job seekers to land interviews](https://www.heyjunior.ai/blog/best-linkedin-networking-tools-job-seekers) will show why context-awareness is the dividing line between sounding like a bot and sounding like a peer.\n\n**Does Junior need my LinkedIn password?**\nAbsolutely not. Because it runs locally, it operates alongside your active, authenticated browser session. You never hand over your credentials.\n\n## Moving Forward with Confidence\n\nProtecting your LinkedIn account does not mean abandoning automation; it means abandoning outdated, brute-force tactics that treat professional networking like a spam campaign. \n\nThe platform's algorithms are designed to penalize unnatural behavior and reward genuine contribution. By running locally to eliminate technical red flags, and leveraging AI to participate meaningfully in public discussions rather than invading private inboxes, Junior aligns your automation efforts with LinkedIn\u2019s own goals. \n\nCombine this architectural safety with rigorous personal cybersecurity habits\u2014like mandatory 2FA and strict session management\u2014and you can scale your visibility, secure direct interviews, and build pipeline without fearing the \"Account Restricted\" screen. Authentic networking remains the most powerful lever for career and business growth, provided you protect the digital identity that powers it.", "created_at": "2026-10-24T16:19:22.552921+00:00", "updated_at": "2026-10-24T16:19:22.552928+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
