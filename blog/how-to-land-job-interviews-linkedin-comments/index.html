    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 57, "slug": "how-to-land-job-interviews-linkedin-comments", "title": "How to land job interviews using strategic LinkedIn commenting", "excerpt": "Stop relying on Easy Apply. Learn how to use strategic LinkedIn commenting to bypass crowded recruiter inboxes and land inbound job interviews.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57agt4depqh2gmq0etc4pz4cn8ak86g/how-to-land-job-interviews-using-strategic-linkedi-1785334767926-57tj1d.png", "published_at": "2026-07-29T14:00:00+00:00", "content": "# How to land job interviews using strategic LinkedIn commenting\n\nThe \"Easy Apply\" button is a trap. If you are a job seeker actively hunting for your next role, you already know the sinking feeling of sending your carefully crafted resume into the abyss of an Applicant Tracking System (ATS), only to receive an automated rejection email three weeks later. \n\nRecruiters are currently drowning in unprecedented application volumes. AI resume builders and automated application bots have made it effortless for unqualified candidates to spam job postings. When a single mid-level product management role receives 1,400 applications in 48 hours, recruiters stop looking at the inbound queue. Instead, they turn to proactive sourcing. They go looking for candidates themselves.\n\nThe fastest way to stand out isn't applying more; it is intercepting recruiters where they already spend their time: the LinkedIn feed. \n\nGetting recruiter interviews through LinkedIn comments involves moving beyond passive job searching and actively building a reputation as a knowledgeable expert. By engaging strategically on the timeline, you increase your visibility to hiring professionals who use LinkedIn's activity signals to rank candidates. Avoiding engagement can genuinely hamper your job search results because the true power of the platform comes from being active [[2]](https://www.linkedin.com/pulse/how-attract-recruiters-double-your-interviews-only-15-jessica-kenle).\n\nThis guide breaks down a precise, tactical workflow to displace existing search results, bypass the ATS, and turn your LinkedIn activity into a predictable pipeline of recruiter interviews.\n\n## The hidden mechanics of LinkedIn recruiter search\n\nTo understand why commenting works, you have to understand how recruiters use the platform. Recruiters do not use the standard LinkedIn interface. They use LinkedIn Recruiter, an expensive enterprise tool with its own proprietary search algorithm. \n\nWhen a recruiter searches for a \"Senior Data Analyst in Chicago,\" the algorithm doesn't just rank candidates alphabetically or by tenure. It ranks them by relevance and *likelihood to respond*. \n\nLinkedIn's algorithm heavily factors in \"Activity\" and \"Engagement\" scores. If two candidates have identical work histories, the candidate who regularly comments, posts, and interacts on the platform will appear higher in the recruiter's search results. Furthermore, recruiters can actively filter their searches by candidates who have \"Engaged with your talent brand\" (i.e., interacted with the company's posts or employees).\n\nBeyond algorithmic ranking, commenting provides immediate social proof. If a hiring manager posts a challenge their team is facing, and you leave a highly insightful comment solving part of that problem, you instantly bypass the resume screen. You have just demonstrated your competence in public. \n\nThis is how you get recruiters and hiring managers to find you more on LinkedIn so you can get more job opportunities [[3]](https://www.youtube.com/watch?v=rG0jfnb60tc). You stop being a static PDF and become a visible, active practitioner in your field.\n\n## Phase 1: Optimize your profile for the \"comment click-through\"\n\nBefore you write a single comment, your profile must be ready to capture the attention you generate. \n\nWhen you leave a comment on a LinkedIn post, the reader only sees three things: your name, your profile picture, and the first 40 to 60 characters of your headline. Your headline is your ad copy. If your headline reads \"Actively looking for new opportunities\" or \"Unemployed Professional,\" you are wasting your most valuable real estate. Desperation does not drive click-throughs; specific value does.\n\n![A diagram highlighting the critical elements of a LinkedIn profile optimized for recruiter click-throughs](https://assets.bevisible.app/inline-images/j57agt4depqh2gmq0etc4pz4cn8ak86g/inline-1-1785334691469-6h6ere.png)\n### The headline formula\n\nYour headline should act as a micro-billboard. It needs to tell a recruiter exactly what you do, the value you bring, and your niche. If you don't have the specific keywords they are matching on your profile, you are likely never going to pull up in those searches [[4]](https://www.youtube.com/watch?v=3wynufB7NrI&t=193).\n\nInstead of \"Job Seeker,\" use this structure: \n**[Target Title] | [Key Specialty/Niche] | [Quantifiable Value or Proof Point]**\n\n*   **Bad:** Software Engineer looking for work\n*   **Good:** Senior Full-Stack Engineer | React & Node.js | Scaled SaaS platforms to 100k+ MAU\n*   **Bad:** Marketing Manager\n*   **Good:** B2B Product Marketing Manager | Enterprise SaaS | Drove $4M Pipeline in 2025\n\n### Open to Work settings\n\nYou want recruiters to know you are available, but you don't necessarily need the green banner on your profile picture, which can sometimes subconsciously signal a lack of leverage. Instead, utilize the backend settings. \n\nGo to your profile, click \"Open to,\" and select \"Finding a new job.\" Choose the titles, locations, and work types you want. Most importantly, set the visibility to \"Recruiters only.\" This signals to users on the LinkedIn Recruiter platform that you are open to being pitched, without broadcasting it to your entire timeline. This subtle LinkedIn hack will have recruiters coming to you by signaling intent to the right audience [[5]](https://www.youtube.com/watch?v=_49Oc34MfVQ).\n\nIf you want more insights on optimizing your foundation before scaling your engagement, review our guide on [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) to see how top creators set up their profiles to capture traffic.\n\n## Phase 2: Building your comment target list\n\nCommenting randomly on trending posts about leadership or generic motivational quotes will not get you a job. It will get you likes from bots, but it won't put you in front of a hiring manager. You need to be hyper-targeted.\n\nYou should identify and engage with three distinct groups of people:\n\n### 1. Hiring Managers at your target companies\n\nThese are the people who actually feel the pain of an empty seat on their team. They are the Directors, VPs, and Heads of Departments. If you can impress them with a comment, they will bypass the recruiter entirely and ask for an interview.\n\n**How to find them:**\n*   Go to a target company's LinkedIn page.\n*   Click on \"People.\"\n*   Search for titles related to your manager (e.g., \"Director of Engineering\", \"VP of Marketing\").\n*   Check their \"Activity\" tab to see if they post or comment regularly. If they do, ring the notification bell on their profile so you are alerted when they publish.\n\n### 2. Internal Recruiters and Talent Acquisition\n\nInternal recruiters post frequently about company culture, hiring initiatives, and specific open roles. Engaging intelligently with their content keeps your name top-of-mind when a relevant requisition crosses their desk.\n\n**How to find them:**\n*   Use LinkedIn search: `\"Talent Acquisition\" OR \"Technical Recruiter\" AND \"[Company Name]\"`\n*   Filter by \"Posts\" to see who is actively talking about hiring.\n\n### 3. Industry Voices and Peers\n\nThese are people in your exact field who have a following. If you are a UX Designer, find the top UX Design voices on the platform. By leaving insightful comments on their high-traffic posts, you expose your headline to thousands of other UX professionals and recruiters who are reading that thread.\n\nFinding these specific posts manually every day can become exhausting. If you want to streamline this part of the process, you might explore the [best tools to find relevant Linkedin posts to comment on tools beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) to build a focused feed.\n\n![A 2x2 targeting matrix showing who to comment on for maximum job search impact](https://assets.bevisible.app/inline-images/j57agt4depqh2gmq0etc4pz4cn8ak86g/inline-2-1785334670866-ob9vgz.png)\n## Phase 3: The anatomy of an interview-winning comment\n\nOnce you have found the right post, what do you say? \n\nThe biggest mistake job seekers make is leaving \"low-effort\" comments. Phrases like \"Great post!\", \"Totally agree!\", or \"Thanks for sharing!\" do nothing for your visibility. They provide no value, demonstrate no expertise, and give the author nothing to respond to. \n\nAn interview-winning comment must demonstrate context, add unique value, and invite a response.\n\n### The 4-Part Commenting Framework\n\nTo write comments that act as mini-interviews, use this structure:\n\n1.  **The Hook/Acknowledgement:** Acknowledge their specific point to show you actually read the post.\n2.  **The Value-Add:** Introduce a new perspective, a data point, or a specific framework.\n3.  **The Evidence:** A brief mention of your experience to build authority.\n4.  **The Handoff:** An open-ended question to keep the conversation going.\n\nLet's look at this framework in action. Imagine a VP of Sales posts: *\"Cold calling is dead. If you aren't doing social selling in 2026, you are going to miss your quota.\"*\n\n*   **The Bad Comment:** \"Great insight, I totally agree. Social selling is the future!\"\n*   **The Interview-Winning Comment:** \"I agree that social selling is critical, but I've found it doesn't replace cold calling\u2014it warms it up **(Hook)**. In my last quarter, we shifted to a 'Social First, Call Second' sequence **(Value-Add)**. By commenting on a prospect's post two days before the cold call, our connection rates jumped by 40% because the name was familiar **(Evidence)**. Are you having your team replace calls entirely, or just changing the sequencing? **(Handoff)**\"\n\nIf you are a VP of Sales reading that comment, you aren't looking at a \"job seeker.\" You are looking at a competent, data-driven sales professional who understands pipeline dynamics.\n\n### Five specific comment angles to try\n\nIf you are struggling to come up with responses, lean on these five angles:\n\n| Comment Angle | Best Used When... | Example Approach |\n| :--- | :--- | :--- |\n| **The \"Yes, And...\"** | You agree with the author and want to build on their point. | \"Spot on. I'd add that step 3 usually fails if you don't secure executive buy-in early. In my experience...\" |\n| **The Polite Disagreement** | The author posts a definitive statement that has nuance. | \"Interesting take, though I've seen the opposite in enterprise SaaS. Usually, the bottleneck isn't X, it's Y...\" |\n| **The Case Study** | The author posts theoretical advice. | \"I actually implemented this exact framework last year during our Q3 launch. The biggest surprise was...\" |\n| **The Clarifying Question** | The author shares a high-level concept. | \"Love this mental model. How do you adjust this when dealing with legacy tech debt vs greenfield projects?\" |\n| **The Tag-In** | You know someone else whose expertise perfectly fits the post. | \"This reminds me of the research @JaneDoe published last week on user retention. The overlap is fascinating...\" |\n\n![A comparison showing the structure of an interview-winning comment versus a generic comment](https://assets.bevisible.app/inline-images/j57agt4depqh2gmq0etc4pz4cn8ak86g/inline-3-1785334675247-7qnzq2.png)\n## Phase 4: The 30-Day LinkedIn Commenting Sprint\n\nGetting 5+ interviews in 30 days without burning out requires a structured approach [[1]](https://www.linkedin.com/posts/coachshreyamehta_heres-how-id-use-linkedin-to-get-5-interviews-activity-7382399900380000256-9zeD). You cannot comment sporadically and expect results. You need a disciplined sprint.\n\nHere is a tactical 30-day schedule to follow:\n\n### Week 1: Foundation and Observation\n*   **Objective:** Optimize profile and build your target list.\n*   **Action items:**\n    *   Rewrite headline using the formula.\n    *   Set \"Open to Work\" backend settings for recruiters.\n    *   Identify 20 target companies.\n    *   Follow 3-5 decision-makers (Hiring Managers, VPs, Directors) at each company.\n    *   Follow 10 prominent internal recruiters in your industry.\n*   **Commenting Goal:** Leave 2 high-quality comments per day on industry peers' posts to get comfortable with the framework.\n\n### Week 2: Engaging the Targets\n*   **Objective:** Start appearing in the notifications of decision-makers.\n*   **Action items:**\n    *   Monitor the activity feed of your target list.\n    *   When a target posts, be one of the first to comment using the 4-Part Framework.\n    *   If a target comments on *someone else's* post, reply thoughtfully to their comment.\n*   **Commenting Goal:** 5 high-quality comments per day (3 on decision-makers, 2 on recruiters or industry voices).\n\n### Week 3: Escalation and Connection\n*   **Objective:** Turn comment threads into direct connections.\n*   **Action items:**\n    *   If a Hiring Manager or Recruiter replies to your comment, reply back, and then send a connection request.\n    *   **Connection Note Script:** *\"Hi [Name], loved our back-and-forth in the comments on your post about [Topic]. Wanted to connect here to keep following your content!\"* (Do NOT mention you are looking for a job yet).\n*   **Commenting Goal:** 5-7 high-quality comments per day.\n\n### Week 4: The Soft Pitch\n*   **Objective:** Transition newly established connections into exploratory chats.\n*   **Action items:**\n    *   For targets who have accepted your connection request and engaged with you multiple times in the feed, transition to the DMs.\n    *   **The Soft Pitch Script:** *\"Hi [Name], really enjoying your content lately. I noticed [Company] is scaling the [Department] team. Given my background in [Your Niche] and the work we discussed regarding [Previous Comment Topic], I'd love to drop my resume in your inbox in case it's a fit for any current or future roles. Either way, keep the great posts coming!\"*\n*   **Commenting Goal:** Maintain 5 comments per day to keep the algorithm feeding your profile to recruiters.\n\n![A 30-day timeline schedule for the LinkedIn commenting sprint strategy](https://assets.bevisible.app/inline-images/j57agt4depqh2gmq0etc4pz4cn8ak86g/inline-4-1785334686405-k13va3.png)\n## How to automate the strategy safely (Without sounding like a bot)\n\nThe 30-Day Sprint is highly effective, but it is also time-consuming. Finding the posts, reading them, synthesizing an intelligent response, and tracking your targets can easily eat up two hours a day. When you are already stressed about job hunting, this level of manual effort leads to burnout.\n\nThis is where automation comes in\u2014but you must use it correctly. \n\n### The danger of generic AI and cloud automation\n\nIn a rush to save time, many job seekers turn to basic AI extensions. They click a button, and the AI generates a comment like, *\"Wow, this is a truly fascinating perspective on B2B marketing. I completely agree with your insightful points!\"*\n\nRecruiters and hiring managers can spot these generated comments instantly. They read as hollow, generic, and devoid of personal experience. If a hiring manager suspects you are using a bot to spam their posts, they will block you, completely ruining your chances at that company. \n\nFurthermore, many legacy automation tools run in the cloud and use virtual IP addresses to scrape LinkedIn and post on your behalf. LinkedIn's security algorithms aggressively flag this behavior. If you use cloud-based tools, you risk getting your account restricted or permanently banned right when you need it most. For a deep dive into these risks, review the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### The strategic approach: Local, context-aware AI\n\nThe goal of automation shouldn't be to replace your brain; it should be to eliminate the friction of drafting. This is the exact philosophy behind Junior.\n\nUnlike cloud-based connection spammers, Junior is an AI-powered automation tool that runs locally on your own machine. This local execution mimics natural human behavior, protecting your account safety and bypassing the restrictions that catch cloud tools. (If you are migrating away from risky cloud tools, check out these [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) and [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster)).\n\nMore importantly, Junior solves the \"generic bot\" problem. It doesn't just read the post and spit out a summary. Junior is designed to understand *you*. It takes your unique bio, your specific career goals, and your past experiences, and uses them to draft context-aware, human-sounding replies.\n\nWhen a hiring manager posts about a challenge, Junior finds that relevant discussion, analyzes the context, references your configured bio (e.g., your 5 years in SaaS product management), and drafts a thoughtful response. You maintain full control to edit, tweak, and approve the comment before it goes live. \n\nIt replaces the cold DM approach with warm, authentic public conversations. This allows you to scale your visibility to dozens of target accounts daily, turning public engagement into direct interviews, without sacrificing quality or risking an account ban. For more on how this compares to legacy tools, see [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\nIf you want to maintain high volume while ensuring your comments actually sound like a seasoned professional, you need tools built specifically for context, not just scale. You can read more about evaluating these next-generation options in the [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) and our roundup of the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n## Handling the inbound: When recruiters reach out\n\nIf you consistently deploy the 4-part commenting framework on the right posts, optimizing your headline to drive clicks, the dynamic of your job search will flip. Instead of you chasing recruiters, they will start appearing in your inbox.\n\nThe message usually looks like this:\n*\"Hi [Name], I've been seeing your comments on [Hiring Manager's] posts lately and really appreciate your insights on [Topic]. We actually have an open role for a [Title] on that exact team. Are you open to a quick chat this week?\"*\n\nWhen this happens, you have the leverage. Here is how to handle the inbound request effectively:\n\n1.  **Respond Promptly:** Do not play hard to get. Reply within 24 hours.\n2.  **Acknowledge the Context:** Reference the shared connection or post that brought them to you.\n3.  **Provide Easy Scheduling:** Do not make them work to book a time. Offer specific windows.\n\n**The ideal response script:**\n*\"Hi [Recruiter Name], great to connect! Yes, I really enjoy [Hiring Manager's] perspectives on [Topic]\u2014they align closely with how we tackled similar challenges at my last company. I am open to a conversation about the [Title] role. I'm available Tuesday at 10 AM or Thursday at 2 PM EST. Let me know if either works, or if you prefer I use a booking link. Looking forward to it.\"*\n\nBecause you generated this interview through public thought leadership rather than a faceless application, you will enter the interview process with built-in credibility. The hiring manager already knows how you think. You aren't just a resume; you are a vetted peer.\n\nIf you are a consultant or freelancer looking to pivot this strategy toward client acquisition rather than W2 employment, the mechanics are similar. Focus heavily on founder and executive content, and avoid aggressive automated pitching. Learn more about this distinction in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Mistakes to avoid when commenting for jobs\n\nAs you execute this strategy, watch out for these common failure modes that can sabotage your efforts:\n\n### 1. The \"Hire Me\" desperation comment\nNever ask for a job in the comments section of a public post. Replying to a company update with *\"I applied for the Marketing Manager role three weeks ago, can someone look at my resume?\"* is uncomfortable for the author and makes you look unprofessional. Public comments are for adding value. Private DMs are for logistics and pitches.\n\n### 2. Disagreeing disrespectfully\nContrarian takes can generate massive visibility, but tone is everything. If you aggressively tear down a hiring manager's post to prove how smart you are, they might remember you, but they will never hire you. They will flag you as a culture risk. Always use the \"Polite Disagreement\" framework. Attack the problem, never the person.\n\n### 3. Inconsistency\nCommenting for three days, getting discouraged, and giving up will yield zero results. The LinkedIn algorithm needs time to recognize your activity patterns, and humans need repeated exposure (the Mere Exposure Effect) to build trust. If you are struggling with consistency, explore [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) to learn how to maintain a steady presence even on busy days.\n\n## Frequently Asked Questions (FAQs)\n\n### Do I need LinkedIn Premium to get interviews this way?\nNo. While LinkedIn Premium gives you more InMail credits and profile views, the core commenting strategy relies entirely on free features. Commenting on public posts is unrestricted. However, having Premium can be helpful to see exactly which recruiters are viewing your profile after you leave a high-visibility comment.\n\n### What if my current employer sees my comments?\nThis is a common fear for passively employed job seekers. The beauty of this strategy is that commenting on industry trends is viewed as standard professional networking, not job hunting. As long as you aren't leaving \"hire me\" comments, your current employer will just see you being active in your field. Just ensure your backend \"Open to Work\" setting is set to \"Recruiters only.\"\n\n### How long until I see results?\nIf you follow the 30-Day Sprint framework diligently (5 high-quality comments daily on targeted accounts), you will typically see an increase in profile views within 7 days, inbound connection requests from industry peers within 14 days, and recruiter conversations within 21 to 30 days.\n\n## Turning visibility into your next career move\n\nThe era of sending 500 identical resumes into ATS black holes is ending. The highest-leverage activity you can do for your career is to stop hiding behind a PDF and start thinking out loud in front of the people who have the power to hire you.\n\nBy optimizing your headline, targeting the right decision-makers, providing genuine value in your replies, and utilizing safe, context-aware tools like Junior to scale your efforts, you bypass the crowded inbox entirely. You shift from an applicant begging for a chance to an industry professional being invited to the table.\n\nStart with one comment today. Find a hiring manager at a company you respect, read their latest post, and add your perspective. The interviews will follow.\n```", "created_at": "2026-07-29T14:49:22.999984+00:00", "updated_at": "2026-07-29T14:49:22.999992+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

                },
                {

                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,

                }

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;

                    ${btn.icon} ${btn.name}

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
