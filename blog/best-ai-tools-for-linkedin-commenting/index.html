    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 132, "slug": "best-ai-tools-for-linkedin-commenting", "title": "Best AI tools for LinkedIn commenting and authentic networking", "excerpt": "Discover the best AI tools for LinkedIn commenting. Compare Chrome extensions, cloud suites, and local AI automation to safely grow pipeline and authority.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575gsy4c3qb8kgf9ytrn9vgh18f6ced/best-ai-tools-for-linkedin-commenting-and-authenti-1791820165395-5p6k7g.png", "published_at": "2026-10-15T15:41:00+00:00", "content": "# Best AI tools for LinkedIn commenting and authentic networking\n\nIf you want to build a pipeline, find a job, or recruit top talent on LinkedIn right now, the primary battleground has shifted. The inbox is heavily guarded. Decision-makers receive dozens of automated cold messages daily, most of which are instantly archived. The new open channel for B2B relationship building is the LinkedIn feed\u2014specifically, the comment section. \n\nStrategic commenting puts your insights directly in front of your target audience, right where they are actively engaging. But manually finding the right conversations and crafting thoughtful replies takes hours. This bottleneck has led to an explosion of AI tools designed to scale LinkedIn engagement.\n\nHowever, not all AI tools are built the same. The market is split between lightweight browser extensions that require constant manual scrolling, and massive cloud-based growth suites that risk getting your account restricted for unapproved automation. Finding the right software means balancing speed, contextual intelligence, and absolute account safety.\n\nIn this guide, we will evaluate the current landscape of LinkedIn AI commenting tools, dissect the hidden risks of cloud automation, and explore how to generate authentic, pipeline-driving conversations without sounding like a chatbot.\n\n## The strategic shift from inbox to the public feed\n\nB2B buyers, recruiters, and founders are exhausted by connection requests that immediately transition into a hard pitch. When you send a cold direct message, you are interrupting someone's day in a private space. When you leave a highly relevant, context-aware comment on their public post, you are validating their ideas in front of their peers. \n\nPublic visibility changes the psychology of the interaction. A thoughtful comment acts as a micro-audition for your expertise. It bypasses the natural defensiveness triggered by a cold DM. Over time, consistent commenting on a prospect's posts builds a sense of familiarity. When you eventually do send a direct message, it\u2019s no longer cold\u2014it\u2019s a continuation of an ongoing public conversation.\n\n![Hand-drawn comparison diagram contrasting the failure of cold direct messages with the success of public LinkedIn commenting.](https://assets.bevisible.app/inline-images/j575gsy4c3qb8kgf9ytrn9vgh18f6ced/inline-1-1791820117582-15gi1y.png)\nThis approach is highly effective, but it breaks down completely if the comments lack substance. The early wave of AI commenting tools damaged personal brands by flooding the platform with variations of, \"Great post! I completely agree.\" To actually turn visibility into direct interviews, pipeline, and client conversations, you need tools that understand the nuanced context of the original post and your specific professional background.\n\nFor a deeper look at replacing outdated messaging strategies with public engagement, read our comparison on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Evaluating the three tiers of LinkedIn commenting software\n\nWhen evaluating AI tools for LinkedIn commenting, they generally fall into three distinct categories. Each comes with its own workflow requirements, safety profile, and level of automation.\n\n| Tool Category | How It Works | Account Safety Profile | Best Used For |\n| :--- | :--- | :--- | :--- |\n| **Chrome Extensions** | Live in the browser feed. Requires manual scrolling. Generates text via a button under posts. | High. You are manually clicking and browsing, mimicking normal behavior. | Casual networking, users who spend hours scrolling the feed anyway. |\n| **Cloud Growth Suites** | Aggregate posts into a dashboard. Auto-generate replies. Run on remote servers using session cookies. | Low to Medium. LinkedIn frequently flags server IP jumps and unauthorized API usage. | High-volume agency work where account churn is an accepted risk. |\n| **Local AI Automation** | Runs directly on your machine. Automates the discovery and drafting process using native browser behavior. | High. Engages from your actual device and IP address, avoiding cloud detection triggers. | Founders, sales teams, and job seekers who need scale but cannot risk their accounts. |\n\nLet's break down the major players in each category.\n\n## Top AI Chrome extensions for real-time browsing\n\nBrowser extensions are the most common entry point for professionals experimenting with AI on LinkedIn. They inject an interface directly into the LinkedIn website, usually placing a small generation icon next to the standard \"Comment\" button. Because they operate while you are manually browsing, they are relatively safe from an automation-detection standpoint.\n\n### Popnow: Contextual variety\nPopnow focuses heavily on giving users multiple angles for a single reply. When you click its extension button, the tool scans the original post and serves up several distinct comment options\u2014ranging from a contrarian take to a supportive addition. \n\nThe primary strength of Popnow is its ability to inject your specific job title or niche into the prompt. If you are a supply chain consultant, the AI will attempt to reframe the post's topic through a logistics lens. The downside is that you are still bound to the standard LinkedIn feed algorithm; you have to manually scroll through irrelevant updates to find posts worth commenting on.\n\n### AuthoredUp: Formatting and precision\nAuthoredUp is widely known as a post-drafting and formatting tool for creators, but its extension capabilities make it a strong contender for engagement. While it doesn't automate the ideation process as aggressively as others, its overlay ensures that your comments are structurally sound. \n\nIf you are dropping a multi-paragraph, high-value comment (essentially a mini-post), AuthoredUp allows you to preview how the text will appear on different devices, ensuring your line breaks and hooks aren't buried beneath the \"See more\" button. It is less of an AI generation engine and more of a precision writing assistant.\n\n### HappyInAI: Focused networking\nHappyInAI attempts to bridge the gap between commenting and outreach. It generates context-aware comments while also suggesting personalized connection requests based on the interaction. \n\nThis tool works well for job seekers who want to comment on a hiring manager's post and immediately follow up with a relevant connection request. However, like all Chrome extensions, the workflow is fundamentally manual. You are responsible for curating the targets, finding their recent activity, and triggering the software. \n\nIf you want to read more about moving past basic extension functionality, check out our breakdown of the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n## All-in-one cloud growth suites\n\nIf you are managing a heavy personal branding strategy or running engagement for an entire sales team, the manual scrolling required by Chrome extensions quickly becomes a massive time sink. This is where cloud-based growth suites enter the market.\n\n### The Taplio approach to engagement\nTaplio is arguably the most recognizable name in the LinkedIn growth space. It trains its AI models on a vast database of top-performing posts to help users write content, schedule posts, and engage with peers.\n\nFor commenting, Taplio allows you to create specific queues or lists of creators, prospects, or industry leaders. Instead of relying on the standard LinkedIn feed, Taplio pulls their latest posts into a clean, centralized dashboard. You can then rapidly read through these curated posts and use their AI to draft replies without ever opening the native LinkedIn interface.\n\n### The hidden risk of cloud-based engagement\nThe efficiency of cloud tools comes with a significant security tradeoff. To perform actions on your behalf without requiring you to be logged into the platform locally, cloud suites rely on session cookies. You provide the software with your LinkedIn login cookie, and their remote servers mimic your account.\n\nLinkedIn\u2019s security infrastructure has become incredibly aggressive in cracking down on unapproved automation. When a request to post a comment comes from an IP address in an AWS data center in Virginia, but your phone is currently active in London, LinkedIn's behavioral systems flag the anomaly. Continued use of cloud-based session cookies often leads to account warnings, shadowbans, or permanent restrictions. \n\nFor professionals whose livelihoods, sales pipelines, or job prospects rely on their LinkedIn accounts, risking a permanent ban for the sake of efficiency is a terrible trade. For a closer look at this specific comparison, you can review [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n## Local AI automation: Scaling authentic conversations safely\n\nThe current market forces users into a frustrating compromise: use a safe Chrome extension and spend hours manually searching for posts, or use an efficient cloud suite and risk your account. \n\nThis gap in the market is exactly why local AI automation tools like Junior exist. \n\nJunior is designed to start authentic conversations through strategic post commenting, replacing the need for spammy cold DMs. Instead of operating on remote cloud servers, Junior runs locally on your own machine. It utilizes your actual browser profile, IP address, and natural interaction patterns. To LinkedIn's security systems, the activity looks exactly like you sitting at your desk, clicking and typing.\n\n![Diagram comparing cloud session cookie automation risks against safe local browser AI automation.](https://assets.bevisible.app/inline-images/j575gsy4c3qb8kgf9ytrn9vgh18f6ced/inline-2-1791820113041-grc106.png)\n### How local AI transforms the workflow\nBeyond safety, the real advantage of local AI is the depth of personalization. Generic AI comments fail because they lack context about *you*. Junior drafts human-sounding replies based entirely on the unique bio, tone, and strategic goals you define during setup. \n\nThe workflow looks completely different than standard extensions:\n1. **Target Curation:** You define your target audience (e.g., SaaS founders in healthcare, hiring managers at Series B startups, or specific lead gen agencies).\n2. **Automated Discovery:** The software actively finds relevant discussions and posts from these specific individuals.\n3. **Contextual Drafting:** Junior reads the original post and references your personalized bio to draft a highly relevant, intelligent response. \n4. **Human-in-the-Loop Review:** You retain complete control. The software surfaces the drafts for you to quickly approve, tweak, or reject. \n\nBy operating locally and injecting your unique expertise into every draft, you get the scale of a growth suite with the safety of manual browsing. You can evaluate how tools handle these constraints in our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n## Building a pipeline through commenting: Audience-specific strategies\n\nChoosing the right software is only half the battle. How you deploy AI commenting dictates your success. Different professional goals require entirely different prompting and engagement strategies. \n\n### Job seekers\nWhen job seekers use AI to engage on LinkedIn, the goal is to build rapport with internal recruiters, department heads, and potential peers before an application is ever submitted. \n\n*   **The Mistake:** Using AI to constantly ask for jobs or forcefully drop your resume into unrelated threads.\n*   **The Strategy:** Focus on adding value to the hiring manager\u2019s industry observations. If a VP of Marketing posts about the difficulty of tracking dark social attribution, your AI should be configured to share a specific, relevant experience you had solving that problem in your last role. This positions you as a peer and a problem-solver.\n\n### Sales teams and lead generation\nSales professionals often struggle with commenting because their natural instinct is to turn every interaction into a pitch. \n\n*   **The Mistake:** Generating comments that end with, \"I'd love to show you how our product solves this. Let's hop on a call.\"\n*   **The Strategy:** The comment is not the pitch; the comment is the icebreaker. Use AI to surface secondary insights that the prospect might have missed. If a prospect posts about the challenges of remote team management, configure your AI to share a specific micro-statistic or a brief anecdote about operational efficiency. Build the relationship in the public feed so that when you transition to the DM, the prospect recognizes your name and respects your expertise.\n\n### Founders and consultants\nFor founders, thought leadership is a major driver of inbound pipeline. \n\n*   **The Mistake:** Acting like a corporate brand account that only posts sanitized, agreeable opinions.\n*   **The Strategy:** Configure your AI tool to take a contrarian (but respectful) stance. Disagree gracefully. When a competitor or industry peer posts a widely accepted truism, use your commenting tool to draft a response that outlines an edge case where that truism fails. Friction creates engagement, and well-articulated friction proves deep subject matter expertise.\n\n## How to train AI to sound like you (avoiding the bot trap)\n\nThe single biggest failure mode of AI engagement is sounding like a large language model. LinkedIn users have developed an acute sensitivity to AI-generated text. If your comment includes phrases like \"delve,\" \"tapestry,\" \"game-changer,\" or \"in today's rapidly evolving digital landscape,\" your audience will immediately dismiss you.\n\nTo ensure your engagement builds trust rather than destroying it, you have to master the \"Human-in-the-Loop\" method. \n\n### 1. Feed the system specific constraints\nNever let an AI generate a comment based solely on the prompt \"reply to this post.\" You must provide the AI with strict constraints regarding your tone and formatting. \n*   *Bad prompt integration:* \"Write an insightful comment.\"\n*   *Good prompt integration:* \"Write a 2-sentence response. Do not use corporate jargon. Reference my background in B2B logistics. Adopt a dry, pragmatic tone. Ask one specific follow-up question.\"\n\n### 2. Avoid the \"Agree and Amplify\" echo chamber\nDefault AI models are trained to be helpful and sycophantic. When left to their own devices, they will simply read a post, agree with it entirely, and repeat the core premise back to the author using slightly different words. \n\nTo stand out, you must instruct the tool to add net-new information. Tell the AI to provide a real-world example, identify a potential roadblock in the author's logic, or link the topic to an adjacent industry trend. \n\n### 3. Treat the AI as a drafter, not a publisher\nNo matter how advanced the AI tool is, you should never allow it to auto-publish comments while you are away from your desk. The goal of software is to handle the heavy lifting of reading long posts, synthesizing the context, and generating a 90% complete response. \n\nThe final 10% requires a human touch. Review the generated comment. Trim unnecessary adjectives. Inject a colloquial phrase you commonly use. Hitting \"approve\" without reading is the fastest way to damage your professional reputation.\n\nFor detailed guidelines on keeping your automation usage within safe boundaries, review our guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Frequently Asked Questions\n\n**Can LinkedIn detect AI-generated comments?**\nLinkedIn does not currently penalize accounts purely for posting AI-generated text, mostly because accurate AI text detection is notoriously difficult and prone to false positives. However, other *users* can spot poorly prompted AI text instantly. What LinkedIn *does* detect and penalize is the unapproved automation used to deliver that text\u2014specifically cloud IP jumps and unnatural engagement speeds.\n\n**Are Chrome extensions completely safe to use?**\nChrome extensions are generally much safer than cloud-based session cookie tools because they operate locally in your browser. However, they are still injecting code into the LinkedIn DOM (Document Object Model). If you use a poorly maintained extension that rapidly clicks elements faster than a human possibly could, LinkedIn\u2019s rate-limiting systems can still flag your account.\n\n**How many comments should I leave per day for optimal growth?**\nQuality drastically outperforms quantity. Leaving 10 highly relevant, deeply contextual comments on posts from targeted decision-makers will yield more profile views and inbound messages than dropping 100 generic \"Great post!\" comments across random feeds. Focus on 15-25 strategic engagements daily to keep your pipeline moving without triggering rate limits.\n\n## Turning public visibility into private pipeline\n\nFinding the best AI tools for LinkedIn commenting requires a clear understanding of your goals and your risk tolerance. Browser extensions offer safety but lack the organizational power to scale. Cloud growth suites offer massive scale but expose your account to unacceptable security risks.\n\nThe most effective strategy relies on local automation. By keeping the software on your own machine and feeding it your unique professional context, you can bypass crowded inboxes entirely. You turn hours of manual feed-scrolling into a streamlined review process, allowing you to consistently drop high-value insights in front of the exact people you want to do business with. \n\nWhen you get the commenting strategy right, the cold DM becomes obsolete. Your prospects already know who you are, they respect your insights, and the conversation starts warm.", "created_at": "2026-10-15T15:49:27.542987+00:00", "updated_at": "2026-10-15T15:49:27.542994+00:00"};
    </script>

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">

            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
