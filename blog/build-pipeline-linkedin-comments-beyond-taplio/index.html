    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 105, "slug": "build-pipeline-linkedin-comments-beyond-taplio", "title": "Best Build Pipeline Using Linkedin Comments Tools Beyond Taplio", "excerpt": "Learn how to build a predictable B2B sales pipeline using LinkedIn comments. Discover tools beyond Taplio, safe local automation, and conversion workflows.", "featured_image_url": "https://assets.bevisible.app/featured-images/j577cyxd8vmrnq2es1bfak9sp18d7k39/best-build-pipeline-using-linkedin-comments-tools-1789573715144-uybal2.png", "published_at": "2026-09-16T15:28:00+00:00", "content": "# Best Build Pipeline Using Linkedin Comments Tools Beyond Taplio\n\nThe era of predictable pipeline generation through high-volume cold messaging is grinding to a halt. Decision-makers are experiencing severe inbox blindness, ignoring the daily flood of automated connection requests and generic pitches. Yet, these same executives, founders, and prospects are spending more time than ever scrolling their feeds and reading the comments under industry discussions. \n\nBuilding a sales, talent, or content pipeline through LinkedIn comments is currently one of the most underrated social selling strategies available. Instead of fighting for attention in a crowded, private inbox, you are building relationships in public where your expertise is visible to the original poster and their entire audience. \n\nWhile Taplio has popularized the concept of AI-assisted LinkedIn growth, many practitioners find that relying solely on its broad, cloud-based scheduling and engagement features leaves money on the table when trying to generate highly targeted B2B pipelines. A generic \"Great post!\" generated by a basic AI model will not convince a VP of Sales to book a discovery call. You need context, strategy, and the right technical stack to execute this without jeopardizing your account.\n\nHere is the complete framework for turning public LinkedIn visibility into direct interviews, pipeline, and client conversations, along with the best tools to execute this strategy effectively.\n\n## The Shift: Why Comments Trump Cold DMs\n\nIf you send a cold message, the recipient has two choices: ignore it or read a pitch. The power dynamic is immediately skewed; you are asking for their time before delivering value. \n\nCommenting flips this dynamic entirely. When a prospect publishes a post, they are actively seeking validation, engagement, and discussion. By providing a thoughtful comment, you are giving them exactly what they want: reach and interaction. \n\nThis triggers the law of reciprocity. People naturally want to know who is supporting their content, leading to organic profile views. If your profile is optimized to convert\u2014clearly stating who you help and how\u2014that simple comment serves as a highly qualified inbound lead generation mechanism. \n\n![Side-by-side diagram comparing low cold DM response rates with the high-conversion public LinkedIn commenting funnel.](https://assets.bevisible.app/inline-images/j577cyxd8vmrnq2es1bfak9sp18d7k39/inline-1-1789573657722-ecmuhe.png)\nConsider the case of an outbound lead generation agency that spent six months running traditional automation sequences. They were hitting LinkedIn's weekly connection limits and booking two meetings a month. After pivoting their strategy entirely to targeted commenting on posts by SaaS founders and marketing directors, their profile views increased by 400%, and they started booking five inbound discovery calls a week. They stopped asking for attention and started earning it publicly.\n\n## Step 1: Define Your \"Dream 100\" List\n\nYou cannot build a predictable pipeline by commenting randomly on whatever the LinkedIn algorithm serves on your homepage. The algorithm optimizes for engagement and virality, not your specific ideal customer profile (ICP). To build a pipeline, you must be highly intentional about whose radar you appear on.\n\nCreate a targeted \"Dream 100\" list divided into two specific cohorts:\n\n1. **The Direct Targets (Ideal Customers/Candidates):** 30 to 50 key decision-makers you want to work with directly. These are the people whose business you want to win or who you want to hire you. \n2. **The Audience Aggregators (Industry Creators):** 10 to 20 larger creators, consultants, or influencers whose audiences perfectly match your ICP. For example, if you sell to sales leaders, you should be engaging heavily with popular sales trainers.\n\nOnce you have identified these individuals, visit their profiles and turn on the bell notification (\ud83d\udd14). Being an early commenter dramatically increases your visibility, as your comment will likely sit at the top of the feed and capture the attention of everyone else who engages with the post later.\n\nIf you struggle to identify the right conversations manually, you can explore the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) to automate the discovery phase of this strategy.\n\n## Step 2: Master the \"Value-First\" Comment Formula\n\nThe biggest mistake professionals make when trying to leverage comments is acting like cheerleaders instead of peers. Comments like *\"Totally agree!\"*, *\"Thanks for sharing\"*, or a simple clapping emoji add zero value. They signal to the creator and the audience that you have nothing substantive to contribute.\n\nTo generate a pipeline, your comments must demonstrate competence. Use the following structured approach to ensure every interaction builds authority.\n\n| Component | Purpose | Example |\n| :--- | :--- | :--- |\n| **The Validation** | Acknowledge a specific point they made to show you actually read the post. | *\"I love your point about shifting from volume to quality in outbound sequences...\"* |\n| **The Counter/Expansion** | Add your own original insight, a framework, a data point, or a nuanced disagreement. | *\"...In fact, we found that personalizing just the first line based on a prospect's recent content increases positive reply rates by 40%.\"* |\n| **The Open Question** | End with a relevant question to spark a back-and-forth conversation with the author. | *\"Are you seeing that shift toward personalization happening more rapidly in enterprise or SMB sales teams right now?\"* |\n\nThis formula forces a conversation. When the original poster replies to your open question, LinkedIn's algorithm registers a deep interaction, pushing that post\u2014and your comment\u2014higher in the feed.\n\n![Structured breakdown of the 3-part Value-First LinkedIn comment formula: Validation, Expansion, and Open Question.](https://assets.bevisible.app/inline-images/j577cyxd8vmrnq2es1bfak9sp18d7k39/inline-2-1789573657266-qnsriw.png)\n## Step 3: The 3-Step Pipeline Conversion Strategy\n\nCommenting gets you noticed, but the revenue is generated when you successfully move people from the public comments section into your private inbox. This transition requires tact.\n\n### 1. Hijack the \"Second-Degree\" Audience\nDo not limit your engagement to the original author. If you are commenting on an Audience Aggregator's post, look at who else is commenting. If an ideal prospect leaves a thoughtful comment on the thread, reply directly to *them*. \n\nIf a VP of Operations asks a question in the comments of an industry influencer's post, and you provide a detailed, helpful answer, you have just demonstrated extreme value directly to a decision-maker without ever sending a cold pitch. \n\n### 2. The Contextual Connection Request\nAfter you have had a positive back-and-forth exchange in the comments (either with the author or another commenter), send a connection request while the context is fresh. \n\n**Do not pitch in this request.** \n\nInstead, reference the interaction:\n*\"Hey [Name], really enjoyed our back-and-forth on Sarah\u2019s post about outbound metrics. Wanted to send a connection request so I can keep up with your content. Cheers.\"*\n\nBecause you have already established familiarity and reciprocity, the acceptance rate for these requests frequently exceeds 80%. \n\n### 3. Transitioning to the Inbox\nOnce they accept, let them breathe. Do not immediately follow up with a calendar link. Wait for them to post again, or wait a few days before sending a message that builds on your previous public conversation. If you are struggling to manage this transition at scale, evaluating tools like [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) can help you understand how to navigate relationship building without resorting to traditional, spammy sequencing.\n\n## Why Taplio Struggles with Pipeline Generation at Scale\n\nTaplio is a phenomenal tool for content creators. Its scheduling capabilities, post inspiration, and basic CRM features have made it a staple for individuals looking to build a massive top-of-funnel audience. However, when your goal shifts from simply accumulating impressions to generating a targeted B2B pipeline, its limitations become apparent.\n\nThe primary issue lies in context. Taplio's automated commenting features often rely on broad AI prompts that struggle to capture the nuance of deeply technical or highly specific B2B conversations. If you are trying to impress a Chief Information Security Officer (CISO) in the comments, an AI generating generic praise will actively damage your reputation. \n\nFurthermore, Taplio operates in the cloud. As LinkedIn tightens its security measures against automated engagement, cloud-based tools that ping LinkedIn servers from data centers often trigger account restrictions. High-value LinkedIn accounts cannot afford to be temporarily banned or permanently restricted. \n\nIf you are serious about this strategy, you need to look at the [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) comparison to understand why local, context-aware execution is replacing cloud-based volume tools.\n\n## Best Tools for Building a Comment-Led Pipeline\n\nTo execute this strategy at scale without spending four hours a day manually reading posts, you need the right technology. The market has evolved beyond simple scheduling tools, introducing sophisticated AI that can mimic your voice and manage engagement safely.\n\n### 1. Junior (The Context-Aware, Local Automation Approach)\nJunior represents the next generation of LinkedIn automation, built specifically for the comment-to-pipeline motion. Unlike older tools designed for cold outreach, Junior is an AI-powered assistant designed to start authentic conversations through strategic post commenting. \n\nWhat makes it highly effective for pipeline generation is its localized approach. Junior runs directly on your local machine, utilizing natural interaction patterns that mimic human behavior, protecting your account from the aggressive flagging systems that target cloud-based tools. \n\nMore importantly, it drafts context-aware, human-sounding replies based on your unique bio, goals, and expertise. It doesn't just read the post; it understands your specific angle on the topic. It helps job seekers, sales teams, agencies, and founders bypass crowded inboxes by turning highly relevant public visibility into direct client conversations. \n\n### 2. Supergrow (For Content-First Practitioners)\nIf you are heavily focused on content creation and need a middle ground between Taplio's broad approach and Junior's surgical pipeline generation, Supergrow is a viable alternative. It offers solid carousel generation and a cleaner interface for managing engagements. While its AI is geared more toward audience building than direct pipeline generation, it remains a strong contender. You can explore deeper comparisons in the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) breakdown.\n\n### 3. Phantombuster (For Data Extraction and Complex Workflows)\nPhantombuster is not a native commenting tool, but it is an incredibly powerful data extraction engine. If your strategy involves scraping the commenters of a specific viral post to build a highly targeted Dream 100 list, Phantombuster excels. However, it requires significant technical setup and relies heavily on session cookies, which comes with its own set of safety risks. If you are building complex scraping workflows, reviewing [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) is highly recommended.\n\n## Building a Tech Stack for Safe Automation\n\nThe fastest way to destroy your pipeline is to get your LinkedIn account restricted. The platform has waged a highly publicized war against inauthentic automation, actively hunting down tools that violate its terms of service. \n\nWhen evaluating any tool for this strategy, account safety must be your primary decision criterion.\n\n![Technical diagram contrasting risky cloud proxy automation with safe local execution for LinkedIn engagement.](https://assets.bevisible.app/inline-images/j577cyxd8vmrnq2es1bfak9sp18d7k39/inline-3-1789573654122-db4fb7.png)\n### Local Execution vs. Cloud Proxies\nAs mentioned earlier, tools that log into your account from an AWS server in Virginia while you are physically located in London are immediately suspicious to LinkedIn's security algorithms. Even tools that offer dedicated proxies can leak metadata that reveals their automated nature.\n\nThis is why local execution is critical. Tools that run on your actual machine, using your actual IP address and natural browser environment, are virtually indistinguishable from human activity. \n\n### The Danger of the \"AI Voice\"\nSafety isn't just about avoiding algorithmic detection; it's about avoiding human detection. If your prospects can tell you are using AI to comment, your pipeline generation efforts will fail immediately. \n\nAvoid tools that rely on stock ChatGPT prompts without allowing for deep customization. Your automation stack must be able to ingest your personal writing style, your proprietary frameworks, and your specific industry jargon. Before implementing any software, run it through the [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) to ensure you aren't sacrificing quality for speed.\n\nFor a deeper understanding of how to protect your profile while scaling your engagement, the guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) covers the technical nuances of session management and rate limiting.\n\n## Common Mistakes When Automating LinkedIn Comments\n\nEven with the best tools and a solid strategy, practitioners frequently sabotage their own pipeline by falling into several common traps.\n\n**1. Pitching Too Early in the Thread**\nThe comment section is for adding value, not dropping your calendar link. If someone complains about a problem your software solves, do not reply with, *\"My tool fixes this, book a demo here: [Link].\"* Instead, explain *how* to fix the problem conceptually, demonstrating your expertise. Let them view your profile and discover your tool organically, or move the conversation to the DM before pitching.\n\n**2. Commenting on the Wrong Tier of Posts**\nCommenting on a post with 15,000 likes from a massive celebrity entrepreneur might get your comment some superficial views, but it rarely generates targeted B2B pipeline. Your ideal prospects are drowned out in the noise. Conversely, commenting on a post with zero engagement from an inactive account wastes your effort. Aim for the \"Goldilocks zone\": posts from industry leaders that receive between 50 and 500 likes. The audience is large enough to matter but intimate enough for a thoughtful comment to stand out.\n\n**3. Failing to Optimize the Profile Funnel**\nA brilliant comment is useless if the prospect clicks on your profile and cannot immediately figure out what you do. Your headline must clearly state your value proposition, your featured section must contain a relevant lead magnet or booking link, and your about section must read like a targeted sales page, not a resume.\n\n## Designing Your Daily Operational Workflow\n\nTo make this strategy predictable, you need to operationalize it. Building a pipeline through comments shouldn't take three hours a day. With the right tools and focus, it should take less than 45 minutes.\n\nHere is a recommended daily workflow:\n\n*   **Minutes 0-15: Targeted Engagement.** Open your Dream 100 list (or rely on a tool like Junior to surface these posts automatically). Leave 5-10 high-value, Validation/Counter/Question comments on posts from your ideal prospects and industry aggregators.\n*   **Minutes 15-25: Second-Degree Hijacking.** Scan the comments on the posts of your Audience Aggregators. Find 3-5 thoughtful comments left by your ideal prospects. Reply to their comments with additional value or a clarifying question.\n*   **Minutes 25-35: Inbox Transition.** Review notifications for replies to your comments from yesterday. If an exchange has been positive and spanned two or three replies, send a contextual connection request. \n*   **Minutes 35-45: Soft Follow-ups.** Check your inbox for recently accepted connections from your comment strategy. Send a low-friction opening message referencing the shared topic of interest.\n\nBy adhering strictly to this routine, you consistently plant seeds that compound into inbound profile views, connection requests, and discovery calls. If you are looking to benchmark your current stack against what is working right now, reviewing the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) will ensure your operational workflow is supported by modern infrastructure.\n\n## Frequently Asked Questions (FAQs)\n\n### How many comments should I leave per day to build a pipeline?\nVolume should never supersede quality. Leaving 50 terrible comments will generate zero pipeline and potentially damage your brand. Aim for 15 to 25 highly thoughtful, context-aware comments per day, specifically targeted at your Dream 100 list. This volume is manageable, keeps your account safe from algorithmic rate limits, and is high enough to generate consistent profile views.\n\n### Can LinkedIn detect AI-generated comments?\nLinkedIn's algorithms are primarily looking for spam patterns, unnatural login locations (proxies), and excessive API usage. While they are developing models to detect AI text, the real danger is human detection. If a prospect realizes a comment is AI-generated because it lacks nuance or sounds robotic, you lose the opportunity entirely. Using tools that run locally and utilize deep personal context (like Junior) mitigates both algorithmic and human detection risks.\n\n### How do I measure ROI from a commenting strategy?\nBecause commenting is a top-of-funnel and mid-funnel activity, attribution can sometimes feel murky. Track three specific leading indicators: \n1. **90-Day Profile Views:** This should consistently trend upward as you leave more valuable comments.\n2. **Inbound Connection Requests from ICP:** Are decision-makers reaching out to you based on your insights?\n3. **Comment-to-DM Conversion Rate:** How many of your public conversations successfully transition into a positive inbox dialogue? \n\nWhen these three metrics increase, booked meetings and pipeline revenue will naturally follow.\n\nThe shift away from cold outbound toward public, relationship-led growth is already happening. Professionals who master the art of the targeted comment, supported by intelligent, safe automation, will capture the attention that their competitors are wasting on ignored direct messages. Optimize your profile, define your target audience, and start adding genuine value to the discussions already happening in your industry.", "created_at": "2026-09-16T15:49:26.943438+00:00", "updated_at": "2026-09-16T15:49:26.943444+00:00"};
    </script>

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
