    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 148, "slug": "safe-linkedin-outreach-architecture", "title": "Architecture guide for safe LinkedIn outreach", "excerpt": "Discover the technical and behavioral architecture needed for safe LinkedIn outreach. Learn why local execution and feed commenting outperform cold DMs.", "featured_image_url": "https://assets.bevisible.app/featured-images/j577m4j15z4qh9ef4h2sqjqr398h3mp4/architecture-guide-for-safe-linkedin-outreach-1793204323308-culdxx.png", "published_at": "2026-10-31T15:59:00+00:00", "content": "# Architecture guide for safe LinkedIn outreach\n\nIf you scale your outreach on LinkedIn using the wrong technical architecture, your account will eventually face restrictions. The platform's anti-automation engineering is sophisticated, utilizing behavioral heuristics, hardware fingerprinting, and complex network analysis to detect bots. Yet, thousands of sales teams, job seekers, and founders scale their visibility every day without triggering a single warning. \n\nThe difference lies entirely in the underlying architecture of their outreach tools.\n\nScaling LinkedIn outreach without spamming relies heavily on two structural pillars: technical architecture (where and how the software runs) and behavioral architecture (what the software actually does). Historically, automation meant using risky browser extensions to blast generic direct messages. Today, safe architecture requires mimicking authentic human hardware environments and shifting away from crowded inboxes toward highly contextual, AI-driven public interactions.\n\nThis guide provides a comprehensive architectural overview of safe LinkedIn outreach. We will break down how anti-bot systems operate, the technical differences between cloud-based and local execution, and why conversational engagement architecture is rapidly replacing the traditional cold DM pipeline.\n\n## The Evolution of LinkedIn Anti-Bot Architecture\n\nTo understand how to build or choose a safe outreach stack, you first have to understand what you are building against. LinkedIn does not merely look for accounts sending too many messages; it employs a multi-layered security model that evaluates the environment, network, and behavior of every user session.\n\n### Layer 1: Network and Environment Analysis\nWhen a session is initiated on LinkedIn, the platform's security layers instantly begin assessing the connection. They look at IP addresses, checking if the IP originates from a known residential internet service provider (ISP) or a commercial data center (like AWS or DigitalOcean). Because authentic users browse from home or office Wi-Fi, data center IPs immediately elevate a session's risk score.\n\nFurthermore, the platform analyzes the browser environment. Modern anti-bot systems check browser fingerprints\u2014a collection of data points including screen resolution, installed fonts, WebGL rendering capabilities, and operating system details. If an automation tool is running a \"headless\" browser (a browser without a graphical user interface used by scripts), the fingerprint often gives it away.\n\n### Layer 2: JavaScript Injection and DOM Manipulation Detection\nIn the early days of automation, developers relied heavily on Chrome extensions. These extensions worked by directly manipulating the Document Object Model (DOM) of the LinkedIn webpage. They would inject JavaScript to find the \"Connect\" button and forcefully trigger a click event.\n\nLinkedIn countered this by implementing event listeners that monitor exactly how elements on the page are interacted with. A human moving a mouse generates a trail of coordinate data, natural pauses, and minor scrolling adjustments before clicking. A Chrome extension injecting a click event bypasses this entirely, triggering a microscopic, instant interaction that is mathematically impossible for a human to execute. Modern architecture has entirely abandoned DOM manipulation for this exact reason.\n\n### Layer 3: Behavioral Heuristics and Account Velocity\nEven if an automation tool perfectly mimics human hardware and network conditions, it can still be banned on behavioral grounds. This is known as \"account velocity.\" If an account historically sends two direct messages a week, and suddenly begins sending 80 identical direct messages every day at exactly 10:00 AM, the behavioral heuristic flags the account.\n\nFurthermore, LinkedIn tracks the acceptance rate and response rate of outbound actions. High volumes of ignored connections or unread cold DMs signal spam behavior. Safe outreach architecture must therefore restrict velocity and optimize for actions that generate high engagement\u2014which is why modern architectures are pivoting to public post commenting rather than private DM blasting.\n\n![Diagram showing LinkedIn's three anti-bot layers: network fingerprinting, DOM event tracing, and behavioral heuristics.](https://assets.bevisible.app/inline-images/j577m4j15z4qh9ef4h2sqjqr398h3mp4/inline-1-1793204268997-pd44gf.png)\n## Core Technical Approaches to Automation\n\nUnderstanding the evolution of anti-bot systems leads us to the three dominant architectures used in LinkedIn outreach software today. Each has distinct security profiles, limitations, and use cases.\n\n### Approach 1: Cloud-Based Infrastructure with Dedicated Proxies\nCloud-based automation has been the enterprise standard for the last few years. Instead of running software on your computer, the automation provider spins up a virtual machine on a remote server. This server logs into your LinkedIn account and executes campaigns while you sleep.\n\nTo bypass the data center IP problem, reputable cloud tools utilize dedicated proxies. For example, [expandi.io](https://expandi.io/blog/best-linkedin-automation-tools/#:~:text=lemlist%20suits%20teams%20that%20want%20cold%20email,around%20dedicated%20IP%20addresses%20and%20cloud-based%20campaigns.) is designed around dedicated IP addresses and cloud-based campaigns. When you connect your account, the platform assigns a dedicated, country-based IP address to mask the server's true location, matching your actual geographic location as closely as possible.\n\n**Architectural Advantages:**\n*   **Always-On Execution:** Cloud infrastructure runs 24/7. You do not need to leave your computer open for campaigns to execute.\n*   **Centralized Management:** Lead gen agencies can manage dozens of client accounts from a single dashboard without relying on the clients' hardware.\n*   **Complex Campaign Logic:** Because execution happens server-side, these platforms can support complex \"if/else\" conditional branching. As noted by industry comparisons, Expandi assigns each account a dedicated country-based IP, which allows for some of the most sophisticated conditional campaign builders on the market, executing steps based on whether a prospect opened an email or ignored a LinkedIn request ([www.simular.ai](https://www.simular.ai/alternatives/linkedin-automation-tools#:~:text=Expandi%20assigns%20each%20account%20a%20dedicated%20country-based,sophisticated%20conditional%20campaign%20builder%20on%20the%20market.)).\n\n**Architectural Vulnerabilities:**\n*   **The Proxy Arms Race:** Static residential proxies are safer than data center IPs, but they are not bulletproof. If the proxy provider recycles an IP that was previously flagged for spam, your account inherits that negative reputation.\n*   **Hardware Mismatch:** If you log into LinkedIn on your iPhone in New York, and your cloud automation logs in simultaneously from a dedicated IP in Chicago using a virtualized Windows environment, the resulting session conflict is a massive red flag.\n*   **High Behavioral Risk:** Because cloud tools run in the background, users tend to \"set and forget\" high-volume cold DM campaigns. This leads to the behavioral velocity issues mentioned earlier.\n\n### Approach 2: API-Based Automation (The Theoretical Safe Route)\nLinkedIn provides official APIs for certain business functions, such as posting content to company pages or syncing Lead Gen forms with a CRM. Theoretically, building an outreach tool entirely on official APIs would be the safest architecture possible, as it operates with explicit permission.\n\nHowever, LinkedIn aggressively protects its social graph. It does not provide public API endpoints for scraping user profiles, sending connection requests, or automating direct messages on personal profiles. Any tool claiming to use \"LinkedIn's API\" for mass outreach is likely utilizing undocumented, private APIs used by LinkedIn's own mobile app. Replicating calls to these private APIs is highly dangerous; the moment LinkedIn updates an endpoint or changes an authentication token requirement, the automation tool breaks, and associated accounts are instantly flagged. Consequently, robust outreach architecture avoids relying on reverse-engineered APIs.\n\n### Approach 3: Local Environment Execution (The Junior Approach)\nThe safest emerging technical architecture rejects the cloud entirely. Instead of routing traffic through third-party servers and proxies, local execution architecture runs the automation directly on the user's own machine, utilizing their actual hardware and native internet connection.\n\nTools built on local architecture do not need to spoof browser fingerprints, because they are using real browsers on real hardware. They do not need to purchase expensive residential proxies, because they use the user's actual residential or office Wi-Fi. \n\n**Architectural Advantages:**\n*   **Perfect Environmental Matching:** When the automation runs, it carries the exact same MAC address, IP address, timezone, and hardware fingerprint as the user's normal daily LinkedIn activity. There is zero discrepancy for anti-bot systems to detect.\n*   **Simultaneous Session Safety:** Because the automation runs locally while the user is at their computer, there is no risk of geographic login conflicts (e.g., logging in from two different countries at the same time).\n*   **Natural Interaction Patterns:** Local tools execute actions in real-time, often visible to the user, ensuring the pacing matches realistic human browsing speeds.\n\nTo understand more about why local execution is prioritized over cloud setups for account security, you can review the [How Does Junior Protect My Linkedin Account Source Guide](https://www.heyjunior.ai/blog/how-does-junior-protect-my-linkedin-account).\n\n![Technical diagram comparing cloud-based proxy automation against native local environment execution.](https://assets.bevisible.app/inline-images/j577m4j15z4qh9ef4h2sqjqr398h3mp4/inline-2-1793204270589-6jf9wp.png)\n## The Shift in Behavioral Architecture: From Inboxes to the Feed\n\nSolving the technical side of automation (IPs, hardware fingerprints) is only half the architecture. The other half is the *behavioral payload*\u2014what the software is programmed to do once it safely accesses the platform.\n\nFor years, the standard behavioral architecture of LinkedIn automation has been the cold DM pipeline: scrape a list of users, send a connection request, wait for acceptance, and trigger a sequence of 3-4 direct messages. \n\nThis architecture is currently failing at scale. Decision-makers' inboxes are flooded with automated pitches. Even if the technical architecture is perfectly safe, the behavioral outcome is poor: low acceptance rates, high spam reports, and minimal pipeline generation. \n\nThe new standard for safe outreach architecture shifts the theater of engagement from the private inbox to the public feed. Instead of spamming direct messages, modern tools are architected to start authentic conversations through strategic post commenting. \n\n### The Mechanics of Conversational Commenting Architecture\nInstead of linearly processing a list of profile URLs and pushing messages to them, a conversational architecture monitors the platform for relevant discussions. \n\nConsider how this works in practice for a sales team or job seeker using a tool like Junior:\n1.  **Feed Monitoring:** The architecture scans the user's LinkedIn feed or targeted search parameters to find recent, high-value posts from target prospects or industry leaders.\n2.  **Context Extraction:** When a relevant post is identified, the system extracts the text of the post to understand the topic, sentiment, and core argument.\n3.  **Bio-Driven Payload Generation:** Rather than pasting a generic \"Great post!\" comment, the architecture leverages a local Large Language Model (LLM) integration. It feeds the context of the post, alongside the unique bio, goals, and expertise of the user, into the model.\n4.  **Drafting and Execution:** The system drafts a context-aware, human-sounding reply that adds genuine value to the public discussion. This draft is then executed locally.\n\nThis behavioral architecture is inherently safer. LinkedIn's algorithms reward engagement. Accounts that frequently leave high-quality, relevant comments on public posts are categorized as \"high-value community members,\" elevating their trust score. Conversely, accounts that only send high volumes of unprompted direct messages are categorized as \"solicitors,\" lowering their trust score and increasing their vulnerability to bans.\n\nBy moving outreach into the public feed, you bypass crowded inboxes and turn public visibility into direct profile views, inbound connection requests, and eventually, warm client conversations. \n\n### Scenario: The Architecture in Practice\nImagine a lead generation agency managing outreach for a B2B SaaS founder. \n\n**The Old Architecture (Cloud DMs):**\nThe agency loads 1,000 prospects into a cloud-based platform. The platform uses a dedicated IP in the founder's home state. It sends 40 connection requests a day. The acceptance rate is 15%. Of those who accept, the platform sends a 4-step cold DM sequence. The response rate is 2%. The founder's inbox is full of \"No thanks\" or angry replies. LinkedIn flags the account for low engagement ratios.\n\n**The New Architecture (Local Commenting):**\nThe agency installs a local execution tool on a machine in their office (or advises the founder to run it locally). The tool is configured with the founder's unique bio: \"SaaS founder specializing in supply chain logistics.\" The software scans for posts related to supply chain disruptions. It finds a post by a target VP of Operations. The AI drafts a thoughtful comment based on the founder's bio, agreeing with the VP's point and adding a unique insight. The comment is posted natively. The VP replies to the comment, views the founder's profile, and sends an inbound connection request. A warm conversation begins.\n\nThe second architecture achieves the goal (generating pipeline) without triggering any of the behavioral red flags associated with traditional outreach. \n\n![Workflow diagram contrasting the traditional cold DM sequence with conversational feed commenting architecture.](https://assets.bevisible.app/inline-images/j577m4j15z4qh9ef4h2sqjqr398h3mp4/inline-3-1793204271170-lrc281.png)\n## Designing a Safe Automation Stack (Step-by-Step)\n\nIf you are structuring an outreach system for your team in 2026, you must build it securely from the ground up. Here is a step-by-step framework for establishing a safe automation architecture.\n\n### Step 1: Establish the Execution Layer\nYour first decision is where the code will run. As established, browser extensions that rely on DOM manipulation must be avoided entirely. \n\nIf your strategy relies heavily on combining cold email with LinkedIn tasks in a unified sequence, a reputable cloud provider with dedicated proxies is the standard approach. However, if your strategy is focused strictly on LinkedIn, and prioritizing absolute account safety and conversational engagement, local execution is mandatory. Running the software on your own machine ensures perfect harmony between your daily manual browsing and your automated outreach. For details on how AI platforms structure this safely, review the [Is Junior AI Safe to Use On Linkedin Source Guide](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin-3).\n\n### Step 2: Implement Strict Rate Limiting and Randomization\nNo matter where your software runs, it must operate within human limitations. A core component of safe architecture is the queuing and throttling system. \n\n*   **Absolute Limits:** Hard caps must be set on daily actions. In 2026, sending more than 30-40 cold connection requests per day is highly risky. Commenting volume can be slightly higher (40-50 per day), as LinkedIn encourages public engagement, provided the comments are unique and contextual.\n*   **Time Variance:** The architecture must introduce randomization between actions. If a script executes an action exactly every 180 seconds, the uniformity will be detected. Safe systems use heavily randomized wait periods (e.g., waiting anywhere from 3 to 12 minutes between engagements).\n*   **Operating Hours:** The system must only execute during natural waking hours corresponding to the local timezone of the hardware. \n\n### Step 3: Decouple AI from Direct Execution\nA common architectural mistake in modern automation is putting the AI directly in the driver's seat. If an LLM is given direct access to an API or a headless browser to \"go find leads and talk to them,\" the risk of hallucinations or repetitive looping behavior skyrockets. \n\nSafe architecture uses AI strictly as a *payload generator*, not an execution engine. The core software handles the safe navigation, the rate limiting, and the extraction of context. It packages this data, sends it to the AI to draft a response based on the user's bio, and then reviews the response before the core software physically executes the posting action. This separation of concerns ensures the AI cannot accidentally trigger high-velocity spam behavior.\n\n### Step 4: Manage Session Persistence Safely\nEvery time you log into LinkedIn, the platform generates a session cookie. Safe automation architecture utilizes cookie persistence rather than logging in with an email and password every single time it runs. Repeated authentication requests from automated tools trigger security captchas. By utilizing local execution, the software can safely piggyback on the active, authenticated session already present on the user's machine, drastically reducing login-related security flags.\n\n## The Myth of the \"Undetectable\" Delay\n\nA persistent myth in the automation niche is that you can make any software safe\u2014even cheap Chrome extensions\u2014simply by adding \"human-like delays.\" The theory is that if the software waits 5 seconds before clicking, types at varying speeds, and scrolls up and down randomly, the anti-bot system will be fooled.\n\nThis is fundamentally incorrect due to how browser event listeners function at the architectural level. \n\nWhen a human user moves a physical mouse and clicks a button, the browser registers a complex string of `mousemove`, `mousedown`, `mouseup`, and `click` events, all populated with precise X and Y coordinates on the screen, accompanied by hardware-level timestamps. \n\nWhen a basic automation script injects a click via JavaScript (e.g., `element.click()`), it bypasses the physical hardware entirely. It fires a synthetic click event. Even if the script waited 10 minutes before firing that synthetic click, the event listener instantly recognizes that the click lacks the preceding coordinate trail and hardware timestamps of a real mouse movement. \n\nThe delay is irrelevant if the event execution itself is synthetic. This is why tools like Valley execute outreach natively inside LinkedIn, avoiding detectable script injections entirely ([www.joinvalley.co](https://www.joinvalley.co/blog/the-safest-linkedin-automation-tools-in-2026-that-wont-get-your-account-banned#:~:text=The%20safest%20tools%2C%20one%20by%20one%20*,by%20default%2C%20not%20as%20an%20optional%20setting.)). Similarly, true local execution architecture controls the actual browser instance at the operating system level, ensuring that when a click happens, it generates the exact same coordinate data and event trails as a physical mouse click.\n\n## Comparing Top Architectures in 2026\n\nTo synthesize these concepts, let us look at how different architectural models compare when evaluating safety, execution style, and primary use cases.\n\n| Architecture Type | Primary Mechanism | Safety Profile | Best Used For |\n| :--- | :--- | :--- | :--- |\n| **Basic Browser Extensions** | DOM manipulation and synthetic JavaScript clicks. | Very Low (High ban risk). | Short-term, disposable data scraping (not recommended for main accounts). |\n| **Cloud-Based Platforms** | Headless browsers on remote servers routed through dedicated proxies. | Moderate to High (Safe IP, but risks behavioral flags if DMs are spammed). | Multi-channel teams combining high-volume cold email with LinkedIn sequences. |\n| **Cloud with Native Execution** | Server-side execution but interacts with LinkedIn's native elements rather than injecting scripts. | High (Safer behavior, static residential proxies required). | Complex conditional campaigns requiring 24/7 background execution. |\n| **Local AI Conversational Execution** | Runs on user's actual hardware, using native internet connection. Uses AI to draft contextual comments based on unique bios. | Highest (Perfect environmental match + algorithmically rewarded behavior). | Job seekers, founders, and sales teams looking to bypass inboxes and build authentic pipeline. |\n\nFor a deeper look into how local AI models are priced and structured for different types of users, you can review the [Junior AI Pricing and Subscription Plans Source Guide](https://www.heyjunior.ai/blog/junior-ai-pricing-and-subscription-plans-3).\n\n## FAQs on LinkedIn Outreach Safety\n\n### Is it better to use a dedicated IP or my home IP?\nYour home IP (residential connection) is almost always safer than a dedicated proxy, provided you are only managing your own account. LinkedIn trusts residential ISPs (like Comcast or AT&T) far more than commercial data centers. If you use local execution architecture, you utilize your highly trusted home IP naturally. Dedicated IPs are only necessary if you are forced to use cloud-based architecture, as they attempt to mask the server's data center origins. \n\n### How many automated actions per day are safe?\nSafety is not just a raw number; it is a ratio of action to engagement. Sending 50 cold direct messages that all get ignored or reported as spam will quickly get your account restricted. However, leaving 50 highly relevant, context-aware comments on public posts that receive likes and replies will elevate your account standing. As a general rule, regardless of architecture, volume should be ramped up slowly over several weeks, rather than jumping from 0 to 50 actions on day one. For detailed user experiences regarding safe volume, see the [Heyjunior Reviews From Job Seekers Source Guide](https://www.heyjunior.ai/blog/heyjunior-reviews-job-seekers-guide).\n\n### Does LinkedIn penalize AI-generated text?\nLinkedIn does not actively penalize text simply because an LLM wrote it. The platform penalizes *spam*\u2014text that is irrelevant, purely promotional, and blasted in high volumes. If your architecture uses AI to generate generic \"Great post, let's connect!\" messages, you will face behavioral restrictions due to low engagement. If your architecture uses AI to analyze a post and draft a highly specific, insightful reply based on your unique expertise, the platform rewards the resulting engagement. The safety lies in the contextual relevance of the payload, not the fact that AI assisted in drafting it.\n\n## The Future of Safe Visibility\n\nThe era of scaling LinkedIn outreach by brute-forcing inboxes with generic messages is over. The architectural defense mechanisms against synthetic behavior and network spoofing are too advanced, and user tolerance for automated spam is too low.\n\nBuilding a safe outreach architecture today requires aligning with the platform's own goals: authentic networking and high-quality content engagement. By shifting execution from remote data centers to local hardware, and shifting the behavioral focus from private DM sequences to public, context-aware commenting, professionals can safely bypass algorithmic restrictions and overcrowded inboxes. \n\nThe ultimate goal of outreach architecture is not to hide the fact that you are using automation; it is to use automation to facilitate interactions so highly relevant and contextual that no one cares how they were generated. By ensuring your technical footprint perfectly matches your daily habits, and relying on AI to scale your unique voice rather than a generic script, you transform your public visibility into genuine, high-converting conversations.", "created_at": "2026-10-31T16:19:22.648163+00:00", "updated_at": "2026-10-31T16:19:22.648170+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,

                }

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
