    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 156, "slug": "dripify-vs-junior-linkedin-automation-2", "title": "Dripify Vs Junior for Linkedin Automation Source Guide", "excerpt": "Compare Dripify vs Junior for LinkedIn automation. Discover the differences between cloud-based DM sequencing and local AI comment-driven social selling.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57b7501db74vqztws5d6xbegx8h2n4m/dripify-vs-junior-for-linkedin-automation-source-g-1793985518085-jav25d.png", "published_at": "2026-11-09T16:53:00+00:00", "content": "# Dripify Vs Junior for Linkedin Automation Source Guide\n\nIf you open your LinkedIn inbox right now, you will likely find a predictable pattern. Among the genuine messages from colleagues, there is a graveyard of automated pitches. They follow the exact same cadence: a connection request referencing a shared industry, an immediate follow-up thanking you for connecting, and a three-paragraph pitch arriving exactly 48 hours later. \n\nThis is the reality of traditional LinkedIn automation. For years, the prevailing strategy was to treat LinkedIn like a secondary email inbox, pushing as many direct messages as the platform's limits would allow. \n\nTwo tools represent entirely different philosophies for navigating this environment: Dripify and Junior. Dripify is a mature, cloud-based platform built to orchestrate complex, multi-step direct messaging campaigns. It relies on volume, sequencing, and traditional lead-generation tactics. Junior, on the other hand, is an AI-powered local application designed to abandon cold DMs entirely, focusing instead on driving pipeline through strategic, context-aware post commenting.\n\nChoosing between them is not merely a software decision; it is a decision about how you want your brand to interact with the market. This guide examines the mechanics, safety architectures, and strategic outcomes of both platforms to help you determine which approach aligns with your revenue goals.\n\n![Diagram comparing private inbox DM sequencing against public feed comment-driven inbound attraction.](https://assets.bevisible.app/inline-images/j57b7501db74vqztws5d6xbegx8h2n4m/inline-1-1793985470141-ryr2kz.png)\n## The Changing Mathematics of LinkedIn Outreach\n\nTo understand why the divide between Dripify and Junior exists, you have to look at how LinkedIn engagement metrics have shifted over the past few years. \n\nHistorically, direct messaging automation yielded high returns. You could send 100 connection requests a day, achieve a 30% acceptance rate, and book meetings purely through volume. The platform supported this behavior, and buyers were less fatigued by the format.\n\nToday, the environment is fundamentally different. LinkedIn has strictly limited connection requests to roughly 100 per week for most users. Furthermore, decision-makers have developed \"pitch blindness.\" They can spot a templated variable like `{{first_name}}` or `{{company}}` from a mile away. The friction required to get a buyer to read, process, and respond to a cold DM has never been higher. \n\nAt the same time, the LinkedIn feed has evolved. The algorithm aggressively rewards public conversations. A thoughtful comment on a high-performing post can generate thousands of impressions, driving targeted traffic back to your profile. This shift from private, one-to-one messaging to public, one-to-many visibility is the defining characteristic of modern social selling. Understanding the [State of LinkedIn Engagement and Automation in 2026](https://www.heyjunior.ai/blog/state-of-linkedin-engagement-automation-2026) is critical before deploying any tool, as the penalties for tone-deaf automation are steep.\n\n## Dripify: The Traditional Inbox Orchestrator\n\nDripify built its reputation on giving sales teams and lead generation agencies total control over the LinkedIn inbox. It functions as a cloud-based command center for direct outreach, allowing users to build intricate flowcharts of communication.\n\n### Core Mechanics and Strengths\n\nDripify excels at scale and logical sequencing. When you build a campaign in Dripify, you are essentially programming a state machine. You import a list of leads\u2014often from a LinkedIn Sales Navigator search or a CSV file\u2014and construct a pathway based on user behavior.\n\nIf a prospect accepts a connection request, Dripify waits a specified number of days before sending message one. If they view your profile but do not reply, Dripify can trigger a different action, such as endorsing a skill or sending a specific follow-up. This \"if/then\" capability allows teams to map out evergreen nurture flows that run entirely in the background.\n\nFor agencies managing multiple clients, Dripify offers robust team collaboration features. You can monitor the analytics of several accounts from a single dashboard, tracking open rates, reply rates, and overall campaign performance. It includes lead scoring mechanisms to help sales representatives prioritize which replies require human intervention.\n\n### Limitations and Failure Modes\n\nThe primary limitation of Dripify is inherent to its strategy: it relies on the inbox. No matter how complex your conditional logic is, the output is still a cold direct message. \n\nBecause Dripify relies heavily on standard variables (First Name, Company Name, Job Title), the messaging often feels robotic. Even when using \"spintax\" (spinning different variations of a sentence to appear unique), the underlying structure of a cold pitch remains obvious to the recipient. \n\nFurthermore, Dripify operates in the cloud. We will explore the safety implications of this in depth later, but from a practical standpoint, executing actions from a remote server introduces friction with LinkedIn\u2019s security protocols, which are increasingly hostile toward cloud-based automation.\n\n![Whiteboard workflow diagram mapping a sequential cold direct message outreach campaign with conditional branches.](https://assets.bevisible.app/inline-images/j57b7501db74vqztws5d6xbegx8h2n4m/inline-2-1793985464444-inqa2o.png)\n## Junior: The Local Comment-Driven Alternative\n\nJunior approaches LinkedIn automation from a completely different angle. Rather than trying to force open the inbox with sequential pitches, Junior focuses on intercepting existing attention in the feed. It operates on the premise that the most effective way to start a conversation is to add value to one that is already happening.\n\n### Core Mechanics and Strengths\n\nJunior is an AI-powered automation tool designed specifically for strategic post commenting. It completely bypasses the crowded DM inbox. Instead, it finds relevant discussions based on your target audience and industry, and drafts highly contextual, human-sounding replies.\n\nThe differentiator here is context. Junior does not deploy generic, algorithmic spam like \"Great post!\" or \"Thanks for sharing.\" Instead, it analyzes the content of the target post, cross-references it with your unique professional bio and goals, and synthesizes a relevant perspective. \n\nFor example, if a target prospect posts about the challenges of B2B sales cycles, and your bio identifies you as a founder building a product-led growth tool, Junior might draft a comment discussing how PLG models specifically reduce cycle friction, directly addressing the author's premise. You review the draft, ensure it matches your voice, and post it. \n\nBecause Junior [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth), it effectively turns the comment section into a targeted lead generation channel. High-quality comments attract profile views. An optimized profile converts those views into inbound connections and direct inquiries, flipping the traditional outreach model from outbound push to inbound pull.\n\n### Local Execution and Safety\n\nThe most critical technical distinction of Junior is that it runs locally on your machine. It is not a cloud application logging in from a remote data center. It utilizes your existing browser context, your local IP address, and your natural interaction patterns. This makes the automation nearly indistinguishable from manual human activity, drastically reducing the risk of account restrictions. \n\n## Head-to-Head: Technical Architecture and Account Safety\n\nThe debate over [safe linkedin outreach architecture](https://www.heyjunior.ai/blog/safe-linkedin-outreach-architecture) is the most critical conversation happening in social selling today. Your LinkedIn account is an asset; losing it due to aggressive automation can cripple a pipeline. Dripify and Junior take fundamentally different approaches to keeping your account alive.\n\n### Dripify\u2019s Cloud Infrastructure\n\nDripify operates in the cloud. When you connect your LinkedIn account to Dripify, the platform is essentially logging into your account from its own servers. To mitigate safety risks, Dripify assigns a dedicated IP address to your account. The theory is that if the IP address remains constant, LinkedIn is less likely to flag the login as suspicious.\n\nHowever, a dedicated IP is only a partial solution. LinkedIn\u2019s security algorithms look at the entire hardware fingerprint\u2014browser headers, screen resolution, operating system behavior, and timezone consistencies. A server sitting in an AWS or DigitalOcean data center behaves differently than a MacBook Pro running Google Chrome in a residential neighborhood. \n\nWhile Dripify includes throttling features (limiting the number of actions per day) and randomized delays between actions, the fundamental architecture remains a risk. Cloud-based connection tools are engaged in a perpetual cat-and-mouse game with LinkedIn\u2019s engineering team. \n\n### Junior\u2019s Local Infrastructure\n\nJunior solves the security problem by avoiding the cloud entirely. The software runs locally on your computer. When Junior executes an action\u2014like analyzing a post or drafting a comment\u2014it happens within the context of your actual machine.\n\nLinkedIn sees your normal IP address. It sees your actual browser fingerprint, the same cookies you generate when browsing manually, and the exact hardware footprint you have always used. Because Junior relies on natural interaction patterns and focuses on commenting rather than mass connection requests, it operates well within the behavioral limits expected of an active, engaged professional.\n\nFor users deeply concerned about account bans, understanding the details of local vs. cloud architecture is non-negotiable. You can read a deeper technical breakdown in the [Is Junior AI Safe to Use On Linkedin Source Guide](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin-3), which outlines exactly how local execution protects digital assets. Additionally, comparing these models against other legacy tools like Phantombuster reveals similar vulnerabilities in cloud extraction, as discussed in the [Junior Vs Phantombuster Linkedin Safety Source Page for Job Seekers, Sales Teams, Lea](https://www.heyjunior.ai/blog/junior-vs-phantombuster-linkedin-safety).\n\n![Technical architecture diagram contrasting remote data center cloud automation with local residential browser execution.](https://assets.bevisible.app/inline-images/j57b7501db74vqztws5d6xbegx8h2n4m/inline-3-1793985470538-utv120.png)\n## Head-to-Head: Artificial Intelligence and Personalization\n\nAutomation without personalization is just a faster way to annoy your market. Both platforms claim to offer personalization, but they define the term differently.\n\n### Dripify: Rules-Based Variables\n\nIn Dripify, personalization is programmatic. It relies on standard merge tags extracted from a user's LinkedIn profile. The system can insert `{{first_name}}`, `{{company}}`, `{{industry}}`, or `{{job_title}}` into predefined templates.\n\nYou might build a template that says: \"Hi `{{first_name}}`, I saw you were working at `{{company}}` in the `{{industry}}` space. I'd love to connect.\"\n\nWhile Dripify allows for custom variables if you import a meticulously cleaned CSV file, the AI capabilities stop at basic text substitution. The platform does not read a prospect's recent posts or understand the nuance of their business model. It simply executes the template. This results in the \"uncanny valley\" of outreach\u2014messages that are technically accurate but clearly generated by a machine.\n\n### Junior: Context-Aware Generative AI\n\nJunior uses advanced Large Language Models (LLMs) to achieve a much deeper level of personalization. It does not rely on merge tags. Instead, it relies on semantic understanding.\n\nWhen Junior targets a post, the AI reads the entire text of the update. It identifies the core argument, the tone, and the industry context. It then references your pre-defined bio, your company's value proposition, and your specific campaign goals. \n\nThe resulting output is a drafted comment that synthesizes these elements. If a prospect posts a contrarian take on marketing attribution, Junior won't just say, \"Great post on attribution.\" It will draft a response that agrees or respectfully disagrees with the premise, citing a detail from your bio (e.g., \"As someone running an agency, I've seen firsthand how flawed first-touch attribution can be...\"). \n\nThis level of contextual awareness is what allows Junior to start authentic conversations. It sounds like a human because it is mimicking human reasoning, not just executing a find-and-replace function. When comparing tools in the comment automation space, this contextual depth is a major differentiator, as explored in [Junior vs Taplio for LinkedIn comments](https://www.heyjunior.ai/blog/junior-vs-taplio-linkedin-comments).\n\n## Feature Comparison Matrix\n\nTo clarify the operational differences between the two platforms, here is a breakdown of how they handle the core components of LinkedIn automation.\n\n| Feature Area | Dripify | Junior |\n| :--- | :--- | :--- |\n| **Primary Automation Strategy** | Cold Direct Messaging & Connection Requests | Public Feed Commenting & Visibility |\n| **Execution Environment** | Cloud-based (Dedicated IP) | Local Machine (Browser context) |\n| **Safety Profile** | Moderate (Relies on volume throttling and IPs) | High (Uses native hardware fingerprint) |\n| **Personalization Engine** | Standard variables (`{{first_name}}`, etc.) | Context-aware LLM synthesis based on user bio |\n| **Workflow Complexity** | High (Multi-step logical flowcharts) | Low (Streamlined comment review and approval) |\n| **Ideal User Intent** | Mass outbound pitching and pipeline velocity | Authority building, authentic networking, inbound pull |\n| **Team Management** | Advanced agency dashboards and multi-seat views | Focused on individual brand and authentic voice |\n\n## Strategic Workflows: Choosing Your Go-To-Market Motion\n\nSoftware is just a tool; the underlying go-to-market (GTM) motion dictates your success. Dripify and Junior cater to vastly different sales motions. \n\n### The Dripify Motion: Volume Outbound\n\nThe Dripify workflow is built for predictable, math-driven outbound sales. It is ideal for teams that know exactly who their buyer is, have a highly transactional product, and need to contact hundreds of people a month to hit quota.\n\nA typical Dripify GTM motion looks like this:\n1.  **Sourcing:** Use LinkedIn Sales Navigator to build a tightly defined list of 1,000 ideal customer profiles (ICPs).\n2.  **Structuring:** Export that list and load it into Dripify.\n3.  **Sequencing:** Build a 5-step campaign over 30 days (Connect, Message 1, View Profile, Message 2, Final Message).\n4.  **Executing:** Let the cloud server send the maximum allowable connections per day.\n5.  **Harvesting:** Monitor the inbox for positive replies and manually step in to book a demo.\n\nThe failure mode here is saturation. Because the barrier to entry for this motion is so low, your buyers are receiving identical sequences from your competitors. The conversion rates for cold DMs are steadily declining across the industry.\n\n### The Junior Motion: Authority Inbound\n\nThe Junior workflow is built for modern social selling. It relies on the psychological principle of reciprocity and the mechanics of the LinkedIn algorithm. It is ideal for founders, consultants, and sales professionals selling complex, high-ticket services where trust is the primary driver of the sale.\n\nA typical Junior GTM motion looks like this:\n1.  **Targeting:** Identify key creators, industry influencers, and high-value ICPs who actively post on LinkedIn.\n2.  **Aligning:** Configure your Junior bio to accurately reflect your unique expertise and value proposition.\n3.  **Engaging:** Use Junior to surface relevant discussions and draft high-context, insightful comments.\n4.  **Reviewing:** Spend 15 minutes a day reviewing, tweaking, and publishing these comments locally.\n5.  **Converting:** Capture the resulting inbound profile views. When prospects see your insightful comments, they view your profile. If your profile is optimized to sell, they send inbound connection requests and DMs, asking about your services.\n\nThis motion works because it bypasses the defense mechanisms buyers have built against cold pitches. When you appear in the comments with a smart perspective, you aren't a salesperson; you are a peer participating in a professional dialogue. For teams defining the [ai sale stack architecture](https://www.heyjunior.ai/blog/ai-sales-stack-architecture), shifting at least a portion of effort from volume outbound to authority inbound is becoming a strategic necessity.\n\n![Editorial funnel diagram illustrating traditional volume outbound versus comment-driven authority inbound conversion.](https://assets.bevisible.app/inline-images/j57b7501db74vqztws5d6xbegx8h2n4m/inline-4-1793985467044-oofkc3.png)\n## Ideal Use Cases: Who Wins Where?\n\nDepending on your role and organizational structure, one of these tools will clearly outpace the other.\n\n### When to Choose Dripify\n*   **Lead Generation Agencies:** If your business model involves managing 50 different client accounts and sending 20,000 total messages a month, Dripify\u2019s cloud dashboard and team management features are built for this exact scenario.\n*   **Transactional Sales Teams:** If you are selling a low-cost SaaS product where volume is more important than deep relationship building, a multi-step DM sequence might still yield a positive ROI.\n*   **Event Promotion:** When you need to aggressively push a webinar registration link to thousands of first-degree connections, Dripify\u2019s broadcast capabilities are efficient.\n\n### When to Choose Junior\n*   **Startup Founders:** Founders need to build public authority. Sending cold DMs undermines a founder's positioning. Junior allows founders to interact with investors, partners, and early adopters organically in the feed. This aligns perfectly with modern [social selling benchmark startup](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders) data, which shows founder visibility heavily influences pipeline.\n*   **Enterprise Account Executives:** If you are targeting a small list of massive accounts (e.g., Fortune 500 CIOs), you cannot afford to burn a bridge with a robotic DM. Using Junior to consistently comment on a CIO's posts over three months builds familiarity. When you finally ask for a meeting, it is a warm request.\n*   **Job Seekers:** A generic DM to a recruiter is easily ignored. Consistently providing intelligent commentary on the posts of hiring managers and internal recruiters makes a job seeker highly visible and demonstrates actual subject matter expertise.\n*   **Consultants and Fractional Leaders:** Independent professionals live and die by their perceived authority. Junior acts as a scale engine for thought leadership, ensuring your perspective is visible on the most important posts in your niche every day.\n\n## The Psychological Shift from Pitch to Presence\n\nThe transition from a tool like Dripify to a tool like Junior requires a shift in mindset. For years, sales leaders were trained to measure \"activity\" in terms of emails sent, dials made, and direct messages dispatched. These are metrics of *interruption*.\n\nCommenting, conversely, is a metric of *presence*. \n\nWhen you send a DM, you are demanding immediate attention in a private space. You are forcing the prospect to make a yes/no decision about your pitch. When you leave a well-crafted comment using Junior, you are contributing to a public asset. \n\nConsider the lifecycle of a comment. A DM dies the moment it is ignored. A high-quality comment lives on the post. It is seen not just by the author, but by the author's network. It can accumulate likes, spark secondary threads, and drive profile traffic weeks after it was posted. \n\nFurthermore, the act of commenting signals confidence. It implies that your ideas are strong enough to withstand public scrutiny. In B2B environments where buyers are desperate for credible vendors, this public display of competence is incredibly persuasive.\n\n## Frequently Asked Questions\n\n**Is local automation actually safer than cloud automation?**\nYes. LinkedIn\u2019s security systems are designed to catch behavioral anomalies and hardware mismatches. Cloud tools, by definition, require logging in from a data center IP address, which instantly flags the account as non-residential. Local automation like Junior runs on your machine, using your actual browser session, IP, and hardware fingerprint, bypassing these primary security tripwires.\n\n**Can I run Dripify and Junior at the same time?**\nTechnically, yes, but it is highly unadvisable. Running a cloud-based tool (Dripify) simultaneously with any local activity confuses LinkedIn\u2019s security algorithms. Seeing actions originate from a cloud server in one state while your local machine is active in another state is a guaranteed way to trigger an account restriction. It is best to choose one architecture and stick to it.\n\n**How do I measure the ROI of comment automation compared to DMs?**\nWith Dripify, ROI is measured linearly: Messages Sent \u2192 Replies \u2192 Meetings Booked. With Junior, the funnel looks different: Comments Posted \u2192 Profile Views \u2192 Inbound Connection Requests \u2192 Inbound Conversations. To measure Junior's ROI, you must track the increase in your profile viewer metrics and the volume of warm inbound DMs you receive weekly.\n\n**Does Junior's AI sound like a bot?**\nNo, because it does not rely on generic templates. Junior requires you to input a robust bio detailing your specific perspectives, industry experience, and tone. The LLM uses this framework to analyze the target post and draft a contextual response. Because you review and edit the comment before posting, the final output always remains authentic to your voice.\n\n**Are DMs completely dead?**\nNo. Direct messages are still the place where deals are negotiated and meetings are finalized. What is dead is the *cold* DM as a first-touch strategy. The modern workflow uses Junior for the first touch (public visibility and commenting) and reserves the DM for the second touch, after the prospect has already engaged with you publicly or viewed your profile.\n\n## Final Thoughts on Your Automation Strategy\n\nThe era of brute-forcing your way into the LinkedIn inbox is ending. The platforms built for that era, like Dripify, are incredibly robust for what they do, but the foundational strategy they support is yielding diminishing returns. Buyers are fatigued, and LinkedIn is aggressively protecting its users from inbox spam.\n\nJunior represents where the platform is heading. By shifting the focus from private interruption to public contribution, Junior allows professionals to build authentic authority at scale. It protects your digital assets by running locally, and it respects the intelligence of your buyers by facilitating context-aware conversations. \n\nIf your goal is to blast thousands of templated messages into the void in hopes of catching a fraction of a percent, traditional cloud sequencers will serve that need. But if your goal is to bypass the crowded inbox, leverage your unique expertise, and turn public visibility into high-quality pipeline, a localized, comment-driven approach is the definitive path forward for 2026 and beyond.", "created_at": "2026-11-09T17:19:23.434320+00:00", "updated_at": "2026-11-09T17:19:23.434327+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
