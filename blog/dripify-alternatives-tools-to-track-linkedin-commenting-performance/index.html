    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 81, "slug": "dripify-alternatives-tools-to-track-linkedin-commenting-performance", "title": "Dripify Alternatives for Tools to Track Linkedin Commenting Performance", "excerpt": "Explore top Dripify alternatives for tracking LinkedIn commenting performance. Learn why conversational engagement drives more pipeline than automated cold DMs.", "featured_image_url": "https://assets.bevisible.app/featured-images/j570ge99hzkw9gqb1q0h7dfb458b5n6t/dripify-alternatives-for-tools-to-track-linkedin-c-1787415480925-4cflbp.png", "published_at": "2026-08-22T16:00:00+00:00", "content": "# Dripify Alternatives for Tools to Track Linkedin Commenting Performance\n\nMost outbound sales reps and growth marketers treat LinkedIn commenting as a secondary chore. They spend hours configuring sequence builders like Dripify to send dozens of automated connection requests and cold direct messages, only to watch acceptance rates drop and prospect inboxes fill up with pitch fatigue. When they do attempt to track the impact of their comments, they run into a wall: traditional sequence tools were built for inbox outreach, not public engagement analytics.\n\nDripify excels at tracking sequence metrics like connection acceptance rates, message response rates, and profile view counts. However, when your pipeline strategy shifts toward conversational outbound, strategic relationship building, or thought leadership through thoughtful comments, Dripify offers almost no visibility into what happens out in the public feed. It cannot tell you which creator's post drove the highest profile visits, which comment style yielded profile clicks from target accounts, or how your engagement consistency correlates with inbound direct messages.\n\nTo measure the ROI of public engagement, you need specialized platforms. Whether you want detailed heatmaps of your commenting habits, multi-touch engagement analytics, or safe comment generation paired with workflow tracking, several alternatives give you full transparency into your LinkedIn performance.\n\n![Desk setup with tablet displaying comment activity heatmap and notebook comparing cold sequences to engagement.](https://assets.bevisible.app/inline-images/j570ge99hzkw9gqb1q0h7dfb458b5n6t/inline-1-1787415426154-yciq6r.png)\n---\n\n## Why Dripify Falls Short for Comment Performance Tracking\n\nDripify gained popularity as a cloud-based sequence engine. You upload a lead list from Sales Navigator, define a workflow of connection requests, messages, and profile views, and let the cloud server execute tasks on a schedule. While this model works for standard direct messaging cadences, it creates significant friction when measuring commenting impact.\n\n### 1. Cloud-Based Inflexibility and Account Safety Risks\nDripify runs automated tasks from dedicated cloud IP addresses. For routine direct message sequences, this allows automated execution without keeping your browser open. But automated commenting from cloud servers is heavily scrutinized by LinkedIn's anti-bot detection systems. When LinkedIn detects automated public posts originating from non-residential IP ranges or sudden spikes in comment actions, it flags the profile or restricts commenting privileges. Safe engagement requires local execution that mirrors natural human browsing behavior.\n\n### 2. Sequence-Centric Metrics vs. Conversation Analytics\nDripify measures your pipeline in terms of funnels:\n* Step 1: Profile View\n* Step 2: Connection Request Sent\n* Step 3: Message Sent\n* Step 4: Reply Received\n\nThis linear framework completely misses the multi-touch dynamic of social selling. On LinkedIn, a prospect might see three insightful comments you left on industry peers' posts over two weeks before they visit your profile, send *you* a connection request, or accept your meeting invitation. Dripify cannot attribute conversations or meetings back to specific public comments or track your commenting volume over time.\n\n### 3. Lack of Feed Monitoring and Discussion Discovery\nTo track commenting performance, you first need a system that surfaces the right conversations. Dripify relies on static lists of profiles rather than active monitoring of discussions where your target buyers are engaging. If you cannot monitor specific influencers, prospects, and trending industry topics in real time, measuring the conversion rate of your public comments becomes nearly impossible.\n\nFor founders, consultants, and sales professionals who want to move away from cold messaging funnels, evaluating [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) reveals how conversational outbound produces higher-intent relationships than blunt automation.\n\n---\n\n## The Core Metrics Needed to Track LinkedIn Commenting Performance\n\nBefore selecting an alternative, it helps to establish what commenting performance metrics actually matter. Commenting is not merely a branding exercise; it is an active top-of-funnel engine that feeds your pipeline.\n\n![Diagram breaking down LinkedIn commenting metrics into activity, resonance, conversion, and pipeline attribution.](https://assets.bevisible.app/inline-images/j570ge99hzkw9gqb1q0h7dfb458b5n6t/inline-2-1787415425554-k00iho.png)\n```\n+-------------------------------------------------------------------+\n|               LINKEDIN COMMENT PERFORMANCE TAXONOMY               |\n+---------------------------------+---------------------------------+\n| Activity & Consistency Metrics  | Engagement & Resonance Metrics  |\n| - Daily Comment Volume          | - Comment Likes & Reactions     |\n| - Commenting Streaks (Heatmap)  | - Reply Threads Generated       |\n| - Target Account Coverage Rate  | - Post Author Responses         |\n\n+---------------------------------+---------------------------------+\n| Downstream Conversion Metrics   | Pipeline & Attribution Metrics  |\n| - Post-Comment Profile Visits   | - Direct Messages Received      |\n| - Inbound Connection Requests   | - Discovery Calls Booked        |\n| - Target Account Profile Views  | - Influencer Relationship Score |\n\n+---------------------------------+---------------------------------+\n```\n\n### Activity and Consistency Metrics\nConsistency is the single biggest predictor of organic reach on LinkedIn. Tracking the total number of comments left per day, the days per week you engage, and your streak history shows whether your team is putting in the baseline activity needed to stay visible in your niche.\n\n### Engagement and Resonance Metrics\nLeaving twenty generic \"Great insight!\" comments accomplishes nothing. Resonance metrics evaluate how the audience reacts to your contributions:\n* **Comment Reactions:** How many likes, insightful reactions, or supports your comment receives from other readers.\n* **Reply Threads:** How often your comment sparks a secondary discussion beneath the original post.\n* **Creator Responses:** Whether the post author acknowledges and engages with your perspective, validating you in front of their audience.\n\n### Downstream Profile and Pipeline Attribution\nThe ultimate test of a comment is what the reader does next. High-performing comments generate curious clicks to your profile. By pairing commenting tracking with profile visit metrics and CRM syncs\u2014similar to techniques discussed when examining [how to sync LinkedIn messages with CRMs](https://www.trykondo.com/blog/sync-linkedin-messages-crms)\u2014you can see whether your comments drive actual pipeline from relevant decision-makers.\n\n---\n\n## Top Dripify Alternatives for Tracking and Managing Commenting\n\nWhen evaluating alternatives to Dripify for commenting analytics and execution, the market splits into two main categories: dedicated analytics engines that visualize your output, and AI-powered workflow platforms that assist in drafting, finding, and tracking safe conversations.\n\n| Platform | Primary Focus | Comment Tracking Capability | Account Safety Model | Best For |\n| :--- | :--- | :--- | :--- | :--- |\n| **Junior** | Conversational Outbound & AI Commenting | Real-time queue, conversational tracking, context monitoring | Local execution on user's machine | Sales teams, founders, job seekers, and agencies wanting pipeline from comments |\n| **MyFeedIn** | Comment Analytics & Heatmaps | 12-month consistency heatmap, format testing, streak tracking | Analytics integration / Chrome extension | Creators and sales professionals focusing on commenting consistency |\n| **Shield Analytics** | Holistic Profile & Post Analytics | Post-level engagement, reach tracking, long-term trends | API / Browser-based reporting | Enterprise content teams and executive personal brands |\n| **AuthoredUp** | Content Creation & Engagement Analytics | Draft tracking, comment preview, historical reaction stats | Extension-based local analytics | Thought leaders and content creators refining messaging |\n| **Bearconnect** | Outreach & Analytics Platform | Engagement rate benchmarks, impression tracking | Hybrid cloud / desktop | Outbound teams measuring impression-to-conversation ratios |\n\n---\n\n## 1. Junior: Context-Aware Outbound and Conversation Tracking\n\nWhile most legacy automation tools treat LinkedIn like an automated email blast, **Junior** takes a completely different approach by focusing on conversational outbound. Instead of blasting cold direct messages that ruin your domain reputation, Junior helps sales professionals, job seekers, founders, and consultants engage in active discussions where prospects are already talking.\n\n![Wireframe illustration of local, context-aware LinkedIn comment management and relationship tracking.](https://assets.bevisible.app/inline-images/j570ge99hzkw9gqb1q0h7dfb458b5n6t/inline-3-1787415423310-v7m6dm.png)\n### Local Execution for Unmatched Safety\nUnlike Dripify's cloud server infrastructure, Junior runs locally on the user's machine. By operating directly through your native desktop environment and browser session, it mirrors genuine human interaction patterns. This eliminates the risk of IP mismatches that trigger LinkedIn security checkpoints. For teams concerned about compliance and profile longevity, exploring [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) illustrates why local architecture is superior to cloud scrapers.\n\n### Bio-Aware, Contextual Intelligence\nJunior reads the original post, understands the underlying industry nuances, and references your unique background and goals to draft context-aware, human-sounding replies. It completely avoids the generic \"Thanks for sharing!\" responses that damage professional credibility.\n\n### From Comment to Pipeline\nJunior tracks the discussions you join and helps you monitor interactions with key accounts over time. By bypassing crowded inboxes and building public familiarity first, Junior turns visible contributions into direct interviews, sales pipeline, and warm consulting conversations.\n\nIf you are exploring modern engagement platforms, check out our guide on the [best LinkedIn engagement tools in 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n---\n\n## 2. MyFeedIn: Dedicated Comment Heatmaps and Consistency Tracking\n\nIf your primary objective is tracking the volume and consistency of your commenting strategy, **MyFeedIn** provides dedicated visualization tools specifically engineered for comment tracking.\n\n### 12-Month Activity Heatmaps\nBorrowing a design concept from developer commit graphs on GitHub, MyFeedIn plots every comment you leave across a visual 12-month heatmap according to [MyFeedIn's LinkedIn analytics documentation](https://myfeedin.co/features/linkedin-analytics). This gives you an instant, high-level view of your engagement discipline, helping you maintain daily commenting streaks and spot gaps in your weekly routine.\n\n### Engagement Format Breakdown\nMyFeedIn allows users to toggle between post views, comment likes, and overall reaction counts to identify which commenting formats perform best. As detailed in their analysis on [how to get more views on LinkedIn](https://myfeedin.co/get-more-views-on-linkedin), creators and outbound reps who maintain consistent commenting habits generate significantly higher organic profile impressions than those who rely strictly on original posts.\n\n### Practical Limitations\nWhile MyFeedIn offers deep insight into your commenting volume and post reach, it is primarily a tracking dashboard. It does not identify relevant discussions automatically or draft contextual responses based on your sales goals.\n\n---\n\n## 3. Shield Analytics: Enterprise-Grade Personal Brand Metrics\n\n**Shield** has long been an industry standard for detailed LinkedIn creator metrics. While initially built to monitor post impressions, reach, and follower demographics, it provides comprehensive data on how total profile activity drives brand awareness.\n\n### Long-Term Engagement Aggregation\nShield tracks your engagement rate over custom timeframes (30, 90, or 365 days). By monitoring how your overall profile interactions change during high-commenting periods versus low-commenting periods, you can quantify the halo effect that active feed participation has on your content reach.\n\n### Audience Quality and Demographic Data\nWhen you comment thoughtfully on influential posts in your sector, your profile view quality changes. Shield helps you track whether the job titles and industries of the people viewing your profile match your ideal customer profile (ICP).\n\n### The Tradeoff\nShield does not offer a granular breakdown of individual comment threads or measure direct conversions from specific post replies. It serves primarily as a high-level reporting dashboard for corporate executives and brand marketing teams.\n\n---\n\n## 4. AuthoredUp: Content Optimization and Engagement Workflow\n\n**AuthoredUp** is widely recognized as an advanced drafting and analytics extension for LinkedIn creators. While its primary strength lies in formatting and analyzing original posts, its engagement monitoring tools provide valuable insights for active commenters.\n\n### Historical Performance Comparison\nAuthoredUp tracks historical reactions and engagement metrics, allowing you to review your top-performing contributions. By analyzing which types of commentary resonate most with specific audiences, you can systematically improve the depth and structure of your replies.\n\n### Local Privacy Architecture\nLike Junior, AuthoredUp operates locally through a browser extension, preventing the security risks associated with sharing session cookies with cloud-hosted scraping tools.\n\n---\n\n## 5. Bearconnect: Impression and Benchmark Tracking\n\nFor teams seeking hard benchmarks on how engagement translates into visibility, **Bearconnect** provides clear comparative analytics.\n\n### Impression and Engagement Benchmarking\nUnderstanding whether your engagement rate is healthy requires reliable context. According to industry metrics published in [Bearconnect's analysis of LinkedIn impressions](https://bearconnect.io/blog/what-are-impressions-on-linkedin/), maintaining balanced engagement tracking between original posts and outbound comments is crucial for maximizing personal profile visibility.\n\n### Outbound Conversion Tracking\nBearconnect helps bridge the gap between outreach activities and profile impressions, giving outbound sales teams a clearer picture of whether their prospects are interacting with their profiles before or after outreach attempts.\n\n---\n\n## The Strategic Shift: Why Commenting Outperforms Cold DM Sequences\n\nFor years, outbound sales teams followed a simple formula: buy a list, load it into a tool like Dripify or Phantombuster, and fire off connection requests with pre-written templates. In 2026, this approach is yielding diminishing returns.\n\n![Whiteboard diagram comparing traditional cold direct messaging funnels with conversational public commenting.](https://assets.bevisible.app/inline-images/j570ge99hzkw9gqb1q0h7dfb458b5n6t/inline-4-1787415421953-g67ao2.png)\n```\n+-------------------------------------------------------------------+\n|               TRADITIONAL DM vs. CONVERSATIONAL OUTBOUND          |\n+-----------------------------------+-------------------------------+\n| Cold DM Automation (Dripify)      | Conversational Outbound       |\n+-----------------------------------+-------------------------------+\n| 1. Cloud-based scraper sends      | 1. Find relevant industry     |\n|    generic connection request     |    discussion where ICP hangs |\n| 2. Prospect feels targeted by     | 2. Leave thoughtful,          |\n|    sales sequence                 |    value-adding comment       |\n| 3. High rejection & ignore rate   | 3. Prospect & author read     |\n| 4. Profile flagged for repetitive |    and appreciate your take   |\n|    inbox behavior                 | 4. Prospect visits your       |\n|                                   |    profile with high intent   |\n\n+-----------------------------------+-------------------------------+\n```\n\n### The Death of the Inbound Cold Pitch\nDecision-makers receive dozens of template-driven messages every week. They have developed an acute sensitivity to automated phrasing. When a message reads like a sequence step, it gets marked as spam or archived immediately.\n\n### The Value-First Commenting Motion\nWhen you leave an insightful, nuanced comment on a prospect's post\u2014or on an industry post they are actively reading\u2014you achieve three things:\n1. **Public Social Proof:** You demonstrate subject-matter competence in front of the prospect and their entire professional network.\n2. **Frictionless Interaction:** The prospect does not have to commit to a 30-minute call or accept a connection request to evaluate your ideas.\n3. **Warm Inbound Curiosity:** Decision-makers frequently check the profiles of commenters who add valuable perspectives to their discussions.\n\nIf you are currently evaluating other cloud tools, reviewing [Phantombuster alternatives for safe LinkedIn comment automation](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) and our [checklist for automating LinkedIn comments safely](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) provides deeper operational guidelines for protecting your account.\n\n---\n\n## Step-by-Step Framework for Measuring Commenting ROI\n\nTo build a predictable lead generation engine using commenting, implement a structured measurement framework.\n\n### Step 1: Establish Your Baseline Activity Metric\nSet a daily goal for meaningful comments (for example, 10 to 15 substantive contributions per day). Use a tracking tool like MyFeedIn or Junior's workflow queue to monitor your daily execution. Avoid surface-level reactions; focus on adding unique data, practical counterpoints, or operational examples.\n\n### Step 2: Track Target Account Engagement Rate\nCreate a monitoring list containing your top 50 to 100 dream accounts or industry influencers whose audiences match your ideal customer profile. Use tools specialized in post discovery\u2014such as those detailed in our guide on [tools to find relevant LinkedIn posts beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio)\u2014to ensure you never miss an active thread.\n\n### Step 3: Monitor Inbound Profile View Velocity\nReview your LinkedIn profile views weekly. When you execute an active commenting strategy, you should see an immediate 40% to 100% lift in total weekly profile visits. More importantly, verify the job titles of those visitors. If your target buyers are visiting your profile after you comment on industry threads, your messaging is working.\n\n### Step 4: Track Secondary Interactions and Warm Outreach Conversion\nWhen a prospect likes your comment, replies to your thread, or views your profile after an interaction, initiate warm contact. Instead of a cold pitch, reference the public discussion:\n\n> *\"Hi [Name], loved your take on [Topic] in [Creator]'s thread yesterday\u2014especially your point about [Specific Detail]. Thought I'd connect directly to keep up with your work.\"*\n\nTrack the acceptance rate of these conversation-led connection requests compared to traditional cold outreach. In practice, conversation-led connection requests routinely achieve acceptance rates above 60%, compared to the sub-20% averages typical of blind sequence tools.\n\nTo ensure your team selects the right stack, review our [AI tools for LinkedIn commenting evaluation checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) and compare the top solutions in our roundup of the [best AI tools for LinkedIn commenting beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n---\n\n## Practical Scenario: How a Boutique Agency Shifted from Dripify to Comment Tracking\n\nConsider the case of an enterprise design consultancy targeting VP-level product leaders. For six months, the team ran Dripify sequences targeting 1,500 product leaders across North America.\n\n### The Problem\n* Total Connection Requests Sent: 1,500\n* Acceptance Rate: 18% (270 connections)\n* Direct Message Reply Rate: 4.2% (11 replies)\n* Qualified Discovery Calls Booked: 2\n* Major Issue: Account flagged twice for unusual connection velocity, requiring cooldown periods.\n\n### The Strategic Pivot\nThe consultancy completely disabled automated connection sequences and shifted to a conversational outbound model:\n1. They identified 30 prominent product strategy creators and active LinkedIn voices whose posts regularly attracted VPs of Product.\n2. Using Junior, their team monitored these key discussions daily and drafted context-aware, insightful replies highlighting UX audit frameworks.\n3. They tracked commenting streaks and response volume using dedicated analytics dashboards.\n4. When a product leader liked their comment or viewed their consultant's profile, they followed up with a contextual message referencing the post topic.\n\n### The 60-Day Outcome\n* Total Substantive Comments Published: 420\n* Inbound Profile Views: +185% increase over baseline\n* Inbound Connection Requests Received: 68 from verified VP/Director-level leaders\n* Discovery Calls Booked: 9\n* Account Restrictions: 0\n\nBy moving away from cloud-based message sequences toward safe, public commenting, the team increased discovery call volume more than fourfold while keeping their accounts safe.\n\n---\n\n## Contrarian Insight: Why Comment Reach Metrics Can Be Misleading\n\nA common trap when tracking LinkedIn commenting performance is obsessing over vanity metrics\u2014specifically, comment likes and total views.\n\n### The Illusion of Viral Comments\nLeaving a humorous, controversial, or generic motivational comment on a viral celebrity influencer's post might net you 150 comment likes and dozens of replies. However, if those interactions come from entry-level professionals, students, or random accounts outside your target market, your commercial return is zero.\n\n### The High-Value \"Quiet\" Comment\nConversely, leaving an in-depth, technical analysis on a niche post with only 12 likes might receive just 2 comment reactions. But if one of those reactions comes from the Chief Information Security Officer of a target enterprise account who subsequently visits your profile and reviews your services, that single comment is exponentially more valuable than a viral one.\n\nWhen tracking commenting performance, prioritize **Account Relevancy and Downstream Profile Action** over raw reaction counts.\n\n---\n\n## Frequently Asked Questions\n\n### Can Dripify track how many likes my comments receive?\nNo. Dripify is fundamentally an outbound messaging sequence tool. It does not monitor post feeds, track comment reply threads, or record the engagement metrics of your comments on third-party posts.\n\n### How does tracking LinkedIn commenting performance differ from tracking post performance?\nPost performance measures the reach, impressions, and engagement of content you publish on your own profile. Comment performance tracking measures your outbound activity on other people's posts, tracking metrics such as consistency streaks, creator reply rates, comment upvotes, and the downstream profile visits generated from those interactions.\n\n### Are cloud-based LinkedIn automation tools safe for automated commenting?\nCloud-based automation tools carry higher risk when performing public actions like commenting and posting. LinkedIn monitors IP consistency, session patterns, and browser fingerprints. If comments originate from datacenter IP addresses or occur at unrealistic speeds, accounts face temporary or permanent restrictions. Local execution tools that run directly in your browser provide a safer alternative.\n\n### How many comments should I leave on LinkedIn per day to see measurable results?\nFor outbound sales, consulting, and personal brand growth, leaving 10 to 20 thoughtful, high-context comments per day is the optimal range. This volume is manageable, keeps your account well within safe activity limits, and generates enough visibility to drive a steady stream of targeted profile visits.\n\n### How do I link comment performance to actual revenue or pipeline?\nTo measure commenting ROI, track your inbound profile views, inbound connection requests, and conversation starters immediately following active commenting sessions. When following up with prospects who engaged with your public comments, tag them in your CRM under a \"Conversational Outbound\" campaign to attribute downstream opportunities and closed deals accurately.\n\n---\n\n## Choosing the Right Approach for Your LinkedIn Strategy\n\nRelying solely on Dripify for modern LinkedIn lead generation leaves you blind to the most effective organic channel available: meaningful public conversation. Cold connection sequences are increasingly filtered out by busy professionals, while thoughtful commentary positions your expertise directly in front of active buyers.\n\nIf you need pure historical analytics and visual consistency tracking, tools like **MyFeedIn** and **Shield** provide clear visibility into your activity. \n\nIf your goal is turning public discussions into a reliable pipeline of clients, discovery calls, and warm relationships without risking your account, **Junior** offers an AI-powered, locally executed platform that helps you find the right posts, craft human-sounding contributions, and measure real conversational growth.\n\nFor teams comparing different toolsets for their daily workflow, exploring [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) and checking our guide on the [safest tools for automating LinkedIn comments beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) will help you build an efficient, secure engagement engine.", "created_at": "2026-08-22T16:19:23.576335+00:00", "updated_at": "2026-08-22T16:19:23.576346+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
