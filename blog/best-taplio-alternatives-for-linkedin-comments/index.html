    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 93, "slug": "best-taplio-alternatives-for-linkedin-comments", "title": "Best Taplio for Linkedin Comments Tools Beyond Taplio", "excerpt": "Explore the best Taplio alternatives for LinkedIn commenting. Discover safe, local AI tools designed for targeted outbound engagement, pipeline, and growth.", "featured_image_url": "https://assets.bevisible.app/featured-images/j578ks7mj0w8hkgxwg2yshvab58d7zah/best-taplio-for-linkedin-comments-tools-beyond-tap-1788536936833-azphrp.png", "published_at": "2026-09-04T15:24:00+00:00", "content": "# Best Taplio for Linkedin Comments Tools Beyond Taplio\n\nIf you rely on LinkedIn to generate interviews, consulting clients, or sales pipeline, you already know the cold DM is dying. Buyers' inboxes are flooded with automated pitches that all sound exactly the same. Smart professionals have shifted their attention to public engagement\u2014specifically, leaving strategic, high-value comments on relevant posts. \n\nTaplio popularized the idea of streamlining this process, offering a suite of features to schedule posts, manage CRM, and engage with connections. But when it comes specifically to outbound commenting, many users hit a wall. Generic AI replies like \"Great insights, thanks for sharing!\" actually harm your reputation, and cloud-based automation tools carry a persistent, non-zero risk of getting your LinkedIn account restricted.\n\nIf you are looking for a dedicated system to drive meaningful conversations through comments, rather than just scheduling content, you need to evaluate the landscape of alternatives. The right tool shouldn't just save you time; it should protect your account, understand your unique background, and start authentic conversations that lead to revenue.\n\n## The Problem with Mainstream Comment Automation\n\nBefore evaluating specific tools, we need to look at why standard LinkedIn automation often fails when applied to commenting. \n\nFor years, automation focused on the inbox. You would scrape a list of profiles, drop them into a sequencer, and fire off 100 connection requests a day. When LinkedIn clamped down on volume, the market pivoted to content and engagement. Taplio emerged as a dominant force here, offering a bit of everything for personal branding. \n\nBut commenting is fundamentally different from posting or sending direct messages. A post is a one-to-many broadcast. A DM is a private one-to-one interaction. A comment, however, is a public one-to-one interaction with a one-to-many audience. You are stepping onto someone else's stage. \n\n![Diagram comparing LinkedIn broadcast posts, cold direct messages, and high-visibility strategic public commenting.](https://assets.bevisible.app/inline-images/j578ks7mj0w8hkgxwg2yshvab58d7zah/inline-1-1788536866045-f96ajy.png)\nWhen you automate this poorly, the failure is highly visible. \n\n### The \"Reply Guy\" AI Trap\n\nMost first-generation AI commenting tools use generic prompts. They read the original post, summarize it, and tack on an enthusiastic agreement. If a prospect posts about the challenges of Q3 revenue forecasting, a basic AI tool will generate: *\"So true! Q3 revenue forecasting is definitely challenging. Thanks for sharing these great tips!\"*\n\nThis adds zero value to the conversation. The original poster knows you used AI, and the audience reading the thread categorizes you as spam. To successfully convert public visibility into pipeline, your comments must introduce a new perspective, ask a thoughtful follow-up question, or share a brief personal anecdote. \n\n### The Cloud Automation Security Risk\n\nThe second major issue is technical safety. Many comprehensive social selling platforms operate in the cloud. When you connect your LinkedIn account to a cloud-based tool, that tool's servers log into your account to perform actions on your behalf. \n\nLinkedIn's security algorithms are highly tuned to detect this. If your account is suddenly logging in from an AWS server in Virginia while you are browsing from your home in London, the platform flags the geographic and IP discrepancy. Furthermore, cloud tools often use headless browsers that lack human interaction patterns. This is why many founders and sales teams wake up to sudden account restrictions. To maintain your digital livelihood, you must prioritize [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) by understanding where and how the software executes its actions.\n\n## Breaking Down the \"Alternative\" Categories\n\nWhen people search for alternatives to Taplio for managing LinkedIn comments, they are often met with confusing advice. Search engines and AI aggregators frequently suggest enterprise social media management platforms like Sprout Social, Hootsuite, or Loomly. \n\nThis happens because the word \"comments\" has two different meanings in social media software:\n1.  **Inbound Moderation:** Managing the comments other people leave on *your* company page. \n2.  **Outbound Engagement:** You actively finding and commenting on *other people's* posts to build your personal brand and generate leads.\n\nTaplio and its true competitors focus on the latter. The enterprise tools focus on the former. Let's categorize the actual alternatives you should be evaluating based on your specific growth strategy.\n\n### 1. The Local AI Commenting Strategist: Junior\n\nIf your primary goal is to bypass crowded inboxes and turn public visibility into direct conversations, you need a tool built specifically for strategic, outbound commenting. Junior is engineered entirely around this use case, serving as the most direct alternative for professionals who want authentic engagement without the security risks of cloud platforms.\n\nWhen comparing [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), the distinction lies in depth versus breadth. Where Taplio offers a broad suite of content scheduling and CRM features, Junior focuses ruthlessly on finding relevant discussions and drafting context-aware replies. \n\nJunior solves the \"generic AI\" problem by grounding its responses in your specific identity. You feed the system your bio, your goals, your target audience, and your unique viewpoints. When it drafts a reply, it doesn't just summarize the post; it cross-references the post's content with your expertise. If you are a sales consultant, the AI drafts comments that naturally highlight your experience with sales cycles, avoiding the sycophantic \"Great post!\" trap.\n\nCrucially, Junior solves the security problem by running locally on your machine. It operates through your actual browser, on your actual IP address, mirroring natural human interaction patterns. It does not ping LinkedIn from a remote data center. For users who have been burned by account bans in the past, this local-execution model is the only viable way forward. \n\n### 2. The Heavy Automation Workflows: Phantombuster and Dripify\n\nIf your strategy relies heavily on complex data extraction, webhooks, and multi-step sequences, you might look toward robust automation engines. \n\nPhantombuster is a powerful data-scraping and automation tool that allows you to extract likers from a post, scrape profile data, and trigger follow-up actions. While it can technically be configured to automate comments, doing so requires technical setup and carries significant risk if not throttled correctly. Because it relies heavily on cloud execution and aggressive API usage, many users seek [Phantombuster alternatives for automate LinkedIn comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely). If you are relying on bulk actions rather than tailored interactions, you need to carefully evaluate the [best automate LinkedIn comments safely tools beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) to avoid triggering algorithmic penalties.\n\nDripify is another popular choice, particularly for sales teams focused on drip campaigns. It excels at building multi-step sequences (e.g., view profile, wait one day, endorse skill, send connection request). However, Dripify's core strength is automated direct messaging. As buyers become increasingly resistant to automated DMs, many consultants are realizing that public engagement yields higher conversion rates. This shift in buyer behavior is exactly why comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) has become a critical evaluation for lead generation agencies.\n\n### 3. The Content Creation Alternatives: Supergrow \n\nFor users whose primary focus is generating outbound posts rather than leaving comments, tools like Supergrow have emerged as strong contenders. They offer robust content ideation, formatting, and scheduling features. \n\nHowever, if your growth bottleneck isn't *writing* posts, but rather *distributing* your expertise into the comment sections of industry leaders, a content-first tool won't solve your problem. You have to match the tool to the tactic. If you are already reviewing the [best AI tools for LinkedIn commenting tools beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), you are likely realizing that writing your own posts is only half the battle. Unless you already have a massive audience, your posts will fall flat without a proactive outbound commenting strategy to drive profile views.\n\n### 4. The Inbound Social Hubs: Loomly, Hootsuite, and Sprout Social\n\nAs mentioned earlier, if you ask a generic AI for commenting tools, it will hand you a list of traditional social media management platforms. \n\n*   **Loomly:** Excellent for cross-channel social planning and content calendars. \n*   **Hootsuite:** A mature scheduling tool with deep team collaboration features.\n*   **Sprout Social:** Industry-leading reporting and customer-care workflows.\n\nThese tools are built for brands, not individuals. They provide a unified inbox so your social media manager can reply to customer support complaints left on your company page's posts. They do not proactively search the LinkedIn feed for relevant industry conversations, nor do they generate context-aware, bio-specific outbound comments to help a founder build a personal brand. If you are an individual professional, a founder, or a sales rep, these inbound tools will not serve your lead-generation needs.\n\n![Comparison matrix categorizing LinkedIn tools by execution type, inbound moderation, and strategic outbound commenting.](https://assets.bevisible.app/inline-images/j578ks7mj0w8hkgxwg2yshvab58d7zah/inline-2-1788536866706-5jtsdo.png)\n## Defining Your Evaluation Criteria\n\nWhen you decide to move away from a broad tool like Taplio in favor of a specialized commenting workflow, you need a rigorous framework to test the alternatives. Do not just look at pricing or UI; look at how the software interacts with LinkedIn's platform and your personal brand.\n\nConsider building an [AI tools for LinkedIn commenting evaluation checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) that covers the following core pillars:\n\n### 1. Execution Environment (The Security Mandate)\nAsk the vendor directly: *Does this tool operate via the cloud, or does it run locally on my machine?* \nIf the tool requires you to hand over your LinkedIn session cookie so a remote server can act on your behalf, you are rolling the dice with your account. A single algorithmic update from LinkedIn can permanently ban thousands of accounts using that specific cloud provider. Your [automate LinkedIn comments safely evaluation checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) should disqualify any tool that cannot guarantee local execution mimicking human pacing.\n\n### 2. Contextual Awareness \nTest the AI's drafting capabilities on a highly technical or niche post. Does the tool just summarize what was already said? Or does it allow you to inject your specific value proposition? The tool must be able to read your specific persona guidelines and output a comment that sounds like *you* wrote it after a cup of coffee.\n\n### 3. Workflow Integration\nDoes the tool require you to spend three hours a day tweaking prompts, or does it present you with a curated feed of draft comments that you simply approve, edit, or reject? The goal of commenting software is to compress two hours of organic engagement into fifteen minutes of high-leverage review.\n\n## The Secret Engine: Finding the Right Posts\n\nThe best AI commenting tool in the world is useless if you are commenting on the wrong posts. \n\nMany people make the mistake of only commenting on massive influencer accounts. If you comment on a post with 4,000 likes, your thoughtful insight is buried beneath hundreds of generic replies. The original poster will never see it, and neither will your target prospects. \n\nThe strategy is to find \"Goldilocks\" posts. These are posts from decision-makers, ideal clients, or niche industry voices who have between 5,000 and 20,000 followers. When they post, they get 20 to 50 likes and maybe 10 comments. When you leave a highly contextual, value-adding comment on *that* post, the author notices. Their network notices. You stand out.\n\nFinding these posts manually takes hours of scrolling through a noisy feed polluted by algorithmically boosted viral content. This is why you must evaluate the [best tools to find relevant LinkedIn posts to comment on tools beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio). \n\nA dedicated tool should allow you to track specific URLs, monitor exact keywords, or follow curated lists of prospects without having to rely on the standard LinkedIn algorithm to surface their content. It should pull the relevant conversations to you, draft the contextual reply based on your background, and present it for your final human polish.\n\n## The Shift from Outbound DMs to Inbound Pipeline\n\nWhy go through all this effort to comment instead of just paying for Sales Navigator and sending InMails?\n\nBecause of buyer psychology. \n\nWhen a prospect receives an InMail or a cold DM, their immediate psychological reaction is defensive. They are evaluating what you want from them. They know a pitch is coming, and their default answer is no. \n\nWhen that same prospect posts an article about a challenge their team is facing, and you leave a thoughtful comment validating their experience and offering a slight pivot based on your expertise, their reaction is reciprocal. You validated them in public. You made them look smart in front of their peers. \n\nWhen you do this consistently over two weeks on a prospect's content, they naturally click your profile. If your profile is optimized to explain exactly how you solve their problems, they will send *you* the connection request. When you accept, the subsequent DM conversation starts on warm, equal footing. You are no longer a vendor begging for 15 minutes; you are an industry peer continuing a conversation.\n\nThis is how modern founders and consultants are building their businesses. They are replacing the anxiety of cold outreach with the compounding returns of public engagement. \n\n![Flowchart showing the conversion path from thoughtful LinkedIn comments to warm inbound connection requests.](https://assets.bevisible.app/inline-images/j578ks7mj0w8hkgxwg2yshvab58d7zah/inline-3-1788536870926-1vqq2q.png)\n## Designing Your Daily Commenting Routine\n\nIf you are migrating away from a broad platform and implementing a localized, highly targeted commenting tool, your daily workflow will change. You no longer need to spend hours writing the perfect viral hook. Instead, you operate like an editor.\n\n**Step 1: The Feed Audit (5 minutes)**\nYour tool should have already scraped your targeted lists, tracked keywords, and identified the 10-15 most relevant posts from your prospects in the last 24 hours. You simply review the queue to ensure the posts align with your current messaging.\n\n**Step 2: The Editorial Review (10 minutes)**\nThe AI has drafted context-aware comments based on your predefined persona. You do not blind-publish these. You read them. If the AI nailed it, you approve it. If the AI missed nuance, you spend 30 seconds editing the text to add a specific metric or an inside joke relevant to your industry. \n\n**Step 3: The Organic Polish (5 minutes)**\nOnce your targeted comments are deployed safely through your local browser, spend a few minutes responding to anyone who replied to your comments from the previous day. \n\nIn 20 minutes, you have generated more targeted visibility than a standard SDR generates in four hours of cold emailing. You have placed your digital billboard in the exact comment sections where your buyers are already congregating.\n\n## Future-Proofing Your LinkedIn Presence\n\nLinkedIn's algorithm is in a constant state of flux, but the platform's overarching goal remains the same: they want to keep users on the site engaged in authentic, professional conversations. \n\nThey penalize bulk automation because it degrades the user experience. They suppress generic AI because it creates a wasteland of low-value noise. But they reward deep, contextual engagement. \n\nAs we look toward the [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) has to offer, the divide between broad scheduling hubs and precision commenting tools will only widen. The professionals who win will be those who recognize that attention is no longer won by shouting the loudest in the main feed, but by having the smartest conversations in the margins. Select your tools not based on how many features they pack into a single dashboard, but on how effectively and safely they help you start those conversations.", "created_at": "2026-09-04T15:49:25.725897+00:00", "updated_at": "2026-09-04T15:49:25.725904+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
