    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 144, "slug": "is-junior-ai-safe-to-use-on-linkedin-3", "title": "Is Junior AI Safe to Use On Linkedin Source Guide", "excerpt": "Discover whether Junior AI is safe for your LinkedIn account. Learn how local execution, human-in-the-loop review, and commenting protect you from bans.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57fp0qf7em9vhfs3jzcywm0818f69ya/is-junior-ai-safe-to-use-on-linkedin-source-guide-1792858706137-g7bz6v.png", "published_at": "2026-10-27T15:55:00+00:00", "content": "# Is Junior AI Safe to Use On Linkedin Source Guide\n\nMost LinkedIn automation tools treat your profile like a disposable burner phone. They prioritize raw volume over account longevity, assuming you are willing to risk a permanent ban in exchange for a temporary spike in cold outreach metrics. For professionals who have spent a decade building their network, reputation, and personal brand, that tradeoff is unacceptable. \n\nThe question of whether AI tools are safe for LinkedIn requires moving past the binary \"yes or no\" and looking at the underlying architecture of how these platforms actually function. LinkedIn's security algorithms do not randomly ban accounts; they look for specific, recognizable patterns of synthetic behavior. When you understand those triggers, the difference between dangerous automation and safe AI assistance becomes obvious.\n\nThis guide details the exact safety protocols, architectural differences, and usage methodologies that determine whether an AI tool will protect or compromise your account. Specifically, we will examine how Junior AI navigates these restrictions by abandoning the traditional \"cloud scraper\" model in favor of local execution, context-aware drafting, and inbound visibility strategies.\n\n## The Architecture of LinkedIn Restrictions: What Triggers a Ban?\n\nBefore evaluating any specific tool, you have to understand what LinkedIn is actively trying to stop. The platform\u2019s Terms of Service strictly prohibit unauthorized automation, but their enforcement mechanisms target distinct behaviors that degrade the user experience.\n\n### The Problem with Cloud-Based Automation Servers\nThe most common way professionals lose their LinkedIn accounts is by using cloud-based connection tools. When you sign up for a traditional lead generation bot, you hand over your LinkedIn session cookies or login credentials. The tool\u2019s servers\u2014often hosted on AWS, DigitalOcean, or Google Cloud\u2014then log into your account remotely.\n\nLinkedIn's security systems immediately notice that your account, which normally logs in from a residential IP address in Chicago on a Mac, is suddenly making hundreds of requests from a known commercial data center IP in Frankfurt on a headless Linux server. This mismatched IP and browser fingerprint is a massive red flag. The platform will often throttle your reach, force a password reset, or issue a permanent restriction based on this single data point.\n\n### The \"I Don't Know This Person\" Penalty\nBeyond technical detection, LinkedIn relies heavily on user feedback to identify spam. Historically, automation meant sending bulk cold direct messages (DMs) and connection requests. \n\nWhen you send a connection request, the recipient has the option to click \"Ignore.\" If they do, LinkedIn prompts them with an additional question: \"I don't know this person.\" If a small percentage of your outbound connection requests receive this specific feedback, your account is immediately flagged for aggressive outreach. LinkedIn responded to this spam epidemic by hard-capping connection requests to roughly 100 per week. Tools that try to bypass this limit by exploiting platform loopholes frequently get their users permanently banned.\n\n### Unnatural Interaction Pacing\nHumans do not act instantaneously. We scroll at variable speeds, pause to read, hover over buttons, and take seconds to type. Traditional bots operate in milliseconds. They load a page, scrape the data, click \"Connect,\" paste a message, and move to the next profile in under two seconds. LinkedIn\u2019s backend monitors these interaction rhythms. If your account processes fifty profiles in a perfectly uniform cadence of 1.5 seconds each, the algorithm categorizes the behavior as synthetic.\n\n## How Junior AI Re-Engineers Automation for Safety\n\nKnowing the triggers that cause account restrictions, we can evaluate how Junior AI specifically mitigates these risks. The platform was built specifically for professionals who cannot afford to lose their accounts, relying on an entirely different technical and strategic foundation.\n\n### Local Execution vs. Cloud Infrastructure\nThe single most critical safety feature of Junior AI is where the software actually runs. Unlike cloud-based connection tools, Junior runs entirely locally on your own machine. \n\nWhen Junior interacts with LinkedIn, it does so through your existing browser session, using your actual IP address, your normal geographic location, and your authentic device fingerprint. From LinkedIn\u2019s perspective, the traffic is indistinguishable from your normal daily usage because it is physically originating from the exact same hardware and network you always use. \n\nBy refusing to route your data through third-party servers, Junior entirely bypasses the \"suspicious login from another location\" trigger that catches 90% of automated tools. For an extensive breakdown of this localized security model, professionals often refer to the [How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account) which details the engineering choices behind local execution.\n\n![Architectural diagram comparing cloud-based bot risks versus Junior AI local browser execution on LinkedIn.](https://assets.bevisible.app/inline-images/j57fp0qf7em9vhfs3jzcywm0818f69ya/inline-1-1792858662917-wcnngn.png)\n### Shifting from Outbound DMs to Inbound Visibility\nSafety on LinkedIn isn't just about software architecture; it is also about strategy. Junior AI replaces cold DMs with strategic post commenting. \n\nRather than scraping profiles and spamming inboxes\u2014a high-friction activity that users actively report\u2014Junior focuses on finding relevant public discussions and drafting context-aware replies. \n\nThis strategy exploits a fundamental truth about LinkedIn: the platform actively encourages public engagement. While the algorithm restricts outbound connection requests to curb spam, it heavily promotes accounts that leave thoughtful comments on industry posts. Commenting builds public visibility without triggering the \"I don't know this person\" penalty. By pivoting the automation away from the inbox and toward the feed, Junior operates within the platform's desired use cases rather than fighting against them.\n\n### Mimicking Organic Human Rhythms\nTo avoid tripping behavioral flags, Junior incorporates randomized delays and human-like interaction patterns into its workflow. The tool does not instantly read a post and fire off a comment in two milliseconds. It simulates natural reading time, scrolling behavior, and typing patterns. By avoiding the synchronized, rapid-fire actions typical of poorly coded bots, Junior ensures that your account's activity logs look like those of an active, highly engaged human user.\n\n## Navigating AI Content Risks: The Human-in-the-Loop Imperative\n\nEven if the technical architecture is perfectly secure, the content generated by AI introduces its own set of risks. As AI models have become more accessible, LinkedIn feeds have been flooded with generic, tone-deaf, or obviously synthetic comments like \"Great post, I completely agree!\" or unhinged, hallucinated paragraphs that misinterpret the original author's intent.\n\n### The Danger of Fully Autonomous AI\nRelying on fully autonomous AI to post on your behalf is a massive reputational risk. If an AI misreads a post about a company layoff and leaves an enthusiastic, congratulatory comment, the damage to your professional brand is immediate and severe. Furthermore, generative AI can occasionally state plausible but inaccurate facts\u2014a phenomenon known as hallucination. If a tool posts unverified claims under your name, you bear the professional consequences.\n\n### Context-Aware Drafting\nJunior AI solves the relevancy problem by utilizing strict contextual guidelines. It does not just look at the post it is commenting on; it looks at your unique bio, your professional background, and your specific outreach goals. \n\nIf you are a B2B sales consultant targeting supply chain logistics, Junior understands that context. When it finds a relevant post about supply chain bottlenecks, it drafts a reply that incorporates your specific expertise rather than generating a generic platitude. This ensures the output sounds authentic and aligns with your actual voice.\n\n### The Mandatory Draft Mode\nTo entirely eliminate the risk of tone-deaf or hallucinated responses, Junior AI operates on a \"Human-in-the-Loop\" philosophy. The tool does not autonomously publish content while you sleep. \n\nInstead, Junior finds the relevant discussions, analyzes the context, and drafts a highly personalized, human-sounding reply. It then pauses and waits for your approval. You review the draft, make any necessary tweaks to fit your exact tone, and hit approve. This safety mechanism guarantees that nothing is ever published under your name without your explicit, final authorization. You retain total control over your intellectual property and your professional reputation. \n\nFor professionals comparing this approach to other software on the market, researching the [Best AI tools for LinkedIn commenting and authentic networking](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting) highlights why draft-and-approve workflows have become the gold standard for enterprise safety.\n\n![Step-by-step workflow of Junior AI human-in-the-loop draft review process.](https://assets.bevisible.app/inline-images/j57fp0qf7em9vhfs3jzcywm0818f69ya/inline-2-1792858665915-jby2bh.png)\n## Data Privacy and Compliance Considerations\n\nWhen evaluating whether Junior AI is safe, we also have to look beyond LinkedIn's internal algorithms and consider general data privacy and compliance standards. \n\n### Processing Public vs. Private Data\nTools that scrape hidden contact information, export private email addresses, or bypass privacy settings often find themselves in violation of international data protection laws like GDPR, as well as LinkedIn's Terms of Service. \n\nJunior AI operates strictly on publicly available data within the LinkedIn feed. It reads the public posts that users have intentionally broadcasted to their network or the broader platform. By restricting its activity to public visibility features, it avoids the compliance nightmare associated with aggressive data harvesting and enrichment tools.\n\n### Where Does Your Data Live?\nBecause traditional automation platforms operate in the cloud, they require you to upload your network data, your messaging history, and your prospect lists to their third-party servers. If that startup experiences a data breach, your proprietary network information is compromised.\n\nBecause Junior AI runs locally on your machine, your data stays on your machine. The AI uses the context to draft the response, but you are not storing your entire LinkedIn history on an external, vulnerable database. This localized approach is particularly crucial for founders, consultants, and enterprise sales teams dealing with sensitive client relationships.\n\n## Evaluating Junior AI Safety by Use Case\n\nThe risks associated with LinkedIn automation change depending on what you are trying to achieve. Let's examine how Junior AI's safety protocols protect specific types of users.\n\n### Job Seekers Building Professional Visibility\nFor job seekers, the primary risk of traditional automation is appearing desperate or spammy to hiring managers. Blasting 500 identical DMs asking for a job is a fast way to get blocked by the exact recruiters you need to impress.\n\nJunior allows job seekers to take a completely different approach. By finding posts authored by hiring managers, senior team members, or company pages in their target industry, job seekers can use Junior to draft insightful comments. This creates organic visibility. The hiring manager sees a thoughtful comment, clicks the job seeker's profile, and sees their \"Open to Work\" status naturally. The interaction is safe, compliant, and highly effective. Many of the insights found in the [Heyjunior Reviews From Job Seekers Source Guide](https://www.heyjunior.ai/blog/heyjunior-reviews-job-seekers-guide) emphasize that this transition from outbound begging to inbound authority is what actually secures interviews.\n\n### Sales Teams and Lead Generation Agencies\nSales teams face the highest risk of account bans because they typically require the highest volume of outreach. When a salesperson hits the 100-connection-request limit, their pipeline freezes.\n\nJunior AI allows sales teams to scale their outreach safely by completely sidestepping connection limits. There is no strict cap on the number of thoughtful comments you can leave on prospects' posts. Junior helps sales reps bypass the crowded, guarded inbox entirely. By consistently commenting on a prospect's public content, the sales rep builds familiarity. When the time comes to actually send a DM or an email, it is no longer a cold interaction; it is a warm conversation with a recognized name. \n\n### Founders and Consultants\nFor founders and consultants, the brand *is* the business. A single restricted account or a single tone-deaf automated comment can cost thousands of dollars in lost consulting contracts. \n\nThese users benefit heavily from Junior's context-aware drafting and mandatory human review. Founders can feed their specific contrarian opinions, frameworks, and methodologies into Junior's prompt settings. The AI then scales their ability to participate in dozens of industry conversations a week, without the founder having to spend hours manually typing out replies. Because the founder reviews every draft, the output remains sharply aligned with their thought leadership goals.\n\n![Infographic showing safe LinkedIn engagement strategies and account trust protection by user persona.](https://assets.bevisible.app/inline-images/j57fp0qf7em9vhfs3jzcywm0818f69ya/inline-3-1792858665037-9h1ib5.png)\n## Common Automation Mistakes to Avoid (Even with Safe Tools)\n\nWhile Junior AI\u2019s architecture prevents the technical triggers that cause account bans, user error can still create friction. To ensure maximum safety on LinkedIn, you must avoid these common behavioral pitfalls.\n\n### 1. The \"Set It and Forget It\" Trap\nThe most dangerous thing you can do with AI is abdicate responsibility. Even though Junior AI drafts highly contextual, human-sounding replies, you must actively review them. Skimming a comment and blindly approving it might lead to a response that, while technically accurate, misses a subtle layer of sarcasm in the original post. The tool is designed to assist your networking, not completely replace your brain. Always read the draft before hitting approve.\n\n### 2. Over-Aggressive Ramp-Up Periods\nIf your LinkedIn account currently averages one comment a month, and you suddenly begin posting 150 comments a day using Junior AI, that massive spike in activity will look suspicious, regardless of how organic the individual interactions are. \n\nSafe automation requires a ramp-up period. Start by using Junior to draft and post 5 to 10 comments a day. Maintain that for a week, and then slowly increase your volume. This mimics the behavior of a user who has recently decided to become more active on the platform, rather than a bot that was suddenly switched on.\n\n### 3. Targeting Irrelevant Audiences\nLinkedIn's algorithm rewards relevancy. If you are a cybersecurity expert, your engagement should largely be centered around technology, security, enterprise risk, and SaaS. If you suddenly start dropping long, AI-drafted comments on posts about marathon running, culinary arts, and real estate flipping, your network will be confused, and the algorithm will struggle to categorize your profile. Keep your goals and your targeting tight to maintain a high trust score with the platform.\n\n### 4. Ignoring Your Inbound Notifications\nThe goal of using Junior AI is to start authentic conversations. When you leave a highly contextual comment on a prospect's post, they will often reply to that comment or send you a direct message. \n\nIf you automate the initial comment but never bother to manually reply when they engage back, you have defeated the entire purpose of the tool. You look like someone who talks but never listens. Safe, effective use of AI means using the automation to open the door, and using your actual human effort to walk through it and build the relationship.\n\n## Analyzing the ROI of Safe Automation vs. Cheap Alternatives\n\nWhen professionals evaluate AI tools, they often compare prices without factoring in the hidden cost of risk. You can find dozens of Chrome extensions and cloud bots that promise to automate your LinkedIn for a fraction of the cost of premium tools. \n\nHowever, the cost of losing a ten-year-old LinkedIn profile is catastrophic. If your profile is permanently banned, you lose your entire network, your messaging history, your recommendations, and your primary channel for inbound leads. When evaluating tools, you are not just paying for the software; you are paying for the safety architecture that protects your digital asset.\n\nSafe AI tools require more sophisticated engineering\u2014such as localized execution environments and advanced context-parsing LLMs\u2014which fundamentally changes their pricing models compared to basic scrapers. Understanding these tiers is essential for serious professionals, which is why reviewing resources like the [Junior AI Pricing and Subscription Plans Source Guide](https://www.heyjunior.ai/blog/junior-ai-pricing-and-subscription-plans-3) helps contextualize the value of built-in account protection.\n\n| Feature Comparison | Traditional Cloud Automation | Junior AI (Local Execution) | Safety Impact |\n| :--- | :--- | :--- | :--- |\n| **Execution Environment** | Third-party cloud servers | Local machine / native browser | Prevents mismatched IP/Location flags |\n| **Primary Action** | Bulk Connection Requests / DMs | Strategic Post Commenting | Avoids the \"I don't know this person\" spam penalty |\n| **Interaction Speed** | Instantaneous / Milliseconds | Variable / Mimics human reading time | Avoids algorithmic bot-detection |\n| **Content Generation** | Canned templates / Spintax | Context-aware AI drafting | Prevents generic, easily identifiable bot language |\n| **Quality Control** | Fully autonomous | Human-in-the-loop review | Prevents hallucination and tone-deaf replies |\n\n## Advanced Best Practices for Junior AI\n\nTo maximize both safety and effectiveness, sophisticated users employ a few specific workflows when operating Junior AI.\n\n### Contextual Prompt Engineering\nJunior AI is only as good as the context you provide it. When setting up your bio and goals, avoid generic statements like \"I sell software.\" Instead, provide the AI with specific viewpoints, frameworks, and pain points you solve. For example: \"I help mid-market logistics companies reduce supply chain bottlenecks using predictive analytics. I believe that most legacy ERP systems are too slow for modern demands.\"\n\nBy giving Junior this highly specific, opinionated context, the drafts it generates will sound distinctly like you. This eliminates the \"bland AI voice\" that plagues so much of modern LinkedIn.\n\n### The \"Add Value First\" Rule\nWhen reviewing the drafts generated by Junior, always ask yourself: \"Does this comment add value to the original poster?\" \n\nIf the draft is just agreeing with the post (\"Great insights, totally agree!\"), it is safe, but it is not effective. Junior is designed to pull nuances from the post. Ensure the final approved comment either asks an intelligent follow-up question, shares a brief anecdote that supports the poster's point, or politely offers a different perspective. Value-additive comments are the ones that drive profile views and inbound connections.\n\n### Respecting the Weekend\nHumans take time off. If your account is firing off dozens of highly detailed comments at 3:00 AM on a Sunday, it looks unnatural. While Junior runs locally and requires your approval, it is still wise to pattern your engagement around standard professional hours. Engage heavily Tuesday through Thursday mornings when visibility is highest, and scale back on weekends. Aligning your activity with natural platform traffic patterns adds an invisible layer of safety to your account.\n\n## Frequently Asked Questions About Junior AI Safety\n\n**Can LinkedIn algorithms detect that Junior AI is drafting my comments?**\nLinkedIn cannot definitively detect the origin of text typed into a comment box if it is executed through your local browser at a natural speed. Because Junior AI uses advanced language models guided by your specific bio\u2014and because you review and edit the drafts\u2014the text lacks the predictable, repetitive syntax of early automation tools. \n\n**Do I need a premium LinkedIn account like Sales Navigator to use Junior AI safely?**\nNo. Traditional automation tools often require Sales Navigator because they rely on scraping deep search results and sending InMails. Junior AI relies on organic feed interaction and post commenting. Because it operates within the standard, visible public feed, it functions perfectly\u2014and safely\u2014on a free LinkedIn account.\n\n**What happens if LinkedIn updates its algorithm or Terms of Service?**\nLinkedIn frequently updates its backend to catch aggressive bots, usually by tightening connection limits or flagging new commercial IP ranges. Because Junior relies on inbound engagement (commenting) rather than outbound spam (connections/DMs), and because it runs locally, it is structurally insulated from the majority of these crackdowns. It operates in the exact manner LinkedIn wants its users to operate: engaging thoughtfully with content in the feed.\n\n**Is it safe to use Junior AI on a brand new LinkedIn account?**\nBrand new accounts are heavily monitored by LinkedIn. If you create an account on Monday and start dropping 50 AI-drafted comments on Tuesday, you risk triggering a manual review. If you have a new account, spend the first two weeks manually building a small network and engaging organically. Once the account is \"warmed up,\" you can introduce Junior AI, keeping the daily volume very low and gradually increasing it over several weeks.\n\n**Will Junior AI ever automatically post something embarrassing?**\nNot unless you explicitly approve it. The fundamental safety mechanism of Junior is its draft-only workflow. It cannot hit \"submit\" on a comment without your manual intervention. You are always the final gatekeeper of your professional reputation.\n\n## The Final Verdict on AI Automation Safety\n\nThe era of blasting thousands of automated direct messages from a fake IP address is over. Professionals who try to hold onto that outdated model will inevitably lose their LinkedIn accounts. The platform's security algorithms are simply too sophisticated to be fooled by cloud-based scrapers.\n\nHowever, the need to build a pipeline, establish authority, and find a job at scale has not disappeared. The safest way to leverage AI on LinkedIn today is to use it as an intelligent assistant rather than a replacement for yourself. \n\nBy running locally on your machine, pivoting the strategy to public commenting instead of private DMs, and strictly enforcing a human-in-the-loop review process, Junior AI strips away the risks associated with traditional bots. It allows you to bypass the crowded inbox, turn public visibility into direct conversations, and scale your networking efforts\u2014all while keeping your hard-earned profile completely secure. Proceed with intention, review your drafts, and let the AI do the heavy lifting of context gathering while you reap the rewards of authentic engagement.", "created_at": "2026-10-27T16:19:23.010670+00:00", "updated_at": "2026-10-27T16:19:23.010675+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);

                },
                {

                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
