    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 129, "slug": "best-linkedin-networking-tools-job-seekers", "title": "Best LinkedIn networking tools for job seekers to land interviews", "excerpt": "Discover the best LinkedIn networking tools for job seekers. Learn how engagement software, CRMs, and email finders turn connections into interviews safely.", "featured_image_url": "https://assets.bevisible.app/featured-images/j575x7cwx6s2t6y2pqqvcq98m18f7qag/best-linkedin-networking-tools-for-job-seekers-to-1791560917587-nia2x7.png", "published_at": "2026-10-12T15:19:00+00:00", "content": "# Best LinkedIn networking tools for job seekers to land interviews\n\nSend 100 connection requests, get 10 accepted, and receive maybe two polite but non-committal replies. That is the grim mathematics most job seekers face when they rely exclusively on native LinkedIn features and manual outreach. When hiring managers and internal recruiters open their LinkedIn inboxes, they are met with a wall of automated, identical messages. Breaking through that noise requires more than just a polished profile; it requires a systematic approach to visibility, tracking, and follow-up.\n\nWhen you ask what software helps job seekers network on LinkedIn, the answer rarely involves tools that blindly blast connection requests. In fact, heavy automation that bypasses LinkedIn\u2019s rate limits is the fastest way to get your account permanently restricted. Instead, modern networking software falls into four distinct categories: tools that build public visibility through safe engagement, personal CRMs that track your relationships, intelligence extensions that find warm referral paths, and contact finders that help you move the conversation to email when LinkedIn messages go ignored.\n\nThis guide breaks down the exact software stack you need to bypass crowded inboxes, stay organized, and turn your daily LinkedIn activity into direct interview opportunities.\n\n## The current state of LinkedIn networking\n\nBefore evaluating specific tools, you need to understand why the old playbook is failing. Five years ago, a job seeker could use cloud-based automation to send 50 connection requests a day with a templated note. Today, those notes land in a filtered inbox, and the platforms enforcing these rules are increasingly sophisticated. \n\nLinkedIn actively punishes accounts that exhibit non-human behavior, which includes sending requests too quickly, operating from remote cloud servers, or maintaining a low acceptance rate on connection requests. Networking on the platform has shifted from a private, volume-based game to a public, relevance-based game. \n\n![Excalidraw diagram comparing the cold mass connection request strategy against the public engagement networking strategy.](https://assets.bevisible.app/inline-images/j575x7cwx6s2t6y2pqqvcq98m18f7qag/inline-1-1791560859921-q6ayxg.png)\nIf you want a hiring manager to notice you, appearing in their notifications because you left a thoughtful, highly relevant comment on their recent post is significantly more effective than sending a cold direct message. The software you choose should facilitate this shift\u2014helping you find the right conversations, draft intelligent responses, track who you are talking to, and map the internal structure of your target companies.\n\n## Category 1: Public engagement and visibility tools\n\nThe most underutilized networking strategy on LinkedIn is public commenting. When you leave a substantive comment on a target company leader\u2019s post, you aren't just networking with them; you are networking with their entire audience. However, finding the right posts and knowing what to say takes hours of scrolling and drafting. \n\nThis is where AI-assisted engagement software changes the dynamic. Rather than automating cold outreach, these tools help you scale your public visibility safely.\n\n### Junior\n\nJunior represents a fundamental shift in how job seekers handle LinkedIn engagement. Designed specifically to start authentic conversations, it replaces the outdated cold DM strategy by focusing entirely on strategic post commenting. \n\nFor a job seeker, staring at a blank comment box on a hiring manager's post can be intimidating. You want to sound smart, relevant, and memorable without sounding desperate. Junior solves this by finding relevant discussions within your target industry and drafting context-aware, human-sounding replies based on your unique bio and career goals. \n\nWhat makes Junior uniquely suited for job seekers is its architecture. Unlike cloud-based connection tools that trigger LinkedIn's security alerts by logging into your account from random server locations, Junior runs locally on your machine. It uses natural interaction patterns, mirroring how a real human clicks, scrolls, and pauses. This protects your account safety while saving you hours of manual feed curation. \n\nBy consistently leaving high-quality comments on the posts of recruiters, department heads, and industry thought leaders, you flip the dynamic. Instead of chasing them in a crowded inbox, they see your insights publicly, click your profile, and initiate the conversation. \n\nIf you are evaluating how to build this kind of top-of-funnel visibility safely, reading up on [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) is a critical first step. You can also explore how this approach compares to older methods by reviewing [Phantombuster alternatives for automate Linkedin comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n**Failure modes to avoid with engagement tools:**\n*   **The \"Great Post\" trap:** Using AI to generate generic agreements like \"Thanks for sharing!\" or \"Great insight!\" This actually damages your brand. The tool should be configured to inject your actual expertise.\n*   **Targeting the wrong tier:** Commenting on a CEO's post with 50,000 likes will bury your comment. Engage with department heads and mid-level managers (the actual hiring managers) whose posts get 15-50 likes. Your comment will be highly visible to them.\n*   **Ignoring the evaluation criteria:** Not all commenting tools are built the same. If you are exploring the landscape, use an [AI tools for Linkedin commenting evaluation checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) to ensure the software respects local execution and personalization limits.\n\n## Category 2: Job search CRMs and pipeline trackers\n\nNetworking is useless if you forget who you talked to, what you promised, and when you are supposed to follow up. Relying on a spreadsheet or LinkedIn\u2019s native messaging interface to track your relationships is a recipe for dropped balls. \n\nA job search Customer Relationship Management (CRM) tool acts as a layer over LinkedIn, allowing you to clip profiles, log interactions, and build a visual pipeline of your networking efforts.\n\n### Teal\n\nTeal is arguably the most popular dedicated job-tracker tool currently available, and for good reason. It centers around a Chrome extension that integrates seamlessly with LinkedIn. \n\nWhen you view a job description or an individual's LinkedIn profile, the Teal extension allows you to clip that data instantly to your dashboard. If you identify a Senior Product Manager at a target company, you can save their profile, log them as a \"Networking Contact,\" tag them to a specific company or role, and immediately set a reminder to follow up in a specific number of days. \n\nTeal replaces the chaotic experience of having 40 open browser tabs. It visualizes your networking funnel\u2014showing you how many cold contacts you have identified, how many you have engaged with publicly, how many you have messaged, and how many have translated into informal chats or interviews.\n\n![Minimal Kanban board diagram illustrating a job seeker networking pipeline with stages from discovery to interview.](https://assets.bevisible.app/inline-images/j575x7cwx6s2t6y2pqqvcq98m18f7qag/inline-2-1791560867386-85n852.png)\n### Huntr\n\nHuntr operates on a similar premise to Teal but appeals strongly to users who prefer a highly visual Kanban board interface for their job search pipeline. Its web clipper extracts company details, contact information, and job descriptions directly from LinkedIn pages.\n\nWhere Huntr excels is in its flexibility. You can create custom stages for your networking pipeline. For example, your board might have columns for \"Identified Insiders,\" \"Engaged on Posts,\" \"Sent Email,\" \"Informational Interview Completed,\" and \"Referred.\" As you move a contact's card across the board, you maintain a clear view of where your networking bottlenecks are. If you have 50 people in \"Identified\" but zero in \"Informational Interview,\" you know your outreach messaging or engagement strategy needs adjustment.\n\n**Implementation details for job search CRMs:**\n*   **Log everything immediately:** The moment you interact with someone on LinkedIn, log it. Human memory degrades rapidly when you are conducting a high-volume job search.\n*   **Set strict follow-up rules:** A CRM is only as good as its reminders. If someone agrees to chat \"next month,\" set a task for exactly 25 days out. \n*   **Track the \"No's\":** Logging rejections or non-responses prevents you from accidentally messaging the same annoyed hiring manager three times in six months.\n\n## Category 3: Referral and insider identification tools\n\nCold outreach is difficult. Warm outreach\u2014leveraging mutual connections, alumni networks, or shared interests\u2014has a significantly higher conversion rate. Instead of blindly scrolling through a company's \"People\" tab on LinkedIn trying to find a friendly face, specific software tools can automate the intelligence-gathering phase of networking.\n\n### JobWizard\n\nJobWizard is an extension that fundamentally changes how you view a company. It features a built-in LinkedIn Referral Finder. When you are looking at a job posting\u2014whether on LinkedIn or on a company's direct career page\u2014JobWizard automatically scans the company's employee base and surfaces your warmest entry points.\n\nIt highlights mutual connections, second-degree connections, and alumni from your university who currently work there. Instead of spending twenty minutes doing advanced boolean searches to figure out if you know anyone at a 5,000-person company, the software tells you exactly who to message for a warm introduction. \n\nThis intelligence is vital. An internal referral often bypasses the Applicant Tracking System (ATS) entirely, putting your resume directly on the recruiter's desk. Knowing who can provide that referral is half the battle.\n\n## Category 4: Contact information finders\n\nLinkedIn is a fantastic platform for discovery and initial engagement, but it is a terrible place to manage an ongoing professional relationship. Inboxes are cluttered, notifications get missed, and some professionals simply don't log in for weeks at a time. \n\nIf you have built initial visibility using tools like Junior, or if you need to bypass a stagnant LinkedIn inbox, you need software that bridges the gap between a LinkedIn profile and a professional email address.\n\n### Apollo.io\n\nWhile Apollo is traditionally a B2B sales tool, its free tier is a goldmine for job seekers. Apollo maintains a massive database of verified professional email addresses. When you find a hiring manager on LinkedIn, you can use the Apollo Chrome extension to reveal their corporate email address instantly.\n\nFor job seekers, this allows for an omnichannel networking approach. You might leave a thoughtful comment on a manager's post on Tuesday, send a connection request on Wednesday, and follow up with a highly targeted, brief email on Thursday referencing the public interaction. This multi-touch approach drastically increases your reply rate.\n\n### Hunter.io\n\nIf you don't want a full sales platform like Apollo, Hunter.io provides a simpler solution. You plug in a company's domain name (e.g., stripe.com), and Hunter reveals the common email format for the company (e.g., first.last@stripe.com). \n\nEven if you don't have a specific contact's direct email, knowing the domain pattern allows you to accurately guess the email of the hiring manager you found on LinkedIn. Hunter also includes a verifier tool to ensure the email won't bounce, protecting your personal email sender reputation.\n\n**Edge cases when moving off LinkedIn:**\n*   **Never use personal emails:** Only reach out to corporate email addresses. Finding and emailing someone's personal Gmail address that they haven't publicly listed crosses the line from networking into privacy invasion.\n*   **Keep it brief:** A cold email should not be a cover letter. It should be three sentences: who you are, why you are reaching out (referencing a LinkedIn post or shared connection), and a low-friction ask (like a 10-minute chat, not a job).\n\n## Balancing safety, automation, and authentic connection\n\nThe biggest mistake job seekers make when building a software stack is treating networking like a mass-mailing campaign. If you treat people like data points, they will treat your messages like spam.\n\nThere is a distinct line between software that *assists* your workflow and software that *outsources* your personality. \n\nCloud-based LinkedIn automation tools that send 100 connection requests a day fall into the latter category. Not only are they highly impersonal, but they run afoul of LinkedIn's User Agreement. Because these tools operate on remote servers, LinkedIn easily detects the IP mismatch (e.g., your phone app is in New York, but your automation tool is firing from a server in Germany). This results in shadowbans, restricted messaging capabilities, or permanent account deletion. If you want to understand the modern landscape of safe tools, checking out the [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) offers a good baseline.\n\nSoftware should be used to eliminate the administrative burden of networking, not the human element. You use Teal to remember who to talk to. You use Apollo to find out how to reach them. You use Junior to bridge the gap between wanting to engage and knowing what to say, ensuring the actual interaction feels organic and contextual. \n\nFor a deeper dive into evaluating tools that won't jeopardize your account, look at the [automate Linkedin comments safely evaluation checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) and compare the [best automate Linkedin comments safely tools beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n![Diagram comparing risky cloud-based LinkedIn automation against safe, local browser-assisted networking tools.](https://assets.bevisible.app/inline-images/j575x7cwx6s2t6y2pqqvcq98m18f7qag/inline-3-1791560866880-20il6y.png)\n## Designing a daily networking workflow\n\nHaving the right software is useless without an operating system to run it. If you are unemployed and treating the job search as a full-time job, or if you are quietly looking while employed, you need a repeatable daily workflow that leverages these tools efficiently.\n\nHere is what a highly effective, 45-minute daily networking loop looks like using this software stack:\n\n### Phase 1: Pipeline Review (5 minutes)\nOpen your CRM (Teal or Huntr). Look at your follow-up tasks for the day. Who did you reach out to four days ago that hasn't replied? Move their cards to the \"Follow-up\" stage and send a brief, polite check-in message. Review who you are meeting with today and pull up their LinkedIn profiles to refresh your memory on their background.\n\n### Phase 2: Public Engagement (15 minutes)\nInstead of scrolling aimlessly, open Junior. Let the tool surface relevant posts from target companies, industry leaders, and hiring managers you have identified. Review the AI-drafted comments based on your bio. Edit them to add a specific nuance, anecdote, or statistic only you would know. Approve and post 5 to 10 high-quality comments. This seeds your top-of-funnel visibility for the day. \n\nIf you are curious how this targeted approach compares to broad scheduling tools, reading up on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) or exploring the [best tools to find relevant Linkedin posts to comment on tools beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) will clarify why context matters more than scheduling volume. Furthermore, if your networking aims at freelance or consulting gigs rather than a W2 role, the approach detailed in [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) is highly relevant.\n\n### Phase 3: Targeted Discovery (15 minutes)\nIdentify two new target companies you want to work for. Go to their LinkedIn pages. Use JobWizard to immediately map out your alumni and mutual connections. Identify 3-5 \"insiders\" who could act as potential referrers or informational interview subjects. Clip these profiles directly into Teal or Huntr.\n\n### Phase 4: Omnichannel Outreach (10 minutes)\nFor the 3-5 insiders you just identified, do not send a cold connection request yet. Go to their recent activity; if they posted, engage with it. If they aren't active on LinkedIn, use Apollo or Hunter.io to find their corporate email. Draft a highly personalized three-sentence email referencing a shared background (e.g., \"Saw we both went to Michigan and you're now leading Product at Stripe...\"). Log this outreach in your CRM.\n\nThis loop takes less than an hour, feels entirely organic to the recipient, and systematically builds a network that generates inbound interest and warm referrals.\n\n## The technical budget for an unemployed job seeker\n\nA common pushback regarding networking software is the cost. When you are between jobs, managing runway is critical. Fortunately, you can build a highly effective tech stack with minimal financial outlay.\n\n*   **Job Search CRMs:** Teal offers a robust free tier that covers the needs of 90% of job seekers. You only need to pay if you want advanced resume formatting and unlimited contact tracking features. Huntr also operates on a freemium model.\n*   **Intelligence Tools:** JobWizard and similar referral-finding extensions often have free versions or are entirely free as they serve as lead-generation for broader platforms.\n*   **Email Finders:** Apollo.io offers generous free credits every month, more than enough for a targeted job search where you are reaching out to maybe 10-20 highly qualified people a week. Hunter.io gives 25 free searches per month.\n*   **Engagement Tools:** While premium tools require investment, they replace the need for LinkedIn Premium for many users. By generating inbound profile views through public commenting, you bypass the need for expensive InMail credits entirely. If you are exploring the landscape of these tools, reviewing the [best AI tools for Linkedin commenting tools beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) can help you evaluate where to spend your budget.\n\nWhen budgeting, prioritize tools that save you time and protect your account safety. A $30/month tool that lands you one warm introduction to a hiring manager pays for itself instantly, but a $15/month automation tool that gets your LinkedIn account suspended is a career disaster.\n\n## FAQ: LinkedIn networking software for job seekers\n\n### What is the safest way to use automation on LinkedIn?\nThe safest way is to avoid cloud-based mass-messaging tools entirely. LinkedIn tracks IP addresses, behavioral patterns, and click speeds. Safe automation assists the user locally rather than running autonomously on a server. Tools that draft content, surface relevant posts, or track data locally (like Junior or browser-based CRMs) are vastly safer than tools that run connection sequences while you sleep.\n\n### Does a job seeker need LinkedIn Premium to network effectively?\nNo. While LinkedIn Premium provides InMail credits and the ability to see everyone who viewed your profile, an effective public engagement strategy renders InMails largely unnecessary. If you are consistently leaving insightful comments on a hiring manager's posts, they will view your profile and often send a connection request themselves, allowing you to message them for free.\n\n### How do I know if my networking messages are sounding like spam?\nIf your message can be sent to ten different people without changing a single word, it is spam. Effective networking software should help you contextualize your outreach. Whether you use a CRM to remember a personal detail or an AI assistant to draft a comment based on a specific post, the output must reflect the unique intersection between your background and their current situation.\n\n### Can hiring managers tell if I use AI to write my comments?\nYes, if you use raw, unprompted AI models that output words like \"delve,\" \"crucial,\" or \"in today's rapidly evolving landscape.\" However, purpose-built tools that use your actual career bio to formulate a specific, grounded response are nearly indistinguishable from manual writing, because they are simply structuring your actual expertise into a readable format.\n\n## Shifting from chasing to attracting\n\nThe ultimate goal of using software in your job search isn't to send more messages faster; it is to fundamentally change your posture in the market. \n\nWhen you rely on native tools alone, you are perpetually chasing. You are throwing applications into portals and sending requests into a void, hoping someone deigns to respond. It is an exhausting, demoralizing process.\n\nBy implementing a structured software stack\u2014using CRMs to stay disciplined, intelligence tools to map the terrain, and engagement software to scale your voice\u2014you transition from chasing opportunities to attracting them. You become a visible, organized participant in your industry's daily conversations. When the time comes to make a direct ask for an interview, you aren't a stranger in an inbox; you are a familiar face they already respect.", "created_at": "2026-10-12T15:19:26.991461+00:00", "updated_at": "2026-10-12T15:19:26.991468+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
