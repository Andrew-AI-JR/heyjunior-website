    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 106, "slug": "phantombuster-alternatives-manage-linkedin-commenting-multiple-clients", "title": "Phantombuster Alternatives for Tools to Manage Linkedin Commenting for Multiple Clien", "excerpt": "Discover the best Phantombuster alternatives to manage LinkedIn commenting for multiple clients safely. Scale authentic engagement without getting banned.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5711cbmktaaxggb12xxfxn4k98d7cm4/phantombuster-alternatives-for-tools-to-manage-lin-1789663719681-olt30d.png", "published_at": "2026-09-17T16:33:00+00:00", "content": "# Phantombuster Alternatives for Tools to Manage Linkedin Commenting for Multiple Clien\n\nManaging a single LinkedIn account requires consistency. Managing ten, twenty, or fifty client LinkedIn accounts requires an airtight system. If you run a lead generation agency, a personal branding firm, or a B2B sales team, you already know the nightmare of juggling multiple client logins. You are likely familiar with the daily dance of switching browser profiles, managing VPNs to avoid IP flags, and trying to sound like a cybersecurity CEO at 9:00 AM and a SaaS founder at 9:15 AM.\n\nHistorically, agencies turned to bulk automation tools to handle this scale. Phantombuster became a household name for growth hackers because of its powerful data extraction and script-based actions. But as LinkedIn's algorithm has evolved to prioritize deep, conversational engagement over superficial metrics, relying on static scripts to manage multi-client commenting has become a liability. \n\nWhen you need to turn public visibility into direct interviews, pipeline, and client conversations, automated \"Great post!\" comments do more harm than good. You need tools that balance scalability, human oversight, and strict account security.\n\nThis guide breaks down the landscape of LinkedIn commenting management for multiple clients, exploring unified social inboxes, dedicated LinkedIn automation platforms, and the shift toward local, context-aware AI tools. \n\n## The Problem with Legacy Automation for Agency Commenting\n\nTo understand why agencies are migrating away from legacy scrapers for comment management, you have to look at the mechanics of how these tools operate. \n\nPlatform-agnostic automation tools generally rely on cloud servers. When you connect a client's LinkedIn account to a cloud-based tool, that tool logs in from a datacenter IP address\u2014often located in a different state or country than your client. LinkedIn's security algorithms immediately flag this geographic anomaly. To bypass this, agencies are forced to buy dedicated proxy servers for every single client, adding significant overhead and complexity to client onboarding.\n\nBeyond security, legacy automation falls flat on execution. Phantombuster and similar sequence tools operate on static logic: *If X happens, do Y.* This is brilliant for building prospect lists or scraping event attendees. It is disastrous for commenting. \n\nImagine one of your clients is a leadership consultant. A prominent industry voice posts a highly vulnerable story about a business failure. A static automation script running on your client's account detects the post based on a keyword and automatically comments, \"Thanks for sharing this valuable insight! Would love to connect.\" The tone is completely tone-deaf, instantly damaging your client's reputation. \n\nFor agencies, the risk of a rogue, context-blind comment is too high. This is why the search for [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) has shifted from finding a \"better scraper\" to finding platforms designed specifically for inbox management and contextual engagement.\n\n![Diagram comparing cloud scraper security risks against safe local LinkedIn comment execution.](https://assets.bevisible.app/inline-images/j5711cbmktaaxggb12xxfxn4k98d7cm4/inline-1-1789663665937-41pf9w.png)\n## Category 1: Unified Social Inboxes (Best for Human Moderation)\n\nIf your agency's primary goal is managing the comments *received* on your clients' posts and ads, you need a unified social inbox. These tools act as a central hub where your team can view, respond to, assign, and approve incoming comments across dozens of LinkedIn pages without ever needing the client's direct login credentials.\n\nAccording to agency discussions evaluating the [trusted tools for LinkedIn content management](https://www.linkedin.com/top-content/marketing/linkedin-marketing-guide/trusted-tools-for-linkedin-content-management/), unified inboxes are the gold standard for human moderation. They separate the noise of the platform from the actionable conversations.\n\n### Sprout Social\nFor mid-market and enterprise agencies, Sprout Social is frequently cited in SMM communities as the premier choice. It features a Smart Inbox that aggregates comments, mentions, and direct messages from multiple clients into a single stream. \n\nWhat makes Sprout valuable for multi-client management is its collision detection\u2014if one account manager is typing a reply to a client's comment, another team member sees a notification, preventing duplicate responses. It also surfaces previous interactions with the commenter, giving your team immediate context on the relationship history. The primary drawback, often discussed when agencies look for the [best SMM tool to manage multiple clients socials](https://www.reddit.com/r/SocialMediaMarketing/comments/1hnxvdo/best_smm_tool_to_manage_multiple_clients_socials/), is the enterprise-level pricing, which can erode margins for smaller agencies.\n\n### Agorapulse\nAgorapulse hits the sweet spot for many growing agencies. It offers a centralized inbox with highly robust permission settings. You can grant a junior copywriter access to draft replies for Client A, but require senior approval before the comment goes live. \n\nCrucially for performance marketing agencies, Agorapulse is particularly adept at detecting comments on LinkedIn Ads. Tracking ad comments natively in LinkedIn Campaign Manager is notoriously clunky; pulling them into a unified inbox ensures you don't miss high-intent prospects asking questions on sponsored content.\n\n### NapoleonCat\nWhen dealing with high-volume accounts\u2014such as a client whose posts routinely go viral\u2014manual moderation becomes impossible. NapoleonCat excels in auto-moderation. Agencies use it to automatically filter out spam (like the endless \"DM me for crypto\" comments) and set up automated replies to highly repetitive inquiries, such as links to a webinar registration page. This keeps the comment section clean and protects the client's brand image.\n\n### SocialPilot\nFor agencies managing dozens of lower-tier retainers, cost efficiency is paramount. SocialPilot provides the core functionality of a unified inbox\u2014allowing you to respond to client comments without switching tabs\u2014while keeping per-profile costs low. It also includes white-labeling options, allowing you to present the dashboard to clients with your agency's branding during monthly reviews.\n\n## Category 2: Specialized LinkedIn Automation for Agencies\n\nUnified inboxes are reactive; they help you manage the engagement coming *to* your clients. But what if your mandate is proactive? What if your agency is hired to drive outbound engagement, leave comments on target accounts, and generate pipeline?\n\nThis requires specialized LinkedIn infrastructure designed for multi-account management. \n\n### HeyReach and the \"Unibox\" Model\nWhen reviewing the [40 Best LinkedIn Automation Tools](https://www.heyreach.io/blog/best-linkedin-automation-tools), platforms like HeyReach stand out for their agency-first architecture. Instead of treating each LinkedIn account as an isolated silo, HeyReach provides a \"Unibox\" (Unified Inbox) specifically for LinkedIn direct messages and outbound engagement. \n\nIf you are running outreach campaigns for a sales team of ten SDRs, the Unibox allows the agency to monitor all ten inboxes simultaneously. Furthermore, tools in this category often feature multi-sender account rotation. If a campaign requires sending 500 connection requests, the platform distributes that volume across multiple client accounts, keeping each individual profile well below LinkedIn's commercial use limits.\n\nHowever, while platforms like this solve the \"stop doing it manually\" problem for direct messaging and connection requests, they still face challenges with authentic, public-facing commenting. As noted in industry reviews of [12 LinkedIn Messaging Automation Tools](https://www.heyreach.io/blog/linkedin-messaging-automation-tools), scaling messages is a solved problem, but scaling contextual, public comments requires a different approach entirely.\n\n![Multi-account agency LinkedIn management architecture showing centralized control across distinct client profiles.](https://assets.bevisible.app/inline-images/j5711cbmktaaxggb12xxfxn4k98d7cm4/inline-2-1789663669377-pybj0z.png)\n## Category 3: AI-Powered Local Engagement (The Junior Approach)\n\nThe fundamental flaw in managing multiple clients via cloud-based commenting tools is the loss of personal voice. A unified inbox lets you type out responses, which is safe but incredibly time-consuming. Cloud automation is fast, but risky and generic.\n\nThis gap has driven the rise of local, AI-powered engagement tools like Junior. For agencies and founders who want to know the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), understanding the shift from cloud-scraping to local AI is critical.\n\n### Why Local Execution Beats Cloud Execution\nTo protect client accounts, agencies must mimic human behavior. Junior runs locally on the user's machine rather than on a remote cloud server. When Junior engages with a post, it does so from the same IP address and browser environment that the client normally uses. \n\nThis architecture bypasses the strict security flags that trip up legacy automation tools. You don't need to manage complex proxy setups or worry about your client waking up to a restricted account. For a deeper dive into why this matters, evaluating [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) reveals that mimicking human interaction patterns\u2014like reading time, scrolling, and local IP matching\u2014is the only sustainable way to scale outbound commenting.\n\n### Contextual AI Over Generic Scripts\nInstead of relying on rigid \"If/Then\" triggers, Junior utilizes context-aware AI. When you manage a client, you input their specific bio, their unique value proposition, and their business goals. \n\nWhen the tool finds a relevant discussion in the feed, it doesn't just drop a template. It reads the original post, processes the client's specific background, and drafts a nuanced, human-sounding reply that actually adds value to the conversation. \n\nFor example, if you manage a supply chain consultant and a target prospect posts about logistics delays, Junior drafts a comment referencing the consultant's specific expertise in mitigating those delays. The agency manager simply reviews the drafted comment, makes any necessary tweaks, and approves it. This turns a 20-minute manual research task into a 30-second approval workflow.\n\nThis targeted approach to finding the right conversations is why agencies frequently compare [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) and ultimately favor tools that prioritize context over sheer volume.\n\n## Crucial Evaluation Criteria for Multi-Client Commenting Tools\n\nIf you are migrating your agency away from Phantombuster or manual spreadsheets, you need a strict evaluation framework. Not all tools that claim to handle \"multiple accounts\" actually make the agency workflow easier. When working through your [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist), weigh the following four criteria heavily.\n\n### 1. Account Security and IP Management\nDoes the tool require you to purchase separate proxy servers for each client? Does it log in via a cloud datacenter, or does it utilize local execution? Cloud-based tools are inherently riskier for multi-client management because LinkedIn actively hunts for datacenter IPs. If one of your clients is flagged, the entire proxy subnet could be scrutinized. Local execution tools eliminate this risk entirely.\n\n### 2. Approval Workflows vs. Full Autonomy\nNever give an AI full, unmonitored autonomy over a client's public reputation. The tool you choose must have a staging area. You need the ability to see the post, see the proposed comment, edit it, and then execute it. \n\nTools designed for agencies understand that the account manager must be the final editor. If a tool only offers \"auto-comment on every post from X user,\" run the other way.\n\n### 3. Voice and Tone Mapping\nCan the tool sound like your client? If you manage a Gen-Z marketing freelancer and a 55-year-old traditional finance executive, the tool cannot use the same vocabulary for both. \n\nEvaluate the AI's ability to ingest custom instructions. The best platforms allow you to upload the client's past content, specific phrases they use, and phrases they strictly avoid. If the tool outputs corporate jargon for every client, it will destroy their authenticity.\n\n### 4. Lead Routing and Intent Detection\nCommenting is not an end goal; it is a top-of-funnel strategy to generate pipeline. When your client's comment generates a reply from an ideal prospect, what happens next? \n\nThe platform should make it easy to identify when a public comment has transitioned into a high-intent conversation, signaling the agency that it is time to move the interaction to a direct message. This strategy of initiating contact publicly before moving privately is exactly why many lean toward [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). \n\n## How to Build a Safe, Scalable Commenting Workflow for 10+ Clients\n\nHaving the right tool is only half the battle. The other half is the standard operating procedure (SOP) your agency uses to execute. Managing multiple clients requires a rigid, repeatable workflow that prevents mistakes and ensures consistent daily activity.\n\n### Step 1: Voice Architecture Onboarding\nDo not skip the onboarding interview. Before connecting any tool, spend 30 minutes with the client documenting their specific viewpoints. \n*   What are their contrarian industry opinions? \n*   What buzzwords do they hate? \n*   What specific metrics or case studies do they like to reference?\n\nFeed this documentation into your AI tool's profile settings. This is the difference between a comment that says \"Agreed, great point about leadership\" and \"Agreed. When we implemented this exact feedback loop at [Client's Company], we saw employee retention jump 14% in a single quarter.\"\n\n### Step 2: Curation Over Scattergun Outreach\nA common mistake agencies make is trying to comment on everything. Instead, use your tools to curate highly specific lists of target accounts. \n\nCreate a \"Sales Navigator Lead List\" of 100 high-priority prospects for Client A. Feed that list into your engagement tool. Your mandate is not to comment on 50 random posts a day; it is to ensure Client A shows up consistently in the notifications of those 100 specific prospects. This targeted approach aligns with the methodologies used by the [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n### Step 3: The 15-Minute Daily Review\nInstead of logging into 10 different accounts throughout the day, batch the workflow. \nAssign an account manager 15 minutes per client. During this window, the manager opens the engagement tool, reviews the curated feed of target prospect posts, and generates contextual AI drafts. \n\nThe manager reads the post, reads the draft, tweaks one or two words to ensure perfect alignment with the client's voice, and hits approve. In 15 minutes, the manager has left 10 highly strategic, customized comments. Multiply this across 10 clients, and the agency is generating massive inbound visibility in just a couple of hours a day.\n\n### Step 4: The Handoff Protocol\nWhen a prospect replies to your client's comment with interest (e.g., \"That's an interesting approach, how exactly does your software handle X?\"), the agency must step back. \n\nYour SOP should dictate that high-intent replies are immediately flagged and sent to the client via Slack or email. The client then steps in to take the conversation to the DMs. The agency generates the spark; the client closes the deal.\n\n![Four-step agency standard operating procedure diagram for managing LinkedIn commenting across multiple clients.](https://assets.bevisible.app/inline-images/j5711cbmktaaxggb12xxfxn4k98d7cm4/inline-3-1789663659360-4qh9e3.png)\n## Myth-Busting: \"More Comments = More Reach\"\n\nOne of the most pervasive myths in LinkedIn agency circles\u2014often perpetuated by lists detailing the [62 Best LinkedIn Automation Tools for Agencies](https://www.swydo.com/blog/best-linkedin-automation-tools/)\u2014is that volume dictates success. \n\nThere is a lingering belief that if an agency can automate 200 comments a day per client, the client's reach will skyrocket. This was somewhat true in 2020. Today, it is a fast track to being shadowbanned. \n\nLinkedIn's algorithm has become highly sophisticated at detecting algorithmic manipulation. If a client is leaving hundreds of generic, single-sentence comments rapidly, LinkedIn categorizes that account as a spammer. Their organic reach will be artificially suppressed, and their own posts will stop appearing in the feed.\n\nQuality now mathematically outranks quantity. A single, well-thought-out, three-paragraph comment that sparks a debate and earns 15 likes from other users will generate exponentially more profile views than 50 automated \"Thanks for sharing!\" replies. \n\nWhen you compare [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), this philosophy becomes clear. Your multi-client management tool shouldn't be measured by how many comments it can blast out per hour, but by how easily it allows your team to leave high-leverage, thoughtful replies that actually command attention.\n\n## Edge Cases and Failure Modes in Multi-Client Management\n\nEven with the best tools and SOPs, edge cases will arise. An experienced agency anticipates these failure modes and builds contingencies.\n\n**The \"Viral Backlash\" Scenario**\nYour client's target prospect posts a highly controversial opinion that starts receiving intense backlash in the comments. If your team is moving too fast through their daily review queue, they might approve an AI-drafted comment that agrees with the original poster, inadvertently dragging your client into a public relations crisis. \n*Solution:* Train your account managers to look at the *existing comments* before approving a draft. If the sentiment is highly negative, skip the post entirely. \n\n**The Jargon Disconnect**\nYou manage a client in a highly technical niche, like Kubernetes deployment. The AI tool drafts a comment that sounds grammatically correct but uses a term in a way no actual engineer would ever use it. \n*Solution:* This goes back to the onboarding phase. If your agency does not deeply understand the technical nuances of a client's industry, you must rely on tools that allow you to dictate strict structural parameters, or you must have the client review drafts asynchronously before they go live. \n\n**The Overlapping Target Audience**\nYou sign two clients who sell different services (e.g., fractional CFO services and fractional CMO services) to the exact same target audience (e.g., Series A SaaS founders). If both clients are using the same engagement tool and targeting the same prospect list, you risk having both clients comment on the exact same post within minutes of each other, using similar AI-generated structures. \n*Solution:* Segment your agency's target lists rigorously. Ensure that account managers handle competing accounts on different daily schedules, and intentionally vary the underlying AI prompts used for each client.\n\n## Frequently Asked Questions\n\n### Is automating LinkedIn comments safe for my clients?\nIt depends entirely on the architecture of the tool. Fully autonomous, cloud-based tools that scrape and auto-post without human review are incredibly dangerous and routinely lead to account restrictions. Tools that utilize local execution, require manual approval workflows, and generate context-aware drafts (like Junior) are safe because they operate within normal human behavioral parameters. For a complete breakdown of safety protocols, review the [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n### Can multiple team members manage the same client account?\nYes, provided you are using the right platform. Unified inboxes (like Agorapulse or Sprout Social) are built specifically for multi-seat collaboration, allowing teams to assign conversations and request approvals. If you are using local execution tools, ensure your agency's internal communication (like a dedicated Slack channel per client) is tightly managed so two account managers don't duplicate daily engagement tasks.\n\n### How do you prove ROI from commenting to clients?\nVisibility metrics (impressions, likes) are vanity metrics. To prove ROI, agencies must track profile views and inbound direct messages. A successful multi-client commenting strategy results in a measurable increase in target prospects viewing the client's profile and initiating inbound DMs. You track the exact moment a strategic comment on a prospect's post turns into a booked discovery call.\n\n### Will AI comments make my clients sound like robots?\nThey will if you use generic prompts. The output is entirely dependent on the input. If you provide a generic bio, the AI will sound generic. If you invest the time during onboarding to feed the tool your client's specific tone, past content, and unique industry viewpoints, the resulting drafts will sound indistinguishable from the client's own voice. \n\n## The Shift From Visibility to Pipeline\n\nManaging LinkedIn for multiple clients is no longer about maximizing the number of outgoing actions per day. The era of brute-force scraping and thoughtless automation has ended. \n\nAgencies that will thrive in the next iteration of B2B social selling are those that adopt the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026)\u2014tools designed to scale *context*, not just volume. Whether you rely on enterprise unified inboxes to manage massive inbound volume or transition to AI-powered local tools like Junior to drive surgical, high-intent outbound conversations, the goal remains the same. \n\nYou are not managing accounts to inflate vanity metrics. You are managing accounts to position your clients as authorities, bypass crowded inboxes, and start the genuine conversations that lead directly to closed revenue.", "created_at": "2026-09-17T16:49:26.274329+00:00", "updated_at": "2026-09-17T16:49:26.274336+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
