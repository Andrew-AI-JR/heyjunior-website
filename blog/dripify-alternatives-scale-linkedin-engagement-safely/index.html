    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 95, "slug": "dripify-alternatives-scale-linkedin-engagement-safely", "title": "Dripify Alternatives for How Agencies Can Safely Scale Linkedin Engagement", "excerpt": "Discover how agencies can safely scale LinkedIn engagement using local-first commenting tools instead of high-risk cloud DM sequencers like Dripify.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5785c96j7yhtjha2r28aqyej98d7p7f/dripify-alternatives-for-how-agencies-can-safely-s-1788709727819-31qate.png", "published_at": "2026-09-06T15:40:00+00:00", "content": "# Dripify Alternatives for How Agencies Can Safely Scale Linkedin Engagement\n\nScaling LinkedIn engagement for an agency is a tightrope walk. On one side is the relentless pressure to grow reach, manage multiple client profiles simultaneously, and generate a predictable pipeline. On the other side is LinkedIn\u2019s strict, AI-driven anti-automation algorithm, which constantly monitors user behavior on a point-based risk system. \n\nIf you try to scale using old-school mass-messaging methods or reckless software, you risk getting your clients\u2019 accounts permanently restricted. Losing a client's hard-earned LinkedIn presence because of an automation misstep is a failure mode no agency can afford. To scale safely, agencies must transition away from high-volume cold outreach and adopt a model based on high-intent engagement and secure infrastructure. \n\nFor years, tools like Dripify have been the default for agencies looking to automate connection requests and direct messages. But as LinkedIn tightens its restrictions on inbox spam and data center IP addresses, the effectiveness of cloud-based DM automation has plummeted. The modern alternative isn't just another direct messaging sequence tool. The alternative is shifting the engagement vector entirely: moving from private, automated DMs to public, strategic commenting running on secure, local infrastructure.\n\n## The Problem with Traditional Agency Automation\n\nLinkedIn does not just monitor the volume of actions an account takes. The platform monitors behavioral signals, velocity, and infrastructure to determine if a human or a machine is operating the profile. \n\nWhen an agency takes over a client\u2019s account, they typically run into a combination of three algorithmic tripwires:\n\n1.  **Infrastructure Mismatch:** When a client logs in from their home in Chicago on a MacBook, and three minutes later a cloud automation tool fires off a message from an AWS data center IP in Virginia, the system flags the geographic and hardware anomaly.\n2.  **Velocity and Pacing:** Human beings read posts, scroll, pause, and type at variable speeds. Legacy automation executes tasks at machine speed, firing a connection request, waiting exactly 60 seconds, and sending a message. \n3.  **Low-Intent Actions:** Sending 50 identical connection requests with a generic pitch signals low quality to the algorithm, especially when connection acceptance rates drop below 20 percent. \n\nFor agencies, relying on connection-centric tools creates a mathematical ceiling. LinkedIn limits connection requests to roughly 100 per week. If your agency's value proposition relies on sending automated connection requests, your growth is hard-capped by that limit. \n\n![Architectural diagram comparing cloud proxy detection versus local residential IP execution on LinkedIn.](https://assets.bevisible.app/inline-images/j5785c96j7yhtjha2r28aqyej98d7p7f/inline-1-1788709666180-z2ch07.png)\nTo bypass this ceiling safely, you have to look beyond the inbox. You need tools that mimic genuine human behavior on an architectural level and engage where LinkedIn actually wants engagement: the public feed.\n\n## Demystifying LinkedIn\u2019s Safety Limits\n\nBefore evaluating new software, you must understand the guardrails. LinkedIn\u2019s weekly limits are dynamic and reputation-based. A ten-year-old Premium account with thousands of connections and regular inbound engagement can take far more actions than a free account created three months ago.\n\nHowever, staying well below the platform's ceiling is non-negotiable for agencies managing external assets. A conservative, safe daily pace for automated or delegated actions looks like this:\n\n*   **Connection Requests:** 10 to 15 per day (staying strictly under the 100 per week threshold).\n*   **1st-Degree Messages:** 20 to 30 per day, scaling up to 50 only if the conversations are warm and receiving active replies.\n*   **Profile Visits:** 30 to 50 per day. This is the lowest-risk touchpoint and often triggers reciprocal profile views.\n*   **Total Automated Actions:** Keep dedicated \"agent hours\" tightly restricted to 15 to 20 total automated outreach actions to avoid triggering velocity filters.\n\nBecause these hard limits restrict DM volume, agencies cannot rely on sheer numbers to generate leads. You cannot send 500 copy-pasted messages in a week. The math simply does not work anymore. \n\n## The Tech Stack: Cloud vs. Local Execution\n\nWhen evaluating alternatives to Dripify, infrastructure is the primary differentiator. Agencies typically encounter three categories of automation architecture: browser extensions, cloud-based software, and local execution.\n\n### The Danger of Browser Extensions\nBasic browser extensions run inside the active browser tab. They are notoriously dangerous. LinkedIn can easily detect the machine-speed DOM manipulation and the fact that the account appears online 24/7. Using a basic Chrome extension to automate a client's outreach is highly likely to result in a ban.\n\n### The Cloud-Based Illusion\nTools like Dripify operate on the cloud. They run on dedicated remote servers, often assigning a unique, static proxy IP address to each LinkedIn account. The logic is that the proxy hides the automation from LinkedIn. \n\nWhile cloud tools are safer than browser extensions, they still carry significant risk for agencies. LinkedIn is highly sophisticated at detecting data center IP ranges. Even if you buy a dedicated static proxy, LinkedIn knows that traffic is originating from a server farm rather than a residential internet service provider. Furthermore, when your client logs into the mobile app on their phone (residential IP) while the cloud tool is running (data center IP), the session conflict can trigger an immediate security checkpoint.\n\n### The Local Execution Advantage\nThe safest architectural approach is local execution. This is where tools like Junior stand apart. Instead of routing traffic through a remote server farm, the software runs directly on the user's local machine. \n\nLocal execution means the automation uses the exact same IP address, hardware footprint, and browser fingerprint that the client uses for their daily browsing. There is no geographic anomaly. There is no data center IP range. The software operates within the user's natural environment, mimicking human interaction patterns seamlessly. For agencies prioritizing account safety above all else, keeping execution local removes the highest-risk variable from the equation.\n\n## Why Commenting is the Safest Way to Scale\n\nIf you cannot scale via connection requests, and cold direct messages are heavily restricted, the remaining channel is public commenting. \n\nCommenting is the most underleveraged growth lever on LinkedIn. When you leave a highly relevant, context-aware comment on a viral industry post, you are not just speaking to the author. You are speaking to the hundreds or thousands of people reading that comment section. \n\nThis approach flips the traditional outbound agency model:\n\n*   **Bypassing the Inbox:** The LinkedIn inbox is crowded with automated pitches. Decision-makers guard their inboxes heavily but actively read the comments on thought-leadership posts within their niche.\n*   **Compounding Visibility:** A direct message is a one-to-one interaction. A well-placed comment on a post with 50,000 views acts as a miniature billboard for your client, driving hundreds of inbound profile views.\n*   **Algorithmic Favor:** LinkedIn\u2019s algorithm rewards accounts that contribute to public conversations. Regular, high-quality commenting signals to the platform that the account is a valuable community member, which organically increases the reach of the client's own posts.\n\nFor an agency, transitioning from automated DMs to automated or AI-assisted commenting requires a shift in strategy. You are no longer measuring success by \"messages sent.\" You are measuring impressions, profile views, and inbound connection requests generated by public visibility. For a deeper understanding of this shift, ensure you read our guide on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n![Illustration showing the reach multiplier of public LinkedIn commenting compared to private direct messaging.](https://assets.bevisible.app/inline-images/j5785c96j7yhtjha2r28aqyej98d7p7f/inline-2-1788709671106-h2tkpy.png)\n## Junior: The Comment-First Alternative\n\nWhen looking for a replacement for traditional connection tools, agencies need software built specifically for this new engagement paradigm. Junior is an AI-powered LinkedIn automation tool designed to start authentic conversations through strategic post commenting rather than generic DM spam.\n\nJunior provides a direct counter to the Dripify model in two distinct ways:\n\n### 1. Context-Aware AI Generation\nLegacy tools allow you to auto-comment, but they usually rely on generic text like \"Great post!\" or \"Thanks for sharing!\" These comments are worse than no comment at all. They signal to the author and the audience that a bot is operating the account. \n\nJunior replaces cold DMs by finding relevant industry discussions and drafting context-aware, human-sounding replies based on the user's unique bio, tone, and goals. The AI reads the context of the original post and formulates a substantive response that adds value to the conversation. It acts as an extension of the client's expertise.\n\n### 2. Local Machine Security\nUnlike cloud-based connection tools, Junior runs locally on the user's machine. It protects account safety by utilizing natural interaction patterns, hardware profiles, and residential IPs. \n\nFor an agency, this creates a distinct operational workflow. Instead of managing everything via a detached cloud dashboard that risks IP bans, the agency helps the client configure their targeted search parameters and AI bio parameters. The software then runs securely in the client's own environment, turning their public visibility into direct interviews, pipeline, and client conversations. To see a direct comparison of these client acquisition methods, review [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## 3 Hidden Failure Modes in Agency LinkedIn Growth\n\nEven when agencies migrate away from legacy tools, they often stumble during the implementation phase. Scaling engagement requires avoiding these three common failure modes.\n\n### Failure Mode 1: Ignoring Dwell Time and Navigation\nLinkedIn tracks how long a user spends looking at a page before taking an action. This is called dwell time. Human beings read posts before they comment. They scroll through a profile before they hit connect. \n\nMany automation platforms fail because they jump directly to a URL and immediately execute a command. The platform registers zero dwell time and instantly flags the action as synthetic. Safe scaling requires software that mimics the natural pacing of a human: navigating to a feed, scrolling, pausing over a post, reading the text, and then typing out a response with natural keystroke delays.\n\n### Failure Mode 2: The \"Great Post\" Epidemic\nUsing AI to scale engagement only works if the output is indistinguishable from a thoughtful professional. If an agency configures an AI tool with poor prompts or generic targeting, the client\u2019s account will start spamming irrelevant threads with \"Insightful thoughts on B2B sales!\" \n\nThis damages the client's reputation immediately. The brand damage of poor automation is often worse than the algorithm penalty. High-intent engagement requires strict boundaries. The AI must be trained on the specific opinions, frameworks, and voice of the client, and it should be configured to ignore posts that do not meet strict relevance criteria.\n\n### Failure Mode 3: Misaligned Campaign Targeting\nAgencies often cast too wide a net. If a client sells enterprise SaaS to CFOs, leaving comments on posts by junior marketing associates will generate vanity metrics (impressions) but zero pipeline. \n\nTargeting must be precise. You must build specific lists of target accounts, industry influencers, and relevant hashtags. Engagement should be focused entirely on the content produced by decision-makers or the thought leaders those decision-makers follow. \n\n## Step-by-Step SOP: Scaling Client Accounts Safely\n\nTo operationalize safe LinkedIn engagement for your agency clients, you need a standardized operating procedure. This workflow ensures predictable results while minimizing account risk. When transitioning your clients, you can also refer to our [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) for technical requirements.\n\n### Phase 1: Audit and Behavioral Mapping\nBefore activating any software, audit the client's current LinkedIn behavior. You must establish a baseline. \n\n*   How many connections do they currently have?\n*   How often do they log in natively?\n*   What is their historical messaging volume?\n\nIf a client logs in once a month and has 300 connections, you cannot suddenly generate 50 comments and 20 connection requests a day. You must gradually warm up the profile. Spend the first two weeks manually engaging or setting the automation to highly conservative limits (e.g., 5 comments per day). \n\n### Phase 2: Defining the Strategic Bio and Tone\nThe success of AI-generated comments relies entirely on the context provided to the system. You must define the client's unique perspective.\n\nInterview the client to extract their core beliefs, contrarian opinions, and specific industry frameworks. Input this data into the AI configuration. The goal is to ensure that when the software evaluates a post about \"remote work productivity,\" it doesn't just agree with the author. It should inject the client's specific framework for remote accountability into the conversation. \n\n![Framework diagram showing how client opinions and tone guidelines feed into context-aware LinkedIn comment generation.](https://assets.bevisible.app/inline-images/j5785c96j7yhtjha2r28aqyej98d7p7f/inline-3-1788709665283-ldyiay.png)\n### Phase 3: Building the Engagement Target List\nDo not rely on the default LinkedIn feed. The default feed is optimized for engagement bait and viral trends, not targeted pipeline generation. \n\nUse LinkedIn Sales Navigator or precise search strings to build targeted lists. You should track:\n*   Top 50 industry influencers who command the attention of your client's target audience.\n*   Top 100 direct prospects (decision-makers at target companies) who are actively posting content.\n*   Specific niche hashtags related to the client's service offering.\n\nBy feeding these precise targets into your engagement software, you guarantee that every automated action is happening in a high-value digital room.\n\n### Phase 4: Deploying Local-First Automation\nDeploy the engagement tool locally. If you are using Junior, assist the client in installing the application on their primary work machine. \n\nConfigure the software to run during the client's actual working hours. If the client is based in London, the automation should operate during GMT business hours. Set strict daily limits based on the Phase 1 audit, capping automated comments to a safe threshold (e.g., 15 to 25 highly relevant comments daily). \n\n### Phase 5: Triage and Human Handoff\nCommenting automation is designed to generate inbound interest. It is not designed to close deals on its own. \n\nAgencies must establish a clear human handoff protocol. When a prospect replies to the client's comment, or when the public engagement triggers an inbound connection request, a human must take over. The agency should monitor the inbound velocity and draft personalized, manual follow-ups to transition the public conversation into a private discovery call. \n\n## Comparing Top Alternatives for Safe Scaling\n\nThe landscape of LinkedIn automation has bifurcated. On one side are legacy cloud-connection tools. On the other side are modern, AI-driven commenting and engagement platforms. Understanding the specific mechanics of each is necessary for agency operators.\n\n| Platform Type | Primary Engagement Method | Infrastructure | Risk Profile | Best Used For |\n| :--- | :--- | :--- | :--- | :--- |\n| **Legacy Cloud Tools** (e.g., Dripify, Expandi) | Connection Requests & DMs | Remote Server / Data Center IPs | High (Algorithm heavily penalizes DM volume and cloud IPs) | Small-scale, highly personalized outbound to very warm lists. |\n| **Cloud Commenting Tools** (e.g., Taplio, Supergrow) | Post Scheduling & AI Comments | Cloud / Browser Extensions | Medium (Better strategy, but still uses detectable cloud/extension architecture) | Content creators focused purely on audience growth. |\n| **Local AI Assistants** (e.g., Junior) | Context-Aware Public Commenting | Local Machine / Residential IP | Low (Mimics human pacing perfectly within the natural hardware environment) | Agencies, founders, and sales teams driving inbound pipeline securely. |\n\nAgencies looking for a deep technical evaluation of specific tools in the commenting space should explore the [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) and review our detailed comparison of [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n## Measuring the ROI of Engagement Automation\n\nOne of the hardest shifts for agencies moving away from Dripify and similar DM tools is re-educating clients on reporting. Clients are used to seeing metrics like \"500 connection requests sent, 40 accepted, 12 replied.\" \n\nWhen you scale via commenting, the funnel looks different. You must track visibility metrics that correlate directly to pipeline.\n\n**1. Profile View Velocity:** \nThis is the most immediate indicator of success. When a client leaves insightful comments on large posts, their profile views should spike within 48 hours. Track the week-over-week percentage increase in profile views.\n\n**2. Inbound Connection Requests:** \nInstead of sending requests, you are attracting them. High-quality commenting prompts target prospects to send connection requests to the client. These inbound connections have a significantly higher conversion rate into meetings because the prospect initiated the relationship.\n\n**3. Content Impressions:** \nIf your client is also publishing original posts, consistent commenting will increase the reach of their own content. The algorithm favors active participants. Track the baseline impressions of client posts before and after deploying the commenting strategy.\n\n**4. The \"I see you everywhere\" Metric:** \nWhile difficult to quantify in a spreadsheet, the qualitative feedback of prospects saying, \"I see your comments everywhere lately,\" is a strong indicator of successful market saturation. This brand omnipresence accelerates the sales cycle when the agency eventually initiates a direct outreach touchpoint. \n\n## Frequently Asked Questions\n\n### How many actions can a new LinkedIn account take safely?\nBrand new accounts (under six months old) or accounts with fewer than 500 connections have extremely low algorithmic trust. Agencies should keep automated actions near zero for the first few weeks. Rely entirely on manual profile optimization and a handful of manual comments daily. Once the account demonstrates consistent, organic human behavior for several weeks, you can slowly introduce local automation, starting at 5 to 10 comments per day. \n\n### Is local automation really safer than cloud automation?\nYes. Cloud automation requires routing your LinkedIn traffic through a proxy server in a data center. LinkedIn's security systems can easily identify data center IP ranges (like AWS, Google Cloud, or DigitalOcean). Even with a dedicated static IP, the infrastructure looks synthetic. Local automation runs on the client's actual computer, utilizing their real residential internet connection and standard browser fingerprint, making it indistinguishable from their normal daily activity.\n\n### Can agencies manage local software for multiple clients?\nManaging local execution requires a different workflow than cloud dashboards. Agencies typically solve this by having the client install the lightweight application on their work device. The agency acts as the strategist, determining the target lists, drafting the AI prompts, and defining the daily limits. The software then executes the agreed-upon strategy securely within the client's environment. This minor friction in onboarding is heavily outweighed by the massive reduction in account suspension risk.\n\n### Why do AI comments sometimes sound generic, and how do we fix it?\nAI outputs are only as good as their inputs. If you give an AI tool zero context about the user, it will resort to safe, generic platitudes. To fix this, you must build a comprehensive \"persona prompt\" for the client. Define their specific industry niche, their controversial opinions, their tone of voice (e.g., analytical, conversational, authoritative), and specific frameworks they use. When Junior is properly configured with this deep context, the resulting comments add genuine value and sound entirely human. \n\n## Adapting to the New Reality of Outbound\n\nThe era of scaling an agency by loading thousands of leads into a cloud-based DM sequencer is over. LinkedIn's algorithms have adapted, user patience for automated pitches has disappeared, and the risk to client accounts is too severe. \n\nAgencies that want to thrive in this environment must pivot from attempting to hack the inbox to dominating the public feed. By replacing outdated connection tools with intelligent, locally-run commenting infrastructure, you can bypass the noise, protect your clients' digital assets, and turn public visibility into a highly predictable revenue pipeline. The tools have changed, but the goal remains exactly the same: starting authentic conversations that lead to meaningful business.", "created_at": "2026-09-06T15:49:24.907721+00:00", "updated_at": "2026-09-06T15:49:24.907728+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
