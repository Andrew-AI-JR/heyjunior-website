    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 73, "slug": "engage-ai-alternatives-automate-linkedin-comments", "title": "Engage AI Alternatives for Ways for Sales Reps to Automate Linkedin Comments", "excerpt": "Discover top Engage AI alternatives for sales reps. Learn 5 safe strategies to automate LinkedIn comments, build context-aware engagement, and drive pipeline.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57bcjy30fbgvkdty35z2j9nt98aj1pr/engage-ai-alternatives-for-ways-for-sales-reps-to-1786717115546-y328dw.png", "published_at": "2026-08-14T14:00:00+00:00", "content": "# Engage AI Alternatives for Ways for Sales Reps to Automate Linkedin Comments\n\nCold direct messages are hitting an all-time low in performance. Cold inboxes are clogged with automated sequences, pitch slaps, and generic follow-up templates that prospects delete without opening. In response, modern B2B account executives, business development reps, and agency sellers have shifted their prospecting strategy upstream to public post discussions.\n\nBy leaving insightful, context-aware comments on posts published by target accounts, sales reps build familiarity, establish domain authority, and generate warm inbound curiosity before ever opening a direct message thread. Doing this manually across dozens of prospects every day takes hours.\n\nEngage AI emerged as an early Chrome extension built to help users quickly draft comments using standard large language models. However, sales representatives using Engage AI frequently run into distinct friction points: generic \"Great perspective!\" outputs, lack of deep personal voice grounding, shallow post filtering, and browser extension session flags.\n\nTo build predictable sales pipeline from LinkedIn without risking your account or sounding like a generic bot, you need methods and platforms built specifically for strategic engagement. This guide breaks down the best ways for sales reps to automate LinkedIn comments and evaluates top Engage AI alternatives.\n\n---\n\n## Why Sales Reps Are Moving Beyond First-Generation Auto-Commenters\n\nFirst-generation commenting tools operate like simple prompt wrappers. You click a browser extension button next to a post, select a generic sentiment such as \"Agree,\" \"Disagree,\" or \"Question,\" and the tool generates a two-sentence summary of the post with a surface-level comment.\n\nWhile this approach saves a few seconds, it fails sales representatives in three critical areas:\n\n1. **Lack of Persona Grounding:** Generic AI commenters do not understand your specific value proposition, case studies, or personal domain experience. They generate commentary that anyone could write, making your brand look interchangeable.\n2. **Poor Prospect Filtering:** Tools that auto-comment across blanket feed posts end up dropping AI responses on irrelevant viral memes, political debates, or personal updates, damaging professional credibility.\n3. **Session and Account Risk:** Reliance on aggressive cloud automations or simple browser scraping extensions can flag rate limits set by LinkedIn. According to research on [LinkedIn comment automation strategies](https://www.joinvalley.co/blog/automate-linkedin-comments-strategies), maintaining natural interaction patterns and pacing is essential to keeping outreach safe.\n\nTo convert public engagement into real sales pipeline, sales teams require systems that combine local account safety, deep contextual awareness, and structured target list discovery.\n\n---\n\n## The 5 Best Ways for Sales Reps to Automate LinkedIn Comments\n\nTo automate LinkedIn comments effectively, you must balance volume with quality. Automating bad comments only scales your irrelevance. Below are the five most effective methodologies sales reps use to automate engagement while maintaining authentic, human-sounding conversations.\n\n![Excalidraw diagram illustrating the 3-step warm bridge strategy from LinkedIn comment to direct message.](https://assets.bevisible.app/inline-images/j57bcjy30fbgvkdty35z2j9nt98aj1pr/inline-1-1786717056752-vq6yqd.png)\n### 1. Persona-Grounded Local AI Draft Generation\n\nInstead of relying on basic prompt templates that rephrase the original post, modern sales automation uses structured persona grounding. You feed the system your professional background, target audience pain points, primary offerings, and preferred tone of voice.\n\nWhen the system reads a prospect\u2019s post, it does not merely summarize the post; it analyzes the content through the lens of your expertise. \n\n* **Generic AI Comment:** \"Great points on cloud migrations! Security and costs are definitely major factors to consider for modern IT teams.\"\n* **Persona-Grounded Comment:** \"We noticed a similar pattern across mid-market healthcare migrations last quarter. The hidden cost driver usually isn't the compute instance\u2014it's legacy data mapping. Curious if you're seeing compliance bottlenecks during the initial audit phase?\"\n\nTools like [Junior](https://www.heyjunior.ai/) focus on this exact local, bio-grounded generation. Rather than using cloud servers that store your session cookies, Junior runs locally on your desktop machine. It uses your unique bio, sales targets, and experience to draft nuanced, highly specific responses directly within your local browser environment.\n\nFor reps looking to evaluate AI comment generation options, reviewing an [AI tools for LinkedIn commenting evaluation checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist) helps clarify the distinction between cloud spammers and context-aware local assistants.\n\n### 2. Targeted Prospect and Keyword Curation\n\nThe biggest failure mode in automated commenting is dropping comments on the wrong posts. Dropping sales-adjacent commentary on a prospect\u2019s personal anniversary post creates immediate awkwardness.\n\nEffective comment automation relies on pre-filtered monitoring feeds. Sales reps set up tracking for three specific post categories:\n\n* **Prospect Posts:** Content written by verified decision-makers from target account lists (ABM accounts).\n* **Industry Keyword Discussions:** Posts from third-party creators or industry leaders containing key problem phrases (e.g., \"CRM migration,\" \"outbound decay,\" \"SOC2 compliance\").\n* **Competitor Mention Threads:** Discussions where users express frustration with competing software or service providers.\n\nBy focusing comment generation exclusively on these high-intent signals, every automated comment acts as a targeted sales touchpoint. Evaluating specialized tools like those covered in our guide on [tools to find relevant LinkedIn posts to comment on](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) can significantly streamline this discovery process.\n\n### 3. The \"Comment-to-DM\" Warm Bridge Strategy\n\nAutomated commenting should never be an end in itself. The ultimate goal of public comment automation is to transition a public interaction into a warm, high-converting direct message conversation.\n\nWhen a prospect replies to your insightful comment or likes your response, they have given you implicit permission to enter their inbox.\n\nHere is the exact framework sales reps use to execute the warm bridge strategy:\n\n1. **Step 1 (Automated Comment):** Leave a context-rich, open-ended question on the prospect\u2019s post using a persona-grounded AI tool.\n2. **Step 2 (Engagement Signal):** Monitor for when the prospect likes your comment or replies to your question.\n3. **Step 3 (Warm DM Outreach):** Send a direct message within 2 hours referencing the public thread.\n\n> *\"Hey [Name], enjoyed your thoughts on the data mapping thread earlier today. Loved your point about audit bottlenecks. Thought I\u2019d share a quick 1-page playbook we used to solve that exact issue for [Client Name]\u2014no pitch attached, just thought it might be useful for your team.\"*\n\nBecause the prospect already recognized your name from their post\u2019s comment section, open rates and reply rates on these direct messages regularly exceed 40% to 50%, far outperforming cold outreach. Reps comparing this model against cold messaging can read our breakdown of [finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### 4. Simulating Human Action Patterns for Account Safety\n\nLinkedIn monitors user accounts for unnatural spikes in activity, automated API requests, and browser automation signatures. Cloud-based platforms that send automated comments from remote data center IP addresses put your personal LinkedIn profile at high risk of temporary restrictions or shadowbanning.\n\nTo keep comment automation completely safe, top sales representatives implement safety-first execution rules:\n\n* **Local Execution:** Use tools that operate directly inside your actual desktop browser, utilizing your existing local session cookies and residential IP address.\n* **Randomized Delays:** Insert natural time intervals (e.g., 45 to 120 seconds) between drafting, reviewing, and posting comments.\n* **Human-in-the-Loop Approval:** Choose a semi-automated workflow where the AI drafts 10 high-quality options, allowing the sales rep to review, tweak, and approve each comment with a single click before publication.\n\nUnderstanding how to maintain account security while scaling outreach is explained in detail in our resource on [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### 5. Multi-Persona Engagement Distribution\n\nWhen targeting large enterprise accounts with complex buying committees, relying on a single sales representative profile can limit your touchpoints. Modern sales teams distribute automated commenting across multiple team profiles\u2014such as account executives, solution engineers, and founding executives.\n\nWhen a VP of Engineering at a target account posts about a platform challenge:\n* The **Account Executive** leaves a strategic business question.\n* The **Solutions Architect** leaves a technical observation highlighting a best-practice framework.\n\nThis creates a subtle, multi-angle presence that establishes deep familiarity across the account\u2019s executive team without feeling invasive.\n\n---\n\n## Architectural Comparison: Local AI vs. Cloud Bots vs. Chrome Extensions\n\nUnderstanding how different LinkedIn comment automation tools operate at an architectural level is vital for protecting your account safety and maintaining comment quality.\n\n![Whiteboard architectural comparison of Chrome Extensions, Cloud Bots, and Local Desktop AI for LinkedIn outreach.](https://assets.bevisible.app/inline-images/j57bcjy30fbgvkdty35z2j9nt98aj1pr/inline-2-1786717056131-9e2x9r.png)\n| Feature / Architecture | Simple Chrome Extensions (e.g., Engage AI basic) | Cloud Automation Bots (e.g., Phantombuster, Dripify) | Local AI Assistants (e.g., Junior) |\n| :--- | :--- | :--- | :--- |\n| **Execution Location** | In-browser overlay / basic script | External Cloud Servers / Data Center IPs | Local Desktop App / Native Browser Session |\n| **Account Safety Risk** | Moderate (frequent DOM changes trigger flags) | High (IP mismatch & headless browser detection) | Minimal (uses your local machine & real browser) |\n| **Contextual Deep Learning** | Low (rephrases post text only) | Low to Medium (uses broad prompt templates) | High (ingests rep bio, offering details, & ICP criteria) |\n| **Human Review Workflow** | One-click popup insertion | Fully automated background execution (unvetted) | Structured queue (review, edit, & approve) |\n| **Post Discovery** | Manual browsing on LinkedIn feed | Automated scraping lists | Curated intent feeds & target list sync |\n| **Best Used For** | Fast manual typing aid | Broad top-of-funnel scraping | Targeted B2B pipeline & account-based selling |\n\nFor a deeper dive into safe automation architectures, consult our guide on [Phantombuster alternatives for safe automated LinkedIn comments](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n---\n\n## Evaluation Checklist: Selecting the Right Engage AI Alternative\n\nWhen evaluating alternatives to Engage AI for your sales organization, use this decision framework to ensure you choose a platform that balances performance, account security, and team efficiency:\n\n```\n[Sales Rep Needs Comment Automation]\n       \u2502\n       \u251c\u2500\u2500 Does it require uploading LinkedIn cookies to cloud servers?\n       \u2502     \u251c\u2500\u2500 YES \u2500\u2500\u25ba \u274c HIGH RISK: Potential session flags or bans\n       \u2502     \u2514\u2500\u2500 NO  \u2500\u2500\u25ba Continue\n       \u2502\n       \u251c\u2500\u2500 Does the tool generate generic surface summaries (\"Great post!\")?\n       \u2502     \u251c\u2500\u2500 YES \u2500\u2500\u25ba \u274c LOW CONVERSION: Ignores rep bio and sales context\n       \u2502     \u2514\u2500\u2500 NO  \u2500\u2500\u25ba Continue\n       \u2502\n       \u251c\u2500\u2500 Does it support localized execution and human-in-the-loop review?\n       \u2502     \u251c\u2500\u2500 NO  \u2500\u2500\u25ba \u26a0\ufe0f MEDIUM RISK: Unchecked AI hallucinated comments\n       \u2502     \u2514\u2500\u2500 YES \u2500\u2500\u25ba Continue\n       \u2502\n       \u2514\u2500\u2500 Does it offer target account post filtering & intent curation?\n             \u251c\u2500\u2500 NO  \u2500\u2500\u25ba \u26a0\ufe0f LOW EFFICIENCY: Wastes engagement on feed noise\n             \u2514\u2500\u2500 YES \u2500\u2500\u25ba \u2705 BEST FIT: Recommended for Enterprise Pipeline Building\n```\n\n---\n\n## Top Engage AI Alternatives Reviewed for Sales Teams\n\nIf you are looking to upgrade from standard browser extensions or explore specialized sales commenting platforms, here is how the top alternatives compare.\n\n### 1. Junior\n\n[Junior](https://www.heyjunior.ai/) is built specifically to turn public post engagement into warm sales conversations without triggering spam filters or security alerts.\n\nUnlike cloud-based tools that ask for your LinkedIn login credentials or run headless browsers on remote servers, Junior operates locally on your computer. It reads target posts, cross-references them against your personal bio, target prospect profiles, and core value proposition, and drafts authentic, context-aware comments.\n\n#### Why Sales Reps Prefer Junior over Engage AI:\n* **True Local Execution:** Your LinkedIn session remains entirely on your machine, eliminating account safety risks associated with proxy switches or cloud IP addresses.\n* **Persona-Driven Drafts:** Junior doesn't write passive compliments. It drafts strategic, value-first responses tailored to open up sales discussions.\n* **Built-in Post Curation:** Finds high-value discussions across your target accounts so you don't waste time scrolling through irrelevant main feed posts.\n* **Warm DM Transitioning:** Helps sales reps identify which public comment threads are ready to convert into direct message conversations.\n\nFor a comprehensive comparison between manual feed management and specialized automation platforms, read our analysis on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n### 2. Taplio\n\nTaplio is a popular overall LinkedIn content management suite. It includes scheduling, analytics, lead database searching, and basic AI comment drafting features.\n\n#### Strengths:\n* All-in-one platform for personal branding and content scheduling.\n* Good for content creators who want to schedule posts and engage with commenters in one dashboard.\n\n#### Weaknesses for Pure Sales Reps:\n* Primary focus is content creation rather than dedicated sales prospecting.\n* Comment generation can lean generic unless prompts are continuously customized.\n* Pricing is tied to content scheduling features that non-posting sales reps may not need.\n\n### 3. Simular AI\n\nSimular focuses on web-agent automation, seeking to replicate human interaction on web pages directly.\n\nAccording to research from [Simular AI on LinkedIn auto-commenting](https://www.simular.ai/use-cases/linkedin-auto-comment), generic auto-commenting extensions produce low-quality output that prospects easily spot as robotic. Simular attempts to fix this by using desktop-level agents to navigate LinkedIn, read post details, and execute actions mimicking human timing.\n\n#### Strengths:\n* Mimics physical mouse movements and keyboard entries.\n* Reduces API detection risks.\n\n#### Weaknesses:\n* Requires technical configuration to set up complex sales workflows.\n* Can be slower to execute than dedicated lightweight local desktop extensions.\n\n### 4. Valley\n\nValley is designed as an AI sales agent platform aimed at automating outbound messaging and strategic engagement for deal teams.\n\nAs noted in their guide on [LinkedIn message automation and AI personalization](https://www.joinvalley.co/blog/linkedin-message-automation-ai-personalization), high-performing sales automation must adhere strictly to natural interaction limits to prevent account flags.\n\n#### Strengths:\n* Focuses on converting account intent into structured outreach.\n* Integrates commenting with multi-touch pipeline generation.\n\n#### Weaknesses:\n* Enterprise pricing tier can be restrictive for individual reps or small teams.\n* Requires team-wide onboard setup to get optimal personalization outputs.\n\n---\n\n## Practical Case Example: How an AE Generated $140,000 in Qualified Pipeline via Automated Commenting\n\nTo understand how strategic LinkedIn comment automation operates in practice, consider the strategy used by Marcus, a Senior Account Executive selling B2B cybersecurity software to mid-market CISOs.\n\n### The Problem\nMarcus\u2019s standard cold email sequences were seeing open rates decline below 20%, and cold LinkedIn InMails were yielding less than a 3% reply rate. CISOs were routinely ignoring cold pitches.\n\n### The Solution Strategy\nMarcus stopped sending cold DMs. Instead, he implemented a structured comment automation workflow:\n\n1. **Target Account List Sync:** Marcus created a list of 150 target CISOs across key mid-market accounts.\n2. **Intent & Post Curation:** He set up local monitoring for when these 150 executives published posts or commented on industry security threads.\n3. **Local AI Draft Generation with Junior:** Using Junior running locally on his laptop, Marcus generated tailored, technical observations on each post based on his executive bio and cybersecurity background.\n4. **Human Review:** Marcus spent 12 minutes every morning reviewing a queue of 15 drafted comments, tweaking 2 or 3 sentences to add hyper-specific references, and approving them with one click.\n5. **The Warm Transition:** When a prospect replied to a comment, Marcus waited 1 hour, then sent a light, highly relevant direct message referencing their public dialogue.\n\n![Minimalist field notes chart comparing sales results of cold InMail versus contextual LinkedIn comment strategies.](https://assets.bevisible.app/inline-images/j57bcjy30fbgvkdty35z2j9nt98aj1pr/inline-3-1786717049987-e51nv8.png)\n### The Results After 60 Days\n\n| Metric | Traditional Cold InMail Campaign | Contextual AI Comment Strategy |\n| :--- | :--- | :--- |\n| **Outreach / Touches Executed** | 450 Cold InMails sent | 210 Public Comments approved & posted |\n| **Prospect Response Rate** | 2.8% (13 replies) | 38.0% (80 comment replies) |\n| **Warm DMs Sent** | 0 (All cold) | 62 Warm follow-up DMs |\n| **Sales Meetings Booked** | 2 Discovery Calls | 11 Discovery Calls booked |\n| **Pipeline Qualified** | $25,000 | $140,000 qualified pipeline |\n\nBy shifting from cold inbox pitching to structured, automated public engagement, Marcus increased meeting booking efficiency by over 500% while cutting total daily outreach effort in half.\n\n---\n\n## Step-by-Step Guide to Automating LinkedIn Comments Safely\n\nIf you are ready to set up a comment automation engine for your sales workflow, follow this step-by-step implementation guide:\n\n### Step 1: Define Your Strategic Sales Persona\nDo not jump straight into tool setup without defining your persona context. Write out a 3-paragraph executive summary detailing:\n* Your specific industry role and background.\n* The primary metric or business outcome you help prospects achieve.\n* 3 to 4 distinct opinion points or industry frameworks you regularly advocate for.\n\nThis text serves as the foundation for your local AI tool to generate human-sounding commentary.\n\n### Step 2: Build Your Prospect Curation Feed\nGather the LinkedIn profile URLs of your top 100 to 200 key decision-makers. Organize them by account priority. Alternatively, identify 5 core industry hashtags and competitor discussion threads where your prospects ask questions.\n\n### Step 3: Configure Your Automation Platform\nDownload and install a local automation application like [Junior](https://www.heyjunior.ai/). Ensure the platform is set up to:\n* Run locally through your primary desktop browser.\n* Use your saved persona background for context generation.\n* Enforce random delay intervals between activity passes.\n\n### Step 4: Implement a Daily \"Review and Approve\" Queue\nNever let an unvetted AI tool post comments to your professional profile on auto-pilot. Dedicate 10 to 15 minutes at the start of your workday to:\n* Review 10 to 15 AI-generated draft comments.\n* Confirm that the post context matches the prospect's intent.\n* Click approve to schedule or publish the comment through your local browser.\n\n### Step 5: Execute the Warm DM Follow-Up Protocol\nCheck your LinkedIn notifications twice daily. Whenever a target prospect likes or replies to your comment, execute your warm DM transition script within 2 to 4 hours while the discussion remains fresh.\n\nFor additional strategies on safe execution limits and tool evaluations, consult our comprehensive list of the [best LinkedIn engagement tools for 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026).\n\n---\n\n## 4 Costly Mistakes Sales Reps Make When Automating Comments\n\nEven with advanced AI tools, sales reps can derail their prospecting efforts if they fall into common automation traps.\n\n### 1. Pitch-Slapping in Public Comments\nInserting a product plug or a demo link into a public post comment instantly destroys credibility. Public comments are meant to add value, share perspective, or ask thoughtful questions. Save the pitch for private direct messages after rapport has been established.\n\n### 2. Auto-Commenting on Sensitive or Irrelevant Posts\nUsing fully hands-off cloud bots often results in AI commenting on tragic news, job transitions, or internal company updates with generic promotional fluff. Always maintain a human-in-the-loop review step to catch tone mismatch before publishing.\n\n### 3. Using Overused \"AI Buzzwords\"\nPrompts that lack persona training frequently produce phrases like \"Great insights!\", \"Delving into this topic,\" \"Crucial perspective,\" or \"In today's fast-paced environment.\" Prospects immediately spot these robotic tropes. Train your tools to use plain, direct conversational English.\n\n### 4. Over-Engaging on Low-Value Posts\nSpending automation bandwidth commenting on viral influencer posts with 500+ comments gets your response buried. Focus your automation engine on posts written directly by your target prospects, where your comment is likely to be one of fewer than 10 responses.\n\n---\n\n## Frequently Asked Questions\n\n### Can LinkedIn detect automated comments?\nLinkedIn uses machine learning models to detect rapid API requests, headless browser sessions, and repetitive commenting patterns. However, when sales reps use local desktop tools like Junior that operate through their real browser, incorporate human-in-the-loop approval, and utilize natural random delays, the activity matches standard human browsing behavior. More details on safety precautions can be reviewed in this breakdown of [safe LinkedIn comment automation tools](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n### Is Engage AI free to use?\nEngage AI offers a limited free tier with basic comment generation features, alongside paid premium tiers that offer custom prompt templates and higher draft volume limits. However, sales representatives often require deeper persona grounding and account-based post curation features available in dedicated sales platforms.\n\n### How many LinkedIn comments should a sales rep post per day?\nFor optimal sales outreach and account safety, target between 10 and 25 highly contextual, approved comments per day focused strictly on target prospects and industry keywords. Quality and relevance far outweigh raw volume when building sales pipeline.\n\n### Should I use fully automated commenting or semi-automated commenting?\nSemi-automated (human-in-the-loop) commenting is strongly recommended for B2B sales reps. Having the AI handle post discovery, context reading, and draft generation saves 90% of the manual work, while spending 5 seconds to review each comment guarantees 100% brand safety and tone accuracy.\n\n---\n\n## Building a Sustainable Commenting Engine\n\nAutomating LinkedIn comments is one of the highest-leverage strategies available to modern sales representatives. By replacing unread cold InMails with insightful, persona-grounded public interactions, reps build warm trust, establish authority, and consistently turn target account posts into active sales conversations.\n\nWhile first-generation tools like Engage AI helped prove the value of AI comment drafting, modern B2B sales teams require local execution, account safety, and deep contextual understanding.\n\nTo see how local, persona-driven AI can transform your LinkedIn outreach strategy safely, explore [Junior](https://www.heyjunior.ai/) and start converting public post visibility into warm sales pipeline today.", "created_at": "2026-08-14T14:19:22.564667+00:00", "updated_at": "2026-08-14T14:19:22.564672+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
