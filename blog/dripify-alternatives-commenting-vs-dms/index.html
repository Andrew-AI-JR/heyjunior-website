    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 90, "slug": "dripify-alternatives-commenting-vs-dms", "title": "Dripify Alternatives for Dripify Alternatives Focused On Commenting Instead of Dms", "excerpt": "Tired of cold DM fatigue and account bans? Explore the top Dripify alternatives focused on strategic, context-aware LinkedIn commenting and inbound growth.", "featured_image_url": "https://assets.bevisible.app/featured-images/j570rehp30613ggk34qx70eeg98d6x7n/dripify-alternatives-for-dripify-alternatives-focu-1788277741187-eno8p1.png", "published_at": "2026-09-01T15:17:00+00:00", "content": "# Dripify Alternatives for Dripify Alternatives Focused On Commenting Instead of Dms\n\nThe LinkedIn inbox has reached a tipping point. If you have spent any time managing a sales pipeline, searching for a new role, or building a consulting practice over the last year, you already know the reality: cold direct messages are suffering from severe diminishing returns. Prospects are fatigued by automated pitches, connection requests are aggressively capped by LinkedIn\u2019s weekly limits, and the traditional \"connect-and-pitch\" sequence is widely ignored. \n\nFor years, platforms like Dripify dominated the conversation around LinkedIn growth by perfecting the automated DM sequence. They allowed users to scrape lists, bypass limits, and flood inboxes. But as algorithmic restrictions tighten and user behavior shifts, relying solely on private messaging is becoming a liability. The new currency of LinkedIn growth is public visibility\u2014specifically, strategic, context-aware commenting. \n\nWhen you leave a highly relevant, insightful comment on a target prospect's post, you do not just reach that individual. You reach their entire network, positioning yourself as a peer rather than a vendor. This shift has created a massive demand for automation tools that prioritize the feed over the inbox. \n\nIf you are looking to pivot your strategy, this guide breaks down the most effective alternatives to Dripify that focus on commenting, engagement, and brand building, leaving the outdated DM spam behind.\n\n![Diagram comparing the 1-to-1 reach of cold LinkedIn direct messages versus the compounding 1-to-many reach of public post com](https://assets.bevisible.app/inline-images/j570rehp30613ggk34qx70eeg98d6x7n/inline-1-1788277673371-3horyr.png)\n## The Strategic Shift: Why Commenting Outperforms Cold DMs\n\nBefore evaluating specific software, you have to understand the mechanics of why comment-first tools are eroding Dripify\u2019s market share. The transition from private messaging to public engagement is driven by three inescapable realities of the modern LinkedIn platform.\n\n### The Mathematics of Reach and Impressions\n\nWhen you send a direct message via Dripify, the maximum possible audience for that message is exactly one person. If that person ignores it, the effort yields zero return. The interaction is siloed and invisible to the rest of the market. \n\nCommenting operates on an entirely different mathematical model. An insightful comment on a post from an industry leader or a high-value prospect acts as a miniature billboard. If a prospect's post receives 10,000 views, a top-ranking comment on that post might easily capture 1,000 to 2,000 impressions. Those impressions drive profile views, which turn into inbound connection requests and natural conversations. You are effectively leveraging other people's audiences to build your own pipeline. \n\n### The Psychology of Peer Positioning\n\nCold outbound messaging inherently places you in a subservient position. You are interrupting someone\u2019s day to ask for their time, attention, or budget. The recipient immediately categorizes you as a salesperson. \n\nCommenting reverses this dynamic. When you add genuine value to a public discussion, you position yourself as a subject matter expert. If a prospect posts about the difficulties of scaling outbound sales, and you leave a thoughtful comment detailing a specific workflow that solved that problem, you enter their radar as a peer. When you eventually transition that interaction to a private message or an interview, the dynamic is warm. They already respect your perspective. If you are comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging), this shift in psychological positioning is often the deciding factor in win rates.\n\n### Account Safety and Algorithmic Throttling\n\nLinkedIn actively fights automated direct messaging. Cloud-based tools that send hundreds of connection requests or DMs are regularly flagged, resulting in account restrictions, shadowbans, or permanent deletions. LinkedIn's engineering team deploys sophisticated heuristics to detect unnatural typing speeds, rigid scheduling patterns, and IP hopping\u2014all hallmarks of legacy cloud automation.\n\nCommenting, especially when executed with natural cadences and localized infrastructure, aligns much closer to intended user behavior. LinkedIn *wants* users to engage in the feed. It keeps users on the platform longer. Tools that facilitate organic-looking comments face significantly less algorithmic friction than tools designed to circumvent inbox limits.\n\n## Core Features to Demand in a Comment-First Tool\n\nWhen moving away from Dripify's sequence-heavy architecture, you need a different set of evaluation criteria. A great commenting tool is not just a text spinner; it requires high-level contextual awareness and stringent safety protocols.\n\nIf you are building your [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), prioritize these specific capabilities:\n\n### Contextual AI Processing\nEarly commenting bots were notorious for leaving generic phrases like \"Great post!\" or \"Thanks for sharing.\" This actively damages your reputation. A modern alternative must ingest the specific context of the original post, synthesize it against your unique professional bio, and draft a response that sounds human. The AI must understand nuance, humor, and industry-specific terminology.\n\n### Targeted Feed Curation\nYou cannot comment on random posts and expect pipeline growth. The tool must allow you to curate specific lists of creators, prospects, target accounts, or keywords. If you are a sales agency targeting B2B SaaS founders, your commenting tool should exclusively surface posts from that exact demographic, filtering out irrelevant network noise.\n\n### Localized Execution vs. Cloud Processing\nThis is a critical safety distinction. Cloud-based tools run on remote servers. When a cloud tool logs into your LinkedIn account, LinkedIn sees a login from an unrecognized data center IP address, often while you are simultaneously logged in on your home Wi-Fi. This is an immediate red flag. The best commenting tools operate locally on your own machine, using your actual browser session and native IP address, rendering the automation nearly indistinguishable from manual human activity.\n\n### Workflow and Draft Control\nNo AI is perfect 100% of the time. The ideal commenting alternative does not auto-publish on your behalf. Instead, it should act as an intelligent drafting assistant. It should surface the relevant post, generate a highly contextual drafted reply based on your goals, and pause for your approval or manual editing before execution. \n\n![Workflow diagram illustrating human-in-the-loop AI comment drafting from feed curation to contextual generation and local rev](https://assets.bevisible.app/inline-images/j570rehp30613ggk34qx70eeg98d6x7n/inline-2-1788277676829-jwgrgi.png)\n## Top Dripify Alternatives for Comment-Led Growth\n\nThe market has responded to the demand for feed-based engagement. The following platforms represent the most viable alternatives for professionals who want to replace Dripify's inbox automation with public visibility.\n\n### 1. Junior: The Local, Context-Aware Standard\n\nJunior was built specifically to solve the problems inherent in legacy tools like Dripify. Rather than facilitating generic DM spam, Junior is an AI-powered LinkedIn automation tool designed strictly to start authentic conversations through strategic post commenting. \n\nFor job seekers, sales teams, agencies, and founders, Junior replaces the need for cold DMs entirely. It operates by finding highly relevant discussions in your niche and drafting context-aware, human-sounding replies. The AI does not just summarize the post; it cross-references the topic against your unique bio, goals, and expertise to craft a response that you would actually write yourself. \n\n**Why it replaces Dripify:**\nJunior bypasses the crowded inbox entirely, turning public visibility into direct interviews, sales pipeline, and client conversations. Where Dripify relies on cloud-based servers that put your account at risk of restriction, Junior runs locally on your own machine. This local architecture protects your account safety by utilizing natural interaction patterns and your native IP address. You get the scale of automation with the safety and authenticity of manual engagement. If you are focused on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), localized execution is non-negotiable.\n\n### 2. MyFeedIn: Focused on Custom Feed Curation\n\nMyFeedIn approaches the LinkedIn growth problem by acknowledging that the native LinkedIn algorithm does a poor job of surfacing the exact posts you need to see for lead generation. When evaluating [vs Dripify \u2014 Which LinkedIn Tool Is Right for You?](https://myfeedin.co/alternatives/dripify), MyFeedIn positions itself as a tool to reduce automation risk by facilitating genuine engagement rather than blind messaging sequences.\n\nThe platform's core feature is its custom feed generation. Users can build specific feeds based on precise target personas, ensuring that their commenting time is spent exclusively on high-leverage posts. \n\n**Why it replaces Dripify:**\nMyFeedIn includes a \"focus mode\" designed to remove distractions and streamline the commenting workflow. While it requires more manual input than fully automated AI drafters, its analytics dashboard is highly tailored toward measuring comment impact\u2014showing you which engagements actually drive profile views. It is a strong alternative for users who want to step away from automated sequences but still need software to organize their outreach targets.\n\n### 3. Commentify: AI-Matched Commenting at Speed\n\nCommentify focuses on bridging the gap between scale and relevance. According to evaluations of [Tools That Outperform Dripify in 2025 | Commentify](https://blog.commentify.co/tools-better-than-dripify/), the platform leans heavily into a \"comment-first\" philosophy, operating on the premise that you must earn the right to enter a prospect's inbox by first appearing in their notifications via thoughtful comments.\n\n**Why it replaces Dripify:**\nCommentify uses AI to read incoming posts from your targeted lists and suggests multiple variations of comments, allowing you to choose the tone\u2014ranging from agreeable to slightly contrarian. This variety helps maintain a human-like footprint. By focusing on speed and intuitive setup, it offers a stark contrast to the often complex, multi-stage campaign builders found in traditional DM tools.\n\n### 4. Typing Post: Blending Content Creation with Engagement\n\nTyping Post offers a hybrid approach. While it operates as a [Dripify Alternative - Typing Post](https://typingpost.com/blog/dripify-alternative/), it expands beyond just outbound engagement by incorporating content generation tools. \n\n**Why it replaces Dripify:**\nTyping Post includes dedicated auto-commenter features designed to maintain your visibility without aggressive messaging. The thesis here is that commenting on other people's posts should naturally pair with publishing your own content. If your strategy involves building a holistic personal brand\u2014where you drive traffic via comments back to your own high-value posts\u2014Typing Post provides the infrastructure to manage both sides of that equation from a single dashboard. \n\n### 5. SalesRobot and PhantomBuster: Broad Automation with Commenting Features\n\nIt is worth noting platforms like SalesRobot and PhantomBuster, though they come with a significant caveat. Both are incredibly powerful, multi-channel automation platforms. When comparing [Dripify vs Zopto: Best LinkedIn Automation Tool 2025 - SalesRobot](https://www.salesrobot.co/blogs/dripify-alternatives) or reading about [Dripify Competitors And Alternatives For LinkedIn Automation | PhantomBuster](https://phantombuster.com/blog/automation/dripify-competitors-alternatives-5dxQvgLkgrvAc8zz9LLEPn), you will find that these tools technically allow you to automate comments.\n\n**Why they replace Dripify (with warnings):**\nYou can build custom PhantomBuster workflows that scrape a list of posts and deploy comments. SalesRobot allows you to build sequences that include commenting steps before sending a connection request. However, at their core, these are still fundamentally legacy DM and connection tools adapted for a new trend. They often rely on the same cloud-based infrastructure that makes Dripify risky. If you use them, you must be extremely cautious about daily limits and algorithmic detection. They are better suited for operations teams that need to tie LinkedIn activity directly into complex CRM and email sequencing, rather than individuals focused purely on authentic community growth.\n\n## Feature Matrix: Comparing Comment-First Workflows\n\nTo clarify the operational differences between these approaches, it helps to view how they handle the actual mechanics of engagement compared to the legacy Dripify model.\n\n| Feature Category | Legacy DM Tools (Dripify) | Comment-First AI (Junior) | Curation Tools (MyFeedIn) |\n| :--- | :--- | :--- | :--- |\n| **Primary Outreach Vector** | Automated Direct Messages | AI-Drafted Public Comments | Manual Comments on Curated Feeds |\n| **Execution Architecture** | Cloud-based (Remote IP) | Local Machine (Native IP) | Browser Extension/Local |\n| **Contextual Awareness** | Low (Merge tags like {First_Name}) | High (Analyzes post intent + user bio) | N/A (Relies on human typing) |\n| **Risk of Account Restriction** | High (Often hits connection limits) | Low (Uses natural feed behavior) | Low (No automated actions) |\n| **Targeting Mechanism** | Sales Navigator scraping | Strategic topic/creator monitoring | Custom list building |\n\n![Technical architecture diagram highlighting the security risks of cloud automation versus the safety of local browser executi](https://assets.bevisible.app/inline-images/j570rehp30613ggk34qx70eeg98d6x7n/inline-3-1788277682871-gw32n2.png)\n## The Hidden Risks of Cloud Automation in 2026\n\nIf you are transitioning away from Dripify, it is critical to understand exactly *why* you are making the switch, so you do not accidentally choose an alternative with the exact same underlying flaws. \n\nThe biggest vulnerability in the LinkedIn automation space is cloud architecture. When you sign up for a traditional automation platform, you hand over your LinkedIn session cookies or login credentials. The software provider then uses a server\u2014often located in a different state or country\u2014to log into your account and run scripts in the background 24/7.\n\nLinkedIn\u2019s security infrastructure is hyper-aware of this behavior. If your account shows a login from AWS in Virginia at 2:00 AM, while your mobile app shows you active in California, the system instantly flags the discrepancy. Furthermore, cloud bots often operate with inhuman precision. They execute clicks at exact mathematical intervals and send messages at speeds a human could never achieve. \n\nThis results in a tiered penalty system:\n1. **The Warning:** LinkedIn forces a password reset and logs you out of all devices.\n2. **The Shadowban:** Your connection requests are automatically restricted, and your posts are suppressed from the feed, though you receive no formal notification.\n3. **The Restriction:** You are banned from sending invites or messages for 30 days.\n4. **The Ban:** Permanent loss of the account. \n\n### The Local Execution Advantage\nAlternatives focused on safety\u2014which is why [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) often rank local tools highly\u2014operate entirely differently. By running locally on your own computer, the software utilizes your actual Chrome or Edge browser session. \n\nTo LinkedIn, the traffic looks identical to you sitting at your desk. The IP address matches. The user-agent matches. Modern local tools like Junior even introduce randomized delays and mimic human scrolling behavior before executing a drafted comment. This architectural difference is the single most important factor when choosing a tool to protect a high-value LinkedIn profile.\n\n## Designing a Comment-Led Pipeline Strategy\n\nAcquiring a comment-focused Dripify alternative is only half the battle. You must completely rewire how you view outbound generation. You are no longer measuring \"messages sent.\" You are measuring \"meaningful engagements.\" Here is a blueprint for implementing this workflow successfully.\n\n### Phase 1: Define Your \"Commenting Identity\"\nBefore you deploy AI to draft replies, you need a strict parameters on what you want to be known for. AI needs constraints to be effective. \n*   **What is your core expertise?** (e.g., B2B SaaS churn reduction).\n*   **What is your contrarian opinion?** (e.g., Net Promoter Score is a vanity metric).\n*   **Who is your target audience?** (e.g., Series B Customer Success leaders).\n\nWhen you feed this identity into a context-aware tool, the AI stops generating \"Great insights!\" and starts generating, \"Interesting take on retention. I've actually found that tracking time-to-first-value correlates better with churn prevention than NPS surveys in Series B companies.\" \n\n### Phase 2: Curate the High-Leverage Hitlist\nDo not waste comments on viral posts with 5,000 comments. Your input will be buried instantly. Instead, build your targeting lists around the \"Goldilocks Zone\":\n*   **Ideal Prospects:** Decision-makers at your target accounts who post regularly but only get 5 to 15 comments per post. Your comment will be highly visible to them and their immediate network.\n*   **Industry Hubs:** Thought leaders who command an audience of *your* target prospects. When you comment thoughtfully on their posts, their followers view your profile. \n\n### Phase 3: The Daily Engagement Routine\nInstead of running a sequence in the background, your daily workflow becomes an active, supervised process:\n1. Open your local automation tool.\n2. Allow the software to scan your curated lists and surface 20-30 relevant new posts.\n3. Review the AI-drafted responses. The AI has already read the post and applied your core expertise to the draft.\n4. Edit 10-20% of the drafts manually to add a specific personal anecdote or adjust the tone.\n5. Approve and execute. \n\nThis routine takes 15 minutes a day, yields 30 high-quality public touchpoints, and carries zero risk of triggering inbox spam filters.\n\n### Phase 4: Harvesting the Inbound Intent\nThis is where the ROI materializes. A successful commenting strategy flips outbound into inbound. \n*   **Profile Views:** A strong comment drives people to your profile. Ensure your LinkedIn banner and headline clearly state what you do and who you help. \n*   **Inbound Connections:** Prospects will send *you* connection requests. When they do, the ice is already broken. You simply reply: \"Thanks for connecting, John. Glad my comment on your post about outbound scaling resonated. Are you actively dealing with deliverability issues right now?\"\n*   **The Soft DM Transition:** If a prospect replies positively to your public comment, *then* you transition to the inbox. \"Really enjoyed our back-and-forth on the post today. Figured I'd connect here so we can keep in touch.\" The acceptance rate on this type of request is exponentially higher than a cold Dripify scrape.\n\n## Edge Cases and Failure Modes to Avoid\n\nEven with the best tools, a comment-led strategy can fail if poorly executed. Watch out for these common traps.\n\n### The \"Overly Agreeable\" Trap\nAI models are naturally trained to be polite and sycophantic. If you do not adjust your tool's settings, you will end up publishing hundreds of comments that essentially say, \"I completely agree with everything you just said.\" This adds no value to the conversation and fails to demonstrate your expertise. You must configure your tool to challenge assumptions respectfully, add missing data points, or provide alternative perspectives.\n\n### Ignoring the Hook\nJust like a post, a comment needs a hook. If a comment starts with \"Thanks for sharing this great article, I think that...\", the reader has already scrolled past it. A drafted comment should start with the core thesis immediately. \n\n### Automating on Sensitive Topics\nNever automate engagement on posts regarding personal tragedy, layoffs, political events, or highly sensitive corporate news. A misjudged, AI-generated comment on a post about a company downsizing can permanently damage your brand. Always manually review the original post context before clicking approve.\n\n## Frequently Asked Questions\n\n**Are comment automation tools actually safe from LinkedIn bans?**\nSafety depends entirely on the architecture of the tool. Cloud-based platforms that execute actions on remote servers carry high risk. Tools that operate locally, using your native browser and IP address to draft responses for your approval, are incredibly safe because they do not bypass LinkedIn's intended user behavior limits.\n\n**How do commenting tools compare to Dripify's analytics?**\nDripify measures granular funnel metrics: requests sent, open rates, and reply rates. Comment-first tools measure different KPIs: profile views generated, inbound connection requests, and comment impression share. The metrics are fundamentally different because one measures outbound force, while the other measures inbound attraction.\n\n**Can I still generate immediate leads without sending cold DMs?**\nYes, but the timeline looks slightly different. Cold DMs can occasionally force an immediate meeting, though at a very low conversion rate. Commenting builds a warmer pipeline that often converts faster once the conversation moves to a private channel, because the trust barrier has already been dismantled publicly. \n\n**Does AI-generated commenting sound robotic?**\nIt only sounds robotic if you use basic, unprompted AI. Advanced tools allow you to feed the system your specific industry knowledge, your unique tone of voice, and strict rules about formatting (e.g., \"never use emojis,\" \"keep sentences short\"). When configured correctly, the output is indistinguishable from your natural writing style.\n\n## Adapting to the New Reality of Social Selling\n\nThe era of loading a CSV file of 1,000 prospects into a cloud server and blasting them with generic connection requests is effectively over. The buyers are too smart, the inboxes are too crowded, and the platform algorithms are too restrictive. \n\nTransitioning away from Dripify to a tool focused on strategic commenting is not just a tactical software switch; it is an evolution in how you approach professional networking. By focusing on public visibility, contextual relevance, and localized safety, you bypass the noise of the inbox entirely. You stop acting like a vendor clamoring for attention, and you start operating like a peer who already belongs in the room. Choose your tools wisely, prioritize the quality of your engagement over the sheer volume of your outreach, and let the inbound pipeline follow.", "created_at": "2026-09-01T15:49:25.917300+00:00", "updated_at": "2026-09-01T15:49:25.917306+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
