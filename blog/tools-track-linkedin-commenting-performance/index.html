    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 102, "slug": "tools-track-linkedin-commenting-performance", "title": "Best Tools to Track Linkedin Commenting Performance Tools Beyond Dripify", "excerpt": "Discover the top tools to track LinkedIn commenting performance, measure profile view velocity, and scale pipeline without risky cold DM automation.", "featured_image_url": "https://assets.bevisible.app/featured-images/j571h3c4dpg960ns13kjcfzbt58d75mc/best-tools-to-track-linkedin-commenting-performanc-1789314501981-9esu79.png", "published_at": "2026-09-13T15:25:00+00:00", "content": "# Best Tools to Track Linkedin Commenting Performance Tools Beyond Dripify\n\nIf you spent the last year relying on automated connection requests and generic inbox pitches, your response rates have likely plummeted. The LinkedIn inbox has become a crowded, noisy environment where buyers immediately put their guard up. To bypass this friction, top-performing sales teams, founders, and job seekers have shifted their focus to the public feed. Leaving context-aware, highly relevant comments on target accounts' posts is the modern equivalent of a warm introduction. \n\nBut this shift introduces a new logistical problem: measurement. While legacy automation platforms are great at telling you how many cold messages they blasted out, they fall completely flat when you ask them to measure the impact of your public conversations. You cannot optimize what you do not measure.\n\nMoving beyond basic inbox automation requires specialized tools to track LinkedIn commenting performance, measure your consistency, and tie public visibility back to actual pipeline generation. \n\n## The Shift From Inbox Blasting to Public Commenting\n\nFor years, platforms like Dripify defined LinkedIn growth. The playbook was simple: scrape a list of target profiles, load them into a cloud-based campaign, and send a sequence of connection requests followed by three automated follow-up messages. \n\nThat playbook is breaking down for a few structural reasons. First, LinkedIn has aggressively tightened its limits on outbound connection requests, punishing accounts that exhibit bot-like volume. Second, decision-makers are fatigued. When a prospect sees \"I noticed we both work in [Industry] and wanted to connect,\" they archive the message without reading the second sentence. \n\nCommenting flips the dynamic. Instead of interrupting a prospect in their private inbox, you are adding value to a public conversation they initiated. When you leave an insightful, human-sounding comment on a prospect's post, you achieve three things simultaneously:\n1. You trigger a direct notification on the prospect's phone.\n2. You prove your competence by adding to their specific topic.\n3. You gain visibility with everyone else reading that post\u2014effectively borrowing the prospect's audience.\n\nIf you want to understand how this strategy replaces the need for automated messaging entirely, review our breakdown on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). \n\nMeasuring this strategy requires a different set of metrics. You are no longer tracking \"Connection Accepted Rate.\" You are tracking comment impressions, profile views generated by comments, and the conversion of those profile views into inbound conversations.\n\n![Diagram contrasting cold outreach funnel drop-off against the expanding reach of strategic public commenting.](https://assets.bevisible.app/inline-images/j571h3c4dpg960ns13kjcfzbt58d75mc/inline-1-1789314454640-be9bsd.png)\n## Key Metrics to Track for LinkedIn Comments\n\nBefore selecting a software stack, you need to establish what actually matters. Tracking the wrong metrics will lead you to leave generic, engagement-bait comments rather than strategic insights that generate business. \n\n### 1. Profile View Velocity\nThis is the immediate leading indicator of a successful comment. When you leave a highly relevant reply on a prospect's post, the natural human reaction is for them (and their readers) to hover over your name and click your profile. If you leave five comments on Tuesday and see a 40% spike in profile views on Wednesday, your commenting strategy is working. \n\n### 2. Comment Impressions and Audience Reach\nUnderstanding how many people actually see your comments helps you gauge the overall visibility of your strategy. Creators who comment consistently systematically outperform those who only publish original posts because they are tapping into established distribution networks. Tracking impressions on both your posts and your comments gives you a complete picture of your reach. [1](https://bearconnect.io/blog/what-are-impressions-on-linkedin/)\n\n### 3. Consistency and Habit Streaks\nCommenting is a volume game, but not in the way cold outreach is. You do not need 1,000 comments a day; you need 20 high-quality comments every single day. Tracking your daily streaks ensures you maintain the necessary rhythm to stay top-of-feed for your target accounts. As noted by analytics providers, building that early-engagement base requires consistent, daily interaction. [2](https://myfeedin.co/get-more-views-on-linkedin)\n\n### 4. Inbound Connection Requests\nThe ultimate goal of commenting is to reverse the flow of outreach. Instead of you sending 100 connection requests, your public insights should prompt prospects to send requests to you. Tracking the ratio of comments left to inbound requests received is your core ROI metric.\n\n## Top Tools to Track LinkedIn Commenting Performance\n\nThe software ecosystem has rapidly adapted to support this new meta. The best tools in 2026 fall into a few distinct categories: dedicated analytics, creator suites, and AI-powered workflow engines.\n\n### 1. MyFeedIn: The Comment Consistency Tracker\n\nMyFeedIn has built its reputation by focusing heavily on the analytics that actually show what works, specifically targeting the habits of consistent creators. \n\nIts standout feature for this use case is the 12-month heatmap. Much like a GitHub contribution graph, it visually maps every comment you leave, allowing you to instantly see your streaks, gaps, and overall consistency. It completely removes the guesswork from your daily activity levels. \n\nFurthermore, MyFeedIn allows users to toggle seamlessly between views, likes, and comments. This lets you correlate periods of high commenting activity with spikes in overall profile views and engagement. If you are running an experiment\u2014for example, dedicating one week entirely to commenting on industry leaders' posts without publishing your own content\u2014this tool will clearly visualize the resulting lift in your baseline visibility. [3](https://myfeedin.co/features/linkedin-analytics)\n\n### 2. Junior: The AI-Powered Commenting Engine\n\nWhile analytics dashboards tell you what happened in the past, Junior is designed to execute and track the actual work in real-time. \n\nJunior is an AI-powered LinkedIn automation tool built specifically to start authentic conversations through strategic post commenting. Serving job seekers, sales teams, agencies, and founders, it replaces the cold DM model entirely. Instead of leaving you to manually hunt for relevant discussions, Junior finds the right posts and drafts context-aware, human-sounding replies based on your unique bio, tone, and goals.\n\nFrom a performance tracking perspective, Junior gives you direct visibility into your engagement pipeline. You can see exactly which conversations you have initiated and how your AI-assisted workflow is converting public visibility into direct interviews or client conversations. \n\nCrucially, Junior solves the safety problem that plagues legacy tools. Instead of running on a remote server that triggers LinkedIn's security algorithms, Junior runs locally on your machine. It mimics natural, human interaction patterns, ensuring your account remains completely secure while you scale your engagement. For a deeper understanding of how local execution protects your account, read our guide on [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n### 3. AuthoredUp: The Creator's Laboratory\n\nAuthoredUp started as a formatting tool for LinkedIn posts but has evolved into a robust analytics suite. It is highly regarded for its deep-dive content analysis. \n\nWhile its primary strength is analyzing your original posts, its ability to track engagement on your content\u2014including the comments happening within your own threads\u2014is exceptional. It helps you understand which topics generate the highest quality discussions. If your goal is to track how well your own comments perform when managing your community, AuthoredUp provides granular data on text readability, hook performance, and audience retention.\n\n### 4. Shield App: The Enterprise Standard\n\nFor years, Shield has been the default analytics choice for LinkedIn creators and B2B marketing teams. It offers a comprehensive dashboard that tracks post performance, engagement rates, and follower growth over time.\n\nShield is excellent for measuring the macro impact of a commenting strategy. By establishing custom date ranges and comparing them, you can clearly see how a dedicated commenting sprint impacts your overall engagement rate. While it leans heavily toward analyzing original content, the platform's custom tagging and robust reporting make it a staple for anyone treating their personal profile like a serious media asset.\n\n### 5. Buffer: For Multi-Channel Community Management\n\nBuffer is primarily known as a social media scheduling tool, but its community inbox feature is highly relevant for tracking conversational performance. \n\nWhen you scale your commenting strategy, you will inevitably start receiving replies to your comments. Tracking these secondary interactions natively inside LinkedIn's notification feed is a nightmare; alerts get buried quickly. Buffer allows you to monitor and reply to comments across multiple networks, pulling your LinkedIn interactions into a single, manageable inbox. This ensures you never miss a prospect's reply to your initial insight.\n\n![Hand-drawn matrix in a notebook comparing LinkedIn commenting tools and execution safety architectures.](https://assets.bevisible.app/inline-images/j571h3c4dpg960ns13kjcfzbt58d75mc/inline-2-1789314457564-4qog0b.png)\n## Comparing the Tool Landscape\n\nTo clarify how these solutions stack up against legacy inbox automation, here is a breakdown of where each tool fits into your workflow.\n\n| Tool | Core Focus | Best For | Execution Architecture |\n| :--- | :--- | :--- | :--- |\n| **Junior** | AI Commenting & Workflow | Generating inbound leads via context-aware replies | Local (Maximum Account Safety) |\n| **MyFeedIn** | Comment Consistency | Tracking daily habits and 12-month heatmaps | Cloud Dashboard |\n| **Shield App** | Macro Analytics | Broad creator growth and post performance | Cloud Dashboard |\n| **AuthoredUp** | Content Optimization | Analyzing formatting and hook performance | Browser Extension / Cloud |\n| **Dripify** | Cold DM Automation | Legacy connection request campaigns | Cloud Campaign Manager |\n\n## The Problem with Legacy LinkedIn Automation Tools\n\nThe instinct for many professionals is to use the tool they already have. If you are paying for Dripify, PhantomBuster, or Meet Alfred, why not just use them to handle your engagement? \n\nThe answer comes down to architectural design and the fundamental nature of the tools.\n\n### The Misalignment of Metrics\nLegacy automation tools are built on a \"send\" architecture. They measure success by how many tasks they completed: 100 profiles scraped, 50 connection requests sent, 45 follow-up messages delivered. \n\nWhen you try to apply this mindset to commenting, the results are disastrous. A tool built to blast messages will inherently blast generic comments (\"Great post!\", \"Thanks for sharing!\"). These automated, low-effort replies actually harm your brand. They signal to the prospect that you are using a bot, instantly ruining any chance of a genuine relationship. \n\n### The Safety Risk of Cloud Execution\nTraditional automation tools operate via remote cloud servers. They log into your LinkedIn account from an IP address that might be hundreds of miles away from your actual location, often executing tasks at superhuman speeds in the middle of the night. LinkedIn's security algorithms easily flag this behavior, resulting in shadowbans or permanent account restrictions.\n\nThis is why modern engagement requires a different approach. As detailed in our [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist), running automation locally on your own machine, using your own IP address and mirroring human delays, is the only sustainable way to protect your digital reputation.\n\n## A Contrarian View: Stop Tracking Individual Comment Vanity Metrics\n\nWhen people first start using analytics tools for their comments, they often fall into a predictable trap: they start treating comments like original posts. They want to see 50 likes and 10 replies on every comment they leave.\n\nHere is the truth: a comment with zero likes can generate a $50,000 contract.\n\nConsider this scenario: You are a fractional CMO targeting Series A SaaS founders. You find a post by a target founder complaining about high Customer Acquisition Costs (CAC) on paid social. You leave a detailed, three-sentence comment outlining a specific framework for reallocating budget toward organic search during a down market. \n\nNobody likes your comment. Nobody replies to it. \n\nBut the founder gets a notification. They read your comment. They realize you understand their exact pain point. They click your profile, read your featured section, and send you a direct message asking if you have time for a call next week. \n\nIf you were only tracking \"likes per comment\" on a dashboard, that interaction looks like a failure. In reality, it was a perfectly executed maneuver. \n\nThis is why you must track the *downstream* impact of your comments. The goal is not to win the comment section; the goal is to win the calendar invite. Tracking this requires bridging the gap between your LinkedIn activity and your actual pipeline. For teams executing at scale, solutions are emerging to handle this exact handoff, ensuring that once a conversation moves from a public comment to a private inbox, it syncs directly with your systems of record. [4](https://www.trykondo.com/blog/sync-linkedin-messages-crms)\n\n## Case Scenario: From 100 DMs a Day to 20 Strategic Comments\n\nLet\u2019s look at how this transition works in practice for a B2B sales team. \n\nMarcus, an account executive at a logistics software company, was running a standard Dripify campaign. He was maxing out his connection requests, sending 100 automated invites a week. His acceptance rate hovered around 15%, and his reply rate to the automated follow-ups was less than 2%. He was generating maybe one qualified meeting every two weeks, and his account was constantly flirting with LinkedIn's weekly limits.\n\nHe shifted his workflow entirely to commenting. \n\nInstead of scraping lists for a mass campaign, he used Sales Navigator to identify 50 high-priority accounts. He fed this list into his workflow. Every morning, rather than checking his DM sequence stats, he spent 30 minutes leaving context-aware, AI-assisted comments on the recent posts from decision-makers at those 50 companies. \n\nWithin three weeks, the metrics shifted drastically.\n*   **Outbound volume:** Dropped from 100 cold invites/week to 0.\n*   **Targeted comments:** 100 per week.\n*   **Profile views:** Increased by 310%.\n*   **Inbound connection requests:** 12 per week (all from his target accounts or their immediate peers).\n*   **Qualified meetings:** 4 per week.\n\nBy using the right tools to draft human-sounding replies based on his specific sales goals, and by tracking the correlation between his commenting volume and his inbound pipeline, Marcus bypassed the crowded inbox entirely. The video landscape of 2026 clearly shows this trend; professionals are actively seeking step-by-step methods to automate and scale this exact AI-assisted commenting workflow because the ROI is undeniably higher than cold outreach. [5](https://www.youtube.com/watch?v=3w46_l_bZds)\n\n## How to Evaluate Comment Tracking Software\n\nIf you are ready to move beyond legacy connection tools, you need a rigorous way to evaluate your new stack. Not all analytics and automation platforms are created equal. \n\nUse this checklist when demoing new software:\n\n### 1. Does it measure the right side of the funnel?\nIf a tool heavily promotes its ability to track \"messages sent\" or \"invites pending,\" it is built for the old era of LinkedIn. Look for dashboards that emphasize profile views, inbound engagement, and comment consistency heatmaps. \n\n### 2. How does it handle context?\nIf the tool offers AI assistance for commenting, test the output rigorously. Does it sound like a generic robot (\"Great insights, thanks for sharing!\") or does it actually parse the content of the post and reference specific details? The tool must be able to adopt your unique bio and tone. If it cannot, it will do more harm than good. \n\n### 3. What is the execution architecture?\nThis is non-negotiable. Ask the vendor explicitly: *Does this run in the cloud, or does it run locally on my machine?* If it runs in the cloud, you are putting your LinkedIn account at severe risk of restriction. Always opt for local execution that mimics natural human browsing patterns.\n\nFor a more exhaustive breakdown of what to look for, review our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n![Three-point software evaluation checklist for choosing safe LinkedIn comment tracking and workflow tools.](https://assets.bevisible.app/inline-images/j571h3c4dpg960ns13kjcfzbt58d75mc/inline-3-1789314455898-x6wa4m.png)\n## The Future of LinkedIn Visibility\n\nThe era of the \"connect and pitch\" is largely over. Buyers are too sophisticated, and the platforms are too restrictive. The professionals who will dominate LinkedIn over the next few years are those who understand how to insert themselves seamlessly into existing conversations. \n\nCommenting is the ultimate wedge. It is non-intrusive, inherently valuable, and highly visible. \n\nHowever, scaling this strategy requires treating it with the same operational rigor you used to apply to cold email or cold calling. You need to track your daily inputs, measure your profile view velocity, and use AI strategically to draft context-aware replies without sacrificing your authentic voice. \n\nBy utilizing tools like MyFeedIn for habit tracking, AuthoredUp for content analysis, and Junior for safe, locally-run AI engagement, you can build a predictable pipeline that doesn't rely on spamming strangers. You can finally stop worrying about how many messages you sent today, and start focusing on how many real conversations you started.\n\n## Frequently Asked Questions (FAQ)\n\n### Can you track impressions on your LinkedIn comments?\nYes, tracking impressions on comments is becoming a critical metric for understanding your true reach. While LinkedIn's native analytics focus heavily on original posts, specialized tools can aggregate the views and engagements your comments receive across the platform, giving you a complete picture of your visibility footprint.\n\n### Is it safe to use AI to automate LinkedIn comments?\nIt depends entirely on the architecture of the tool. Cloud-based tools that blast generic comments from remote servers are highly unsafe and frequently lead to account bans. However, using tools that run locally on your own machine to draft context-aware, human-sounding replies\u2014and executing them with natural human delays\u2014is safe and highly effective.\n\n### How do I improve the performance of my comments?\nStop trying to simply agree with the original poster. The best-performing comments add a new dimension to the conversation. Offer a contrarian viewpoint, provide a specific example from your own experience, or ask a high-level follow-up question. The goal is to make the original poster, and everyone reading the thread, want to click your profile to learn more about you.", "created_at": "2026-09-13T15:49:31.890091+00:00", "updated_at": "2026-09-13T15:49:31.890096+00:00"};
    </script>

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
