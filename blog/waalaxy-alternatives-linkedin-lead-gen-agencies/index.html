    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 100, "slug": "waalaxy-alternatives-linkedin-lead-gen-agencies", "title": "Waalaxy Alternatives for Linkedin Tools for Lead Gen Agencies", "excerpt": "Discover top Waalaxy alternatives for lead gen agencies. Compare engagement-first tools, account safety, extraction software, and modern outbound stacks.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57e5xq6d20tq5av0fy58v0e0h8d65fq/waalaxy-alternatives-for-linkedin-tools-for-lead-g-1789141723555-i2mezz.png", "published_at": "2026-09-11T15:26:00+00:00", "content": "# Waalaxy Alternatives for Linkedin Tools for Lead Gen Agencies\n\nThe era of spray-and-pray LinkedIn outreach is quietly closing out. If you run a lead generation agency, you have likely noticed the shift. A few years ago, you could load a client\u2019s account into a cloud-based automation platform, blast 100 connection requests a day with a generic pitch, and reliably book three to five meetings a week. Today, that same strategy results in single-digit acceptance rates, annoyed prospects, and the constant, looming threat of your client\u2019s account being restricted.\n\nWaalaxy has long been a staple in the agency toolkit. It gained popularity for its user-friendly interface, multi-channel capabilities (combining LinkedIn and email), and relatively low barrier to entry. However, as LinkedIn tightens its platform security and buyers become entirely desensitized to automated direct messages, agencies are actively seeking Waalaxy alternatives. \n\nLead generation agencies now require tools that prioritize account safety, enable white-labeling, and facilitate authentic, context-driven interactions rather than generic spam. This guide breaks down the best LinkedIn tools and Waalaxy alternatives designed specifically for the complex needs of modern lead generation agencies.\n\n## Why Lead Gen Agencies Are Outgrowing Waalaxy\n\nWaalaxy built its reputation on making cold outreach accessible. But accessibility is a double-edged sword. When a tactic becomes universally accessible, the channel becomes saturated. For agencies managing multiple high-ticket clients, relying on saturated tactics is a fast track to client churn.\n\nHere is why forward-thinking agencies are restructuring their tech stacks:\n\n### 1. The Decline of the Cold DM\nBuyers can spot an automated sequence from the first line of a message. The standard \"I saw we share mutual connections and I'm impressed by your background\" template is universally ignored. Waalaxy is fundamentally an outbound messaging engine. While you can personalize variables like `{{first_name}}` or `{{company}}`, the structural DNA of the outreach remains automated and obvious. Agencies need tools that break the mold of predictable DMs and engage prospects where their guard is down.\n\n### 2. Cloud IP Risks and Client Account Safety\nWhen an agency takes over a client\u2019s LinkedIn profile, account safety is the primary fiduciary duty. If a founder hands you their profile and you get them banned, you lose the contract instantly. Many traditional automation tools operate on cloud servers. If multiple accounts are firing off hundreds of actions from data center IPs that LinkedIn can easily flag, the risk profile skyrockets. \n\n### 3. The Need for Complex Agency Infrastructure\nAgencies don't just need a tool; they need infrastructure. Managing 20, 50, or 100 client accounts requires granular roles, unified billing, distinct workspaces, and white-labeled reporting dashboards. While Waalaxy has team features, many agencies find they outgrow its architectural limits when trying to scale complex, multi-tenant operations securely. \n\n![Diagram comparing cloud automation risks against safe local agency infrastructure on LinkedIn.](https://assets.bevisible.app/inline-images/j57e5xq6d20tq5av0fy58v0e0h8d65fq/inline-1-1789141671498-lg3odm.png)\n## The Shift to Engagement-First Lead Generation\n\nBefore evaluating specific tools, we must address the strategic pivot happening in B2B lead generation. The traditional model was linear: scrape a list, send a connection request, send a pitch. \n\nThe new model is non-linear and engagement-focused. Instead of pushing a message into a crowded inbox, agencies are realizing the power of public visibility. By having clients consistently comment on relevant industry discussions, they build micro-authority. When a prospect sees a thoughtful, highly contextual comment on a post they care about, the subsequent connection request isn't cold\u2014it's warm. \n\nThis is where the distinction between traditional automation and AI-assisted engagement becomes critical. If you want to understand how to execute this safely, reviewing [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) provides a strong foundational framework.\n\nLet\u2019s look at the best Waalaxy alternatives categorized by their strategic function: authentic engagement, advanced data extraction, and agency-grade campaign management.\n\n## Category 1: Best Alternatives for Authentic Engagement\n\nIf your agency's goal is to bypass crowded inboxes and turn public visibility into direct interviews, pipeline, and client conversations, you need tools built for engagement rather than just messaging.\n\n### Junior: The Premium Choice for Authentic Conversations\nJunior is an AI-powered LinkedIn automation tool fundamentally designed to start authentic conversations through strategic post commenting rather than generic spam. It is built for job seekers, sales teams, agencies, and founders who want to leverage LinkedIn's organic reach without spending hours manually reading and typing.\n\nFor a lead generation agency, Junior solves the precise problem created by tools like Waalaxy: it replaces the cold DM. \n\n**How Junior Works for Agencies:**\nInstead of blasting connection requests, Junior finds relevant discussions happening in your client\u2019s specific niche. It then drafts context-aware, human-sounding replies based on the user's unique bio and specific goals. Because the AI understands the client's background, the comments do not sound like generic bot replies (\"Great post!\"). They add actual value to the conversation.\n\n**The Local Execution Advantage:**\nUnlike cloud-based connection tools that ping LinkedIn from remote servers, Junior runs locally on the user's machine. It uses natural interaction patterns\u2014scrolling, pausing, and typing like a human\u2014which protects account safety. For agencies terrified of getting a client's account restricted, this local execution is a massive upgrade over traditional cloud risks.\n\nWhen deciding between traditional outbound tools and modern engagement tools, comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging) highlights why commenting often yields higher quality pipeline than cold pitching.\n\n**Best for:** Agencies that want to build a high-ticket \"Visibility as a Service\" offering, replacing ignored cold outreach with strategic, localized comment engagement. \n\n### Taplio: The Cloud-Based Content Engine\nTaplio is often mentioned in the same breath as engagement tools, though its primary focus leans heavily toward content scheduling and personal brand building. It includes a unified inbox and features for commenting on other creators' posts.\n\nWhile Taplio is excellent for scheduling a month of client posts in one sitting, its commenting features operate from the cloud and often rely on broad AI prompts that require significant manual editing to avoid sounding robotic. \n\n**The Trade-off:**\nTaplio provides great analytics and scheduling, but it doesn't offer the deep, context-aware conversational AI or the local-machine safety profile of Junior. If you are comparing the two for client growth, looking closely at [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) will help clarify which technical architecture fits your agency's risk tolerance.\n\n## Category 2: Best Alternatives for Data Extraction and Prospecting\n\nBefore you can engage or message anyone, you need accurate data. Waalaxy has built-in scraping capabilities, but agencies often need more rigorous data extraction that can plug into external CRMs or highly customized omnichannel campaigns.\n\n### LinkedIn Sales Navigator\nIt goes without saying, but it must be explicitly stated: LinkedIn Sales Navigator is the bedrock of agency lead generation. When community discussions focus on building the best tech stack, users consistently point out that signing up for LinkedIn Sales Navigator is step one, as it possesses the highest data accuracy available [https://www.reddit.com/r/Entrepreneur/comments/14pg0k9/best_lead_generation_tools/](https://www.reddit.com/r/Entrepreneur/comments/14pg0k9/best_lead_generation_tools/).\n\nSales Navigator allows agencies to build hyper-specific lists using Boolean searches, company headcount filters, and recent activity alerts. While not an automation tool itself, it is the fuel required for any Waalaxy alternative to function at an elite level.\n\n### PhantomBuster\nPhantomBuster is a completely different beast than Waalaxy. It is less of an all-in-one campaign manager and more of an API-driven extraction and automation engine. It is frequently cited as one of the best tools for data extraction, code-free automation, and cross-platform flexibility [https://www.heyreach.io/blog/best-linkedin-automation-tools](https://www.heyreach.io/blog/best-linkedin-automation-tools).\n\n**How Agencies Use PhantomBuster:**\nAn agency might use a \"Phantom\" to scrape the list of attendees from a specific LinkedIn event. They extract that data into a CSV, enrich it with a third-party email finder, and then push that data into a cold email tool. PhantomBuster excels at moving data from point A to point B.\n\n**The Agency Verdict:** \nIt is highly technical and requires a strong understanding of web scraping limits. It operates in the cloud, so you must carefully manage session cookies and rate limits to avoid account restrictions. If you are deeply technical and your primary goal is data extraction rather than direct engagement, it is a powerhouse. However, if your goal is safe engagement, you might want to explore [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n![Workflow diagram showing data extraction from Sales Navigator feeding into contextual engagement tools.](https://assets.bevisible.app/inline-images/j57e5xq6d20tq5av0fy58v0e0h8d65fq/inline-2-1789141672357-56m5nn.png)\n## Category 3: Best Alternatives for Traditional Drip Campaigns\n\nIf your agency is strictly committed to the outbound messaging model and simply needs a more robust, agency-friendly alternative to Waalaxy, these platforms lead the market.\n\n### Expandi.io\nExpandi is widely regarded as one of the most agency-friendly cloud automation tools available. Built specifically with B2B lead generation agencies in mind, it addresses the exact pain points Waalaxy leaves unresolved.\n\n**The Agency Value Proposition:**\nExpandi offers true white-labeling. You can rebrand the entire interface, host it on your own agency's domain, and present it to clients as your proprietary software. This immediately elevates the perceived value of your service. \n\nFurthermore, Expandi focuses heavily on safety within the cloud model. It uses dedicated, localized IP addresses for each account and enforces strict daily limits that randomize actions to mimic human behavior. It allows for complex sequences (e.g., if the prospect likes a post, send message A; if they do not, send InMail B).\n\n### Dripify\nDripify is another direct competitor to Waalaxy in the traditional outreach space. It is known for its highly visual, drag-and-drop campaign builder. \n\n**Why Agencies Choose Dripify:**\nThe team management features are excellent. An agency owner can assign a dedicated account manager to oversee specific client profiles, monitor overall performance from a master dashboard, and step in if a campaign\u2019s conversion rate drops. \n\nDripify operates in the cloud and does a reasonable job of managing safety by automatically adjusting activity limits based on a profile's historical behavior. However, it still fundamentally relies on the \"Connect + Pitch\" model. \n\n### Saleshandy\nWhile often categorized purely as a cold email tool, Saleshandy represents the broader category of B2B lead generation platforms that are moving toward multi-channel sequencing [https://www.saleshandy.com/blog/lead-generation-software/](https://www.saleshandy.com/blog/lead-generation-software/). \n\nIf your agency is finding that LinkedIn DMs alone are failing to convert, integrating a tool like Saleshandy allows you to combine LinkedIn data extraction with highly deliverable cold email infrastructure. Agencies often use Sales Navigator to build the list, PhantomBuster to scrape the list, and Saleshandy to execute the outbound email sequence. \n\n## The Core Problem with Cloud-Based Automation\n\nAs you evaluate these Waalaxy alternatives, you will notice a dividing line: tools that run in the cloud versus tools that run locally. It is essential to understand the technical and operational differences.\n\nWhen you use a cloud-based automation tool, you are handing your client\u2019s session cookie to a remote server. That server then makes requests to LinkedIn\u2019s servers on behalf of your client. \n\nLinkedIn's security algorithms are highly sophisticated. They look for anomalies. If a client usually logs in from a residential IP in Chicago, but suddenly their account is executing hundreds of actions at 3:00 AM from an AWS data center IP in Virginia, a red flag is raised. Even with \"dedicated proxy IPs,\" cloud tools struggle to replicate the exact digital fingerprint of a human using a web browser.\n\nThis is why tools that rely heavily on cloud infrastructure continually play a cat-and-mouse game with LinkedIn security updates. \n\n### The Local Execution Advantage\nLocal execution fundamentally changes this dynamic. When a tool like Junior operates, it runs directly on the user\u2019s actual machine. It utilizes the client's existing Chrome browser, their existing residential or office IP address, and their actual logged-in session. \n\nTo LinkedIn's security algorithms, local execution looks exactly like a human being sitting at a desk, scrolling through a feed, pausing to read, and typing out a response. There are no sudden IP jumps. There are no API anomalies. By focusing on quality over quantity and utilizing the machine's native environment, local tools drastically reduce the risk of account suspension. \n\nIf you are auditing tools specifically for this reason, reviewing an [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) can help you ask vendors the right technical questions before onboarding your clients.\n\n## Evaluating Features: A Checklist for Agencies\n\nWhen migrating away from Waalaxy, lead gen agencies must look beyond the marketing copy. You are not just buying software; you are buying the operational backbone of your business. Use this checklist to evaluate alternatives:\n\n*   **Safety Architecture:** Does the tool use cloud servers, proxies, or local machine execution? How does it handle rate limits? Does it force random delays between actions?\n*   **Agency Infrastructure:** Can you manage billing for 50 clients from one dashboard? Can you assign specific seats to specific account managers without sharing login credentials?\n*   **White-Labeling:** Can you put your agency's logo on the dashboard and host the reporting on your custom domain?\n*   **AI Sophistication:** If the tool uses AI for messaging or commenting, is it relying on generic ChatGPT prompts, or does it ingest the client's unique bio, tone, and strategic goals to generate context-aware copy? (For more on AI commenting specifically, see [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow)).\n*   **Integration Capabilities:** Does the tool have native integrations or webhooks to push engaged leads directly into your client's CRM (HubSpot, Salesforce, Pipedrive)?\n\n![Checklist notepad on a desk showing key evaluation criteria for LinkedIn agency software.](https://assets.bevisible.app/inline-images/j57e5xq6d20tq5av0fy58v0e0h8d65fq/inline-3-1789141666233-v50d07.png)\n## The Case Study: Pivoting from Volume to Value\n\nConsider a typical scenario faced by many mid-sized lead generation agencies. Let's look at an agency that onboarded 15 new B2B SaaS clients in a single quarter. \n\n**The Old Way (The Waalaxy Model):**\nThe agency set up 15 cloud-based Waalaxy campaigns. They targeted 100 connection requests per day per client. For the first two weeks, it looked like a success. Hundreds of requests went out. But by week three, the reality set in. \n1. Acceptance rates hovered at 12%. \n2. Reply rates were under 2%.\n3. Two client accounts received temporary warnings from LinkedIn for excessive activity. \n4. The leads that did book meetings were annoyed by the aggressive follow-ups, resulting in a high no-show rate.\nClients began questioning the ROI of the agency's retainer.\n\n**The Pivot (The Engagement Model):**\nThe agency paused the volume outbound campaigns. They transitioned their tech stack. They used Sales Navigator to build highly targeted lists of decision-makers. But instead of sending automated pitches, they deployed Junior locally on their clients' machines (or had clients run it securely). \n\nThe strategy shifted:\n*   Identify 20 high-value target accounts per week.\n*   Find posts made by the founders or VPs at those accounts.\n*   Use Junior's context-aware AI to draft thoughtful, industry-specific comments on those posts.\n*   Engage genuinely in the public feed.\n\n**The Result:**\nThe sheer volume of activity dropped by 80%. But the *visibility* skyrocketed. The prospects saw the thoughtful comments, checked the client's profile, and sent inbound connection requests. When the agency eventually initiated direct messages, they referenced the public conversation. The meeting booking rate doubled because the trust was already established, and the account safety alerts disappeared entirely.\n\nThis scenario is playing out across the industry. Selecting the right B2B lead generation tools requires understanding this shift from interruption to engagement [https://konsyg.com/top-10-b2b-lead-generation-tools-and-platforms-in-the-us-for-2026/](https://konsyg.com/top-10-b2b-lead-generation-tools-and-platforms-in-the-us-for-2026/).\n\n## The Myth of \"More Volume = More Meetings\"\n\nOne of the hardest habits for agency owners to break is the addiction to vanity metrics. When a client asks for a weekly report, it feels good to say, \"We sent 500 connection requests and 1,000 follow-up messages on your behalf this week.\" It feels productive.\n\nBut sophisticated B2B buyers\u2014the ones writing the large checks your clients want\u2014do not buy based on automated volume. They buy based on trust, authority, and timing. \n\nSending 1,000 generic messages does not create trust. It actually erodes the client's brand equity. It signals that the client views the prospect as a number on a list. \n\nConversely, leaving 50 highly intelligent, context-aware comments on posts authored by key decision-makers builds massive authority. It proves that the client understands the industry, has valuable insights, and takes the time to engage thoughtfully. \n\nWhen evaluating Waalaxy alternatives, you must ask yourself what you are actually selling to your clients. Are you selling them activity metrics, or are you selling them a pipeline built on actual relationships? If it is the latter, your tool stack must support quality interactions over sheer volume. Finding platforms designed for outreach effectiveness rather than just volume is critical [https://botdog.co/blog-posts/best-lead-generation-software-tools](https://botdog.co/blog-posts/best-lead-generation-software-tools).\n\n## Building Your 2026 Agency Tech Stack\n\nIf you are replacing Waalaxy today, do not replace it with a clone. Build a stack that protects your agency from future algorithm changes and buyer fatigue. \n\nA modern, future-proof agency stack looks like this:\n\n1.  **The Data Layer:** LinkedIn Sales Navigator for unparalleled accuracy and Boolean search capabilities.\n2.  **The Extraction Layer:** (Optional but powerful) PhantomBuster to pull lists of event attendees or group members into a manageable format.\n3.  **The Engagement Layer:** Junior running locally to drive authentic, AI-assisted commenting. This builds the initial visibility and warms up the accounts without triggering spam filters.\n4.  **The Multi-Channel Layer:** (Optional) A tool like Saleshandy to execute highly targeted email outreach once a prospect has been warmed up via LinkedIn engagement.\n\nBy separating these functions, you avoid single points of failure. If LinkedIn changes its direct messaging limits again, your engagement layer (Junior) continues to drive inbound interest unaffected. If you need tools to source the best content to engage with, reading up on the [Best Tools to Find Relevant Linkedin Posts to Comment On Tools Beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio) will round out your operational strategy.\n\n## Frequently Asked Questions (FAQs)\n\n### What is the safest LinkedIn automation method for managing multiple agency clients?\nThe safest method is to avoid cloud-based connection volume entirely. Tools that run locally on the client's machine (or a dedicated local setup) and utilize the client's native browser session carry the lowest risk. Furthermore, shifting the automation away from direct messaging and toward strategic feed engagement (commenting) drastically reduces the likelihood of a prospect reporting the account as spam. \n\n### Can I effectively white-label an engagement tool?\nWhile traditional outbound tools like Expandi offer comprehensive dashboard white-labeling, the engagement model operates differently. Because tools like Junior focus on the client's unique bio and operate locally to ensure safety, the \"white-labeling\" comes from the results. You sell the service as your agency's proprietary growth methodology\u2014managing their visibility, refining their AI persona, and curating the lists they engage with.\n\n### Does commenting generate as many leads as direct messaging?\nIt generates higher *quality* leads with a drastically higher close rate. Direct messaging has a massive volume advantage, but a minuscule conversion rate. Commenting has lower total volume, but it drives inbound profile views from highly relevant prospects. When a prospect views a profile after reading a smart comment, they are already pre-qualified and interested, making the subsequent conversation significantly easier to convert into a booked meeting.\n\n### How do I transition an existing client from Waalaxy to an engagement model?\nTransition slowly. Do not turn off their outbound campaigns overnight. Begin by introducing an engagement tool alongside their current strategy. Dedicate 15 minutes a day to using AI-assisted commenting on their target accounts. Within a month, compare the meeting booking rates and the tone of the prospect replies between the two methods. The data will make the case for you, allowing you to gracefully deprecate the risky cloud campaigns.\n\n## Final Thoughts for Agency Owners\n\nYour tool stack dictates your strategy, and your strategy dictates your client retention. Continuing to rely on high-volume, generic direct messaging platforms is a race to the bottom. Clients are becoming less tolerant of getting banned, and prospects are completely blind to the automated pitch.\n\nReplacing Waalaxy is an opportunity to upgrade your agency's entire philosophy. By moving toward tools that prioritize local safety, natural interaction patterns, and authentic conversations\u2014like leveraging Junior for strategic commenting\u2014you position your agency not as a spam vendor, but as a genuine growth partner. You stop fighting the algorithm and start leveraging it, turning public visibility into a predictable, high-converting pipeline for your clients.", "created_at": "2026-09-11T15:49:27.160777+00:00", "updated_at": "2026-09-11T15:49:27.160784+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
