    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 140, "slug": "how-junior-protects-linkedin-account-2", "title": "Junior for How Does Junior Protect My Linkedin Account", "excerpt": "Discover how Junior protects your LinkedIn account using local execution, human pacing, and smart commenting while avoiding risky cloud automation bans.", "featured_image_url": "https://assets.bevisible.app/featured-images/j574htwh3e6w2bsd84gz79ffkx8f6cta/junior-for-how-does-junior-protect-my-linkedin-acc-1792513099405-67mky9.png", "published_at": "2026-10-23T16:12:00+00:00", "content": "# Junior for How Does Junior Protect My Linkedin Account\n\nMost professionals treat their LinkedIn account like a digital passport. It contains your entire professional network, your pipeline of potential clients, a decade of endorsements, and your direct line to future employers. Losing access to this asset isn't just an inconvenience; it is a critical business continuity failure. When users start looking for ways to scale their visibility, the immediate fear is that leveraging any sort of software will trigger an account restriction.\n\nThe anxiety is justified. For years, the default approach to scaling outreach involved reckless cloud-based bots that treated LinkedIn like an email list, resulting in mass account bans. \n\nUnderstanding how your account stays secure requires looking at two distinct layers of protection: operational security (how the software interacts with the platform) and credential security (how you protect your login from external cyber threats). This guide breaks down exactly how Junior's unique architecture protects your account from behavioral flags, while also outlining the mandatory credential security practices every user must implement.\n\n## The Operational Security Threat: Why Traditional Automation Fails\n\nTo understand how a secure system works, you first need to understand why legacy systems fail. LinkedIn employs sophisticated anti-abuse algorithms designed to detect non-human behavior. When an account is flagged or restricted for automation, it is rarely a manual decision; it is the result of a system triggering multiple automated tripwires.\n\n### The Cloud-Based IP Problem\nTraditional automation tools operate from cloud servers. You give the software your login credentials, and a server in an Amazon Web Services (AWS) or DigitalOcean datacenter logs into your account. \n\nLinkedIn's security systems easily detect this. If you are browsing LinkedIn on your phone from a residential IP address in Chicago, and simultaneously a datacenter IP in Virginia is firing off fifty connection requests on your behalf, the platform registers an impossible travel scenario and a commercial IP footprint. This immediately flags the account as compromised or utilizing unauthorized third-party software.\n\n### Headless Browsers and Fingerprinting\nBeyond just IP addresses, platforms look at browser fingerprints. When a human opens Google Chrome, the browser renders fonts, executes JavaScript at a certain speed, and interacts with the device's graphics card. Many legacy bots use \"headless\" browsers\u2014scripts that interact with the web without a visual interface. LinkedIn's security scripts check for these missing hardware signatures. If the browser behaves like a script rather than a human interface, the account is flagged.\n\n### The Mass DM Trap\nHistorically, automation tools focused on the inbox. They scraped lists of thousands of users and unleashed automated Direct Messages. The platform monitors the volume and velocity of outbound messages closely. Sending identical or slightly spun messages to 100 people who are outside your immediate network in a matter of minutes is physically impossible for a human. It creates a spam footprint that not only risks your account but actively damages your professional reputation. \n\n## How Junior's Architecture Defends Your Account\n\nJunior was engineered specifically to solve the catastrophic safety flaws of legacy outreach tools. Instead of relying on risky cloud proxies or brute-force messaging, it operates on a fundamentally different paradigm.\n\n### Local Execution: Your IP, Your Hardware\nThe most critical way Junior protects your LinkedIn account is through local execution. Junior is not a cloud-based web application that logs in from a remote server. It runs locally on your own machine. \n\nWhen Junior interacts with LinkedIn, it uses your device's actual IP address, your actual operating system, and your actual network connection. To LinkedIn's security infrastructure, the connection looks exactly like you sitting at your desk\u2014because that is exactly what it is. There are no sudden location jumps, no datacenter IPs, and no mismatched hardware fingerprints. By tying the software to your local environment, Junior bypasses the primary tripwire that catches 90% of traditional bots.\n\n![Diagram comparing cloud automation datacenter risks with Junior's safe local desktop execution](https://assets.bevisible.app/inline-images/j574htwh3e6w2bsd84gz79ffkx8f6cta/inline-1-1792513054745-7jiu72.png)\n### Behavioral Safety Through Contextual Commenting\nRather than playing the dangerous game of mass cold DMs, Junior shifts the focus to public visibility through strategic commenting. \n\nLinkedIn's algorithms actually reward engagement. The platform wants users to interact with posts, leave thoughtful comments, and keep discussions active. While the system heavily throttles unsolicited DMs to protect user inboxes, it encourages public interaction. By using Junior to find relevant discussions and draft context-aware replies, you are operating entirely within the behavior the platform wants to see. \n\nBecause Junior generates human-sounding replies based on your unique bio, the comments do not look like generic bot spam. You can read more about how this works in our guide on the [best AI LinkedIn tools for writing authentic comments](https://www.heyjunior.ai/blog/best-ai-linkedin-tools-authentic-comments). This strategic shift from private spam to public value is a massive layer of account protection.\n\n### Human-Mimicking Pacing and Throttling\nEven local execution isn't enough if a tool operates at machine speed. If you leave 500 comments in ten minutes, your account will be restricted regardless of where the software is running.\n\nJunior uses natural interaction patterns. It introduces randomized delays, mimics the time it takes a human to read a post, and spaces out actions realistically throughout your working session. It does not operate in massive bursts. This pacing ensures that your velocity of action never exceeds what a highly active, focused human professional could achieve natively.\n\n| Security Vector | Legacy Cloud Automation | Junior Local Architecture |\n| :--- | :--- | :--- |\n| **Execution Environment** | Remote Datacenter / Virtual Private Server | Local Machine / Native Desktop |\n| **IP Footprint** | Commercial Cloud IP (High Risk) | Residential / Corporate ISP (Safe) |\n| **Primary Action** | Mass Unsolicited Direct Messaging | Context-Aware Public Commenting |\n| **Action Velocity** | Instantaneous batch processing | Randomized, human-mimicking delays |\n| **Authentication** | Often requires storing passwords remotely | Uses secure, localized session data |\n\n## Credential Security: The User's Responsibility\n\nWhile Junior\u2019s architecture protects your account from behavioral flags, operational security is only half the battle. The other half is credential security. A localized tool cannot protect you if a malicious actor guesses your password and logs in from overseas. \n\nStandard security practices are mandatory. If your account is compromised by an external hacker, LinkedIn will lock it down to protect your data, disrupting your networking efforts regardless of what tools you use. Following fundamental cybersecurity hygiene ensures that your account remains accessible solely to you.\n\n### Enforcing Two-Factor Authentication (2FA)\nThe single most important step you can take to protect your LinkedIn account is enabling two-step verification. Even if a threat actor obtains your password through a data breach on another website, they cannot access your LinkedIn account without the second factor. \n\nYou should enable 2FA immediately through LinkedIn's settings. While SMS-based authentication is better than nothing, utilizing an authenticator app (like Google Authenticator, Authy, or Microsoft Authenticator) provides a much stronger layer of security against SIM-swapping attacks. As security experts on Reddit frequently advise, \"Enable 2FA if you haven't already (preferably using an authenticator app, not SMS).\" [4]\n\n### Implementing Strong, Unique Passphrases\nReusing passwords across different platforms is a massive vulnerability. If a minor forum you joined five years ago suffers a data breach, hackers will run those emails and passwords against LinkedIn, banking portals, and email providers. \n\nYour LinkedIn password must be entirely unique. LinkedIn's official guidance stresses this: \"Use a strong password. The password should be unique to each account. The password should be a mix of letters, numbers, and special characters.\" [2] \n\nInstead of trying to memorize a random string of characters, consider using a long passphrase (e.g., four random words strung together) which is statistically harder for a computer to brute-force but easier for a human to remember. Furthermore, utilizing a reputable password manager allows you to generate and store incredibly complex credentials safely. As highlighted in community discussions on cyber threats, using passphrases with spaces provides a strong defense against unauthorized access. [1]\n\n![Handwritten security checklist notebook detailing 2FA and passphrase best practices for LinkedIn](https://assets.bevisible.app/inline-images/j574htwh3e6w2bsd84gz79ffkx8f6cta/inline-2-1792513055909-zr1zop.png)\n### Managing Session Data and Device Logins\nOver time, you likely log into LinkedIn on multiple devices: your work laptop, your personal phone, a tablet, and perhaps a previous employer's machine. Leaving active sessions open on devices you no longer control is a major security risk.\n\nPeriodically audit your active sessions. Navigate to your LinkedIn security settings and review where your account is currently logged in. If you see any unrecognized devices, outdated phones, or strange locations, terminate the session immediately. Best practice dictates that if you suspect any odd behavior, you should \"Log out of ALL devices through LinkedIn settings.\" [4] This immediately revokes access from any potential bad actors who may have hijacked a session cookie.\n\n### Auditing Third-Party App Permissions\nMany users grant access to various third-party applications over the years\u2014calendar integrators, resume builders, and old CRM connections. Each of these connections holds a token that allows them varying degrees of access to your account data. \n\nRegularly check which third-party applications have access to your account and revoke permissions for any tools that are unused, outdated, or suspicious. Maintaining strict control over what software interfaces with your profile is a core component of keeping your account secure and protecting yourself from account hijacking. [5] \n\n### Reporting Suspicious Activity Promptly\nAccount security is a community effort. If you receive phishing messages, suspicious links in your DMs, or notice unauthorized changes to your profile (such as your headline changing or posts being published without your consent), you must take immediate action. \n\nReport any malicious messages to LinkedIn's trust and safety team using their official reporting tools. Security professionals constantly remind users of the importance of vigilance: \"I've already reported this to LinkedIn, but I'd really appreciate your help in keeping our community safe.\" [3] The faster you flag suspicious activity, the faster LinkedIn can lock down the compromised accounts of others, preventing the spread of phishing links.\n\n## Myth vs. Reality: LinkedIn Automation and Account Safety\n\nThe market is full of conflicting information regarding AI and LinkedIn. Let's address the most pervasive myths and clarify the reality of how platforms treat automated assistance.\n\n### Myth: LinkedIn Bans All AI Usage\nThere is a persistent myth that the mere presence of AI will trigger an immediate, permanent ban. This is factually incorrect. LinkedIn itself is integrating AI into its platform, offering AI-assisted profile rewrites and message drafting for premium users. The platform does not hate AI; it hates spam, inauthenticity, and server-strain.\n\nThe reality is that LinkedIn penalizes low-effort, high-volume automation that degrades the user experience. If your AI tool generates identical \"Great post, thanks for sharing!\" comments on 300 posts an hour, you will be penalized. If you use AI locally to draft highly relevant, contextual insights that you review and post at a normal pace, you are completely safe. Internal link: [Best AI tools for LinkedIn commenting and authentic networking](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting).\n\n### Myth: \"Warming Up\" a Cloud Account Makes It Safe\nMany legacy cloud automation vendors sell \"warm-up\" features, promising that if the bot starts by sending only 5 messages a day and slowly ramps up to 100, the account will be safe. \n\nThis fundamentally misunderstands how modern security infrastructure works. While warming up prevents immediate velocity-based bans, it does absolutely nothing to hide the fact that a commercial datacenter IP in another state is accessing your account via a headless browser. The footprint is still there, and the moment a user reports your automated DM as spam, a manual or algorithmic review will spot the cloud infrastructure and restrict the account. Junior's local execution renders the concept of \"cloud warm-up\" irrelevant, as the traffic originates from your trusted home or office network from day one.\n\n## A Scenario: How a Sales Team Safely Scales Visibility\n\nConsider the difference in risk profile for a B2B sales team trying to generate pipeline. \n\n**The Old Way (High Risk):** \nThe sales director purchases a cloud-based LinkedIn automation tool. They load in the credentials for five account executives. The tool scrapes Sales Navigator and starts firing off 75 identical cold DMs per rep, per day. Within two weeks, three of the reps receive warning messages from LinkedIn about unauthorized software. One rep has their account temporarily restricted. The team is forced to halt all activity, deal with identity verification to recover the accounts, and their pipeline grinds to a halt. Furthermore, the prospects who did receive the messages largely ignored them, recognizing the obvious bot-like language.\n\n**The Junior Way (Secure and Authentic):**\nThe same sales director equips the team with Junior. Because Junior runs locally on each rep's machine, there are no IP mismatches or cloud logins triggering security alerts. Instead of spamming inboxes, the reps use Junior to find posts from their target accounts and industry leaders. \n\nJunior drafts highly contextual, human-sounding replies based on the specific content of the posts and the individual rep's expertise. The reps review the comments and post them seamlessly. They are leaving 15-20 high-value comments a day natively through their own browsers. Their profiles gain massive visibility from the second and third-degree networks reading those comment sections. They receive inbound connection requests from interested prospects. Their accounts are completely secure because their behavior matches that of a highly engaged, legitimate user. For more on this workflow, see our guide on [how to use AI commenting to network on LinkedIn during a job search](https://www.heyjunior.ai/blog/ai-commenting-linkedin-job-search).\n\n## Adapting to Future Platform Updates\n\nSocial media algorithms and security protocols are not static. LinkedIn routinely updates its Web Application Firewalls, alters its rate limits, and adjusts how it weighs user interactions. A common concern is how a tool can protect an account against rules that haven't been written yet.\n\nThe answer lies in the philosophy of the software design. Tools that rely on exploiting loopholes, bypassing inbox filters, or faking hardware signatures are always one update away from obsolescence. It is a cat-and-mouse game that the platform ultimately wins.\n\nJunior is designed to align with the platform's core goals, not subvert them. Because Junior operates locally and focuses on generating authentic public engagement, it operates in the safest possible lane. If LinkedIn reduces the number of DMs a user can send in a day (as they have done repeatedly in recent years), Junior users are unaffected because their strategy is based on commenting. If LinkedIn cracks down harder on commercial IP logins, Junior users are unaffected because they are running locally. By mimicking human pacing and contributing actual value to the feed, the tool naturally insulates the user against future algorithmic crackdowns aimed at spammers.\n\n## Frequently Asked Questions (FAQ)\n\n### Does Junior require or store my LinkedIn password?\nNo. Because Junior operates locally on your machine, it does not need to extract your password and send it to a remote database. It works within your active local session. This severely limits your exposure to data breaches compared to traditional cloud tools that require you to hand over your credentials. \n\n### Can I run Junior while actively browsing LinkedIn on my phone?\nYes. Because Junior runs on your local machine using your native network, accessing your account from your phone on the same WiFi network, or even your cellular data, looks completely normal to LinkedIn. This is a massive advantage over cloud bots, where simultaneous logins from different states often trigger instant security lockouts.\n\n### What happens if I travel? Will using Junior trigger an alert?\nIf you travel, your laptop travels with you. When you connect to hotel WiFi or a new location, your actual location changes. When you use Junior in that new location, the IP address matches your physical reality. Since you aren't leaving an automated cloud bot running back in your home state, there is no \"impossible travel\" flag generated. Just ensure you practice safe browsing on public networks.\n\n### How does Junior ensure the comments don't sound like AI?\nAccount safety isn't just technical; it's reputational. If people think you are a bot, they will report you. Junior avoids generic \"ChatGPT speak\" by incorporating your unique bio, goals, and tone into the prompt architecture. It reads the context of the specific post and drafts a response that adds real insight. You always have the final say and can tweak the output before posting. Internal link: [How to write better LinkedIn comments using AI without sounding automated](https://www.heyjunior.ai/blog/write-better-linkedin-comments-ai).\n\n### Should I still use a VPN?\nUsing a reputable VPN is a solid personal security practice, particularly on public networks. Because Junior runs locally, it will simply route its traffic through your VPN just like the rest of your web browsing. As long as your VPN provides a stable, consistent IP address during your session, it will not interfere with Junior\u2019s operation or your account safety.\n\n## Maintaining the Highest Standard of Account Safety\n\nProtecting your LinkedIn account requires a holistic approach. It is not enough to simply avoid the worst cloud-based spambots; you must actively manage both your software choices and your credential hygiene. \n\nBy combining Junior's local-first, behaviorally safe architecture with strict personal security habits\u2014enforcing two-factor authentication, using strong unique passphrases, auditing your active sessions, and avoiding mass cold outreach\u2014you create an incredibly robust defense. \n\nThe era of reckless automation is over. The professionals who will successfully scale their presence on LinkedIn are the ones who prioritize authentic, contextual interactions delivered through secure, local environments. Guard your account credentials diligently, step away from the automated inbox spam, and focus your efforts on strategic, visible conversations.", "created_at": "2026-10-23T16:19:22.664447+00:00", "updated_at": "2026-10-23T16:19:22.664453+00:00"};
    </script>

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
