    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 113, "slug": "phantombuster-alternatives-automate-social-selling-linkedin", "title": "Phantombuster Alternatives for Automate Social Selling On Linkedin", "excerpt": "Explore modern Phantombuster alternatives to automate LinkedIn social selling safely using AI-powered public engagement and secure local execution.", "featured_image_url": "https://assets.bevisible.app/featured-images/j578qcjc7aee2tz95ptenhcj9n8d619x/phantombuster-alternatives-for-automate-social-sel-1790351311657-ru6fs6.png", "published_at": "2026-09-25T15:39:00+00:00", "content": "# Phantombuster Alternatives for Automate Social Selling On Linkedin\n\nIf you spend any time managing sales pipelines or sourcing candidates, you already know the harsh reality of modern LinkedIn outreach: buyers and decision-makers have developed total immunity to automated cold messages. The classic playbook of scraping a list, loading it into a cloud-based automation tool, and firing off hundreds of generic connection requests followed by a three-part pitch sequence is yielding lower returns every single quarter. \n\nFor years, platforms like Phantombuster were the go-to engines for this kind of volume-based outreach. They allowed teams to extract massive amounts of data and automate connections at scale. But as algorithms have evolved to detect cloud-based scraping and users have grown fatigued by robotic inboxes, the definition of social selling has fundamentally shifted.\n\nAutomating social selling on LinkedIn today involves streamlining prospecting, engagement, and outreach with AI in a way that prioritizes public visibility and contextual interactions over hidden, spammy direct messages. It bridges the gap between digital marketing and sales, allowing you to scale relationships without losing authenticity [1](https://www.linkedin.com/top-content/sales/sales-automation-tools-to-consider/social-media-sales-automation/).\n\nTo bypass crowded inboxes and turn public visibility into direct interviews, pipeline, and client conversations, you need tools built for engagement, not just extraction. This guide breaks down exactly how to automate social selling using modern methodologies and explores the best [Phantombuster alternatives for automate LinkedIn comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n## The Evolution of LinkedIn Automation: Why the Old Playbook is Broken\n\nIn the early days of social selling, success was often a numbers game. SDRs, agency founders, and recruiters operated under the assumption that if they sent 100 automated connection requests a day, accepted a 20% conversion rate, and booked 2 calls, the system was working. \n\nThis brute-force approach relied heavily on cloud-based scrapers. You would point a tool at a LinkedIn group or search URL, scrape the profiles, and execute a sequence. The issues with this approach in 2026 are threefold:\n\n1. **Platform Penalties:** LinkedIn aggressively monitors for cloud-based automation. When a platform detects simultaneous logins from a server in Virginia while you are browsing from your phone in London, it triggers security protocols. Persistent use of cloud-based scrapers often results in permanent account restrictions.\n2. **The \"Pitch Slap\" Backlash:** Buyers publicly name and shame poor automation attempts. When a prospect receives a message that says, \"Hi {First_Name}, I noticed we both work in {Industry}, let's hop on a 15-minute call,\" they instantly recognize the automation variable tags. Trust is broken before it is ever established.\n3. **Ignored Inboxes:** The modern LinkedIn inbox is heavily filtered. Messages from 2nd and 3rd-degree connections are often routed to an \"Other\" tab where they go unread. \n\n![Diagram comparing legacy cloud mass messaging with modern public comment social selling on LinkedIn](https://assets.bevisible.app/inline-images/j578qcjc7aee2tz95ptenhcj9n8d619x/inline-1-1790351257485-cqiznd.png)\nThe modern approach flips this dynamic. Instead of pushing into the private inbox uninvited, effective automated social selling pulls the prospect toward you through highly visible, intelligent interactions in the public feed. \n\n## What It Actually Means to Automate Social Selling on LinkedIn Today\n\nTo understand how to successfully replace legacy tools, you have to define what successful social selling automation looks like now. It is no longer about mass messaging. \n\nTrue social selling involves positioning yourself as an authority, finding where your ideal buyers are already congregating, and participating in those conversations. When SDRs and founders figure out how social selling actually works [2](https://www.youtube.com/watch?v=-yNoCeiqcII&t=16), they realize that automation should not replace human intent; it should simply execute the manual, repetitive aspects of that intent.\n\nAutomated social selling in 2026 focuses on:\n*   **Account Monitoring:** Automatically tracking when target accounts post new content, announce funding, or change leadership.\n*   **Warming Up via Engagement:** Dropping insightful, contextual comments on a prospect's public posts so they see your face and headline repeatedly before you ever attempt to connect.\n*   **Contextual Drafting:** Using AI to analyze the specific nuances of a prospect's post and draft a reply that sounds like you, based on your unique bio, tone, and goals.\n*   **Local Execution:** Running these actions securely from your own machine using natural interaction patterns, rather than relying on risky API calls from external servers.\n\nWhen you shift your automation from \"sending messages\" to \"initiating public conversations,\" you immediately bypass the crowded inbox problem. A well-crafted comment on a prospect's post is visible to them, their network, and their colleagues. It creates multi-threaded visibility that a private direct message simply cannot achieve.\n\n## Core Challenges with Legacy Tools Like Phantombuster\n\nPhantombuster is a powerful data extraction tool. If you need to scrape Google Maps data or pull public lists from various websites, it remains highly capable. However, when applied specifically to LinkedIn social selling and engagement, its architecture presents several severe limitations.\n\n### The Cloud-Based Risk Factor\nPhantombuster operates in the cloud. It requires your session cookies to log into your account from its own servers. LinkedIn's security algorithms are specifically designed to detect this behavior. When you use cloud-based automation, you are essentially gambling with your account's standing. A single UI update or security patch from the platform can instantly flag cloud-based IP addresses, resulting in immediate suspension. For anyone relying on their profile for revenue or job hunting, this is an unacceptable risk.\n\n### Separation of Data and Action\nLegacy tools often require you to string together complex workflows (called \"Phantoms\"). You might have to use one Phantom to scrape a search URL, export that data to a CSV, clean the CSV in Excel, upload it to another Phantom for profile viewing, and finally run a third Phantom for messaging. This disjointed process leaves immense room for error and makes it difficult to run reactive, real-time engagement campaigns.\n\n### Lack of Contextual AI Integration\nWhile many legacy tools have bolted on basic ChatGPT integrations, they often lack the deep contextual awareness required for authentic engagement. They might be able to summarize a profile, but they struggle to read a specific post, cross-reference it with your personal expertise, and generate a comment that adds genuine value to the discussion. This results in embarrassing, generic comments like, \"Great post! Thanks for sharing,\" which actually damage your personal brand.\n\n## The 4-Step Framework for Modern Social Selling Automation\n\nIf you are transitioning away from mass connection tools, you need a structured framework to ensure your new engagement strategy generates measurable results. Mastering social selling on LinkedIn requires a deliberate sequence of actions that builds familiarity before making an ask [3](https://www.youtube.com/watch?v=_B8GPjImx5c). \n\nHere is how you automate the modern social selling workflow.\n\n### Step 1: Build Hyper-Targeted Prospecting Lists\n\nNever rely on generic, manual searches or basic keyword scraping. The foundation of any successful automated campaign is a meticulously curated list. If your list is poor, your AI-generated engagement will be irrelevant.\n\nUse LinkedIn Sales Navigator to build highly specific lists of leads. Move beyond basic filters like \"Job Title\" and \"Geography.\" Instead, leverage behavioral and intent filters.\n*   **Recent Activity:** Filter for prospects who have posted on LinkedIn in the past 30 days. There is no point in running an engagement automation campaign against inactive profiles.\n*   **Company Growth:** Target accounts that have recently experienced headcount growth or leadership changes, signaling a potential buying window.\n*   **Shared Experiences:** Filter for prospects who attended the same university, worked at previous companies you are familiar with, or follow the same industry influencers. \n\nSave these search queries as lead lists so the platform automatically monitors updates. You want a dynamic list of active users, not a static CSV file that decays in relevance every week.\n\n### Step 2: Automate Lead Research and Account Monitoring\n\nOnce you have your lists, the next step is monitoring for engagement opportunities. Instead of randomly checking profiles, use automation to surface the right moments to strike.\n\nThis is where the strategy shifts from extraction to observation. You want your system to monitor your target list and alert you (or automatically queue up actions) when a prospect publishes a post, comments on an industry discussion, or shares company news. \n\nWarming up a prospect before sending a cold connection request vastly improves acceptance rates. By monitoring their activity, you gather the context needed to make that warm-up meaningful. If a VP of Sales posts about the struggles of onboarding remote SDRs, that specific post is your entry point. \n\n![Four-step framework illustrating the modern automated social selling workflow on LinkedIn](https://assets.bevisible.app/inline-images/j578qcjc7aee2tz95ptenhcj9n8d619x/inline-2-1790351253981-jno5gf.png)\n### Step 3: Deploy Context-Aware Engagement (The Warm-Up)\n\nThis is the most critical step and where modern AI tools drastically outperform legacy scrapers. Instead of sending a direct message, you are going to automate the commenting process.\n\nHowever, automating comments requires extreme care. This is a public interaction. If the automation fails, everyone sees it. \n\nTo execute this safely and effectively:\n1.  **Use Local Execution:** Ensure your automation tool runs locally on your machine, using your actual browser session. This mimics human clicking and scrolling, keeping your account safe from cloud-detection algorithms. \n2.  **Provide Strict AI Guidelines:** Your tool must understand your unique bio, your value proposition, and your preferred tone of voice. If you are a casual startup founder, your automated drafts shouldn't sound like a corporate press release.\n3.  **Focus on Value, Not Pitching:** The goal of an automated comment is to add to the discussion. If a prospect posts about marketing attribution, your AI should draft a comment that shares a brief, relevant insight or asks a smart follow-up question. \n\n*Example of a bad automated comment:* \"Great insights on attribution! Check out our software to solve this.\"\n*Example of a good automated comment:* \"Fascinating breakdown of the attribution window. I've found that moving to a 90-day model often exposes hidden touches in enterprise deals. Have you noticed a difference based on deal size?\"\n\nThe latter comment proves you read the post, establishes your expertise, and invites a reply. When you automate this process across 50 target accounts a day, you begin generating massive inbound visibility.\n\n### Step 4: Transition to High-Intent Direct Conversations\n\nAfter you have engaged with a prospect's public posts 2-3 times over a couple of weeks, they will start recognizing your name and headline. They might reply to your comments, or even visit your profile. \n\nThis is the moment to transition to the inbox. Because you have automated the warm-up phase, the connection request is no longer cold.\n\nWhen you send the request, reference the public interaction:\n\"Hey Sarah, really enjoyed our back-and-forth on your post about remote SDR onboarding earlier this week. I write a lot about sales enablement and would love to follow your updates. Let's connect.\"\n\nThis methodology routinely yields connection acceptance rates above 60%, compared to the 10-15% typical of cold Phantombuster sequences. More importantly, it starts the relationship on a foundation of mutual professional respect rather than a transactional pitch.\n\n## Top Phantombuster Alternatives for Automating Social Selling\n\nIf you are ready to modernize your approach and focus on safe, engagement-driven social selling, evaluating the right software is critical. The market has fractured into highly specialized tools. Here is a breakdown of the best alternatives based on your specific goals.\n\nFor a deeper dive into evaluating these platforms, review this [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### 1. Junior: Best for Authentic Commenting and Account Safety\n\nIf your goal is to replace cold outreach with authentic, conversation-starting engagement, Junior is the premier alternative to legacy scrapers. Built specifically to counter the rise of inbox spam, Junior takes an entirely different architectural approach to automation.\n\n**How it works:**\nJunior runs locally on your machine. It does not use cloud servers to log into your account, meaning it operates within your existing browser session and mimics natural human interaction patterns. This drastically reduces the risk of account restrictions that plague cloud-based tools.\n\n**Why it replaces legacy tools:**\nInstead of extracting data to spam inboxes, Junior focuses on public visibility. It scans your LinkedIn feed or targeted lists for relevant discussions. Using advanced AI, it reads the context of the prospect's post, cross-references it with your highly specific user bio and goals, and drafts a human-sounding reply. \n\nYou review, edit (if necessary), and publish. It allows job seekers, agencies, and sales teams to drop 50-100 highly contextual, value-adding comments per day. This strategy bypasses the inbox entirely, turning public engagement into profile views, connection requests, and direct inbound pipeline.\n\n### 2. Dripify: Best for Complex Campaign Sequencing\n\nIf you still require inbox automation but want a safer, more intuitive interface than Phantombuster, Dripify is a strong contender. \n\n**How it works:**\nDripify is designed around complex sequence building. It allows you to create drag-and-drop workflows that combine profile views, skill endorsements, connection requests, and direct messages based on conditional logic (e.g., \"If they don't accept in 3 days, withdraw request; if they do, send message A\").\n\n**Why it replaces legacy tools:**\nIt offers a much better user interface and campaign management system than older scraping tools. However, it is still primarily a cloud-based messaging tool. While it uses rotating IPs and safety limits, it inherently carries more risk than local execution tools, and it still relies on the prospect being receptive to cold DMs. \n\nFor a detailed comparison on how different strategies affect client acquisition, read [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### 3. Taplio: Best for Content Creators and Basic CRM\n\nTaplio approaches social selling from the perspective of inbound content creation rather than outbound engagement.\n\n**How it works:**\nTaplio focuses heavily on helping you write and schedule your own posts. It provides AI assistance for content generation, tracks your post analytics, and includes a basic CRM to monitor people who engage with your content. \n\n**Why it replaces legacy tools:**\nIf your social selling strategy relies entirely on being a thought leader and attracting inbound leads through your own viral posts, Taplio is excellent. However, it is less effective at targeted *outbound* engagement (going to your specific prospect's posts and interacting). \n\nTo understand which approach suits your growth model better, explore [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth).\n\n![Comparison diagram showing cloud-based automation vs safe local browser execution architecture](https://assets.bevisible.app/inline-images/j578qcjc7aee2tz95ptenhcj9n8d619x/inline-3-1790351261126-wx0kf1.png)\n## The Technical Divide: Cloud-Based vs. Local Automation\n\nWhen evaluating how to automate social selling, the underlying architecture of the tool you choose is just as important as its feature set. The industry is currently split between cloud-based and local-execution models. Understanding this divide is crucial for protecting your digital assets.\n\n### Cloud-Based Automation (The Old Standard)\nTools like Phantombuster operate in the cloud. When you launch a campaign, their servers (often located in data centers far from your physical location) log into your LinkedIn account using your session cookies. \n*   **The Pros:** Campaigns run 24/7 even when your computer is turned off. You can scale massive operations across dozens of dummy accounts.\n*   **The Cons:** LinkedIn's security infrastructure easily detects data center IP addresses and simultaneous logins from disparate geographic locations. This is the primary trigger for shadowbans and permanent account suspension. Furthermore, cloud tools often execute actions via backend API requests, which lack the natural delays, scrolling, and cursor movements of human behavior.\n\n### Local Execution Automation (The Modern Standard)\nTools designed for [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin) operate locally on your own machine.\n*   **The Pros:** The automation runs through your active browser session on your actual IP address. To the platform's security algorithms, the activity looks exactly like you sitting at your desk. Local tools can also simulate human latency\u2014pausing to read a post, scrolling at varying speeds, and typing with natural delays. This makes detection exponentially more difficult and keeps your account safe.\n*   **The Cons:** Your computer must be on, and the browser must be active for the automation to run. It does not support 24/7 background operation.\n\nFor professionals whose LinkedIn profile is a core asset\u2014such as founders, lead gen agencies, and senior job seekers\u2014the safety of local execution vastly outweighs the convenience of 24/7 cloud operation. Losing a profile with 10,000 connections because a cloud scraper updated too fast is a catastrophic business failure. \n\n## 5 Critical Mistakes When Automating LinkedIn Sales\n\nEven with the right local, AI-driven tools, strategy dictates success. When automating social selling, teams frequently fall into traps that sabotage their credibility. Avoid these five critical mistakes.\n\n### 1. Confusing Activity with Intent\nMany sales teams measure automation success by raw activity: \"We posted 500 comments and sent 200 connection requests this week.\" This is a vanity metric. If those 500 comments were generic (\"Love this!\"), they generated zero intent. Measure success by conversations started and profile views generated. Ten highly contextual, AI-drafted comments on tier-one accounts will yield more pipeline than 500 thoughtless automated interactions.\n\n### 2. Operating with an Unoptimized Profile\nAutomated social selling via commenting is designed to drive traffic back to your profile. If a prospect reads your insightful comment, clicks your name, and lands on a profile that reads like a resume rather than a landing page, you lose the conversion. Before you automate anything, ensure your headline clearly states the value you provide and your featured section drives visitors toward a specific action (booking a call, downloading a resource, or viewing a portfolio).\n\n### 3. The \"Immediate Pitch\" Following Engagement\nA common workflow mistake is automating a comment, waiting exactly 60 minutes, sending a connection request, and immediately sending a pitch DM the second they accept. This transparency destroys the illusion of organic interest. You must allow breathing room. Engage on Tuesday, engage again on Thursday, send a connection request on Friday, and wait until the following week to initiate a business conversation.\n\n### 4. Failing to Feed AI the Right Context\nIf you are using tools to draft contextual replies, the AI is only as good as the guardrails you provide. If you fail to configure your tool with a detailed bio, specific negative prompts (e.g., \"never use emojis,\" \"never start with 'I agree'\"), and clear goals, the AI will default to standard, slightly robotic corporate speak. Spend the time to train your local automation tool on your exact voice.\n\n### 5. Ignoring Dwell Time\nAlgorithms track how long a user spends viewing a post before interacting. If your automation clicks a post, instantly drops a 100-word comment, and moves to the next post in 1.5 seconds, it registers as non-human behavior. Ensure your automation strategy incorporates natural dwell times, pausing to \"read\" the content before engaging.\n\n## Measuring the ROI of Automated Social Selling\n\nShifting from mass cold DMs to automated public engagement requires a shift in how you measure Return on Investment. You are no longer tracking \"Messages Sent vs. Calls Booked.\" You are tracking the growth of your digital footprint and inbound interest.\n\n**Track these primary metrics:**\n1.  **Inbound Profile Views:** A successful automated commenting strategy should result in a 200-300% increase in 90-day profile views. This indicates that your public engagements are compelling enough to make prospects click your name.\n2.  **Inbound Connection Requests:** As you consistently show up in the feeds of your target audience, they will begin sending *you* connection requests. Track the percentage of your network growth that is purely inbound.\n3.  **Comment-to-Conversation Rate:** When you leave an automated, context-aware comment, how often does the original poster reply to you? High reply rates indicate that your AI parameters are dialed in and producing authentic dialogue.\n4.  **Pipeline Originated from Feed:** When you do move a prospect to a discovery call, track how the relationship originated. Was the first touch a cold DM, or did it stem from a public conversation on a post? \n\nBy focusing on these metrics, lead generation agencies and sales teams can prove that automated social selling builds compounding value over time, unlike cold outreach lists which degrade the moment they are exhausted.\n\n## FAQs About Automating LinkedIn Social Selling\n\n### Is automating social selling against LinkedIn's terms of service?\nLinkedIn's terms of service prohibit the use of bots, scrapers, and automated tools that abuse the platform, scrape data, or bypass security controls. This is why cloud-based scraping tools like Phantombuster are heavily targeted. However, tools that run locally, mimic human interaction speeds, and focus on generating authentic, low-volume engagement operate in a much safer paradigm. The key is simulating natural human behavior rather than executing mass, server-side actions.\n\n### How many comments or messages should I automate daily?\nTo maintain account safety, volume must be tightly controlled. You should never attempt to mimic machine-level scale. A healthy target for a warmed-up account is between 40 to 60 contextual comments per day, and 20 to 30 highly targeted connection requests. Spiking your activity to 200 actions in a single day is a primary trigger for account restrictions. Consistency at a human scale is far more effective than sporadic, massive bursts of activity.\n\n### Can AI actually sound like me in social selling?\nYes, provided you give it the correct constraints. If you use a generic ChatGPT prompt, it will sound like a generic AI. If you use specialized tools that ingest your specific industry experience, your writing style, and negative constraints (words you never use), the output can be indistinguishable from your own writing. The goal of AI in this context is to draft a 90% perfect response based on the post's context, leaving you to quickly review and approve it before it goes live.\n\n### How long does it take to see results from automated commenting?\nUnlike mass cold email campaigns that can yield immediate (though low-quality) results, automated social selling is a mid-term strategy. You are building familiarity and trust. Typically, it takes two to three weeks of consistent, daily engagement before you see a significant lift in inbound profile views, inbound connection requests, and warm prospects willing to transition into direct messages or discovery calls.", "created_at": "2026-09-25T15:49:26.993381+00:00", "updated_at": "2026-09-25T15:49:26.993386+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
