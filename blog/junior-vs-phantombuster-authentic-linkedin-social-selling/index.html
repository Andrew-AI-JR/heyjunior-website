    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 60, "slug": "junior-vs-phantombuster-authentic-linkedin-social-selling", "title": "Junior vs PhantomBuster: which tool is better for authentic LinkedIn social selling", "excerpt": "Compare Junior and PhantomBuster for LinkedIn social selling. Discover which AI tool delivers authentic engagement, account safety, and real sales pipeline.", "featured_image_url": "https://assets.bevisible.app/featured-images/j576s0dj1p4hc6cac8fbg9pd4n8aj5h2/junior-vs-phantombuster-which-tool-is-better-for-a-1785593911806-we9caq.png", "published_at": "2026-08-01T14:00:00+00:00", "content": "# Junior vs PhantomBuster: which tool is better for authentic LinkedIn social selling\n\nLinkedIn in 2026 is littered with automated cold outreach that goes straight to the delete button. Decision-makers receive dozens of template-based connection requests and automated pitch DMs every week. As buyers grow immune to inbox spam and platform algorithms actively restrict accounts running cloud-based scrapers, revenue teams, founders, and consultants face a critical crossroads.\n\nThe old playbook focused on high-volume extraction. You scraped a list of thousand prospects, ran an automated drip sequence, and hoped for a fraction of a percent response rate. Today, effective social selling relies on public visibility, contextual conversations, and account safety. Modern platforms leveraging artificial intelligence enhance sales performance by shifting focus from cold outreach to authentic engagement [[AI in Sales](https://business.linkedin.com/sell/resources/sales-terms/ai-in-sales)].\n\nWhen evaluating software for this new paradigm, two prominent solutions represent completely different approaches: **PhantomBuster** and **Junior**.\n\nPhantomBuster built its reputation as a cloud-based data extraction and multi-platform automation hub. It helps growth marketers scrape profiles, export search results, and trigger automated connection workflows. Junior was engineered specifically for authentic LinkedIn social selling. It focuses on turning public post discussions into pipeline by using context-aware AI comments that run locally on your browser.\n\nThis guide breaks down how both platforms handle discovery, message personalization, account safety, and conversion strategy so you can decide which tool fits your LinkedIn growth goals.\n\n---\n\n## The AI Social Selling Playbook: Core Best Practices\n\nBefore comparing software specs, you need to understand how the LinkedIn landscape has shifted. Social selling is defined as building relationships as part of the sales process, primarily through social platforms [[LinkedIn Social Selling](https://business.linkedin.com/sales-solutions/social-selling)]. AI can scale these efforts, but misapplying automation ruins domain reputation and gets accounts restricted.\n\n### 1. Optimize Your Profile for Algorithm and Human Alignment\nYour profile serves as your landing page. When you leave an insightful comment on a prospect's post or send a connection request, your profile headline and banner are the first things they inspect. Optimizing your profile to clearly communicate target outcomes within three seconds ensures that public visibility translates directly into profile views and incoming inbound messages [[LinkedIn Profile Optimization](https://www.youtube.com/watch?v=MGjXraYMbhQ&t=13)].\n\n### 2. Prioritize Public Visibility Over Cold Private Inboxes\nInboxes are crowded, guarded, and heavily monitored by LinkedIn security heuristics. Public comment sections, on the other hand, are open stages. Leaving a high-value comment on a post read by thousands of industry leaders establishes authority in front of the primary creator and their entire network. This approach naturally prompts profile visits and warm direct messages [[LinkedIn Lead Gen Rules](https://www.youtube.com/watch?v=JVFphY9lu78&t=297)].\n\n### 3. Ground AI Outputs in Persona and Experience Vectors\nGeneric AI responses like *\"Great post! Thanks for sharing!\"* damage credibility faster than sending no comment at all. Effective social selling tools require rich context regarding your bio, tone of voice, professional experience, and conversion objectives. The system must draw on your specific domain expertise when crafting responses [[Strategic Automation](https://blog.closelyhq.com/building-linkedin-thought-leadership-through-strategic-automation/)].\n\n![Whiteboard diagram comparing traditional LinkedIn cold DM funnels against authentic public engagement funnels.](https://assets.bevisible.app/inline-images/j576s0dj1p4hc6cac8fbg9pd4n8aj5h2/inline-1-1785593830593-q7qyf7.png)\n---\n\n## Tool Architecture and Account Safety: Local Execution vs Cloud Scraping\n\nThe fundamental technical distinction between PhantomBuster and Junior lies in where and how they interact with LinkedIn.\n\n### PhantomBuster: Cloud Infrastructure and Session Cookies\nPhantomBuster operates on remote cloud servers. To use its LinkedIn \"Phantoms,\" you must export your browser session cookie (`li_at`) and upload it to PhantomBuster's cloud dashboard. Their headless browser cloud servers then log into your LinkedIn session from server-side data centers or rotating proxies to run automated scraping and outreach tasks.\n\nWhile cloud execution allows background processing, it introduces significant technical risk factors:\n* **IP & Location Mismatches:** Logging into LinkedIn from a datacenter IP address in another state or country while you simultaneously browse from your local laptop flags automated security defense checks.\n* **Session Cookie Expiration:** LinkedIn periodically invalidates session tokens when suspicious cloud activity is detected, requiring users to repeatedly re-authenticate.\n* **Headless Browser Fingerprinting:** LinkedIn algorithms easily distinguish real human browser environments (Chrome on MacOS/Windows) from automated headless browsers (Puppeteer or Playwright running on Linux cloud nodes).\n\n### Junior: Local Browser Execution Engine\nJunior takes a localized approach. Instead of sending your session token to remote servers, Junior runs locally on your machine within your active browser session. It interacts with LinkedIn using natural user interfaces, genuine DOM interactions, and realistic human delays.\n\nKey architectural safety benefits include:\n* **Identical IP Footprint:** Every action originates from the exact same residential IP address, internet service provider, and device fingerprint you use for daily work.\n* **Zero Cookie Sharing:** Your session cookie (`li_at`) never leaves your browser, protecting your login details.\n* **Human-in-the-Loop Simulation:** Junior mimics human scrolling, reading delays, and typing speeds, keeping account activity within safe limits. Learn more about maintaining account safety in our guide on [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n---\n\n## In-Depth Tool Breakdown: PhantomBuster\n\nPhantomBuster is a versatile automation platform designed for data scrapers, lead enrichment specialists, and growth engineers across multiple social networks.\n\n```\n+-----------------------------------------------------------------------+\n|                         PHANTOMBUSTER OVERVIEW                        |\n+-----------------------------------------------------------------------+\n| Core Philosophy : Multi-platform scraping and high-volume enrichment. |\n| Architecture    : Cloud-based headless server execution (Cookie-based).|\n| Key Strengths   : Lead extraction, Sales Navigator scraping, webhooks.|\n| Weaknesses      : Risk of profile ban, generic messaging, complex setup.|\n\n+-----------------------------------------------------------------------+\n```\n\n### What PhantomBuster Does Best\nPhantomBuster excels at raw data extraction and workflow orchestration across platforms like LinkedIn, Sales Navigator, X (Twitter), Instagram, and Google Maps. Growth teams use PhantomBuster to:\n1. **Scrape LinkedIn Search Results:** Extract thousands of profiles from Sales Navigator searches into CSV or JSON files.\n2. **Enrich Profile Data:** Match profile URLs with corporate email addresses through third-party integrations (Dropcontact, Hunter).\n3. **Multi-Step Cloud Workflows:** Chain sequence tasks together, such as extracting post likers, sending connection requests, and following up with direct messages.\n\n### Where PhantomBuster Struggles in Modern Social Selling\n* **Outdated Outreach Tactics:** PhantomBuster was built around cold DM outreach and connection blasting. In 2026, prospect response rates to cold connection blasts are at all-time lows.\n* **High Risk Profile:** Using cloud scrapers to perform rapid connection sequences frequently triggers LinkedIn account restriction warnings or permanent suspensions. Read our detailed review of [PhantomBuster alternatives for safe comment automation](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n* **Lack of Deep Contextual AI:** PhantomBuster uses simple template tags (e.g., `Hello #firstName#`) or standard API calls to generic LLM prompts. It lacks deep contextual awareness regarding your personal bio, post content subtleties, or strategic sales objectives.\n\n---\n\n## In-Depth Tool Breakdown: Junior\n\nJunior is built specifically to address the modern reality of LinkedIn social selling: starting warm, authentic conversations by engaging directly in high-visibility public discussions.\n\n```\n+-----------------------------------------------------------------------+\n|                            JUNIOR OVERVIEW                            |\n+-----------------------------------------------------------------------+\n| Core Philosophy : Contextual public engagement and safe warm pipeline.||\n| Architecture    : Local browser engine running on the user's desktop.  |\n| Key Strengths   : Authentic AI comments, account safety, goal vectors.|\n| Weaknesses      : Not built for mass cold-list data scraping.          |\n\n+-----------------------------------------------------------------------+\n```\n\n### What Junior Does Best\nJunior replaces cold DM automation by helping job seekers, sales reps, consultants, agencies, and founders turn public comments into direct client conversations and job interviews.\n1. **Strategic Topic & Account Discovery:** Junior identifies high-value posts from key industry influencers, decision-makers, and target accounts in your niche.\n2. **Context-Aware AI Commentary:** Instead of generating generic praise, Junior analyzes the author's post, picks up on subtle arguments, and drafts thoughtful, human-sounding comments based on your unique bio, tone, and strategic goals.\n3. **Local Safety & Execution:** Operating directly inside your desktop browser environment, Junior protects your account from detection heuristics.\n4. **Public-to-Private Conversion:** Junior creates public visibility that naturally drives decision-makers to visit your profile and initiate warm private messages or respond positively when you reach out. Check our guide on [Junior vs Dripify for finding clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### Where Junior Does Not Focus\nJunior is explicitly built *not* to be a cloud data scraper or a mass connection-spam engine. If your objective is to export 50,000 email addresses into a database, Junior is not designed for bulk data harvesting.\n\n![Comparison matrix highlighting key differences between PhantomBuster and Junior for LinkedIn social selling.](https://assets.bevisible.app/inline-images/j576s0dj1p4hc6cac8fbg9pd4n8aj5h2/inline-2-1785593848225-13k3xp.png)\n---\n\n## Feature-by-Feature Comparison: Junior vs PhantomBuster\n\nTo see how these two platforms stack up, let's compare them across the primary capabilities required for LinkedIn growth and deal closing.\n\n| Feature / Metric | PhantomBuster | Junior | Winner / Advantage |\n| :--- | :--- | :--- | :--- |\n| **Core Selling Strategy** | Cold DM outreach & high-volume connection requests | Contextual public post commenting & warm inbound generation | **Junior** (Higher response & conversion) |\n| **Execution Environment** | Cloud servers (Datacenter IPs / Proxies) | Local browser execution (Your residential IP) | **Junior** (Superior account safety) |\n| **Authentication Method** | Session cookie export (`li_at`) | Native local browser session | **Junior** (No cookie exposure) |\n| **AI Comment Quality** | Basic template tags / Generic LLM prompts | Bio-grounded, context-aware, goal-driven AI draft generation | **Junior** (Human-sounding authenticity) |\n| **Data & Profile Scraping** | Comprehensive multi-platform list extraction | Focused relevant discussion & post tracking | **PhantomBuster** (For raw list building) |\n| **Human-in-the-Loop Review**| Automated mass background execution | Smooth click-to-approve/edit workflow | **Junior** (Maintains complete control) |\n| **Account Risk Profile** | Moderate to High (Risk of flag/restriction) | Extremely Low (Simulates natural human patterns) | **Junior** (Safest operational footprint) |\n| **Ideal User Persona** | Technical growth hackers & outbound list scrapers | Founders, consultants, sales reps, job seekers | **Depends on objective** |\n\n---\n\n## Deep Dive Comparison Across 4 Core Categories\n\n### 1. Account Safety and Risk Profile\nAccount safety is non-negotiable on LinkedIn. Losing a warm network built over years due to automated cloud scraping can set your business back months.\n\nPhantomBuster's architecture requires passing session tokens to external cloud servers. When cloud instances execute hundreds of background requests per hour across rotating proxy networks, LinkedIn security systems flag suspicious activity patterns. This frequently results in captcha challenges, temporary profile limits, or account bans.\n\nJunior operates locally on your machine. Because it runs inside your regular web browser, every HTTP request, header, user-agent string, and IP location matches your authentic user footprint. Junior simulates natural human pauses and scrolling habits, keeping your activity within normal operational parameters. Review our [evaluation checklist for safe comment automation](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist).\n\n### 2. Targeting and Discovery Mechanics\nHow each platform finds prospects determines the nature of your interactions.\n\nPhantomBuster focuses on static parameter scraping. You feed it a Sales Navigator URL, and it extracts profiles matching titles, company sizes, or locations. However, static list scraping fails to tell you if a prospect is active on LinkedIn today.\n\nJunior focuses on dynamic conversation discovery. It monitors public posts, industry hashtags, and strategic creator accounts to surface active conversations as they happen. Instead of reaching out to a dormant profile, you engage prospects while they are actively sitting on the platform reading comments. For a broader comparison of finding active discussions, see our analysis of [tools to find relevant LinkedIn posts beyond Taplio](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio).\n\n### 3. Messaging Quality and Personalization Depth\nPersonalization quality dictates whether a prospect responds or blocks your profile.\n\nPhantomBuster relies on macro substitution variables (e.g., *\"Hi {{firstName}}, I saw you work at {{companyName}}...\"*). In 2026, prospects instantly identify these basic templates as automated cold spam.\n\nJunior uses a bio-grounded contextual AI engine. Before drafting a reply, Junior reads the full text of the LinkedIn post, analyzes the author's argument, and cross-references it with your personal bio, past experiences, and strategic conversion goals. It generates a comment that adds real value to the discussion, making your response look and feel 100% human-crafted.\n\n```\nEXAMPLE OF COLD AUTOMATION VS CONTEXTUAL SOCIAL SELLING:\n\n[PhantomBuster Cold DM Style]:\n\"Hi Sarah, I noticed you are VP of Sales at TechCorp. We help companies like yours scale pipeline by 300%. Do you have 15 minutes for a quick demo this Thursday?\"\n--> Result: Ignored, reported as spam, or blocked.\n\n[Junior Public Engagement Style]:\n\"Sarah made a great point about SDR burn-out in her recent post about enterprise sales cycles.\nJunior drafts: 'Spot on regarding cycle length, Sarah. We noticed the same shift when working with mid-market teams\u2014reps who focused on pre-qualifying through public content saw 2x shorter deal velocity than those forcing cold calls. Are you seeing this impact outbound team retention as well?'\"\n--> Result: Sarah replies publicly, profile views increase, and a warm conversation begins.\n```\n\n### 4. Workflow Speed and Operational Control\nFully automated mass tools promise hands-off efficiency, but hands-off execution in social selling often leads to embarrassing public mistakes.\n\nPhantomBuster runs in the background. If you set up an automated comment Phantom with generic prompts, it will post whatever the AI produces\u2014including inappropriate, tone-deaf, or off-topic responses\u2014directly onto prospect posts without your final review.\n\nJunior provides a streamlined **Human-in-the-Loop** review workflow. As you browse LinkedIn, Junior identifies high-value posts and populates a tailored, high-converting draft in your comment box. You retain 100% control to review, refine, or approve the comment with a single click. This hybrid workflow gives you speed without sacrificing brand safety. Read more about this balance in our review of [best AI tools for LinkedIn commenting beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n---\n\n## Step-by-Step Implementation: Building an AI Social Selling Workflow\n\nTo build a predictable sales pipeline using AI-assisted social selling, follow this five-step implementation blueprint.\n\n![Flowchart detailing the five-step AI social selling process from topic selection to warm conversion.](https://assets.bevisible.app/inline-images/j576s0dj1p4hc6cac8fbg9pd4n8aj5h2/inline-3-1785593845511-71rw1e.png)\n### Step 1: Define Target Niche and Conversation Triggers\nIdentify the specific topics, pain points, and industry leaders your target buyers engage with. Rather than targeting static job titles, map out the primary discussions your ideal customers participate in online.\n\n### Step 2: Configure Your Personal Bio and Goal Vectors\nInput your professional history, core areas of expertise, unique value propositions, and conversation boundaries into your AI engine. For instance, instruct the system to speak from the perspective of a seasoned sales engineer or a founder specializing in B2B SaaS.\n\n### Step 3: Monitor Active Post Feeds\nUse discovery filters to track relevant posts published by key decision-makers, target prospects, and industry creators within the last 24 hours. Early engagement on trending posts ensures maximum visibility.\n\n### Step 4: Draft and Review Contextual AI Comments\nLet your AI assistant process post contents and generate tailored, value-adding comments grounded in your knowledge base. Review each draft to verify tone accuracy before posting.\n\n### Step 5: Convert Public Impressions into Warm Inbound Conversations\nWhen post authors and readers reply to your comment or view your profile, send a warm, personal connection request referencing the specific public discussion:\n* *\"Hey [Name], loved your point on [Topic] in today's post! Added my thoughts in the comments, but wanted to connect here as well.\"*\nThis warm bridge achieves significantly higher acceptance and response rates than cold outreach messaging.\n\n---\n\n## Common Pitfalls to Avoid in AI Social Selling\n\nWhen deploying AI tools for social selling, avoid these three common mistakes:\n\n1. **Running High-Volume Automation on Fresh Accounts:** Newer or long-inactive accounts trigger risk thresholds quickly. Start slow by leaving 5 to 10 high-value comments daily before scaling activity.\n2. **Using Generic Praise Placeholders:** Comments like *\"Great insights, thanks for sharing!\"* or *\"Totally agree with this post!\"* signal automated bot activity to both users and platforms. Always offer a complementary perspective or ask an engaging question.\n3. **Neglecting Profile Optimization:** Driving traffic to an unoptimized profile wastes public visibility. Ensure your profile banner, headline, and featured sections clearly state who you help and how you deliver value.\n\n---\n\n## Frequently Asked Questions (FAQs)\n\n### Is PhantomBuster safe to use on LinkedIn in 2026?\nPhantomBuster can be used safely for light data scraping, but running automated connection sequences or direct messaging through cloud servers carries inherent risk. LinkedIn continuously improves its ability to detect cloud IP ranges and session cookie misuse. Using local browser tools provides a significantly safer architecture for daily sales activities.\n\n### How does AI social selling differ from traditional cold outreach?\nTraditional cold outreach relies on sending unsolicited private messages or emails to lists of contacts. AI social selling focuses on discovering active public discussions, posting insightful contextual comments using AI assistance, establishing authority, and driving warm inbound inquiries.\n\n### Can AI post commenting replace cold LinkedIn DMs?\nYes. Modern revenue teams find that strategic public post engagement generates higher response rates and cleaner pipeline than cold DMs. Public comments demonstrate domain competence to the post author while simultaneously attracting views from other prospects reading the thread.\n\n### How does Junior protect my LinkedIn account safety?\nJunior runs directly inside your local desktop browser rather than on remote cloud servers. It operates from your residential IP address, avoids session cookie exports, and uses realistic execution delays that match natural human browsing habits.\n\n---\n\n## Final Verdict: Which Tool Should You Choose?\n\nChoosing between PhantomBuster and Junior comes down to your primary sales strategy:\n\n* **Choose PhantomBuster if:** You are a growth engineer or data researcher whose primary job is scraping raw data lists, exporting Sales Navigator searches to CSVs, or orchestrating multi-platform data pipelines across web enrichment APIs.\n* **Choose Junior if:** You are a founder, sales executive, consultant, agency owner, or job seeker who wants to build an authentic sales pipeline safely. If your goal is to land high-value client deals, schedule interviews, and establish authority by converting public feed discussions into warm private conversations, **Junior is the clear winner**.\n\nBy prioritizing account safety, local execution, and bio-grounded contextual AI comments, Junior gives you a sustainable social selling advantage without risking your LinkedIn account.\n\nReady to transform public visibility into warm pipeline? Discover how [Junior](https://www.heyjunior.ai/) streamlines your LinkedIn engagement strategy today.", "created_at": "2026-08-01T14:19:22.379660+00:00", "updated_at": "2026-08-01T14:19:22.379666+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
