    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 147, "slug": "social-selling-benchmarks-startup-founders", "title": "State of social selling benchmarks for startup founders", "excerpt": "Discover realistic social selling benchmarks for startup founders in 2026, comparing declining cold DM metrics against high-converting comment-first strategies.", "featured_image_url": "https://assets.bevisible.app/featured-images/j570aqpjst2kyyqt6he20wc7vh8h200z/state-of-social-selling-benchmarks-for-startup-fou-1793121508411-jfhdej.png", "published_at": "2026-10-30T16:19:00+00:00", "content": "# State of social selling benchmarks for startup founders\n\nMost startup founders approach LinkedIn with a strategy that expired three years ago. They buy a data list, load it into a cloud-based automation sequence, and fire off hundreds of connection requests masked as \"virtual networking.\" A week later, they check their inbox to find it filled with automated replies from other founders doing the exact same thing, while their actual target buyers have ignored them completely.\n\nThe reality of social selling in 2026 is that the traditional direct message (DM) funnel is failing. Decision-makers guard their inboxes aggressively. LinkedIn\u2019s spam filters have grown sophisticated, and the platform actively restricts accounts that display unnatural, high-volume connection behaviors. If you are relying on cold connection requests as your primary pipeline generation engine, you are likely operating well below current industry baselines.\n\nTo build sustainable pipeline today, founders need to understand the current benchmarks for social selling, how buyer behavior has shifted toward public engagement, and which AI tools actually facilitate authentic conversations rather than compounding the noise. \n\nThis guide breaks down the true state of social selling benchmarks for startup founders, evaluates the current software landscape, and details why top performers are abandoning the cold inbox for a comment-first engagement strategy.\n\n## The 2026 Social Selling Baseline: What the Data Shows\n\nWhen evaluating social selling performance, you have to measure the right metrics. Vanity metrics like post impressions or follower counts rarely correlate with closed-won revenue for early-stage B2B startups. The metrics that matter are those that indicate a transition from passive observation to active conversation.\n\nHistorically, the benchmark for a successful cold connection request campaign hovered around a 25% to 30% acceptance rate, followed by a 3% to 5% reply rate on the follow-up message. Today, those numbers have plummeted.\n\n### The Decline of the Cold DM Funnel\n\nBuyer fatigue is the primary driver behind declining DM performance. When a VP of Engineering or a Director of Marketing receives thirty identical \"I noticed we share connections in the SaaS space\" messages a week, they stop reading them.\n\nCurrently, baseline metrics for traditional automated cold outreach on LinkedIn look closer to this:\n*   **Connection Acceptance Rate (Cold List):** 12% to 18%\n*   **First-Message Reply Rate:** 1% to 2%\n*   **Positive Meeting Booking Rate:** < 0.5%\n\nThis means that to book a single meeting, a founder might need to send upwards of 500 to 1,000 automated connection requests. Aside from the poor conversion rate, sending that volume of requests puts your LinkedIn account at severe risk of restriction.\n\n### The Rise of Inbound and Engagement Metrics\n\nBecause direct outreach is suffering from diminishing returns, high-performing founders have shifted their focus to metrics that track relationship-building and inbound interest. Rather than forcing themselves into a buyer\u2019s inbox, they make themselves visible in the spaces where the buyer is already paying attention.\n\nThe new benchmarks for startup social selling focus heavily on engagement efficiency:\n*   **Comment-to-Profile-View Ratio:** When you leave a highly contextual, insightful comment on a target prospect's post or a relevant industry discussion, a strong benchmark is seeing a 15% to 20% profile view rate from that single interaction.\n*   **Inbound Connection Rate (Post-Engagement):** Of those who view your profile after seeing your comment, a healthy benchmark is 5% to 10% sending *you* an inbound connection request.\n*   **Conversation Start Rate:** When you transition an inbound connection (or a mutual commenter) into a DM conversation based on the context of the public discussion, reply rates frequently exceed 40%, because the context and familiarity are already established.\n\n![Whiteboard diagram comparing low-converting cold LinkedIn DM funnels against high-conversion comment-first social selling met](https://assets.bevisible.app/inline-images/j570aqpjst2kyyqt6he20wc7vh8h200z/inline-1-1793121465517-ynkklg.png)\nThe math strongly favors engagement over interruption. While leaving 20 thoughtful comments takes more cognitive effort than clicking \"launch\" on a 500-person cold outreach sequence, those 20 comments are far more likely to yield three genuine conversations than the 500 cold pitches.\n\n## Evaluating AI software for startup founders doing social selling\n\nAs the strategy shifts from mass volume to hyper-relevance, the tooling landscape has adapted. If you look up the best AI software for startup founders doing social selling in 2026, you will find that the market has segmented. Tools no longer claim to do everything; instead, they specialize in specific stages of the social selling workflow: prospecting, content creation, and engagement.\n\nChoosing the right tool requires understanding where your current bottleneck is, and more importantly, ensuring the tool doesn't compromise your account safety or your brand reputation.\n\n### The Content Generation Category\n\nA significant portion of AI LinkedIn tools focus on helping founders publish content. Maintaining an active feed is helpful for inbound visibility, but content alone is rarely enough to drive early-stage sales unless you already have a massive audience.\n\nTools like [Taplio](https://taplio.com/) are popular in this category. They offer features for scheduling posts, analyzing top-performing content in your niche, and using AI to draft posts based on your ideas. For a founder struggling with the \"blank page syndrome\" of daily posting, these platforms provide a useful framework. However, a common failure mode is relying too heavily on the AI to generate the actual ideas, resulting in a feed full of generic, platitude-heavy posts that fail to establish true thought leadership.\n\nAs noted in recent industry breakdowns of the [best social selling tools in 2026](https://sparkvox.io/blog/best-social-selling-tools), relying purely on automated content generation misses the core tenet of social *selling*\u2014which is interacting with the buyer, not just broadcasting to them.\n\n### The Prospecting and Signal Tracking Category\n\nThe second category of tools focuses on finding the right people at the right time. Rather than scraping static databases, these platforms look for buying signals\u2014such as someone asking a specific question, complaining about a competitor, or celebrating a funding round.\n\n[SCOUT](https://growscout.app/) is a strong example of this integrated workflow approach. SCOUT monitors the open web, including platforms like LinkedIn and Reddit, to identify these buying signals. It connects prospecting with content and pipeline tracking, helping founders find potential buyers who are already demonstrating intent. This \"signal and strike\" methodology is far more effective than blasting a static list of titles. \n\nWhen you know *why* you are reaching out, your message is inherently more relevant. According to lists ranking the [best AI tools for LinkedIn in 2026](https://resources.rework.com/tools/ai-tools/best-ai-tools-for-linkedin-2026), intent-driven prospecting software is rapidly replacing traditional static data providers for early-stage outreach.\n\n### The Engagement and Commenting Category\n\nThe third, and arguably most impactful, category for immediate pipeline generation is engagement automation. This is where you leverage AI not to write posts for your own feed, but to interact meaningfully with other people's content.\n\nStrategic commenting is the highest-leverage activity a founder can do on LinkedIn today. When you comment on a prospect's post, or on an industry influencer's post that your prospects are reading, you bypass the crowded DM inbox entirely. You place your expertise directly in the public square.\n\nHowever, doing this manually is time-consuming. You have to scroll the feed, filter out the noise, read the relevant posts, and craft thoughtful replies. Generic AI tools fail here because they generate obvious, robotic comments like, \"Great post! Thanks for sharing.\" These damage your reputation more than they help it.\n\nThis is where Junior AI differentiates itself. Junior is designed specifically for this engagement layer, operating as an AI-powered automation tool that starts authentic conversations through strategic post commenting rather than generic spam. It finds relevant discussions and drafts context-aware, human-sounding replies based on your unique bio and goals. \n\nBy automating the discovery of relevant conversations and providing a highly contextual draft, you scale your engagement without sacrificing the authenticity that drives actual replies. \n\n![Modular diagram outlining the three categories of AI social selling tools: content generation, intent listening, and engageme](https://assets.bevisible.app/inline-images/j570aqpjst2kyyqt6he20wc7vh8h200z/inline-2-1793121467413-stt8p7.png)\n## The Security Risk of Cloud-Based Automation\n\nWhen evaluating software\u2014particularly anything that automates actions on your behalf\u2014founders must prioritize account safety. \n\nFor years, the standard approach to LinkedIn automation was cloud-based software. You would hand over your login credentials or session cookies to a third-party server, which would then run automated sequences 24/7 from a dedicated IP address. \n\nLinkedIn's security algorithms easily detect this. When an account suddenly starts sending hundreds of connection requests at superhuman speeds, at all hours of the day, from an IP address located in an AWS data center hundreds of miles from the user's actual location, it triggers an immediate behavioral anomaly. The result is often a temporary restriction, a shadowban, or a permanent loss of the account. \n\nAs discussed by [GoExtrovert](https://www.goextrovert.com/blog/best-linkedin-tools-for-founders) in their analysis of founder tools, protecting your primary distribution channel (your profile) is paramount. Losing your LinkedIn account as a founder doesn't just halt your pipeline; it damages your personal brand and severs your connection with your existing network.\n\n### The Local Execution Advantage\n\nThe modern benchmark for safe automation is local execution. Rather than running in the cloud, secure tools run directly on your own machine, using your actual browser session, your local IP address, and natural interaction patterns that mimic human behavior.\n\nJunior operates entirely on this local model. It does not require you to hand over your session cookies to a remote server. Because it runs locally, the actions it takes\u2014like analyzing a feed or drafting a comment\u2014look identical to your normal daily usage to the platform's security systems. It incorporates natural delays, reasonable volume limits, and human-like navigation.\n\nIf you are currently evaluating your tech stack and want to ensure you aren't putting your founder profile at risk, review the [Is Junior AI Safe to Use On Linkedin Source Page for Job Seekers, Sales Teams, Lead G](https://www.heyjunior.ai/blog/is-junior-ai-safe-to-use-on-linkedin) to understand exactly how local execution protects against platform restrictions. You can also dive deeper into the technical safeguards in the guide detailing [How Does Junior Protect My Linkedin Account Source Page for Job Seekers, Sales Teams,](https://www.heyjunior.ai/blog/how-junior-protects-linkedin-account).\n\n## Why Top Founders Are Pivoting to \"Comment-First\" Strategies\n\nIf the goal is to bypass the crowded inbox, turn public visibility into direct interviews, and build a pipeline of interested clients, the \"comment-first\" strategy is the most efficient path for a founder in 2026. \n\nWhen you send a cold DM, you are asking for the prospect's time. When you leave a high-value comment on a prospect's post, you are *giving* them value. You are validating their ideas, adding a new perspective, or expanding on their point for their audience. \n\n### The Psychology of Public Engagement\n\nConsider the psychological difference between these two interactions:\n\n**Scenario A (The DM Approach):** \nA VP of Sales receives a DM from a founder. The DM says, \"Hi, loved your recent post about sales cycles. We built a tool that shortens them by 20%. Want a demo?\" \n*The VP's reaction:* Defense mechanisms go up. It's a pitch disguised as a compliment. They archive the message.\n\n**Scenario B (The Comment Approach):**\nThe VP of Sales posts about how enterprise sales cycles are extending. A founder leaves a comment on the post: \"Seeing the exact same trend in our data. We noticed that deals stalling at the security review stage are the biggest culprit. Have you tried pulling infosec into the multi-threading process earlier?\"\n*The VP's reaction:* Curiosity and validation. The founder added a substantive point to the public discussion. The VP replies to the comment, clicks on the founder's profile, sees they run a relevant startup, and sends a connection request. \n\nIn Scenario B, the founder didn't pitch anything. They demonstrated competence in public. By the time they transition to a DM, it is a warm conversation between peers, not a cold pitch.\n\n### Using Junior to Scale the Strategy\n\nThe challenge with the comment-first approach is scale. Finding the right posts from the right people takes hours of manual filtering. \n\nJunior solves this by bringing the relevant conversations to you. Instead of scrolling aimlessly, Junior finds the discussions happening in your target ICP and drafts a contextual, intelligent reply based on your specific founder bio and goals. You retain editorial control\u2014you review the draft, tweak it if necessary, and post it. \n\nThis workflow allows a founder to execute 20 to 30 high-impact public engagements in the time it would normally take to manually find and write three. It turns commenting from an ad-hoc networking activity into a predictable, scalable pipeline generation engine. For details on how to integrate this into your budget, review the [Junior AI Pricing and Subscription Plans Source Page for Job Seekers, Sales Teams, Le](https://www.heyjunior.ai/blog/junior-ai-pricing-and-subscription-plans).\n\n## Setting Your Own Startup's Social Selling Goals\n\nTo move past theoretical benchmarks and build a practical engine, founders need to define their own internal goals based on their startup's stage and average contract value (ACV). \n\nA bootstrapped consultancy selling $50,000 strategy retainers needs a very different social selling volume than a seed-stage SaaS company selling a $99/month product. \n\n### Step 1: Define the High-Value Discussions\n\nBefore you track metrics, you must define where your target audience spends their time. Who are the macro-influencers they follow? What hashtags or keywords are they using when discussing their pain points? \n\nIf you are selling HR software, your target buyers might not post frequently themselves. In that case, your strategy shouldn't rely on commenting on their nonexistent posts. Instead, you need to identify the top 20 HR thought leaders on the platform and consistently add value in the comment sections of *their* posts. Your target buyers are reading those comments.\n\n### Step 2: Establish Your Baseline Metrics\n\nStart by tracking your baseline for two weeks using a manual comment-first approach. Commit to leaving 10 highly contextual comments a day on relevant posts. \n\nTrack the following:\n*   Total comments left\n*   Profile views generated\n*   Inbound connection requests received\n*   Conversations started via DM (stemming from the comments)\n\nThis establishes your personal conversion rate. For example, if 100 comments over two weeks yield 30 profile views, 5 inbound connections, and 2 solid conversations, you now have a mathematical model for your pipeline. \n\n### Step 3: Layer in Automation for Scale\n\nOnce you have established that the strategy works and your profile is optimized to convert those views into connections, you introduce tools like Junior to scale the input. \n\nIf your manual effort yielded 2 conversations from 100 comments, using Junior to efficiently target and draft 300 comments a month could yield 6 to 10 high-quality conversations, all without risking your account health with cloud-based spam.\n\n## Common Failure Modes in Founder Social Selling\n\nEven with the right strategy and the right benchmarks, many founders fail to generate meaningful pipeline from LinkedIn. Usually, this comes down to one of three common failure modes.\n\n### 1. Delegating Authenticity Completely\n\nThe most damaging mistake a founder can make is attempting to fully automate their voice. Whether delegating their profile to an offshore lead generation agency or using a fully autonomous AI script, the result is the same: the output loses its edge.\n\nPeople buy from people. They are looking for the specific insight, the slightly contrarian opinion, and the hard-earned experience that only the founder possesses. When you use generic AI to generate your comments or posts, you strip away the very things that make a buyer want to talk to you. \n\nAI should be used to draft, format, and discover\u2014not to replace your core perspective. The human must remain in the loop to add the final 10% of nuance before hitting publish.\n\n### 2. Confusing Visibility with Viability\n\nMany founders fall into the trap of optimizing for platform metrics rather than business metrics. They join engagement pods, write polarizing (but irrelevant) posts to game the algorithm, and celebrate getting 50,000 impressions on a post about their morning routine. \n\nIf those 50,000 impressions don't include a single person in your target ICP, the visibility is useless. A post that gets 500 impressions but generates two qualified discovery calls is infinitely more valuable than a viral post that generates zero pipeline. Benchmark your success on conversations started with qualified buyers, not on likes.\n\n### 3. The \"Bait and Switch\" Connection\n\nA frequent mistake in social selling is executing the public engagement perfectly, only to ruin the relationship in the first DM. \n\nA founder leaves a great comment. The prospect replies and sends a connection request. The founder accepts, and immediately sends a multi-paragraph pitch for their product. \n\nThis betrays the trust established in the public feed. When you move to the DM, continue the conversation organically. Ask a follow-up question related to the post. Offer a relevant resource without asking for a meeting. Earn the right to pitch by proving you are a peer, not a vendor looking for a quick transaction.\n\n## KPIs to Track for Comment-Led Growth\n\nTo shift away from traditional DM benchmarks, you need a new dashboard. Here is a standard tracking matrix for a founder utilizing a comment-led social selling motion in 2026.\n\n| Metric | Definition | Healthy Benchmark (2026) | Red Flag Warning |\n| :--- | :--- | :--- | :--- |\n| **Comment to View Ratio** | % of comments that result in a profile view from the poster or audience. | 15% - 25% | < 5% (Comments are too generic or targeting is wrong). |\n| **Inbound Connection Rate** | % of profile viewers who send you a request. | 5% - 10% | < 2% (Profile is not optimized or doesn't clearly state value). |\n| **DM Transition Rate** | % of mutual engagements that move to a productive DM chat. | 30% - 40% | < 10% (Moving to the pitch too aggressively). |\n| **Meeting Booking Rate** | % of productive DM chats that convert to a discovery call. | 10% - 20% | < 5% (Failing to identify actual pain points before asking for time). |\n\nBy tracking these specific conversion points, you can diagnose exactly where your social selling motion is breaking down. If your comment-to-view ratio is high but your inbound connection rate is low, your comments are great, but your profile isn't convincing them to connect. Fix the profile.\n\n## FAQs on Social Selling Metrics and Tools\n\n### What is a good LinkedIn SSI (Social Selling Index) score for a founder?\n\nLinkedIn's Social Selling Index (SSI) is a proprietary metric that measures how effectively you establish your professional brand, find the right people, engage with insights, and build relationships. For a startup founder actively using the platform for pipeline generation, an SSI score above 70 is generally considered strong, placing you in the top tier of your industry network. \n\nHowever, do not obsess over the score itself. The SSI is an indicator of platform activity, not a guarantee of revenue. Focus on the actual meetings booked and pipeline generated.\n\n### How long does it take to see ROI from a comment-first social selling strategy?\n\nUnlike cold calling, where you might book a meeting on day one, social selling is a compounding strategy. \n\nIn the first 30 days, your primary ROI will be an increase in profile views and network growth. Between days 30 and 60, as you consistently appear in the comment sections of your target buyers, you will start seeing inbound DMs and organic conversation starts. By day 90, if you are utilizing a tool like Junior to maintain consistency and scale, you should have a predictable flow of discovery calls originating from public engagements. \n\n### Is AI safe to use for LinkedIn lead generation?\n\nThe safety of AI on LinkedIn depends entirely on the execution model. Cloud-based AI tools that scrape data and automate high-volume DM sequences are extremely risky and frequently lead to account bans. \n\nAI tools that run locally, respect platform limits, and focus on augmenting human behavior (like analyzing context and drafting comments for human review) are generally much safer. They do not trigger the behavioral anomaly flags that traditional automation does. For a detailed breakdown of these safety protocols, consult the [How Does Junior Protect My Linkedin Account Source Guide](https://www.heyjunior.ai/blog/how-does-junior-protect-my-linkedin-account).\n\n## Building Sustainable Pipeline\n\nThe benchmarks for startup social selling have fundamentally changed. The days of treating LinkedIn like a cheap email database are over. Buyers demand relevance, platform algorithms penalize spam, and the noise level in the average decision-maker's inbox makes traditional cold outreach a failing game.\n\nBy pivoting to a comment-first strategy, you align yourself with how modern buyers actually use the platform. They are there to learn, debate, and network in the public feed. When you bring your expertise to those discussions, you build trust before you ever ask for a meeting. \n\nLeveraging local, context-aware AI tools like Junior allows founders to scale this authentic engagement. You can bypass the crowded inbox, protect your account from harmful cloud automation, and build a sustainable, relationship-driven pipeline that compounds over time. Focus on the quality of your conversations, let the software handle the discovery and drafting, and the metrics will follow.", "created_at": "2026-10-30T16:19:22.603835+00:00", "updated_at": "2026-10-30T16:19:22.603841+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
