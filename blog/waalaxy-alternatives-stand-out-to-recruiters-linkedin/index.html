    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 96, "slug": "waalaxy-alternatives-stand-out-to-recruiters-linkedin", "title": "Waalaxy Alternatives for How Job Seekers Can Stand Out to Recruiters On Linkedin", "excerpt": "Stop getting ignored in recruiter DMs. Discover why safe, comment-focused Waalaxy alternatives help job seekers build visibility and land interviews on LinkedIn.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57bswczxq5pnjqdhv1nwbn8b18d611z/waalaxy-alternatives-for-how-job-seekers-can-stand-1788797950749-7zvd61.png", "published_at": "2026-09-07T15:59:00+00:00", "content": "# Waalaxy Alternatives for How Job Seekers Can Stand Out to Recruiters On Linkedin\n\nThe modern job search is structurally broken for the average applicant. Thousands of highly qualified candidates are funneling their resumes into the same applicant tracking systems, hoping to be the one percent that gets a human review. In an attempt to bypass this black box, many job seekers turn to LinkedIn automation tools like Waalaxy, hoping that scraping recruiter profiles and firing off hundreds of automated direct messages will force a conversation. \n\nThe reality is that recruiters are exhausted by this approach. Their inboxes are flooded with identical, automated pitches from candidates, sales reps, and lead generation agencies. When a job seeker uses a mass-DM tool, they are adopting a high-volume sales tactic for a highly nuanced, relationship-driven outcome. \n\nStanding out to recruiters on LinkedIn requires a pivot from outbound volume to inbound visibility. It requires treating your profile like a highly optimized landing page and generating traffic to that page through public, intelligent engagement. Traditional cloud-based connection tools are the wrong instrument for this job. \n\nThis guide breaks down why the spray-and-pray DM approach fails, how to optimize your profile to capture recruiter attention, and how utilizing authentic, commenting-focused Waalaxy alternatives can help you bypass the crowded inbox entirely.\n\n## The Flawed Architecture of Automated Direct Messaging\n\nTo understand why a different approach is necessary, you have to look at the mechanics of tools like Waalaxy and why they are actively harming job seekers' chances. \n\n### Recruiter Inbox Fatigue\nRecruiters live in LinkedIn Recruiter and their standard LinkedIn inbox. Every day, they receive dozens of connection requests accompanied by pitches that follow the exact same template: *\"Hi [Name], I saw you are a recruiter at [Company]. I am a highly motivated [Role] looking for my next opportunity. Please see my resume.\"* \n\nBecause Waalaxy and similar tools make it effortless to send hundreds of these messages a week, the value of a cold DM has plummeted to zero. Recruiters have developed blindness to these messages. They rely on their own targeted Boolean searches to find candidates, or they look at warm referrals. A cold, automated DM from a stranger actively signals that the candidate is relying on volume rather than targeted, genuine interest in the company.\n\n### The Technical Risks of Cloud Automation\nBeyond the strategic failure of mass messaging, there is a severe technical risk. Tools like Waalaxy operate in the cloud. They log into your LinkedIn account from a server IP address that is likely located hundreds of miles away from your actual location. \n\nLinkedIn's security algorithms are highly tuned to detect this behavior. If your account shows activity originating from an AWS server in Virginia while you are browsing on your phone in London, the system flags the anomaly. Furthermore, if a cloud tool suddenly sends 50 connection requests in two hours\u2014a volume of activity a human could not organically sustain\u2014your account is flagged for automation. \n\nThe consequences range from temporary shadowbans (where your profile stops appearing in recruiter searches) to permanent account restrictions. For a job seeker, losing access to LinkedIn is a catastrophic setback. This is why professionals evaluating [Phantombuster alternatives for automate Linkedin comments safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) are increasingly abandoning cloud-based scrapers.\n\n![Diagram comparing cloud automation IP security risks with safe local machine browser execution.](https://assets.bevisible.app/inline-images/j57bswczxq5pnjqdhv1nwbn8b18d611z/inline-1-1788797880694-la92gt.png)\n### The Shift to Public Visibility\nIf the inbox is guarded and automated DMs trigger spam filters, the only remaining avenue is the public feed. When a recruiter, a talent acquisition manager, or a VP of Engineering posts content on LinkedIn, they are looking for engagement. They want likes, comments, and visibility for their own employer brand. \n\nProviding that engagement is the most effective way to get noticed. A thoughtful, highly relevant comment on a hiring manager\u2019s post puts your name, your headline, and your face directly in their notifications\u2014a space they actively check and enjoy checking, unlike their spam-filled inbox.\n\n## Phase 1: Optimizing Your Profile for LinkedIn Recruiter (SEO)\n\nBefore you begin any engagement strategy, your profile must be built to convert. If you write a brilliant comment that convinces a recruiter to click your name, but your profile is vague or incomplete, the interaction ends there.\n\nRecruiters do not scroll the standard LinkedIn feed to find candidates. They use a paid enterprise product called LinkedIn Recruiter, which functions like a highly specialized search engine. To stand out, you must apply Search Engine Optimization (SEO) principles to your profile.\n\n### Engineering Your Headline for Search\nYour headline is the most heavily weighted field in LinkedIn's search algorithm. It is also the text that follows your name everywhere on the platform\u2014in the feed, in comments, and in connection requests. \n\nThe most common mistake job seekers make is using their headline to announce their employment status rather than their value. Headlines like \"Actively Seeking New Opportunities\" or \"Unemployed and looking for work\" consume valuable real estate with zero searchable keywords. A recruiter searching for a \"Senior Financial Analyst\" will never find a profile optimized for \"Seeking Opportunities.\"\n\nInstead, your headline must be packed with the exact terminology recruiters use. You must incorporate crucial keywords into your profile; ensure you include the specific industry terms, software tools, and job titles you are targeting, as recruiters search for these precise elements [1](https://www.linkedin.com/blog/member/archive/7-secrets-to-attracting-recruiters-on-linkedin).\n\nA strong headline formula is: **[Target Job Title] | [Key Skill 1, Key Skill 2, Key Skill 3] | [Specific Achievement or Niche]**\n\n*Example:* Technical Product Manager | Agile, Jira, API Integrations | Scaling B2B SaaS Platforms\n\n### Structuring the Experience and Skills Sections\nRecruiters use filters to narrow down candidates by years of experience, specific skills, and past companies. Your experience section must be more than a copied-and-pasted resume. It needs context. \n\nWhen detailing your experience, ensure your skills section is meticulously updated and tied to specific roles, as recruiters rely heavily on these backend criteria to filter candidate pools [2](https://www.instagram.com/reel/DZe1NMxEvwh/). For every role listed, include a brief paragraph explaining the scope of your responsibility, followed by 3-4 bullet points highlighting quantifiable achievements. \n\nDo not rely on the standalone \"Skills\" section at the bottom of your profile. You must embed these keywords naturally throughout your \"About\" summary and your \"Experience\" descriptions. LinkedIn's algorithm looks for keyword density and context, rewarding profiles that repeatedly demonstrate a specific competency.\n\n![Wireframe diagram breaking down profile optimization elements for LinkedIn Recruiter search algorithms.](https://assets.bevisible.app/inline-images/j57bswczxq5pnjqdhv1nwbn8b18d611z/inline-2-1788797881350-1za1hl.png)\n### The \"Open to Work\" Signal: Tactics and Nuance\nLinkedIn allows you to formally signal your availability to recruiters. You can enable the \"Open to Work\" feature from your profile preferences, which flags your account in LinkedIn Recruiter searches as someone actively looking for a job [3](https://www.linkedin.com/help/linkedin/answer/a507508/let-recruiters-know-you-re-open-to-work?lang=en).\n\nThere are two ways to use this feature:\n1.  **Recruiters Only:** This silently alerts users of LinkedIn Recruiter (outside of your current company) that you are open to outreach. \n2.  **All LinkedIn Members (The Green Banner):** This places a green `#OpenToWork` frame around your profile photo.\n\nThe use of the visible green banner is a subject of intense debate among hiring professionals. Some argue it helps network connections know you need assistance, while others suggest it can sometimes carry a stigma or reduce perceived leverage in negotiations [4](https://www.instagram.com/reel/DZe1NMxEvwh/). \n\nFor most job seekers, the safest and most effective route is to use the **Recruiters Only** setting. It gives you the algorithmic boost in backend searches without altering your public branding. Your public branding should remain focused on your expertise, not your availability.\n\n### Professional Presentation\nThe visual elements of your profile matter for human conversion, even if they do not impact the search algorithm. Ensure you use a professional, friendly, and well-lit headshot [5](https://www.linkedin.com/blog/member/archive/7-secrets-to-attracting-recruiters-on-linkedin). A clear photo establishes trust immediately. \n\nSimilarly, use your background banner to reinforce your industry or expertise. A software engineer might use a clean, abstract tech graphic; a marketer might showcase a banner from a major campaign they ran. Avoid leaving the default gray background, as it signals a lack of attention to detail.\n\n## Phase 2: Shifting from Cold DMs to Strategic Visibility\n\nOnce your profile is optimized to catch recruiter searches, you need an active strategy to drive traffic to it. Relying entirely on passive search (waiting for recruiters to find you) or standard job applications is a high-friction path, because sometimes simply hitting apply is what prevents candidates from actually getting noticed [6](https://www.youtube.com/shorts/1jnwJqMfQBA). \n\nYou must network your way in, but doing so via cold DMs often fails, as your LinkedIn outreach strategy might be the very reason recruiters are ignoring you [7](https://www.instagram.com/reel/DZxMT8ytrAl/). \n\nThe alternative is **strategic public commenting**.\n\n### The Psychology of Public Commenting\nWhen a hiring manager or an internal recruiter posts an article, a company update, or an industry thought, they are investing time into building their own brand. They crave validation in the form of engagement.\n\nWhen you leave a highly contextual, intelligent comment on their post, you trigger the psychological principle of reciprocity. They feel compelled to read your comment, reply to it, and\u2014crucially\u2014click your profile to see who you are. \n\nUnlike a cold DM, which is a private demand for their time, a public comment is a gift of engagement. It demonstrates your expertise in a low-pressure environment. If you consistently comment on a target company's posts over a period of two weeks, you build familiarity. When your application eventually crosses their desk, or when you finally do send a connection request, you are no longer a stranger; you are a recognizable, valued contributor.\n\n### Targeting the Right Audiences\nTo make this strategy work, you cannot comment randomly. You need to identify the exact people who have the power to hire you. \n\n1.  **Internal Recruiters / Talent Acquisition:** Search for recruiters at your target companies. They frequently post about open roles, company culture, and interview tips. Commenting on these posts keeps you top-of-mind.\n2.  **Hiring Managers:** If you are a UX Designer, find the VP of Design or the Lead Product Manager at the companies you want to work for. Engage with their thoughts on industry trends. Proving your competence to the hiring manager is often more effective than going through the HR recruiter.\n3.  **Industry Thought Leaders:** Engaging with highly visible voices in your specific niche exposes your comments to their vast audiences, which often include recruiters looking for active, knowledgeable professionals.\n\n## Evaluating Waalaxy Alternatives for Engagement-First Job Seeking\n\nIf you accept that commenting is superior to mass DMs, your tooling must change. You need a platform built for finding conversations and drafting context-aware replies, not a tool built for scraping emails and blasting sequences.\n\nWhen evaluating an [Automate Linkedin comments safely evaluation checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist), there are two primary technical and functional criteria you must prioritize: Execution Architecture and AI Context.\n\n### Criterion 1: Local vs. Cloud Execution\nAs mentioned earlier, cloud-based tools run on remote servers. They trigger LinkedIn's geographic and IP-based security warnings. \n\nThe safer alternative is **local execution**. A local tool runs directly on your own machine, using your actual browser session and your actual IP address. To LinkedIn, the activity looks exactly like you sitting at your desk, clicking and typing. This virtually eliminates the risk of location-based bans. \n\n### Criterion 2: Context-Aware Generation vs. Generic Spam\nMany basic AI commenting tools use rudimentary prompts like \"Write a positive comment for this post.\" The result is a flood of robotic, generic replies: *\"Great post! I completely agree. Thanks for sharing.\"*\n\nRecruiters despise these comments. They add no value and immediately flag the user as someone automating their engagement. \n\nA high-quality Waalaxy alternative must ingest your unique professional background, your specific career goals, and the nuanced context of the original post to draft a reply that actually sounds like you. It should challenge premises, add secondary examples, or ask intelligent follow-up questions.\n\n![Comparison card contrasting low-value generic automated comments against context-aware personalized drafts.](https://assets.bevisible.app/inline-images/j57bswczxq5pnjqdhv1nwbn8b18d611z/inline-3-1788797874448-w76k5v.png)\n## How Junior Acts as the Premier Waalaxy Alternative for Job Seekers\n\nFor job seekers transitioning from cold outreach to authentic visibility, Junior provides the infrastructure to execute this strategy safely and effectively. Built specifically as an AI-powered LinkedIn automation tool for authentic conversations, Junior fundamentally differs from cloud-based connection tools.\n\n### The Safety of Local Machine Operation\nJunior protects your LinkedIn account by operating entirely locally. It does not route your activity through remote proxy servers. It uses natural interaction patterns\u2014mimicking human scrolling, reading delays, and typing speeds\u2014to ensure your account remains secure. This makes it a critical tool for [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), completely bypassing the risks associated with cloud scrapers like Waalaxy.\n\n### Personality-Driven AI Commenting\nInstead of generic praise, Junior is trained on your specific bio, industry expertise, and current goals. If you are a data scientist looking for roles in healthcare, Junior uses that context when analyzing posts. \n\nWhen a healthcare executive posts about the challenges of predictive analytics in patient care, Junior doesn't just say \"Great insights.\" It drafts a response that references your background in data models and adds a specific, relevant thought based on your profile. You review the draft, tweak it if necessary, and post. This ensures every interaction builds your authority.\n\n### Networking in Public\nJunior is designed to find the conversations that matter. By identifying relevant discussions rather than just scraping lists of names, it allows you to bypass the crowded inbox. \n\nThis approach is not only effective for traditional W2 job seekers but also highly relevant for independent professionals. The mechanics of demonstrating value publicly are identical to the strategies used when comparing [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). In both cases, proving your expertise in the comments generates inbound pipeline far more effectively than begging for attention in the DMs.\n\n## Executing the \"Comment-to-Interview\" Playbook\n\nTo put this into practice, you need a structured daily routine. Abandoning mass DMs means replacing them with targeted, high-quality public interactions. Here is the step-by-step playbook for standing out to recruiters using an engagement-first strategy.\n\n### Step 1: Curate Your Target List\nDo not rely on the algorithm to feed you relevant posts. You must build a targeted feed.\nIdentify 15-20 companies you actively want to work for. Use LinkedIn search to find the key internal recruiters, talent acquisition leads, and department heads (your potential future bosses) at those companies. Follow them, and ring the notification bell on their profiles so you are alerted when they post.\n\n### Step 2: Establish a Daily Engagement Routine\nDedicate 20 to 30 minutes a day to reviewing the content published by your target list. \nInstead of sending 50 cold connection requests, your goal is to leave 5 to 10 highly valuable comments on posts from decision-makers. Look for posts where the author is asking a question, sharing a recent company win, or discussing a frustrating industry trend.\n\n### Step 3: Draft High-Value Responses\nUse Junior to analyze the context of the post and generate a draft that incorporates your specific professional lens. \n\nIf a VP of Sales at a target company posts about the difficulty of maintaining CRM hygiene, and you are applying for a Revenue Operations role, your comment should offer a brief, actionable solution or share a brief anecdote about how you solved that exact problem in your last role. \n\n**The Anatomy of a Perfect Comment:**\n*   **Acknowledge the core premise:** Validate the author's point.\n*   **Add an original insight:** Bring in a new statistic, a personal experience, or a slight pivot to the idea.\n*   **Ask a clarifying question:** End the comment by asking the author to expand on a specific point, which encourages them to reply to you, further boosting your visibility.\n\n| Tactic | The Old Way (Waalaxy / Mass DM) | The New Way (Junior / Targeted Comments) |\n| :--- | :--- | :--- |\n| **Approach** | Private, uninvited cold pitch | Public, contextual value addition |\n| **Volume** | High volume, low conversion | Low volume, high conversion |\n| **Risk Profile** | High risk of account restriction | Low risk, safe local execution |\n| **Recruiter Perception** | Annoying, desperate, spammy | Insightful, authoritative, collaborative |\n\n### Step 4: The Transition to the Inbox\nAfter you have engaged with a target individual 3 or 4 times over a couple of weeks, they will recognize your name. *Now* is the time to send the connection request. \n\nBecause you have built familiarity, your connection request doesn't need a heavy pitch. It can simply be: *\"Hi [Name], I've really enjoyed our back-and-forth in the comments on your recent posts about CRM data. I'd love to formally connect and keep following your updates.\"*\n\nOnce connected, you have established a warm relationship. When a role opens up, or when you eventually decide to ask for an informational interview, you are operating as a known entity rather than a cold applicant.\n\n## Common LinkedIn Job Search Mistakes to Avoid\n\nEven with the right strategy and the right Waalaxy alternatives, poor execution can sabotage your efforts. Avoid these critical failure modes.\n\n### The Desperate Pitch in Comments\nA public comment is not the place to ask for a job. Never write, *\"Great point on marketing analytics! By the way, I am currently looking for a Marketing Manager role, please check my profile.\"* \n\nThis instantly ruins the value of the comment. It turns an intellectual contribution into a transactional plea. Let your optimized headline do the heavy lifting. If your comment is smart, they will hover over your name, see your headline (e.g., *Marketing Manager | Data Analytics*), and click through on their own.\n\n### Over-Reliance on Pure Automation\nWhile [best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) can handle the heavy lifting of drafting context-aware responses and maintaining safety, you cannot simply click \"approve\" on every AI draft without reading it. \n\nYou must remain the editor-in-chief of your profile. Review the drafts provided by Junior. Add your own specific tone or a highly localized reference that only you would know. AI is the co-pilot that helps you scale your authentic voice, not a replacement for your actual expertise.\n\n### Ignoring the Algorithm's Dwell Time\nLinkedIn measures how long people spend reading your comments and viewing your profile. If you leave short, punchy comments (\"Totally agree!\"), people scroll right past. If you leave structured, thoughtful paragraphs that require the reader to click \"See more,\" you increase dwell time, which signals to LinkedIn that your profile is high-value, organically boosting your overall search visibility.\n\n## FAQs on Standing Out to Recruiters on LinkedIn\n\n**Do recruiters actually read the comments on their posts?**\nYes. For most professionals, publishing on LinkedIn is a branding exercise. They are highly attentive to the notifications they receive on their own content. A well-crafted comment is read with much more attention than a generic DM buried in a folder of 100 other cold pitches.\n\n**Is it safe to use AI tools for LinkedIn engagement?**\nIt depends entirely on the architecture of the tool. Cloud-based scraping and mass-DM tools carry significant risk of account bans. However, tools that operate locally on your machine and focus on generating context-aware drafts for your review\u2014like Junior\u2014are safe because they mimic natural human behavior and do not violate IP location rules.\n\n**Should I reach out to recruiters or hiring managers?**\nBoth, but with different approaches. Recruiters are focused on matching keywords to open requisitions; they are best targeted through profile SEO and the \"Open to Work\" backend signal. Hiring managers (department heads, VPs) are focused on finding competent problem-solvers; they are best targeted through public engagement and demonstrating your expertise in the comments of their posts.\n\n**How long does it take for inbound engagement strategies to work?**\nBuilding visibility is a compounding effort. While a single great comment might lead to a profile view today, consistent daily engagement usually takes 3 to 4 weeks to establish the familiarity required to easily transition into warm networking calls or direct interview pipelines. \n\nTo win on LinkedIn today, job seekers must stop acting like automated sales bots. By optimizing your profile for searchability and replacing aggressive Waalaxy outreach with the thoughtful, AI-assisted public engagement powered by Junior, you can bypass the noise, protect your account, and force recruiters to pay attention to your actual expertise.", "created_at": "2026-09-07T16:19:25.003607+00:00", "updated_at": "2026-09-07T16:19:25.003612+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {

                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
