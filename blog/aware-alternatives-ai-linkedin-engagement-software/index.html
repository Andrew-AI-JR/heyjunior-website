    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 118, "slug": "aware-alternatives-ai-linkedin-engagement-software", "title": "Aware Alternatives for AI Linkedin Engagement Software for Social Selling", "excerpt": "Explore top Aware alternatives for AI LinkedIn engagement and social selling. Compare tools for comment-led networking, analytics, and safe automation.", "featured_image_url": "https://assets.bevisible.app/featured-images/j57dkv3xrd27pegmwcaakpk6wh8f7y55/aware-alternatives-for-ai-linkedin-engagement-soft-1790614113462-buh1jb.png", "published_at": "2026-10-01T16:18:00+00:00", "content": "# Aware Alternatives for AI Linkedin Engagement Software for Social Selling\n\nOpen your LinkedIn inbox right now. Chances are, you are staring at a graveyard of generic, AI-generated pitches that all follow the exact same template. They usually start with a false sense of familiarity, compliment an arbitrary recent milestone, and immediately ask for fifteen minutes on your calendar. For job seekers, sales teams, lead gen agencies, and founders, this traditional approach to cold outbound on LinkedIn is yielding diminishing returns. The inboxes are saturated, buyers have developed advanced spam filters in their brains, and connection request acceptance rates are plummeting. \n\nSocial selling has fundamentally shifted. It is no longer about forcing your way into a private message thread. True social selling today happens in the public square\u2014in the feed, within the comment sections of industry leaders, and through meaningful, context-aware interactions that build familiarity over time. \n\nSoftware like Aware has historically helped teams monitor conversations, analyze employee advocacy, and measure audience sentiment. But passive listening and analytics only take you so far. When your goal is to turn public visibility into direct interviews, pipeline, and client conversations, you need tools that bridge the gap between listening and active, intelligent engagement. You need software that actually helps you start authentic conversations without resorting to generic spam.\n\nIf you are evaluating AI LinkedIn engagement software for social selling and want to move beyond basic listening or outdated InMail blasters, this guide breaks down the landscape. We will explore the mechanics of modern social selling, why commenting is replacing cold DMs, and the top alternatives that prioritize context, safety, and authentic relationship building.\n\n## The Evolution of Social Selling on LinkedIn\n\nTo understand why professionals are seeking alternatives to passive listening tools or aggressive connection bots, we have to look at how LinkedIn\u2019s algorithm and user behavior have evolved.\n\nFive years ago, scraping a list of target accounts and dumping them into a cloud-based sequencer was enough to generate meetings. You could send a hundred connection requests a day, follow up with automated messages, and play a pure numbers game. \n\nToday, LinkedIn heavily restricts connection volume, capping most users at around 100 to 200 requests per week. Furthermore, the platform\u2019s spam detection algorithms actively identify and throttle accounts that exhibit bot-like behavior, such as sending identical messages at superhuman speeds from cloud server IP addresses. \n\nMore importantly, buyer psychology has changed. When a prospect receives a cold DM, their immediate instinct is defensive. They know a pitch is coming. However, when you leave an insightful, additive comment on a post they just published, their reaction is entirely different. They feel validated. You are participating in their world, on their terms, in a public forum where others can see your expertise. \n\n### Why Commenting Outperforms Cold Messaging\n\nEngaging through strategic post commenting offers several structural advantages over direct messaging:\n\n*   **Bypassing the Inbox Shield:** You do not need a prospect to accept your connection request to comment on their public posts. You bypass the friction of the initial connection entirely.\n*   **The Amplification Effect:** A well-crafted comment is not just seen by the post author; it is seen by their entire audience. A single thoughtful response can attract inbound profile views from second and third-degree connections who agree with your perspective.\n*   **Contextual Relevance:** A cold DM forces you to invent a reason for reaching out. A comment naturally piggybacks on a topic the prospect already cares about\u2014because they just wrote a post about it.\n*   **Status Positioning:** When you consistently add value to industry discussions, you position yourself as a peer and a subject matter expert rather than a subordinate vendor begging for a meeting.\n\nThis is where AI enters the equation. The bottleneck of a comment-led social selling strategy is time. Reading dozens of posts, synthesizing the core arguments, and drafting thoughtful, non-generic responses takes hours. Modern AI engagement software solves this by doing the heavy lifting of context extraction and drafting, allowing the user to simply review, edit, and post.\n\n![Diagram comparing the low-response cold DM approach versus the amplified reach of comment-led social selling.](https://assets.bevisible.app/inline-images/j57dkv3xrd27pegmwcaakpk6wh8f7y55/inline-1-1790614063105-3kos8e.png)\n## What to Look for in AI Engagement Software\n\nNot all AI tools are built the same. The market is currently flooded with generic wrappers that simply send a post's text to an LLM with the prompt \"write a positive comment.\" This results in embarrassing, robotic replies like \"Great insights! Thanks for sharing!\" which actually harm your personal brand.\n\nIf you are evaluating alternatives, use this criteria to filter out the noise:\n\n### Contextual Awareness and Personalization\nThe AI must be able to do more than summarize the post. It needs to understand *who* you are. The best tools allow you to input your unique bio, your professional goals, your specific tone of voice, and your contrarian industry opinions. When the AI drafts a reply, it should sound like you wrote it, weaving your specific expertise into the response. \n\n### Account Safety and Technical Architecture\nThis is a critical failure point for many platforms. Cloud-based automation tools log into your LinkedIn account from remote servers. LinkedIn\u2019s security systems easily detect when your account is suddenly active from an AWS IP address in Virginia while you are physically located in London. Safe AI engagement requires a local-first approach. The software should run directly on your own machine, using your own IP address and your own browser session, mimicking natural human interaction patterns.\n\n### Workflow and Human-in-the-Loop\nYou should never allow an AI to auto-post on your behalf without human review. The software should act as a brilliant drafter, not an autonomous agent. The ideal workflow involves the software queuing up relevant posts, offering you context-aware drafts, and requiring you to click a button to approve or tweak the comment before it goes live. \n\n### Pipeline Attribution\nSocial selling is ultimately about revenue or career advancement. The tool should help you track which engagements are turning into profile views, connection requests, and eventually, off-platform conversations.\n\n## Top Aware Alternatives for AI LinkedIn Engagement\n\nWith the criteria established, let us examine the specific tools that can facilitate a modern, engagement-first social selling strategy.\n\n### 1. Junior: The Local, Comment-Led Engagement Engine\n\nWhile Aware focuses heavily on enterprise analytics and risk management across digital channels, Junior is built specifically for individual practitioners\u2014job seekers, sales teams, lead gen agencies, founders, and consultants\u2014who need to generate pipeline right now.\n\nJunior takes a fundamentally different approach to LinkedIn automation. Instead of focusing on cold direct messages or passive analytics, Junior is an AI-powered automation tool designed to start authentic conversations strictly through strategic post commenting. \n\nThe most significant differentiator is how Junior handles context. You do not get generic \"Great post!\" replies. Junior learns your unique bio, your value proposition, and your specific goals. It actively searches LinkedIn for discussions relevant to your niche. When it finds a target post, it reads the content and drafts a highly specific, human-sounding reply that injects your perspective into the conversation. \n\nFurthermore, Junior is built entirely around account safety. Unlike cloud-based connection tools that put your profile at risk of being restricted, Junior runs locally on your own machine. It uses your existing browser session and IP address, executing actions with natural, randomized delays that mimic genuine human interaction patterns. \n\nFor professionals who want to completely replace cold DMs with a strategy that actually turns public visibility into direct interviews and client conversations, Junior provides the safest and most effective architecture. If you are comparing different approaches to network growth, you might find this analysis on [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth) helpful for understanding the difference between content-led and engagement-led strategies.\n\n### 2. Shield Analytics: The Data-Driven Alternative\n\nIf your primary use case for Aware was measuring the impact of your team's organic content, Shield Analytics is the closest direct alternative in the personal branding space. Shield does not automate engagement or draft comments; instead, it provides deep, granular analytics on your LinkedIn performance.\n\nShield pulls data on post views, engagement rates, audience demographics, and historical trends, allowing you to see exactly which topics resonate with your target market. For social selling teams that rely on a \"content-first\" strategy\u2014where founders or sales reps post daily to attract inbound leads\u2014Shield is exceptional at proving ROI.\n\nHowever, Shield is purely observational. It will tell you that a specific post performed well, but it will not help you capitalize on that momentum by engaging with the people commenting on it, nor will it help you proactively engage with your prospects' posts. It is a measurement tool, not an action tool.\n\n### 3. Taplio: The All-in-One Content Suite\n\nTaplio is a popular choice for founders and agencies looking to build a massive audience. It combines content scheduling, AI-assisted post generation, and some engagement features into a single cloud-based dashboard. \n\nFor social selling, Taplio allows you to organize prospects into lists and engage with their content from within its interface. Its AI can suggest post ideas based on trending topics in your industry, which helps maintain a consistent publishing schedule. \n\nThe tradeoff with Taplio lies in its architecture. Because it is a cloud-based application, it requires you to hand over your LinkedIn session cookies to their servers. While they take precautions, this inherently carries more risk than a localized solution. Additionally, while its content creation AI is robust, its engagement AI often trends toward the generic unless heavily prompted. \n\nFor a deeper dive into evaluating tools that generate responses safely, you can review our [AI Tools for Linkedin Commenting Evaluation Checklist](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist).\n\n### 4. Dripify: Traditional Sequence Automation\n\nDripify represents the old guard of LinkedIn social selling. It is a classic sequence automation platform designed to string together profile views, connection requests, and direct messages into multi-step campaigns. \n\nIf your strategy absolutely relies on sending high volumes of cold direct messages, Dripify offers an intuitive visual campaign builder. You can set up workflows like: *View Profile -> Wait 1 Day -> Send Connection Request -> Wait 2 Days -> Send Message 1*.\n\nThe problem with this approach in 2026 is that buyers are exhausted by these exact sequences. When a prospect sees a connection request followed immediately by a pitch, they often disconnect or report the message as spam. While Dripify does its job well technically, the methodology it relies on is losing efficacy. \n\nMany consultants and service providers are finding that pivoting away from these automated message sequences yields higher quality leads. For a direct comparison of these methodologies, read [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n### 5. Phantombuster: Multi-Channel Scraping and Actions\n\nPhantombuster is a highly technical tool that operates via discrete \"Phantoms\" (scripts) that perform specific actions on LinkedIn and other platforms. You can use it to scrape search results, extract event attendees, auto-like posts, or send connection requests.\n\nFor growth hackers who want to build complex, multi-tool workflows\u2014such as scraping a list of LinkedIn commenters, finding their corporate email addresses via a third-party API, and pushing them into a cold email sequence\u2014Phantombuster is incredibly powerful. \n\nHowever, it is not user-friendly for the average sales professional or job seeker. It requires managing rate limits manually, dealing with broken session cookies, and connecting APIs. Furthermore, because it executes actions from the cloud, it carries significant safety risks if you push the volume too high. If you are looking for safer ways to manage public interactions, check out our guide on [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely).\n\n![Comparison overview of Aware alternatives for LinkedIn engagement and social selling architectures.](https://assets.bevisible.app/inline-images/j57dkv3xrd27pegmwcaakpk6wh8f7y55/inline-2-1790614063805-pg0ktg.png)\n## Implementing a Comment-First Social Selling Strategy\n\nSwitching from a DM-first to a comment-first strategy requires a shift in mindset. You are no longer hunting for immediate conversions; you are farming for attention, trust, and reciprocity. Here is how to implement this strategy using AI engagement software.\n\n### Phase 1: Mapping the Ecosystem\n\nBefore you deploy any AI, you need to know who you want to talk to. Social selling is useless if you are engaging with the wrong crowd. \n\nCreate specific lists of:\n1.  **Direct Prospects:** The exact decision-makers you want to sell to or work for.\n2.  **Industry Influencers:** People who already have the attention of your direct prospects.\n3.  **Peers and Connectors:** People adjacent to your industry who actively network and refer business.\n\nYour goal is to show up consistently in the notifications of your direct prospects, but also to leave high-value comments on the posts of industry influencers so that their large audience sees your expertise.\n\n### Phase 2: Tuning the AI Context\n\nThis is where the magic happens. If your AI tool allows for custom instructions, you must spend time tuning your bio. Do not just paste your resume. \n\nProvide the AI with:\n*   Your core value proposition (e.g., \"I help mid-market SaaS companies reduce churn through better onboarding\").\n*   Your tone guidelines (e.g., \"Keep it professional but conversational. Do not use emojis. Never start a sentence with 'I completely agree'.\").\n*   Your contrarian takes (e.g., \"I believe that product-led growth is overrated for complex enterprise software\").\n\nWhen the AI has this context, it can read a prospect's post about customer success and draft a reply that actually contributes a unique, experienced perspective rather than just summarizing what the prospect already said.\n\n### Phase 3: The Daily Workflow\n\nConsistency is the primary driver of success in social selling. Set a daily goal\u2014for example, 20 high-quality comments per day. \n\nInstead of spending two hours manually hunting for posts and writing replies, use your software to queue up recent activity from your target lists. Review the AI-generated drafts. \n\nHere is where the \"human-in-the-loop\" concept is vital. Read the prospect's post, read the AI draft, and ask yourself: *Does this sound like me? Does it add value?* Tweak a few words to make it perfect, and post it. You can now execute two hours of high-level networking in about fifteen minutes. \n\nOver time, this strategy results in a steady stream of inbound profile views. Prospects see your thoughtful comments, click on your profile, read your optimized headline, and send *you* the connection request. You have successfully bypassed the crowded inbox. For further insights on optimizing this daily routine, you can explore the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow).\n\n## A Mini-Case Study: Finding Consulting Clients Without Cold InMails\n\nConsider the scenario of an independent fractional CFO targeting series A tech startups. For months, this consultant paid for LinkedIn Sales Navigator and sent 50 highly personalized InMails every week to startup founders. The response rate was abysmal\u2014less than 2%. \n\nThe problem was not the targeting; it was the medium. Founders guard their inboxes ruthlessly. When they see a pitch from a fractional CFO, they ignore it unless they are actively in a financial crisis that exact day.\n\nThe consultant completely abandoned cold InMails and switched to a comment-led strategy using local AI software. They created a target list of 100 startup founders and 20 prominent venture capitalists who fund those startups. \n\nEvery morning, the software surfaced posts from these individuals. When a VC posted about runway management, the AI drafted a nuanced comment based on the consultant's specific background in extending runway through optimized vendor contracts. The consultant tweaked the draft and posted it. \n\nWithin three weeks, the dynamic completely flipped. Instead of begging for meetings in private, the consultant was debating financial strategy in public. A founder saw one of these comments, clicked through to the consultant\u2019s profile, and sent a direct message asking for help with an upcoming board deck. \n\nThe consultant generated a $5,000/month retainer without sending a single cold pitch. They turned public visibility directly into pipeline by showing their expertise rather than just claiming it. \n\n## Evaluating Safety: The Local vs. Cloud Architecture Debate\n\nWhen researching AI LinkedIn engagement software, the most critical technical distinction you will encounter is how the software actually executes actions on your behalf. Understanding this difference is the key to protecting your account from bans and restrictions.\n\n### Cloud-Based Execution (High Risk)\nCloud-based tools operate on remote servers. When you connect your LinkedIn account to a cloud tool, you are typically providing it with your session cookie. The tool\u2019s servers then log into LinkedIn and perform actions\u2014sending messages, liking posts, or scraping data\u2014from their own IP addresses.\n\nLinkedIn\u2019s security algorithms are highly sophisticated. If you log into LinkedIn from your smartphone in New York at 9:00 AM, and a cloud server in Frankfurt simultaneously executes a batch of 50 connection requests on your behalf at 9:05 AM, LinkedIn immediately flags the geographic and IP discrepancy. Repeated violations of this nature result in temporary restrictions, account logouts, and eventual permanent bans. Furthermore, cloud tools often struggle to perfectly mimic browser fingerprints, making them easily identifiable as headless bots.\n\n### Local-Machine Execution (High Safety)\nLocal tools represent a newer, safer generation of automation. Instead of running on a remote server, the software installs directly on your desktop or laptop. It integrates seamlessly with your actual browser (like Chrome or Edge).\n\nWhen a local tool performs an action, it uses your computer\u2019s specific IP address, your unique browser fingerprint, and your active session. From LinkedIn\u2019s perspective, there is absolutely no difference between you manually clicking a button and the local software clicking it for you. \n\nFurthermore, well-designed local software introduces natural, randomized delays. It will pause for three seconds, scroll the page naturally, wait another five seconds, and then type a comment at a human-like pace. This approach makes it virtually impossible for algorithmic detection systems to distinguish the software from a human user. \n\nIf safeguarding your profile is a priority while scaling your social selling efforts, we highly recommend reading our deep dive on [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Understanding the Limits of AI in Social Selling\n\nWhile AI provides incredible leverage, it is important to acknowledge its limitations and failure modes. Professionals who treat AI as a completely autonomous \"set it and forget it\" solution inevitably damage their personal brands. \n\nHere are common edge cases where relying entirely on automation fails, and why a human reviewer is always necessary:\n\n### 1. Misinterpreting Sarcasm or Irony\nLarge Language Models have improved dramatically, but they still occasionally struggle with dry humor, sarcasm, or highly contextual industry inside jokes. If a prospect posts a sarcastic complaint about a new software update, an unsupervised AI might misread the tone and leave an aggressively enthusiastic comment praising the update, making you look completely out of touch.\n\n### 2. Commenting on Sensitive or Tragic Posts\nLinkedIn has unfortunately become a place where people share deeply personal stories, including layoffs, illnesses, or the loss of loved ones. If an AI is set to auto-comment based on keywords, it might detect the word \"transition\" in a post about a painful career layoff and reply with an inappropriate, upbeat comment about embracing new opportunities. This is catastrophic for a personal brand. Reviewing every comment prevents this.\n\n### 3. Hallucinating Expertise\nIf your bio tells the AI you are an expert in cybersecurity, it might occasionally overextend itself and invent technical facts, fake statistics, or nonexistent security protocols to make the comment sound authoritative. You must read the drafts to ensure every claim aligns with reality and your actual knowledge base.\n\n## Measuring the ROI of Social Selling Engagement\n\nWhen you transition away from tools like Aware (which provide high-level brand analytics) to active engagement tools, you need a new framework for measuring success. Because you are not sending direct pitches, you cannot measure \"reply rates\" in the traditional sense. \n\nInstead, track these leading and lagging indicators:\n\n**Leading Indicators:**\n*   **Daily Output:** Are you successfully leaving 15-20 high-quality comments per day?\n*   **Notification Frequency:** Are prospects \"liking\" or replying to your comments? (This indicates your AI drafts are hitting the right note).\n*   **Inbound Profile Views:** Is your public engagement driving traffic back to your personal page?\n\n**Lagging Indicators:**\n*   **Inbound Connection Requests:** Are second and third-degree connections reaching out to you based on your comments?\n*   **Inbound DMs:** Are prospects messaging you to ask about your services or experiences?\n*   **Pipeline Generated:** How many booked meetings can be traced back to an initial interaction in the feed?\n\nStandard markdown tables can help visualize the shift in metrics when moving from a DM strategy to a commenting strategy:\n\n| Metric Category | Traditional Cold DM Strategy | Comment-Led Social Selling Strategy |\n| :--- | :--- | :--- |\n| **Primary Action** | Outbound Connection + Message | Public Comment on Prospect's Post |\n| **Success Metric** | Message Reply Rate | Inbound Profile Views & DMs |\n| **Scale Mechanism** | Volume of Requests Sent | Quality & Relevance of Comments |\n| **Platform Risk** | High (Strict volume limits) | Low (When done locally and naturally) |\n| **Buyer Perception** | Intrusive / Vendor | Collaborative / Peer |\n\n## Frequently Asked Questions\n\n### Does LinkedIn penalize AI engagement software?\nLinkedIn penalizes *bot-like behavior* and *spam*. If you use cloud-based software to blast hundreds of generic messages or automate actions at superhuman speeds from foreign IP addresses, you will be restricted. However, if you use a local-based tool that mimics human behavior to help draft and post thoughtful, highly relevant comments at a normal human pace, you remain within the natural boundaries of the platform. The platform rewards quality engagement; it penalizes unnatural spam. \n\n### Can AI actually write human-sounding comments?\nYes, but only if it is given the right context. Generic AI tools sound robotic because they only have the context of the post they are reading. Advanced tools sound human because they combine the context of the post with a deep understanding of your personal bio, your tone of voice, and your specific instructions. The output quality is entirely dependent on the input context.\n\n### How many posts should I engage with daily for social selling?\nQuality heavily outweighs quantity in social selling. Leaving 15 to 20 highly insightful, well-crafted comments on the posts of targeted decision-makers and industry influencers will yield far better results than leaving 100 generic \"Great post!\" comments. A consistent, daily habit of 20 targeted interactions is a sustainable volume that naturally drives profile views and inbound interest over a 30 to 60-day period.\n\n## The Future of LinkedIn Networking\n\nThe era of scaling brute-force outbound messaging is closing. Buyers are too overwhelmed, and the platform\u2019s technical safeguards are too strict. The professionals who will thrive in the next evolution of social selling are those who understand how to capture attention in the public feed.\n\nTools like Aware serve a distinct purpose for enterprise monitoring, but when your objective is to proactively build pipeline, find consulting clients, or land a job, you need tactical engagement. By leveraging localized, context-aware AI software to assist with strategic commenting, you can scale your personal brand, bypass crowded inboxes, and start meaningful conversations with the people who matter most to your career. \n\nIf you want to ensure your setup protects your account while maximizing your reach, review our comprehensive [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist). Selecting the right infrastructure today ensures your social selling strategy remains viable and productive long into the future.", "created_at": "2026-10-01T16:19:27.019603+00:00", "updated_at": "2026-10-01T16:19:27.019611+00:00"};

    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
