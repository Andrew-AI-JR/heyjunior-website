    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 158, "slug": "aware-vs-junior-social-selling-source-guide", "title": "Aware Vs Junior for Social Selling Source Guide", "excerpt": "Compare aware vs junior social selling methodologies. Discover how modern teams combine authority and AI-driven scale to build pipeline safely on LinkedIn.", "featured_image_url": "https://assets.bevisible.app/featured-images/j572ktm2dqwr67hza7qgq2nxrs8h2x7s/aware-vs-junior-for-social-selling-source-guide-1794156508162-ca8w84.png", "published_at": "2026-11-11T16:28:00+00:00", "content": "# Aware Vs Junior for Social Selling Source Guide\n\nMost B2B sales teams are running a fractured social selling playbook. On one side, you have senior executives and founders executing \"aware\" strategies\u2014building thought leadership, nurturing long-term relationships, and waiting for inbound demand. On the other side, you have \"junior\" execution\u2014sales development reps (SDRs) and early-career sellers running high-volume outbound playbooks, blasting generic connection requests, and burning through the total addressable market. \n\nThis binary approach forces a false choice between scale and quality. \n\nSearch engines and AI overviews often define \"aware vs junior\" for social selling as a choice between roles, career stages, or tactical methodologies. If you have a long, relationship-driven sales cycle, conventional wisdom dictates you need an \"aware\" approach. If you need pipeline yesterday, you default to \"junior\" execution. But relying on this divide ignores how modern buyers actually behave on platforms like LinkedIn. Buyers do not want to be prospected by bots, nor do they always have time to consume three months of thought leadership before making a purchasing decision. \n\nUnderstanding the distinction between awareness-based selling and execution-based selling is the first step. The second, and more critical step, is using modern AI architecture to merge the two. \n\n![Whiteboard diagram contrasting Aware Selling versus Junior Execution sales methodologies.](https://assets.bevisible.app/inline-images/j572ktm2dqwr67hza7qgq2nxrs8h2x7s/inline-1-1794156463624-qqxhqt.png)\n## Decoding the \"Aware\" Social Selling Methodology\n\nAware (or awareness-based) social selling prioritizes visibility, trust, and long-term authority. Professionals operating in this mode do not treat LinkedIn as a glorified cold-calling directory; they treat it as a continuous industry roundtable. \n\n### The Profile of an Aware Seller\nTypically, aware selling is executed by mid-level to senior professionals, founders, consultants, and subject matter experts. They have enough domain expertise to synthesize industry trends, push back on common narratives, and offer original insights. Their primary goal is to become the \"signal\" in a noisy feed.\n\n### Core Tactics of the Aware Approach\n1. **Strategic Content Creation:** Instead of sharing company press releases, aware sellers write original posts detailing specific frameworks, lessons learned, and contrarian industry takes. \n2. **Deep Social Listening:** They monitor target accounts, competitor movements, and industry keywords to understand what their buyers are struggling with right now. \n3. **Contextual Engagement:** They do not drop \"Great post!\" in the comments. They add secondary insights, ask challenging questions, and weave their expertise into the ongoing public discussion. \n4. **Relationship Nurturing:** Aware sellers rarely ask for a meeting in the first interaction. They engage over weeks or months, moving the conversation to direct messages (DMs) only when there is clear mutual context.\n\n### The Metrics of Awareness\nYou cannot measure aware social selling with the same dashboard you use for cold calls. The incentives here revolve around influence and quality. \n*   **Share of Voice:** How often the seller is mentioned or tagged in relevant industry discussions.\n*   **Engagement Quality:** The ratio of comments to likes, and specifically, the seniority of the people leaving those comments. \n*   **Pipeline Influence:** Tracking how many closed-won deals engaged with the seller's content during the buying cycle, even if the content wasn't the initial touchpoint. \n\nThe primary failure mode of aware social selling is the time investment. It requires significant mental bandwidth to produce high-quality content and manually hunt for relevant posts to comment on. When founders or senior leaders get busy, this is the first activity they drop. \n\n## Decoding the \"Junior\" Social Selling Methodology\n\nJunior (or entry-level) social selling is optimized for speed, volume, and measurable daily output. It is the assembly line of pipeline generation, relying heavily on structured playbooks, cadences, and automation tools.\n\n### The Profile of a Junior Seller\nThis approach is the default for SDRs, BDRs, lead generation agencies, and sometimes early-stage founders who are desperately trying to validate a product. These professionals are often executing strategies designed by someone else. They need rapid skill growth, clear parameters, and immediate feedback.\n\n### Core Tactics of the Junior Approach\n1. **High-Volume Prospecting:** Scraping LinkedIn for lists of target personas (e.g., \"VP of Marketing in SaaS\") and feeding them into an outreach sequence. \n2. **Outbound Messaging:** Sending connection requests with pitch-heavy notes or following up with multi-step DM sequences. \n3. **Basic Content Curation:** Sharing company blogs or generic industry news without adding substantial original commentary, primarily just to keep the profile looking active. \n4. **Playbook Adoption:** Strictly following A/B tested messaging templates provided by sales enablement or management.\n\n### The Metrics of Execution\nJunior social selling is highly quantifiable. Management tracks these metrics daily to ensure quota is on pace.\n*   **Connection Acceptance Rate:** The percentage of prospects who accept the initial request.\n*   **Reply Rate:** How many prospects respond to the DM sequence (often categorized by positive, neutral, or negative sentiment).\n*   **Meetings Booked:** The ultimate lagging indicator of junior execution. \n*   **Cadence Adherence:** How strictly the seller is following the prescribed volume and timing of touchpoints.\n\nThe primary failure mode of junior social selling is platform fatigue and account risk. Buyers are overwhelmed by generic pitches in their inboxes. Furthermore, executing high-volume cloud-based automation often triggers LinkedIn's security algorithms, leading to shadowbans or permanent account restrictions. \n\n![A 2x2 matrix chart showing context versus volume across aware, junior, and hybrid social selling approaches.](https://assets.bevisible.app/inline-images/j572ktm2dqwr67hza7qgq2nxrs8h2x7s/inline-2-1794156466344-b9gawa.png)\n## The Strategic Divide: Where Both Approaches Fail\n\nIf you manage a revenue team, you have likely seen the friction between these two camps. The marketing and leadership teams push for \"aware\" strategies, demanding that sales reps build personal brands. The sales managers push for \"junior\" strategies, demanding 100 outbound touches per day. \n\n### The Cost of Pure Awareness\nWhen a team relies solely on awareness-based selling, pipeline predictability suffers. You cannot force a viral post, and you cannot mandate that a target account engages with your thought leadership this quarter. [State of social selling benchmarks for startup founders](https://www.heyjunior.ai/blog/social-selling-benchmarks-startup-founders) consistently show that founders who only post content without a proactive engagement strategy experience severe revenue plateaus. They build a large audience of peers, but fail to convert that visibility into direct client conversations.\n\n### The Cost of Pure Execution\nConversely, pure execution is becoming mathematically unsustainable. The era of the \"spray and pray\" LinkedIn DM is over. Buyers aggressively ignore standard pitches, and the platform actively punishes accounts that behave like spambots. If an entry-level seller uses legacy cloud-automation tools to send 50 identical connection requests a day, they aren't doing social selling\u2014they are doing email marketing on the wrong platform. This burns the total addressable market and damages the brand's reputation.\n\n### The Real-World Scenario\nConsider Alex, an early-career consultant tasked with building a book of business. Alex starts with an \"aware\" approach, spending three hours a day writing insightful posts. A month later, engagement is decent, but meetings are zero. Panicking, Alex switches to a \"junior\" approach, buying a cheap cloud-based LinkedIn automation tool to blast 500 VPs with connection requests. A week later, Alex's LinkedIn account is temporarily restricted for suspicious activity, and the few responses received are complaints about spam.\n\nAlex's problem is the core problem of modern B2B sales: they treated volume and value as mutually exclusive. \n\n## Bridging the Gap: The Evolution of the \"Junior\" Tool\n\nThe tension between aware and junior methodologies is exactly what birthed a new category of sales technology. To win on LinkedIn in 2026, you need the volume and consistency of junior execution, paired with the context, safety, and insight of aware thought leadership.\n\nThis is where the Junior platform enters the equation.\n\nJunior is an AI-powered LinkedIn automation tool designed specifically to abandon the spam-heavy DM playbook of the past. Instead of trying to automate direct messages\u2014which buyers hate and LinkedIn penalizes\u2014Junior automates the discovery of relevant conversations and drafts context-aware, human-sounding replies based on the user's unique bio and goals.\n\n### Automating Awareness Through Commenting\nThe most underutilized tactic in the \"aware\" methodology is strategic commenting. Leaving a highly insightful comment on a prospect's post, or on an industry influencer's post where your prospects are reading, generates massive visibility. It bypasses the crowded inbox and places your expertise in the public square. \n\nHowever, finding the right posts and writing thoughtful comments takes hours\u2014which is why only \"aware\" practitioners usually do it. \n\nBy utilizing [How LinkedIn Comment Automation Works for Pipeline Growth](https://www.heyjunior.ai/blog/linkedin-comment-automation-pipeline-growth), teams can scale this high-value activity. The AI processes the context of the original post, cross-references it with the seller's specific value proposition, and drafts a reply that sounds exactly like a senior industry veteran. The seller reviews, edits if necessary, and posts. \n\nThis workflow allows an entry-level \"junior\" seller to execute at the volume required to hit quota, while projecting the authority and insight of an \"aware\" thought leader.\n\n![Flowchart diagram illustrating the contextual comment generation and human review workflow.](https://assets.bevisible.app/inline-images/j572ktm2dqwr67hza7qgq2nxrs8h2x7s/inline-3-1794156468063-9k3fb5.png)\n## Analyzing the Tech Stack for Social Selling\n\nChoosing between aware and junior methodologies often dictates your software purchases. However, because the methodologies are merging, the tech stack must evolve. \n\n### Legacy Tools Support Legacy Methodologies\nFor years, the market has been flooded with cloud-based connection tools. These tools log into your LinkedIn account from a remote server (often in a different country), scrape profiles, and send automated DMs. \n\nThis architecture supports the worst habits of junior execution. It treats LinkedIn like a database rather than a social network. Because these tools operate in the cloud, they bypass standard browser environments. LinkedIn's security systems easily detect this anomaly. For a deep dive into how these legacy systems fail to protect your account, reviewing an [Architecture guide for safe LinkedIn outreach](https://www.heyjunior.ai/blog/safe-linkedin-outreach-architecture) is critical before deploying any automation.\n\n### Modern Tools Support Hybrid Methodologies\nTo successfully blend aware and junior selling, your tech stack must prioritize natural interaction patterns and account safety. \n\nThis is why tools like Junior are built to run locally on the user's machine. By operating locally, the automation mimics human behavior perfectly\u2014using your actual browser, your actual IP address, and your actual session cookies. LinkedIn sees a human clicking and reading, not a server in AWS executing a cron job. \n\nLocal execution is non-negotiable for anyone trying to build an \"aware\" brand. If you have spent years building thought leadership, risking that account on a cloud-based spam tool is a catastrophic strategic error. [Defining the modern AI sales stack for B2B teams](https://www.heyjunior.ai/blog/ai-sales-stack-architecture) requires prioritizing tools that protect the asset (your profile) while scaling the output (your engagement).\n\n## Evaluating Strategy: Which Path Should You Choose?\n\nWhile the goal is to hybridize these approaches, leadership must evaluate where their team currently stands. When deciding whether to lean heavier on aware tactics or junior tactics, evaluate the following four criteria.\n\n### 1. Customer Expectations and Buyer Journey\nIf you sell a $150,000 enterprise software solution with a nine-month sales cycle, your buyers require an aware approach. They need to see you as a peer, not a vendor. They will research your profile, read your past comments, and evaluate your industry standing before taking a meeting. \n\nIf you sell a $50/month transactional SaaS product, a more junior, high-velocity approach might yield faster results, provided the outreach is highly targeted and not generic spam. \n\n### 2. Career Stage and Team Structure\nYou cannot force a 22-year-old SDR to immediately execute aware-level thought leadership. They do not yet have the industry scars or the pattern recognition to write compelling, contrarian content. \n\nHowever, you can use technology to scaffold their capabilities. By using AI to draft context-aware comments on relevant industry posts, that SDR can begin operating in the \"aware\" space on day one. They learn by reviewing the AI's contextual drafts, effectively receiving on-the-job training in how senior leaders communicate. For a broader comparison of methodologies, you can explore the [Junior vs Aware: Choosing the right approach for social selling](https://www.heyjunior.ai/blog/junior-vs-aware-social-selling) framework.\n\n### 3. Metrics and Incentives\nYou get what you measure. If you want your team to adopt aware behaviors, you must stop managing them exclusively on junior metrics. \n*   **Stop measuring:** Number of connection requests sent per week.\n*   **Start measuring:** Number of strategic conversations started in public comments per week. \n\nIf you pay commission solely on meetings booked via outbound DMs, your team will ignore content and engagement. To shift the culture, incentivize pipeline generated from social interactions, regardless of whether the initial touch was a DM or a public comment.\n\n### 4. Training and Development\nAware methodologies require training in copywriting, public speaking, industry trends, and cross-functional collaboration with product and marketing teams. Junior methodologies require training in tool management, list building, and objection handling. \n\nThe most successful revenue organizations in 2026 blend these training curriculums. They teach their SDRs how to write compelling public commentary, and they teach their senior executives how to systematize and scale their time using local AI tools.\n\n![Notebook comparison comparing outdated outbound social selling metrics with modern contextual engagement metrics.](https://assets.bevisible.app/inline-images/j572ktm2dqwr67hza7qgq2nxrs8h2x7s/inline-4-1794156461960-renkoo.png)\n## Tactical Implementation: Moving from Junior Execution to Aware Influence\n\nIf you are an individual contributor, founder, or agency currently stuck in the junior execution trap\u2014sending hundreds of DMs and getting ignored\u2014here is the step-by-step framework to transition to an aware-level operator using modern automation.\n\n### Step 1: Audit Your Profile for Authority\nBefore you write a single comment or send a single request, your profile must validate your expertise. \n*   **The Banner:** Does it clearly state the specific problem you solve?\n*   **The Headline:** Remove terms like \"SDR\" or \"Looking for new opportunities.\" Replace them with the value you deliver to your specific target audience.\n*   **The Featured Section:** Include links to high-value resources, not just a link to book a meeting. \n\n### Step 2: Shift from Inbox to Feed\nStop trying to corner prospects in their DMs. According to the [State of LinkedIn Engagement and Automation in 2026](https://www.heyjunior.ai/blog/state-of-linkedin-engagement-automation-2026), public visibility has a significantly higher conversion rate to interviews, pipeline, and client conversations than cold outbound messaging. \n\nIdentify 20-30 creators, prospects, and industry leaders who post consistently. Your new objective is not to pitch them; it is to become a recognized face in their comment section. \n\n### Step 3: Deploy Contextual Commenting Automation\nManually tracking 30 different accounts and writing bespoke, insightful comments every day is exhausting. This is the exact workflow the Junior platform was built to automate. \n\nInstead of writing a cloud-based script to spam these 30 people, you set your AI bio and goals locally. The tool monitors the feed for relevant discussions among your target list. When a prospect posts about a specific industry challenge, the AI drafts a thoughtful, human-sounding reply that incorporates your unique perspective. You approve it, and the comment goes live. \n\n### Step 4: Harvest the Inbound Interest\nWhen you consistently leave high-value comments on high-visibility posts, two things happen. First, the author of the post notices you and feels reciprocal goodwill. Second, the hundreds of people reading that post see your comment, click on your optimized profile, and enter your orbit. \n\nAt this point, transitioning to a direct message is no longer cold outreach. It is a warm continuation of a public conversation. You have used a junior-level volume tactic (automated monitoring and drafting) to achieve an aware-level result (inbound authority and trust).\n\n## Comparing the Workflows: Aware vs. Junior vs. Hybrid\n\nTo clarify the operational differences, let's look at how a daily workflow breaks down across these three methodologies.\n\n| Strategy Focus | Primary Daily Activity | Tooling Architecture | Success Metric | Account Risk |\n| :--- | :--- | :--- | :--- | :--- |\n| **Pure Aware** | Writing original posts, manually reading feeds, participating in niche groups. | Native LinkedIn app, manual drafting, basic scheduling tools. | Inbound DMs, high-quality profile views, brand mentions. | Zero risk to account, but high risk of burnout and inconsistent pipeline. |\n| **Pure Junior** | Scraping Sales Navigator lists, loading sequences, sending 100+ connection requests. | Cloud-based automation, remote servers, templated DM sequences. | Acceptance rates, positive replies to cold pitches. | High risk of shadowbans, permanent restrictions, and brand damage. |\n| **Hybrid (The Junior Way)** | Reviewing AI-drafted comments on prospect posts, engaging warmly in DMs with engaged users. | Local AI automation, running in-browser, custom bio-driven prompts. | Strategic conversations started, public visibility, pipeline influence. | Safe (mimics human behavior), scalable, and builds long-term authority. |\n\nNotice how the Hybrid approach takes the best attributes of both extremes. It removes the exhausting manual labor of the Aware approach while completely neutralizing the high account risk and spammy reputation of the Junior approach.\n\n## Overcoming the \"Inauthentic\" Myth\n\nThe biggest objection from proponents of purely aware social selling is the fear of inauthenticity. They argue that if an AI drafts a comment, it is inherently fake, thereby destroying the trust that aware selling is supposed to build.\n\nThis is a misunderstanding of how modern, context-aware AI functions. \n\nIf you use a tool to auto-post \"Great insights, thanks for sharing!\" on 500 posts a day, that is inauthentic. It is noise. But if you configure a local AI system with your exact resume, your specific consulting frameworks, and your specific company positioning, the AI acts as an extension of your own intellect. \n\nIt reads a 500-word post about supply chain logistics and drafts a comment saying, *\"This aligns perfectly with what we saw in Q3. The bottleneck wasn't the software, it was the vendor onboarding process. Curious if you've seen similar delays in your European markets?\"*\n\nThat comment is highly contextual, deeply relevant, and entirely authentic to your brand. The AI simply did the heavy lifting of reading the post and structuring the thought. You still own the perspective. This is how you scale awareness without sacrificing quality.\n\n## FAQs About Aware vs Junior Social Selling\n\n### Can an entry-level SDR execute awareness-based social selling?\nYes, but they need the right scaffolding. Expecting a 23-year-old SDR to generate viral thought leadership from scratch is unrealistic. However, by equipping them with tools that surface relevant industry discussions and draft contextual replies based on company-approved messaging, they can act as \"aware\" operators in the comment section from their first week on the job.\n\n### How long does it take to transition from a junior execution model to an aware model?\nIf done manually, building enough trust to transition from cold-outbound to inbound-awareness takes 6 to 12 months. If accelerated through strategic, AI-assisted commenting on high-visibility posts, you can start bypassing crowded inboxes and generating warm conversations within 30 to 60 days.\n\n### Why is local automation safer than cloud automation for social selling?\nCloud automation logs into your account from an external server, which LinkedIn's security algorithms easily flag as non-human behavior. Local automation runs on your own machine, using your actual browser profile and IP address. This natural interaction pattern protects your account safety, which is paramount if you are trying to build a long-term \"aware\" presence.\n\n## The Future of Social Pipeline\n\nThe debate between aware and junior for social selling is ultimately a debate about the past. In the past, you had to choose between being a respected thought leader who couldn't scale, or a high-volume spammer who nobody respected. \n\nYou no longer have to choose. \n\nBy understanding the distinct advantages of both approaches\u2014the authority of awareness and the consistency of execution\u2014you can build a resilient revenue engine. The key is abandoning the outdated tactics that plague both sides. Stop waiting for inbound magic, and stop blasting cold DMs from a cloud server. \n\nEmbrace the middle path. Focus on public visibility, engage in the feed where your buyers actually spend their time, and use secure, locally-run AI to scale your contextual interactions. When you elevate your daily execution to match the quality of your senior expertise, you turn public visibility into direct interviews, pipeline, and long-term client relationships.", "created_at": "2026-11-11T16:49:23.323353+00:00", "updated_at": "2026-11-11T16:49:23.323361+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
