    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 88, "slug": "phantombuster-alternatives-that-run-locally-2", "title": "Best Phantombuster Alternatives That Run Locally Tools Beyond Phantombuster", "excerpt": "Discover safe Phantombuster alternatives that run locally. Compare developer scrapers like Playwright and Puppeteer with local AI engagement tools.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5751pgrsfg4gfxqq4wn68tzss8d7gmk/best-phantombuster-alternatives-that-run-locally-t-1788108536786-xjhor1.png", "published_at": "2026-08-30T16:43:00+00:00", "content": "# Best Phantombuster Alternatives That Run Locally Tools Beyond Phantombuster\n\nLogging into your LinkedIn account from a cloud server in Virginia while you sit at a desk in London is a guaranteed way to trigger a security checkpoint in 2026. Cloud automation platforms have historically relied on proxy IPs and remote execution to run their workflows. But as platforms have upgraded their bot detection\u2014analyzing everything from browser fingerprints to network latency\u2014the cloud-based automation model has become increasingly risky for your primary accounts. \n\nIf you have been relying on tools like Phantombuster to scrape profiles, send connection requests, or extract data, you have likely encountered the growing friction: logged-out sessions, shadowbans, and outright account restrictions. The solution isn't a better proxy. The solution is moving execution back to where your daily activity actually happens: your local machine.\n\nFinding local alternatives to cloud automation usually splits into two distinct paths. Developers often look for code-heavy frameworks to build their own local scrapers. Growth teams and founders, on the other hand, look for ready-to-use software that runs locally to generate pipeline safely. \n\nThis guide breaks down the technical reasons why cloud automation is failing, explores the top developer frameworks for local execution, and introduces modern, software-based [Phantombuster Alternatives for Automate Linkedin Comments Safely](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely) that focus on authentic engagement over raw data extraction.\n\n## The Core Problem with Cloud-Based Automation\n\nTo understand why local execution is the necessary path forward, you have to look at how platforms detect automation. When you run a workflow on a cloud-based tool, that tool is spinning up a headless browser on a massive server farm (like AWS, Google Cloud, or DigitalOcean). \n\nEven if the platform routes your traffic through a residential proxy to mask the data center IP, modern security systems look far deeper than just the IP address.\n\n### The Browser Fingerprint Mismatch\n\nEvery browser generates a unique signature based on its environment. This is called a browser fingerprint. It includes data points like your operating system, screen resolution, installed fonts, hardware concurrency (how many CPU cores you have), and WebGL rendering capabilities.\n\nWhen you use LinkedIn manually, your fingerprint looks like a standard Macbook Pro or Windows desktop. When a cloud tool logs in on your behalf, the browser fingerprint often looks like a Linux server running in a headless state, missing standard audio drivers, and rendering graphics through software rather than a dedicated GPU. The mismatch between your normal daily logins and your cloud automation logins is a massive red flag.\n\n![Diagram comparing cloud headless browser fingerprint anomalies against authentic local browser execution.](https://assets.bevisible.app/inline-images/j5751pgrsfg4gfxqq4wn68tzss8d7gmk/inline-1-1788108467230-zu5p7t.png)\n### TLS and Network Layer Fingerprinting\n\nBeyond the browser, security systems analyze the network handshake. The way a browser negotiates a secure connection (TLS fingerprinting, specifically JA3 fingerprints) differs between standard consumer browsers and headless instances routed through proxy networks. Cloud automation platforms fight a constant, losing battle to spoof these network signatures. \n\n### The Cookie Hand-Off Vulnerability\n\nTo use a cloud automation tool, you usually have to install a browser extension that extracts your active session cookie and sends it to the platform's servers. This allows the cloud tool to bypass two-factor authentication. However, platforms can see when a session cookie generated by an IP in Chicago is suddenly making aggressive API requests from an IP in Frankfurt ten minutes later. \n\nBy executing automation locally, you bypass these detection mechanisms entirely. The automation runs on your actual hardware, utilizing your real IP address, your authentic browser fingerprint, and your native session cookie. It is the foundation of [Safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin).\n\n## Top Developer-Focused Local Alternatives for Scraping\n\nIf your primary use case for Phantombuster was extracting raw data\u2014such as scraping company directories, pulling job listings, or archiving post data\u2014you can replicate these \"Phantoms\" by running open-source automation frameworks directly on your own computer. \n\nThese tools require programming knowledge (usually Python or Node.js), but they offer complete control, run entirely offline or locally, and have zero recurring subscription fees.\n\n### 1. Playwright\n\nPlaywright, maintained by Microsoft, has largely become the gold standard for modern web automation, overtaking older frameworks due to its reliability and speed. It supports Chromium, Firefox, and WebKit out of the box.\n\n**Why it replaces Phantombuster:**\nPlaywright is exceptionally good at handling dynamic, single-page applications that rely heavily on JavaScript. If you are scraping a platform that lazy-loads content as you scroll, Playwright can natively intercept network requests, wait for specific elements to render, and execute complex workflows without the flaky \"sleep\" timers that plagued older automation tools.\n\n**Local Implementation Details:**\nYou run Playwright scripts via Node.js, Python, or .NET on your local machine. Because it runs locally, you can use the headed mode (where the browser actually opens on your screen) to visually monitor the scraper. This is incredibly useful for debugging when a platform changes its UI layout. \n\n**The Trade-off:**\nYou are responsible for the logic. If a website changes the CSS class of a button from `btn-primary` to `btn-submit-v2`, your Playwright script will crash until you manually inspect the page and update your code. \n\n### 2. Puppeteer\n\nPuppeteer is a Node.js library that provides a high-level API to control Chrome or Chromium. Created by the Chrome DevTools team, it is deeply integrated into the Google ecosystem.\n\n**Why it replaces Phantombuster:**\nPuppeteer is widely used for scraping tasks, generating PDFs, and automating form submissions. For developers who are already entrenched in the JavaScript/Node.js ecosystem, Puppeteer is incredibly intuitive. \n\n**The Stealth Advantage:**\nThe single biggest reason developers choose Puppeteer for local web scraping is the `puppeteer-extra-plugin-stealth`. This community-maintained plugin actively strips away the markers that indicate a browser is running via automation (such as masking the `navigator.webdriver` flag and spoofing Chrome runtime properties). Running a stealth Puppeteer script locally is one of the most robust ways to extract data without triggering bot protection.\n\n### 3. Selenium WebDriver\n\nSelenium is the legacy powerhouse of browser automation. It has been around for over a decade and supports nearly every programming language, including Python, Java, C#, and Ruby.\n\n**Why it replaces Phantombuster:**\nIf you have highly complex workflows that require interacting with older web architectures, or if you are integrating your scraping tasks into an enterprise QA pipeline, Selenium has the largest library of documentation and community support. \n\n**Local Implementation Details:**\nSelenium requires you to download a specific WebDriver executable that matches your exact installed browser version. While it is highly capable, it is generally considered slower and more resource-intensive than Playwright for local execution. It is best reserved for scenarios where you already have a massive codebase built around it.\n\n### 4. Scrapy and Beautiful Soup (Python)\n\nNot every Phantombuster workflow requires a full browser. If you are scraping public websites that render their data in the initial HTML response (rather than requiring JavaScript to load the data), running a full browser is massive overkill.\n\n**Beautiful Soup:** \nThis is a lightweight Python library for parsing HTML and XML documents. You pair it with the `requests` library to fetch a webpage, and then you use Beautiful Soup to extract the text, links, or image URLs. It is incredibly fast and uses almost zero system resources, making it perfect for running locally on a low-powered laptop.\n\n**Scrapy:**\nIf you need to crawl entire websites\u2014say, navigating through every page of a public directory to extract company names\u2014Scrapy is an open-source framework designed exactly for this. It handles request scheduling, concurrent connections, and data exporting (to CSV or JSON) natively. It runs entirely on your local machine and can process thousands of pages a minute.\n\n![Technical architecture comparison chart of local scraping frameworks including Playwright, Puppeteer, Selenium, and Scrapy.](https://assets.bevisible.app/inline-images/j5751pgrsfg4gfxqq4wn68tzss8d7gmk/inline-2-1788108476633-j7c0l0.png)\n## The Shift from Data Extraction to Pipeline Generation\n\nWhile developer tools like Playwright and Scrapy are phenomenal for raw data extraction, they highlight a massive disconnect in how professionals actually use automation to grow their businesses. \n\nMost people using Phantombuster aren't extracting data just to look at it. They are extracting data to *do* something with it\u2014usually, importing that data into another tool to send automated cold messages or connection requests. \n\nThis workflow (Scrape Profiles $\\rightarrow$ Send Connection Request $\\rightarrow$ Send Cold DM) is dying. \n\nCrowded inboxes, LinkedIn's strict weekly connection limits, and user fatigue have rendered generic automated messaging highly ineffective. If your goal is to generate interviews, find consulting clients, or book sales meetings, spending hours writing Python scripts to scrape profiles locally is solving the wrong problem. \n\nThe modern approach to LinkedIn growth is public visibility through authentic commenting. When you leave a thoughtful, context-aware comment on a high-performing post, you bypass the crowded inbox entirely. You place yourself, your headline, and your expertise directly in front of the prospect and their entire audience. \n\nFor this, you don't need a web scraper. You need a tool designed for strategic engagement.\n\n## The Best Local Alternative for LinkedIn Engagement: Junior\n\nIf your goal is pipeline generation rather than data hoarding, Junior is the premier software alternative. Junior is an AI-powered LinkedIn automation tool built specifically to start authentic conversations through strategic post commenting.\n\n### How Junior Solves the Local Execution Mandate\n\nUnlike cloud platforms that require you to hand over your session cookies to a remote server, Junior runs entirely locally on your own machine. It integrates with your active browser session seamlessly. \n\nWhen Junior interacts with LinkedIn, it is happening from your computer, using your home or office IP address, with your actual browser fingerprint. It behaves identically to you sitting at your desk and typing, which makes it one of the safest [Best LinkedIn engagement tools 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026) available. \n\n### Replacing Cold Outreach with Context-Aware Commenting\n\nPhantombuster workflows often focus on volume: hitting the maximum number of allowed connection requests per week. Junior focuses on conversion. \n\nInstead of spamming inboxes, Junior helps you find relevant discussions happening in your niche. It then drafts context-aware, human-sounding replies based entirely on your unique bio, tone, and specific goals. Because it leverages AI locally to read the room of the post, the comments add real value to the discussion rather than dropping generic \"Great post!\" spam.\n\nThis transition from outbound spam to inbound visibility is why many teams are evaluating [Automate Linkedin Comments Safely Evaluation Checklist](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) to move away from legacy automation.\n\n### Who Should Use Junior over Developer Frameworks?\n\n*   **Sales Teams and Lead Gen Agencies:** If you need to build trust with prospects before pitching, engaging with their public content is vastly superior to a cold DM. \n*   **Consultants and Founders:** For high-ticket B2B sales, your reputation is everything. Automated DMs can damage your brand. Insightful comments demonstrate your expertise publicly. \n*   **Job Seekers:** Bypassing the HR portal and engaging directly with hiring managers on their posts is a proven way to secure interviews. \n\nIf you are currently evaluating how to switch from automated messaging platforms to commenting tools, understanding the nuances between them is critical. You can explore a deeper comparison in our guide on [Junior vs Dripify: finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging).\n\n## Local Scraping vs. Local Engagement: A Decision Matrix\n\nTo clarify which local alternative fits your specific needs, compare your end goals against the tools available.\n\n| Business Goal | Historical Cloud Tool | Local Alternative | Required Skillset | Maintenance Burden |\n| :--- | :--- | :--- | :--- | :--- |\n| **Mass Data Enrichment** (Finding emails, aggregating public employee lists) | Phantombuster Data Scraper | Python + Playwright / Scrapy | High (Programming required) | High (Fixing broken selectors) |\n| **UI Testing / Workflows** (Automating internal dashboard reporting) | Phantombuster / Zapier | Node.js + Puppeteer | High (Programming required) | Medium |\n| **Pipeline Generation** (Booking meetings, generating leads) | Phantombuster Cold DMs | Junior | Low (No code required) | Low (Managed AI software) |\n| **Audience Building** (Growing profile views, networking safely) | Phantombuster Auto-Connect | Junior | Low (No code required) | Low (Managed AI software) |\n\n## Case Scenario: Moving an Agency from Cloud Automation to Local Execution\n\nConsider a boutique lead generation agency that historically managed 15 client LinkedIn accounts. In 2024, their standard operating procedure was to run Phantombuster on the cloud, using dedicated proxies for each client, scraping Sales Navigator lists, and maxing out the 100 connection requests per week per client.\n\nBy early 2026, the friction became unsustainable. Proxies were getting flagged, clients were receiving warning banners on their accounts, and the response rate to cold DMs plummeted to below 1%. The agency spent more time managing shadowbans and fixing disconnected cookies than actually booking meetings.\n\nThe agency decided to pivot their infrastructure and their strategy simultaneously.\n\n**The Infrastructure Pivot:**\nThey stopped using cloud proxies entirely. Instead, they required clients to run a lightweight local application (Junior) on their own work machines during normal business hours. This eliminated the IP mismatch and browser fingerprint issues overnight. The accounts were immediately secure because the activity originated from the client's actual office.\n\n**The Strategy Pivot:**\nInstead of sending 100 generic connection requests, the agency configured Junior to identify 20 high-value industry posts daily for each client. Junior drafted nuanced, customized comments based on the specific client's expertise. The agency account managers would spend 15 minutes a day reviewing and approving these drafts locally before the tool posted them.\n\n**The Result:**\nProfile views across the client base surged by 400% within the first month. Instead of ignoring cold DMs, prospects began replying to the comments and sending inbound connection requests to the clients. By shifting from cloud-based extraction to local, AI-driven engagement, the agency reduced their software costs, eliminated account bans, and vastly improved their clients' ROI. \n\nIf you are looking for more options in this specific category, you can review the [Best AI Tools for Linkedin Commenting Tools Beyond Supergrow](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow) to see how local execution is changing the landscape.\n\n![Flowchart comparing the old cloud scraping and cold messaging workflow against local AI engagement and inbound conversion.](https://assets.bevisible.app/inline-images/j5751pgrsfg4gfxqq4wn68tzss8d7gmk/inline-3-1788108466508-9fyhny.png)\n## The Hidden Costs of Building Your Own Local Setup\n\nFor technical founders or growth hackers, the temptation to build a custom local scraper using Playwright is strong. It is completely free, highly customizable, and technically satisfying to build. However, the true cost of local, custom automation is maintenance.\n\nSocial platforms undergo continuous UI updates. A button that you identified via the CSS class `.feed-submit-btn` on Monday might be obfuscated to `.css-1x8g7k` by Thursday. When this happens, your custom local script fails silently, or worse, errors out entirely. \n\nMaintaining a fleet of custom local scrapers requires constant vigilance. You must implement robust error handling, set up local cron jobs to run the scripts at human-like intervals, and constantly update your Document Object Model (DOM) selectors. \n\nFurthermore, even if you are running locally, platforms monitor interaction velocity. If your Python script clicks on 500 profiles in 10 minutes from your home IP address, you will still be flagged for bot behavior. Local execution masks the *origin* of the automation, but it does not excuse reckless *behavior*. You must program randomized delays, human-like scroll behaviors, and strict daily limits into your code.\n\nThis is why, for the vast majority of professionals, investing in a maintained local tool is far more efficient than building one from scratch.\n\n## Evaluating Local Automation Tools\n\nIf you are ready to move away from Phantombuster and adopt a local approach, you should audit your potential tools based on strict criteria. We recommend reviewing the full [Best Automate Linkedin Comments Safely Tools Beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster) guide, but here are the non-negotiable elements your local setup must have:\n\n1.  **Native Session Inheritance:** The tool must use your existing browser session without requiring you to copy and paste session cookies into a third-party interface.\n2.  **Human Interaction Patterns:** The software should scroll, pause, and type at human speeds. It should never instantly inject text into a text box via direct API calls if it is mimicking front-end behavior.\n3.  **Context-Aware Capabilities:** If the tool is engaging on your behalf, it must have a deep understanding of the post content, the author's intent, and your personal bio. Generic automation does more harm than good.\n4.  **Local Data Storage:** Ensure that the tool does not quietly upload your extracted data back to a centralized server. True local tools keep your data on your hard drive, ensuring compliance with data privacy regulations.\n\n## Frequently Asked Questions About Local Automation\n\n### Can I run local automation 24/7?\nRunning automation 24/7 from your local machine is technically possible, but highly discouraged if you are engaging on social platforms. Humans do not use social media for 24 hours straight without sleeping. Running scripts overnight while your IP address is inactive on all other devices is a clear signal of non-human behavior. Local automation should run during your normal working hours to blend in with your natural web traffic.\n\n### Is local automation completely safe from platform bans?\nNo automation is 100% immune to detection. Local execution solves the infrastructure problem (IP addresses and browser fingerprints), but it does not solve the behavioral problem. If you use a local tool to send 500 spam messages a day, you will be restricted based on volume and user reports, regardless of where the script runs. Safety comes from combining local execution with low-volume, high-quality engagement.\n\n### Do I need to know how to code to run local alternatives?\nIt depends on the path you choose. If you want to build custom scrapers using Playwright or Scrapy, yes, you need a strong understanding of Python or Node.js. If you want to use local automation for engagement and pipeline generation, you can use out-of-the-box software like Junior, which requires zero coding knowledge and operates through a simple, intuitive interface. \n\nThe era of mass cloud scraping is giving way to targeted, safe, local engagement. By auditing what you were actually trying to achieve with Phantombuster, you can select the right local framework\u2014or the right AI commenting tool\u2014to build pipeline without risking your professional reputation.", "created_at": "2026-08-30T16:49:24.479517+00:00", "updated_at": "2026-08-30T16:49:24.479523+00:00"};
    </script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
