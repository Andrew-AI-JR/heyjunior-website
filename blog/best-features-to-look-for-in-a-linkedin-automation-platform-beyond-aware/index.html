    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 110, "slug": "best-features-to-look-for-in-a-linkedin-automation-platform-beyond-aware", "title": "Best Features to Look for in A Linkedin Automation Platform Beyond Aware", "excerpt": "Discover the essential features to look for in a modern LinkedIn automation tool beyond Aware, from local safety execution to context-aware AI commenting.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5732vh1xw1kzwc1afmzmhyrh18d6gj0/best-features-to-look-for-in-a-linkedin-automation-1790093907227-3t35tv.png", "published_at": "2026-09-22T16:09:00+00:00", "content": "# Best Features to Look for in A Linkedin Automation Platform Beyond Aware\n\nIf you manage sales pipelines or run lead generation campaigns, you already know the traditional LinkedIn playbook is broken. Pitch-slapping a sequence of cold direct messages into a crowded inbox yields diminishing returns. Prospects have developed blindness to the \"Hi [First Name], I noticed we share mutual connections\" template. While platforms like Aware have built strong followings by offering analytics and standard engagement tracking, modern social selling requires a fundamentally different approach. The high-leverage strategy has shifted away from private spam and toward public visibility.\n\nGenerating direct interviews, pipeline, and client conversations now depends on authentic interaction. It means finding relevant discussions where your target audience is already active, and leaving thoughtful, context-aware comments that draw them to your profile. But executing this at scale without a dedicated team requires sophisticated tooling. \n\nWhen you evaluate a platform to handle this workload, you are no longer just looking for a message scheduler. You are looking for a digital proxy that understands your professional brand, navigates the platform safely, and sparks genuine conversations. [Not all features decide the outcome of your campaigns, but the ones that do require strict scrutiny](https://linkedinsider.blog/linkedin-automation-tool-features). \n\nHere is a comprehensive breakdown of the features you must look for in a modern LinkedIn automation platform, moving beyond legacy tracking tools to solutions that actually drive pipeline.\n\n## The Architectural Shift: Local Execution Over Cloud Infrastructure\n\nThe most pressing concern for any professional automating their LinkedIn activity is account safety. A restricted or permanently banned account is catastrophic for a founder, job seeker, or sales professional. For years, the debate in [evaluating automation tools](https://we-connect.io/blog/what-are-linkedin-automation-tools) centered on dedicated IPs and cloud proxies. The reality in 2026 is that LinkedIn's detection algorithms have evolved past simple IP checks. They now analyze device fingerprinting, behavioral patterns, and session consistency.\n\n### Why Local Execution Matters\n\nLegacy automation tools and many cloud-based platforms run your LinkedIn sessions on their remote servers. Even with a dedicated proxy, the behavior looks anomalous to LinkedIn's security systems. You might log in from your laptop in Chicago at 9:00 AM, while a cloud server in Virginia simultaneously executes 50 connection requests on your behalf using a completely different browser fingerprint. \n\nModern platforms solve this through local execution. Instead of handing your session cookies to a remote server, the automation runs directly on your machine, utilizing your actual IP address, your actual browser fingerprint, and your established session. When you evaluate [safe AI engagement on LinkedIn](https://www.heyjunior.ai/blog/safe-ai-engagement-on-linkedin), local execution should be a non-negotiable baseline. By running locally, the platform perfectly mimics the natural interaction patterns LinkedIn expects, drastically reducing the risk of account penalties.\n\n![Diagram comparing cloud server automation versus local execution architecture for LinkedIn safety](https://assets.bevisible.app/inline-images/j5732vh1xw1kzwc1afmzmhyrh18d6gj0/inline-1-1790093854727-vuxfw9.png)\n### Randomized Delays and Human-Mimicking Algorithms\n\nA platform that executes 100 comments in exactly 100 seconds will be flagged immediately. Human beings do not operate with millisecond precision. When reviewing a platform's safety features, look for deep configurability in its execution cadence. \n\nThe software should natively enforce:\n*   **Variable keystroke emulation:** Typing out text at human speeds with slight randomized delays, rather than instantly pasting blocks of text.\n*   **Action spacing:** Waiting between 3 to 12 minutes between specific engagements, simulating a user reading through a feed, pausing, and interacting.\n*   **Time-of-day constraints:** Ensuring actions only occur during your defined working hours in your specific timezone.\n*   **Daily limit caps:** Hard stops on the number of comments, profile views, and likes executed per day to keep your account well within safe operating thresholds.\n\nIf a tool forces you to rely entirely on their \"black box\" safety settings without giving you the ability to throttle the velocity yourself, it presents a structural risk to your account. You need a platform that [automates LinkedIn comments safely](https://www.heyjunior.ai/blog/automate-linkedin-comments-safely-evaluation-checklist) by giving you absolute control over the throttle.\n\n## Strategic Discovery: Finding the Right Conversations\n\nAutomating comments on random posts is worse than doing nothing; it damages your brand. The core value of a next-generation platform lies in its ability to sift through the noise of the LinkedIn feed and surface high-intent discussions. \n\nIf you are a lead generation agency targeting B2B SaaS founders, commenting on a viral post about someone's morning coffee routine won't generate pipeline. You need to be interacting with posts discussing churn rates, customer acquisition costs, or go-to-market strategies.\n\n### Keyword and Topic Listening\n\nLook for a platform that allows you to configure specific listening streams based on keywords, hashtags, and boolean logic. The tool should scan the network for posts containing your target phrases and aggregate them into a centralized dashboard. \n\nAdvanced discovery features should allow you to filter by:\n*   **Author title and industry:** Ensuring the person posting matches your Ideal Customer Profile (ICP).\n*   **Engagement velocity:** Finding posts that are currently gaining traction but aren't yet saturated with thousands of comments, allowing your contribution to remain visible at the top of the thread.\n*   **Network proximity:** Prioritizing 2nd-degree connections where a thoughtful comment is highly likely to result in a profile view and an inbound connection request.\n\n### Targeted Creator and Account Tracking\n\nBeyond keyword searches, you likely have a list of high-value prospects, industry influencers, or target accounts. Your automation platform must support direct account tracking. When a target prospect publishes a new post, the platform should immediately flag it for engagement. \n\nThis feature replaces the tedious manual process of checking your prospects' recent activity pages. By consistently showing up in the comment sections of your top 100 target accounts with insightful contributions, you build familiarity. When you eventually transition the conversation to a direct message, you are no longer a cold outbound prospector; you are a recognized peer. For those evaluating [tools to find relevant LinkedIn posts to comment on](https://www.heyjunior.ai/blog/best-tools-to-find-relevant-linkedin-posts-to-comment-on-tools-beyond-taplio), precise account tracking is the differentiator between vanity metrics and booked meetings.\n\n## Context-Aware AI Personalization\n\nThe defining feature of a modern LinkedIn tool is how it handles the actual content creation. We have all seen the results of poorly implemented AI: the robotic \"Great insights, thanks for sharing!\" or the overly verbose, ChatGPT-sounding essays that clearly weren't written by a human.\n\nIf you want to [evaluate AI tools for LinkedIn commenting](https://www.heyjunior.ai/blog/ai-tools-for-linkedin-commenting-evaluation-checklist), you must look past basic generative text. The platform needs context.\n\n### Integrating the User's Bio and Goals\n\nGeneric AI drafts fail because they lack a point of view. A top-tier platform ingests your specific professional background, your unique tone of voice, and your specific campaign goals before it ever drafts a word. \n\nImagine a prospect posts about the difficulties of transitioning from a founder-led sales motion to a dedicated sales team. \n*   **Basic AI Output:** \"I completely agree! Building a sales team is very challenging. Great post!\"\n*   **Context-Aware Output (Configured for a Sales Consultant):** \"The transition from founder-led to a dedicated team usually breaks down at the handoff. Founders have the implicit product knowledge; reps only have the playbook. Did you start by having your first reps shadow your calls, or did you build the playbook first?\"\n\nThe latter response sounds human, adds value to the discussion, and subtly positions the commenter as an authority. It invites a reply from the author. Your platform must allow you to define your persona deeply so the AI acts as an extension of your specific expertise.\n\n### Tone Constraints and Negative Prompts\n\nEqually important to what the AI should say is what it *should not* say. The platform must allow you to set strict negative constraints. You should be able to instruct the system to never use emojis, never start a sentence with \"I agree,\" avoid bullet points, or keep responses under a certain character limit. \n\nThe goal of the AI is not to fully automate the human out of the loop. The goal is to draft a 90% complete, highly relevant response that you can review, lightly edit, and approve in seconds rather than minutes. This is how you scale authentic interactions. Platforms that force you to accept their default, overly enthusiastic AI tone will ultimately harm your credibility.\n\n![Visual comparison between generic AI commenting and context-aware personalized LinkedIn commenting](https://assets.bevisible.app/inline-images/j5732vh1xw1kzwc1afmzmhyrh18d6gj0/inline-2-1790093849310-4ct9n3.png)\n## The Comment-to-Conversation Pipeline\n\nEngagement for the sake of engagement is a marketing metric; engagement that leads to pipeline is a sales metric. When looking at the [best LinkedIn automation tools in the ultimate guide for growth](https://hyperise.com/blog/linkedin-automation-tools), the standout feature is the workflow that converts a public comment into a private conversation.\n\n### Bypassing the Crowded Inbox\n\nDecision-makers are protective of their time and their LinkedIn inboxes. They routinely ignore cold connection requests accompanied by generic pitches. However, they almost always read the comments on their own posts. \n\nBy utilizing a platform like Junior, which focuses on strategic post commenting, you bypass the crowded inbox entirely. You capture their attention in public. When they reply to your comment or like it, the dynamic shifts. You have established a micro-relationship. \n\n### Seamless Transition Workflows\n\nYour platform should track these interactions. When a target prospect engages with your comment, the software should flag this as an \"intent signal.\" This is the moment to transition to a direct message or connection request. Because the context is already established, the connection request isn't cold. \n\nLook for features that allow you to easily reference the specific post you interacted on when you finally send that connection request. A workflow that seamlessly connects public visibility to a direct, warm conversation is vastly superior to a tool that just tracks how many likes you received. If you are comparing strategies, look at how [Junior vs Dripify compares when finding consulting clients without automated messaging](https://www.heyjunior.ai/blog/junior-vs-dripify-finding-consulting-clients-without-automated-messaging). The emphasis must be on the natural progression of a relationship, not forcing a pitch into a direct message.\n\n## Multi-Account Management and Agency Features\n\nIf you are a founder or a solo consultant, a single-seat license is sufficient. However, if you are a sales leader managing a team of SDRs, or a lead generation agency managing multiple clients, your feature requirements change drastically.\n\n### Multi-Tenant Architecture\n\nManaging ten different LinkedIn accounts by logging in and out of different browser profiles is a recipe for disaster and flagged accounts. [Agency-grade LinkedIn automation tools](https://www.swydo.com/blog/best-linkedin-automation-tools/) require multi-tenant architecture. \n\nYou need a unified dashboard that allows you to oversee the activity, analytics, and drafting queues for multiple clients or team members from a single interface. However, this must be balanced with the safety requirements mentioned earlier. The platform should ideally allow each client's automation to run locally on their respective machines, while feeding data back to your centralized agency dashboard. \n\n### Unified Inbox and Approval Queues\n\nFor agencies running ghostwriting or commenting services on behalf of clients, an approval workflow is critical. You cannot risk an AI generating a slightly off-brand comment and posting it automatically on a client's behalf. \n\nThe platform must feature a robust approval queue. The system finds the relevant posts, drafts the context-aware replies based on the client's bio, and queues them up. The agency account manager (or the client themselves) can then log in, review the drafted comments, tweak them if necessary, and hit approve. This keeps the execution safe, the brand voice accurate, and the volume high.\n\n## Meaningful Analytics Over Vanity Metrics\n\nLegacy platforms, including Aware, often lean heavily into analytics that look impressive on a dashboard but don't translate to business outcomes. Knowing that your profile views went up 40% is nice, but if it didn't result in any booked meetings, the metric is useless.\n\n### Tracking Pipeline, Not Just Impressions\n\nWhen evaluating the reporting features of a platform, ensure it tracks the full lifecycle of an interaction. \nA strong analytics suite will show you:\n1.  **Engagement Rate by Keyword:** Which topics or industry keywords are yielding the highest response rates from your comments.\n2.  **Conversion to Connection:** What percentage of people you engaged with publicly subsequently accepted your connection request or sent you one inbound.\n3.  **Meeting Booking Rate:** If integrated with your calendar or CRM, how many of those connections ultimately booked a call.\n\n### CRM Sync and Data Portability\n\nYour LinkedIn automation platform should not exist in a silo. It needs to pass data seamlessly to your CRM (HubSpot, Salesforce, Pipedrive). When a prospect replies to your comment and accepts a connection request, that individual should be automatically created as a lead in your CRM, tagged with the context of your interaction.\n\nLook for platforms that offer robust webhooks or native integrations. If you are using platforms to [automate LinkedIn tasks for growth](https://phantombuster.com/blog/tools/best-tools-to-automate-linkedin-tasks/), the data must flow automatically into your downstream systems. Without this, your sales team will waste hours manually logging activities and updating contact records.\n\n## Comparing the Landscape: Why Junior Outperforms Legacy Options\n\nWhen you put these feature requirements together\u2014local execution for maximum safety, context-aware AI drafting based on user bios, and a strategic focus on public commenting over cold DMs\u2014the limitations of older platforms become apparent.\n\nTools that rely entirely on cloud-based automated messaging (like Dripify or standard configurations of [Phantombuster alternatives](https://www.heyjunior.ai/blog/phantombuster-alternatives-for-automate-linkedin-comments-safely)) expose users to higher risks of account restriction and lower conversion rates as buyers fatigue from inbox spam. \n\nPlatforms focused heavily on content scheduling and broad analytics (like Taplio) are excellent for broadcasters but often lack the granular, intent-driven engagement tools necessary for targeted outbound. When evaluating [Junior vs Taplio for LinkedIn growth](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-growth), the distinction lies in whether you want to be a content creator shouting to a crowd, or a strategic networker having targeted conversations with specific buyers.\n\nJunior bridges this gap. By running locally on your machine, it protects your account utilizing natural interaction patterns. By replacing cold DMs with strategic post commenting, it helps professionals bypass crowded inboxes. By using AI to draft human-sounding replies based on your unique goals, it ensures every interaction adds value rather than noise. If you are looking for the [best AI tools for LinkedIn commenting](https://www.heyjunior.ai/blog/best-ai-tools-for-linkedin-commenting-tools-beyond-supergrow), platforms that prioritize safe, authentic conversation will consistently outperform those that merely automate spam.\n\n![Infographic showing the 4-step workflow from public post discovery and commenting to CRM sync](https://assets.bevisible.app/inline-images/j5732vh1xw1kzwc1afmzmhyrh18d6gj0/inline-3-1790093856116-wcmy05.png)\n## The Ultimate Feature Checklist for Buyers\n\nBefore committing to a yearly contract with any platform, run the software through this evaluation checklist. If the vendor cannot provide clear, affirmative answers to these questions, look elsewhere.\n\n| Feature Category | Critical Requirement | Why It Matters |\n| :--- | :--- | :--- |\n| **Safety Architecture** | Does it run locally on your device rather than a cloud server? | Prevents LinkedIn from flagging inconsistent IP and device fingerprint data. |\n| **Pacing & Limits** | Can you manually configure randomized delays and daily action limits? | Mimics human behavior. Platforms that enforce hard, rapid limits invite account bans. |\n| **Discovery Engine** | Can it filter the feed by specific ICP keywords, company size, and engagement velocity? | Prevents wasting time commenting on irrelevant posts that won't drive target pipeline. |\n| **AI Personalization** | Does the AI use your specific bio, goals, and negative prompts to draft replies? | Ensures comments sound like you, adding industry-specific value rather than generic praise. |\n| **Workflow** | Is there a unified queue to review, edit, and approve drafts before they post? | Maintains quality control and prevents AI hallucinations from damaging your brand. |\n| **Data Integration** | Does it push engagement data and new connections directly to your CRM? | Eliminates manual data entry and provides true ROI tracking beyond vanity metrics. |\n\nIf you are currently evaluating [the best LinkedIn engagement tools in 2026](https://www.heyjunior.ai/blog/best-linkedin-engagement-tools-2026), this table serves as your baseline defense against purchasing a tool that will either get you banned or fail to generate meaningful ROI.\n\n## Frequently Asked Questions\n\n### What is the safest way to automate LinkedIn activities?\nThe safest method is utilizing a platform that runs locally on your machine, utilizing your existing browser session and IP address. Combine this with strict, randomized daily limits and human-mimicking delays between actions. Avoid cloud-based tools that rapidly execute hundreds of actions simultaneously from remote servers. For a deeper dive, review tools that [automate LinkedIn comments safely beyond Phantombuster](https://www.heyjunior.ai/blog/best-automate-linkedin-comments-safely-tools-beyond-phantombuster).\n\n### Does using AI to write comments violate LinkedIn's terms of service?\nLinkedIn's terms of service prohibit the use of automated software to scrape data or bypass their limits. However, using an AI writing assistant to help you draft a response, which you then review and manually approve, is functionally no different than using a spell-checker or a CRM template. The violation occurs when platforms spam the network at superhuman speeds without human oversight.\n\n### How many comments or messages should I automate daily?\nWhile every account is different, a safe baseline for an aged, active LinkedIn account is 20 to 40 highly targeted comments per day, spaced out naturally over an 8-hour working window. Quality heavily outweighs quantity. Forty thoughtful, context-aware comments on posts from your ideal buyers will yield significantly more pipeline than 400 generic \"Great post!\" comments blasted across the platform.\n\n### Can agencies use comment automation tools for multiple clients?\nYes, but the architecture must support it safely. Agencies should look for tools offering unified dashboards for the account manager, while ensuring the actual execution of the actions occurs locally on the respective client's machine or a dedicated, safe local instance. This prevents the \"multi-login\" flags that often get agency clients banned when using legacy cloud tools.", "created_at": "2026-09-22T16:19:26.604090+00:00", "updated_at": "2026-09-22T16:19:26.604095+00:00"};

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderArticleBody(rawContent) {
            const content = (rawContent || '').trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {
                    name: 'LinkedIn',
                    url: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>'
                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${post.title}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.href;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${post.featured_image_url}" alt="${post.title}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
