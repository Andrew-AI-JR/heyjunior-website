    <script>
        window.__INITIAL_ARTICLE_DATA__ = {"id": 169, "slug": "phantombuster-alternatives-run-locally-checklist", "title": "Phantombuster Alternatives That Run Locally Evaluation Checklist", "excerpt": "Looking for PhantomBuster alternatives that run locally? Discover how local execution protects LinkedIn accounts, avoids bans, and scales authentic outreach.", "featured_image_url": "https://assets.bevisible.app/featured-images/j5755rb535h4f1ch2q2zj8spz18h3nbd/phantombuster-alternatives-that-run-locally-evalua-1795106897526-524lxq.png", "published_at": "2026-11-22T16:41:00+00:00", "content": "# Phantombuster Alternatives That Run Locally Evaluation Checklist\n\nYou configure a Phantom, paste a Sales Navigator search URL into the setup field, and launch your workflow. For the first few days, the cloud server steadily scrapes profiles and sends out connection requests. Then, you wake up to a sudden forced log-out and a warning from LinkedIn: your account has been temporarily restricted due to the use of unauthorized third-party applications. \n\nThis cycle is the reality for thousands of job seekers, agency owners, and sales professionals trying to scale their outreach. Cloud-based automation platforms like PhantomBuster offer undeniable utility, but their architectural foundation\u2014running browser sessions from data center IP addresses\u2014creates an unavoidable security footprint. LinkedIn\u2019s security algorithms do not just look at how fast you click; they look at where those clicks originate. When a login session suddenly jumps from your home Wi-Fi in Chicago to an AWS server in Virginia, the platform flags the anomaly.\n\nMoving your automation to your own machine is the logical countermeasure. By executing tasks locally, your automation tool inherits your residential IP address, your natural browser fingerprint, and your standard usage hours. However, finding a PhantomBuster alternative that runs locally often forces non-technical professionals into a developer's ecosystem of Python scripts and headless browsers. \n\nThis guide provides a comprehensive evaluation checklist for local automation tools. We will break down the differences between maintaining complex scraping scripts and using modern, locally-running AI tools designed specifically for authentic social engagement. \n\n![Architectural comparison diagram showing data center IP cloud automation versus residential IP local execution.](https://assets.bevisible.app/inline-images/j5755rb535h4f1ch2q2zj8spz18h3nbd/inline-1-1795106855853-acgwiu.png)\n## Why Cloud-Based Automation Triggers Security Restrictions\n\nBefore evaluating local alternatives, you need to understand exactly what you are trying to avoid. Account safety is not just about avoiding spammy messaging; it is heavily tied to network architecture.\n\nCloud automation platforms rent servers from providers like Amazon Web Services, Google Cloud, or DigitalOcean. When you run a cloud-based scraper, the platform spins up a virtual browser inside one of these data centers. LinkedIn maintains extensive blacklists and whitelists of IP subnets. A connection request originating from a known commercial data center IP is immediately treated with suspicion because human users browse from residential ISPs or corporate networks, not server farms.\n\nFurthermore, cloud tools often execute actions concurrently or at rigid intervals. Even if the platform offers a \"randomized delay\" feature, the underlying metadata of the browser session\u2014such as the user-agent string, canvas fingerprinting, and hardware concurrency\u2014often screams \"bot.\" \n\nRunning automation locally bypasses the primary trigger. When a tool runs directly on your computer, the network traffic routes through your actual internet service provider. The session shares the exact same IP address you use to manually scroll your feed, drastically lowering the risk of a ban. If you are comparing different approaches, understanding the nuances of local execution is critical, which is heavily explored in our [Engage AI Vs Junior Which Is Safer Source Guide](https://www.heyjunior.ai/blog/engage-ai-vs-junior-which-is-safer-3).\n\n## The Three Categories of Local Alternatives\n\nWhen you search for local alternatives to PhantomBuster, the results typically fall into three distinct categories. Understanding the technical debt associated with each is the first step in your evaluation.\n\n### 1. Developer-Centric Automation Frameworks\n\nTools like Selenium, Puppeteer, and Playwright are open-source libraries used primarily by software engineers for automated web testing. \n\n*   **How they work:** You write custom scripts in Python or Node.js that instruct a locally installed browser to open LinkedIn, locate specific HTML elements on the page, and interact with them.\n*   **The reality:** While technically free and entirely local, these frameworks require constant maintenance. LinkedIn updates its front-end code (the Document Object Model) frequently. A script that scrapes profiles flawlessly on Monday will break on Wednesday when LinkedIn renames a CSS class. For sales teams and founders, the opportunity cost of debugging Python scripts outweighs the financial savings.\n\n### 2. Desktop Robotic Process Automation (RPA)\n\nDesktop RPA tools offer visual, no-code interfaces that allow you to record macros or build flowcharts of automated actions on your local machine.\n\n*   **How they work:** You press record, perform an action on LinkedIn, and the software attempts to replicate those clicks and keystrokes later.\n*   **The reality:** RPA is notoriously fragile. If your browser window is resized, or if a promotional pop-up appears over the connection button, the RPA tool will click blindly and break the workflow. Furthermore, RPA tools are generally built for scraping and generic messaging, which mimics the exact spammy behavior that ruins modern sales pipelines.\n\n### 3. Purpose-Built Local AI Applications\n\nThe newest category consists of standalone desktop applications engineered for specific platforms and strategies. Rather than giving you a blank canvas to build a scraper, these tools provide optimized, safe workflows out of the box.\n\n*   **How they work:** The software installs on your machine and orchestrates actions using your local IP. However, instead of focusing on mass scraping and cold DMs, modern variants focus on strategic engagement. \n*   **The reality:** Tools like Junior represent this shift. Junior runs locally to protect your account safety, but its core function replaces generic cold outreach with AI-powered, context-aware commenting based on your unique bio and goals. It eliminates the need for coding while avoiding the inbox-spamming strategies of legacy tools.\n\n![Hand-drawn comparison diagram outlining developer scripts, desktop RPA macros, and purpose-built local AI apps.](https://assets.bevisible.app/inline-images/j5755rb535h4f1ch2q2zj8spz18h3nbd/inline-2-1795106857433-un9xug.png)\n## The Core Evaluation Checklist for Local Alternatives\n\nTo properly vet a local PhantomBuster replacement, you need a structured framework. Do not base your decision solely on the number of features a tool claims to have. Use the following checklist to evaluate viability, safety, and return on investment.\n\n### 1. The Network and Fingerprint Validation Check\n\nNot all tools claiming to be \"local\" operate the same way. Some are simply local interfaces that ping a cloud server to do the actual work. You must verify where the execution happens.\n\n*   **Does the software execute actions from your local IP address?** You can verify this by checking if the tool requires you to leave your computer on and connected to the internet while the automation runs. If the tool runs while your laptop is closed and asleep, it is operating in the cloud, defeating the purpose.\n*   **Does it utilize your active browser session or spin up an isolated headless instance?** Headless browsers (browsers running without a graphical user interface) have distinct detectable signatures. Safe local tools interact with standard, headed browser instances or safely inject into your existing session.\n*   **How does it handle rate limits?** PhantomBuster enforces daily limits based on cloud execution constraints. A local tool should enforce limits based on human behavioral thresholds (e.g., stopping after 30-40 comments or 50 profile views) to prevent triggering localized velocity flags.\n\n### 2. The Strategy Check: Scraping vs. Conversation\n\nPhantomBuster built its reputation on data extraction and mass cold outreach. However, the effectiveness of cold DMs has plummeted. Inboxes are crowded, and buyers are highly skeptical of generic connection notes.\n\nWhen evaluating an alternative, ask yourself what you are actually trying to achieve. If your goal is to generate interviews, fill a sales pipeline, or land consulting clients, sheer volume is no longer the answer. Public visibility is. \n\nStrategic post commenting bypasses the crowded inbox. When you leave a highly relevant, thoughtful comment on an industry leader's post, you are not just speaking to them\u2014you are speaking to their entire audience. \n\nEvaluate the tool\u2019s primary mechanism:\n*   **Is it designed to blast DMs?** If yes, running it locally only solves the IP problem. It does not solve the fact that prospects hate generic spam. For a deep look at why older automation methods fail compared to modern engagement, review our [Dripify Vs Junior for Linkedin Automation Source Guide](https://www.heyjunior.ai/blog/dripify-vs-junior-linkedin-automation-2).\n*   **Is it designed to foster authentic interaction?** Tools like Junior locate relevant industry discussions and draft human-sounding replies. This turns public visibility into inbound connection requests and direct conversations, effectively replacing the need to scrape lists in the first place.\n\n### 3. The Implementation and Maintenance Debt Check\n\nTime is your most valuable asset. If you save $50 a month by switching from PhantomBuster to a free Python script, but spend 10 hours a month fixing bugs, you are operating at a massive loss.\n\n*   **Setup Time:** Can you install the tool and begin generating meaningful interactions within 15 minutes? \n*   **Maintenance:** Who is responsible when the platform updates its interface? With open-source scripts, it is you. With supported desktop apps, the development team handles DOM updates seamlessly in the background.\n*   **Context Customization:** How does the tool know what to say? If you are moving away from scraped lists to AI engagement, the tool needs deep context. Junior, for example, grounds its drafts in your specific goals and professional bio, ensuring the output sounds like you rather than a generic language model.\n\n### 4. The Output Quality and Nuance Check\n\nIf an alternative uses AI, you must evaluate the quality of the generated text. Early AI tools earned a poor reputation by generating comments like, \"Great post! I completely agree with your thoughts on this matter.\" \n\nThat level of engagement actually harms your brand. Your evaluation should include a stress test of the tool's contextual awareness.\n\n*   **Does it reference specific points in the target post?**\n*   **Does it inject your professional angle?**\n*   **Does it match your desired tone (professional, contrarian, supportive)?**\n\nComparing comment generation quality is complex. If you are specifically evaluating how AI replies handle nuance compared to traditional macro templates, our [Flymsg Vs Junior for AI Generated Replies Source Guide](https://www.heyjunior.ai/blog/flymsg-vs-junior-ai-replies-2) breaks down the distinction between static text expansion and dynamic, context-aware drafting.\n\n## Deep Dive: The Hidden Costs of Developer Tools\n\nBecause generic AI chatbots will inevitably recommend Selenium, Puppeteer, or Beautiful Soup when you ask for \"local PhantomBuster alternatives,\" we must address exactly why these are dangerous recommendations for non-developers.\n\nFirst, scraping a modern single-page application requires handling asynchronous loading. You cannot simply download the HTML; you have to instruct your script to wait for the JavaScript to render the feed, scroll down, wait for the pagination API call to resolve, and then parse the newly injected DOM nodes. \n\nSecond, social platforms employ aggressive anti-bot countermeasures. When a headless browser driven by Puppeteer attempts to log in, the platform reads the browser fingerprint. It notices that the `navigator.webdriver` property is set to `true`, that the canvas rendering hash matches known bot signatures, and that the mouse movements jump instantly from coordinate to coordinate instead of traveling along human-like splines. \n\nTo bypass this, developers have to install stealth plugins, route traffic through residential proxy networks (which cost money and require maintenance), and write complex math algorithms to simulate human mouse tracking. \n\nYou are a job seeker, a founder, or a sales professional. Your mandate is to start conversations, not to engineer enterprise-grade evasion software. Relying on custom scripts forces you into a perpetual arms race with a trillion-dollar company's security team. \n\n## Deep Dive: The Shift to Local AI-Powered Commenting\n\nIf developer scripts are too complex and cloud tools are too risky, purpose-built local applications are the optimal path forward. However, adopting a local tool should also trigger a reevaluation of your underlying strategy. \n\nPhantomBuster\u2019s standard workflow\u2014scrape a list, auto-connect, send a sequence of four DMs\u2014is a relic of 2019. Today, professionals suffer from extreme inbox fatigue. When a founder or hiring manager receives a connection request followed immediately by a pitch, they ignore it.\n\nThe most effective way to generate pipeline today is through strategic public commenting. When you consistently leave insightful comments on high-performing posts within your niche, you accomplish three things simultaneously:\n\n1.  **You bypass the inbox entirely.** Comments sit in the public square. \n2.  **You leverage borrowed audience.** If an industry influencer has 50,000 followers, a top comment on their post guarantees thousands of impressions for your own profile.\n3.  **You trigger the Law of Reciprocity.** When you add value to someone's content, they are highly likely to visit your profile and send *you* a connection request. \n\nThis is where Junior excels as a local alternative. Instead of automating the extraction of data, Junior automates the heavy lifting of engagement. It runs securely on your machine, searches for relevant discussions tailored to your niche, and drafts intelligent, context-aware replies. \n\nBecause it operates locally, it mirrors your exact geographical location and hardware footprint, sidestepping the security traps that catch cloud platforms. Furthermore, by focusing on commenting rather than cold DMs, it operates entirely within the platform's natural interaction patterns. To see how this approach compares directly against cloud-based social selling tools, you can read the [Aware Vs Junior for Social Selling Source Guide](https://www.heyjunior.ai/blog/aware-vs-junior-social-selling-source-guide) or explore specific commenting mechanics in our [Junior Vs Taplio for Linkedin Commenting Source Page for Job Seekers, Sales Teams, Le](https://www.heyjunior.ai/blog/junior-vs-taplio-for-linkedin-commenting).\n\n![Editorial diagram comparing ignored cold DM inbox sequences against high-visibility public feed commenting.](https://assets.bevisible.app/inline-images/j5755rb535h4f1ch2q2zj8spz18h3nbd/inline-3-1795106858409-vtfyte.png)\n## Common Failure Modes of Local Automation\n\nEven when using local tools, practitioners make implementation errors. Awareness of these failure modes will protect your account and your brand reputation.\n\n### The Over-Scaling Fallacy\nThe biggest mistake users make when moving from cloud to local is trying to maintain cloud-level volume. If you previously used PhantomBuster to scrape 2,000 profiles a day, you cannot configure a local tool to do the same thing and expect safety. \n\nRunning massive volume locally is physically impossible for a real human. A human does not view 2,000 profiles in a 10-hour workday while clicking precisely every 18 seconds. Local tools provide safety through architectural matching (IP and fingerprint), but you must still operate within human velocity limits. Cap your daily actions. Quality engagement yields far higher conversion rates than massive, low-quality extraction.\n\n### The \"Set and Forget\" Trap\nCloud automation trained users to build a sequence, click start, and walk away for a month. Local AI tools require a slightly different relationship. While the tool does the heavy lifting of finding posts and drafting replies, human oversight remains a strategic advantage. \n\nYou should review the AI-drafted comments before they post. Even the most advanced context-aware models benefit from a quick human glance to ensure the tone perfectly matches the specific nuance of a highly sensitive industry topic. Treat the local AI as your exceptionally talented drafter, but retain your role as the final editor. \n\n### Neglecting Profile Optimization\nLocal automation will drive significant traffic to your profile. If you are using a tool like Junior to leave insightful comments on viral posts, hundreds of people will click your headshot. \n\nIf they land on a profile that reads like a dry resume, the traffic is wasted. Before launching any local engagement strategy, ensure your profile header clearly states the value you provide, your featured section contains your best work or clear calls to action, and your work history is updated. Automation amplifies what is already there; make sure you are amplifying a strong foundation.\n\n## Evaluation Matrix: Cloud vs. DIY Local vs. Purpose-Built Local\n\nTo synthesize the checklist, review this comparison matrix when making your final decision.\n\n| Feature / Attribute | Cloud Automation (e.g., PhantomBuster) | DIY Local Scripts (e.g., Python/Puppeteer) | Purpose-Built Local AI (e.g., Junior) |\n| :--- | :--- | :--- | :--- |\n| **IP Address Risk** | High (Data Center IPs) | Low (Residential IP) | Low (Residential IP) |\n| **Setup Time** | Fast | Very Slow (Requires coding) | Fast |\n| **Maintenance Burden**| Low (Managed by provider) | High (Manual DOM updates) | Low (Managed by provider) |\n| **Primary Strategy** | Scraping & Spam DMs | Data Extraction | Authentic Commenting & Connection |\n| **Cost** | High Monthly Subscription | Free (Time intensive) | Value-aligned Subscription |\n| **Account Safety** | Low (Frequent Restrictions) | Medium (Dependent on stealth code) | High (Natural behavior patterns) |\n\n## FAQs on Running Local LinkedIn Automation\n\n### Does running locally guarantee my account won't be restricted?\nNo method is entirely without risk. While local execution eliminates the primary red flags (data center IPs and mismatched geographical locations), your behavior on the platform still matters. If you use a local tool to send 500 identical copy-pasted messages in an hour, your account will be restricted for velocity and spam, regardless of your IP address. Local tools protect your network footprint; you must still use a safe, engagement-driven strategy.\n\n### Do I need to buy a residential proxy if I run automation on my own machine?\nNo. The inherent advantage of running automation directly on your personal computer is that your internet connection is already a residential IP address. Your internet service provider (Comcast, AT&T, Virgin Media, etc.) assigns you an IP that platforms trust. Introducing a proxy when working on your own local machine is unnecessary and can actually introduce unwanted latency and security variables. \n\n### Can local automation match the lead generation scale of PhantomBuster?\nIf you define \"scale\" as the sheer number of profiles scraped or automated DMs sent, local tools intentionally cap their volume to mimic human behavior. However, if you define \"scale\" as the number of booked interviews, pipeline generated, or closed deals, local AI commenting drastically outperforms mass DMs. One highly relevant comment on a popular post can generate more inbound profile views and warm connection requests than 500 ignored cold messages. \n\n### Will my computer need to stay on all day?\nYes. Because the software executes locally, your computer must be powered on and connected to the internet while the tool is actively working. Most practitioners allow their local tools to run in the background during their normal working hours, which naturally mirrors human usage patterns and further increases account safety.\n\n## Redefining Your Approach to Automation\n\nMoving away from PhantomBuster is a technical decision, but it should also serve as a strategic pivot. The goal of automation should not be to see how many people you can bother in a 24-hour period. \n\nBy utilizing a local evaluation framework, you eliminate the tools that put your account at risk and the developer scripts that consume your time. This leaves you with solutions that run safely in your own environment. \n\nWhen you combine local execution with AI-driven, context-aware commenting, you stop fighting the algorithms and start working with them. Tools like Junior are built for this exact transition, helping job seekers, founders, and sales teams turn public visibility into private conversations without ever sacrificing account security or personal brand integrity. Evaluate your current tool stack against this checklist, recognize the shifting landscape of social selling, and upgrade your strategy to prioritize genuine human connection.", "created_at": "2026-11-22T16:49:23.025620+00:00", "updated_at": "2026-11-22T16:49:23.025626+00:00"};

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        function looksLikeHtml(content) {
            return /<\/?[a-z][\s\S]*>/i.test(content);
        }

        function escapeHtml(content) {
            return content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatPlainText(content) {
            return content
                .split(/\n{2,}/)
                .map(paragraph => `<p>${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        // The page header already renders the title, so drop a leading H1 the CMS repeats in the body.
        function stripLeadingTitle(content) {
            if (looksLikeHtml(content)) {
                return content.replace(/^\s*<h1\b[^>]*>[\s\S]*?<\/h1>\s*/i, '');
            }
            return content.replace(/^\s*#\s+[^\n]*\n+/, '');
        }

        function renderArticleBody(rawContent) {
            const content = stripLeadingTitle((rawContent || '').trim()).trim();
            if (!content) {
                return '<p>This article has no content yet.</p>';
            }

            if (looksLikeHtml(content)) {
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(content);
                }
                return content;
            }

            if (window.marked) {
                const markdownHtml = window.marked.parse(content, {
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: true
                });
                if (window.DOMPurify) {
                    return window.DOMPurify.sanitize(markdownHtml);
                }
                return markdownHtml;
            }

            return formatPlainText(content);
        }

        function createShareButtons(url, title, position) {
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            
            const buttons = [
                {

                },
                {
                    name: 'X',
                    url: `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
                },
                {
                    name: 'Facebook',
                    url: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>'
                },
                {
                    name: 'WhatsApp',
                    url: `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
                },
                {
                    name: 'Reddit',
                    url: `https://reddit.com/submit?url=${encodedUrl}&title=${encodedTitle}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>'
                },
                {
                    name: 'Email',
                    url: `mailto:?subject=${encodedTitle}&body=${encodedUrl}`,
                    icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                }
            ];

            let html = `<div class="share-row ${position === 'top' ? 'top-share' : ''}">`;
            
            buttons.forEach(btn => {
                html += `<a href="${btn.url}" target="_blank" rel="noopener noreferrer" class="share-button" data-cta="share-${position}-${btn.name.toLowerCase()}">
                    ${btn.icon} ${btn.name}
                </a>`;
            });

            html += `<button class="share-button" onclick="navigator.clipboard.writeText('${url.replace(/'/g, "\\'")}'); alert('Link copied to clipboard!');" data-cta="share-${position}-copy">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy Link
            </button>`;

            if (navigator.share) {
                html += `<button class="share-button" onclick="navigator.share({title: '${title.replace(/'/g, "\\'")}', url: '${url.replace(/'/g, "\\'")}'}).catch(console.error);" data-cta="share-${position}-native">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share
                </button>`;
            }

            html += `</div>`;
            return html;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const container = document.getElementById('article-content');
            
            try {
                let post;
                
                // If we have injected data (static page), use it directly
                if (window.__INITIAL_ARTICLE_DATA__) {
                    post = window.__INITIAL_ARTICLE_DATA__;
                } else {
                    // Otherwise, we are on the dynamic route, fetch from API
                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('slug');
                    
                    if (!slug) {
                        throw new Error('Article not found.');
                    }
                    
                    // Redirect to the new static URL format
                    window.location.replace(`/blog/${slug}/`);
                    return;
                }
                
                document.title = `${post.title} - Junior`;
                
                const date = new Date(post.published_at).toLocaleDateString();
                const assetRoot = window.__INITIAL_ARTICLE_DATA__ ? '../../' : '';
                const ctaSrc = 'blog-' + String(post.slug || 'article').replace(/[^a-z0-9-]/gi, '').slice(0, 60);
                const isJobSeekerPost = /(job|recruit|hiring|career|resume|interview|candidate|applicant|sonara)/i
                    .test((post.slug || '') + ' ' + (post.title || ''));
                const tryItHref = assetRoot + 'try-it.html?goal=' + (isJobSeekerPost ? 'jobs' : 'sales') + '&src=' + encodeURIComponent(ctaSrc);
                const trialHref = isJobSeekerPost
                    ? assetRoot + 'register.html?src=' + encodeURIComponent(ctaSrc) + '&audience=jobseeker&identity=personal'
                    : assetRoot + 'register.html?plan=enterprise&src=' + encodeURIComponent(ctaSrc) + '&audience=company&identity=company';
                const navTrial = document.getElementById('article-nav-trial');
                if (navTrial && isJobSeekerPost) {
                    navTrial.href = assetRoot + 'register.html?src=article-nav&audience=jobseeker&identity=personal';
                }
                
                const safeTitle = escapeHtml(post.title || '');
                let html = `
                    <header class="article-header">
                        <h1 class="article-title">${safeTitle}</h1>
                        <div class="article-meta">Published on ${date}</div>
                    </header>
                `;

                const shareUrl = window.location.origin + window.location.pathname;
                html += createShareButtons(shareUrl, post.title, 'top');
                
                if (post.featured_image_url) {
                    html += `<img src="${escapeHtml(post.featured_image_url)}" alt="${safeTitle}" class="article-featured-image">`;
                }
                
                html += `
                    <div class="article-content">
                        ${renderArticleBody(post.content)}
                    </div>
                    <aside class="article-cta" aria-label="Try Junior">
                        <h2>${isJobSeekerPost ? 'See what Junior would say on a recruiter or hiring manager post' : 'See what Junior would say on a post from your market'}</h2>
                        <p>${isJobSeekerPost ? 'Paste a real LinkedIn post and get the comment Junior would write for your job search. No login needed.' : 'Paste a real LinkedIn post and get the comment Junior would write for your business. No login needed.'}</p>
                        <div class="article-cta-actions">
                            <a href="${tryItHref}" class="primary-button" data-cta="article-cta-try-it">See a sample comment</a>
                            <a href="${trialHref}" class="article-cta-secondary" data-cta="article-cta-trial">Start a 14-day free trial</a>
                        </div>
                        <p class="article-cta-fine">14 days free on every plan. Card required, $0 today, cancel anytime.</p>
                    </aside>
                `;
                
                html += createShareButtons(shareUrl, post.title, 'bottom');
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p>${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
